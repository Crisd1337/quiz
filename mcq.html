 their colour and primary source of energy, revealing their white skeletons; if high temperatures persist for too long, corals will die.", "source": "Yearly Study Guide 2026 · Geography Section II(ocean temperature and coral bleaching)", "id": "geo-007", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "King Lear · Plot", "difficulty": "easy", "type": "mcq", "stem": "What word does Cordelia use when asked to declare her love, which triggers Lear's rage?", "options": ["Nothing", "Everything", "Half", "Love"], "answer": 0, "explanation_en": "Cordelia replies 'Nothing', refusing to use flattery to gain land, and Lear mistakes her honesty for denial, stripping her of her inheritance.", "source": "Yearly Study Guide 2026 · English", "id": "eng-002", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "car-003", "topic": "Australian pathways · SBAT", "difficulty": "medium", "type": "mcq", "stem": "In this course's careers resource list, 'SBAT in NSW' refers to:", "options": ["School Based Apprenticeships and Traineeships", "An online platform for sitting the HSC exams", "A scholarship program for elite athletes only", "A university early entry scheme for Year 10 students"], "answer": 0, "explanation_en": "SBAT stands for School Based Apprenticeships and Traineeships: an in-school pathway in which students finish their secondary education while completing paid industry training. It is not a scholarship, an online exam platform or an early entry scheme.", "source": "Careers Education 2022(CAREER RESOURCES: SBAT in NSW)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "sport-004", "topic": "Sport safety · Protective equipment", "difficulty": "easy", "type": "mcq", "stem": "According to the Sydney North rugby league permission note, which piece of protective equipment is mandatory in all games and training sessions?", "options": ["Knee strapping on both legs", "A padded scrum cap for the head", "A correctly fitted mouthguard", "Shin pads worn under the socks"], "answer": 2, "explanation_en": "The consent form states explicitly that 'wearing suitable mouthguards in all games and training is compulsory', to reduce teeth and facial injuries. Shin pads and knee strapping are not compulsory equipment in this sport.", "source": "Rugby_League_Trials_permission_note.docx", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "engother-012", "topic": "Reading paper · Text types", "difficulty": "easy", "type": "mcq", "stem": "In the Term 3 Reading Section (15 marks), which texts are you asked to analyse?", "options": ["Shakespearean soliloquies and Romantic poetry", "Australian newspaper editorials and film reviews", "Historical images, protest poetry and speech extracts", "Novel chapters and wartime diary entries"], "answer": 2, "explanation_en": "The material lists three text types: historical images, protest and civil rights poetry, and excerpts from the speeches of civil rights figures. Each needs its own analytical terms, so practise them separately.", "source": "Term 3 · Reading Section (15 marks) — task outline (10ENGA)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "his-004", "topic": "Terms · Collective security", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines collective security?", "options": ["States agree that an attack on one member is an attack on all", "Each state builds enough weapons to deter rivals without any allies", "A powerful state intervenes inside another to stop human rights abuses", "A single state decides when and where military force will be used"], "answer": 0, "explanation_en": "Collective security rests on the principle that an attack on one country is an attack on all, with members responding together, usually through the United Nations. Self-deterrence, humanitarian intervention and unilateral decision-making are different concepts.", "source": "Term 4 · Yearly Assessment Notification — Section One(Collective Security)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "hisother-007", "topic": "Cold War · Marshall Plan and NATO", "difficulty": "medium", "type": "mcq", "stem": "Which pairing correctly matches the two containment instruments taught in Lesson 2.3?", "options": ["Marshall Plan — cultural exchange; NATO — trade agreement", "Marshall Plan — military alliance; NATO — economic aid program", "Marshall Plan — economic aid; NATO — collective security alliance", "Marshall Plan — covert CIA action; NATO — nuclear sharing"], "answer": 2, "explanation_en": "The Marshall Plan used economic aid to rebuild Western Europe and reduce the appeal of communism, while NATO (1949) was a collective security alliance. Together they formed the containment system in Europe.", "source": "Term 2 · Lesson 2.3 The Policy of Containment in Europe — Marshall Plan & NATO", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "matp-023", "topic": "Trigonometry · Tangent ratio", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle an angle is 35° and the side adjacent to it is 12 m. Find the length of the opposite side, correct to two decimal places.", "options": ["6.88 m", "14.65 m", "8.40 m", "17.14 m"], "answer": 2, "explanation_en": "tan 35° = opposite side/adjacent side, so the opposite side is 12 × tan 35° ≈ 8.40 m, not 6.88 m or 17.14 m.", "source": "Topic 3 Trigonometry.pdf · 8-03 Finding an unknown side", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-001", "topic": "Finance · Overtime pay", "difficulty": "easy", "type": "mcq", "stem": "Tomas earns $28 per hour for the first 38 hours he works each week. Any hours beyond 38 are paid at time-and-a-half. Last week he worked 45 hours. What was his total pay for the week?", "options": ["$1,456", "$1,260", "$1,358", "$1,890"], "answer": 2, "explanation_en": "For the first 38 hours, 38×$28=$1,064, and for the 7 overtime hours (45−38=7), the pay is $42 per hour, so 7×$42=$294, for a total of $1,358; common mistakes include calculating the total as $1,260 using only the basic hourly rate for 45 hours, or $1,456 using double the hourly rate for overtime.", "source": "Topic1 Interest and Depreciation.pdf · 1-01 Earning an income", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sport-006", "topic": "Competition rules · Cross-country progression", "difficulty": "medium", "type": "mcq", "stem": "To qualify for the Zone cross country team, a runner must:", "options": ["Be selected by the sports captain", "Finish in the top two of their age group", "Complete the course under 15 minutes", "Finish in the top ten of their age group"], "answer": 3, "explanation_en": "Cross-country takes the top ten in each age group into the Zone team, a much wider threshold than the top two for athletics. These two numbers are the pair an exam question is most likely to trip you up on.", "source": "School XC Program 2025 - amended.docx(Guidelines — To qualify for Zone)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "matp-028", "topic": "Area · Composite shapes", "difficulty": "medium", "type": "mcq", "stem": "A shape is made by attaching a semicircle of radius 4 cm to one side of a rectangle measuring 12 cm by 8 cm. Find the total area, correct to one decimal place.", "options": ["146.3 cm²", "121.1 cm²", "108.6 cm²", "96.0 cm²"], "answer": 1, "explanation_en": "The rectangle is 12 × 8 = 96 cm², the semicircle is ½ × π × 4² = 8π ≈ 25.13 cm², for a total of ≈ 121.1 cm². Forgetting to halve it results in 146.3, and only calculating a quarter circle results in 108.6.", "source": "Topic3 Surface area and Volume.pdf · 3-01 Areas of composite shapes", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sport-008", "topic": "Competition rules · Swimming progression scenarios", "difficulty": "medium", "type": "mcq", "stem": "A boy finishes third in the 50 m freestyle in his age group at the school swimming carnival. Which statement is correct?", "options": ["He misses Zone in that event but may still make the age relay as a fastest four", "He must swim a final race against the other placegetters to decide the result", "He automatically becomes age champion because he finished in the top three", "He qualifies for the Zone carnival because the top three in each event go through"], "answer": 0, "explanation_en": "In the 50 m freestyle only the top two go through to Zone, so third place misses out on that event; but 'the top four in each age group for 50 m freestyle will form an age relay team', so the third-placed swimmer can still be picked for the relay. All events are also ranked on time, with no finals.", "source": "Swimming Carnival Program 2020 (3).pdf(Zone qualifiers / Age Relay Team)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "geoother-010", "topic": "Climate change · Enhanced greenhouse effect", "difficulty": "medium", "type": "mcq", "stem": "How does the enhanced greenhouse effect differ from the natural greenhouse effect?", "options": ["Human greenhouse gas emissions trap more infrared radiation, adding to warming", "The natural effect involves only incoming solar radiation, with no re-emission of heat", "The enhanced effect is caused by more solar radiation reaching Earth", "Human activity has removed the natural effect, so less heat is trapped"], "answer": 0, "explanation_en": "The natural greenhouse effect makes the Earth habitable; the extra greenhouse gases released by human activity strengthen it, so more infrared radiation is absorbed and re-radiated back to the surface. Telling the two apart is a common exam point.", "source": "Term 4 · Lesson 2.2 What are the causes of climate change? (Part 1)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "car-014", "topic": "Australian pathways · Tax File Number", "difficulty": "medium", "type": "mcq", "stem": "Why does a student need a Tax File Number (TFN) when starting a job?", "options": ["It sets the hourly pay rate your employer must pay you", "It replaces a passport when travelling overseas", "The employer uses it so your pay and tax are recorded correctly", "It is the same number as your USI and MyGov password"], "answer": 2, "explanation_en": "A TFN is a tax file number, and employers need it to deduct tax at the correct rate; without one you are taxed at the highest rate. Your hourly pay rate, by contrast, is set by an award or a contract, not by your TFN.", "source": "Week Eight- Creating a USI, TFN & MyGov account", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "matp-004", "topic": "Algebra · Index laws", "difficulty": "easy", "type": "mcq", "stem": "Simplify (3a⁴)².", "options": ["9a⁸", "6a⁸", "6a⁶", "9a⁶"], "answer": 0, "explanation_en": "Each term inside the brackets is squared: 3² = 9, and the indices multiply, 4×2 = 8, so the answer is 9a⁸. The two most common mistakes are writing the coefficient 3 as 6, or working out 4×2 as 6.", "source": "Algebra Topic test + Solutions.pdf · Part A Q12 · 4-01_ Index Laws", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sciother-001", "topic": "Earth's energy · Solar radiation", "difficulty": "easy", "type": "mcq", "stem": "Which two types of solar radiation reach the surface of the Earth and act as the main driving force for Earth's processes?", "options": ["Visible light and infrared", "Visible light and X-rays", "Microwaves and infrared", "Microwaves and X-rays"], "answer": 0, "explanation_en": "The main drivers of Earth's processes that reach the surface are visible light and infrared radiation: visible light provides energy for photosynthesis, and infrared radiation heats the hydrosphere, driving the water cycle. X-rays and microwaves are mostly absorbed by the atmosphere and do not reach the surface.", "source": "Term 1 · Earth's Energy – Earth.pdf(Topic 6 Earth · Solar radiation)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "his-002", "topic": "Terms · Multilateral action", "difficulty": "easy", "type": "mcq", "stem": "Which action is the clearest example of multilateral action?", "options": ["Two neighbouring states signing a border and trade agreement", "A coalition of states acting together under UN Security Council authorisation", "One state threatening to act alone unless its allies fall into line", "One state acting alone without notifying any other government"], "answer": 1, "explanation_en": "Multilateral refers to actions involving multiple countries, usually coordinated through international institutions, with the key phrase being 'multiple countries + authorisation'; 'One state acting alone without notifying any other government' and 'One state threatening to act alone unless its allies fall into line' are unilateral, while 'Two neighbouring states signing a border and trade agreement' is bilateral, not multilateral.", "source": "Term 4 · Yearly Assessment Notification — Section One(Multilateral)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "pdh-007", "topic": "Driving · BAC limits", "difficulty": "easy", "type": "mcq", "stem": "What are the legal blood alcohol concentration (BAC) limits in NSW for a learner, a provisional and a full licence holder?", "options": ["0.02 for learner, 0.02 for provisional, 0.05 for full", "0.00 for learner, 0.05 for provisional, 0.05 for full", "0.00 for learner, 0.00 for provisional, 0.05 for full", "0.05 for learner, 0.05 for provisional, 0.05 for full"], "answer": 2, "explanation_en": "Marks are awarded for filling in three blanks (1 mark each): Learner 0.00, Provisional 0.00 and Full 0.05. The most common mistake is writing 0.05 for a P-plate; in NSW both P-plate and L-plate drivers must be at zero, and only a full licence has a 0.05 limit.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · BAC (values per NSW legal standard; syllabus supplement)", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"topic": "Networks · Shortest path", "difficulty": "medium", "type": "mcq", "stem": "Using the network in which AB = 2, BC = 3, AC = 5, BD = 4 and CD = 1 (all in km), what is the shortest distance from A to D?", "options": ["6 km", "9 km", "5 km", "7 km"], "answer": 0, "explanation_en": "All routes go through C or B: A→B→D=6, A→B→C→D=6, A→C→D=6, and the shortest is 6 km, so the answer is 6 km.", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard(Shortest path)", "id": "matp-048", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-024", "topic": "Trigonometry · Finding an unknown angle", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle, sin θ = 7/12. Find θ, correct to one decimal place.", "options": ["60.0°", "54.3°", "35.7°", "30.3°"], "answer": 2, "explanation_en": "θ = sin⁻¹(7/12) ≈ 35.7°, not 30.3° or 54.3°.", "source": "Topic 3 Trigonometry.pdf · 8-04 Finding an unknown angle", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sport-009", "topic": "Fitness training · Progressive overload", "difficulty": "medium", "type": "mcq", "stem": "The Wednesday Sport program only increases the running load slightly each week (for example walk 5 / jog 0, then jog 1 / walk 4, then jog 3 / walk 2). Why does it progress this way?", "options": ["Because running over five minutes is unsafe for teenagers", "Because the teacher does not want students improving too quickly", "So that everyone finishes the session at exactly the same time", "So students can overload gradually and avoid injury"], "answer": 3, "explanation_en": "This is the principle of progressive overload: increase the load only a little at a time so that the body can adapt, avoiding sudden jumps that cause muscle soreness and injury. The course notes put it as 'no sudden increase in volume or intensity'.", "source": "Wednesday sport Remote Learning Week 4 / Week 5", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "pdh-022", "topic": "Road safety · Blind distance when distracted", "difficulty": "easy", "type": "mcq", "stem": "At 60 km/h, how far does a car travel in the two seconds a driver's eyes are off the road?", "options": ["About 60 m", "About 33 m", "About 17 m", "About 120 m"], "answer": 1, "explanation_en": "Marks are awarded for the working: 60 ÷ 3.6 = 16.7 m/s, then × 2 seconds ≈ 33 m (1 mark).", "source": "Term 1 · Lesson 2–3 · Are you driving blind?", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "matp-022", "topic": "Trigonometry · Pythagoras", "difficulty": "easy", "type": "mcq", "stem": "A right-angled triangle has two shorter sides of 9 cm and 12 cm. Find the length of the hypotenuse.", "options": ["21 cm", "225 cm", "15 cm", "108 cm"], "answer": 2, "explanation_en": "The hypotenuse is √(9² + 12²) = √225 = 15 cm, not 21 cm or 225 cm.", "source": "Topic 3 Trigonometry.pdf · 8-01 Pythagoras' theorem", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sciother-012", "topic": "Motion · Scalars and vectors", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is a vector quantity?", "options": ["Speed", "Displacement", "Distance", "Time"], "answer": 1, "explanation_en": "Displacement has both magnitude and direction, and is a vector; distance, speed, and time have magnitude only, and are scalars.", "source": "Term 1 · Motion – Half Yearly Revision.pdf(Scalar vs Vector)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "hisother-006", "topic": "Cold War · Potsdam Conference", "difficulty": "easy", "type": "mcq", "stem": "Which conference does Lesson 2.1 use as the starting point for explaining how the Cold War began?", "options": ["The Potsdam Conference", "The Yalta Conference", "The Versailles Conference", "The Geneva Conference"], "answer": 0, "explanation_en": "The lesson sets out to understand the Potsdam Conference and its role in creating the Cold War conflict. The Yalta Conference also took place near the end of the war, but the course starts with Potsdam.", "source": "Term 2 · Lesson 2.1 Origins of the Cold War (Potsdam Conference)", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "maths53-002", "topic": "Surds · Adding like surds", "difficulty": "easy", "type": "mcq", "stem": "Simplify √50 + √32 − √18.", "options": ["6√2", "6√6", "4√2", "9√2"], "answer": 0, "explanation_en": "First write each surd in the same radical form: 5√2 + 4√2 − 3√2 = 6√2. A common mistake is to add or subtract the radicands directly (50 + 32 − 18 = 64), which gives 8.", "source": "Chapter 1 Surds · 1.03 Adding and subtracting surds (Ex 1.03, p.11)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "his-008", "topic": "Terms · Humanitarian intervention", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines humanitarian intervention?", "options": ["Defensive action taken after a direct attack on one's own soil", "Military action to seize disputed territory and its natural resources", "Economic sanctions agreed by a regional trade or security organisation", "Military action inside a state, without consent, to stop mass suffering"], "answer": 3, "explanation_en": "Humanitarian intervention has three requirements: entering another country, without their consent, and aiming to stop a large-scale humanitarian disaster, which is different from economic sanctions or self-defence.", "source": "Term 4 · Yearly Assessment Notification — Section One(Humanitarian Intervention)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "car-007", "topic": "Job seeking · Resumes", "difficulty": "easy", "type": "mcq", "stem": "What is the main advice given about writing a resume?", "options": ["Include long, detailed paragraphs about every job you have had", "Use exactly the same resume for your whole working life", "Leave out sporting and academic awards completely", "Be brief and clear so it is quick to read"], "answer": 3, "explanation_en": "The course stresses that a resume should be concise and clear so that it can be read quickly, and that a resume is not static — you update it as you gain experience. Long, detailed paragraphs about every job you have had are better left for the interview.", "source": "Building a resume(What is important on a resume?)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"topic": "Networks · Terminology", "difficulty": "easy", "type": "mcq", "stem": "In a network diagram, the number of edges meeting at a vertex is called its:", "options": ["Weight", "Order", "Degree", "Path"], "answer": 2, "explanation_en": "The number of edges connected to a vertex is called the degree, and the number of vertices with odd degrees determines whether it can be drawn in one stroke: all even → can return to the starting point; exactly two odd → can be drawn in one stroke but with a different ending point.", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard(Networks: terminology)", "id": "matp-044", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"A small network with one vertex marked\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"86.0\" y1=\"92.0\" x2=\"200.0\" y2=\"172.0\" stroke=\"var(--accent)\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"40.0\" x2=\"200.0\" y2=\"172.0\" stroke=\"var(--accent)\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"318.0\" y1=\"86.0\" x2=\"200.0\" y2=\"172.0\" stroke=\"var(--accent)\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"86.0\" y1=\"258.0\" x2=\"200.0\" y2=\"172.0\" stroke=\"var(--accent)\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"86.0\" y1=\"92.0\" x2=\"200.0\" y2=\"40.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"40.0\" x2=\"318.0\" y2=\"86.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"86.0\" y1=\"92.0\" x2=\"86.0\" y2=\"258.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"318.0\" y1=\"86.0\" x2=\"318.0\" y2=\"258.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"86.0\" y1=\"258.0\" x2=\"318.0\" y2=\"258.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"318.0\" y1=\"258.0\" x2=\"424.0\" y2=\"172.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"86.0\" cy=\"92.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"86.0\" y=\"96.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">A</text><circle cx=\"200.0\" cy=\"40.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"200.0\" y=\"44.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B</text><circle cx=\"318.0\" cy=\"86.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"318.0\" y=\"90.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">C</text><circle cx=\"200.0\" cy=\"172.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--accent)\" stroke-width=\"2.8\"/><circle cx=\"200.0\" cy=\"172.0\" r=\"21\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\" opacity=\".8\"/><text x=\"200.0\" y=\"176.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">D</text><circle cx=\"86.0\" cy=\"258.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"86.0\" y=\"262.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">E</text><circle cx=\"318.0\" cy=\"258.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"318.0\" y=\"262.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">F</text><circle cx=\"424.0\" cy=\"172.0\" r=\"15\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"424.0\" y=\"176.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">G</text><text x=\"16.0\" y=\"326.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-sans,sans-serif)\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">Vertex D is highlighted: four edges meet there.</text></svg>", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "car-006", "topic": "Australian pathways · VET", "difficulty": "easy", "type": "mcq", "stem": "Which of these is a vocational education and training (VET) qualification?", "options": ["Bachelor of Science (Physics major)", "Doctorate of Philosophy (PhD)", "Certificate III in Electrotechnology", "Master of Teaching (Secondary)"], "answer": 2, "explanation_en": "Certificate III is a VET qualification usually offered by TAFE or government-recognised private colleges, whereas Bachelor, Master, and PhD are university-level qualifications.", "source": "Week 5 - Levels of education(VET / TAFE)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"topic": "Organic chemistry · Addition polymerisation", "difficulty": "medium", "type": "mcq", "stem": "Polythene (polyethylene) is made from ethene. Which type of reaction produces it?", "options": ["Condensation", "Addition polymerisation", "Substitution", "Fermentation"], "answer": 1, "explanation_en": "The polymerisation of ethene molecules (containing C=C) involves the opening of double bonds to form a long chain, called addition polymerisation, producing polyethylene.", "id": "sci-037", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "out-008", "topic": "Leave No Trace · Durable surfaces", "difficulty": "medium", "type": "mcq", "stem": "Why does Leave No Trace advise walking and camping on durable surfaces?", "options": ["It protects vegetation and reduces soil erosion", "It increases the chance of seeing wildlife up close", "It makes finding the way back much easier", "It keeps hikers' boots and tents cleaner"], "answer": 0, "explanation_en": "The sample answer in the Response Guide states that walking on durable surfaces 'protects vegetation and reduces soil erosion from trampling', because new paths widen over time and can turn into gullies — a common form of long-term damage in camping areas.", "source": "Study Guide · Lesson 5 Leave No Trace · Response Guide", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "eng-028", "topic": "Comparative essay · Technique (prose vs film)", "difficulty": "medium", "type": "mcq", "stem": "Which option states a genuine point of comparison between Lee's novel and Parker's film?", "options": ["Lee controls what Scout notices and when she understands it, while Parker controls what the camera shows and when the viewer sees it.", "Lee's novel has chapters and a narrator, while Parker's film has scenes and actors who speak dialogue.", "Lee's novel is set in the 1930s and Parker's film is set in the 1960s, so the film is more historically accurate than the novel.", "Lee uses words to describe things and Parker uses pictures, which means the film is easier to understand."], "answer": 0, "explanation_en": "Effective comparison focuses on 'how the authors control information and the reader's response': Lee uses Scout's limited perspective to delay understanding, while Parker uses camera angles and editing to control what the audience sees. Saying 'Lee's novel has chapters and a narrator, while Parker's film has scenes and actors' just states the difference in medium, and doesn't constitute a comparison point.", "source": "Section 2 · Comparative essay — comparing literary and film techniques (10ENGA film study: visual storytelling, cinematography, director's purpose)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "out-001", "topic": "Environmental awareness · Biodiversity", "difficulty": "easy", "type": "mcq", "stem": "How is biodiversity defined in this unit?", "options": ["The variety of living organisms present", "The total number of species in a habitat", "The number of endangered species", "The non-living parts of that habitat"], "answer": 0, "explanation_en": "The course defines biodiversity as the 'variety of living organisms', which is not the same as the number of animals in a habitat, or the non-living environment.", "source": "Study Guide · Lesson 1 Introduction to Environmental Awareness", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "cw-010", "topic": "Stress and coping · Pomodoro technique", "difficulty": "medium", "type": "mcq", "stem": "The Study Tips and Tricks page recommends the Pomodoro technique for breaking up study sessions. What does it involve?", "options": ["Study for 5 minutes and rest for 55 minutes.", "Work in 25-minute blocks with short breaks in between.", "Study only in the hour before an exam.", "Study for three hours straight, then take a whole day off."], "answer": 1, "explanation_en": "The Pomodoro Technique works in 25-minute intervals with short breaks in between. The material adds a firm rule: whatever pace you use, do not work for more than an hour without a break, because productivity falls if you push on for too long.", "source": "Study tips and tricks(Take breaks; Pomodoro technique — 25-minute intervals)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "sport-001", "topic": "Sport safety · Warm-up", "difficulty": "easy", "type": "mcq", "stem": "What is the main purpose of a warm-up before a training session or trial?", "options": ["To use up energy so you do not get tired later in the session", "To raise heart rate and muscle temperature and lower injury risk", "To replace the need for a cool-down at the end of the session", "To build muscle size quickly before the session starts"], "answer": 1, "explanation_en": "The point of a warm-up is to raise heart rate, muscle temperature and joint mobility gradually, so that the body is ready for exercise and the risk of a muscle strain is lower. It does not replace a cool-down, and it is not a way of 'using up energy'.", "source": "Bally Volleyball(7:30am warm up before the 8:00am trial)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "matp-013", "topic": "Simultaneous equations · Elimination", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations 5x + 2y = 19 and 3x − 2y = 5.", "options": ["x = 3, y = 2", "x = 4, y = −0.5", "x = 2, y = 3", "x = 3, y = −2"], "answer": 0, "explanation_en": "Adding the two equations eliminates y: 8x = 24, x = 3; substituting back into the first equation gives 2y = 19 − 15 = 4, y = 2. The distractor (4, −0.5) only satisfies the first equation and can be eliminated by substituting into the second.", "source": "Topic 2 Simultaneous Equations.pdf · 9-02 The elimination method", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Organic chemistry · Naming practice", "difficulty": "medium", "type": "mcq", "stem": "The compound CH3–CH2–CH2–OH is named:", "options": ["Propanoic acid", "Propan-1-ol", "Propane", "Propanal"], "answer": 1, "explanation_en": "A three-carbon chain with a hydroxyl group is propan-1-ol; propanoic acid is propionic acid, propanal is propionaldehyde, and propane is an alkane.", "id": "sci-042", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "matp-037", "topic": "Finance · Income tax (19c bracket)", "difficulty": "easy", "type": "mcq", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Calculate the income tax payable on a taxable income of $30,000.", "options": ["$5,700.00", "$3,572.00", "$2,242.00", "$11,800.00"], "answer": 2, "explanation_en": "The $30,000 falls in the 19c bracket: 0.19 × (30,000 − 18,200) = 0.19 × 11,800 = $2,242. The tax-free threshold of $18,200 must be subtracted first; directly using 0.19 × 30,000 results in $5,700, and $11,800 is the result of subtracting the threshold but not multiplying by the tax rate.", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q5a (official answer $2,242) · 1-02_ Income tax.pdf", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sciother-010", "topic": "Genetics · Mendelian ratios", "difficulty": "hard", "type": "mcq", "stem": "Two heterozygous tall pea plants (Tt) are crossed, and tall (T) is dominant over short (t). What fraction of the tall offspring is expected to be heterozygous?", "options": ["1/2", "2/3", "3/4", "1/3"], "answer": 1, "explanation_en": "For Tt × Tt the ratio is 1TT : 2Tt : 1tt, which is 3 : 1 tall to short. Because the question asks for the ratio within the tall plants (3 parts), the heterozygous Tt makes up 2/3 of them.", "source": "Term 1 · Genetics – Half Yearly Revision.pdf (Punnett squares: genotype and phenotype ratios)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "maths53-016", "topic": "Parabolas · Axis and vertex", "difficulty": "medium", "type": "mcq", "stem": "Find the coordinates of the vertex of the parabola y = 3x² − 12x + 7.", "options": ["(2, 5)", "(2, −5)", "(2, 7)", "(−2, −5)"], "answer": 1, "explanation_en": "The axis of symmetry x = −b/(2a) = 12/6 = 2; substitute back y = 3(4) − 24 + 7 = −5, the vertex is (2, −5); don't directly take x=2 as the vertex coordinate.", "source": "Chapter 11 Quadratic equations and the parabola · 11.08 Axis of symmetry and vertex (Ex 11.08)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Parabola y = 3x squared minus 12x plus 7\" preserv e · Greenhouse gases", "difficulty": "easy", "type": "mcq", "stem": "Which group lists only greenhouse gases?", "options": ["Carbon dioxide, methane, water vapour", "Oxygen, carbon dioxide, helium", "Nitrogen, methane, neon", "Oxygen, nitrogen, argon"], "answer": 0, "explanation_en": "Greenhouse gases that absorb and re-emit infrared radiation include CO₂, CH₄, water vapour, N₂O and CFCs. Oxygen and nitrogen make up 99% of the atmosphere, but they do not absorb infrared radiation and are not greenhouse gases.", "source": "Yearly Study Guide 2026 · Geography Section I(terms / metalanguage)", "id": "geo-001", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "car-013", "topic": "Australian pathways · USI", "difficulty": "easy", "type": "mcq", "stem": "What is a Unique Student Identifier (USI)?", "options": ["A national number linking your training records", "The password for the school wireless network", "The number used to calculate a student's ATAR score", "The bank account used to pay school fees"], "answer": 0, "explanation_en": "USI is a national student identifier that links your training and qualifications, distinct from ATAR and TFN.", "source": "Week Eight- Creating a USI, TFN & MyGov account", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "sci-003", "topic": "Evolution · Selection pressure", "difficulty": "hard", "type": "mcq", "stem": "In parts of Australia where cane toads live, the average head size of red-bellied black snakes has become smaller. Which explanation is consistent with natural selection?", "options": ["Head size is not heritable, so this change cannot be evolution by natural selection.", "Snakes that ate toads pulled their heads smaller during their lifetime and passed the smaller heads on to their offspring.", "The toads release a chemical that directly shrinks the heads of the snakes they meet.", "Snakes with larger heads could swallow the bigger, more toxic toads and died, so smaller-headed snakes survived and reproduced."], "explanation_en": "The toad is a selective pressure: snakes with larger heads that swallow larger toads and ingest more toxins die (are eliminated), while individuals with smaller heads or that don't eat toads survive and reproduce, but 'Snakes that ate toads pulled their heads smaller during their lifetime and passed the smaller heads on to their offspring' is an incorrect Lamarckian statement.", "source": "Term 4 - Evolution - Week 3 Answers(Cane toads / red-bellied black snake)", "answer": 3, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sport-012", "topic": "Competition rules · Age championships", "difficulty": "medium", "type": "mcq", "stem": "How is the age champion decided at the swimming carnival?", "options": ["By winning a single 50 m freestyle race on the day", "By the highest aggregate point score across events", "By the fastest 100 m time recorded on the day", "By a vote of all teachers at the end of the carnival"], "answer": 1, "explanation_en": "The age champion is decided by the highest cumulative score across all events, so several placings are worth more than a single win, which earns only one score.", "source": "Swimming Carnival Program 2020 (3).pdf (age champion rules)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "maths53-005", "topic": "Expressions · Binomial expansion", "difficulty": "easy", "type": "mcq", "stem": "Expand and simplify (2x − 3)(x + 5).", "options": ["2x² − 7x − 15", "2x² + 7x + 15", "2x² + 7x − 15", "2x² + 13x − 15"], "answer": 2, "explanation_en": "Expand the four products: 2x·x = 2x², 2x·5 = 10x, −3·x = −3x and −3·5 = −15. Combining the like terms gives 2x² + 7x − 15; do not lose the minus sign on −3×5.", "source": "Chapter 5 Products and factors · 5.06 Expanding binomial products (Ex 5.06)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "sciother-027", "topic": "Climate · Ocean acidification", "difficulty": "hard", "type": "mcq", "stem": "Extra carbon dioxide dissolves in seawater and forms carbonic acid, which releases hydrogen ions. Why does this harm shellfish?", "options": ["The carbonic acid removes calcium from the water so shellfish absorb more carbonate.", "The hydrogen ions dissolve the calcium carbonate shells by raising the pH of the water.", "The hydrogen ions compete with the shells for carbonate ions, so shellfish cannot build their shells.", "The extra carbon dioxide warms the water so the shellfish cannot respire."], "answer": 2, "explanation_en": "An excess of H⁺ ions will combine with carbonate ions to form bicarbonate, competing with shell formation for carbonate ions, making it harder for shells to form.", "source": "Term 3 · Climate Science – Term 3 Earth Week 2 Answers(Ocean Acidification)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "geoother-006", "topic": "Geographical skills · Ternary graphs", "difficulty": "medium", "type": "mcq", "stem": "On a ternary graph, what do the three axes represent?", "options": ["Three separate graphs placed side by side on one page", "Three parts of a whole that add to 100%, read off one point", "Three countries compared by their total population", "Three separate time periods shown along a single horizontal line"], "answer": 1, "explanation_en": "A ternary graph shows the proportions of three components that add to 100%, such as employment structure or soil composition. Each axis gives one component, and the three values must add to 100%.", "source": "Term 2 · Week 10.1 Ternary Graphs", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Ternary graph with three components and an example point read off at 50, 30 and 20 per cent\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"252.0,34.0 430.0,268.0 74.0,268.0\" fill=\"var(--surface)\" fill-opacity=\".55\" stroke=\"var(--b (--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">80</text><text x=\"370.1\" y=\"279.8\"fill=\"var(--success)\" font-size=\"9.5\"font-family=\"var(--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">20</text><text x=\"252.0\" y=\"22.0\"fill=\"var(--accent)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">A  100%</text><text x=\"440.0\" y=\"272.0\"fill=\"var(--warning)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B  100%</text><text x=\"64.0\" y=\"272.0\"fill=\"var(--success)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"text-anchor=\"end\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">C  100%</text><line x1=\"341.0\" y1=\"151.0\" x2=\"163.0\" y2=\"151.0\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" opacity=\".95\"/><line x1=\"305.4\" y1=\"104.2\" x2=\"180.8\" y2=\"268.0\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" opacity=\".95\"/><line x1=\"216.4\" y1=\"80.8\" x2=\"358.8\" y2=\"268.0\" stroke=\"var(--success)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" opacity=\".95\"/><circle cx=\"269.8\" cy=\"151.0\" r=\"5.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.6\"/><text x=\"278.8\" y=\"144.0\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">P</text><line x1=\"84.0\" y1=\"302.0\" x2=\"104.0\" y2=\"302.0\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"110.0\" y=\"306.0\"fill=\"var(--accent)\" font-size=\"11.5\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">A = 50%</text><line x1=\"183.4\" y1=\"302.0\" x2=\"203.4\" y2=\"302.0\" stroke=\"var(--warning)\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"209.4\" y=\"306.0\"fill=\"var(--warning)\" font-size=\"11.5\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B = 30%</text><line x1=\"282.8\" y1=\"302.0\" x2=\"302.8\" y2=\"302.0\" stroke=\"var(--success)\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"308.8\" y=\"306.0\"fill=\"var(--success)\" font-size=\"11.5\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">C = 20%</text><text x=\"260.0\" y=\"328.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">The three shares always add up to 100%.</text></svg>", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "eng-036", "topic": "Writing · Comparative topic sentences", "difficulty": "easy", "type": "mcq", "stem": "Why does a comparative essay need a comparative topic sentence in every body paragraph?", "options": ["Because quotations from two texts must appear in the same sentence for the essay to count.", "Because the introduction cannot mention either text and the body must do it instead.", "Because the argument must run across both texts, so every paragraph has to keep both in view.", "Because the examiner only reads the first sentence of each paragraph when marking the essay."], "answer": 2, "explanation_en": "Comparison essay marks come from 'sustained comparative argument throughout the text', so every paragraph's topic sentence should cover both texts and advance the argument. The other options are incorrect statements about marking or format.", "source": "Writing skills · Comparative topic sentences (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "out-011", "topic": "Indigenous perspectives · Freshwater stream case study", "difficulty": "hard", "type": "mcq", "stem": "The Freshwater Creek case study compares an Indigenous significant site with the effects of Western urbanisation. Which statement BEST describes the difference?", "options": ["Both approaches treated the wetlands mainly as a drinking water source", "Indigenous management drained the wetlands, while urbanisation restored them as parkland", "Indigenous use kept the wetlands alive; urbanisation drained and piped them away", "Indigenous management had little effect because the local clans did not use the wetlands"], "answer": 2, "explanation_en": "The case compares the high spiritual value of the area for the Gayamaygal and Garigal people as a source of drinking water, fishing and camping, to its destruction and conversion into a concrete stormwater drain through urbanisation.", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land · Freshwater Creek Case Study", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "ftn-005", "topic": "Kitchen operations · Mise en place", "difficulty": "easy", "type": "mcq", "stem": "In a commercial kitchen, 'mise en place' refers to:", "options": ["Preparing ingredients and equipment before cooking", "Plating the finished dish neatly for service", "Ordering stock and checking supplier deliveries", "Cleaning down kitchen benches at the end of service"], "answer": 0, "explanation_en": "Mise en place refers to having all ingredients ready, including chopping onions, measuring seasonings, and preheating the oven, as skipping this step can lead to poor workflow.", "source": "Term 1 · Assumed Knowledge Quiz 6: Mise en place; Structured Responses (Sample Answers).pdf — Poor Workflow", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "his-007", "topic": "Terms · Pre-emption vs humanitarian intervention", "difficulty": "medium", "type": "mcq", "stem": "Which feature most clearly separates pre-emption from humanitarian intervention?", "options": ["Pre-emption answers a future threat; intervention answers harm under way", "Pre-emption targets only non-state groups; intervention only states", "Pre-emption always needs UN authorisation; intervention never does", "Pre-emption is always multilateral; intervention is always unilateral in form"], "answer": 0, "explanation_en": "The key distinction lies in the timing of the threat: pre-emption targets threats that have not yet occurred, while humanitarian intervention responds to ongoing large-scale harm.", "source": "Term 4 · Yearly Assessment Notification — Section One(Pre-emption / Humanitarian Intervention)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"topic": "Climate · Feedback · Albedo", "difficulty": "hard", "type": "mcq", "stem": "As sea ice melts, the darker ocean surface absorbs more sunlight, which causes further warming. This is an example of:", "options": ["The greenhouse effect", "A positive feedback loop (albedo effect)", "Ocean acidification", "A negative feedback loop"], "answer": 1, "explanation_en": "High albedo ice reflects sunlight, but when it melts, the exposed dark sea surface absorbs more heat, leading to further warming and ice melting, which is a positive feedback loop.", "source": "Yearly Study Guide 2026 · Geography Section I(critical thinking / climate system)", "id": "geo-012", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "King Lear · Plot", "difficulty": "hard", "type": "mcq", "stem": "How does the play end for Lear and Cordelia?", "options": ["Cordelia is hanged on Edmund's orders and Lear dies of grief with her body", "They rule the kingdom together", "They flee to France and survive", "Lear is killed in battle by Albany"], "answer": 0, "explanation_en": "Edmund orders Cordelia's execution, and by the time Lear arrives it is too late: he dies holding her body. No happy ending restores order; only Albany and Edgar are left to pick up the pieces.", "source": "Yearly Study Guide 2026 · English", "id": "eng-006", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "cw-005", "topic": "Emotional regulation · Box breathing", "difficulty": "easy", "type": "mcq", "stem": "The Anxiety page describes box breathing as a technique for slowing your breathing and calming your body. What is the pattern?", "options": ["Inhale 2, exhale 2, repeated quickly", "Inhale 4, hold 7, exhale 8", "Inhale 10, hold 10, exhale 10", "Inhale 4, hold 4, exhale 4, hold 4"], "answer": 3, "explanation_en": "Box breathing has four stages of 4 seconds each — inhale, hold, exhale, hold — so it is like walking around the four sides of a square. Repeat it at least four times. Do not confuse it with the 4–7–8 technique on the same page, which is used to get to sleep.", "source": "Anxiety (breathing techniques: box breathing and the 4-7-8 technique)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "sciother-013", "topic": "Motion · Acceleration formula", "difficulty": "medium", "type": "mcq", "stem": "A motorcycle travelling at 25 m/s accelerates at 7.0 m/s² for 6.0 s. What is its final speed?", "options": ["175 m/s", "56 m/s", "42 m/s", "67 m/s"], "answer": 3, "explanation_en": "The final velocity is v_f = v_i + at = 25 + 7.0 × 6.0 = 25 + 42 = 67 m/s. The 42 m/s option is only the change in velocity, from forgetting to add the initial velocity, and 175 m/s comes from 25 × 7, the wrong operation.", "source": "Term 1 · Motion – Acceleration Problems (Practice) (Question 10)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-016", "topic": "Chemistry · Acids and metals", "difficulty": "easy", "type": "mcq", "stem": "Magnesium is added to hydrochloric acid and a gas is produced that gives a 'pop' when a lit splint is held to it. Which gas is this?", "options": ["Carbon dioxide", "Chlorine", "Oxygen", "Hydrogen"], "answer": 3, "explanation_en": "Acid + metal gives a salt and hydrogen gas, and the hydrogen can be tested with a lit wooden splint (the pop test). Acid + carbonate gives CO₂, which is tested with limewater.", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 5 Answers(Acid-Metal Reaction)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "matp-007", "topic": "Algebra · Binomial expansion", "difficulty": "medium", "type": "mcq", "stem": "Expand and simplify (2x − 5)(3x + 7).", "options": ["6x² + x − 35", "6x² − x − 35", "6x² − 29x − 35", "6x² + 21x − 35"], "answer": 1, "explanation_en": "Multiplying each term gives 6x² + 14x − 15x − 35 = 6x² − x − 35. The middle terms 14x − 15x = −x; if −15x is written as +15x, it results in errors like 6x² + 29x.", "source": "4-05_ Expanding Binomial Products.pdf · Algebra Topic test + Solutions.pdf Q24c", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Organic chemistry · Reaction types", "difficulty": "medium", "type": "mcq", "stem": "Methane reacts with chlorine in the presence of ultraviolet light. This is an example of:", "options": ["Addition", "Substitution", "Esterification", "Polymerisation"], "answer": 1, "explanation_en": "Under UV light, alkanes react with halogens by substitution: a hydrogen atom is replaced by a chlorine atom, producing CH₃Cl and HCl. This is substitution, not addition, which would require a double bond.", "id": "sci-043", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "hisother-013", "topic": "Civil rights · Mabo and native title", "difficulty": "medium", "type": "mcq", "stem": "Which statement explains the significance of Eddie Koiki Mabo's case (1992)?", "options": ["It ended the forced removal of Aboriginal children from families", "It created the first Aboriginal community-controlled health service", "It gave Aboriginal Australians the right to vote in elections", "It overturned terra nullius and recognised native title in law"], "answer": 3, "explanation_en": "The Mabo decision rejected the legal doctrine of 'terra nullius' and recognised the land rights of Aboriginal and Torres Strait Islander peoples, which was a turning point in the land rights movement.", "source": "Term 3 · Assessment Guide — Significant Individuals (Eddie Koiki Mabo)", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "his-001", "topic": "Terms · Unipolarity", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines unipolarity?", "options": ["Power rests with whichever state acts first without consulting others", "One state is dominant, with no rival of comparable power", "Power is shared between two rival blocs that balance each other", "Power is dispersed among several competing great powers"], "answer": 1, "explanation_en": "A unipolar system has only one dominant power centre with no peer rivals, whereas bipolarity refers to the Cold War's US-Soviet balance, and multipolarity refers to multiple balancing powers; 'Power rests with whichever state acts first without consulting others' describes unilateralism, not the power structure.", "source": "Term 4 · Yearly Assessment Notification — Section One(Unipolarity)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "pdh-004", "topic": "Road safety · Ranking causes of crashes", "difficulty": "medium", "type": "mcq", "stem": "Which list ranks the leading causes of fatal road crashes in NSW from LARGEST to SMALLEST contribution (2025 data)?", "options": ["Drink/drug impairment — Speeding — Fatigue — Distraction — Not wearing a seatbelt", "Fatigue — Speeding — Distraction — Drink/drug impairment — Not wearing a seatbelt", "Speeding — Fatigue — Drink/drug impairment — Not wearing a seatbelt — Distraction", "Distraction — Speeding — Fatigue — Not wearing a seatbelt — Drink/drug impairment"], "answer": 2, "explanation_en": "Marking points are broken down into correct ordering, with 2 points for a fully correct order and 1 point for only the first half correct, based on 2025 NSW data: speeding first (around 39–40% of fatal crashes involved speeding, 134 deaths), fatigue second (around 20–21%, 75 deaths), drink-driving third, not wearing a seatbelt fourth (29 deaths), and distraction fifth (often underreported).", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Rank the top 5 causes + Term 1 · Lesson 2–3 (2025 Fatal Five)", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"topic": "Climate · Synoptic charts · Front symbols", "difficulty": "easy", "type": "mcq", "stem": "On a synoptic chart, a line with triangles pointing in the direction of movement represents:", "options": ["A high pressure centre", "An isobar", "A cold front", "A warm front"], "answer": 2, "explanation_en": "Cold fronts are represented by a triangle symbol (▲) and warm fronts by a semicircle symbol (◗), with the direction of the triangle or semicircle indicating the direction of the front's movement; isobars are shown as fine solid lines.", "source": "Yearly Study Guide 2026 · Geography Section I(synoptic charts)", "id": "ge Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Organic chemistry · Formula and structure", "difficulty": "medium", "type": "mcq", "stem": "A molecule has the structural formula CH3–CH=CH–CH3. Which statement is correct?", "options": ["It contains four carbon atoms and one double bond", "It is an alcohol", "It is a saturated compound with no double bonds", "It contains a carboxyl group"], "answer": 0, "explanation_en": "A four-carbon molecule with a C=C bond is butene, an unsaturated compound, as it contains a double bond but no –OH or –COOH groups.", "id": "sci-040", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "eng-032", "topic": "Comparative essay · Conclusion", "difficulty": "hard", "type": "mcq", "stem": "Which conclusion best completes a comparative essay without simply repeating the introduction?", "options": ["In conclusion, both Harper Lee and Alan Parker show that racism is bad, and this is why the two texts are still studied in schools today.", "In conclusion, this essay has discussed characterisation, setting and narrative in To Kill a Mockingbird and Mississippi Burning as I set out.", "The comparison matters because Lee's slow recognition and Parker's forced witness demand different responses, so empathy must become action.", "In conclusion, Lee's novel and Parker's film are both important texts that teach readers and viewers about the dangers of prejudice."], "answer": 2, "explanation_en": "The conclusion should 'recap the argument and take it further': discussing how the comparison leads to different moral demands on the reader/audience (empathy must lead to action), rather than just restating the argument. The other options are vague evaluations, retelling the structure, or just repeating 'opposing prejudice'.", "source": "Section 2 · Comparative essay — conclusion (LEEDER 10ENGB exam outline: integrate the extract, sustain the argument)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "cw-009", "topic": "Where to get help · Booking the school counsellor", "difficulty": "medium", "type": "mcq", "stem": "Which of these does the Support People at School page list as a way to arrange an appointment with a school counsellor?", "options": ["Ask a friend to book the appointment with the school counsellor on your behalf.", "Fill in a referral form or a referral slip, or message a counsellor on Canvas.", "Wait for a teacher to notice that you are struggling and refer you themselves.", "Ask your doctor to write a referral letter before a counsellor will see you."], "answer": 1, "explanation_en": "The page gives three options: fill in the School Counsellor Referral Form, go to the counselling room opposite G201 to fill in a referral slip, or send the counsellor a message on Canvas. Seeing a school counsellor does not require a doctor's referral, although some external services do.", "source": "Support people at school(To organise an appointment with a school counsellor)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "matp-019", "topic": "Functions · Direct proportion", "difficulty": "easy", "type": "mcq", "stem": "y varies directly as x. If y = 12 when x = 5, find x when y = 30.", "options": ["12.5", "10", "2.5", "72"], "answer": 0, "explanation_en": "For direct proportion, write y = kx, find k = 12/5 = 2.4, then when y = 30, x = 30 ÷ 2.4 = 12.5, not 72.", "source": "Topic 1 Graphs.pdf · 7-01 Direct proportion", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "geoother-002", "topic": "Human wellbeing · Human Development Index", "difficulty": "easy", "type": "mcq", "stem": "The Human Development Index (HDI) combines which three dimensions?", "options": ["GDP, inflation rate and the unemployment rate", "Life expectancy, birth rate and the death rate", "Population size, land area and length of coastline", "Health, education and standard of living (GNI per capita)"], "answer": 3, "explanation_en": "The three HDI dimensions are health, education and standard of living. Because it measures health and education as well as income, the HDI is more comprehensive than a single economic indicator such as GDP.", "source": "Term 1 · Week 2 Global — Lesson 3: quantitative (GDP) vs qualitative (HDI)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "eng-033", "topic": "Writing · Describing vs analysing", "difficulty": "easy", "type": "mcq", "stem": "Which sentence analyses rather than describes?", "options": ["Parker uses a mid shot in the opening scene, and a mid shot is a camera shot taken from a medium distance.", "The camera holds both fountains side by side, so segregation becomes an ordinary arrangement the viewer absorbs before judging it.", "In the opening scene Parker shows two water fountains, one for white people and one for black people, standing in the street.", "The scene is effective because it shows the audience that segregation really existed in towns in America at that time."], "answer": 1, "explanation_en": "Analysis sentences should have 'technique → effect → impact on the audience' in three steps: the camera angle makes segregation seem like a 'normal arrangement', making the audience accept before judging. Simply retelling the content, defining terms, or making vague assertions won't suffice.", "source": "Writing skills · Analytical vs descriptive sentences (Term 3 weeks 8–10: refining analytical writing)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "engother-013", "topic": "Reading paper · Tone and attitude", "difficulty": "medium", "type": "mcq", "stem": "'Still I Rise' is studied in the Term 3 Reading Section. Which attitude does the speaker most clearly represent?", "options": ["Nostalgia for a lost childhood home and the songs of the past", "Resigned acceptance of injustice and a longing for silence", "Defiant pride and a refusal to be diminished by oppression", "Indifference towards history, politics and the struggle for change"], "answer": 2, "explanation_en": "The poem voices resistance and dignity through the repeated phrase 'I rise'; it belongs with the poems that represent injustice, discrimination and resistance, rather than resignation or nostalgia.", "source": "Term 3 · 'Still I Rise' poem and questions (10ENGL TERM THREE HOMEPAGE)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "sport-007", "topic": "Competition rules · Swimming progression exceptions", "difficulty": "medium", "type": "mcq", "stem": "At the swimming carnival, the fastest two swimmers normally qualify for the Zone carnival. For which event does only the fastest swimmer qualify?", "options": ["4 × 50 m relay", "50 m breaststroke", "50 m freestyle", "100 m butterfly"], "answer": 3, "explanation_en": "Only the fastest swimmer is taken for the 200 m freestyle, the 200 m individual medley and the 100 m butterfly; the top two go through in the other events. In the 50 m freestyle the top two qualify and the next two form the relay team.", "source": "Swimming Carnival Program 2020 (3).pdf (zone qualifying table)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"topic": "Networks · Planar graphs", "difficulty": "medium", "type": "mcq", "stem": "A planar graph is one that:", "options": ["Contains no more than four vertices", "Has all vertices of equal degree", "Has no cycles", "Can be drawn on a plane without any edges crossing"], "answer": 3, "explanation_en": "A planar graph refers to a graph that can be drawn on a plane without any edges intersecting; whether it looks intersecting or not is irrelevant, what matters is whether it can be redrawn without intersecting.", "source": "Yearly Study Guide 2026 · Mathematics Core(Network terminology and planar graphs)", "id": "matp-049", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "ftn-007", "topic": "Food equity · Affected groups", "difficulty": "easy", "type": "mcq", "stem": "According to the Term 1 unit, which group is identified as likely to experience food inequity in developed and developing countries?", "options": ["People on low incomes or who are unemployed", "Food critics who review restaurants", "Professional athletes on high incomes", "Full-time university students living on campus"], "answer": 0, "explanation_en": "People on low incomes or who are unemployed are the typical examples of groups affected by food inequity, along with rural residents, women and children, the elderly, people with chronic illnesses, people with disabilities, Aboriginal and Torres Strait Islander peoples, and people who are homeless.", "source": "Term 1 · Food Inequity Assignment (Introduction — list of affected groups)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"topic": "King Lear · Plot", "difficulty": "easy", "type": "mcq", "stem": "How does King Lear decide how to divide his kingdom at the start of the play?", "options": ["By holding a tournament between the dukes", "By drawing lots with his daughters", "By asking each daughter to say how much she loves him", "By giving the largest share to the eldest daughter"], "answer": 2, "explanation_en": "King Lear asks his three daughters to express their love for him, which will determine their share of the kingdom, making love a measurable performance.", "source": "Yearly Study Guide 2026 · English(5 multiple choice questions based on the events of your play)", "id": "eng-001", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "ftn-012", "topic": "Special dietary needs · Coeliac disease", "difficulty": "easy", "type": "mcq", "stem": "A person with coeliac disease must avoid:", "options": ["All dairy products, such as milk", "All foods containing added sugar", "All nuts, seeds and peanut products", "Gluten, found in wheat, barley and rye"], "answer": 3, "explanation_en": "Coeliac disease is an autoimmune reaction to gluten and requires a strict gluten-free diet for life. It is an immune response, not simply an ordinary allergy to flour.", "source": "Term 3 · Food for Specific Needs: Quiz 6 Coeliac Disease", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "maths53-036", "topic": "Probability · Relative frequency", "difficulty": "easy", "type": "mcq", "stem": "A die is rolled 50 times and a 6 appears 7 times. What is the relative frequency of rolling a 6?", "options": ["0.12", "0.07", "0.86", "0.14"], "answer": 3, "explanation_en": "The relative frequency is the number of occurrences divided by the total number of trials, which is 7/50 = 0.14; common mistakes include using 100 as the total number of trials (7/100 = 0.07), using the score 6 instead of the frequency (6/50 = 0.12), or calculating the complementary event 43/50 = 0.86.", "source": "Chapter 12 Probability · 12.01 Relative frequency", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"topic": "Networks · Eulerian trail", "difficulty": "medium", "type": "mcq", "stem": "A network has exactly two vertices of odd degree. What can be concluded?", "options": ["An Eulerian trail exists, starting and finishing at the two odd-degree vertices", "The network is not connected", "Every vertex must be visited twice", "No Eulerian trail exists"], "answer": 0, "explanation_en": "Having exactly two odd-degree vertices → there is an Eulerian path (can be drawn in one stroke), which must start from one odd vertex and end at the other; to return to the starting point (a circuit), all vertices must have even degrees.", "source": "Yearly Study Guide 2026 · Mathematics Standard(Eulerian trials and circuits)", "id": "matp-046", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "ftn-017", "topic": "Special occasions · Lunar New Year", "difficulty": "easy", "type": "mcq", "stem": "In Chinese New Year celebrations, long noodles are served because they symbolise:", "options": ["Wealth in the form of gold coins", "Good luck in school examinations", "Longevity and a long life", "The end of the harvest season"], "answer": 2, "explanation_en": "Longevity noodles symbolise long life and are typically served uncut and unbroken, whereas gold ingot-shaped dumplings are associated with wealth, and the two should not be confused.", "source": "Term 4 · Food for Special Occasions: Quiz 2 Chinese New Year", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "car-001", "topic": "Australian pathways · ATAR eligibility", "difficulty": "easy", "type": "mcq", "stem": "To be eligible for an ATAR in NSW, a Year 12 student must complete at least how many units of ATAR courses?", "options": ["6 units", "12 units", "10 units", "8 units"], "answer": 2, "explanation_en": "To be eligible for an ATAR, you need to complete at least 10 units of ATAR courses, including 8 units from Category A and 2 units of English; missing one unit will make you ineligible for an ATAR.", "source": "top-tips-for-choosing-hsc-courses.pdf(ATAR eligibility)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "pdh-008", "topic": "Gaming · Three motivations", "difficulty": "medium", "type": "mcq", "stem": "The lesson says games fall into three motivational drives. Which set is correct?", "options": ["Social, competition and loss of rewards", "Social, pleasure (intermittent reward) and pain", "Skill, reward and punishment for losing rank", "Social, peer pressure and punishment for logging off"], "answer": 1, "explanation_en": "Marks are awarded for filling in three blanks (1 mark each, 3 marks): Social (e.g. Farmville), Pleasure/intermittent reward (e.g. Call of Duty) and Pain (e.g. World of Warcraft). Only specific examples are accepted, not general terms such as 'fun' or 'addictive'.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Games – three motivational drives + Term 1 · Lesson 9 Online Safety", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "sport-010", "topic": "Sport safety · Heat and sun protection", "difficulty": "medium", "type": "mcq", "stem": "Which is the best preparation for an outdoor athletics carnival on a hot day?", "options": ["Drink plenty of water and bring a hat and sun protection", "Avoid drinking until after your last event", "Wear brand new spikes you have never worn before", "Wear an extra jumper so you sweat more and lose weight"], "answer": 0, "explanation_en": "The course notice says it is essential to bring enough water, protect yourself from the sun and wear a hat. Deliberately drinking less water raises the risk of heatstroke and cramps, and new spiked shoes cause blisters, so they should not be worn for the first time on competition day.", "source": "Bally Boys school athletics carnival permission note.doc(What to bring)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sciother-018", "topic": "Chemistry · Collision theory", "difficulty": "medium", "type": "mcq", "stem": "Using collision theory, why does raising the temperature increase the rate of a chemical reaction?", "options": ["The activation energy of the reaction is lowered.", "The particles get larger, so they collide more often.", "Particles gain kinetic energy, so more collisions succeed.", "The concentration of the reacting particles increases."], "answer": 2, "explanation_en": "The collision theory requires particles to collide with sufficient force and in the correct direction.", "source": "Term 2 · Reactive Chemistry – 2020 Year 10 Yearly Examination Answers (Part A Q7 — collision theory)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sport-002", "topic": "Ball sport rules · Volleyball team size", "difficulty": "easy", "type": "mcq", "stem": "In indoor volleyball, how many players from each team are on the court at one time?", "options": ["11", "2", "6", "5"], "answer": 2, "explanation_en": "Indoor volleyball has 6 players per team on the court, and players rotate when it is their turn to serve. Beach volleyball has 2, while 11 is the number for football, cricket and similar sports — do not mix the codes up.", "source": "Bally Volleyball (indoor volleyball team) + syllabus knowledge", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "pdh-027", "topic": "Nutrition · Types of health services", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is listed in the course as a type of health service available to young people?", "options": ["Careers counselling", "Nutritional support", "Private exam tutoring", "Private driving lessons"], "answer": 1, "explanation_en": "Marks are awarded for recognising 'nutrition support' as a health service (1 mark) and for listing additional categories (a further 1 mark). Lesson 1 lists nine categories: mental health, dental, substance abuse treatment, preventive care, physical and occupational therapy, nutrition support, pharmaceutical services, transportation, and prenatal care. A nutritionist or dietitian sits in the nutrition support category.", "source": "Term 3 · Lesson 1 Health Services · Types of Health services", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "geo-024", "topic": "East Coast Lows · Chart reading", "difficulty": "medium", "type": "mcq", "stem": "Stimulus: A synoptic chart shows tightly packed isobars and a closed low-pressure centre just off the NSW coast, with a cold front crossing the coast. What does this chart indicate, and why does it matter for Collaroy–Narrabeen?", "options": ["An East Coast Low, bringing heavy rain and large erosion-driven waves", "A tropical cyclone tracking inland across the ranges from the west", "A high-pressure ridge, bringing calm seas and steady offshore winds", "A stationary front producing no wind and no coastal impact"], "answer": 0, "explanation_en": "Dense isobars mean a large pressure gradient, which equals strong winds; a closed low-pressure system with a cold front brings heavy rain, strong winds, and large waves to the east coast, which was the weather context for the severe erosion of the beach in 2016.", "source": "Term 3 · Lesson 2.2 Understanding East Coast Lows(synoptic map)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Synoptic chart: tightly packed isobars around a low off the NSW coast with a cold front crossing the coast\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0 0.0,340.0 0.0,0.0\" fill=\"var(--surface)\" fill-opacity=\".65\" stroke=\"none\"/><polyline points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0\" fill=\"none\" stroke=\"var(--border-strong)\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"388.1,118.0 388.3,119.0 388.4,120.1 388.4,121.2 388.2,122.2 387.8,123.3 387.2,124.3 386.4,125.3 385.5,126.1 384.4,126.9 383.1,127.5 381.8,128.1 380.4,128.5 379.0,128.8 377.5,128.9 376.1,129.0 374.7,129.0 373.3,128.9 372.0,128.8 370.7,128.6 369.4,128.4 368.2,128.2 367.0,127.9 365.8,127.6 364.6,127.3 363.4,126.9 362.2,126.4 361.1,125.9 360.0,125.3 359.0,124.6 358.0,123.8 357.2,123.0 356.5,122.1 356.0,121.1 355.6,120.1 355.4,119.0 355.4,118.0 355.5,117.0 355.7,115.9 356.1,114.9 356.6,114.0 357.3,113.0 358.0,112.2 358.8,111.3 359.6,110.5 360.6,109.8 361.6,109.1 362.7,108.4 363.9,107.9 365.1,107.4 366.4,106.9 367.8,106.6 369.2,106.4 370.6,106.3 372.0,106.2 373.4,106.4 374.8,106.6 376.1,106.9 377.4,107.3 378.6,107.8 379.7,108.4 380.7,109.0 381.7
