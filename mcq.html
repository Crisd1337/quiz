) is best described as one that:", "options": ["Must be avoided by everyone with diabetes at all times", "Is digested slowly and raises blood glucose gradually", "Raises blood glucose quickly and sharply", "Contains no carbohydrate or sugar at all"], "answer": 1, "explanation_en": "Low GI foods are digested and absorbed slowly, causing a gradual increase in blood sugar levels and a longer feeling of fullness, whereas high GI foods cause a rapid spike in blood sugar.", "source": "Term 3 · Food for Specific Needs: Quiz 5 The Glycaemic Index", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "sciother-033", "topic": "Organic chemistry · Determining molecular formula", "difficulty": "hard", "type": "mcq", "stem": "A hydrocarbon has the molecular formula C₅H₁₀. Could it be an alkane?", "options": ["Yes, because it contains only carbon and hydrogen.", "No, because it does not contain enough hydrogen to be a hydrocarbon at all.", "Yes, because any compound with five carbon atoms always has ten hydrogen atoms.", "No, because alkanes follow CnH2n+2, which for five carbons is C₅H₁₂ and not C₅H₁₀."], "answer": 3, "explanation_en": "Substituting n=5 into the alkane formula CnH2n+2 gives C5H12; C5H10 has two fewer hydrogens, matching CnH2n, which is an alkene (or cycloalkane), and can't be a straight-chain alkane.", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet(Part N Q32)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "eng-024", "topic": "Comparative essay · Function of topic sentences", "difficulty": "easy", "type": "mcq", "stem": "What is the main job of a topic sentence in a comparative body paragraph?", "options": ["To introduce the paragraph by naming the text and the technique it will discuss", "To provide a quotation from each text and explain what happens in that scene", "To summarise the plot of both texts so the reader can follow the argument", "To state a comparative claim about both texts that answers part of the essay question"], "answer": 3, "explanation_en": "A topic sentence = the comparative argument this paragraph aims to prove, which must cover both texts and respond to the question. 'To introduce the paragraph by naming the text and the technique it will discuss' is just a signpost, not an argument. 'To provide a quotation from each text and explain what happens in that scene' is evidence. 'To summarise the plot of both texts so the reader can follow the argument' is just retelling.", "source": "Section 2 · Comparative essay — body paragraph structure (TKAMB BP1/BP2/BP3 scaffolds)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "car-005", "topic": "Australian pathways · Qualification levels", "difficulty": "easy", "type": "mcq", "stem": "How long does an undergraduate bachelor degree usually take in Australia?", "options": ["6 to 8 years of full-time study", "1 to 2 years of full-time study", "10 years of full-time study", "3 to 5 years of full-time study"], "answer": 3, "explanation_en": "Undergraduate degrees usually take 3–5 years of full-time study and let you choose a major. Postgraduate certificates, masters degrees and PhDs are the levels that come after, and each takes additional time.", "source": "Week 5 - Levels of education(University Entry)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "cw-006", "topic": "Mental health · Understanding self-harm", "difficulty": "easy", "type": "mcq", "stem": "Which statement about self-harm matches what the Self Harm page says?", "options": ["It is usually a way of coping with intense feelings, not attention seeking.", "It is simply attention seeking behaviour and should be ignored by everyone.", "It always means the person wants to die and has already planned how to.", "It will stop on its own, so professional help is not needed for it."], "answer": 0, "explanation_en": "Self-harm is not about 'attention seeking': it is often a way of coping with intense emotions and stress, and it does not necessarily mean the person is having suicidal thoughts. It can still cause long-term physical and emotional harm, so professional help is necessary.", "source": "Self Harm(self harm is not \"attention seeking\"; reasons people self harm)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-012", "topic": "Respect and safety · Gender and identity terms", "difficulty": "medium", "type": "mcq", "stem": "On the Identity and Gender page, which term refers to a person's biological characteristics, such as chromosomes and reproductive organs?", "options": ["Sex", "Cisgender", "Gender", "Sexuality"], "answer": 0, "explanation_en": "Sex refers to biological characteristics such as chromosomes and reproductive organs; gender refers to identity and expression (male, female, non-binary, gender fluid); and sexuality refers to who you are attracted to. Cisgender means your gender identity matches the sex you were assigned at birth.", "source": "Identity and Gender (GENDER / SEX / SEXUALITY comparison table and key terms)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "maths53-039", "topic": "Probability · Product rule for independent events", "difficulty": "medium", "type": "mcq", "stem": "A coin is tossed and a die is rolled at the same time. What is the probability of getting a head and an even number?", "options": ["1/4", "1/12", "3/4", "1/2"], "answer": 0, "explanation_en": "For two independent events, use the product rule: P(H) × P(even) = 1/2 × 1/2 = 1/4; 1/2 only considers the dice being even (forgetting to multiply by the coin), 1/12 is the mistake of using P(4) = 1/6 as the probability of being even, and 3/4 is the complementary event 1 − 1/4.", "source": "Chapter 12 Probability · 12.06 Dependent and independent events (product rule)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "eng-034", "topic": "Writing · What 'using the extract' means", "difficulty": "easy", "type": "mcq", "stem": "What does it mean to 'use' the extract supplied with an essay question?", "options": ["Summarising the extract in your own words without discussing its language.", "Copying the extract into your essay so the marker knows you have read the question.", "Mentioning that the extract exists and then writing about the rest of the text only.", "Quoting a few words from the extract inside your own sentence and analysing their effect."], "answer": 3, "explanation_en": "'Using' the extract means embedding it as evidence: quoting, analysing language, and linking back to the question and whole text. Copying a whole paragraph, only mentioning at the start, or just paraphrasing don't count as integration.", "source": "Writing skills · Using the supplied extract (LEEDER 10ENGB exam outline, Section 2 criteria)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "sciother-007", "topic": "Genetics · Base ratio calculations", "difficulty": "medium", "type": "mcq", "stem": "In a sample of DNA, 30% of the bases are adenine. What percentage of the bases is guanine?", "options": ["40%", "10%", "20%", "30%"], "answer": 2, "explanation_en": "Given A=T, T also makes up 30%, totaling 60% for both, and the remaining 40% is split evenly between G and C, so G makes up 20%.", "source": "Term 1 · Genetics – 2020 Year 10 Yearly Examination Answers (Part D Q4) + base-pairing rules", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "matp-017", "topic": "Coordinate geometry · Equation of a line", "difficulty": "medium", "type": "mcq", "stem": "Which equation describes the line with gradient 3 that passes through the point (2, −1)?", "options": ["y = −3x + 5", "y = 3x + 7", "y = 3x − 1", "y = 3x − 7"], "answer": 3, "explanation_en": "Substitutin ave, passes through the atmosphere to reach the Earth's surface; as the surface warms, it radiates long-wave (infrared) radiation, which is absorbed and re-emitted by greenhouse gases, with some returning to the surface.", "source": "Yearly Study Guide 2026 · Geography Section II(greenhouse effect)", "id": "geo-003", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "matp-010", "topic": "Equations · Linear with unknowns both sides", "difficulty": "easy", "type": "mcq", "stem": "Solve 9x + 10 = 7x − 6.", "options": ["x = −2", "x = 2", "x = 8", "x = −8"], "answer": 3, "explanation_en": "Subtracting 7x and 10 from both sides gives 2x = −16, so x = −8. Common mistakes include forgetting to change the sign when moving the 10 (getting −2) or calculating −16 ÷ 2 as +8.", "source": "Topic 2 Equations and Inequality.pdf · 6-01 Equations(Example 1c)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sciother-020", "topic": "Chemistry · Balancing equations", "difficulty": "hard", "type": "mcq", "stem": "Which set of coefficients correctly balances this equation: __Al + __HCl → __AlCl₃ + __H₂ ?", "options": ["3, 6, 2, 3", "2, 6, 2, 3", "2, 3, 2, 3", "1, 3, 1, 3"], "answer": 1, "explanation_en": "2Al + 6HCl → 2AlCl₃ + 3H₂: the number of atoms on the left side is Al 2, H 6, Cl 6, and on the right side is Al 2, Cl 6, H 6, making them equal.", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers(Balanced Equations part 2)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "maths53-026", "topic": "Graphs · Circle", "difficulty": "easy", "type": "mcq", "stem": "State the centre and radius of the circle (x − 3)² + (y + 2)² = 25.", "options": ["Centre (−3, 2), radius 5", "Centre (3, −2), radius 25", "Centre (3, −2), radius 5", "Centre (−3, 2), radius 12.5"], "answer": 2, "explanation_en": "The standard form is (x−a)² + (y−b)² = r², s  "8–10 hours", "6–7 hours"], "answer": 2, "explanation_en": "The recommended sleep duration for 14–17-year-olds is 8–10 hours, with 7–11 hours being 'possibly okay' and anything outside that range not recommended, because sleep deprivation affects memory, focus and mood.", "source": "Sleep (recommended sleep table: 14–17 years — 8–10 hours)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "his-005", "topic": "Terms · Collective security vs intervention", "difficulty": "medium", "type": "mcq", "stem": "Which action is the clearest example of collective security rather than humanitarian intervention?", "options": ["US troops landing in Somalia in 1992 to protect food convoys", "NATO aircraft bombing Serbia in 1999 to stop ethnic cleansing", "US-led forces invading Iraq in 2003 without any explicit UN approval", "A UN-authorised coalition repelling Iraq's 1990 invasion of Kuwait"], "answer": 3, "explanation_en": "The Gulf War is the classic example of collective security, because it responded to cross-border aggression. The other examples were driven by protecting civilians or overthrowing a regime, which makes them humanitarian intervention or pre-emption, not collective security.", "source": "Term 4 · Yearly Assessment Notification — Body 1(Gulf War 1991)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "sport-005", "topic": "Competition rules · Athletics progression", "difficulty": "easy", "type": "mcq", "stem": "At the Balgowlah Boys Athletics Carnival, which athletes are expected to compete at the North Shore Athletics Carnival?", "options": ["Only the winner of each individual event", "The fastest ten runners in each age group", "The top two finishers in each age group", "Everyone who finishes the race on the day"], "answer": 2, "explanation_en": "The athletics carnival rules send the top two in each age group to the North Shore carnival; the top 'ten' is the qualifying standard for cross-country. Do not mix up the rules for the two events.", "source": "Bally Boys school athletics carnival permission note.doc(Zone Representation)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "hisother-012", "topic": "Civil rights · Freedom Ride", "difficulty": "easy", "type": "mcq", "stem": "According to the Significant Individuals list in the assessment guide, who led the 1965 Freedom Ride?", "options": ["Eddie Koiki Mabo", "William Cooper", "Vincent Lingiari", "Charles Perkins"], "answer": 3, "explanation_en": "The material states clearly that Charles Perkins led the 1965 Freedom Ride. The other figures pair with the 1966 Wave Hill strike (Lingiari), the 1992 Mabo case and the 1938 Day of Mourning (Cooper).", "source": "Term 3 · Civil Rights Comic Book Assessment Guide — Significant Individuals", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "sciother-003", "topic": "Earth's energy · Albedo feedback", "difficulty": "medium", "type": "mcq", "stem": "Arctic sea ice melts and exposes the dark ocean underneath. Which statement best explains the effect on global temperature?", "options": ["Albedo decreases, so more radiation is reflected back to space and the temperature falls.", "Albedo decreases, so more solar radiation is absorbed and the temperature rises further.", "Albedo stays the same because water and ice reflect the same amount of radiation.", "Albedo increases, so more radiation is reflected and the temperature falls."], "answer": 1, "explanation_en": "As ice melts it exposes dark seawater, so the albedo falls, more solar radiation is absorbed and the temperature rises, which melts even more ice: a positive feedback loop.", "source": "Term 1 · Earth's Energy – STUDENT 5. Earth.docx(Practical 2 Albedo Effect)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "out-005", "topic": "Leave No Trace · Seven principles", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is one of the seven Leave No Trace principles taught in this unit?", "options": ["Feed wildlife so they stay calm near people", "Travel and camp on durable surfaces", "Build a fire ring at each campsite", "Leave marked tracks to find quiet spots"], "answer": 1, "explanation_en": "One of the seven principles is to 'travel and camp on durable surfaces', whereas building a new fire ring, feeding wildlife, or leaving the trail are all high-impact actions.", "source": "Study Guide · Lesson 5 Leave No Trace", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "maths53-013", "topic": "Logarithms · Exponential equations", "difficulty": "medium", "type": "mcq", "stem": "Solve 3ˣ = 243.", "options": ["x = 81", "x = 5", "x = 4", "x = log 3 ÷ log 243"], "answer": 1, "explanation_en": "Take the logarithm on both sides: x·log3 = log243, x = log243/log3 = 5, or directly see 3⁵=243; note the direction of the quotient can't be reversed.", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations, Example 23 (p.274)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "matp-034", "topic": "Probability · Two-way tables and conditional", "difficulty": "hard", "type": "mcq", "stem": "Year 11 students were surveyed about part-time work. The results were: male with part-time work 43, male without part-time work 27, female with part-time work 35, female without part-time work 31. What is the probability that a randomly selected student works part-time, given that the student is male?", "options": ["43/78", "43/70", "43/136", "70/136"], "answer": 1, "explanation_en": "The denominator of the conditional probability must be the total number of boys, which is 43 + 27 = 70, so it's 43/70. Using the total number of students (43/136) or the total number of part-time workers (43/78) as the denominator is incorrect because it doesn't account for the condition.", "source": "Topic 3 Probability.pdf · 10-03 Two-way tables(Example 5)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-008", "topic": "Algebra · Perfect squares", "difficulty": "medium", "type": "mcq", "stem": "If (7g + 3)² = 49g² + hg + 9, what is the value of h?", "options": ["14", "21", "42", "84"], "answer": 2, "explanation_en": "The middle term of the perfect square is 2×7g×3 = 42g, so h = 42. The most common mistake is calculating only 7×3 = 21, missing the 2 in the formula.", "source": "Algebra Topic test + Solutions.pdf · Part A Q14(perfect squares)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sci-002", "topic": "Evolution · Lamarck vs Darwin", "difficulty": "easy", "type": "mcq", "stem": "How did Lamarck explain the long necks of giraffes?", "options": ["Giraffes stretched their necks to reach high leaves and passed the longer necks on to their offspring.", "Giraffe necks grew longer because the climate changed.", "Giraffes with longer necks obtained food more easily, survived and passed the trait on to their offspring.", "Long necks appeared suddenly because of a mutation in a single generation."], "explanation_en": "Lamarck advocated for 'use and disuse + inheritance of acquired traits': stretching one's neck and passing the change on to offspring, whereas 'Giraffes with longer necks obtained food more easily, survived and passed the trait on to their offspring' is Darwin's explanation of natural selection.", "source": "Term 4 - Evolution - Week 2(Lamarckian Theory vs Darwinian Theory)", "answer": 0, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "maths53-019", "topic": "Coordinate geometry · Midpoint", "difficulty": "easy", "type": "mcq", "stem": "Find the midpoint of the interval joining A(−3, 5) and B(7, −1).", "options": ["(5, −3)", "(2, 2)", "(2, 3)", "(4, 4)"], "answer": 1, "explanation_en": "Each midpoint coordinate is the mean igration takes thousands of years. That is why 'change' has to be described in terms of rate and scale.", "source": "Term 3 · Lesson 1.1 Environmental Change(rate and scale of change)", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "out-010", "topic": "Ecosystems · Interdependence", "difficulty": "medium", "type": "mcq", "stem": "In the Yellowstone example used in the unit, removing wolves caused elk numbers to rise and damage plant life, and reintroducing them gradually restored balance. What does this best demonstrate?", "options": ["Only abiotic factors can change the balance of an ecosystem", "Predators are harmful to ecosystems and should be removed", "Ecosystems are interconnected, so removing one part affects the rest", "Plant life always recovers on its own, whatever happens to animals"], "answer": 2, "explanation_en": "This case illustrates the interdependence of ecosystems: removing one element, such as a top predator, has a ripple effect along the food chain. That is the reasoning used to answer a question such as 'why not just get rid of sharks?'", "source": "Study Guide · Lesson 2 Ecosystems and Interactions · Response Guide", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "How does Goneril and Regan's treatment of Lear change after they gain power?", "options": ["They exile him to France", "They reduce the number of knights he may keep, eventually refusing them entirely", "They crown him king of a smaller region", "They give him more knights than he had before"], "answer": 1, "explanation_en": "Lear's request to keep 100 knights is reduced to 50 by Goneril and then to 25 by Regan, who eventually refuses to accommodate him, and the removal of his attendants is a key point of humiliation.", "source": "Yearly Study Guide 2026 · English", "id": "eng-004", "weak": false, "subj": "eng", "subjZh": "Year 10 Englis const AUTO_STOP = ("the a an of and or to in on for with that this these those is are was were be been being " +
  "as at by from it its their they them we you your our not no but if then than so such can could may might " +
  "will would should must have has had do does did which who whom what when where why how all any more most " +
  "other some only own same very just also into over under about after before between through during").split(" ");
const AUTO_STOP_SET = {};
AUTO_STOP.forEach(function(w){ AUTO_STOP_SET[w] = 1; });
function autoStem(w){
  return String(w||"").toLowerCase()
    .replace(/'s$/,"").replace(/ies$/,"y").replace(/ing$/,"").replace(/ed$/,"")
    .replace(/es$/,"").replace(/s$/,"");
}
function autoKeywords(text){
  var raw = String(text||"").toLowerCase().split(/[^a-z'-]+/);
  var out = [];
  raw.forEach(function(w){
    if(w.length < 4) return;
    if(AUTO_STOP_SET[w]) return;
    var st = autoStem(w);
    if(st.length < 3) return;
    if(out.indexOf(st) < 0) out.push(st);
  });
  return out;
}
function autoScore(pointText, answerText){
  var kw = autoKeywords(pointText);
  if(!kw.length) return {hit:false, ratio:0, matched:0, total:0, missing:[]};
  var mine = {};
  String(answerText||"").toLowerCase().split(/[^a-z'-]+/).forEach(function(w){ mine[autoStem(w)] = 1; });
  var matched = 0, missing = [];
  kw.forEach(function(k){ if(mine[k]) matched++; else missing.push(k); });
  var ratio = matched / kw.length;
  return {hit: ratio >= 0.5, ratio: ratio, matched: matched, total: kw.length, missing: missing.slice(0,4)};
}

}

let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = buildOrder();
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderSetup() {
  const subs = DATA.subjects || {};
  const keys = Object.keys(subs);
  const saved = state.pick || {};
  const opts = keys.map(k => {
    const on = saved[k] !== false;
    return `<label class="pick"><input type="checkbox" data-s="${k}" ${on ? "checked" : ""}>
      <span class="nm" title="${esc(subs[k].zh || k)}">${esc(subs[k].zh || k)}</span><em>${subs[k].n}</em></label>`;
  }).join("");
  const per = (state.per === undefined || state.per === null) ? 10 : state.per;
  const DAILY = ["sci","eng","his","geo","pdh","matp","maths53"];
  app.innerHTML = `<div class="setup">
    <div class="setup-head">
      <h2>综合卷 · 全科</h2>
      <p class="muted">从各科抽题混着做；做错的题会按它原本的科目进错题本，并按第 1/3/7 天排期。</p>
    </div>

    <section class="setup-block">
      <div class="setup-label">1 · 选科目 <span class="muted" id="pickcount"></span></div>
      <div class="picks">${opts}</div>
    </section>

    <section class="setup-block">
      <div class="setup-label">2 · 题型</div>
      <div class="seg">${[["all","全部"],["mcq","只选选择题"],["short","只选简答题"]].map(function(x){
        return '<button data-t="'+x[0]+'" class="'+((state.ttype||"all")===x[0]?'on':'')+'">'+x[1]+'</button>';
      }).join("")}</div>
    </section>
    <section class="setup-block">
      <div class="setup-label">3 · 每科抽几题</div>
      <div class="seg">${[5,10,20,0].map(n => `<button data-n="${n}" class="${per===n?'on':''}">${n? n+' 题':'全部'}</button>`).join("")}</div>
    </section>

    <div class="setup-foot">
      <div class="sum">共 <b id="cnt">0</b> 题</div>
      <button class="btn ghost" id="daily">今日挑战</button>
      <button class="btn" id="startmix">开始答题 →</button>
    </div>
  </div>`;
  const chosenCount = () => {
    let c = 0;
    app.querySelectorAll(".pick input").forEach(cb => { if (cb.checked) c++; });
    return c || Object.keys(subs).filter(k => (state.pick || {})[k] !== false).length;
  };
  const calc = () => {
    let n = 0;
    app.querySelectorAll(".pick input").forEach(cb => {
      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = chosenCount() + " selected";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    state.ttype = b.dataset.t; save(); render();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
    state.answers={}; state.daily=key; state.rewarded=false; state.t0=Date.now(); save(); render();
  }
  document.getElementById("daily").onclick = startDaily;
  document.getElementById("startmix").onclick = () => {
    const chosen = keys.filter(k => (state.pick || {})[k] !== false);
    if (!chosen.length) { alert("Pick at least one subject"); return; }
    let idxs = [];
    chosen.forEach(k => {
      const tt = state.ttype || "all";
      let pool = DATA.questions.map((q, i) => (q.subj === k && (tt === "all" || q.type === tt)) ? i : -1).filter(i => i >= 0);
      pool.sort(() => Math.random() - 0.5);
      idxs = idxs.concat(per ? pool.slice(0, per) : pool);
    });
    idxs.sort(() => Math.random() - 0.5);
    state.order = idxs; state.idx = 0; state.started = true; state.setup = false;
    state.answers = {}; state.t0 = Date.now(); save(); render();
  };
  calc();
}


/* ===== 语言切换 ===== */
var UI_TEXT = {
  en: { grid:"Index", exam:"Exam mode", restart:"Restart", prev:"< Previous", next:"Next >",
        finish:"See results", back:"< Subjects", again:"Redo all", lb:"Today's leaderboard" },
  zh: { grid:"题号", exam:"考试模式", restart:"重来", prev:"← 上一题", next:"下一题 →",
        finish:"看成绩", back:"← Subjects", again:"整套重做", lb:"查看今日榜单" }
};
function T(k){
  var lang = LANG(); var d = UI_TEXT[lang === "zh" ? "zh" : "en"];
  return d[k] || UI_TEXT.en[k] || k;
}
function applyChrome(){
  var map = { grid:"#grid", exam:"#exam", restart:"#restart" };
  Object.keys(map).forEach(function(k){ var el=document.querySelector(map[k]); if(el) el.textContent=T(k); });
  var btn=document.getElementById("langBtn"), now=document.getElementById("langNow");
  var l=LANG();
  if(now) now.textContent = l==="en" ? "EN" : (l==="zh" ? "中文" : "EN+中");
}
function cycleLang(){
  var order=["en","zh","both"], i=order.indexOf(LANG());
  setLANG(order[(i+1)%3] || "en");
  applyChrome(); render();
}

function render() {
  if (MULTI && location.hash === "#daily" && !state.started && !state.dailyAuto) {
    state.dailyAuto = true; if (typeof startDaily === "function") startDaily();
  }
  if (MULTI && state.setup && !state.started) return renderSetup();
  const qs = state.order.map(i => DATA.questions[i]);
  const q = qs[state.idx];
  const L = LANG(), ZH = (q && q.zh) || null;
  const total = qs.length;
  const answered = qs.filter(x => state.answers[x.id]).length;
  const right = qs.filter(x => state.answers[x.id] === "ok").length;
  const wrong = qs.filter(x => state.answers[x.id] === "bad").length;
  document.getElementById("counter").textContent = (state.idx+1) + " / " + total;
  document.getElementById("scorepill").textContent = "✓ " + right + "  ✗ " + wrong;
  document.getElementById("pbar").style.width = (answered/total*100).toFixed(1) + "%";
  if (!q) { app.innerHTML = "<p>这套题是空的。</p>"; return; }

  const rec = state.answers[q.id];
  const chips = `<div class="chips">
      ${q.subjZh && q.subj !== DATA.slug ? `<span class="chip">${esc(q.subjZh)}</span>` : ""}
      <span class="chip">${esc(q.topic)}</span>
      <span class="chip ${esc(q.difficulty)}">${ {easy:"简单",medium:"中等",hard:"较难"}[q.difficulty] || esc(q.difficulty) }</span>
      <span class="chip">${q.type === "mcq" ? "选择题" : "简答"}</span>
      <span class="chip">第 ${state.idx+1} 题 / 共 ${total}</span>
    </div>`;

  let bodyHtml = "";
  if (q.type === "mcq") {
    const opts = (q.options || []).map((o, i) => {
      let cls = "opt", mark = "";
      if (rec) {
        if (i === q.answer) { cls += " correct"; mark = '<span class="mk">✓</span>'; }
        else if (rec.chosen === i) { cls += " wrong"; mark = '<span class="mk">✗</span>'; }
      }
      const zo = (ZH && Array.isArray(ZH.options) && ZH.options[i]) ? ZH.options[i] : "";
      const zhSpan = (L !== "en" && zo) ? `<span class="otr">${esc(zo)}</span>` : "";
      return `<button class="${cls}" data-i="${i}" ${rec ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[i]}</span><span class="txt">${esc(o)}${zhSpan}</span>${mark}</button>`;
    }).join("");
    bodyHtml = `<div class="opts">${opts}</div>`;
  } else {
    /* ── 简答题：评分标准（criteria）驱动，提交后自动 AI 判分 ── */
    const pts = (q.criteria && q.criteria.length) ? q.criteria
              : (q.points && q.points.length ? q.points : [{t:q.answer, m:1}]);
    const totalMarks = (typeof q.marks === "number" && q.marks > 0)
      ? q.marks : pts.reduce((a,p)=>a+(p.m||1),0);
    const critId = (p,i) => (p && p.id) ? p.id : ("c" + (i+1));
    const checked = (rec && rec.checked) ? rec.checked : [];
    const aiRec = (rec && rec.ai && Array.isArray(rec.ai.results)) ? rec.ai : null;
    const manualEarned = pts.reduce((a,p,i)=>a + (checked.indexOf(i)>=0 ? (p.m||1) : 0), 0);
    const earned = (rec && rec.override) ? manualEarned : (aiRec ? aiRec.score : manualEarned);
    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    let slots = (rec && Array.isArray(rec.slots)) ? rec.slots.slice() : [];
    if (!slots.length && rec && rec.text) slots = [rec.text];
    while (slots.length < pts.length) slots.push("");
    const many = pts.length >= 2;
    const hinted = HINTED[q.id];
    const hintFor = (i) => hinted
      ? String(pts[i].t || "").split(/\s+/).slice(0,4).join(" ") + " …"
      : "Write your point here";
    const enginesAvail = () => !!(apibase() || localAI());
    const canAuto = q.auto_grade !== false && pts.length > 0 && enginesAvail();
    const taHtml = many
      ? `<div class="slots" id="slots">${pts.map((p,i)=>`
          <div class="slot"><span class="sn">${i+1}</span>
            <textarea data-slot="${i}" rows="2" placeholder="${esc(hintFor(i))}">${esc(slots[i]||"")}</textarea>
          </div>`).join("")}</div>`
      : `<textarea id="ta" data-slot="0" rows="4" placeholder="${esc(hintFor(0))}">${esc(slots[0]||"")}</textarea>`;

    const submitLabel = aiRec ? "Re-grade" : (canAuto ? "Submit & auto-grade" : "Show marking points");
    bodyHtml = taHtml + `
      <div class="actions">
        <button class="btn" id="submitq">${submitLabel}</button>
        <button class="btn ghost" id="manualtoggle">Manual override</button>
        <button class="btn ghost" id="hint">${hinted ? "Hide hint" : "Hint"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        <span class="muted" id="slotsum">${slots.filter(function(x){return (x||"").trim();}).length} / ${pts.length} points written</span>
        ${aiRec
          ? `<span class="pill scorepill${aiRec.needsReview ? " low" : ""}">Scored <b>${aiRec.score}</b> / ${totalMarks}</span>`
          : `<span class="muted">Max ${totalMarks} marks · ${pts.length} marking points</span>`}
      </div>
      ${!enginesAvail() ? `<div class="ai-note">No grading server configured — use self-marking, or set the address under Engine to enable AI grading.</div>` : ""}`;

    /* ── AI 判分结果面板 ── */
    if (aiRec) {
      const byId = {};
      aiRec.results.forEach(function(r){ byId[r.id] = r; });
      const rows = pts.map(function(p,i){
        const r = byId[critId(p,i)] || {awarded:0, max:(p.m||1), reason:"未评估"};
        const mx = Math.max(1, r.max || p.m || 1);
        const got = Math.max(0, Math.min(mx, r.awarded || 0));
        const cls = got >= mx ? "full" : (got > 0 ? "part" : "none");
        const mk = got >= mx ? "✓" : (got > 0 ? "◐" : "✗");
        return `<li class="cres ${cls}"><span class="cmk">${mk}</span>` +
          `<span class="cbody"><span class="ct">${esc(p.t)}</span>` +
          (r.reason ? `<span class="cr">${esc(r.reason)}</span>` : "") + `</span>` +
          `<span class="csc">${got}/${mx}</span></li>`;
      }).join("");
      const conf = typeof aiRec.confidence === "number" ? aiRec.confidence : 0.5;
      const confPct = Math.round(conf * 100);
      const when = aiRec.at ? new Date(aiRec.at) : null;
      const whenTxt = when ? (("0"+when.getHours()).slice(-2)+":"+("0"+when.getMinutes()).slice(-2)) : "";
      bodyHtml += `<div class="panel aires">
        <div class="ai-head">
          <span class="ai-score"><b>${aiRec.score}</b><em>/${totalMarks}</em></span>
          <span class="ai-conf ${conf < 0.6 ? "low" : (conf < 0.85 ? "mid" : "high")}">置信度 ${confPct}%</span>
          ${aiRec.needsReview ? '<span class="ai-flag">需要复核</span>' : ""}
          <span class="grow"></span>
          <span class="ai-meta">${esc(aiRec.engine === "local" ? "Local engine" : "AI grading")}${whenTxt ? " · " + whenTxt : ""}</span>
        </div>
        ${aiRec.feedback ? `<div class="ai-fb">${esc(aiRec.feedback)}</div>` : ""}
        <ul class="critlist">${rows}</ul>
        <div class="ai-foot">分数按评分标准逐条给出，由服务器校验求和${aiRec.model ? " · " + esc(String(aiRec.model).replace(/^@cf\//,"")) : ""}</div>
      </div>`;
    }

    /* ── 手动校正（可选覆盖，默认收起）── */
    const autoRes = pts.map(function(p,i){
      const mine = (rec && rec.slots && rec.slots[i]) ? rec.slots[i] : ((rec && rec.text) || "");
      return autoScore(p.t, mine);
    });
    const autoHit = autoRes.filter(function(r){ return r.hit; }).length;
    /* 作答前默认收起：这个面板里逐条列出评分点，很多题（如排序题）评分点本身就是答案。
   无 AI 引擎提交后、或判分服务失败时会由 JS 主动展开（见 submit 分支）。 */
    bodyHtml += `<details class="panel manual" id="manualbox">
      <summary class="panel-h">Manual override · tick the points you covered (no XP)
        <span class="autotag">Auto-check ${autoHit} / ${pts.length} (reference only, not scored)</span>
      </summary>
      <div class="pts">${pts.map(function(p,i){
        const ai = aiRec ? aiRec.results.filter(function(r){ return r.id === critId(p,i); })[0] : null;
        const hint = ai
          ? '<span class="auto ' + (ai.awarded > 0 ? "ok" : "no") + '">AI: ' + ai.awarded + "/" + (ai.max||p.m||1)
            + (ai.reason ? " — " + esc(ai.reason) : "") + "</span>"
          : '<span class="auto ' + (autoRes[i].hit ? "ok" : "no") + '">'
            + (autoRes[i].hit ? "Keywords: likely covered" : "Keywords: likely missed")
            + "（" + autoRes[i].matched + "/" + autoRes[i].total + " keywords"
            + (autoRes[i].missing.length ? ", missing: " + esc(autoRes[i].missing.join(", ")) : "") + "）</span>";
        return '<label class="pt ' + (checked.indexOf(i)>=0 ? "on" : "") + '">'
          + '<input type="checkbox" data-i="' + i + '"' + (checked.indexOf(i)>=0 ? " checked" : "") + '>'
          + "<span>" + esc(p.t) + hint + "</span><em>" + (p.m||1) + " mark(s)</em></label>";
      }).join("")}</div>
      <div class="actions">
        <button class="btn ghost" id="allpt">Tick all</button>
        <button class="btn ghost" id="nonept">Clear all</button>
        <button class="btn ghost" id="applyauto">Tick matching points</button>
        <button class="btn ghost" id="aiconf" title="Grading server address">Engine</button>
      </div>
    </details>`;
    bodyHtml += `<div class="mine"><b>Your answer:</b><div>${esc(((rec && rec.text) || "").trim() || "(empty)").split(String.fromCharCode(10)).join("<br>")}</div></div>`;

  }

  const expText = q.explanation_en || q.explanation || "";
  // 全站英文：标签写死英文，不留给文本节点翻译器
  const expLabel = "Explanation: ";
  const srcLabel = "Source: ";
  const expHtml = rec ? `<div class="exp show"><b>${expLabel}</b>${esc(expText)}
      ${q.type === "short" ? `<details class="fullans"><summary>Show full reference answer</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">${srcLabel}${esc((q.source || "").replace(/[（）：，；]/g, function(ch){
        return {"（":" (", "）":")", "：":": ", "，":", ", "；":"; "}[ch] || ch;
      }))}</div></div>` : "";

  const last = state.idx >= total - 1;
  const stemHtml = `<div class="stem">${esc(q.stem)}</div>`;
  setTimeout(function(){ if(window.applyI18n) applyI18n(); }, 0);
  const figHtml = q.fig ? `<div class="figwrap">${q.fig}</div>` : "";
  app.innerHTML = `<div class="card">${chips}${stemHtml}${figHtml}
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>${T("prev")}</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">${T("finish")}</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>${T("next")}</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq",
        {ratio: i === q.answer ? 1 : 0, answer: String(i)});
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq",
                i === q.answer ? 1 : 0, 1);
      save(); render();
    }));
  } else {
    /* 第二段 else 与上面的渲染块作用域不同，这里重新绑定共享变量 */
    const pts = (q.criteria && q.criteria.length) ? q.criteria
              : ((q.points && q.points.length) ? q.points : [{t:q.answer, m:1}]);
    const totalMarks = (typeof q.marks === "number" && q.marks > 0)
      ? q.marks : pts.reduce((a,p)=>a+(p.m||1),0);
    const critId = (p,i) => (p && p.id) ? p.id : ("c" + (i+1));
    const many = pts.length >= 2;
    const enginesAvail = () => !!(apibase() || localAI());
    const canAuto = q.auto_grade !== false && pts.length > 0 && enginesAvail();
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    const slotEls = () => Array.from(app.querySelectorAll("[data-slot]"));
    const readSlots = () => slotEls().map(el => el.value || "");
    const joinSlots = (arr) => arr.map(s => (s||"").trim()).filter(Boolean).join(String.fromCharCode(10,10));
    const put = (patch) => {
      const c = cur();
      const arr = readSlots();
      state.answers[q.id] = Object.assign({chosen:-1}, c, {slots:arr, text:joinSlots(arr)}, patch);
      save();
    };
    const updateSum = () => {
      const el = document.getElementById("slotsum");
      if (!el) return;
      const filled = readSlots().filter(s => s.trim()).length;
      el.textContent = filled + " / " + pts.length + " points written";
      el.style.color = filled >= pts.length ? "var(--success)" : "var(--muted)";
    };
    let _saveT = null;
    if (many) {
      slotEls().forEach(el => el.addEventListener("input", () => {
        updateSum();
        clearTimeout(_saveT);
        _saveT = setTimeout(() => put({}), 400);
      }));
      updateSum();
    } else {
      const only = slotEls()[0];
      if (only) only.addEventListener("input", () => {
        clearTimeout(_saveT);
        _saveT = setTimeout(() => put({}), 400);
      });
    }

    /* 手动校正（可选覆盖） */
    app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur();
      const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      const arr = c.slots || [c.text || ""];
      const arr2 = set.size ? Array.from(set).sort((a,b)=>a-b) : [];
      const manScore = pts.reduce((a,p,j)=>a + (arr2.indexOf(j)>=0 ? (p.m||1) : 0), 0);
      const full = manScore >= totalMarks;
      state.answers[q.id] = Object.assign({}, c, {
        chosen:-1, slots:arr, text:joinSlots(arr), checked:arr2,
        override:true, manScore:manScore,
        ok: full ? "ok" : (manScore > 0 ? "part" : "bad")
      });
      if (!c.gradedAt) {
        reviewMark(q.subj || DATA.slug, q.id, full);
        logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short", manScore, totalMarks);
      }
      /* 手动勾选只是自评，不产生经验：经验只认 AI 判分的真实得分 */
      save(); render();
    }));

    const hb = document.getElementById("hint");
    if (hb) hb.onclick = () => { HINTED[q.id] = !HINTED[q.id]; render(); };

    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const typed = joinSlots(readSlots());
      const u = numsOf(typed), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!res) return;
      if (!u.length) { res.textContent = "No number written yet"; res.style.color = "var(--muted)"; return; }
      if (!a.length) { res.textContent = "Reference answer has no number"; res.style.color = "var(--muted)"; return; }
      const lastN = u[u.length-1];
      const hit = a.some(v => Math.abs(v-lastN) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "Matches the reference value" : "Does not match the reference value";
      res.style.color = hit ? "var(--success)" : "var(--error)";
    };

    const mt = document.getElementById("manualtoggle");
    if (mt) mt.onclick = () => {
      const mb = document.getElementById("manualbox");
      if (!mb) return;
      mb.open = !mb.open;
      if (mb.open) mb.scrollIntoView({behavior:"smooth", block:"center"});
    };
    const ac = document.getElementById("aiconf");
    if (ac) ac.onclick = () => {
      const curLoc = localAI();
      const v = prompt("Grading server address (leave blank for the default; for a local server use http://127.0.0.1:8787)", apibase());
      if (v === null) return;
      try { localStorage.setItem("dsh-api", v.trim().replace(/\/$/, "")); } catch(e) {}
      toast(v.trim() ? "Grading server saved" : "Cleared — using the default server", true);
      render();
    };
    const aa = document.getElementById("applyauto");
    if (aa) aa.onclick = () => {
      const arr = readSlots();
      const hits = pts.map((p,i)=>autoScore(p.t, arr[i] || joinSlots(arr)).hit ? i : -1).filter(i=>i>=0);
      put({checked:hits, override:true,
           manScore: pts.reduce((a,p,j)=>a + (hits.indexOf(j)>=0 ? (p.m||1) : 0), 0), ok:"ok"});
      render();
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { put({checked:pts.map((_,i)=>i), override:true, manScore:totalMarks, ok:"ok"}); render(); };
    if (none) none.onclick = () => { put({checked:[], override:true, manScore:0, ok:"bad"}); render(); };

    /* ── 提交 / 重新判分 ── */
    const GRADING = window.__GRADING || (window.__GRADING = {});
    const submitBtn = document.getElementById("submitq");
    if (submitBtn) submitBtn.onclick = async function(){
      const answer = joinSlots(readSlots());
      const c0 = cur();
      if (!answer.trim()) { toast("Write something before submitting", false); return; }
      if (!canAuto) {
        put({override:true, ok:"ok"});
        const mb = document.getElementById("manualbox");
        if (mb) { mb.open = true; mb.scrollIntoView({behavior:"smooth", block:"center"}); }
        return;
      }
      if (GRADING[q.id]) return;
      if (c0.ai && !c0.override && c0.text === answer) {
        toast("Already graded this version — edit it to re-grade", false);
        return;
      }
      GRADING[q.id] = true;
      submitBtn.disabled = true;
      const oldTxt = submitBtn.textContent;
      submitBtn.textContent = "Grading…";
      const payload = JSON.stringify({
        stem: q.stem,
        max_marks: totalMarks,
        reference: q.answer || "",
        criteria: pts.map(function(p,i){ return {id:critId(p,i), t:p.t, m:(p.m||1)}; }),
        answer: answer,
        subject: DATA.slug || "",
        topic: q.topic || ""
      });
      const engines = [];
      if (apibase()) engines.push({n:"cloud", u: apibase() + "/grade"});
      const loc = localAI();
      if (loc) engines.push({n:"local", u: loc + "/grade"});
      let lastErr = "no engine";
      for (const en of engines) {
        try {
          const ctl = (typeof AbortController === "function") ? new AbortController() : null;
          const NOABORT = !ctl;
          let timedOut = false;
          const tmo = ctl ? setTimeout(function(){ timedOut = true; try{ ctl.abort(); }catch(e){} }, 30000) : null;
          let r = null, d = null;
          try {
            // fetch 只拿到响应头；真正的耗时在 r.json()（读正文），所以整段都要在超时保护里
            r = await fetch(en.u, {
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body: payload,
              signal: ctl ? ctl.signal : undefined
            });
            d = NOABORT
              ? await Promise.race([
                  r.json(),
                  new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("timeout 30s")); }, 30000); })
                ])
              : await r.json();
          } catch (e) {
            var nm = String((e && e.name) || "");
            if (timedOut || nm === "AbortError") throw new Error("timeout 30s");
            throw new Error("network: " + ((e && e.message) || e));
          } finally {
            if (tmo) clearTimeout(tmo);
          }
          if (!d || !d.ok) throw new Error((d && d.error) || ("http " + (r && r.status)));
          const res = Array.isArray(d.results) ? d.results : [];
          if (!res.length) throw new Error("no criterion results");
          const sum = res.reduce(function(a,x){ return a + (Number(x.awarded_marks) || 0); }, 0);
          const rawScore = (typeof d.score === "number") ? d.score : sum;
          const score = Math.max(0, Math.min(totalMarks, Math.round(rawScore)));
          const conf = (typeof d.confidence === "number")
            ? Math.max(0, Math.min(1, d.confidence)) : 0.5;
          const isLegacy = res.some(function(x){ return x && x.awarded_marks === undefined && x.i !== undefined; });
          if (isLegacy) {
            const normL = pts.map(function(p,i){
              const r = res.filter(function(x){ return Number(x.i) === i; })[0] || {};
              const mx = p.m || 1;
              return {id:critId(p,i), awarded: r.covered ? mx : 0, max:mx,
                      covered:!!r.covered, reason:String(r.reason || "")};
            });
            const scL = normL.reduce(function(a,x){ return a + x.awarded; }, 0);
            const aiL = {score:scL, max:totalMarks, results:normL,
              feedback:"（旧版判分接口，只能整点给分，建议更新服务器）",
              confidence:0.7, needsReview:false, model:String(d.model||"v1"),
              engine:en.n, at:Date.now()};
            const wasL = !!c0.gradedAt;
            state.answers[q.id] = Object.assign({}, c0, {
              chosen:-1, slots:readSlots(), text:answer, ai:aiL,
              gradedAt:aiL.at, gradeModel:aiL.model, gradeEngine:en.n,
              checked:normL.map(function(x,i){ return x.awarded>0?i:-1; }).filter(function(i){ return i>=0; }),
              override:false,
              ok: scL >= totalMarks ? "ok" : (scL > 0 ? "part" : "bad")
            });
            save();
            if (!wasL) {
              reviewMark(q.subj || DATA.slug, q.id, scL >= totalMarks);
              logAnswer(q.subj || DATA.slug, q.id, scL >= totalMarks, q.difficulty, "short",
                        scL, totalMarks);
            }
            GRADING[q.id] = false;
            render();
            return;
          }
          /* 以本地 rubric 为准重建评分点：未知/重复 id 丢弃，满分取题库定义（不信服务端的
             maximum_marks），总分一律由分项求和；与服务端总分对不上就标"需复核"且不发 XP。 */
          var localMax = pts.map(function(p){ return Math.max(1, Math.round(Number(p.m) || 1)); });
          var rubricTotal = localMax.reduce(function(a,b){ return a+b; }, 0) || totalMarks;
          var byIdx = {}, dupIds = [], unknownIds = [], badValue = 0;
          res.forEach(function(x,i){
            var id = String(x.criterion_id || ("c" + (i+1)));
            var idx = -1;
            for (var k2 = 0; k2 < pts.length; k2++) if (critId(pts[k2],k2) === id) { idx = k2; break; }
            if (idx < 0) { unknownIds.push(id); return; }
            if (byIdx[idx]) { dupIds.push(id); return; }
            var raw = Number(x.awarded_marks);
            if (!isFinite(raw) || raw < 0 || raw > localMax[idx]) badValue++;
            var aw = isFinite(raw) ? Math.max(0, Math.min(localMax[idx], Math.round(raw))) : 0;
            byIdx[idx] = {
              id: critId(pts[idx], idx),
              awarded: aw,
              max: localMax[idx],
              covered: !!x.covered,
              reason: String(x.reason || "").slice(0, 240)
            };
          });
          const norm = pts.map(function(p,i){
            return byIdx[i] || {id: critId(p,i), awarded: 0, max: localMax[i], covered: false,
              reason: (L === "en") ? "(the model did not return this criterion; scored 0)"
                                   : "（模型没返回这一条，按 0 分算）"};
          });
          const missingIds = pts.map(function(p,i){ return byIdx[i] ? null : critId(p,i); })
                                .filter(function(x){ return !!x; });
          const sumClamped = norm.reduce(function(a,x){ return a + x.awarded; }, 0);
          const rawServer = d.score;
          const serverScore = (typeof rawServer === "number" && isFinite(rawServer)
                               && rawServer >= 0 && rawServer <= rubricTotal)
            ? Math.round(rawServer) : null;
          const invalidTotal = (rawServer != null) && serverScore === null;
          const mismatch = serverScore !== null && serverScore !== sumClamped;
          // 结构不完整（漏项/重复/未知/越界/非法总分）一律进复核，且不发 XP
          const structural = missingIds.length + dupIds.length + unknownIds.length + badValue
                             + (invalidTotal ? 1 : 0);
          const incomplete = structural > 0;
          const finalScore = sumClamped;
          const ai = {
            score: finalScore, max: rubricTotal, results: norm,
            feedback: String(d.feedback || "").slice(0, 500),
            confidence: conf,
            needsReview: conf < 0.6 || mismatch || incomplete,
            mismatch: mismatch,
            incomplete: incomplete,
            anomalies: {missing: missingIds, dup: dupIds, unknown: unknownIds,
                        badValue: badValue, invalidTotal: !!invalidTotal},
            serverScore: serverScore,
            model: String(d.model || ""),
            engine: en.n,
            at: Date.now()
          };
          const wasGraded = !!c0.gradedAt;
          const gotIdx = pts.map(function(p,i){ return i; }).filter(function(i){
            const id = critId(pts[i], i);
            const hit = norm.filter(function(x){ return x.id === id; })[0];
            return hit && hit.awarded > 0;
          });
          state.answers[q.id] = Object.assign({}, c0, {
            chosen:-1, slots:readSlots(), text:answer,
            ai:ai, gradedAt:ai.at, gradeModel:ai.model, gradeEngine:en.n,
            checked:gotIdx, override:false,
            ok: finalScore >= rubricTotal ? "ok" : (finalScore > 0 ? "part" : "bad")
          });
          save();
          // 每次有效评分都记学习尝试；只有第一次评分才发 XP（防重复刷取）
          {
            reviewMark(q.subj || DATA.slug, q.id, finalScore >= rubricTotal);
            logAnswer(q.subj || DATA.slug, q.id, finalScore >= rubricTotal, q.difficulty, "short",
                      finalScore, rubricTotal);
          }
          if (!wasGraded) {
            // 总分与分项对不上：可能是服务端/模型异常，不发 XP，让人工复核
            if (window.awardForQ && !ai.needsReview) awardForQ(q.id, q.difficulty, "short",
              {ratio: rubricTotal ? finalScore / rubricTotal : 0, answer: answer,
               awarded: finalScore, maxMarks: rubricTotal});
          }
          if (ai.incomplete) toast(L === "en"
            ? "Incomplete grading result - flagged for review, no XP"
            : "评分结构不完整（漏项/重复/越界），已标记复核，本次不发经验", false);
          else if (ai.mismatch) toast(L === "en"
            ? "Score mismatch (" + (ai.serverScore) + " vs " + finalScore + ") - flagged for review, no XP"
            : "总分与分项不一致（" + (ai.serverScore) + " vs " + finalScore + "），已标记复核，本次不发经验", false);
          GRADING[q.id] = false;
          render();
          return;
        } catch (e) {
          lastErr = en.n + ": " + ((e && e.message) || e);
        }
      }
      GRADING[q.id] = false;
      submitBtn.disabled = false;
      submitBtn.textContent = oldTxt;
      toast("Grading service unavailable (" + lastErr + "). Use Manual override to mark it yourself.", false);
      const mb2 = document.getElementById("manualbox");
      if (mb2) mb2.open = true;
    };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        if (window.lbSubmit) lbSubmit(state.t0 ? (Date.now() - state.t0) : 0);
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          drec.n = (drec.n || 0) + 1;
          drec.days = (drec.days || []).concat([Date.now()]).slice(-30);
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
        if (window.lbOpen) setTimeout(function(){ lbOpen(); }, 600);
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.RX && answered > 0) {
      RX.once("exam|" + (DATA.slug || "all") + "|" + RX.day(),
              {xp: 20 + Math.min(80, answered), kind:"exam", src:(DATA.slug||"all")});
    }
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.criteria && x.criteria.length) ? x.criteria
              : ((x.points && x.points.length) ? x.points : [{m:1}]);
    const tot = (typeof x.marks === "number" && x.marks > 0)
      ? x.marks : pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const manGot = (r && r.checked)
      ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    const got = (r && r.override)
      ? (typeof r.manScore === "number" ? r.manScore : manGot)
      : ((r && r.ai && typeof r.ai.score === "number") ? r.ai.score : manGot);
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  const answeredN = qs.filter(x => rec(x.id)).length;
  const shortPct = totalM ? Math.round(earnedM / totalM * 100) : 0;
  const elapsed = state.t0 ? Math.max(0, Date.now() - state.t0) : 0;
  const emin = Math.floor(elapsed / 60000), esec = Math.floor((elapsed % 60000) / 1000);
  const timeTxt = elapsed ? (emin + "'" + ("0" + esec).slice(-2) + '"') : "—";
  const redoRows = needRedo.map(x => {
    const r = rec(x.id) || {};
    if (x.type === "mcq") {
      return `<div class="res-row bad"><span class="rt">${esc(x.topic)}</span>` +
             `<span class="tagx">Choice</span><span class="val">✗</span></div>`;
    }
    const pts = (x.criteria || x.points || [{m:1}]);
    const tot = (typeof x.marks === "number" ? x.marks : pts.reduce((a,p)=>a+(p.m||1),0));
    const got = (r.ai && typeof r.ai.score === "number") ? r.ai.score
              : (r.override ? (r.manScore||0) : (r.checked||[]).reduce((a,_,i)=>a+(pts[i]?(pts[i].m||1):0),0));
    return `<div class="res-row part"><span class="rt">${esc(x.topic)}</span>` +
           `<span class="tagx">Short answer</span><span class="val">${got}/${tot}</span></div>`;
  }).join("");

  app.innerHTML = `<div class="card done">
      <div class="res-head">
        <span class="res-num"><b>${mcq.length ? pct : "—"}${mcq.length ? "%" : ""}</b><span>MCQ: ${right.length} right · ${wrong.length} wrong</span></span>
        <span class="res-num"><b>${earnedM}<em>/${totalM}</em></b><span>Short-answer marks ${shortPct}%</span></span>
        <span class="res-num"><b>${answeredN}<em>/${qs.length}</em></b><span>Answered</span></span>
        <span class="res-note">Time ${timeTxt}${todo.length ? " · " + todo.length + " left undone" : ""}</span>
      </div>
      ${redoRows ? `<div class="res-sec">Needs more practice (${needRedo.length})</div><div class="res-list">${redoRows}</div>` : ""}
      <div class="actions">
        ${needRedo.length ? `<button class="btn" id="redo">Practise only the wrong ones (${needRedo.length})</button>` : ""}
        <button class="btn ghost" id="showlb">${T("lb")}</button>
        <button class="btn ghost" id="again">${T("again")}</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← Back to subjects</a>
      </div></div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    state.order = wrongIds.map(id => DATA.questions.findIndex(x => x.id === id)).filter(i => i >= 0);
    wrongIds.forEach(id => delete state.answers[id]);
    state.idx = 0; save(); render();
  };
  const showlb = document.getElementById("showlb");
  if (showlb) showlb.onclick = () => { if (window.lbOpen) lbOpen(); };
  document.getElementById("again").onclick = () => {
    state = {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
    save(); render();
  };
}

document.addEventListener("keydown", e => {
  if (MULTI && state.setup && !state.started) {
    if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("startmix"); if (b && b.onclick) b.onclick(); }
    return;
  }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") document.getElementById("nav").classList.remove("on"); return; }
  const q = state.order.length ? DATA.questions[state.order[state.idx]] : null;
  if (e.key === "ArrowRight" || e.key === "j") { if (state.idx < state.order.length-1){ state.idx++; save(); render(); } return; }
  if (e.key === "ArrowLeft" || e.key === "k") { if (state.idx > 0){ state.idx--; save(); render(); } return; }
  if (e.key === "g" || e.key === "G") { document.getElementById("nav").classList.contains("on") ? document.getElementById("nav").classList.remove("on") : openNav(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state.order && state.idx < state.order.length - 1) { state.idx++; save(); render(); }
    else showResult();
    return;
  }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); showResult(); return; }
  if (!q || q.type !== "mcq") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= (q.options || []).length) {
    if (!state.answers[q.id]) {
      state.answers[q.id] = {chosen:n-1, ok: n-1 === q.answer ? "ok" : "bad"};
      save(); render();
    }
  }
});

const REVIEW_KEY = "dsh-review-v1";
const GAPS = [1, 3, 7];
function reviewDb(){ try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); } catch(e){ return {}; } }
function reviewSave(db){ try { localStorage.setItem(REVIEW_KEY, JSON.stringify(db)); } catch(e){} }
function reviewMark(slug, qid, correct){
  const db = reviewDb(), id = slug + "::" + qid, now = Date.now();
  if (correct) {
    const it = db[id];
    if (!it) return;
    // 间隔复习：只有到了 due 才算一次有效复习；否则（改答案重评/同一天反复提交）
    // 只更新"最后一次答对时间"，绝不推进 stage
    if (!(it.due && now >= it.due)) { reviewSave(db); return; }
    const st = (it.stage || 0) + 1;
    if (st >= GAPS.length) delete db[id];
    else { it.stage = st; it.due = now + GAPS[st]*864e5; it.last = now; }
  } else {
    const old = db[id] || {};
    db[id] = {stage:0, due: now + GAPS[0]*864e5, added: old.added || now, last: now};
  }
  reviewSave(db);
}
function numsOf(t){ return (String(t).match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

const LOG_KEY = "dsh-log-v1";
function logAnswer(slug, qid, ok, diff, ty, m, mx){
  try {
    let arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    arr.push({t: Date.now(), s: slug, q: qid, ok: ok ? 1 : 0, d: diff || "",
              ty: ty || "", m: (typeof m === "number" ? m : (ok ? 1 : 0)),
              mx: (typeof mx === "number" && mx > 0 ? mx : 1)});
    if (arr.length > 3000) arr = arr.slice(-3000);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function navState(qi){
  const q = DATA.questions[qi], a = state.answers[q.id];
  if (!a) return "";
  if (q.type === "mcq") return a.ok === "ok" ? "ok" : "bad";
  // 简答：以实际得分判断（AI 评分或手动），不再数"勾了几个评分点"
  if (a.ok === "ok" || a.ok === "part" || a.ok === "bad") return a.ok;
  const c = (a.checked || []).length;      // 只有旧数据才走到这里
  return c > 0 ? "part" : "";
}
function openNav(){
  const grid = document.getElementById("navgrid");
  grid.innerHTML = state.order.map((qi, pos) =>
    `<button class="${navState(qi)}" data-pos="${pos}">${pos+1}</button>`).join("");
  grid.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.idx = +b.dataset.pos; save();
    document.getElementById("nav").classList.remove("on"); render();
  });
  document.getElementById("nav").classList.add("on");
}

let timerId = null;
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tickClock(){
  const el = document.getElementById("clock");
  if (!state.deadline) { if (el) el.style.display = "none"; return; }
  const left = state.deadline - Date.now();
  if (el) { el.style.display = ""; el.textContent = "⏱ " + fmtLeft(left);
            el.style.color = left < 5*60000 ? "var(--bad)" : "var(--dim)"; }
  if (left <= 0) { clearInterval(timerId); timerId = null; state.deadline = 0; save(); showResult(); }
}
function startExam(){
  const def = DATA.examMin || 60;
  const v = prompt("Exam mode: how many minutes on the clock? (the paper is collected when time is up)", def);
  if (v === null) return;
  const mins = parseInt(v, 10);
  if (!mins || mins <= 0) return;
  state.deadline = Date.now() + mins*60000; save();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
  tickClock();
}


load(); render();
