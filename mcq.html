      set(order[(order.indexOf(cur)+1)%3]);
    }else{ set(b.getAttribute("data-mode")); }
    ev.preventDefault();
  });
  try{
    var mq=window.matchMedia("(prefers-color-scheme: dark)");
    var onSys=function(){ if(mode()==="system") apply("system"); };
    if(mq.addEventListener) mq.addEventListener("change",onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }catch(e){}
  window.DSH_THEME={set:set,mode:mode};

  /* ── 语言开关：2026-11-12 全站英文，控件已下线（保留空函数防旧引用报错）── */
  (function(){
    var box=document.querySelector("[data-lang-ctl]");
    if(box) box.remove();
  })();
  document.querySelectorAll("[data-theme-ctl]").forEach(paint);
})();
</script>
<script>
const DATA = {"slug": "mcq", "title": "MCQ drill · all subjects", "examMin": 45, "questions": [{"topic": "Organic chemistry · Boiling point trend", "difficulty": "hard", "type": "mcq", "stem": "As the carbon chain of a homologous series of alkanes increases, the boiling point:", "options": ["Decreases, because molecules get lighter", "Increases, because dispersion forces between molecules get stronger", "Stays the same", "Increases, because the molecules become more polar"], "answer": 1, "explanation_en": "In a homologous series, the longer the carbon chain, the stronger the dispersion forces between molecules, so more energy is needed to separate them and the boiling point is higher. In non-polar alkanes this is not caused by increased polarity.", "id": "sci-041", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-017", "topic": "Skills · Graphing (CUTLAS)", "difficulty": "easy", "type": "mcq", "stem": "The CUTLAS checklist is used to mark a line graph. Which list gives the six things a good line graph must have?", "options": ["Colour, Units, Table, Labels, Arrows, Scale", "Calculations, Units, Title, Line, Average, Summary", "Crosses, Variables, Title, Legend, Axes, Gradient", "Crosses, Units, Title, Line, Axes, Scale"], "explanation_en": "A CUTLAS graph includes Crosses, Units, Title, Line, Axes, and Scale, making up about 80% of the graph.", "source": "Stage 5 Graphing-1.docx(CUTLAS checklist)", "answer": 3, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Testing for CO₂", "difficulty": "easy", "type": "mcq", "stem": "Which test identifies the gas produced when a hydrocarbon burns completely?", "options": ["It bleaches damp litmus paper", "It pops with a lighted splint", "It turns limewater milky", "It relights a glowing splint"], "answer": 2, "explanation_en": "CO₂ turns lime water cloudy by forming a CaCO₃ precipitate; a glowing wooden splint indicates oxygen, a popping sound indicates hydrogen, and bleaching wet litmus indicates chlorine.", "id": "sci-034", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sciother-011", "topic": "Motion · Average speed", "difficulty": "easy", "type": "mcq", "stem": "A cyclist travels 300 m in 20 s. What is the cyclist's average speed?", "options": ["15 m/s", "0.067 m/s", "60 m/s", "320 m/s"], "answer": 0, "explanation_en": "The speed is v = d/t = 300 m / 20 s = 15 m/s, and 0.067 m/s is the result of inverting the formula (20/300), while 320 m/s is the sum of the two numbers.", "source": "Term 1 · Motion – Speed and Velocity Problem Solving Jan 10(v = d/t)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"topic": "Climate · Sea level rise", "difficulty": "medium", "type": "mcq", "stem": "Global sea level is rising mainly because of:", "options": ["Thermal expansion of warming seawater and melting of land-based ice", "Volcanic eruptions under the sea", "The ocean becoming saltier", "More rain falling into the oceans"], "answer": 0, "explanation_en": "There are two main mechanisms: thermal expansion of seawater (accounting for about half of the contribution) and the melting of land-based ice (glaciers, Greenland, Antarctica) flowing into the oceans; note that 'sea ice melting' does not raise sea levels as it already floats on water.", "source": "Yearly Study Guide 2026 · Geography Section II(sea level rise)", "id": "geo-005", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Organic chemistry · Functional groups", "difficulty": "medium", "type": "mcq", "stem": "Which functional group is present in ethanol, CH3CH2OH?", "options": ["Carboxyl group (–COOH)", "Hydroxyl group (–OH)", "Carbon–carbon double bond (C=C)", "Ester linkage (–COO–)"], "answer": 1, "explanation_en": "The functional group of ethanol is the hydroxyl group -OH, and it belongs to the category of alcohols; -COOH is a carboxylic acid, C=C is an alkene, and -COO- is an ester.", "id": "sci-030", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "pdh-025", "topic": "Mental health · Resilience", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is one of the characteristics of resilient people identified in the lesson?", "options": ["Avoiding every situation that feels difficult", "Never asking anybody for help at all", "A strong sense of control over their own life", "Seeing themselves as a victim of circumstance"], "answer": 2, "explanation_en": "Marks are awarded for identifying the correct characteristic (1 mark) and for listing additional ones (a further 1 mark). The five characteristics are: control, strong problem-solving skills, solid social connections, seeing oneself as a 'survivor' rather than a 'victim', and being able to seek help. 'Never seeking help' and a 'victim mentality' are the opposite.", "source": "Term 2 · Lesson 3 Characteristics of Resilient people", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "maths53-023", "topic": "Simultaneous equations · Elimination", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations x + 3y = 7 and 4x − 3y = 13.", "options": ["x = 1, y = 4", "x = 4, y = −1", "x = 4, y = 1", "x = 2, y = 5"], "answer": 2, "explanation_en": "Adding the two equations eliminates y: 5x = 20, x = 4; substituting x into x+3y=7 gives y = 1. Because +3y and −3y have opposite signs, we add instead of subtract.", "source": "Chapter 10 Simultaneous equations · 10.02 The elimination method, Example 2 (p.401)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "out-004", "topic": "Human impacts · Short term and long term", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is an example of a LONG-TERM human impact on ecosystems?", "options": ["Dropping a plastic bag into a creek during a picnic", "A bushwalker crushing vegetation by leaving the marked track", "Climate change gradually reducing biodiversity over decades", "Littering a campsite with food packaging and cans"], "answer": 2, "explanation_en": "Short-term impacts happen immediately, such as littering or trampling vegetation, while long-term impacts accumulate over time, like climate change, and are often harder to reverse as habitats can be permanently damaged.", "source": "Study Guide · Lesson 3 Human Impact on the Environment", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"topic": "Climate · Enhanced greenhouse effect", "difficulty": "easy", "type": "mcq", "stem": "The enhanced greenhouse effect refers to:", "options": ["The cooling effect of volcanic ash", "The reflection of sunlight by clouds", "The natural warming that keeps Earth habitable", "Extra warming caused by human increases in greenhouse gas concentrations"], "answer": 3, "explanation_en": "The natural greenhouse effect keeps the Earth's average temperature at about 15°C rather than −18°C, and it is essential. 'Enhanced' refers to the additional greenhouse gases released by human activities, which strengthen that effect.", "source": "Yearly Study Guide 2026 · Geography Section I", "id": "geo-002", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "out-007", "topic": "Indigenous perspectives · Cultural burning", "difficulty": "medium", "type": "mcq", "stem": "Which description of cultural burning matches the lesson?", "options": ["Burning at random times with no planning or control at all", "Small, low-intensity controlled fires that safely reduce fuel loads", "Burning only after a wildfire has already started, to stop it spreading", "Large, high-intensity fires lit in summer to clear all vegetation"], "answer": 1, "explanation_en": "Cultural burning involves small, low-intensity, planned burns at specific times to reduce fuel loads, and its benefits include reducing the risk of large fires, promoting plant regeneration and supporting biodiversity, which is different from uncontrolled fires or waiting for fires to happen.", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land · Cultural Burning", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "cw-008", "topic": "Mental health · Supporting a friend", "difficulty": "medium", "type": "mcq", "stem": "A friend tells you they think they have depression. Which response would the Depression page say is NOT helpful?", "options": ["\"Just cheer up and snap out of it.\"", "\"What's been on your mind recently?\"", "\"What can I do to help?\"", "\"How have you been going lately? You seem a little down.\""], "answer": 0, "explanation_en": "The material specifically says you should not tell a friend to 'cheer up', 'snap out of it' or 'get over it', because that dismisses their feelings. Instead, ask open-ended questions, listen actively and offer a concrete 'how can I help'.", "source": "Depression(Take their feelings seriously — cannot just \"cheer up\", \"snap out of it\")", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "ftn-009", "topic": "Food trends · Snackification", "difficulty": "easy", "type": "mcq", "stem": "The food trend known as 'snackification' refers to:", "options": ["Removing all snacks from your daily diet", "Selling snacks only through supermarkets", "Replacing main meals with more frequent, smaller snacks", "Eating only two large meals a day and no snacks in between"], "answer": 2, "explanation_en": "Snackification refers to the trend of replacing traditional meals with more frequent, smaller, and convenient eating occasions, which is the opposite of reducing snacking.", "source": "Term 2 · Food Trends: Quiz 4 Snackification and other Food Trends", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "eng-023", "topic": "Comparative essay · Judging a thesis", "difficulty": "easy", "type": "mcq", "stem": "Section 2 asks: 'How do Lee and Parker expose systemic racism?' Which thesis best answers the question?", "options": ["Lee's novel is more effective than Parker's film because a novel can explain what characters are thinking, while a film can only show what they do.", "Both Lee and Parker show racism as a system that shields the guilty, but Lee builds a child's slow awareness while Parker forces the viewer to watch.", "Both texts show that racism is a serious problem in America and that it damages the lives of ordinary people in small towns across the country.", "Parker relies on music and camera angles to create meaning, while Lee relies on first-person narration and on dialogue between the characters."], "answer": 1, "explanation_en": "A good thesis should: cover two texts, provide a controversial argument (racism is 'an institution that protects the guilty'), and forecast the comparison angle (child's perspective vs forced watching). The other options are just general discussions, evaluating merits, and listing techniques without an argument.", "source": "Section 2 · Comparative essay — thesis and introduction (10ENGA unit overview; LEEDER 10ENGB exam outline)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "engother-008", "topic": "Poetry unit · Frost's poetry", "difficulty": "easy", "type": "mcq", "stem": "Which Robert Frost poem studied in Term 2 is built around a speaker choosing between two paths in a wood?", "options": ["'The Road Not Taken'", "'Birches'", "'Mending Wall'", "'Stopping by Woods on a Snowy Evening'"], "answer": 0, "explanation_en": "The central situation of 'The Road Not Taken' is a choice at a fork in the road, whereas 'Mending Wall' is about two neighbours repairing the wall between their properties, 'Birches' is about childhood and escape, and 'Stopping by Woods on a Snowy Evening' is about pausing in snowy woods.", "source": "Term 2 · Robert Frost Poetry — The Road Not Taken, poem and questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "car-016", "topic": "Workplace rights · Industrial relations", "difficulty": "medium", "type": "mcq", "stem": "Under Australian workplace law, all workers are entitled to:", "options": ["Work any hours required without breaks or overtime pay", "Be paid only when the employer decides the work was good enough", "Know your rights and responsibilities at work", "Ignore workplace safety rules because they are casual employees"], "answer": 2, "explanation_en": "The core of the course is 'knowing your rights and responsibilities', which includes minimum wage, a safe workplace and rest breaks. Casual workers are not exempt from safety obligations, and their pay cannot be deducted arbitrarily.", "source": "Week Three- Industrial Relations & Workplaces(Fair Work workplace basics)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "geoother-011", "topic": "Climate change · Coral bleaching", "difficulty": "easy", "type": "mcq", "stem": "How does rising sea temperature cause coral bleaching?", "options": ["Corals absorb more dissolved carbon dioxide and so grow much faster", "Heat stress makes corals expel their symbiotic algae, losing colour and food", "Warmer water dissolves the corals' calcium carbonate skeleton directly", "Warmer water multiplies the algae living inside corals, making them overgrow faster"], "answer": 1, "explanation_en": "Corals live in a symbiotic relationship with zooxanthellae. When heat stresses them, the corals expel the zooxanthellae and lose both their colour and their main food source; if the heat persists, the coral dies rather than simply turning white.", "source": "Term 4 · Lesson 3.3 How does sea temperature rise lead to coral bleaching?", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-003", "topic": "Population · Interpreting ageing data", "difficulty": "medium", "type": "mcq", "stem": "In the population-pyramid lesson students study China's ageing population. The source states that by 2100, 37.8% of China's population is projected to be aged over 60. Which is the most likely implication of this figure?", "options": ["A rapidly growing labour force that will raise industrial output sharply", "A rising birth rate that will require many new schools and many more teachers", "A smaller workforce supporting a larger elderly group, straining pensions", "A population pyramid with a very wide base and a much narrower top"], "answer": 2, "explanation_en": "An elderly population of nearly 40% means a higher dependency ratio, a smaller workforce and financial pressure on health care and aged care. A 'population pyramid with a very wide base and a much narrower top', by contrast, describes a high birth rate and an expanding population — the opposite of an ageing one.", "source": "Term 1 · Weeks 3–4 Geographic Skills — China's Ageing Population (37.8% over 60 by 2100)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "maths53-038", "topic": "Probability · Reading two-way tables", "difficulty": "easy", "type": "mcq", "stem": "A survey of 100 students recorded how they travel to school:\n\n            Walk   Bus\nYear 10      28     22\nYear 11      35     15\n\nWhat is the probability that a randomly selected student catches the bus?", "options": ["0.63", "0.37", "0.15", "0.22"], "answer": 1, "explanation_en": "The total number of people taking the bus is 22 + 15 = 37, out of 100, so P = 0.37; 0.22 and 0.15 only consider one row of the table, while 0.63 is the proportion of people walking (1 − 0.37), all of which are errors from not adding or complementing the whole column.", "source": "Chapter 12 Probability · 12.03 Two-way tables", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"topic": "Climate · FLICC · Cherry-picking", "difficulty": "medium", "type": "mcq", "stem": "A website says: 'It snowed heavily last winter, so global warming is a hoax.' Which FLICC technique is this?", "options": ["Conspiracy theory", "Impossible expectations", "Fake experts", "Logical fallacy (cherry-picking)"], "answer": 3, "explanation_en": "Cherry-picking involves selecting a short-term, local weather event to dispute long-term, global trends, but weather is not the same as climate: a single cold snap cannot overturn a 30-year warming trend.", "source": "Yearly Study Guide 2026 · Geography Section I(critical thinking · FLICC)", "id": "geo-010", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "sciother-030", "topic": "Organic chemistry · Homologous series formulas", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is the general formula of the alkanes?", "options": ["CnH2n", "CnH2n+1OH", "CnH2n+2", "CnH2n−2"], "answer": 2, "explanation_en": "The general formula for alkanes is CnH2n+2 (e.g. C5H12 when n=5), while alkenes are CnH2n and alkynes are CnH2n−2, with the last being alcohol classes (containing the -OH functional group).", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet(Part C Q6)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-014", "topic": "Motion · Motion graphs", "difficulty": "medium", "type": "mcq", "stem": "On a velocity–time graph, what does the gradient of the line represent?", "options": ["The acceleration", "The net force", "The average speed", "The distance travelled"], "answer": 0, "explanation_en": "The gradient of a velocity–time graph is Δv/Δt, which is acceleration, while the area under the line represents displacement — a common point of confusion (area vs gradient).", "source": "Term 1 · Motion – SG 1.1 Study Guide(velocity–time graph)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Velocity-time graph with a straight sloping line\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"144.0\" y1=\"20\" x2=\"144.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"232.0\" y1=\"20\" x2=\"232.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"320.0\" y1=\"20\" x2=\"320.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"408.0\" y1=\"20\" x2=\"408.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"496.0\" y1=\"20\" x2=\"496.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"298.0\" x2=\"496\" y2=\"298.0\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"242.4\" x2=\"496\" y2=\"242.4\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"186.8\" x2=\"496\" y2=\"186.8\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"131.2\" x2=\"496\" y2=\"131.2\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"75.6\" x2=\"496\" y2=\"75.6\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"20.0\" x2=\"496\" y2=\"20.0\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"298.0\" x2=\"496\" y2=\"298.0\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/><text x=\"144.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">2</text><text x=\"232.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">4</text><text x=\"320.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">6</text><text x=\"408.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">8</text><text x=\"496.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">10</text><text x=\"49.0\" y=\"245.4\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">2</text><text x=\"49.0\" y=\"189.8\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">4</text><text x=\"49.0\" y=\"134.2\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">6</text><text x=\"49.0\" y=\"78.6\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">8</text><text x=\"49.0\" y=\"23.0\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">10</text><text x=\"496\" y=\"292.0\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">t (s)</text><text x=\"63.0\" y=\"29.0\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">v (m/s)</text><polyline points=\"56.0,270.2 254.0,172.9 452.0,75.6\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"496\" y=\"29.0\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\">gradient = acceleration</text></svg>", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "cw-004", "topic": "Mental health · Signs of depression", "difficulty": "easy", "type": "mcq", "stem": "The Depression page describes clinical depression as a significant low mood that lasts longer than which period and starts to get in the way of everyday life?", "options": ["one year", "24 hours", "two weeks", "three months"], "answer": 2, "explanation_en": "The key criterion is 'lasting more than two weeks' and affecting daily life, since a day or two of low mood is a normal emotional fluctuation rather than depression, and only a medical professional can diagnose it.", "source": "Depression(lasting longer than two weeks and start to get in the way of your everyday life)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "sci-019", "topic": "Skills · Error and reliability", "difficulty": "medium", "type": "mcq", "stem": "A student repeats a measurement five times and gets almost identical results, but the thermometer used always reads 2 °C too high. Which statement best describes the results?", "options": ["They are reliable but not accurate.", "They are both accurate and reliable.", "They are both invalid and unreliable.", "They are accurate but not reliable."], "explanation_en": "Results that are consistent when repeated are reliable, but accuracy refers to how close a measurement is to the true value — for example, a thermometer with a constant high bias is reliable but not accurate; reliability does not equal accuracy.", "source": "Half Yearly Revision.pdf(Reliability / Accuracy / systematic error)", "answer": 0, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "matp-006", "topic": "Algebra · Simplifying algebraic fractions", "difficulty": "medium", "type": "mcq", "stem": "Simplify (6x²y) ÷ (9xy³).", "options": ["2x / (3y²)", "2x / (3y³)", "2y² / (3x)", "3x / (2y²)"], "answer": 0, "explanation_en": "The coefficient simplifies to 6/9 = 2/3; when dividing like bases you subtract the indices, so x²÷x = x and y÷y³ = 1/y². The answer is 2x/(3y²). Common mistakes include writing the index of y as 3, or forgetting to simplify the coefficient.", "source": "4-03_ Multiplying and dividing algebraic fractions.pdf", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Organic chemistry · Uses of ethanol", "difficulty": "easy", "type": "mcq", "stem": "Ethanol is increasingly used as a fuel because it:", "options": ["Does not require oxygen to burn", "Burns without releasing carbon dioxide", "Can be produced by fermentation of plant material and is renewable", "Has a higher energy density than octane"], "answer": 2, "explanation_en": "Ethanol can be produced by fermenting sugars and is a renewable fuel often mixed with petrol to make E10, producing CO₂ when burned, but with a lower energy density than petrol.", "id": "sci-039", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "matp-038", "topic": "Finance · Income tax (37c bracket)", "difficulty": "medium", "type": "mcq", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Calculate the income tax payable on a taxable income of $150,000.", "options": ["$55,500.00", "$43,447.00", "$80,447.00", "$40,297.00"], "answer": 1, "explanation_en": "The $150,000 is in the 37c bracket: $17,547 + 0.37 × (150,000 − 80,000) = $17,547 + $25,900 = $43,447. Two common errors are omitting the base amount (0.37 × 150,000 = $55,500) and using the wrong base (using the top of the previous bracket to get $80,447); $40,297 is the result of using the wrong tax rate of 32.5c.", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q5c (official answer $43,447)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "Edmund plots against Edgar and Gloucester. Which action most directly sets his plan in motion?", "options": ["He forges a letter and calls a tournament", "He tells Edgar that Gloucester wants him dead, then claims Edgar plotted to kill Gloucester", "He reports Edgar to the King", "He openly challenges Edgar to a duel"], "answer": 1, "explanation_en": "Edmund forges letters, tricks Edgar into fleeing, and reports to Gloucester that 'Edgar is plotting against his father', making Edgar a wanted man and himself the legitimate heir.", "source": "Yearly Study Guide 2026 · English", "id": "eng-005", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "Who is the faithful nobleman banished for speaking in defence of Cordelia, and how does he return?", "options": ["Edmund, disguised as a messenger", "Albany, disguised as a knight", "Gloucester, disguised as Poor Tom", "Kent, disguised as the servant Caius"], "answer": 3, "explanation_en": "Kent is banished for defending Cordelia and continues to serve Lear in disguise as Caius, while Poor Tom is Edgar's disguise and Albany is not in disguise.", "source": "Yearly Study Guide 2026 · English", "id": "eng-003", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "maths53-015", "topic": "Quadratics · Factorising method", "difficulty": "easy", "type": "mcq", "stem": "Solve x² − 5x − 24 = 0.", "options": ["x = 12 or x = −2", "x = 6 or x = −4", "x = 8 or x = −3", "x = −8 or x = 3"], "answer": 2, "explanation_en": "Find two numbers with product −24 and sum −5: −8 and 3, so (x−8)(x+3)=0, x=8 or x=−3; note the product is −24, the numbers have different signs, don't write both as positive.", "source": "Chapter 11 Quadratic equations and the parabola · 11.01 Quadratic equations (Ex 11.01)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"topic": "Climate · Carbon sources and sinks", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is best described as a carbon sink?", "options": ["A coal-fired power station", "Deforestation in the Amazon", "The ocean absorbing dissolved carbon dioxide", "Cattle producing methane"], "answer": 2, "explanation_en": "Carbon sinks, such as oceans, forests, and soil, absorb and store carbon, while sources like coal burning, deforestation, and ruminant animals release carbon.", "source": "Yearly Study Guide 2026 · Geography Section I", "id": "geo-004", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "maths53-012", "topic": "Logarithms · Laws", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 2 log₃ 6 − log₃ 4.", "options": ["log₃ 8", "3", "log₃ 2", "2"], "answer": 3, "explanation_en": "First use the power rule to get log₃36, then the quotient rule to get log₃(36/4) = log₃9 = 2. The coefficient 2 has to be turned into an index first; it cannot be subtracted from 4 directly.", "source": "Chapter 7 Equations and logarithms · 7.10 Logarithm laws, Example 20 (p.273)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "eng-030", "topic": "Comparative essay · Theme: individual responsibility", "difficulty": "easy", "type": "mcq", "stem": "Which claim best fits the theme of individual responsibility in both texts?", "options": ["Both texts place responsibility on individuals who let prejudice pass unchallenged, not only on the law.", "Both texts place responsibility on the main characters, since the wider community is never shown to be at fault.", "Both texts place responsibility on families, since children learn prejudice at home and not in public.", "Both texts place responsibility on the law alone, since individuals cannot be held accountable for prejudice."], "answer": 0, "explanation_en": "Individual responsibility means ordinary people who condone prejudice are also responsible, and responsibility isn't just limited to institutions. Saying 'both texts place responsibility on the law alone' or 'on families' or 'on the main characters' goes against the theme of both works.", "source": "Section 2 · Comparative essay — theme axis: individual responsibility (10ENGA unit overview)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "maths53-001", "topic": "Surds · Simplifying", "difficulty": "easy", "type": "mcq", "stem": "Simplify √72.", "options": ["2√6", "8√2", "6√2", "6√3"], "answer": 2, "explanation_en": "√72 = √(36×2) = 6√2, the key is to break down the radicand into the largest square factor (36×2, not 9×8) and simplify until it can't be broken down further.", "source": "Chapter 1 Surds · 1.02 Simplifying surds (Ex 1.02, p.8)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-040", "topic": "Probability · Without replacement", "difficulty": "medium", "type": "mcq", "stem": "A bag contains 5 red and 3 blue counters. Two counters are drawn at random without replacement. What is the probability that both counters are red? Give your answer correct to 2 decimal places.", "options": ["0.39", "0.57", "0.63", "0.36"], "answer": 3, "explanation_en": "Without replacement: the first draw is 5/8, and the second draw has 4 red balls out of 7, so P = 5/8 × 4/7 = 20/56 ≈ 0.36; 0.39 is the mistake of using replacement (25/64 = 0.3906), 0.63 only considers the first draw (5/8), and 0.57 only considers the second draw (4/7).", "source": "Chapter 12 Probability · 12.05 Selecting with and without replacement", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"topic": "Networks · Minimum spanning tree", "difficulty": "hard", "type": "mcq", "stem": "A town must connect four buildings with cable at minimum total length. The possible connections and lengths (km) are AB 2, AC 5, BC 3, BD 4, CD 1. What is the minimum total length?", "options": ["6 km", "8 km", "10 km", "7 km"], "answer": 0, "explanation_en": "The minimum spanning tree = select 3 edges to connect the whole without forming a cycle; sort by length: CD 1, AB 2, BC 3 → the three edges connect A-B-C-D without a cycle, with a total length of 1+2+3=6; adding any other edge would form a cycle.", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard(Shortest path and minimum spanning trees)", "id": "matp-047", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "ftn-014", "topic": "Special dietary needs · Allergy vs intolerance", "difficulty": "medium", "type": "mcq", "stem": "Which statement correctly distinguishes a food allergy from a food intolerance?", "options": ["An allergy involves the immune system, while an intolerance does not", "An allergy can be removed by cooking the food thoroughly", "They are two names for exactly the same reaction", "An intolerance is always more dangerous than an allergy"], "answer": 0, "explanation_en": "Food allergies are mediated by the immune system and can trigger severe reactions like breathing difficulties, whereas intolerances are often due to enzyme deficiencies and typically cause gastrointestinal discomfort.", "source": "Term 3 · Food for Specific Needs: Quiz 8 Allergies and Intolerances", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "pdh-023", "topic": "Road safety · Novice driver risk", "difficulty": "medium", "type": "mcq", "stem": "A 17-year-old driver on a P1 licence is how much more likely to be involved in a fatal crash than a driver over 26 years?", "options": ["Ten times as likely", "Two times as likely", "Three times as likely", "Four times as likely"], "answer": 3, "explanation_en": "Marks are awarded for the answer, four times (1 mark), and for giving reasons — unfamiliarity with road conditions, undeveloped hazard perception and a tendency to take risks — for a further 1 mark.", "source": "Term 1 · Lesson 4 Influences on Road Safety · Young People on the Roads", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "engother-004", "topic": "War unit · Identity and youth", "difficulty": "medium", "type": "mcq", "stem": "Read the extract: 'Young men of iron. Young? None of us is more than twenty. But young? Young men? That was a long time ago. We are old now.'\nWhat does this extract most strongly suggest about the soldiers?", "options": ["That they have genuinely forgotten how old they actually are", "That the war has aged them psychologically, so they no longer feel young", "That they are physically the oldest soldiers in the whole regiment", "That they are proud of being described as 'young men of iron'"], "answer": 1, "explanation_en": "The repeated questioning and the phrase 'We are old now' create a paradox: the war has aged the soldiers psychologically, although they are not old in years. An answer should name the techniques involved — rhetorical question + contrast.", "source": "Term 2 · AQWF essay extract — 'the impact of war on a soldier's identity' (Glover 10ENGY)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "hisother-001", "topic": "The Holocaust · Analysing source perspective", "difficulty": "easy", "type": "mcq", "stem": "The Holocaust practice questions set out three steps for 'accounting for the perspective' of a source. After stating what the perspective is, what must you do next?", "options": ["Summarise the source in one sentence without using its evidence", "Explain how the perspective appears in the source and why it is there", "Describe how long the source is, where it was published and who wrote it", "State whether the source is a primary or secondary source"], "answer": 1, "explanation_en": "The material sets out three steps: first, identify the perspective; then explain how that perspective is presented in the source and why; simply summarising content without analysing perspective is a common way to lose marks.", "source": "Term 1 · Practice Questions.pdf — Account for the perspective of Source A", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "car-015", "topic": "Workplace finances · Superannuation", "difficulty": "medium", "type": "mcq", "stem": "In Australia, superannuation is best described as:", "options": ["A tax added to every purchase you make", "A bank fee for keeping a savings account", "A bonus paid to students who finish their Year 12 studies", "Money your employer pays into your retirement fund"], "answer": 3, "explanation_en": "Superannuation is an extra amount that your employer pays into your retirement account. It is a long-term investment for your retirement, it is separate from your take-home pay, and it is not a tax on purchases.", "source": "Week Five- Tax & Super", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "matp-041", "topic": "Statistics · Meaning of standard deviation", "difficulty": "easy", "type": "mcq", "stem": "Two netball teams each score a mean of 24 goals per game over a season. Team A's scores have a standard deviation of 2.1 goals and Team B's have a standard deviation of 6.4 goals. What does this tell you?", "options": ["Team A's scores were more consistent from game to game than Team B's.", "Team B scored more goals in total than Team A.", "Both teams had exactly the same range of scores.", "Team A's standard deviation must be wrong, because both teams have the same mean."], "answer": 0, "explanation_en": "The standard deviation measures the spread of the data around the mean: when two means are equal, a larger standard deviation means more variation in the scores, so Team A is the more consistent team. Standard deviation is unrelated to the total score and is not the same as the range, so the first two options cannot be concluded.", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation · 2025 BBHS 10 (5.2) T2 Ana (IntDep+Alg+Data+Pav).pdf Q7(e)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "sciother-025", "topic": "Climate · Identifying greenhouse gases", "difficulty": "easy", "type": "mcq", "stem": "Which gas is a colourless, odourless, incombustible greenhouse gas formed during respiration, combustion and the breakdown of dead organic material?", "options": ["Carbon dioxide", "Methane", "Nitrogen", "Argon"], "answer": 0, "explanation_en": "The answer is carbon dioxide, as methane is combustible and nitrogen and argon are not the main greenhouse gases or products.", "source": "Term 3 · Climate Science – 2020 Year 10 Yearly Examination Answers(Part B Q2)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"topic": "Organic chemistry · Combustion products", "difficulty": "easy", "type": "mcq", "stem": "A hydrocarbon burns completely in excess oxygen. Which two products are formed?", "options": ["Ethanol and carbon dioxide", "Carbon and oxygen", "Carbon monoxide and hydrogen", "Carbon dioxide and water"], "answer": 3, "explanation_en": "Complete combustion involves a hydrocarbon reacting with O₂ to produce CO₂ and H₂O, but incomplete combustion with insufficient oxygen produces CO and carbon black.", "id": "sci-033", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sciother-005", "topic": "Genetics · What a gene is", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines a gene?", "options": ["A whole chromosome containing many genes", "An inherited disease passed on to offspring", "A section of DNA that codes for a protein", "A compound that stores energy in all cells"], "answer": 2, "explanation_en": "A gene is a segment of DNA that encodes a protein. A chromosome is a form of DNA organisation (23 pairs in humans), and DNA is composed of nucleotides; the three are not at the same level.", "source": "Term 1 · Genetics – Revision Booklet(Topic 8 Genetics · Terminology)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "maths53-020", "topic": "Coordinate geometry · Gradient from two points", "difficulty": "easy", "type": "mcq", "stem": "Find the gradient of the line passing through (2, −1) and (6, 7).", "options": ["−2", "1/2", "4", "2"], "answer": 3, "explanation_en": "m = (y₂−y₁)/(x₂−x₁) = (7−(−1))/(6−2) = 8/4 = 2; the numerator is 7 minus −1 equals 8, the sign is easiest to get wrong.", "source": "Coordinate Geometry · 3.01 Length, midpoint and gradient of an interval (Ex 3.01, p.62)", "fig onses (Sample Answers).pdf — The Danger Zone(Industry Example)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "matp-015", "topic": "Coordinate geometry · Distance", "difficulty": "easy", "type": "mcq", "stem": "Find the distance between the points (2, −1) and (5, 3).", "options": ["√7", "25", "7", "5"], "answer": 3, "explanation_en": "d = √[(5−2)² + (3−(−1))²] = √(9+16) = √25 = 5. Forgetting to take the square root results in 25, and adding the differences directly gives 7.", "source": "Topic 1 Coordinate Geometry.pdf · 2-01 Length, midpoint and gradient of an interval", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Points (2, minus 1) and (5, 3)\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"118.9\" y1=\"20\" x2=\"118.9\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"181.7\" y1=\"20\" x2=\"181.7\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"244.6\" y1=\"20\" x2=\"244.6\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"307.4\" y1=\"20\" x2=\"307.4\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"370.3\" y1=\"20\" x2=\"370.3\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"433.1\" y1=\"20\" x2=\"433.1\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"496.0\" y1=\"20\" x2=\"496.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"298.0\" x2=\"496\" y2=\"298.0\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"258.3\" x2=\"496\" y2=\"258.3\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"218.6\" x2=\"496\" y2=\"218.6\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\
