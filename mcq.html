es.", "source": "Term 1 · Food Inequity Assignment (Part 1 – Define)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "pdh-019", "topic": "First aid · DRSABCD order", "difficulty": "easy", "type": "mcq", "stem": "In the DRSABCD action plan, what must you do FIRST before attending to a casualty?", "options": ["Check the area is safe for you, bystanders and the casualty", "Check for a response by squeezing their shoulders firmly", "Start chest compressions on the casualty straight away", "Send another person to dial triple zero (000) straight away"], "answer": 0, "explanation_en": "Marks are awarded for the sequence (1 mark — D comes first) and the reason (1 mark — the rescuer's safety comes first). D stands for Danger, not Defibrillation.", "source": "Term 3 · Lesson 5 First Aid · DANGER", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "engother-005", "topic": "War unit · Rhetorical questions", "difficulty": "medium", "type": "mcq", "stem": "Read the extract: 'Like an emptying tube, after a couple of minutes he collapses. What good is it to him now that he was such a good mathematician at school?'\nThe rhetorical question mainly works to:", "options": ["Suggest that Leer had never been a good student", "Praise Leer's achievements at school before he dies", "Emphasise how pointless his education now seems", "Blame Leer himself for the injury that kills him"], "answer": 2, "explanation_en": "The rhetorical question sets 'being good at maths' beside 'dying' and implies that the skill is now useless, which heightens the absurdity of war and the waste of life — a typical example of pathos.", "source": "Term 2 · AQWF essay extract — Leer's death passage (Glover 10ENGY)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"topic": "Organic chemistry · Alkane formula", "difficulty": "easy", "type": "mcq", "stem": "Which general formula correctly represents the alkanes?", "options": ["CnH2n+2", "CnH2n", "CnH2n-2", "CnH2n+1OH"], "answer": 0, "explanation_en": "Alkanes are saturated hydrocarbons, with only single bonds between carbon atoms, and have the general formula CnH2n+2; alkenes have one double bond and the formula CnH2n, and alcohols have the formula CnH2n+1OH.", "id": "sci-028", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "maths53-037", "topic": "Probability · Venn (overlapping events)", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play tennis and 7 play both. How many students play neither sport?", "options": ["7 students", "5 students", "0 students", "23 students"], "answer": 0, "explanation_en": "First, find the union: 18 + 12 − 7 = 23 people can do at least one activity, then use 30 − 23 = 7 to find those who can do neither; 23 is the number of people who can do 'at least one activity' (forgetting to subtract from the total), 5 is the number who can only play tennis (12 − 7), and 0 is the result of directly using 18 + 12 = 30 as the union (double-counting 7 people) and then subtracting 30 from 30.", "source": "Chapter 12 Probability · 12.02 Venn diagrams", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-011", "topic": "Logarithms · Definition", "difficulty": "easy", "type": "mcq", "stem": "Evaluate log₃ 81.", "options": ["4", "27", "1/4", "3"], "answer": 0, "explanation_en": "log₃81 asks '3 to the power of what equals 81?'. Since 3⁴ = 81, the answer is 4 — do not confuse it with the division 81 ÷ 3.", "source": "Chapter 7 Equations and logarithms · 7.09 Logarithms (p.270)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "car-010", "topic": "Career planning · Action plan", "difficulty": "easy", "type": "mcq", "stem": "The career action plan has four sections. Which set lists them correctly?", "options": ["My Budget, My Tax, My Super, My Bank", "My Profile, My Goals and Plans, My Progress, My Review", "My Subjects, My Marks, My School, My Teacher", "My Resume, My Interview, My Salary, My Holidays"], "answer": 1, "explanation_en": "The action plan has four parts — my profile, my goals and plans, my progress and my review — and it helps you see where you are now and which experiences you still lack.", "source": "Career action plan(There are 4 sections to the action plan)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "matp-031", "topic": "Statistics · Interquartile range", "difficulty": "easy", "type": "mcq", "stem": "Find the interquartile range of the data set 4, 7, 7, 9, 12, 15, 15, 18, 20, 22.", "options": ["18", "11", "13.5", "8"], "answer": 1, "explanation_en": "With n = 10, the median is (12+15)/2 = 13.5; the lower quartile Q1 is 7 and the upper quartile Q3 is 18, so the IQR is 18 − 7 = 11. Choosing 13.5 is incorrect because it's the median, not the IQR.", "source": "Topic 1 Investigating Data.pdf · 5-02 Quartiles and interquartile range", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Networks · Eulerian circuit", "difficulty": "medium", "type": "mcq", "stem": "A connected network has vertices with degrees 2, 2, 4, 2, 2. Which statement is true?", "options": ["It has an Eulerian circuit because every vertex has even degree", "It has exactly one odd vertex", "It cannot be drawn without lifting the pen", "It has no Eulerian circuit"], "answer": 0, "explanation_en": "If every vertex has an even degree, the graph has an Eulerian circuit: start anywhere, traverse each edge once and return to the starting point. If any vertex has an odd degree, that is not possible.", "source": "Yearly Study Guide 2026 · Mathematics Standard(Eulerian trails and circuits)", "id": "matp-045", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "maths53-032", "topic": "Trigonometry · Area of a triangle", "difficulty": "easy", "type": "mcq", "stem": "Find the area of a triangle with two sides of 8 cm and 11 cm and an included angle of 30°.", "options": ["88 cm²", "11 cm²", "44 cm²", "22 cm²"], "answer": 3, "explanation_en": "The area is ½ab·sinC = ½×8×11×sin30° = 44×0.5 = 22 cm². Forgetting to multiply by ½ would give 44, which is a common mistake.", "source": "Non-right Angled Trigonometry · 9.11 Area of a triangle (Ex 9.11)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "engother-001", "topic": "Core concepts · Bias", "difficulty": "easy", "type": "mcq", "stem": "Which term from the unit glossary means 'a preconceived opinion that is not based on reason or actual experience'?", "options": ["Prejudice", "Justice", "Ethics", "Empathy"], "answer": 0, "explanation_en": "The Term 3 vocabulary list defines prejudice as 'a preconceived opinion that is not based on reason or experience'. Empathy is understanding and sharing the feelings of others, ethics is a system of moral principles, and justice is fairness.", "source": "Term 3 · Justice, Ethics and Morality — Key Definitions glossary (10ENGA)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "sport-003", "topic": "Ball sport rules · Beach volleyball", "difficulty": "easy", "type": "mcq", "stem": "How many players are on each team in beach volleyball?", "options": ["6", "2", "1", "4"], "answer": 1, "explanation_en": "Beach volleyball has 2 players on each team. The court is smaller and there is no rotation or substitution, unlike indoor volleyball, which has 6 players per team.", "source": "Bally Volleyball (2021 indoor and beach teams) + syllabus knowledge", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "his-006", "topic": "Terms · Pre-emption", "difficulty": "easy", "type": "mcq", "stem": "In the Bush Doctrine, pre-emption means:", "options": ["Striking first at a state or group judged to pose a future threat", "Intervening to stop a government killing its own citizens", "Working through alliances so no single state decides on war", "Waiting for an attack, then responding with UN approval"], "answer": 0, "explanation_en": "Pre-emption involves taking military action before a threat materialises, which is a key difference between the Bush Doctrine and collective security or humanitarian intervention.", "source": "Term 4 · Yearly Assessment Notification — Section One(Pre-emption)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"topic": "Climate · FLICC · Fake experts", "difficulty": "medium", "type": "mcq", "stem": "A blog cites 'a retired physicist' with no climate science background as proof that CO₂ does not trap heat. Which FLICC technique is this?", "options": ["Conspiracy theory", "Impossible expectations", "Fake experts", "Cherry picking"], "answer": 2, "explanation_en": "Fake experts are used to create the illusion of 'expert controversy' by using people without relevant field credentials; judge them based on their research field and peer review record, not just their title.", "source": "Yearly Study Guide 2026 · Geography Section I(FLICC)", "id": "geo-011", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "sciother-032", "topic": "Organic chemistry · Naming branches", "difficulty": "hard", "type": "mcq", "stem": "What is the correct IUPAC name of the compound CH₃–CH(CH₃)–CH₂–CH₃?", "options": ["2-methylbutane", "3-methylpentane", "3-methylbutane", "2-methylpropane"], "answer": 0, "explanation_en": "The longest carbon chain has 4 carbon atoms (butane), with a methyl branch attached to the 2nd carbon; numbering must start from the end closest to the branch to get the smallest possible position number, so it's 2-methylbutane, and 3-methylbutane is an incorrect name for the same molecule numbered from the other end.", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet(Part G Q12)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "pdh-030", "topic": "Gambling · Four influences", "difficulty": "medium", "type": "mcq", "stem": "What are the four main influences on a young person's attitude to gambling identified in the lesson?", "options": ["Advertising, friends, easy access and gambling-like games", "Cost, transport, language barriers and long waiting times", "Personality, fatigue, alcohol use and speeding", "Family income, suburb, age and gender of the player"], "answer": 0, "explanation_en": "Marks are awarded for each of the four items (1 mark each, 4 marks): advertising, whether friends gamble (peer pressure), ease of access, and games that look like gambling. 'Cost, transport, language barriers and long waiting times' are barriers to health services, and 'personality, fatigue, alcohol use and speeding' are the Fatal Five of road safety, which students often confuse with this question.", "source": "Term 1 · Lesson 8 Gambling · Potential Influences on Gambling (explicitly required by Study Guide Section 2)", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "sciother-026", "topic": "Climate · Mitigation and adaptation", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is an example of an adaptation strategy rather than a mitigation strategy?", "options": ["Capturing and storing carbon dioxide from power stations", "Building wind farms to generate electricity without coal", "Installing solar panels on the roofs of houses", "Painting roofs white to mimic the albedo effect"], "answer": 3, "explanation_en": "Mitigation involves reducing emissions and stabilising atmospheric greenhouse gas concentrations, while adaptation involves reducing social vulnerability to the impacts that are already happening.", "source": "Term 3 · Climate Science – Revision Booklet(Topic 6 · Mitigation / Adaptation strategies)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "geoother-007", "topic": "Geographical skills · Area and grid references", "difficulty": "medium", "type": "mcq", "stem": "Which statement correctly distinguishes an area reference (AR) from a grid reference (GR)?", "options": ["An AR uses four figures for a square; a GR uses six for a point", "An AR uses six figures for a point; a GR uses four for a grid square", "An AR gives elevation in metres; a GR gives distance in km", "An AR is used on small-scale maps; a GR only on précis maps"], "answer": 0, "explanation_en": "An AR uses four digits to locate a square of about 1 km × 1 km, while a GR uses six digits to locate a specific point inside that square, accurate to 100 m. Do not mix up the order of the digits.", "source": "Term 1 · Weeks 3–4 Topographic Skills — AR, GR and elevation", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "eng-029", "topic": "Comparative essay · Theme: law failing", "difficulty": "easy", "type": "mcq", "stem": "Which pair of moments best supports the claim that both texts show the law failing?", "options": ["The novel shows a young child learning about her neighbours, and the film shows two agents slowly learning about a small town.", "The novel criticises the town's gossip about Boo Radley, and the film criticises the way the agents speak to local people.", "Tom Robinson is convicted despite Atticus's defence, and the film's inquiry begins only because local police are implicated.", "Scout narrates the trial from the gallery, and the film's opening shows two water fountains side by side in the street."], "answer": 2, "explanation_en": "Evidence of 'legal failure' must directly relate to the justice system: Tom being found guilty, and the local law enforcement being involved in the case, requiring federal intervention. Other options discuss perspective, rumour, or 'learning about the town', which don't prove legal failure.", "source": "Section 2 · Comparative essay — theme axis: the law fails (10ENGA unit overview; film study context)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "geoother-005", "topic": "Indigenous wellbeing · Circle sentencing", "difficulty": "easy", "type": "mcq", "stem": "Circle sentencing in NSW is best described as:", "options": ["A sentencing process where Elders sit with a magistrate after a guilty verdict", "A separate court that hears only cases involving young offenders", "A police caution given before any charge is laid against an offender", "A process that replaces the court entirely with a community tribunal"], "answer": 0, "explanation_en": "Circle sentencing happens after a guilty verdict: community members and Elders take part in deciding the sentence, which improves cultural appropriateness and reduces reoffending. It does not replace the court, and it is not a pre-trial process.", "source": "Term 2 · Week 2.3 First Nations Justice — Action (circle sentencing)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "hisother-003", "topic": "The Holocaust · Analysing propaganda posters", "difficulty": "hard", "type": "mcq", "stem": "A 1934 Nazi propaganda image shows a Jewish man as greedy and physically repellent while a German family looks healthy and prosperous. Which conclusion is most defensible for a historian?", "options": ["It shows that antisemitism only began in Germany in 1934", "It is too one-sided to be of much use to any historian", "It shows the regime's dehumanising portrayal, not how Jews lived", "It proves German families were wealthier than Jewish families in 1934"], "answer": 2, "explanation_en": "The value of a propaganda poster lies in what it reveals about the intentions of its creators and the stereotypes they promoted, not in the facts it states. Choosing 'no value' is the typical mistake: bias is itself important evidence about Nazi ideology.", "source": "Term 1 · Lesson 1.3 Nazi propaganda & the skill of perspective", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "sci-018", "topic": "Skills · Identifying variables", "difficulty": "easy", "type": "mcq", "stem": "A student investigates how the length of a wire affects its resistance. Which is the dependent variable?", "options": ["The length of the wire", "The temperature of the room", "The resistance of the wire", "The type of wire used"], "explanation_en": "The independent variable is the factor deliberately changed by the experimenter, the dependent variable is the measured result, and the controlled variables are the factors kept constant.", "source": "Identifying Variables.docx (definitions of independent / dependent / controlled variables)", "answer": 2, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sciother-029", "topic": "Organic chemistry · Naming carbon chains", "difficulty": "easy", "type": "mcq", "stem": "Which name is correct for a straight-chain alkane containing six carbon atoms?", "options": ["Hexane", "Hexene", "Heptane", "Pentane"], "answer": 0, "explanation_en": "The prefix hex- indicates 6 carbon atoms, and the suffix -ane indicates an alkane, so it's hexane.", "source": "Term 3 · Organic Chemistry – KATZ - WEEK 3 LESSONS(Lesson 3 Naming Organic Compounds)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "engother-006", "topic": "War unit · Traditional view of war", "difficulty": "medium", "type": "mcq", "stem": "An essay question asks: 'How does Remarque refute traditional notions of war?' What does 'traditional notions of war' refer to?", "options": ["Ideas about the causes of the Treaty of Versailles", "Ideas of honour, glory, duty and patriotic heroism", "Ideas about trench construction and military logistics", "Ideas about how novels should be structured"], "answer": 1, "explanation_en": "Traditional notions of war are the romantic ideas of honour, glory, duty and heroism. Remarque counters that narrative with the harsh realities of blood, fear and meaningless death.", "source": "Term 1 · AQWF additional practice questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "sport-011", "topic": "Fitness training · Terminology", "difficulty": "easy", "type": "mcq", "stem": "In the Week 6 strength routine, students complete 'AMRAP in 20 minutes'. What does AMRAP mean?", "options": ["As many reps or rounds as possible in the set time", "A measured running and pacing test over a set distance", "A mandatory rest period after every repetition", "Alternating muscle recovery with performance work"], "answer": 0, "explanation_en": "AMRAP means as many reps or rounds as possible: you complete as many cycles of the circuit as you can within the set time — 5 superman poses, 10 push-ups and 15 squats — and stop when the time is up.", "source": "Wednesday Sport Remote Learning week 6", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "ftn-003", "topic": "Food safety · 2-hour / 4-hour rule", "difficulty": "medium", "type": "mcq", "stem": "A tray of cooked chicken has been sitting at room temperature for 3 hours. Under the 2-hour/4-hour rule, which action is correct?", "options": ["Return it to the fridge and use it later", "Eat it now, but do not return it to the fridge", "Reheat it, then freeze it for the following week", "Throw the chicken away immediately"], "answer": 1, "explanation_en": "Food that has been in the danger zone for more than 2 hours but less than 4 hours can still be eaten, but it cannot go back into the fridge; only food that has been out for less than 2 hours may be refrigerated.", "source": "Structured Responses (Sample Answers).pdf — The 2-Hour / 4-Hour Rule", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "maths53-024", "topic": "Simultaneous equations · Line and parabola", "difficulty": "medium", "type": "mcq", "stem": "Find the points of intersection of the parabola y = x² and the line y = x + 2.", "options": ["(2, 4) and (1, 3)", "(2, 4) only", "(2, 4) and (−1, 1)", "(−1, 1) and (2, −4)"], "answer": 2, "explanation_en": "Let x² = x + 2, then x²−x−2=0, which is (x−2)(x+1)=0, so x = 2 or −1; substituting these values back in to find y gives the points (2,4) and (−1,1). Both intersection points should be written, not just the positive root.", "source": "Chapter 11 · 11.09 Non-linear simultaneous equations (Ex 11.09)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Parabola y equals x squared and line y equals x plus 2\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"101.5\" y1=\"20\" x2=\"101.5\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"177.4\" y1=\"20\" x2=\"177.4\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"253.2\" y1=\"20\" x2=\"253.2\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"329.1\" y1=\"20\" x2=\"329.1\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"405.0\" y1=\"20\" x2=\"405.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"480.8\" y1=\"20\" x2=\"480.8\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"280.6\" x2=\"496\" y2=\"280.6\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"245.9\" x2=\"496\" y2=\"245.9\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"211.1\" x2=\"496\" y2=\"211.1\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"176.4\" x2=\"496\" y2=\"176.4\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line " stroke=\"var(--surface-secondary)\" stroke-width=\"3.5\" stroke-linejoin=\"round\">(2, 4)</text></svg>", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "ftn-001", "topic": "Food safety · Temperature danger zone", "difficulty": "easy", "type": "mcq", "stem": "What is the temperature range of the food safety 'danger zone'?", "options": ["5°C to 60°C", "−18°C to 4°C", "0°C to 5°C", "60°C to 100°C"], "answer": 0, "explanation_en": "The danger zone for bacterial growth is 5°C–60°C, where harmful bacteria multiply fastest. Temperatures below 0°C only slow growth down; they do not kill the bacteria.", "source": "Structured Responses (Sample Answers).pdf — The Danger Zone", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "cw-007", "topic": "Emotional regulation · Anger iceberg", "difficulty": "medium", "type": "mcq", "stem": "The Anger page uses the idea of an 'iceberg' to explain anger. What does the metaphor mean?", "options": ["Anger only comes from external events, such as a traffic jam, never our own thoughts.", "Anger is the visible emotion, often hiding embarrassment, sadness or jealousy.", "Anger is always a sign of an anxiety disorder or another mental illness.", "Anger cannot really be managed, so it should be suppressed at all times."], "answer": 1, "explanation_en": "The point of the iceberg analogy is that anger is what shows on the surface, while embarrassment, frustration, sadness and jealousy sit underneath, so you have to identify the underlying emotion before you can deal with it. The material also states clearly that suppressing anger is not the answer — learning to manage it is.", "source": "Anger(Why am I angry? — anger iceberg; external and internal events)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "geo-025", "topic": "Management · Prevent / mitigate / prepare", "difficulty": "easy", "type": "mcq", "stem": "Which set correctly matches the three management categories taught in Lessons 3.1–3.2?", "options": ["Prevention — planning response; mitigation — stopping change; preparedness — reducing impact", "Prevention — stopping change; mitigation — reducing impact; preparedness — planning response", "Prevention — reducing impact; mitigation — planning response; preparedness — stopping change", "All three categories describe the same action taken at different scales"], "answer": 1, "explanation_en": "Prevention stops the problem from arising, mitigation reduces the impact of change, and preparedness plans the response to an event. The category a strategy belongs to decides the standard it is evaluated against, so do not mix them up.", "source": "Term 3 · Lessons 3.1–3.2 Sustainable Management of Coastal Ecosystems", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "matp-030", "topic": "Statistics · Shape of distributions", "difficulty": "easy", "type": "mcq", "stem": "A data distribution has a long tail extending towards the higher scores. How is this distribution described?", "options": ["Symmetrical", "Negatively skewed", "Bimodal", "Positively skewed"], "answer": 3, "explanation_en": "A positively skewed distribution has its tail pointing to the high score side, while a negatively skewed distribution has its tail pointing to the low score side. The easiest way to remember this is by the phrase 'the tail swings to the side it's biased to'.", "source": "Topic 1 Investigating Data.pdf · 5-01 The shape of a frequency distribution", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "out-002", "topic": "Ecosystems · Biotic and abiotic factors", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is an ABIOTIC factor in an ecosystem?", "options": ["Fungi breaking down leaves", "Bacteria living in soil", "Kangaroos grazing on grass", "Sunlight and soil moisture"], "answer": 3, "explanation_en": "Abiotic means non-living: sunlight, water, soil, temperature and so on. Biotic refers to living organisms — fungi and bacteria are invisible to the naked eye, but they are alive and therefore biotic. That distinction is where marks are most commonly lost.", "source": "Study Guide · Lesson 2 Ecosystems and Interactions", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "sciother-006", "topic": "Genetics · Complementary base pairing", "difficulty": "easy", "type": "mcq", "stem": "A section of DNA has the base sequence AGT TAC CTG. What is the sequence of the complementary DNA strand?", "options": ["TCA ATG GAC", "UCA AUG GGC", "AGT TAC CTG", "AGU UAC CUG"], "answer": 0, "explanation_en": "Complementary DNA base pairing is A–T and G–C, so AGT pairs with TCA, TAC with ATG and CTG with GAC. Any option containing U is an mRNA sequence, not a complementary DNA strand.", "source": "Term 1 · Genetics – 2020 Year 10 Yearly Examination Answers(Part D Q3)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"topic": "Organic chemistry · Isomers", "difficulty": "hard", "type": "mcq", "stem": "Butane and 2-methylpropane both have the molecular formula C4H10. They are best described as:", "options": ["Isotopes", "Polymers", "Allotropes", "Isomers"], "answer": 3, "explanation_en": "Isomers have the same molecular formula but different structures; butane is a straight chain, and 2-methylpropane is a branched chain; isotopes are atoms of the same element with different numbers of neutrons, allotropes are different forms of the same element, and polymers are large molecules made up of many smaller molecules.", "id": "sci-032", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "maths53-009", "topic": "Indices · Fractional and negative", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 27^(−2/3).", "options": ["1/6", "−1/9", "−9", "1/9"], "answer": 3, "explanation_en": "27^(1/3) = 3, and squaring that gives 9. The negative index turns the result into its reciprocal, giving 1/9. A negative index means the reciprocal only — not a negative result.", "source": "Chapter 5 Indices · 5.02 Fractional indices (Ex 5.02)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "ftn-016", "topic": "Special dietary needs · Iron-deficiency anaemia", "difficulty": "medium", "type": "mcq", "stem": "Iron-deficiency anaemia is best managed by including more of which foods in the diet?", "options": ["Foods high in vitamin C only, such as citrus fruit and juice", "Foods high in calcium, such as milk and cheese", "Iron-rich foods such as red meat, legumes and leafy greens", "Refined white flour products such as white bread"], "answer": 2, "explanation_en": "The dietary focus for iron-deficiency anaemia is on increasing iron intake, with red meat, legumes and dark leafy greens being common sources. Vitamin C improves iron absorption, but it is not a source of iron itself.", "source": "Term 3 · Food for Specific Needs: Quiz 8A Anaemia", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "matp-002", "topic": "Finance · Compound interest (monthly)", "difficulty": "medium", "type": "mcq", "stem": "Sophie deposits $1,200 into a savings account that earns 5% per annum, compounded monthly. How much will she have in the account after 3 years?", "options": ["$1,380.00", "$1,458.61", "$1,389.15", "$1,393.77"], "answer": 3, "explanation_en": "For monthly compounding, convert both the interest rate and the number of periods to months: R=0.05/12, n=3×12=36, A=1200(1+0.05/12)^36≈$1,393.77; using simple interest gives $1,380, and using 5% as the annual interest rate with only 3 compounding periods gives $1,389.15, both of which are common mistakes.", "source": "1-04_ Compound Interest.pdf · A = P(1 + R)^n (R is the rate per period)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "his-003", "topic": "Terms · Unilateralism", "difficulty": "medium", "type": "mcq", "stem": "A government repeatedly insists it will act alone when allies disagree, even at the cost of isolation. This pattern of behaviour is best described as:", "options": ["Humanitarian intervention — force to protect civilians", "Collective security — allies respond together", "Unilateralism — the habit of acting alone by choice", "Multilateralism — several states act together"], "answer": 2, "explanation_en": "Unilateralism is a preference or habit where a country takes action alone despite knowing its allies oppose it, which is the opposite of collective security and multilateralism.", "source": "Term 4 · Yearly Assessment Notification — Section One(Unilateralism)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "engother-009", "topic": "Poetry unit · Themes in Mending Wall", "difficulty": "medium", "type": "mcq", "stem": "Which Frost poem studied in Term 2 is built around two neighbours repairing a stone wall between their properties?", "options": ["'Mending Wall'", "'Birches'", "'Stopping by Woods on a Snowy Evening'", "'The Road Not Taken'"], "answer": 0, "explanation_en": "The central situation of 'Mending Wall' is two neighbours repairing the stone wall between their properties each spring; the wall becomes a way of discussing boundaries and tradition, and gives the poem its key line, 'Good fences make good neighbours'.", "source": "Term 2 · Robert Frost Poetry — Mending Wall, poem and questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "maths53-027", "topic": "Graphs · Exponential curve", "difficulty": "easy", "type": "mcq", "stem": "Which statement describes the graph of y = 3ˣ?", "options": ["It passes through (0, 1) and has the x-axis as an asymptote.", "It passes through (1, 0) and has the y-axis as an asymptote.", "It passes through (0, 3) and has the line y = 3 as an asymptote.", "It passes through (0, 0) and has no asymptote."], "answer": 0, "explanation_en": "Any curve y = aˣ passes through (0,1) because a⁰=1; as x approaches negative infinity, y approaches 0, so the x-axis is the asymptote. It never equals 0, so there is no x-intercept.", "source": "Chapter 8 Graphing curves · 8.12 The exponential curve y = aˣ (Ex 8.12)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Exponential curve y = 3 to the power x\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"76.0\" y1=\"20\" x2=\"76.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"126.0\" y1=\"20\" x2=\"126.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"176.0\" y1=\"20\" x2=\"176.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"226.0\" y1=\"20\" x2=\"226.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"276.0\" y1=\"20\" x2=\"276.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"326.0\" y1=\"20\" x2=\"326.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"376.0\" y1=\"20\" x2=\"376.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"426.0\" y1=\"20\" x2=\"426.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"476.0\" y1=\"20\" x2=\"476.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"272.7\" x2=\"496\" y2=\"272.7\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"222.2\" x2=\"496\" y2=\"222.2\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"171.6\" x2=\"496\" y2=\"171.6\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"121.1\" x2=\"496\" y2=\"121.1\" stroke=\"var(--border)  deductible: $680 for tools + $150 for donations + $120 for tax agent fees = $950, so the taxable income is $61,960. Private school fees and fines are not allowable deductions, and deducting them results in an incorrect answer of $56,740.", "source": "1-02_ Income tax.pdf(Taxable income = gross income − allowable deductions)· 2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Organic chemistry · Naming", "difficulty": "easy", "type": "mcq", "stem": "What is the IUPAC name of the compound CH3–CH2–CH3?", "options": ["Butane", "Methane", "Ethane", "Propane"], "answer": 3, "explanation_en": "The three-carbon alkane is propane; methane has one carbon, ethane has two, and butane has four.", "id": "sci-029", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "his-009", "topic": "Terms · Unilateral vs multilateral", "difficulty": "medium", "type": "mcq", "stem": "In 2003 State A went to war with a small group of allies after failing to win UN Security Council support, while State B sent troops to a UN-authorised mission. Which pairing is correct?", "options": ["A — humanitarian intervention; B — collective security", "A — collective security; B — humanitarian intervention", "A — unilateral action; B — multilateral action", "A — multilateral action; B — unilateral action"], "answer": 2, "explanation_en": "The criterion for judgement is whether there is widespread authorisation: A is unilateral as it involves a small group of allies and bypasses the UN Security Council, while B is multilateral as it involves a UN- authorised mission.", "source": "Term 4 · Yearly Assessment Notification — Body 2(invasion of Iraq)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "maths53-034", "topic": "Trigonometry · Cosine rule (side)", "difficulty": "medium", "type": "mcq", "stem": "In a triangle, two sides of 7 cm and 9 cm include an angle of 120°. Find the third side, correct to 1 decimal place.", "options": ["8.2 cm", "13.9 cm", "11.4 cm", "15.7 cm"], "answer": 1, "explanation_en": "c² = 7² + 9² − 2(7)(9)cos120° = 49 + 81 + 63 = 193, so c ≈ 13.9 cm. cos120° is negative, so the term −2ab·cosC becomes positive, don't lose the sign.", "source": "Non-right Angled Trigonometry · 9.09 Cosine rule for sides (Ex 9.09)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "car-011", "topic": "Job seeking · Interviews and researching employers", "difficulty": "easy", "type": "mcq", "stem": "Before you apply or interview for a job, what does the course advise you to do about the company?", "options": ["Research its values so you can align your skills", "Bring no documents so you appear confident", "Memorise one answer and use it for every question", "Avoid researching it so your answers sound spontaneous"], "answer": 0, "explanation_en": "The course advises researching the company: understand its motto and values, then match your skills to them so that the application is targeted. Not doing that research is a common mistake.", "source": "Week Ten- Submitting Your Resume & Cover Letter(NOTE: do your research on the company)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "ftn-008", "topic": "Food equity · Charities", "difficulty": "medium", "type": "mcq", "stem": "Which Australian organisation was listed in the Term 1 assignment as a charity that rescues surplus food and redistributes it to people experiencing food insecurity?", "options": ["MasterChef Australia", "Fair Work Australia", "Woolworths", "OzHarvest"], "answer": 3, "explanation_en": "OzHarvest is an Australian food-rescue charity: it collects surplus food from businesses and distributes it to people in need. Woolworths, by contrast, is a supermarket chain and Fair Work is a workplace regulator, neither of which is a charity.", "source": "Term 1 · Food Inequity Assignment (Part 1 – charity list) (charity functions supplemented from syllabus knowledge)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "matp-020", "topic": "Functions · Inverse proportion", "difficulty": "medium", "type": "mcq", "stem": "y is inversely proportional to x. When x = 5, y = 8. Find y when x = 20.", "options": ["160", "32", "0.5", "2"], "answer": 3, "explanation_en": "For inverse proportion, write y = k/x, find k = 40 from 5×8, then when x = 20, y = 40/20 = 2, not 32.", "source": "Topic 1 Graphs.pdf · 7-02 Inverse proportion", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Climate · Synoptic charts · High pressure", "difficulty": "easy", "type": "mcq", "stem": "An area of high pressure on a synoptic chart is usually associated with:", "options": ["Thunderstorms", "Clear skies and settled weather", "Heavy rain and strong winds", "A cold front passing"], "answer": 1, "explanation_en": "High-pressure systems have sinking air, which is less likely to form clouds and rain, resulting in stable and clear weather; low-pressure systems have rising air, which easily forms clouds and precipitation.", "source": "Yearly Study Guide 2026 · Geography Section I(skills · synoptic charts)", "id": "geo-009", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Synoptic chart showing a high pressure centre and a low pressure centre\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0 0.0,340.0 0.0,0.0\" fill=\"var(--surface)\" fill-opacity=\".65\" stroke=\"none\"/><polyline points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0\" fill=\"none\" stroke=\"var(--border-strong)\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"175.9,146.0 176.4,148.4 176.6,150.8 176.5,153.3 176.0,155.7 stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">L</text><text x=\"508.0\" y=\"330.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"text-anchor=\"end\"letter-spacing=\"1.6\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">TASMAN SEA</text><text x=\"22.0\" y=\"316.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">NSW coast</text></svg>", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "ftn-015", "topic": "Special dietary needs · Osteoporosis", "difficulty": "easy", "type": "mcq", "stem": "Which two nutrients are most important for reducing the risk of osteoporosis?", "options": ["Iron and vitamin C", "Protein and vitamin B12", "Sodium and potassium", "Calcium and vitamin D"], "answer": 3, "explanation_en": "Calcium is the main mineral in bone, and vitamin D helps the body absorb it. A lack of either raises the risk of osteoporosis, and calcium taken without vitamin D is absorbed less efficiently.", "source": "Term 3 · Food for Specific Needs: Quiz 11 Osteoporosis", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "engother-010", "topic": "Poetry unit · Duty and temptation", "difficulty": "easy", "type": "mcq", "stem": "The exam study materials say an imaginative response may draw on 'the central idea of obligation and responsibility' from 'Stopping by Woods on a Snowy Evening'. Which situation best matches that idea?", "options": ["Two neighbours arguing about who owns the strip of land between them", "A traveller lingers in beautiful woods but remembers his promises", "A speaker boasting that he took the difficult path", "A child swinging on birch trees and dreaming of escape"], "answer": 1, "explanation_en": "The material stresses that the poem's core is obligation and responsibility: the traveller is drawn to the snowy woods but remembers his 'promises to keep' and travels on. 'Birches' corresponds to childhood and escape, 'Mending Wall' to neighbourly boundaries, and 'The Road Not Taken' to choice.", "source": "Year 10 English 2026 — YEAR 10 EXAM STUDY MATERIALS (Frost imaginative prompts)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "car-008", "topic": "Job seeking · Cover letter length", "difficulty": "medium", "type": "mcq", "stem": "According to the cover letter resource, an appropriate length for a cover letter is about:", "options": ["50 to 100 words", "250 to 400 words", "Same as the resume", "800 to 1000 words"], "answer": 1, "explanation_en": "The course sets a limit of 250–400 words, and the letter should focus on 'why you're applying, what you can offer, and how you'll follow up'; writing a long essay is exactly what the course warns against.", "source": "Writing a cover letter(The Cover Letter)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "sciother-021", "topic": "Nuclear reactions · Isotopes", "difficulty": "easy", "type": "mcq", "stem": "Carbon-12 and carbon-14 are both atoms of carbon. How do the two atoms differ?", "options": ["The number of electrons in a neutral atom", "The number of protons", "The number of neutrons", "The number of electron shells"], "answer": 2, "explanation_en": "Isotopes refer to atoms of the same element with the same number of protons but different numbers of neutrons.", "source": "Term 2 · Nuclear Reactions – atomic_models_interactive_v2.html(Isotopes)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "out-009", "topic": "Sustainable practice · High-impact camping", "difficulty": "medium", "type": "mcq", "stem": "Which camper behaviour is a HIGH-IMPACT practice?", "options": ["Carrying all your own rubbish out in a sealed bag", "Cutting branches from live trees for a campfire", "Using a fuel stove instead of lighting a fire", "Camping in an already established campsite"], "answer": 1, "explanation_en": "Cutting live branches for firewood damages vegetation and habitat directly and raises the risk of bushfire, so it is a high-impact action. Using a fuel stove, camping on an established site and carrying out all your rubbish are low-impact practices.", "source": "Study Guide · Lesson 4 Sustainable Practices and Camping Impact", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "eng-026", "topic": "Comparative essay · Integrating quotations", "difficulty": "medium", "type": "mcq", "stem": "You want to use one line from the supplied extract in a body paragraph. Which approach integrates it most effectively?", "options": ["Quote the whole extract so the marker can see you have read it, then explain what it means.", "Paraphrase the extract without quoting, because quotations take up too much of your word count.", "Quote the line, then say that it shows the theme of justice without explaining how the words create that effect.", "Quote only the few words that carry the technique, then analyse how they shape meaning in the whole text."], "answer": 3, "explanation_en": "Integration means embedding short quotes into your own sentences, analysing how the language creates meaning, and linking it back to the whole text and question. Copying a whole paragraph is just repetition, paraphrasing alone loses the language evidence, and quoting without analysis earns no analysis marks.", "source": "Section 2 · Comparative essay — integrating the supplied extract (LEEDER 10ENGB exam outline, 20 marks)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "maths53-041", "topic": "Probability · Conditional probability", "difficulty": "medium", "type": "mcq", "stem": "A bag contains 4 red and 6 blue marbles. One marble is drawn at random and not replaced. Given that the first marble was red, what is the probability that the second marble is blue?", "options": ["3/5", "2/5", "2/3", "1/3"], "answer": 2, "explanation_en": "Given the first ball is red and not replaced, there are 3 red and 6 blue balls left out of 9, so P(second ball is blue | first ball is red) = 6/9 = 2/3; 3/5 is the mistake of not changing the total from 10 to 9 (6/10), 1/3 is the mistake of considering the remaining red balls (3/9), and 2/5 is the probability of drawing a red ball first (4/10).", "source": "Chapter 12 Probability · 12.07 Conditional probability", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "cw-002", "topic": "Where to get help · 24-hour helplines", "difficulty": "easy", "type": "mcq", "stem": "It is 11 pm on a Sunday and you feel overwhelmed and want to talk to someone right now. Which service offers free, confidential crisis support at any hour?", "options": ["SSO Sara at school", "The counsellor's office", "Your year adviser by email", "Lifeline on 13 11 14"], "answer": 3, "explanation_en": "Lifeline on 13 11 14 gives free, confidential crisis support 24/7, whereas school counsellors, SSOs and Year Advisers are only available during business hours — so at night the hotline is the option.", "source": "Urgent Help(Lifeline — 13 11 14, available 24/7)· Support people at school", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "hisother-011", "topic": "Civil rights · Universal Declaration of Human Rights", "difficulty": "easy", "type": "mcq", "stem": "Lesson 1.2 examines the significance of the UDHR. Which description of the UDHR is correct?", "options": ["A 1948 UN declaration of fundamental rights that influenced later conventions", "A treaty signed only by the United States and the Soviet Union in 1948", "A document listing the punishments given at the Nuremberg Trials", "An Australian law passed in 1948 that ended the White Australia Policy"], "answer": 0, "explanation_en": "The Universal Declaration of Human Rights, adopted by the UN General Assembly in 1948, is not a treaty. It provides the normative basis for later human rights conventions and for domestic law, and that is where its significance lies.", "source": "Term 3 · Lesson 1.2 The significance of the UDHR to human rights & freedoms", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "matp-005", "topic": "Algebra · Multiplying terms", "difficulty": "easy", "type": "mcq", "stem": "Simplify 2m × 5m p × 3n.", "options": ["30m np", "30m²np", "10m²np", "30m³np"], "answer": 1, "explanation_en": "The coefficient is 2×5×3 = 30; m×m = m² because the indices are added, and p and n each appear once, giving 30m²np. Treating m×m as 2m gives 10m²np, and treating it as m³ gives the wrong index.", "source": "Topic2 Algebra.pdf · 4-01 The index laws", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "out-003", "topic": "Ecosystems · Definition", "difficulty": "easy", "type": "mcq", "stem": "Which definition of an ecosystem matches the course?", "options": ["A community of living and non-living things interacting", "The physical features of a landscape, such as soil and rain", "A group of animals of the same species in an area", "All the plants that grow in a particular region"], "answer": 0, "explanation_en": "The key to an ecosystem is the combination of 'biotic + abiotic + interactions'. Focusing on the plants, the animals or the non-living environment alone covers only part of it.", "source": "Study Guide · Lesson 2 Ecosystems and Interactions", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "sciother-009", "topic": "Genetics · Frameshift mutation", "difficulty": "medium", "type": "mcq", "stem": "One extra base is inserted into the middle of a gene. Which statement best describes the likely effect on the protein produced?", "options": ["The DNA double helix can no longer be replicated.", "The reading frame shifts, so every codon after that point may code for a different amino acid.", "Only the codon containing the extra base is affected; the rest of the protein is normal.", "There is no effect because the genetic code is degenerate."], "answer": 1, "explanation_en": "Codons are read in groups of three bases, so inserting a single base shifts every codon after it (a frameshift) and usually changes the protein sequence drastically. Only inserting a multiple of three bases affects just one amino acid.", "source": "Term 1 · Genetics – Genetics.pdf(Knowledge 3 · Frameshift - Insertion)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"topic": "Climate · Coastal impacts", "difficulty": "medium", "type": "mcq", "stem": "Which combination most increases coastal erosion risk in eastern Australia?", "options": ["Higher sea level, larger storm surges and more intense East Coast Lows", "Colder ocean temperatures", "Less coastal development", "Lower sea level and weaker storms"], "answer": 0, "explanation_en": "Sea level rise allows the same storm surge to act on a higher base, and the combined effects of storm surge, East Coast Lows, and increased exposure due to coastal development amplify the risk.", "source": "Yearly Study Guide 2026 · Geography(climate change and impacts on coastal environments)", "id": "geo-014", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "maths53-006", "topic": "Expressions · Factorising non-monic quadratics", "difficulty": "hard", "type": "mcq", "stem": "Factorise 6x² + 11x − 35.", "options": ["(2x + 7)(3x − 5)", "(3x − 7)(2x + 5)", "(6x − 5)(x + 7)", "(2x − 7)(3x + 5)"], "answer": 0, "explanation_en": "The product of the first and last terms is 6×(−35) = −210, and the cross term must be +11x. So you need two numbers with a product of −210 and a sum of +11: they are 21 and −10. Then 6x² + 21x − 10x − 35 = 3x(2x + 7) − 5(2x + 7) = (2x + 7)(3x − 5).", "source": "Chapter 5 Products and factors · 5.09 Factorising non-monic quadratic trinomials (Ex 5.09)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "pdh-020", "topic": "First aid · CPR compression ratio", "difficulty": "easy", "type": "mcq", "stem": "When performing CPR on an adult, what is the correct compression-to-breath ratio?", "options": ["15 compressions then 2 breaths", "50 compressions : 5 breaths", "5 compressions : 1 breath", "30 compressions : 2 breaths"], "answer": 3, "explanation_en": "Marks are awarded for the ratio 30:2 (1 mark), and for knowing that CPR can be stopped in only three situations: help arrives, the casualty recovers, or the rescuer is physically unable to continue.", "source": "Term 3 · Lesson 5 First Aid · CPR", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "ftn-010", "topic": "Food trends · Ugly fruit and vegetables", "difficulty": "medium", "type": "mcq", "stem": "Supermarkets selling 'ugly' fruit and vegetables is a trend that mainly aims to:", "options": ["Charge a higher price for imperfect-looking produce", "Reduce food waste by selling produce rejected as ugly", "Replace fresh produce with canned produce", "Encourage farmers to grow fewer vegetables"], "answer": 1, "explanation_en": "This trend targets 'ugly' but perfectly edible produce in order to reduce food waste at the farm and retail level. The selling point is waste reduction, not a higher price.", "source": "Term 2 · Food Trends: Quiz 3 Veggies and Fruit too ugly for the supermarkets", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "matp-033", "topic": "Probability · Venn (at least / neither)", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play basketball and 6 play both. How many students play neither sport?", "options": ["12", "0", "6", "24"], "answer": 2, "explanation_en": "The number of people who can do at least one activity is 18 + 12 − 6 = 24, where the intersection of 6 people is counted twice and must be subtracted. So, the number of people who can do neither activity is 30 − 24 = 6. Forgetting to subtract the intersection results in 0.", "source": "Topic 3 Probability.pdf · 10-02 Venn diagrams", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "out-006", "topic": "Indigenous perspectives · Connection to Country", "difficulty": "easy", "type": "mcq", "stem": "What does 'Connection to Country' mean for Aboriginal and Torres Strait Islander peoples?", "options": ["A legal title to land that allows selling its natural resources", "An agreement with government to manage national parks", "A seasonal camp used for hunting and fishing only", "A spiritual and cultural relationship with land and waterways"], "answer": 3, "explanation_en": "Connection to Country is a spiritual, cultural and environmental relationship in which Country takes in land, water, plants and animals as well as cultural identity. The key idea is that Country is not something to be owned but something to be cared for and protected.", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "maths53-028", "topic": "Graphs · Cubic curves", "difficulty": "medium", "type": "mcq", "stem": "At which values of x does the curve y = (x − 1)(x + 2)(x − 4) cut the x-axis?", "options": ["x = 1, x = 2 and x = 4", "x = 1 only", "x = −1, x = 2 and x = −4", "x = 1, x = −2 and x = 4"], "answer": 3, "explanation_en": "Setting y = 0, each factor equals zero: x−1=0, x+2=0, x−4=0, giving x=1, −2, 4. Note that (x+2) gives −2, and the sign is easy to get wrong.", "source": "Chapter 8 Graphing curves · 8.08 The cubic curve y = a(x − r)(x − s)(x − t) (Ex 8.08)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Cubic y = (x minus 1)(x plus )\" stroke-width=\"1.5\"/><text x=\"285.0\" y=\"194.9\" fill=\"var(--foreground)\" font-size=\"12\" font-weight=\"600\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3.5\" stroke-linejoin=\"round\">1</text><circle cx=\"441.0\" cy=\"178.9\" r=\"3.6\" fill=\"var(--accent)\" stroke=\"var(--surface)\" stroke-width=\"1.5\"/><text x=\"450.0\" y=\"194.9\" fill=\"var(--foreground)\" font-size=\"12\" font-weight=\"600\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3.5\" stroke-linejoin=\"round\">4</text></svg>", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "car-012", "topic": "Aptitude · Multiple intelligences", "difficulty": "medium", "type": "mcq", "stem": "The theory of multiple intelligences suggests that:", "options": ["Intelligence is a single number fixed at birth", "One standard test can measure all of a person's ability", "Only mathematical ability matters for choosing a career", "People are smart in several different ways"], "answer": 3, "explanation_en": "The theory of multiple intelligences holds that people are intelligent in several different ways, which widens the range of careers worth considering, and it argues against judging ability from a single test score.", "source": "Week Two- Multiple Intelligences: Different Ways to be Smart", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "geoother-009", "topic": "Climate change · Cherry-picking", "difficulty": "easy", "type": "mcq", "stem": "In the climate misinformation lessons, 'cherry-picking' as a science-denial technique means:", "options": ["Refusing to accept any scientific evidence whatsoever on the topic", "Choosing only the most reliable long-term dataset available", "Selecting data that support a position while ignoring contrary data", "Repeating an experiment until the results agree with the theory you hold"], "answer": 2, "explanation_en": "Cherry-picking is one of the five FLICC techniques: only the data points that support the position are selected and the overall trend is ignored. The reflection questions in class are designed to make you notice this.", "source": "Term 4 · Lessons 1.1–1.2 Climate misinformation (FLICC) / Lesson 2.1", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-001", "topic": "Human wellbeing · GDP", "difficulty": "easy", "type": "mcq", "stem": "Why do geographers use GDP per capita rather than total GDP when comparing the wellbeing of different countries?", "options": ["It removes the need for any other development measure or index", "It divides GDP by population, so countries of different sizes can be compared", "It measures only the income earned by the very richest people in that country", "It measures the value of unpaid work done inside the household"], "answer": 1, "explanation_en": "GDP per capita is GDP divided by population, which removes the problem that large countries naturally have large totals. It still does not show how evenly income is distributed, though, and it cannot replace an indicator such as HDI.", "source": "Term 1 · Week 2 Global — Measuring and Mapping Human Wellbeing", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "engother-002", "topic": "Core concepts · Empathy", "difficulty": "easy", "type": "mcq", "stem": "According to the unit's key definitions, which statement best defines 'empathy'?", "options": ["A system of moral principles that guides behaviour", "Treating every individual in an equitable and fair way", "The belief that one's own race is superior to another", "Understanding and sharing the feelings of another person"], "answer": 3, "explanation_en": "Empathy is defined in the vocabulary list as 'understanding and sharing the feelings of others'; the other items on the list are ethics, justice, and racism, which need to be distinguished from one another.", "source": "Term 3 · JEM Key Definitions (10ENGA / LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "ftn-011", "topic": "Food trends · Celebrity chefs", "difficulty": "medium", "type": "mcq", "stem": "How do celebrity chefs most directly influence food trends?", "options": ["By writing the national dietary guidelines used in all schools", "By setting the official price of restaurant meals", "By inspecting restaurants for food safety compliance", "By popularising ingredients and dishes through media exposure"], "answer": 3, "explanation_en": "Celebrity chefs popularise particular ingredients or cooking methods through TV shows, social media and recipes, and trends follow. They do not set prices, write dietary guidelines or carry out health inspections.", "source": "Term 2 · Food Trends: Quiz 2 Celebrity Chef", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "engother-003", "topic": "Core concepts · Pathos in war writing", "difficulty": "easy", "type": "mcq", "stem": "The Term 1 unit defines 'the pathos of war' as:", "options": ["The patriotic pride soldiers feel when they enlist", "The strategic and political causes of a particular battle", "The historical timeline of the Western Front from 1914 to 1918", "The deep emotional suffering and human tragedy caused by conflict"], "answer": 3, "explanation_en": "The term 'pathos of war' refers to the deep emotional pain and human tragedy, such as grief, loss, and devastation, that result from conflict, rather than strategic, political or patriotic aspects.", "source": "Term 1 · Pathos of War — All Quiet on the Western Front, introductory definition (10ENGR)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"topic": "Climate · Ocean acidification", "difficulty": "medium", "type": "mcq", "stem": "Ocean acidification occurs because:", "options": ["Coral reefs release acid", "Acid rain falls directly into the sea", "Salt concentration increases", "Carbon dioxide dissolves in seawater forming carbonic acid, lowering pH"], "answer": 3, "explanation_en": "The reaction CO₂ + H₂O → H₂CO₃ (carbonic acid) releases H⁺, decreasing pH; since the Industrial Revolution, the pH of surface seawater has decreased by about 0.1 (an increase in acidity of around 30%).", "source": "Yearly Study Guide 2026 · Geography Section II(ocean acidification)", "id": "geo-006", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "maths53-008", "topic": "Indices · Power of a power", "difficulty": "easy", "type": "mcq", "stem": "Simplify (2x³)⁴.", "options": ["16x¹²", "8x¹²", "16x⁷", "2x¹²"], "answer": 0, "explanation_en": "Both the coefficient and the variable are raised to the fourth power: 2⁴ = 16 and (x³)⁴ = x¹², so the answer is 16x¹². A common mistake is to multiply the indices but forget the power of 2.", "source": "Chapter 5 Indices · 5.01 Index laws (Ex 5.01)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "matp-042", "topic": "Statistics · Calculating standard deviation", "difficulty": "medium", "type": "mcq", "stem": "Find the standard deviation of the data set 2, 4, 4, 4, 5, 5, 7, 9, correct to one decimal place. Use σ = √(Σ(x − x̄)² ÷ n).", "options": ["2.1", "2.0", "4.0", "1.5"], "answer": 1, "explanation_en": "The mean x̄ = 40 ÷ 8 = 5, the sum of squared deviations = 9+1+1+1+0+0+4+16 = 32, and σ = √(32 ÷ 8) = √4 = 2.0; choosing 4.0 forgets to take the square root (that's variance), and 2.1 is the sample standard deviation divided by n−1.", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation(σ = √(Σ(x − x̄)² ÷ n))", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "car-004", "topic": "Australian pathways · Category B limit", "difficulty": "hard", "type": "mcq", "stem": "Under the ATAR eligibility rules, what is the maximum number of Category B units a student may include?", "options": ["4 units", "2 units", "None", "6 units"], "answer": 1, "explanation_en": "Category B courses can only count for a maximum of 2 units, and the remaining units must come from Category A, which is often overlooked.", "source": "top-tips-for-choosing-hsc-courses.pdf(ATAR eligibility)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"topic": "Organic chemistry · Identifying functional groups", "difficulty": "medium", "type": "mcq", "stem": "Which of these compounds contains a carboxyl group and will turn blue litmus red?", "options": ["CH3OH", "C₂H₄", "CH3COOH", "CH3CH3"], "answer": 2, "explanation_en": "CH3COOH is acetic acid, a weak acid containing –COOH, which turns blue litmus red, whereas CH3OH is a neutral alcohol and CH3CH3 is an alkane, and C₂H₄ is an alkene.", "id": "sci-038", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Esterification", "difficulty": "hard", "type": "mcq", "stem": "Ethanol reacts with ethanoic acid to produce a compound with a sweet smell. This reaction is called:", "options": ["Esterification", "Combustion", "Neutralisation", "Polymerisation"], "answer": 0, "explanation_en": "An esterification reaction involves an alcohol and a carboxylic acid producing an ester and water, requiring concentrated sulfuric acid as a catalyst and heat, resulting in a fragrant ester like ethyl acetate.", "id": "sci-036", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "cw-001", "topic": "Where to get help · Emergencies", "difficulty": "easy", "type": "mcq", "stem": "You are walking home with a friend when they collapse and stop breathing. Which number should you call?", "options": ["13 11 14 (Lifeline)", "1800 011 511 (Mental Health Line)", "1800 55 1800 (Kids Helpline)", "000 (ambulance, police or fire)"], "answer": 3, "explanation_en": "000 is Australia's emergency number for ambulance, police and fire services. It is for immediate danger, whereas the other three numbers offer psychological support and cannot respond to a situation that needs an ambulance.", "source": "Urgent Help(Call 000 — ambulance, police or fire services)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "pdh-029", "topic": "Health information · Judging credibility", "difficulty": "medium", "type": "mcq", "stem": "A website advertises a 'detox cleanse' that claims to cure anxiety. Which question would BEST help you judge the credibility of this service?", "options": ["How colourful and modern does the website look to you?", "Is the product cheap enough to be worth trying anyway?", "How many people have shared this advertisement on social media?", "What qualifications and training does the practitioner have?"], "answer": 3, "explanation_en": "Marks are awarded for choosing 'qualifications and training' (1 mark), and for supplementing that judgement with further questions drawn from the material (a further 2 marks): what treatment is provided, what effects it has, the cost, and whether it can be used alongside conventional medicine. A website's appearance, how often it has been forwarded and its price cannot prove effectiveness — this is a common trap in this type of question.", "source": "Term 3 · Lesson 3 Assessing Credibility of Health Information", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "ftn-002", "topic": "Food safety · 2-hour / 4-hour rule", "difficulty": "easy", "type": "mcq", "stem": "Under the 2-hour/4-hour rule, what must happen to potentially hazardous food that has been in the danger zone for more than 4 hours?", "options": ["It can be returned to the fridge and used again the next day", "It must be thrown away because bacteria levels are too high", "It can be reheated to 100°C and then served", "It can be frozen and kept for up to one week"], "answer": 1, "explanation_en": "If food has been out for more than 4 hours, the bacterial count will be too high and it must be thrown away; reheating or refrigerating it will not fix the problem.", "source": "Structured Responses (Sample Answers).pdf — The 2-Hour / 4-Hour Rule", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "maths53-021", "topic": "Coordinate geometry · Perpendicular gradient", "difficulty": "easy", "type": "mcq", "stem": "The line L has equation 3x + 4y − 8 = 0. What is the gradient of a line perpendicular to L?", "options": ["−3/4", "4/3", "−4/3", "3/4"], "answer": 1, "explanation_en": "Rearrange into gradient–intercept form to get y = −(3/4)x + 2, so the gradient of L is −3/4. A line perpendicular to L has the negative reciprocal gradient, i.e. 4/3 — do not forget to change the sign.", "source": "Coordinate Geometry · 3.02 Parallel and perpendicular lines (Ex 3.02, p.69)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Line 3x + 4y minus 8 = 0\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"111.0\" y1=\"20\" x2=\"111.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"166.0\" y1=\"20\" x2=\"166.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"221.0\" y1=\"20\" x2=\"221.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"276.0\" y1=\"20\" x2=\"276.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"331.0\" y1=\"20\" x2=\"331.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"386.0\" y1=\"20\" x2=\"386.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"441.0\" y1=\"20\" x2=\"441.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opa , "type": "mcq", "stem": "If f(x) = 2x² − 3x, find f(−2).", "options": ["−2", "14", "2", "−14"], "answer": 1, "explanation_en": "f(−2) = 2(−2)² − 3(−2) = 2×4 + 6 = 14. The square is calculated first to get 4, and the second term is −3×(−2)=+6, so both signs need to be handled correctly.", "source": "Chapter 14 Functions · 14.02 Function notation (Ex 14.02)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "ftn-018", "topic": "Special occasions · Day of the Dead", "difficulty": "medium", "type": "mcq", "stem": "Día de los Muertos (Day of the Dead) is a celebration in which families:", "options": ["Build ofrendas with food to honour deceased relatives", "Give children cakes with a hidden coin inside", "Throw a decorated birthday cake into the sea", "Fast for three days to mourn deceased relatives at home"], "answer": 0, "explanation_en": "The Day of the Dead is a Mexican celebration in early November where families build an ofrenda altar with the deceased's favourite foods and items, and its tone is one of remembrance and reunion rather than mourning or abstinence.", "source": "Term 4 · Food for Special Occasions: Quiz 3 Día de los muertos", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "sciother-024", "topic": "Climate · Greenhouse effect", "difficulty": "easy", "type": "mcq", "stem": "Which statement correctly distinguishes the enhanced greenhouse effect from the natural greenhouse effect?", "options": ["The natural greenhouse effect is caused by human activity, while the enhanced effect is caused by volcanic eruptions.", "The enhanced greenhouse effect is the additional warming caused by human activities releasing abnormally high amounts of greenhouse gases.", "The enhanced greenhouse effect only occurs when the ozone layer is destroyed.", "The natural greenhouse effect stops all infrared radiation from leaving the atmosphere."], "answer": 1, "explanation_en": "The natural greenhouse effect is the absorption of infrared radiation by greenhouse gases in the atmosphere, keeping the Earth's temperature relatively stable.", "source": "Term 3 · Climate Science – Term 3 Earth Week 1 Answers(natural vs enhanced greenhouse effect)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"topic": "Climate · Reading graphs", "difficulty": "medium", "type": "mcq", "stem": "A graph shows CO₂ concentration and global average temperature rising together over 150 years. The most defensible conclusion is:", "options": ["Temperature causes CO₂ only", "The data proves nothing at all", "There is a positive correlation, consistent with CO₂ driving warming", "CO₂ has no effect on temperature"], "answer": 2, "explanation_en": "Correlation is not causation, but where a positive correlation is consistent with physical mechanisms, the conclusion should be worded as 'consistent with'. Saying 'proven' is wrong, and so is saying the data means nothing.", "source": "Yearly Study Guide 2026 · Geography Section I(graph interpretation)", "id": "geo-013", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"CO2 concentration and global temperature both rising\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"84.4\" y1=\"20\" x2=\"84.4\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"141.2\" y1=\"20\" x2=\"141.2\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"197.9\" y1=\"20\" x2=\"197.9\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"254.7\" y1=\"20\" x2=\"254.7\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"311.5\" y1=\"20\" x2=\"311.5\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"368.3\" y1=\"20\" x2=\"368.3\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"425.0\" y1=\"20\" x2=\"425.0\" y2=\"298\" stroke=\"va
