 y = mx + b (or point–gradient form) to find the intercept b = 3", "m": 1}, {"id": "c3", "t": "Gives the final equation y = −1/2 x + 3", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-019", "topic": "Functions · Direct proportion", "difficulty": "easy", "type": "mcq", "stem": "y varies directly as x. If y = 12 when x = 5, find x when y = 30.", "options": ["2.5", "12.5", "10", "72"], "answer": 1, "explanation_en": "For direct proportion, write y = kx, find k = 12/5 = 2.4, then when y = 30, x = 30 ÷ 2.4 = 12.5, not 72.", "source": "Topic 1 Graphs.pdf · 7-01 Direct proportion", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-020", "topic": "Functions · Inverse proportion", "difficulty": "medium", "type": "mcq", "stem": "y is inversely proportional to x. When x = 5, y = 8. Find y when x = 20.", "options": ["0.5", "160", "2", "32"], "answer": 2, "explanation_en": "For inverse proportion, write y = k/x, find k = 40 from 5×8, then when x = 20, y = 40/20 = 2, not 32.", "source": "Topic 1 Graphs.pdf · 7-02 Inverse proportion", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-021", "topic": "Functions · Equation of a circle", "difficulty": "easy", "type": "short", "stem": "A circle has equation x² + y² = 49. State its centre and radius, and determine whether the point (5, 5) lies on the circle.", "options": [], "answer": "Centre (0, 0) and radius 7. The point (5, 5) does not lie on the circle, because 5² + 5² = 50, not 49.", "explanation_en": "The circle with equation x² + y² = r² has its centre at the origin and radius r = √49 = 7, so check if points are on the circle by substituting their coordinates.", "source": "Topic 1 Graphs.pdf · 7-06 The circle", "marks": 2, "criteria": [{"id": "c1", "t": "States the centre (0, 0) and the radius 7", "m": 1}, {"id": "c2", "t": "Determines that (5, 5) is not on the circle because 5² + 5² = 50, not 49", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States the centre (0, 0) and the radius 7", "m": 1}, {"id": "c2", "t": "Determines that (5, 5) is not on the circle because 5² + 5² = 50, not 49", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-022", "topic": "Trigonometry · Pythagoras", "difficulty": "easy", "type": "mcq", "stem": "A right-angled triangle has two shorter sides of 9 cm and 12 cm. Find the length of the hypotenuse.", "options": ["225 cm", "21 cm", "108 cm", "15 cm"], "answer": 3, "explanation_en": "The hypotenuse is √(9² + 12²) = √225 = 15 cm, not 21 cm or 225 cm.", "source": "Topic 3 Trigonometry.pdf · 8-01 Pythagoras' theorem", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-023", "topic": "Trigonometry · Tangent ratio", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle an angle is 35° and the side adjacent to it is 12 m. Find the length of the opposite side, correct to two decimal places.", "options": ["8.40 m", "6.88 m", "17.14 m", "14.65 m"], "answer": 0, "explanation_en": "tan 35° = opposite side/adjacent side, so the opposite side is 12 × tan 35° ≈ 8.40 m, not 6.88 m or 17.14 m.", "source": "Topic 3 Trigonometry.pdf · 8-03 Finding an unknown side", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-024", "topic": "Trigonometry · Finding an unknown angle", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle, sin θ = 7/12. Find θ, correct to one decimal place.", "options": ["54.3°", "35.7°", "30.3°", "60.0°"], "answer": 1, "explanation_en": "θ = sin⁻¹(7/12) ≈ 35.7°, not 30.3° or 54.3°.", "source": "Topic 3 Trigonometry.pdf · 8-04 Finding an unknown angle", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-025", "topic": "Trigonometry · Angle of elevation", "difficulty": "medium", "type": "short", "stem": "From a point on level ground 45 m from the base of a vertical tower, the angle of elevation of the top of the tower is 62°. Find the height of the tower, correct to one decimal place.", "options": [], "answer": "tan 62° = h / 45, so h = 45 × tan 62° ≈ 84.6 m.", "explanation_en": "The angle of elevation uses tan, with 45 m as the adjacent side to 62°, so use tan, not sin, which would give 39.7 m.", "source": "Topic 3 Trigonometry.pdf · 8-05 Angles of elevation and depression", "marks": 2, "criteria": [{"id": "c1", "t": "Sets up tan 62° = h / 45 (chooses tan, treating 45 m as the side adjacent to the angle)", "m": 1}, {"id": "c2", "t": "Calculates h = 45 × tan 62° ≈ 84.6 m", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Sets up tan 62° = h / 45 (chooses tan, treating 45 m as the side adjacent to the angle)", "m": 1}, {"id": "c2", "t": "Calculates h = 45 × tan 62° ≈ 84.6 m", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-026", "topic": "Trigonometry · Bearings", "difficulty": "hard", "type": "short", "stem": "A plane flies 15 km due north and then 20 km due east. Find (a) its distance from the starting point and (b) its bearing from the starting point, correct to the nearest degree.", "options": [], "answer": "Distance = √(15² + 20²) = 25 km. Bearing = tan⁻¹(20/15) ≈ 53°, measured clockwise from north, so the bearing is 053°.", "explanation_en": "The bearing is measured clockwise from north: the displacement is «15 north, 20 east», so the angle is 53° east of north, not 037°.", "source": "Topic 3 Trigonometry.pdf · 8-06 Bearings / 8-07 Problems involving bearings", "marks": 3, "criteria": [{"id": "c1", "t": "Calculates the distance from the start as √(15² + 20²) = 25 km", "m": 1}, {"id": "c2", "t": "Finds the angle tan⁻¹(20/15) ≈ 53° east of north", "m": 1}, {"id": "c3", "t": "States the bearing as 053° (measured clockwise from north, written as a three-figure bearing)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Calculates the distance from the start as √(15² + 20²) = 25 km", "m": 1}, {"id": "c2", "t": "Finds the angle tan⁻¹(20/15) ≈ 53° east of north", "m": 1}, {"id": "c3", "t": "States the bearing as 053° (measured clockwise from north, written as a three-figure bearing)", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-027", "topic": "Volume · Cylinder (diameter trap)", "difficulty": "easy", "type": "mcq", "stem": "A cylinder has a diameter of 14 cm and a height of 20 cm. Find its volume, correct to one decimal place.", "options": ["1026.3 cm³", "439.8 cm³", "3078.8 cm³", "12315.0 cm³"], "answer": 2, "explanation_en": "First, find the radius r = 14 ÷ 2 = 7 cm, then V = πr²h = π × 49 × 20 = 980π ≈ 3078.8 cm³, not 12315.0 cm³.", "source": "Topic3 Surface area and Volume.pdf · 3-05 Volumes of prisms and cylinders(V = πr²h)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-028", "topic": "Area · Composite shapes", "difficulty": "medium", "type": "mcq", "stem": "A shape is made by attaching a semicircle of radius 4 cm to one side of a rectangle measuring 12 cm by 8 cm. Find the total area, correct to one decimal place.", "options": ["146.3 cm²", "96.0 cm²", "108.6 cm²", "121.1 cm²"], "answer": 3, "explanation_en": "The rectangle is 12 × 8 = 96 cm², the semicircle is ½ × π × 4² = 8π ≈ 25.13 cm², for a total of ≈ 121.1 cm². Forgetting to halve it results in 146.3, and only calculating a quarter circle results in 108.6.", "source": "Topic3 Surface area and Volume.pdf · 3-01 Areas of composite shapes", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-029", "topic": "Surface area · Cylinder and paint cost", "difficulty": "hard", "type": "short", "stem": "A cylindrical water tank has a radius of 5 m and a height of 10 m. Its entire surface, including the top and the bottom, is to be painted. (a) Find the total surface area, correct to the nearest square metre. (b) If paint costs $12 per square metre, find the total cost.", "options": [], "answer": "(a) SA = 2πr² + 2πrh = 50π + 100π = 150π ≈ 471.24 m², so 471 m². (b) Cost = 471 × 12 = $5,652.", "explanation_en": "Two circular faces and one side face total 150π. Calculating only the side face (100π ≈ 314 m²) misses the top and bottom; if the middle value is not rounded and 471.24 × 12 is used to get $5,654.88, it is also correct.", "source": "2025 BBHS 10 (5.2) T2 - soln.pdf · Q19 · Topic3 Surface area and Volume.pdf", "marks": 3, "criteria": [{"id": "c1", "t": "Uses the correct total surface area formula 2πr² + 2πrh (both circular ends plus the curved surface)", "m": 1}, {"id": "c2", "t": "Calculates the surface area as 150π ≈ 471 m² (accept 471.24 m²)", "m": 1}, {"id": "c3", "t": "Calculates the cost as 471 × 12 ≈ $5,652 (accept $5,654.88 if the unrounded area is used)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Uses the correct total surface area formula 2πr² + 2πrh (both circular ends plus the curved surface)", "m": 1}, {"id": "c2", "t": "Calculates the surface area as 150π ≈ 471 m² (accept 471.24 m²)", "m": 1}, {"id": "c3", "t": "Calculates the cost as 471 × 12 ≈ $5,652 (accept $5,654.88 if the unrounded area is used)", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-030", "topic": "Statistics · Shape of distributions", "difficulty": "easy", "type": "mcq", "stem": "A data distribution has a long tail extending towards the higher scores. How is this distribution described?", "options": ["Positively skewed", "Negatively skewed", "Symmetrical", "Bimodal"], "answer": 0, "explanation_en": "A positively skewed distribution has its tail pointing to the high score side, while a negatively skewed distribution has its tail pointing to the low score side. The easiest way to remember this is by the phrase 'the tail swings to the side it's biased to'.", "source": "Topic 1 Investigating Data.pdf · 5-01 The shape of a frequency distribution", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-031", "topic": "Statistics · Interquartile range", "difficulty": "easy", "type": "mcq", "stem": "Find the interquartile range of the data set 4, 7, 7, 9, 12, 15, 15, 18, 20, 22.", "options": ["8", "11", "13.5", "18"], "answer": 1, "explanation_en": "With n = 10, the median is (12+15)/2 = 13.5; the lower quartile Q1 is 7 and the upper quartile Q3 is 18, so the IQR is 18 − 7 = 11. Choosing 13.5 is incorrect because it's the median, not the IQR.", "source": "Topic 1 Investigating Data.pdf · 5-02 Quartiles and interquartile range", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-032", "topic": "Statistics · Five-number summary and skew", "difficulty": "hard", "type": "short", "stem": "The ages of 13 participants in a sports event are: 12, 14, 15, 16, 17, 17, 18, 20, 21, 22, 25, 27, 30. (a) Write the five-number summary. (b) Calculate the interquartile range. (c) State, with a reason, whether the distribution is symmetrical or skewed.", "options": [], "answer": "(a) Lowest 12, Q1 = 15.5, median = 18, Q3 = 23.5, highest 30. (b) IQR = 23.5 − 15.5 = 8. (c) Positively skewed, because the upper whisker (23.5 to 30) is longer than the lower whisker (12 to 15.5).", "explanation_en": "For 13 numbers, the median is the 7th number, and Q1 and Q3 are the medians of the lower and upper 6 numbers respectively. The upper whisker being 6.5 and the lower whisker being 3.5 indicates a longer tail on the high score side, so it's positively skewed.", "source": "Topic 1 Investigating Data.pdf · 5-03 Boxplots · 2025 BBHS 10 (5.2) T2 - soln.pdf Q9", "marks": 4, "criteria": [{"id": "c1", "t": "Writes the five-number summary 12, 15.5, 18, 23.5, 30 (lowest, Q1, median, Q3, highest)", "m": 1}, {"id": "c2", "t": "Calculates the interquartile range as 23.5 − 15.5 = 8", "m": 1}, {"id": "c3", "t": "States that the distribution is positively skewed", "m": 1}, {"id": "c4", "t": "Justifies the skew: the upper whisker (23.5 to 30) is longer than the lower whisker (12 to 15.5)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Writes the five-number summary 12, 15.5, 18, 23.5, 30 (lowest, Q1, median, Q3, highest)", "m": 1}, {"id": "c2", "t": "Calculates the interquartile range as 23.5 − 15.5 = 8", "m": 1}, {"id": "c3", "t": "States that the distribution is positively skewed", "m": 1}, {"id": "c4", "t": "Justifies the skew: the upper whisker (23.5 to 30) is longer than the lower whisker (12 to 15.5)", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-033", "topic": "Probability · Venn (at least / neither)", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play basketball and 6 play both. How many students play neither sport?", "options": ["0", "12", "6", "24"], "answer": 2, "explanation_en": "The number of people who can do at least one activity is 18 + 12 − 6 = 24, where the intersection of 6 people is counted twice and must be subtracted. So, the number of people who can do neither activity is 30 − 24 = 6. Forgetting to subtract the intersection results in 0.", "source": "Topic 3 Probability.pdf · 10-02 Venn diagrams", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-034", "topic": "Probability · Two-way tables and conditional", "difficulty": "hard", "type": "mcq", "stem": "Year 11 students were surveyed about part-time work. The results were: male with part-time work 43, male without part-time work 27, female with part-time work 35, female without part-time work 31. What is the probability that a randomly selected student works part-time, given that the student is male?", "options": ["70/136", "43/78", "43/136", "43/70"], "answer": 3, "explanation_en": "The denominator of the conditional probability must be the total number of boys, which is 43 + 27 = 70, so it's 43/70. Using the total number of students (43/136) or the total number of part-time workers (43/78) as the denominator is incorrect because it doesn't account for the condition.", "source": "Topic 3 Probability.pdf · 10-03 Two-way tables(Example 5)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-035", "topic": "Probability · Sampling without replacement", "difficulty": "medium", "type": "short", "stem": "A bag contains 3 red and 5 blue marbles. Two marbles are drawn at random one after the other without replacement. Find the probability that both marbles are red.", "options": [], "answer": "P(both red) = 3/8 × 2/7 = 6/56 = 3/28.", "explanation_en": "For sampling without replacement, the sample space for the second draw is reduced by one ball, so it's 3/8 × 2/7. Writing it as 3/8 × 3/8 is incorrect because it assumes replacement.", "source": "Topic 3 Probability.pdf · 10-05 Selecting with and without replacement", "marks": 2, "criteria": [{"id": "c1", "t": "Multiplies the probabilities for the two draws without replacement: 3/8 × 2/7", "m": 1}, {"id": "c2", "t": "Simplifies to 6/56 = 3/28", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Multiplies the probabilities for the two draws without replacement: 3/8 × 2/7", "m": 1}, {"id": "c2", "t": "Simplifies to 6/56 = 3/28", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-036", "topic": "Finance · Taxable income and deductions", "difficulty": "easy", "type": "mcq", "stem": "Priya's records for the financial year show: wages $62,400, bank interest $310, a $200 bonus, private school fees $4,800, work-related tool expenses $680, a donation to charity $150, a speeding fine $420 and her tax agent's fee $120. Using Taxable income = gross income − allowable deductions, calculate her taxable income.", "options": ["$61,960", "$63,860", "$56,740", "$62,910"], "answer": 0, "explanation_en": "The total income is $62,400 + $310 + $200 = $62,910; only expenses and donations related to earning income are deductible: $680 for tools + $150 for donations + $120 for tax agent fees = $950, so the taxable income is $61,960. Private school fees and fines are not allowable deductions, and deducting them results in an incorrect answer of $56,740.", "source": "1-02_ Income tax.pdf(Taxable income = gross income − allowable deductions)· 2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-037", "topic": "Finance · Income tax (19c bracket)", "difficulty": "easy", "type": "mcq", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Calculate the income tax payable on a taxable income of $30,000.", "options": ["$11,800.00", "$2,242.00", "$3,572.00", "$5,700.00"], "answer": 1, "explanation_en": "The $30,000 falls in the 19c bracket: 0.19 × (30,000 − 18,200) = 0.19 × 11,800 = $2,242. The tax-free threshold of $18,200 must be subtracted first; directly using 0.19 × 30,000 results in $5,700, and $11,800 is the result of subtracting the threshold but not multiplying by the tax rate.", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q5a (official answer $2,242) · 1-02_ Income tax.pdf", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-038", "topic": "Finance · Income tax (37c bracket)", "difficulty": "medium", "type": "mcq", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Calculate the income tax payable on a taxable income of $150,000.", "options": ["$80,447.00", "$40,297.00", "$43,447.00", "$55,500.00"], "answer": 2, "explanation_en": "The $150,000 is in the 37c bracket: $17,547 + 0.37 × (150,000 − 80,000) = $17,547 + $25,900 = $43,447. Two common errors are omitting the base amount (0.37 × 150,000 = $55,500) and using the wrong base (using the top of the previous bracket to get $80,447); $40,297 is the result of using the wrong tax rate of 32.5c.", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q5c (official answer $43,447)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-039", "topic": "Finance · Tax bracket boundaries", "difficulty": "hard", "type": "short", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Ann's taxable income is $80,000 and Ben's is $80,001. Ignoring the Medicare levy, calculate the tax each person pays and state how much more tax Ben pays than Ann.", "options": [], "answer": "Ann pays $3,572 + 0.325 × (80,000 − 37,000) = $3,572 + $13,975 = $17,547. Ben pays $17,547 + 0.37 × $1 = $17,547.37. Ben pays 37 cents more than Ann.", "explanation_en": "The tax brackets are continuous: the top of the 32.5c bracket ($17,547) is exactly the base amount of the 37c bracket, so Ben pays 37c on the extra $1, a difference of only 37 cents.", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q4 (official answer: 37 cents)", "marks": 3, "criteria": [{"id": "c1", "t": "Calculates Ann's tax as $3,572 + 0.325 × (80,000 − 37,000) = $17,547", "m": 1}, {"id": "c2", "t": "Calculates Ben's tax as $17,547 + 0.37 × 1 = $17,547.37 (only the $1 above $80,000 is taxed at 37c)", "m": 1}, {"id": "c3", "t": "States that Ben pays 37 cents more than Ann", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Calculates Ann's tax as $3,572 + 0.325 × (80,000 − 37,000) = $17,547", "m": 1}, {"id": "c2", "t": "Calculates Ben's tax as $17,547 + 0.37 × 1 = $17,547.37 (only the $1 above $80,000 is taxed at 37c)", "m": 1}, {"id": "c3", "t": "States that Ben pays 37 cents more than Ann", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-040", "topic": "Finance · Net income", "difficulty": "medium", "type": "short", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Kim's gross pay for the year is $54,300. She has no allowable deductions, so her taxable income is also $54,300. Calculate (a) her income tax payable and (b) her net pay, given that she also pays $960 in other deductions (union fees and health fund contributions).", "options": [], "answer": "(a) Tax = $3,572 + 0.325 × ($54,300 − $37,000) = $3,572 + $5,622.50 = $9,194.50. (b) Net pay = $54,300 − $9,194.50 − $960 = $44,145.50.", "explanation_en": "The formula is net pay = gross pay − tax − other deductions, so both tax and other deductions must be subtracted. Subtracting only tax gives $45,105.50, which is the main error in this question.", "source": "1-02_ Income tax.pdf(Net pay = gross pay − tax − other deduction; Example 3)", "marks": 3, "criteria": [{"id": "c1", "t": "Calculates Kim's income tax as $3,572 + 0.325 × (54,300 − 37,000) = $9,194.50", "m": 1}, {"id": "c2", "t": "Subtracts both the tax and the other deductions: 54,300 − 9,194.50 − 960", "m": 1}, {"id": "c3", "t": "Gives the net pay as $44,145.50", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Calculates Kim's income tax as $3,572 + 0.325 × (54,300 − 37,000) = $9,194.50", "m": 1}, {"id": "c2", "t": "Subtracts both the tax and the other deductions: 54,300 − 9,194.50 − 960", "m": 1}, {"id": "c3", "t": "Gives the net pay as $44,145.50", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-041", "topic": "Statistics · Meaning of standard deviation", "difficulty": "easy", "type": "mcq", "stem": "Two netball teams each score a mean of 24 goals per game over a season. Team A's scores have a standard deviation of 2.1 goals and Team B's have a standard deviation of 6.4 goals. What does this tell you?", "options": ["Team A's standard deviation must be wrong, because both teams have the same mean.", "Team B scored more goals in total than Team A.", "Both teams had exactly the same range of scores.", "Team A's scores were more consistent from game to game than Team B's."], "answer": 3, "explanation_en": "The standard deviation measures the spread of the data around the mean: when two means are equal, a larger standard deviation means more variation in the scores, so Team A is the more consistent team. Standard deviation is unrelated to the total score and is not the same as the range, so the first two options cannot be concluded.", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation · 2025 BBHS 10 (5.2) T2 Ana (IntDep+Alg+Data+Pav).pdf Q7(e)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-042", "topic": "Statistics · Calculating standard deviation", "difficulty": "medium", "type": "mcq", "stem": "Find the standard deviation of the data set 2, 4, 4, 4, 5, 5, 7, 9, correct to one decimal place. Use σ = √(Σ(x − x̄)² ÷ n).", "options": ["2.0", "2.1", "1.5", "4.0"], "answer": 0, "explanation_en": "The mean x̄ = 40 ÷ 8 = 5, the sum of squared deviations = 9+1+1+1+0+0+4+16 = 32, and σ = √(32 ÷ 8) = √4 = 2.0; choosing 4.0 forgets to take the square root (that's variance), and 2.1 is the sample standard deviation divided by n−1.", "source": "New nnot be drawn without lifting the pen", "It has an Eulerian circuit because every vertex has even degree", "It has exactly one odd vertex"], "answer": 2, "explanation_en": "If every vertex has an even degree, the graph has an Eulerian circuit: start anywhere, traverse each edge once and return to the starting point. If any vertex has an odd degree, that is not possible.", "source": "Yearly Study Guide 2026 · Mathematics Standard(Eulerian trails and circuits)", "id": "matp-045", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Networks · Eulerian trail", "difficulty": "medium", "type": "mcq", "stem": "A network has exactly two vertices of odd degree. What can be concluded?", "options": ["No Eulerian trail exists", "The network is not connected", "Every vertex must be visited twice", "An Eulerian trail exists, starting and finishing at the two odd-degree vertices"], "answer": 3, "explanation_en": "Having exactly two odd-degree vertices → there is an Eulerian path (can be drawn in one stroke), which must start from one odd vertex and end at the other; to return to the starting point (a circuit), all vertices must have even degrees.", "source": "Yearly Study Guide 2026 · Mathematics Standard(Eulerian trials and circuits)", "id": "matp-046", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Networks · Minimum spanning tree", "difficulty": "hard", "type": "mcq", "stem": "A town must connect four buildings with cable at minimum total length. The possible connections and lengths (km) are AB 2, AC 5, BC 3, BD 4, CD 1. What is the minimum total length?", "options": ["6 km", "10 km", "8 km", "7 km"], "answer": 0, "explanation_en": "The minimum spanning tree = select 3 edges to connect the whole without forming a cycle; sort by length: CD 1, AB 2, BC 3 → the three edges connect A-B-C-D without a cycle, with a total length of 1+2+3=6; adding any other edge would form a cycle.", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard(Shortest path and minimum spanning trees)", "id": "matp-047", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Networks · Shortest path", "difficulty": "medium", "type": "mcq", "stem": "Using the network in which AB = 2, BC = 3, AC = 5, BD = 4 and CD = 1 (all in km), what is the shortest distance from A to D?", "options": ["7 km", "6 km", "5 km", "9 km"], "answer": 1, "explanation_en": "All routes go through C or B: A→B→D=6, A→B→C→D=6, A→C→D=6, and the shortest is 6 km, so the answer is 6 km.", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard(Shortest path)", "id": "matp-048", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"topic": "Networks · Planar graphs", "difficulty": "medium", "type": "mcq", "stem": "A planar graph is one that:", "options": ["Has no cycles", "Has all vertices of equal degree", "Can be drawn on a plane without any edges crossing", "Contains no more than four vertices"], "answer": 2, "explanation_en": "A planar graph refers to a graph that can be drawn on a plane without any edges intersecting; whether it looks intersecting or not is irrelevant, what matters is whether it can be redrawn without intersecting.", "source": "Yearly Study Guide 2026 · Mathematics Core(Network terminology and planar graphs)", "id": "matp-049", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "maths53-001", "topic": "Surds · Simplifying", "difficulty": "easy", "type": "mcq", "stem": "Simplify √72.", "options": ["6√2", "8√2", "6√3", "2√6"], "answer": 0, "explanation_en": "√72 = √(36×2) = 6√2, the key is to break down the radicand into the largest square factor (36×2, not 9×8) and simplify until it can't be broken down further.", "source": "Chapter 1 Surds · 1.02 Simplifying surds (Ex 1.02, p.8)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-002", "topic": "Surds · Adding like surds", "difficulty": "easy", "type": "mcq", "stem": "Simplify √50 + √32 − √18.", "options": ["6√6", "6√2", "4√2", "9√2"], "answer": 1, "explanation_en": "First write each surd in the same radical form: 5√2 + 4√2 − 3√2 = 6√2. A common mistake is to add or subtract the radicands directly (50 + 32 − 18 = 64), which gives 8.", "source": "Chapter 1 Surds · 1.03 Adding and subtracting surds (Ex 1.03, p.11)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-003", "topic": "Surds · Rationalising denominators", "difficulty": "medium", "type": "mcq", "stem": "Write 10/√5 with a rational denominator, in simplest form.", "options": ["2√10", "5√2", "2√5", "10√5"], "answer": 2, "explanation_en": "Multiply the numerator and denominator by √5: 10√5/5 = 2√5, note that the final result should simplify the coefficient, not the radical.", "source": "Chapter 1 Surds · 1.06 Rationalising the denominator (Ex 1.06, p.20)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-004", "topic": "Surds · Rationalising binomial denominators", "difficulty": "medium", "type": "short", "stem": "Rationalise the denominator and simplify: 4/(√5 − 1).", "options": [], "answer": "Multiply by the conjugate (√5 + 1): 4(√5 + 1)/((√5)² − 1²) = 4(√5 + 1)/4 = √5 + 1.", "explanation_en": "To rationalise a denominator like this one, multiply by the conjugate (√5 + 1). After multiplying, the denominator becomes (√5)² − 1² = 5 − 1 = 4, which cancels with the 4 on top, so the answer is √5 + 1 (≈ 3.24).", "source": "Chapter 1 Surds · 1.06 Rationalising the denominator, binomial denominators (Ex 1.06)", "marks": 2, "criteria": [{"id": "c1", "t": "Multiplies the numerator and denominator by the conjugate (√5 + 1)", "m": 1}, {"id": "c2", "t": "Simplifies to √5 + 1, since the denominator (√5)² − 1² = 4 cancels with the 4 in the numerator", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Multiplies the numerator and denominator by the conjugate (√5 + 1)", "m": 1}, {"id": "c2", "t": "Simplifies to √5 + 1, since the denominator (√5)² − 1² = 4 cancels with the 4 in the numerator", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-005", "topic": "Expressions · Binomial expansion", "difficulty": "easy", "type": "mcq", "stem": "Expand and simplify (2x − 3)(x + 5).", "options": ["2x² + 7x + 15", "2x² − 7x − 15", "2x² + 13x − 15", "2x² + 7x − 15"], "answer": 3, "explanation_en": "Expand the four products: 2x·x = 2x², 2x·5 = 10x, −3·x = −3x and −3·5 = −15. Combining the like terms gives 2x² + 7x − 15; do not lose the minus sign on −3×5.", "source": "Chapter 5 Products and factors · 5.06 Expanding binomial products (Ex 5.06)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-006", "topic": "Expressions · Factorising non-monic quadratics", "difficulty": "hard", "type": "mcq", "stem": "Factorise 6x² + 11x − 35.", "options": ["(2x + 7)(3x − 5)", "(2x − 7)(3x + 5)", "(3x − 7)(2x + 5)", "(6x − 5)(x + 7)"], "answer": 0, "explanation_en": "The product of the first and last terms is 6×(−35) = −210, and the cross term must be +11x. So you need two numbers with a product of −210 and a sum of +11: they are 21 and −10. Then 6x² + 21x − 10x − 35 = 3x(2x + 7) − 5(2x + 7) = (2x + 7)(3x − 5).", "source": "Chapter 5 Products and factors · 5.09 Factorising non-monic quadratic trinomials (Ex 5.09)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-007", "topic": "Expressions · Simplifying fractions", "difficulty": "medium", "type": "short", "stem": "Simplify (x² − 9)/(x² + x − 12), stating any restrictions on x.", "options": [], "answer": "(x + 3)/(x + 4), where x ≠ 3 and x ≠ −4.", "explanation_en": "The numerator is a difference of squares, (x − 3)(x + 3), and the denominator factorises to (x + 4)(x − 3). Cancelling (x − 3) leaves (x + 3)/(x + 4). Any value of x that makes a cancelled factor zero must be excluded, so x ≠ 3 and x ≠ −4.", "source": "Chapter 5 Products and factors · 5.11 Factorising algebraic fractions (Ex 5.11)", "marks": 3, "criteria": [{"id": "c1", "t": "Factorises the numerator and denominator: (x − 3)(x + 3) over (x + 4)(x − 3)", "m": 1}, {"id": "c2", "t": "Cancels (x − 3) to give (x + 3)/(x + 4)", "m": 1}, {"id": "c3", "t": "States the restrictions x ≠ 3 and x ≠ −4", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Factorises the numerator and denominator: (x − 3)(x + 3) over (x + 4)(x − 3)", "m": 1}, {"id": "c2", "t": "Cancels (x − 3) to give (x + 3)/(x + 4)", "m": 1}, {"id": "c3", "t": "States the restrictions x ≠ 3 and x ≠ −4", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-008", "topic": "Indices · Power of a power", "difficulty": "easy", "type": "mcq", "stem": "Simplify (2x³)⁴.", "options": ["2x¹²", "16x¹²", "16x⁷", "8x¹²"], "answer": 1, "explanation_en": "Both the coefficient and the variable are raised to the fourth power: 2⁴ = 16 and (x³)⁴ = x¹², so the answer is 16x¹². A common mistake is to multiply the indices but forget the power of 2.", "source": "Chapter 5 Indices · 5.01 Index laws (Ex 5.01)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-009", "topic": "Indices · Fractional and negative", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 27^(−2/3).", "options": ["−1/9", "1/6", "1/9", "−9"], "answer": 2, "explanation_en": "27^(1/3) = 3, and squaring that gives 9. The negative index turns the result into its reciprocal, giving 1/9. A negative index means the reciprocal only — not a negative result.", "source": "Chapter 5 Indices · 5.02 Fractional indices (Ex 5.02)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-010", "topic": "Indices · Fractional indices (mixed)", "difficulty": "hard", "type": "short", "stem": "Simplify (8x⁶y⁻³)^(2/3), giving your answer with positive indices.", "options": [], "answer": "4x⁴/y²  (8^(2/3) = 4, (x⁶)^(2/3) = x⁴, (y⁻³)^(2/3) = y⁻² = 1/y²)", "explanation_en": "Multiply each index by 2/3: 8^(2/3) = 4, x^(6×2/3) = x⁴, y^(−3×2/3) = y⁻². Then use the rule for negative indices to write 4x⁴/y².", "source": "Chapter 5 Indices · 5.02 Fractional indices / 5.04 Multiplying and dividing algebraic fractions", "marks": 3, "criteria": [{"id": "c1", "t": "Evaluates the coefficient: 8^(2/3) = 4", "m": 1}, {"id": "c2", "t": "Applies the index law to the x term: (x⁶)^(2/3) = x⁴", "m": 1}, {"id": "c3", "t": "Simplifies the y term to y⁻² and writes the answer with a positive index as 4x⁴/y²", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Evaluates the coefficient: 8^(2/3) = 4", "m": 1}, {"id": "c2", "t": "Applies the index law to the x term: (x⁶)^(2/3) = x⁴", "m": 1}, {"id": "c3", "t": "Simplifies the y term to y⁻² and writes the answer with a positive index as 4x⁴/y²", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-011", "topic": "Logarithms · Definition", "difficulty": "easy", "type": "mcq", "stem": "Evaluate log₃ 81.", "options": ["1/4", "3", "27", "4"], "answer": 3, "explanation_en": "log₃81 asks '3 to the power of what equals 81?'. Since 3⁴ = 81, the answer is 4 — do not confuse it with the division 81 ÷ 3.", "source": "Chapter 7 Equations and logarithms · 7.09 Logarithms (p.270)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-012", "topic": "Logarithms · Laws", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 2 log₃ 6 − log₃ 4.", "options": ["2", "3", "log₃ 8", "log₃ 2"], "answer": 0, "explanation_en": "First use the power rule to get log₃36, then the quotient rule to get log₃(36/4) = log₃9 = 2. The coefficient 2 has to be turned into an index first; it cannot be subtracted from 4 directly.", "source": "Chapter 7 Equations and logarithms · 7.10 Logarithm laws, Example 20 (p.273)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-013", "topic": "Logarithms · Exponential equations", "difficulty": "medium", "type": "mcq", "stem": "Solve 3ˣ = 243.", "options": ["x = 81", "x = 5", "x = log 3 ÷ log 243", "x = 4"], "answer": 1, "explanation_en": "Take the logarithm on both sides: x·log3 = log243, x = log243/log3 = 5, or directly see 3⁵=243; note the direction of the quotient can't be reversed.", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations, Example 23 (p.274)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-014", "topic": "Logarithms · Log equations", "difficulty": "hard", "type": "short", "stem": "Solve log₂ x + log₂ (x − 2) = 3.", "options": [], "answer": "x = 4 (the solution x = −2 is rejected, because the logarithm of a negative number is undefined).", "explanation_en": "Combine the left side: log₂[x(x − 2)] = 3, so x² − 2x = 8. Solving gives x = 4 or x = −2, but you must check the domain, x > 0 and x − 2 > 0, so only x = 4 survives.", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations (Ex 7.11)", "marks": 3, "criteria": [{"id": "c1", "t": "Combines the logarithms and converts: log₂[x(x − 2)] = 3, so x² − 2x = 8", "m": 1}, {"id": "c2", "t": "Solves the quadratic to get x = 4 or x = −2", "m": 1}, {"id": "c3", "t": "Rejects x = −2 because the logarithm of a negative number is undefined (the domain requires x > 2)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Combines the logarithms and converts: log₂[x(x − 2)] = 3, so x² − 2x = 8", "m": 1}, {"id": "c2", "t": "Solves the quadratic to get x = 4 or x = −2", "m": 1}, {"id": "c3", "t": "Rejects x = −2 because the logarithm of a negative number is undefined (the domain requires x > 2)", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-015", "topic": "Quadratics · Factorising method", "difficulty": "easy", "type": "mcq", "stem": "Solve x² − 5x − 24 = 0.", "options": ["x = 6 or x = −4", "x = 12 or x = −2", "x = 8 or x = −3", "x = −8 or x = 3"], "answer": 2, "explanation_en": "Find two numbers with product −24 and sum −5: −8 and 3, so (x−8)(x+3)=0, x=8 or x=−3; note the product is −24, the numbers have different signs, don't write both as positive.", "source": "Chapter 11 Quadratic equations and the parabola · 11.01 Quadratic equations (Ex 11.01)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-016", "topic": "Parabolas · Axis and vertex", "difficulty": "medium", "type": "mcq", "stem": "Find the coordinates of the vertex of the parabola y = 3x² − 12x + 7.", "options": ["(−2, −5)", "(2, 7)", "(2, 5)", "(2, −5)"], "answer": 3, "explanation_en": "The axis of symmetry x = −b/(2a) = 12/6 = 2; substitute back y = 3(4) − 24 + 7 = −5, the vertex is (2, −5); don't directly take x=2 as the vertex coordinate.", "source": "Chapter 11 Quadratic equations and the parabola · 11.08 Axis of symmetry and vertex (Ex 11.08)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Parabola y = 3x squared minus 12x plus 7\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"151.7\" y1=\"20\" x2=\"151.7\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"247.3\" y1=\"20\" x2=\"247.3\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"343.0\" y1=\"20\" x2=\"343.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"438.6\" y1=\"20\" x2=\"438.6\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"280.6\" x2=\"496 he discriminant b² − 4ac = 65", "m": 1}, {"id": "c2", "t": "Substitutes into the formula to get x = (−3 ± √65)/4 (≈ (−3 ± 8.06)/4)", "m": 1}, {"id": "c3", "t": "Gives both roots correct to two decimal places: x ≈ 1.27 and x ≈ −2.77", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies a = 2, b = 3, c = −7 and the discriminant b² − 4ac = 65", "m": 1}, {"id": "c2", "t": "Substitutes into the formula to get x = (−3 ± √65)/4 (≈ (−3 ± 8.06)/4)", "m": 1}, {"id": "c3", "t": "Gives both roots correct to two decimal places: x ≈ 1.27 and x ≈ −2.77", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-018", "topic": "Quadratics · Higher-degree equations", "difficulty": "hard", "type": "short", "stem": "Solve x⁴ − 5x² + 4 = 0.", "options": [], "answer": "x = 1, x = −1, x = 2 or x = −2", "explanation_en": "Let u = x², the equation becomes u²−5u+4=0, i.e. (u−1)(u−4)=0, u=1 or 4; then solve x²=1 and x²=4, get four solutions x=±1, ±2; don't just write x=1 and 2.", "source": "Chapter 11 Quadratic equations and the parabola · 11.05 Higher-order quadratic equations (Ex 11.05)", "marks": 3, "criteria": [{"id": "c1", "t": "Uses the substitution u = x² to obtain u² − 5u + 4 = 0 and factorises it to (u − 1)(u − 4) = 0", "m": 1}, {"id": "c2", "t": "Finds u = 1 or u = 4", "m": 1}, {"id": "c3", "t": "Gives all four solutions: x = 1, −1, 2, −2", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Uses the substitution u = x² to obtain u² − 5u + 4 = 0 and factorises it to (u − 1)(u − 4) = 0", "m": 1}, {"id": "c2", "t": "Finds u = 1 or u = 4", "m": 1}, {"id": "c3", "t": "Gives all four solutions: x = 1, −1, 2, −2", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-019", "topic": "Coordinate geometry · Midpoint", "difficulty": "easy", "type": "mcq", "stem": "Find the midpoint of the interval joining A(−3, 5) and B(7, −1).", "options": ["(2, 2)", "(4, 4) opic": "Functions · Domain and range", "difficulty": "medium", "type": "short", "stem": "State the domain and range of the function f(x) = √(x − 4).", "options": [], "answer": "Domain: x ≥ 4; range: y ≥ 0.", "explanation_en": "The expression inside the square root must be non-negative, so x−4 ≥ 0, which means the domain is x ≥ 4; the result of the square root is never negative, so the range is y ≥ 0. Note that the range refers to the values of y, not x.", "source": "Chapter 14 Functions · 14.02 The domain and range of a function (p.540)", "marks": 2, "criteria": [{"id": "c1", "t": "States the domain as x ≥ 4, because the expression under the square root must not be negative", "m": 1}, {"id": "c2", "t": "States the range as y ≥ 0", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States the domain as x ≥ 4, because the expression under the square root must not be negative", "m": 1}, {"id": "c2", "t": "States the range as y ≥ 0", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-032", "topic": "Trigonometry · Area of a triangle", "difficulty": "easy", "type": "mcq", "stem": "Find the area of a triangle with two sides of 8 cm and 11 cm and an included angle of 30°.", "options": ["88 cm²", "22 cm²", "44 cm²", "11 cm²"], "answer": 1, "explanation_en": "The area is ½ab·sinC = ½×8×11×sin30° = 44×0.5 = 22 cm². Forgetting to multiply by ½ would give 44, which is a common mistake.", "source": "Non-right Angled Trigonometry · 9.11 Area of a triangle (Ex 9.11)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-033", "topic": "Trigonometry · Sine rule (side)", "difficulty": "medium", "type": "mcq", "stem": "In triangle ABC, ∠A = 35°, ∠B = 62° and a = 9.4 cm. Find b, correct to 1 decimal place.", "options": ["5.9 cm", "6.1 cm", "14.5 cm", "10.7 cm"], "answer": 2, "explanation_en": "Using the sine rule b/sinB = a/sinA gives b = 9.4×sin62°/sin35° ≈ 9.4×0.8830/0.5736 ≈ 14.5 cm. If the sine ratio is inverted (multiplying by sin35/sin62) the result would be 6.1, which is a typical error.", "source": "Non-right Angled Trigonometry · 9.07 Sine rule for sides (Ex 9.07)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-034", "topic": "Trigonometry · Cosine rule (side)", "difficulty": "medium", "type": "mcq", "stem": "In a triangle, two sides of 7 cm and 9 cm include an angle of 120°. Find the third side, correct to 1 decimal place.", "options": ["8.2 cm", "15.7 cm", "11.4 cm", "13.9 cm"], "answer": 3, "explanation_en": "c² = 7² + 9² − 2(7)(9)cos120° = 49 + 81 + 63 = 193, so c ≈ 13.9 cm. cos120° is negative, so the term −2ab·cosC becomes positive, don't lose the sign.", "source": "Non-right Angled Trigonometry · 9.09 Cosine rule for sides (Ex 9.09)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-035", "topic": "Trigonometry · Ambiguous case", "difficulty": "hard", "type": "short", "stem": "In a triangle, a = 12 cm, b = 15 cm and ∠A = 40°. Find all possible values of ∠B, correct to 1 decimal place, and explain why more than one answer exists.", "options": [], "answer": "∠B ≈ 53.5° or ∠B ≈ 126.5°, because sin B = b sin A / a = 15 sin40°/12 ≈ 0.8035 and the sine rule can produce an acute and an obtuse solution (the ambiguous case).", "explanation_en": "Using the sine rule, sinB = 15×sin40°/12 ≈ 0.8035, so B ≈ 53.5°; since sin(180°−θ)=sinθ, B could also be 180°−53.5° = 126.5°, and we need to check if both solutions can form a triangle with 40°, given the ambiguous SSA situation.", "source": "Non-right Angled Trigonometry · 9.08 Sine rule for angles (Ex 9.08)", "marks": 3, "criteria": [{"id": "c1", "t": "Uses the sine rule to get sin B = 15 sin 40° / 12 ≈ 0.8035 and B ≈ 53.5°", "m": 1}, {"id": "c2", "t": "Finds the second solution B ≈ 126.5° using sin(180° − θ) = sin θ", "m": 1}, {"id": "c3", "t": "Explains that the information given is SSA (two sides and a non-included angle), so the ambiguous case allows two possible triangles", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Uses the sine rule to get sin B = 15 sin 40° / 12 ≈ 0.8035 and B ≈ 53.5°", "m": 1}, {"id": "c2", "t": "Finds the second solution B ≈ 126.5° using sin(180° − θ) = sin θ", "m": 1}, {"id": "c3", "t": "Explains that the information given is SSA (two sides and a non-included angle), so the ambiguous case allows two possible triangles", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-036", "topic": "Probability · Relative frequency", "difficulty": "easy", "type": "mcq", "stem": "A die is rolled 50 times and a 6 appears 7 times. What is the relative frequency of rolling a 6?", "options": ["0.14", "0.86", "0.12", "0.07"], "answer": 0, "explanation_en": "The relative frequency is the number of occurrences divided by the total number of trials, which is 7/50 = 0.14; common mistakes include using 100 as the total number of trials (7/100 = 0.07), using the score 6 instead of the frequency (6/50 = 0.12), or calculating the complementary event 43/50 = 0.86.", "source": "Chapter 12 Probability · 12.01 Relative frequency", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-037", "topic": "Probability · Venn (overlapping events)", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play tennis and 7 play both. How many students play neither sport?", "options": ["5 students", "7 students", "0 students", "23 students"], "answer": 1, "explanation_en": "First, find the union: 18 + 12 − 7 = 23 people can do at least one activity, then use 30 − 23 = 7 to find those who can do neither; 23 is the number of people who can do 'at least one activity' (forgetting to subtract from the total), 5 is the number who can only play tennis (12 − 7), and 0 is the result of directly using 18 + 12 = 30 as the union (double-counting 7 people) and then subtracting 30 from 30.", "source": "Chapter 12 Probability · 12.02 Venn diagrams", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-038", "topic": "Probability · Reading two-way tables", "difficulty": "easy", "type": "mcq", "stem": "A survey of 100 students recorded how they travel to school:\n\n            Walk   Bus\nYear 10      28     22\nYear 11      35     15\n\nWhat is the probability that a randomly selected student catches the bus?", "options": ["0.15", "0.22", "0.37", "0.63"], "answer": 2, "explanation_en": "The total number of people taking the bus is 22 + 15 = 37, out of 100, so P = 0.37; 0.22 and 0.15 only consider one row of the table, while 0.63 is the proportion of people walking (1 − 0.37), all of which are errors from not adding or complementing the whole column.", "source": "Chapter 12 Probability · 12.03 Two-way tables", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-039", "topic": "Probability · Product rule for independent events", "difficulty": "medium", "type": "mcq", "stem": "A coin is tossed and a die is rolled at the same time. What is the probability of getting a head and an even number?", "options": ["3/4", "1/12", "1/2", "1/4"], "answer": 3, "explanation_en": "For two independent events, use the product rule: P(H) × P(even) = 1/2 × 1/2 = 1/4; 1/2 only considers the dice being even (forgetting to multiply by the coin), 1/12 is the mistake of using P(4) = 1/6 as the probability of being even, and 3/4 is the complementary event 1 − 1/4.", "source": "Chapter 12 Probability · 12.06 Dependent and independent events (product rule)", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-040", "topic": "Probability · Without replacement", "difficulty": "medium", "type": "mcq", "stem": "A bag contains 5 red and 3 blue counters. Two counters are drawn at random without replacement. What is the probability that both counters are red? Give your answer correct to 2 decimal places.", "options": ["0.36", "0.39", "0.63", "0.57"], "answer": 0, "explanation_en": "Without replacement: the first draw is 5/8, and the second draw has 4 red balls out of 7, so P = 5/8 × 4/7 = 20/56 ≈ 0.36; 0.39 is the mistake of using replacement (25/64 = 0.3906), 0.63 only considers the first draw (5/8), and 0.57 only considers the second draw (4/7).", "source": "Chapter 12 Probability · 12.05 Selecting with and without replacement", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-041", "topic": "Probability · Conditional probability", "difficulty": "medium", "type": "mcq", "stem": "A bag contains 4 red and 6 blue marbles. One marble is drawn at random and not replaced. Given that the first marble was red, what is the probability that the second marble is blue?", "options": ["2/5", "2/3", "3/5", "1/3"], "answer": 1, "explanation_en": "Given the first ball is red and not replaced, there are 3 red and 6 blue balls left out of 9, so P(second ball is blue | first ball is red) = 6/9 = 2/3; 3/5 is the mistake of not changing the total from 10 to 9 (6/10), 1/3 is the mistake of considering the remaining red balls (3/9), and 2/5 is the probability of drawing a red ball first (4/10).", "source": "Chapter 12 Probability · 12.07 Conditional probability", "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-042", "topic": "Probability · Tree diagrams", "difficulty": "hard", "type": "short", "stem": "A box contains 6 white and 4 black balls. Two balls are drawn at random without replacement. Using a tree diagram, find the probability that exactly one of the balls is black. Give your answer as a fraction in simplest form.", "options": [], "answer": "8/15  (2 × 6/10 × 4/9 = 48/90 = 8/15 ≈ 0.533)", "explanation_en": "The tree diagram has two successful paths: white→black (6/10 × 4/9 = 24/90) and black→white (4/10 × 6/9 = 24/90), which add up to 48/90 = 8/15; note that the denominator of the second branch also changes to 9 (without replacement), and 'exactly one black' must consider both paths, or half will be missed.", "source": "Chapter 12 Probability · 12.04 Tree diagrams / 12.05 Selecting with and without replacement", "marks": 3, "criteria": [{"id": "c1", "t": "Identifies both valid paths: white then black, and black then white", "m": 1}, {"id": "c2", "t": "Calculates each path probability with a changed denominator for the second draw (6/10 × 4/9 = 24/90)", "m": 1}, {"id": "c3", "t": "Adds the two paths to give 48/90 = 8/15", "m": 1}], "auto_grade": true, "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Probability tree for two draws without replacement from 6 white and 4 black balls\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"212.0\" y=\"34.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-sans,sans-serif)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">1st draw</text><text x=\"372.0\" y=\"34.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-sans,sans-serif)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">2nd draw</text><line x1=\"64.0\" y1=\"183.0\" x2=\"212.0\" y2=\"107.7\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"138.0\" y=\"138.3\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">6/10</text><line x1=\"212.0\" y1=\"107.7\" x2=\"372.0\" y2=\"70.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"292.0\" y=\"81.8\"fill=\"var(--muted)\" font-size=\"1 =\"3\" stroke-linejoin=\"round\">4/10</text><line x1=\"212.0\" y1=\"258.3\" x2=\"372.0\" y2=\"220.7\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"292.0\" y=\"232.5\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">6/9</text><circle cx=\"372.0\" cy=\"220.7\" r=\"4.4\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"382.0\" y=\"225.2\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">W</text><line x1=\"212.0\" y1=\"258.3\" x2=\"372.0\" y2=\"296.0\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"292.0\" y=\"270.2\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">3/9</text><circle cx=\"372.0\" cy=\"296.0\" r=\"4.4\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"382.0\" y=\"300.5\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B</text><circle cx=\"212.0\" cy=\"258.3\" r=\"4.4\" fill=\"var(--surface)\" stroke=\"var(--border-strong)\" stroke-width=\"1.6\"/><text x=\"222.0\" y=\"262.8\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B</text><circle cx=\"64.0\" cy=\"183.0\" r=\"5.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.4\"/><text x=\"64.0\" y=\"205.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-sans,sans-serif)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">Start</text><text x=\"16.0\" y=\"330.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-mono,monospace)\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">Multiply along a path, then add up the paths that match the event.</text></svg>", "points": [{"id": "c1", "t": "Identifies both valid paths: white then black, and black then white", "m": 1}, {"id": "c2", "t": "Calculates each path probability with a changed denominator for the second draw (6/10 × 4/9 = 24/90)", "m": 1}, {"id": "c3", "t": "Adds the two paths to give 48/90 = 8/15", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"id": "maths53-043", "topic": "Probability · Venn diagrams and conditional", "difficulty": "hard", "type": "short", "stem": "In a survey of 80 people, 45 own a dog, 30 own a cat and 18 own both. One person is chosen at random.\n(a) Find the probability that the person owns a cat, given that they own a dog.\n(b) Find the probability that the person owns neither animal.", "options": [], "answer": "(a) 18/45 = 2/5 = 0.4   (b) 80 − (45 + 30 − 18) = 23, so P(neither) = 23/80 = 0.2875 ≈ 0.29", "explanation_en": "(a) The denominator for the conditional probability is the 45 people who own dogs, with an intersection of 18 people, so 18/45 = 2/5 (≈0.4); (b) first, find the union 45 + 30 − 18 = 57 people, then 80 − 57 = 23 people have neither, with a probability of 23/80 ≈ 0.29; don't double-count the 18 in the union.", "source": "Chapter 12 Probability · 12.02 Venn diagrams / 12.07 Conditional probability", "marks": 3, "criteria": [{"id": "c1", "t": "Finds the conditional probability as 18/45 = 2/5 (using 45, not 80, as the denominator)", "m": 1}, {"id": "c2", "t": "Finds the number who own at least one animal: 45 + 30 − 18 = 57", "m": 1}, {"id": "c3", "t": "Gives P(neither animal) = (80 − 57)/80 = 23/80 ≈ 0.29", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Finds the conditional probability as 18/45 = 2/5 (using 45, not 80, as the denominator)", "m": 1}, {"id": "c2", "t": "Finds the number who own at least one animal: 45 + 30 − 18 = 57", "m": 1}, {"id": "c3", "t": "Gives P(neither animal) = (80 − 57)/80 = 23/80 ≈ 0.29", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "Stage 5 - 5.3 Mathematics (Year 10)"}, {"topic": "King Lear · Plot", "difficulty": "easy", "type": "mcq", "stem": "How does King Lear decide how to divide his kingdom at the start of the play?", "options": ["By asking each daughter to say how much she loves him", "By drawing lots with his daughters", "By holding a tournament between the dukes", "By giving the largest share to the eldest daughter"], "answer": 0, "explanation_en": "King Lear asks his three daughters to express their love for him, which will determine their share of the kingdom, making love a measurable performance.", "source": "Yearly Study Guide 2026 · English(5 multiple choice questions based on the events of your play)", "id": "eng-001", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"topic": "King Lear · Plot", "difficulty": "easy", "type": "mcq", "stem": "What word does Cordelia use when asked to declare her love, which triggers Lear's rage?", "options": ["Everything", "Nothing", "Half", "Love"], "answer": 1, "explanation_en": "Cordelia replies 'Nothing', refusing to use flattery to gain land, and Lear mistakes her honesty for denial, stripping her of her inheritance.", "source": "Yearly Study Guide 2026 · English", "id": "eng-002", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "Who is the faithful nobleman banished for speaking in defence of Cordelia, and how does he return?", "options": ["Edmund, disguised as a messenger", "Albany, disguised as a knight", "Kent, disguised as the servant Caius", "Gloucester, disguised as Poor Tom"], "answer": 2, "explanation_en": "Kent is banished for defending Cordelia and continues to serve Lear in disguise as Caius, while Poor Tom is Edgar's disguise and Albany is not in disguise.", "source": "Yearly Study Guide 2026 · English", "id": "eng-003", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "How does Goneril and Regan's treatment of Lear change after they gain power?", "options": ["They crown him king of a smaller region", "They exile him to France", "They give him more knights than he had before", "They reduce the number of knights he may keep, eventually refusing them entirely"], "answer": 3, "explanation_en": "Lear's request to keep 100 knights is reduced to 50 by Goneril and then to 25 by Regan, who eventually refuses to accommodate him, and the removal of his attendants is a key point of humiliation.", "source": "Yearly Study Guide 2026 · English", "id": "eng-004", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "Edmund plots against Edgar and Gloucester. Which action most directly sets his plan in motion?", "options": ["He tells Edgar that Gloucester wants him dead, then claims Edgar plotted to kill Gloucester", "He forges a letter and calls a tournament", "He reports Edgar to the King", "He openly challenges Edgar to a duel"], "answer": 0, "explanation_en": "Edmund forges letters, tricks Edgar into fleeing, and reports to Gloucester that 'Edgar is plotting against his father', making Edgar a wanted man and himself the legitimate heir.", "source": "Yearly Study Guide 2026 · English", "id": "eng-005", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"topic": "King Lear · Plot", "difficulty": "hard", "type": "mcq", "stem": "How does the play end for Lear and Cordelia?", "options": ["They rule the kingdom together", "Cordelia is hanged on Edmund's orders and Lear dies of grief with her body", "Lear is killed in battle by Albany", "They flee to France and survive"], "answer": 1, "explanation_en": "Edmund orders Cordelia's execution, and by the time Lear arrives it is too late: he dies holding her body. No happy ending restores order; only Albany and Edgar are left to pick up the pieces.", "source": "Yearly Study Guide 2026 · English", "id": "eng-006", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-007", "topic": "King Lear · Division and Cordelia's 'Nothing'", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nCORDELIA: Nothing, my lord.\nKING LEAR: Nothing!\nCORDELIA: Nothing.\nKING LEAR: Nothing will come of nothing: speak again.\n\n(a) What does Cordelia's reply reveal about her values? (2 marks)\n(b) Explain how Lear's response sets the tragedy in motion. (3 marks)", "options": [], "answer": "(a) 1 mark — Cordelia refuses to flatter or perform love for a reward; she will not compete with her sisters' speeches.\n1 mark — her plain 'Nothing' signals honesty and a measured, private love (she loves 'according to my bond'), not an absence of feeling.\n(b) 1 mark — Lear equates love with public declaration, so silence is read as rejection.\n1 mark — his pun, 'Nothing will come of nothing', shows him thinking in terms of a bargain or debt rather than affection.\n1 mark — he banishes Cordelia (and Kent) and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him.", "explanation_en": "The two questions form a causal chain: (a) why Cordelia says 'Nothing' (refusing to perform love, which is a 'duty' not a quote), and (b) linking three points — taking words as love, using puns as transactions, and exile creating a power vacuum.", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "States that Cordelia refuses to flatter or perform love for a reward, and will not compete with her sisters' speeches", "m": 1}, {"id": "c2", "t": "States that her plain 'Nothing' signals honesty and a measured, private love ('according to my bond' in the answer) rather than an absence of feeling", "m": 1}, {"id": "c3", "t": "Explains that Lear equates love with public declaration, so silence is read as rejection", "m": 1}, {"id": "c4", "t": "Explains how his pun 'Nothing will come of nothing' shows him thinking in terms of a bargain or debt rather than affection", "m": 1}, {"id": "c5", "t": "Explains that he banishes Cordelia and Kent and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that Cordelia refuses to flatter or perform love for a reward, and will not compete with her sisters' speeches", "m": 1}, {"id": "c2", "t": "States that her plain 'Nothing' signals honesty and a measured, private love ('according to my bond' in the answer) rather than an absence of feeling", "m": 1}, {"id": "c3", "t": "Explains that Lear equates love with public declaration, so silence is read as rejection", "m": 1}, {"id": "c4", "t": "Explains how his pun 'Nothing will come of nothing' shows him thinking in terms of a bargain or debt rather than affection", "m": 1}, {"id": "c5", "t": "Explains that he banishes Cordelia and Kent and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-008", "topic": "King Lear · Flattering language (1.1)", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nGONERIL: Sir, I love you more than words can wield the matter;\nDearer than eyesight, space, and liberty;\nBeyond what can be valued, rich or rare;\n\n(a) Identify two features of Goneril's language. (2 marks)\n(b) Explain why Shakespeare gives this speech to Goneril rather than to Cordelia. (3 marks)", "options": [], "answer": "(a) 1 mark — hyperbole and unverifiable comparison ('more than words can wield', 'dearer than eyesight, space and liberty').\n1 mark — a catalogue of absolutes: love is measured against everything (sight, space, liberty, wealth) and therefore means nothing specific.\n(b) 1 mark — the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and truth as plain speech.\n1 mark — it positions the audience above Lear: we can hear the inflation before he can (dramatic irony).\n1 mark — it establishes the play's central error: love treated as language to be counted rather than felt.", "explanation_en": "This question examines how language is quantified: Goneril uses exaggeration and absolute lists to make love comparable and quotable.", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "Identifies hyperbole and unverifiable comparison in Goneril's language (e.g. 'more than words can wield', 'dearer than eyesight, space, and liberty')", "m": 1}, {"id": "c2", "t": "Identifies her catalogue of absolutes, in which love is measured against everything and therefore means nothing specific", "m": 1}, {"id": "c3", "t": "Explains that the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and plain speech as truth", "m": 1}, {"id": "c4", "t": "Explains that the speech positions the audience above Lear, who cannot yet hear the inflation (dramatic irony)", "m": 1}, {"id": "c5", "t": "Explains that it establishes the play's central error: love treated as language to be counted rather than felt", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies hyperbole and unverifiable comparison in Goneril's language (e.g. 'more than words can wield', 'dearer than eyesight, space, and liberty')", "m": 1}, {"id": "c2", "t": "Identifies her catalogue of absolutes, in which love is measured against everything and therefore means nothing specific", "m": 1}, {"id": "c3", "t": "Explains that the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and plain speech as truth", "m": 1}, {"id": "c4", "t": "Explains that the speech positions the audience above Lear, who cannot yet hear the inflation (dramatic irony)", "m": 1}, {"id": "c5", "t": "Explains that it establishes the play's central error: love treated as language to be counted rather than felt", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-009", "topic": "King Lear · Sight and blindness imagery", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nKENT: See better, Lear; and let me still remain\nThe true blank of thine eye.\n\nExplain what Kent's image of sight suggests about Lear's error and about the play's wider concerns. (3 marks)", "options": [], "answer": "1 mark — sight here means judgement or insight, not physical vision: Kent is telling Lear that he is misreading his daughters.\n1 mark — Kent offers to be the 'blank' (the true target/centre) of Lear's eye, that is, the honest perspective Lear refuses.\n1 mark — the image plants the blindness motif that structures the whole play: Gloucester is literally blinded, and Lear only learns to 'see' once he has lost everything.", "explanation_en": "3 marks are given for: sight = judgement (not vision), Kent's voluntary loyalty as a 'target', and this metaphor setting up the blindness theme throughout the play (leading to Gloucester's eye gouging and Lear's eventual loss).", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that sight here means judgement or insight rather than physical vision, so Kent is telling Lear that he is misreading his daughters", "m": 1}, {"id": "c2", "t": "Explains that Kent offers to be the 'blank' (the true target or centre of Lear's eye), that is, the honest perspective Lear refuses", "m": 1}, {"id": "c3", "t": "Explains that the image plants the blindness motif that structures the play, with Gloucester literally blinded and Lear learning to 'see' only after losing everything", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that sight here means judgement or insight rather than physical vision, so Kent is telling Lear that he is misreading his daughters", "m": 1}, {"id": "c2", "t": "Explains that Kent offers to be the 'blank' (the true target or centre of Lear's eye), that is, the honest perspective Lear refuses", "m": 1}, {"id": "c3", "t": "Explains that the image plants the blindness motif that structures the play, with Gloucester literally blinded and Lear learning to 'see' only after losing everything", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-010", "topic": "King Lear · Hamartia (the dragon image)", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nLEAR: Come not between the dragon and his wrath.\n\nHow does this line help to explain Lear's hamartia? (3 marks)", "options": [], "answer": "1 mark — the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge.\n1 mark — wrath has replaced judgement: he acts from injured pride rather than reason, and cannot tolerate being contradicted.\n1 mark — because this flaw (not fate) drives the banishments and the division of the kingdom, his downfall follows from character, which is what makes the play a tragedy.", "explanation_en": "Hamartia is not 'bad luck' but a character flaw: Lear's anger overrides his judgement and drives him to expel Cordelia and divide the kingdom. The tragedy is driven by his own character, as the tragic structure requires.", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge", "m": 1}, {"id": "c2", "t": "Explains that wrath has replaced judgement, so he acts from injured pride and cannot tolerate being contradicted", "m": 1}, {"id": "c3", "t": "Explains that this flaw, not fate, drives the banishments and the division of the kingdom, which is what makes the play a tragedy", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge", "m": 1}, {"id": "c2", "t": "Explains that wrath has replaced judgement, so he acts from injured pride and cannot tolerate being contradicted", "m": 1}, {"id": "c3", "t": "Explains that this flaw, not fate, drives the banishments and the division of the kingdom, which is what makes the play a tragedy", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-011", "topic": "King Lear · Power, loss and identity", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: I gave you all—\nREGAN: And in good time you gave it.\n\nAnalyse what this exchange reveals about power, loss and identity. (4 marks)", "options": [], "answer": "1 mark — Lear still speaks as the giver: his identity is bound up in what he handed over, so he assumes authority continues after the gift.\n1 mark — Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude.\n1 mark — the daughters now own the power he thought he kept; the title of king remains but the substance has gone.\n1 mark — the play shows identity collapsing when power is transferred: Lear is reduced to 'a poor old man' and has to rebuild a self from bare humanity.", "explanation_en": "The 4 marks cover three concepts: power has shifted, identity still belongs to the 'giver', and the extract illustrates 'title ≠ substance'. Regan's cold 'in good time' marks the turning point in the power relationship.", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that Lear still speaks as the giver, since his identity is bound up in what he handed over and he assumes his authority continues after the gift", "m": 1}, {"id": "c2", "t": "Explains that Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude", "m": 1}, {"id": "c3", "t": "Explains that the daughters now hold the power he thought he kept, so the title of king remains but its substance has gone", "m": 1}, {"id": "c4", "t": "Explains that identity collapses when power is transferred, leaving Lear a 'poor old man' who must rebuild a self from bare humanity", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Lear still speaks as the giver, since his identity is bound up in what he handed over and he assumes his authority continues after the gift", "m": 1}, {"id": "c2", "t": "Explains that Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude", "m": 1}, {"id": "c3", "t": "Explains that the daughters now hold the power he thought he kept, so the title of king remains but its substance has gone", "m": 1}, {"id": "c4", "t": "Explains that identity collapses when power is transferred, leaving Lear a 'poor old man' who must rebuild a self from bare humanity", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-012", "topic": "King Lear · 'Reason not the need'", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: O, reason not the need: our basest beggars\nAre in the poorest thing superfluous:\n\nWhat does this speech reveal about Lear's understanding of need? (3 marks)", "options": [], "answer": "1 mark — he argues that bare necessity is not enough for human dignity: even beggars have something 'superfluous' beyond survival.\n1 mark — he is defending his hundred knights as a symbol of status and respect, not as a practical requirement.\n1 mark — the speech shows him reasoning about humanity and hardship, but still from a king's position, so the insight is genuine yet incomplete.", "explanation_en": "The key to this question is that 'need has two layers': survival needs and human dignity needs. Lear can now speak for the poor, but he still fights for pomp and dignity, which shows that his recognition is incomplete.", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that Lear argues bare necessity is not enough for human dignity, since even beggars have something 'superfluous' beyond survival", "m": 1}, {"id": "c2", "t": "Explains that he defends his hundred knights as a symbol of status and respect rather than a practical requirement", "m": 1}, {"id": "c3", "t": "Explains that the speech shows genuine insight into humanity and hardship but is still spoken from a king's position, so the understanding is incomplete", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Lear argues bare necessity is not enough for human dignity, since even beggars have something 'superfluous' beyond survival", "m": 1}, {"id": "c2", "t": "Explains that he defends his hundred knights as a symbol of status and respect rather than a practical requirement", "m": 1}, {"id": "c3", "t": "Explains that the speech shows genuine insight into humanity and hardship but is still spoken from a king's position, so the understanding is incomplete", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-013", "topic": "King Lear · The storm as symbol (3.2)", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 2:\n\nLEAR: Blow, winds, and crack your cheeks! rage! blow! ...\nI am a man\nMore sinn'd against than sinning.\n\n(a) How does Shakespeare use the storm symbolically in this scene? (3 marks)\n(b) What does 'More sinn'd against than sinning' reveal about Lear's self-knowledge at this point? (3 marks)", "options": [], "answer": "(a) 1 mark — the storm externalises Lear's inner rage and gives his fury a cosmic scale.\n1 mark — it is also indifferent nature: wind and rain do not answer him, which cuts human authority down to size.\n1 mark — by stripping him of shelter and followers it forces him to confront exposed humanity, preparing the 'poor naked wretches' speech.\n(b) 1 mark — he sees himself chiefly as a victim: 'sinn'd against' comes first and carries the weight.\n1 mark — he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial, not full confession.\n1 mark — fuller recognition comes later (Act 4, 'they t
