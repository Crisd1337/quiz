 "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 温室效应机理", "difficulty": "medium", "type": "mcq", "stem": "In the greenhouse effect, which sequence is correct?", "options": ["The ozone layer traps heat near the surface", "Long-wave radiation from the Sun is absorbed by the surface", "Short-wave solar radiation passes through the atmosphere, is absorbed and re-emitted as long-wave radiation which is trapped", "Greenhouse gases reflect short-wave radiation back to space"], "answer": 2, "explanation": "太阳辐射以短波为主，能穿过大气到达地表；地表升温后以长波（红外）向外辐射，被温室气体吸收并再辐射，一部分返回地表。", "source": "Yearly Study Guide 2026 · Geography Section II（greenhouse effect）", "id": "geo-003", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 碳源与碳汇", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is best described as a carbon sink?", "options": ["Deforestation in the Amazon", "Cattle producing methane", "A coal-fired power station", "The ocean absorbing dissolved carbon dioxide"], "answer": 3, "explanation": "碳汇是吸收并储存碳的库：海洋、森林、土壤。燃煤、砍伐、反刍动物都是碳源。", "source": "Yearly Study Guide 2026 · Geography Section I", "id": "geo-004", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 海平面上升", "difficulty": "medium", "type": "mcq", "stem": "Global sea level is rising mainly because of:", "options": ["Thermal expansion of warming seawater and melting of land-based ice", "More rain falling into the oceans", "The ocean becoming saltier", "Volcanic eruptions under the sea"], "answer": 0, "explanation": "两大机制：海水受热膨胀（约一半贡献）+ 陆地冰（冰川、格陵兰、南极）融化注入海洋。注意『海冰融化』不抬高海平面——它本来就浮在水里。", "source": "Yearly Study Guide 2026 · Geography Section II（sea level rise）", "id": "geo-005", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 海洋酸化", "difficulty": "medium", "type": "mcq", "stem": "Ocean acidification occurs because:", "options": ["Coral reefs release acid", "Carbon dioxide dissolves in seawater forming carbonic acid, lowering pH", "Salt concentration increases", "Acid rain falls directly into the sea"], "answer": 1, "explanation": "CO₂ + H₂O → H₂CO₃（碳酸），碳酸释放 H⁺，pH 下降。工业革命以来表层海水 pH 已下降约 0.1（酸度上升约 30%）。", "source": "Yearly Study Guide 2026 · Geography Section II（ocean acidification）", "id": "geo-006", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 珊瑚白化", "difficulty": "medium", "type": "mcq", "stem": "Coral bleaching is caused by:", "options": ["Too much oxygen in the water", "An increase in coral predators only", "Loss of the symbiotic algae (zooxanthellae) due to heat stress, exposing the white skeleton", "Corals being covered by sand"], "answer": 2, "explanation": "水温持续偏高时珊瑚排出体内的共生藻（虫黄藻），失去颜色和主要能量来源，露出白色骨骼。若高温持续太久，珊瑚会死亡。", "source": "Yearly Study Guide 2026 · Geography Section II（ocean temperature and coral bleaching）", "id": "geo-007", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 天气图 · 锋面符号", "difficulty": "easy", "type": "mcq", "stem": "On a synoptic chart, a line with triangles pointing in the direction of movement represents:", "options": ["An isobar", "A high pressure centre", "A warm front", "A cold front"], "answer": 3, "explanation": "冷锋用三角符号（▲），暖锋用半圆符号（◗），三角/半圆朝向表示锋面移动方向。等压线是细实线。", "source": "Yearly Study Guide 2026 · Geography Section I（synoptic charts）", "id": "geo-008", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 天气图 · 高压", "difficulty": "easy", "type": "mcq", "stem": "An area of high pressure on a synoptic chart is usually associated with:", "options": ["Clear skies and settled weather", "Thunderstorms", "A cold front passing", "Heavy rain and strong winds"], "answer": 0, "explanation": "高压中心空气下沉，不易成云致雨，天气稳定晴朗；低压中心空气上升，容易成云降水。", "source": "Yearly Study Guide 2026 · Geography Section I（skills · synoptic charts）", "id": "geo-009", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · FLICC · 挑樱桃", "difficulty": "medium", "type": "mcq", "stem": "A website says: 'It snowed heavily last winter, so global warming is a hoax.' Which FLICC technique is this?", "options": ["Fake experts", "Logical fallacy (cherry-picking)", "Conspiracy theory", "Impossible expectations"], "answer": 1, "explanation": "挑樱桃（cherry-picking）：只挑一个短期、局部的天气事件来否定长期、全球的趋势。天气≠气候：单个寒潮不能推翻 30 年的升温趋势。", "source": "Yearly Study Guide 2026 · Geography Section I（critical thinking · FLICC）", "id": "geo-010", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · FLICC · 假专家", "difficulty": "medium", "type": "mcq", "stem": "A blog cites 'a retired physicist' with no climate science background as proof that CO₂ does not trap heat. Which FLICC technique is this?", "options": ["Cherry picking", "Conspiracy theory", "Fake experts", "Impossible expectations"], "answer": 2, "explanation": "假专家（fake experts）：用没有相关领域资历的人营造『专家有争议』的假象。判断要看其研究领域、同行评议记录，而不是头衔本身。", "source": "Yearly Study Guide 2026 · Geography Section I（FLICC）", "id": "geo-011", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 反馈 · 反照率", "difficulty": "hard", "type": "mcq", "stem": "As sea ice melts, the darker ocean surface absorbs more sunlight, which causes further warming. This is an example of:", "options": ["Ocean acidification", "The greenhouse effect", "A negative feedback loop", "A positive feedback loop (albedo effect)"], "answer": 3, "explanation": "冰反照率高（反射阳光），融化后露出深色海面吸收更多热量，进一步升温→进一步融冰，是正反馈（自我增强）。", "source": "Yearly Study Guide 2026 · Geography Section I（critical thinking / climate system）", "id": "geo-012", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 图表判读", "difficulty": "medium", "type": "mcq", "stem": "A graph shows CO₂ concentration and global average temperature rising together over 150 years. The most defensible conclusion is:", "options": ["There is a positive correlation, consistent with CO₂ driving warming", "Temperature causes CO₂ only", "CO₂ has no effect on temperature", "The data proves nothing at all"], "answer": 0, "explanation": "相关不等于因果，但『正相关且与物理机制一致』同时成立时，结论应表述为『与……一致』。只说『证明』错，说『毫无意义』也错。", "source": "Yearly Study Guide 2026 · Geography Section I（graph interpretation）", "id": "geo-013", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 海岸影响", "difficulty": "medium", "type": "mcq", "stem": "Which combination most increases coastal erosion risk in eastern Australia?", "options": ["Lower sea level and weaker storms", "Higher sea level, larger storm surges and more intense East Coast Lows", "Less coastal development", "Colder ocean temperatures"], "answer": 1, "explanation": "海平面升高让同样的风暴浪能在更高的基面上起作用；风暴潮叠加、East Coast Lows 增强、海岸带开发增加暴露度，三者叠加才会放大风险。", "source": "Yearly Study Guide 2026 · Geography（climate change and impacts on coastal environments）", "id": "geo-014", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 温室效应（简答）", "difficulty": "medium", "type": "short", "stem": "Explain, step by step, how the greenhouse effect keeps Earth warmer than it would otherwise be.", "answer": "Short-wave radiation from the Sun passes through the atmosphere and is absorbed by the Earth's surface, warming it. The surface re-emits this energy as longer-wave infrared radiation. Greenhouse gases (CO2, methane, water vapour) absorb this infrared radiation and re-radiate it in all directions, including back towards the surface. This trapped energy raises the average surface temperature. Without this effect Earth's average temperature would be about -18C instead of about 15C.", "explanation": "得分点四步：短波进入 → 地表吸收并发出长波 → 温室气体吸收再辐射 → 结果升温。顺序错或漏掉『再辐射回地表』会扣分。", "source": "Yearly Study Guide 2026 · Geography Section II（greenhouse effect）", "points": [{"t": "Short-wave radiation from the Sun passes through the atmosphere and is absorbed by the Earth's surface, warming it", "m": 1}, {"t": "The surface re-emits this energy as longer-wave infrared radiation", "m": 1}, {"t": "Greenhouse gases (CO2, methane, water vapour) absorb this infrared radiation and re-radiate it in all directions, including back towards the surface", "m": 1}, {"t": "This trapped energy raises the average surface temperature", "m": 1}, {"t": "Without this effect Earth's average temperature would be about -18C instead of about 15C", "m": 1}], "id": "geo-015", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 自然 vs 增强（简答）", "difficulty": "medium", "type": "short", "stem": "Distinguish between the natural greenhouse effect and the enhanced greenhouse effect.", "answer": "The natural greenhouse effect is a process that has always operated: naturally occurring greenhouse gases trap some outgoing infrared radiation and keep the average surface temperature around 15C, which makes life possible. The enhanced greenhouse effect is the additional warming caused by human activities that increase greenhouse gas concentrations - burning fossil fuels (CO2), agriculture and livestock (methane), and deforestation. The mechanism is identical; what differs is the extra quantity of greenhouse gases and therefore the extra trapped energy.", "explanation": "关键在『机理相同、量不同』。只写『一个是自然的、一个是人类造成的』拿不到满分，要指出多出来的温室气体导致额外截留的能量。", "source": "Yearly Study Guide 2026 · Geography Section II", "points": [{"t": "The natural greenhouse effect is a process that has always operated: naturally occurring greenhouse gases trap some outgoing infrared radiation and keep the average surface temperature around 15C, which makes life possible. The enhanced greenhouse effect is the additional warming caused by human activities that increase greenhouse gas concentrations - burning fossil fuels (CO2), agriculture and livestock (methane), and deforestation. The mechanism is identical", "m": 1}, {"t": "what differs is the extra quantity of greenhouse gases and therefore the extra trapped energy", "m": 1}], "id": "geo-016", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 海平面上升（简答）", "difficulty": "hard", "type": "short", "stem": "Explain the two main mechanisms of sea level rise and describe two impacts on the Australian coast.", "answer": "First, thermal expansion: as seawater warms it expands and takes up more volume. Second, melting of land-based ice (glaciers, Greenland, Antarctica) adds water to the ocean. (Melting sea ice does not raise sea level because it already displaces its own weight.) Impacts: increased coastal erosion and shoreline retreat during storms; inundation of low-lying areas and infrastructure; saltwater intrusion into estuaries and coastal groundwater; loss of beaches and wetlands; greater damage from storm surges.", "explanation": "机理必须两项（热膨胀 + 陆地冰），并注意海冰不算。影响要落到澳洲海岸的具体后果（侵蚀、淹没、咸潮、湿地丧失）。", "source": "Yearly Study Guide 2026 · Geography Section II（sea level rise）", "points": [{"t": "First, thermal expansion: as seawater warms it expands and takes up more volume. Second, melting of land-based ice (glaciers, Greenland, Antarctica) adds water to the ocean. (Melting sea ice does not raise sea level because it already displaces its own weight.) Impacts: increased coastal erosion and shoreline retreat during storms", "m": 1}, {"t": "inundation of low-lying areas and infrastructure", "m": 1}, {"t": "saltwater intrusion into estuaries and coastal groundwater", "m": 1}, {"t": "loss of beaches and wetlands", "m": 1}, {"t": "greater damage from storm surges", "m": 1}], "id": "geo-017", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 海洋酸化（简答）", "difficulty": "hard", "type": "short", "stem": "Explain how ocean acidification occurs and why it threatens marine life.", "answer": "The ocean absorbs about a quarter of human CO2 emissions. Dissolved CO2 reacts with water to form carbonic acid (CO2 + H2O -> H2CO3), which releases hydrogen ions and lowers the pH of seawater (ocean acidification). The extra hydrogen ions combine with carbonate ions, reducing the carbonate available to organisms. Corals, shellfish and plankton need carbonate to build calcium carbonate shells and skeletons, so their growth slows and shells can dissolve, weakening reef structures and food webs.", "explanation": "三步：吸收 CO₂ → 生成碳酸、pH 下降 → 碳酸根减少、钙化受阻。最后要落到生物后果（珊瑚、贝类、浮游生物）。", "source": "Yearly Study Guide 2026 · Geography Section II（ocean acidification）", "points": [{"t": "The ocean absorbs about a quarter of human CO2 emissions", "m": 1}, {"t": "Dissolved CO2 reacts with water to form carbonic acid (CO2 + H2O -> H2CO3), which releases hydrogen ions and lowers the pH of seawater (ocean acidification)", "m": 1}, {"t": "The extra hydrogen ions combine with carbonate ions, reducing the carbonate available to organisms", "m": 1}, {"t": "Corals, shellfish and plankton need carbonate to build calcium carbonate shells and skeletons, so their growth slows and shells can dissolve, weakening reef structures and food webs", "m": 1}], "id": "geo-018", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 珊瑚白化（简答）", "difficulty": "hard", "type": "short", "stem": "Describe the process of coral bleaching and explain the conditions under which a reef can recover.", "answer": "Corals live in symbiosis with zooxanthellae, algae that live in their tissue, give them their colour and supply most of their energy through photosynthesis. When water temperatures rise well above the summer average (or the coral is stressed by pollution or extreme low tides), the coral expels the zooxanthellae. The coral tissue becomes transparent, showing the white calcium carbonate skeleton - bleaching. If the stress is short and temperatures return to normal, the coral can take up algae again and recover over weeks to months. If the heat stress persists, the coral starves and dies, and recovery can take a decade or more.", "explanation": "要写清『共生藻供给能量与颜色』这一环，否则解释不了为什么会死。恢复条件 = 热压力及时解除 + 水质好。", "source": "Yearly Study Guide 2026 · Geography Section II（ocean temperature and coral bleaching）", "points": [{"t": "Corals live in symbiosis with zooxanthellae, algae that live in their tissue, give them their colour and supply most of their energy through photosynthesis", "m": 1}, {"t": "When water temperatures rise well above the summer average (or the coral is stressed by pollution or extreme low tides), the coral expels the zooxanthellae", "m": 1}, {"t": "The coral tissue becomes transparent, showing the white calcium carbonate skeleton - bleaching", "m": 1}, {"t": "If the stress is short and temperatures return to normal, the coral can take up algae again and recover over weeks to months", "m": 1}, {"t": "If the heat stress persists, the coral starves and dies, and recovery can take a decade or more", "m": 1}], "id": "geo-019", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 天气图判读（简答）", "difficulty": "hard", "type": "short", "stem": "A synoptic chart shows a cold front approaching the NSW coast from the west, with a low pressure centre to the south and a high pressure system over the Tasman Sea. Predict the weather change over the next 24 hours and explain your reasoning.", "answer": "Before the front arrives: warm, moist north-westerly winds ahead of the front, rising temperature and humidity, increasing cloud. As the cold front crosses: a narrow band of heavy rain, thunderstorms, a sharp temperature drop and a wind shift from north-west to south-west, with a rapid rise in pressure afterwards. After the front passes: cooler, drier air, clearing skies and settled weather as the high moves in, with cold nights.", "explanation": "判读套路：锋前（暖湿、气压下降）→ 过境（暴雨、降温、风向突转）→ 锋后（干冷、转晴、气压回升）。每一项都要对应图中的要素。", "source": "Yearly Study Guide 2026 · Geography Section II（synoptic charts）", "points": [{"t": "Before the front arrives: warm, moist north-westerly winds ahead of the front, rising temperature and humidity, increasing cloud", "m": 1}, {"t": "As the cold front crosses: a narrow band of heavy rain, thunderstorms, a sharp temperature drop and a wind shift from north-west to south-west, with a rapid rise in pressure afterwards", "m": 1}, {"t": "After the front passes: cooler, drier air, clearing skies and settled weather as the high moves in, with cold nights", "m": 1}], "id": "geo-020", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · FLICC 反驳（简答）", "difficulty": "hard", "type": "short", "stem": "Someone posts: 'Climate has always changed, so this is natural. Scientists are only saying this to get more funding.' Identify the two FLICC techniques used and write a short, accurate rebuttal.", "answer": "The two techniques are: (1) cherry-picking/oversimplification - 'climate has always changed' ignores the rate and the different driver (natural cycles such as orbital change operated over tens of thousands of years, whereas current warming tracks the added greenhouse gases and is far faster), and (2) conspiracy theory - claiming scientists are motivated by funding rather than evidence. Rebuttal: natural factors alone cannot reproduce the observed warming of the last century, particularly the pattern of stratospheric cooling alongside tropospheric warming, which is the fingerprint of greenhouse gases. Scientific claims should be assessed on evidence and mechanism, not on assumed motives; the funding accusation is not evidence.", "explanation": "评分看两点：准确指出两种手法名称 + 给出基于证据的反驳。只骂人不给证据拿不到分。", "source": "Yearly Study Guide 2026 · Geography Section I（critical thinking · FLICC）", "points": [{"t": "The two techniques are: (1) cherry-picking/oversimplification - 'climate has always changed' ignores the rate and the different driver (natural cycles such as orbital change operated over tens of thousands of years, whereas current warming tracks the added greenhouse gases and is far faster), and (2) conspiracy theory - claiming scientists are motivated by funding rather than evidence. Rebuttal: natural factors alone cannot reproduce the observed warming of the last century, particularly the pattern of stratospheric cooling alongside tropospheric warming, which is the fingerprint of greenhouse gases. Scientific claims should be assessed on evidence and mechanism, not on assumed motives", "m": 1}, {"t": "the funding accusation is not evidence", "m": 1}], "id": "geo-021", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 缓解 vs 适应（简答）", "difficulty": "medium", "type": "short", "stem": "Define mitigation and adaptation in relation to climate change and give one Australian example of each.", "answer": "Mitigation reduces the causes of climate change by cutting greenhouse gas emissions or increasing carbon sinks - for example building large-scale solar and wind generation and retiring coal-fired power, or protecting and restoring coastal wetlands as a carbon sink. Adaptation reduces vulnerability to the effects that can no longer be avoided - for example building sea walls and dune restoration programs at Collaroy-Narrabeen, or planning retreat zones and raising building floor levels.", "explanation": "Mitigation = 减少 cause（减排/增汇）；Adaptation = 降低 impact（防护/回避）。例子要落到澳洲、最好落到海岸。", "source": "Yearly Study Guide 2026 · Geography（climate change responses）", "points": [{"t": "Mitigation reduces the causes of climate change by cutting greenhouse gas emissions or increasing carbon sinks - for example building large-scale solar and wind generation and retiring coal-fired power, or protecting and restoring coastal wetlands as a carbon sink", "m": 1}, {"t": "Adaptation reduces vulnerability to the effects that can no longer be avoided - for example building sea walls and dune restoration programs at Collaroy-Narrabeen, or planning retreat zones and raising building floor levels", "m": 1}], "id": "geo-022", "options": [], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geo-023", "topic": "环境变化 · 变化的速度与尺度", "difficulty": "easy", "type": "mcq", "stem": "Stimulus: A beach can lose a large volume of sand during a single East Coast Low, while a dune system may migrate inland over thousands of years. What does this comparison illustrate?", "options": ["That erosion is permanent and that deposition never occurs anywhere", "That coastal change is caused only by human activity", "That environmental change operates at different rates and scales", "That all coastal change is gradual rather than sudden"], "answer": 2, "explanation": "环境变化的时间尺度与空间尺度是 1.1 的核心概念：单次风暴可在数小时内改变海滩，沙丘迁移则需千年。两者并存，说明「变化」要按速率与尺度分别描述。", "source": "Term 3 · Lesson 1.1 Environmental Change（rate and scale of change）", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geo-024", "topic": "East Coast Lows · 天气图判读", "difficulty": "medium", "type": "mcq", "stem": "Stimulus: A synoptic chart shows tightly packed isobars and a closed low-pressure centre just off the NSW coast, with a cold front crossing the coast. What does this chart indicate, and why does it matter for Collaroy–Narrabeen?", "options": ["A stationary front producing no wind and no coastal impact", "A high-pressure ridge, bringing calm seas and steady offshore winds", "A tropical cyclone tracking inland across the ranges from the west", "An East Coast Low, bringing heavy rain and large erosion-driven waves"], "answer": 3, "explanation": "密集等压线＝气压梯度大＝强风；闭合低压＋冷锋＝东海岸低压，带来暴雨、强风与大浪。这正是 2016 年该海滩遭受严重侵蚀的天气背景。", "source": "Term 3 · Lesson 2.2 Understanding East Coast Lows（synoptic map）", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geo-025", "topic": "管理策略 · 预防／缓解／准备", "difficulty": "easy", "type": "mcq", "stem": "Which set correctly matches the three management categories taught in Lessons 3.1–3.2?", "options": ["Prevention — stopping change; mitigation — reducing impact; preparedness — planning response", "Prevention — reducing impact; mitigation — planning response; preparedness — stopping change", "All three categories describe the same action taken at different scales", "Prevention — planning response; mitigation — stopping change; preparedness — reducing impact"], "answer": 0, "explanation": "prevention 从源头避免（如禁止在前丘新建）、mitigation 减轻已发生变化的冲击（如海堤、补沙）、preparedness 为事件做准备（如预警与疏散）。分类决定评价标准，别混用。", "source": "Term 3 · Lessons 3.1–3.2 Sustainable Management of Coastal Ecosystems", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geo-026", "topic": "East Coast Lows · 2016 事件的机制", "difficulty": "hard", "type": "short", "stem": "Stimulus: A synoptic chart shows tightly packed isobars and a closed low off the NSW coast with a cold front crossing the coast. Explain why this system produced such destructive conditions at Collaroy–Narrabeen in 2016. (3 marks)", "options": [], "answer": "Tightly packed isobars mean a steep pressure gradient and therefore strong winds, which generate large waves and a storm surge that raises water levels at the shore. The cold front adds intense rainfall and runoff, so the combination of higher water and bigger waves produced a major storm cut and foredune erosion.", "explanation": "机制链：密集等压线→强风→大浪＋风暴增水；冷锋→暴雨。三者叠加正好赶上涨潮，才造成破坏性侵蚀。只写「风很大」拿不到满分。", "source": "Term 3 · Lesson 2.2 Understanding East Coast Lows", "points": [{"t": "Tightly packed isobars mean a steep pressure gradient and therefore strong winds, which generate large waves and a storm surge that raises water levels at the shore", "m": 1}, {"t": "The cold front adds intense rainfall and runoff, so the combination of higher water and bigger waves produced a major storm cut and foredune erosion", "m": 1}], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geo-027", "topic": "管理策略 · 分类与理由", "difficulty": "easy", "type": "short", "stem": "Classify each strategy as prevention, mitigation or preparedness, and justify your choice: (a) zoning that prevents new building on the foredune; (b) a seawall; (c) an evacuation plan. (3 marks)", "options": [], "answer": "(a) Prevention — it removes the exposure before damage can occur. (b) Mitigation — it reduces the impact of wave energy on assets that already exist. (c) Preparedness — it plans the response for when an event happens.", "explanation": "判断依据是「作用于变化之前／之中／之后」：预防在源头避免暴露，缓解降低既有资产的受损程度，准备安排事件发生时的应对。", "source": "Term 3 · Lessons 3.1–3.2 Sustainable Management of Coastal Ecosystems", "points": [{"t": "(a) Prevention — it removes the exposure before damage can occur", "m": 1}, {"t": "(b) Mitigation — it reduces the impact of wave energy on assets that already exist", "m": 1}, {"t": "(c) Preparedness — it plans the response for when an event happens", "m": 1}], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geo-028", "topic": "海堤争议 · 立场评估", "difficulty": "hard", "type": "short", "stem": "Stimulus: Two stakeholders disagree about the Collaroy–Narrabeen seawall. One argues it protects homes; the other argues it damages the beach and shifts erosion along the coast. Evaluate both positions using your knowledge of coastal processes. (5 marks)", "options": [], "answer": "The protection argument is valid in the short term: the wall prevents wave attack on the houses immediately behind it. The criticism is also valid: a vertical wall reflects wave energy, removes sediment from the beach budget and can increase erosion at the ends of the wall, so the beach in front narrows and the problem shifts along the coast. The decision therefore trades protection of private assets against the loss of public beach.", "explanation": "评估题要「两边都成立＋说明代价」：短期保护有效，但过程代价（反射、输沙收支改变、侵蚀转移）真实存在。只站一边不给高分。", "source": "Term 3 · Lesson 3.3 The Controversial Seawall（stakeholder perspectives）", "points": [{"t": "The protection argument is valid in the short term: the wall prevents wave attack on the houses immediately behind it", "m": 1}, {"t": "The criticism is also valid: a vertical wall reflects wave energy, removes sediment from the beach budget and can increase erosion at the ends of the wall, so the beach in front narrows and the problem shifts along the coast", "m": 1}, {"t": "The decision therefore trades protection of private assets against the loss of public beach", "m": 1}], "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"id": "geoother-001", "topic": "人类福祉 · 国内生产总值", "difficulty": "easy", "type": "mcq", "stem": "Why do geographers use GDP per capita rather than total GDP when comparing the wellbeing of different countries?", "options": ["It divides GDP by population, so countries of different size can be compared", "It measures only the income earned by the very richest people in that country", "It measures the value of unpaid work done inside the household", "It removes the need for any other development measure or index"], "answer": 0, "explanation": "人均 GDP＝GDP÷人口，解决人口大国总量天然偏高的问题。但它仍不反映分配是否公平，也不能取代 HDI 等指标。", "source": "Term 1 · Week 2 Global — Measuring and Mapping Human Wellbeing", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-002", "topic": "人类福祉 · 人类发展指数", "difficulty": "easy", "type": "mcq", "stem": "The Human Development Index (HDI) combines which three dimensions?", "options": ["GDP, inflation rate and the unemployment rate", "Health, education and standard of living (GNI per capita)", "Population size, land area and length of coastline", "Life expectancy, birth rate and the death rate"], "answer": 1, "explanation": "HDI 三个维度是健康（预期寿命）、教育（平均与预期受教育年限）、生活水平（人均国民总收入）。它把 GDP 之外的健康与教育纳入，因此比单一经济指标更全面。", "source": "Term 1 · Week 2 Global — Lesson 3: quantitative (GDP) vs qualitative (HDI)", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-003", "topic": "人口 · 老龄化数据解读", "difficulty": "medium", "type": "mcq", "stem": "In the population-pyramid lesson students study China's ageing population. The source states that by 2100, 37.8% of China's population is projected to be aged over 60. Which is the most likely implication of this figure?", "options": ["A rising birth rate that will require many new schools and many more teachers", "A population pyramid with a very wide base and a much narrower top", "A smaller workforce supporting a larger elderly group, straining pensions", "A rapidly growing labour force that will raise industrial output sharply"], "answer": 2, "explanation": "老年人口占比接近四成意味着抚养比上升、劳动力相对减少，财政压力集中在医疗与养老。「A population pyramid with a very wide base and a much narrower top」（宽底金字塔）描述的是高出生率的扩张型人口，与老龄化相反。", "source": "Term 1 · Weeks 3–4 Geographic Skills — China's Ageing Population (37.8% over 60 by 2100)", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-004", "topic": "福祉差异 · 悉尼社会经济格局", "difficulty": "hard", "type": "short", "stem": "Describe the spatial pattern of advantage and disadvantage in Sydney and explain one factor that produces it.", "options": [], "answer": "Advantage is concentrated in the east, north and harbour-side suburbs, while disadvantage is concentrated in the west and south-west. Higher incomes, employment and better access to services, schools and healthy food cluster in the advantaged areas, while high housing costs push lower-income households further from those opportunities.", "explanation": "答题要点是「格局＋一个成因」：格局（东／北 vs 西／西南）＋成因（收入、房价、服务与就业可达性）。课程 scaffold 正是要求这两部分。", "source": "Term 1 · Weeks 7–8 Local — Sydney's socio-economic divide (East vs West)", "points": [{"t": "Advantage is concentrated in the east, north and harbour-side suburbs, while disadvantage is concentrated in the west and south-west", "m": 1}, {"t": "Higher incomes, employment and better access to services, schools and healthy food cluster in the advantaged areas, while high housing costs push lower-income households further from those opportunities", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-005", "topic": "原住民福祉 · 圆桌量刑", "difficulty": "easy", "type": "mcq", "stem": "Circle sentencing in NSW is best described as:", "options": ["A separate court that hears only cases involving young offenders", "A process that replaces the court entirely with a community tribunal", "A police caution given before any charge is laid against an offender", "A sentencing process where Elders sit with a magistrate after a guilty verdict"], "answer": 3, "explanation": "圆桌量刑发生在有罪判决之后，由长者与社区成员参与量刑讨论，目的是提高文化适应性并降低再犯。它既不取代法院，也不是审判前程序。", "source": "Term 2 · Week 2.3 First Nations Justice — Action (circle sentencing)", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-006", "topic": "地理技能 · 三元图", "difficulty": "medium", "type": "mcq", "stem": "On a ternary graph, what do the three axes represent?", "options": ["Three parts of a whole that add to 100%, read off one point", "Three separate time periods shown along a single horizontal line", "Three separate graphs placed side by side on one page", "Three countries compared by their total population"], "answer": 0, "explanation": "三元图表示三个分量构成 100% 的比例关系（如就业结构、土壤成分）。读图时要沿各自的轴向读数，三者相加必须为 100。", "source": "Term 2 · Week 10.1 Ternary Graphs", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-007", "topic": "地理技能 · 面积参照与网格参照", "difficulty": "medium", "type": "mcq", "stem": "Which statement correctly distinguishes an area reference (AR) from a grid reference (GR)?", "options": ["An AR gives elevation in metres; a GR gives distance in km", "An AR uses four figures for a square; a GR uses six for a point", "An AR is used on small-scale maps; a GR only on précis maps", "An AR uses six figures for a point; a GR uses four for a grid square"], "answer": 1, "explanation": "AR 四位数字定位一个方格（约 1 km×1 km）；GR 六位数字定位方格内的具体点位（精确到 100 m）。两者位数顺序不要记反。", "source": "Term 1 · Weeks 3–4 Topographic Skills — AR, GR and elevation", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-008", "topic": "原住民福祉 · 量刑成效评估", "difficulty": "medium", "type": "short", "stem": "Explain one way circle sentencing could improve outcomes for First Nations people compared with a standard court process.", "options": [], "answer": "It involves Elders and community members in deciding the sentence, so the outcome reflects the offender's community and culture and the offender is held accountable in front of people they know. This can increase respect for the process and reduce reoffending, which matters given the over-representation of Aboriginal people in custody.", "explanation": "要写出「机制→结果」：社区与长者参与→文化安全与问责→更可能被接受、再犯率下降。只写「更公平」拿不到分。", "source": "Term 2 · Weeks 2.3 / 3.1 First Nations Justice — Action & Outcome", "points": [{"t": "It involves Elders and community members in deciding the sentence, so the outcome reflects the offender's community and culture and the offender is held accountable in front of people they know", "m": 1}, {"t": "This can increase respect for the process and reduce reoffending, which matters given the over-representation of Aboriginal people in custody", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-009", "topic": "气候变化 · 选择性引用", "difficulty": "easy", "type": "mcq", "stem": "In the climate misinformation lessons, 'cherry picking' as a science-denial technique means:", "options": ["Choosing only the most reliable long-term dataset available", "Repeating an experiment until the results agree with the theory you hold", "Selecting data that support a position while ignoring contrary data", "Refusing to accept any scientific evidence whatsoever on the topic"], "answer": 2, "explanation": "选择性引用是 FLICC 五种手法之一：只挑对自己有利的数据点，忽略整体趋势。课上的反思问题正是让学生自查有没有这样做过。", "source": "Term 4 · Lessons 1.1–1.2 Climate misinformation (FLICC) / Lesson 2.1", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-010", "topic": "气候变化 · 增强温室效应", "difficulty": "medium", "type": "mcq", "stem": "How does the enhanced greenhouse effect differ from the natural greenhouse effect?", "options": ["The enhanced effect is caused by more solar radiation reaching Earth", "Human activity has removed the natural effect, so less heat is trapped", "The natural effect involves only incoming solar radiation, with no re-emission of heat", "Human greenhouse gas emissions trap more infrared radiation, adding to warming"], "answer": 3, "explanation": "自然温室效应本身使地球适宜居住；人类排放的额外温室气体增强了它，使更多红外辐射被吸收并重新辐射回地表。区分两者是常见考点。", "source": "Term 4 · Lesson 2.2 What are the causes of climate change? (Part 1)", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-011", "topic": "气候变化 · 珊瑚白化", "difficulty": "easy", "type": "mcq", "stem": "How does rising sea temperature cause coral bleaching?", "options": ["Heat stress makes corals expel their symbiotic algae, losing colour and food", "Warmer water dissolves the corals' calcium carbonate skeleton directly", "Warmer water multiplies the algae living inside corals, making them overgrow faster", "Corals absorb more dissolved carbon dioxide and so grow much faster"], "answer": 0, "explanation": "珊瑚与虫黄藻共生；高温胁迫下珊瑚排出虫黄藻，失去颜色与主要营养来源。若高温持续，珊瑚会死亡，而不只是变白。", "source": "Term 4 · Lesson 3.3 How does sea temperature rise lead to coral bleaching?", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-012", "topic": "气候变化 · 全球变暖与气候变化", "difficulty": "easy", "type": "mcq", "stem": "Lesson 2.1 asks students to distinguish between global warming and climate change. Which statement is correct?", "options": ["Global warming refers only to sea temperatures; climate change only to air temperatures", "Global warming is rising average temperature; climate change also covers rainfall and sea level", "The two terms mean exactly the same thing and can be used interchangeably in every case", "Climate change happens naturally, while global warming is a separate process unrelated to it"], "answer": 1, "explanation": "全球变暖是「平均气温上升」这一部分；气候变化范围更广，还包括降水、海平面、冰盖与极端天气的变化。两者相关但不等同。", "source": "Term 4 · Lesson 2.1 EVIDENCE — distinguishing global warming from climate change", "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-013", "topic": "气候变化 · 海洋酸化", "difficulty": "hard", "type": "short", "stem": "Explain how ocean acidification impacts marine life.", "options": [], "answer": "The ocean absorbs extra carbon dioxide, which forms carbonic acid and lowers the pH of seawater. This reduces the availability of carbonate ions, so organisms such as corals, shellfish and some plankton cannot build or maintain their shells and skeletons, which then affects the wider food chain.", "explanation": "机制链是：CO2 溶入海水→生成碳酸→pH 下降→碳酸根离子减少→钙化生物难以造壳与骨骼→食物链受影响。", "source": "Term 4 · Lesson 4.1 Ocean Acidification & Its Impact on Marine Life", "points": [{"t": "The ocean absorbs extra carbon dioxide, which forms carbonic acid and lowers the pH of seawater", "m": 1}, {"t": "This reduces the availability of carbonate ions, so organisms such as corals, shellfish and some plankton cannot build or maintain their shells and skeletons, which then affects the wider food chain", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "geoother-014", "topic": "气候变化 · 海平面上升的案例", "difficulty": "hard", "type": "short", "stem": "Using the Solomon Islands case study, explain two impacts of sea level rise on low-lying Pacific nations.", "options": [], "answer": "First, higher seas and larger storm surges erode beaches and inundate low-lying land, so villages, gardens and fresh-water supplies are lost and communities are forced to relocate. Second, salt water intrudes into soil and groundwater, reducing the land available for growing food and increasing dependence on outside aid.", "explanation": "分两个层面答：环境与土地（侵蚀、淹没、咸水入侵）以及社会经济（被迫搬迁、粮食与水源短缺、依赖援助）。", "source": "Term 4 · Lesson 3.2 Sea level rise — Solomon Islands case study", "points": [{"t": "First, higher seas and larger storm surges erode beaches and inundate low-lying land, so villages, gardens and fresh-water supplies are lost and communities are forced to relocate", "m": 1}, {"t": "Second, salt water intrudes into soil and groundwater, reducing the land available for growing food and increasing dependence on outside aid", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "地理 · 非年考内容"}, {"id": "pdh-001", "topic": "风险行为 · 正负风险举例", "difficulty": "easy", "type": "short", "stem": "List THREE examples of positive risk taking and THREE examples of negative risk taking.", "options": [], "answer": "Positive: trying a new sport such as rock climbing or martial arts; joining the school play or band; volunteering for a community cause or running for the school committee. Negative: binge drinking or vaping; sexting; getting a lift with a driver who has been drinking; dangerous driving; skipping school; trespassing or vandalism.", "explanation": "得分点拆分：正面例子 3 个各 1 分（3 分）；负面例子 3 个各 1 分（3 分）。若再用一句话点出区别——正面风险仍带不确定性，但结果是新技能或成长；负面风险带来伤害、法律后果或健康损失——可另得 1 分。常见失分：把「坐酒驾者的车」当成驾驶行为本身，它同样属于负面风险。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Risk taking", "points": [{"t": "Positive: trying a new sport such as rock climbing or martial arts", "m": 1}, {"t": "joining the school play or band", "m": 1}, {"t": "volunteering for a community cause or running for the school committee. Negative: binge drinking or vaping", "m": 1}, {"t": "getting a lift with a driver who has been drinking", "m": 1}, {"t": "dangerous driving", "m": 1}, {"t": "skipping school", "m": 1}, {"t": "trespassing or vandalism", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-002", "topic": "健康服务 · 就医障碍与影响", "difficulty": "hard", "type": "short", "stem": "List FIVE barriers that stop people from accessing health services. For TWO of the barriers, explain the effect this may have on a person's health.", "options": [], "answer": "Barriers: cost; fear about confidentiality; low health literacy (not realising a condition is treatable); transport and distance, especially in rural areas; long waiting times and complicated booking systems; language and communication difficulties; stigma and embarrassment; not knowing which service to contact. Effects: (1) Cost — a young person delays seeing a GP or dentist, so a treatable condition worsens and may eventually need hospital care. (2) Fear about confidentiality — they avoid discussing mental or sexual health with a doctor, so the problem goes untreated and can escalate into a crisis.", "explanation": "得分点拆分：列出 5 个障碍各 1 分（5 分）；自选其中 2 个各解释健康影响 1 分（2 分），要写出「延误→恶化／并发症／危机」的因果链；表达与结构 1 分。常见失分：第二部分只是把障碍重说一遍（如「费用高所以很贵」），没有落到健康后果，不得分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Barriers to accessing health services", "points": [{"t": "Barriers: cost", "m": 1}, {"t": "fear about confidentiality", "m": 1}, {"t": "low health literacy (not realising a condition is treatable)", "m": 1}, {"t": "transport and distance, especially in rural areas", "m": 1}, {"t": "long waiting times and complicated booking systems", "m": 1}, {"t": "language and communication difficulties", "m": 1}, {"t": "stigma and embarrassment", "m": 1}, {"t": "not knowing which service to contact. Effects: (1) Cost — a young person delays seeing a GP or dentist, so a treatable condition worsens and may eventually need hospital care. (2) Fear about confidentiality — they avoid discussing mental or sexual health with a doctor, so the problem goes untreated and can escalate into a crisis", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-003", "topic": "健康服务 · 面向青少年的服务", "difficulty": "easy", "type": "short", "stem": "List FIVE health services that are available for young people in Australia.", "options": [], "answer": "A general practitioner (GP) under Medicare; Headspace or another youth mental health service; the school counsellor; a dental clinic; a sexual health clinic; physiotherapy; a community health centre; a pharmacy; a hospital emergency department; a dietitian or nutritional support service.", "explanation": "得分点拆分：每写出一个具体服务 1 分，共 5 分。必须写具体机构或服务类型，只写「看医生」「去医院」这类笼统说法不给分；若能注明其中哪些对青少年免费或低价（Medicare、Headspace、学校辅导员）可加 1 分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Health services for young people", "points": [{"t": "A general practitioner (GP) under Medicare; Headspace or another youth mental health service; the school counsellor; a dental clinic; a sexual health clinic; physiotherapy; a community health centre; a pharmacy; a hospital emergency department; a dietitian or nutritional support service.", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-004", "topic": "道路安全 · 事故主要原因排序", "difficulty": "medium", "type": "mcq", "stem": "Which list ranks the leading causes of fatal road crashes in NSW from LARGEST to SMALLEST contribution (2025 data)?", "options": ["Speeding – Fatigue – Drink/drug impairment – Not wearing a seatbelt – Distraction", "Distraction – Speeding – Fatigue – Not wearing a seatbelt – Drink/drug impairment", "Drink/drug impairment – Speeding – Fatigue – Distraction – Not wearing a seatbelt", "Fatigue – Speeding – Distraction – Drink/drug impairment – Not wearing a seatbelt"], "answer": 0, "explanation": "得分点拆分：排序全对 2 分，只对前半部分（超速第一、疲劳第二）1 分。2025 新州数据：超速第一（约 39–40% 致命撞车涉及超速，134 人死亡）；疲劳第二（约 20–21%，75 人死亡）；酒驾毒驾第三；未系安全带第四（29 人死亡）；分心第五（常被漏报）。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Rank the top 5 causes + Term 1 · Lesson 2–3 (2025 Fatal Five)", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-005", "topic": "道路安全 · Haddon 矩阵与可控因素", "difficulty": "medium", "type": "short", "stem": "Road crashes are caused by a combination of human, vehicle and environmental factors. Classify each of the following, then explain which category is easiest to change and why: (a) a driver using a mobile phone; (b) worn brake pads; (c) a wet road on a bend.", "options": [], "answer": "(a) Human factor. (b) Vehicle factor. (c) Environmental factor. The human category is easiest to change, because the driver directly controls their own behaviour — speed, phone use, seatbelt use, fatigue and alcohol can all be changed through education, laws and police enforcement. Vehicle and environmental factors also matter, but about 95% of crashes involve human factors alone or in combination, so changing driver behaviour has the biggest effect on the road toll.", "explanation": "得分点拆分：三项分类各 1 分（3 分）；指出人为因素最易改变 1 分；理由 2 分（驾驶人可控、约 95% 事故涉及人为因素、靠教育＋立法＋执法改变）。常见失分：只写「人为因素最多」而没解释「为什么可以被改变」，理由分只能拿一半。", "source": "Term 1 · Lesson 2–3 Factors influencing road and traffic incidents（对应清单 List the major causes 一题）", "points": [{"t": "The human category is easiest to change, because the driver directly controls their own behaviour — speed, phone use, seatbelt use, fatigue and alcohol can all be changed through education, laws and police enforcement", "m": 1}, {"t": "Vehicle and environmental factors also matter, but about 95% of crashes involve human factors alone or in combination, so changing driver behaviour has the biggest effect on the road toll", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-006", "topic": "道路安全 · 车内分心来源", "difficulty": "easy", "type": "mcq", "stem": "Which two are the most common distractions for a driver that come from INSIDE the vehicle?", "options": ["Checking a map and setting a GPS destination", "Using a mobile phone and interacting with passengers", "Adjusting the radio and the air-conditioning controls", "Eating food and drinking coffee while driving"], "answer": 1, "explanation": "得分点拆分：认出两项各 1 分（2 分）。手机与乘客互动是最主要的两项——用手机时撞车风险约提高 4 倍；P 牌司机载 3 名以上乘客事故几率翻倍以上。其余选项（音响、吃喝、导航）确实属于车内分心，但不是最常见的两项，选它们会失去「最常见」的分数。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Driver distractions + Term 1 · Lesson 2–3 & Lesson 5 Safety Plans", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-007", "topic": "驾驶知识 · BAC 三个空", "difficulty": "easy", "type": "mcq", "stem": "What are the legal blood alcohol concentration (BAC) limits in NSW for a learner, a provisional and a full licence holder?", "options": ["0.00 for learner, 0.05 for provisional, 0.05 for full", "0.02 for learner, 0.02 for provisional, 0.05 for full", "0.00 for learner, 0.00 for provisional, 0.05 for full", "0.05 for learner, 0.05 for provisional, 0.05 for full"], "answer": 2, "explanation": "得分点拆分：三个空各 1 分——Learner 0.00、Provisional 0.00、Full 0.05。最常见的错法是把 P 牌写成 0.05；新州 P 牌与 L 牌一样必须为零，全牌上限才是 0.05。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · BAC（数值按 NSW 法定标准，课程标准补充）", "weak": true, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-008", "topic": "网络与游戏 · 三种动机驱动", "difficulty": "medium", "type": "mcq", "stem": "The lesson says games fall into three motivational drives. Which set is correct?", "options": ["Social, competition and loss of rewards", "Social, peer pressure and punishment for logging off", "Skill, reward and punishment for losing rank", "Social, pleasure (intermittent reward) and pain"], "answer": 3, "explanation": "得分点拆分：三个空各 1 分（3 分）——Social（如 Farmville，和朋友一起经营自己的世界）、Pleasure／intermittent reward（如 Call of Duty，间歇给奖励，让人一直想再来一次）、Pain（如 World of Warcraft，用掉段位、清空奖励惩罚下线的人）。只写「好玩」「上瘾」这类笼统词不给分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Games – three motivational drives + Term 1 · Lesson 9 Online Safety", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-009", "topic": "人际关系 · 尊重关系的五个特征", "difficulty": "easy", "type": "short", "stem": "List FIVE common features of respectful relationships.", "options": [], "answer": "Mutual respect; trust; honesty; open communication; consent; equality (no one holds all the power); freedom to be yourself; support and encouragement.", "explanation": "得分点拆分：每个特征 1 分，共 5 分。要写课程术语（mutual respect / trust / consent / open communication / equality），只写「对你好」「不吵架」这类笼统描述不给分；写出 6 个但有一个重复，仍只按 5 个计。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Features of respectful relationships", "points": [{"t": "Mutual respect", "m": 1}, {"t": "open communication", "m": 1}, {"t": "equality (no one holds all the power)", "m": 1}, {"t": "freedom to be yourself", "m": 1}, {"t": "support and encouragement", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-010", "topic": "人际关系 · 权力的正面使用", "difficulty": "medium", "type": "short", "stem": "Give examples of the POSITIVE use of power in a relationship.", "options": [], "answer": "Using influence to support and encourage the other person; making decisions together and giving them a voice; standing up for someone who is being bullied; mentoring a younger player and sharing responsibility; being honest about your own limits and asking for their input; using a leadership role to make sure everyone is included.", "explanation": "得分点拆分：每个具体例子 1 分，通常给 3–4 分。判断标准是「权力被用来让对方更有选择、让关系更平等」。注意：替对方做所有决定即使出发点是保护，也属于负面（控制）用法，这一点常被写反。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Positive use of power", "points": [{"t": "Using influence to support and encourage the other person", "m": 1}, {"t": "making decisions together and giving them a voice", "m": 1}, {"t": "standing up for someone who is being bullied", "m": 1}, {"t": "mentoring a younger player and sharing responsibility", "m": 1}, {"t": "being honest about your own limits and asking for their input", "m": 1}, {"t": "using a leadership role to make sure everyone is included", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-011", "topic": "人际关系 · 权力的负面使用", "difficulty": "easy", "type": "short", "stem": "Give examples of the NEGATIVE use of power in a relationship.", "options": [], "answer": "Coercion or threats; manipulation and guilt-tripping; peer pressure to do something risky; bullying or public humiliation; controlling who the other person sees or what they wear; withholding money or information; using physical size or status to intimidate; pressuring someone about consent.", "explanation": "得分点拆分：每个具体例子 1 分，通常给 3–4 分。负面权力的共同点是「用地位、力量或信息差让对方失去选择权」——凡是让人不敢拒绝的做法都算，包括冷暴力和经济控制，不只是动手。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Negative use of power", "points": [{"t": "Coercion or threats", "m": 1}, {"t": "manipulation and guilt-tripping", "m": 1}, {"t": "peer pressure to do something risky", "m": 1}, {"t": "bullying or public humiliation", "m": 1}, {"t": "controlling who the other person sees or what they wear", "m": 1}, {"t": "withholding money or information", "m": 1}, {"t": "using physical size or status to intimidate", "m": 1}, {"t": "pressuring someone about consent", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-012", "topic": "人际关系 · 四种沟通方式", "difficulty": "hard", "type": "short", "stem": "List and describe the FOUR communication styles.", "options": [], "answer": "Passive: holding back your own needs and going along with others, often to avoid conflict. Aggressive: putting your own needs first and disregarding or violating the other person's rights (shouting, blaming, threats). Passive-aggressive: expressing anger indirectly — sulking, sarcasm, silent treatment or gossiping instead of saying it directly. Assertive: stating your needs clearly and calmly while respecting the other person's needs, using 'I' statements and staying open to negotiation.", "explanation": "得分点拆分：四种类型名称各 1 分（4 分），描述准确各 1 分（4 分）。判定关键是「自己的需求 vs 对方的需求」这个二维坐标：被动＝放弃自己；攻击＝压过对方；被动攻击＝不当面说、用冷暴力或阴阳怪气；果断＝两边都顾到。只写名称不描述，描述分全失。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Four communication styles（得分点按课程内容整理）", "points": [{"t": "Passive: holding back your own needs and going along with others, often to avoid conflict", "m": 1}, {"t": "Aggressive: putting your own needs first and disregarding or violating the other person's rights (shouting, blaming, threats)", "m": 1}, {"t": "Passive-aggressive: expressing anger indirectly — sulking, sarcasm, silent treatment or gossiping instead of saying it directly", "m": 1}, {"t": "Assertive: stating your needs clearly and calmly while respecting the other person's needs, using 'I' statements and staying open to negotiation", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-013", "topic": "自我认知 · sense of self", "difficulty": "easy", "type": "short", "stem": "Describe what SENSE OF SELF means.", "options": [], "answer": "A sense of self is how a person sees and values themselves — their self-esteem, self-worth and personal identity. It includes their beliefs about who they are, their values, their strengths and weaknesses, and how they think others see them. It is shaped by family, peers, culture, media, school and personal experience, and it keeps changing through adolescence.", "explanation": "得分点拆分：定义（怎么看自己）1–2 分；组成部分（自尊、自我价值、身份、价值观）1–2 分；影响因素（家庭、同伴、媒体、文化、经历）1 分。注意 sense of self 不等于「自信」——自信只是其中一个成分，只写自信只能拿部分分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Sense of self（得分点按课程内容整理）", "points": [{"t": "A sense of self is how a person sees and values themselves — their self-esteem, self-worth and personal identity", "m": 1}, {"t": "It includes their beliefs about who they are, their values, their strengths and weaknesses, and how they think others see them", "m": 1}, {"t": "It is shaped by family, peers, culture, media, school and personal experience, and it keeps changing through adolescence", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-014", "topic": "心理健康 · 污名的定义与影响", "difficulty": "medium", "type": "short", "stem": "Describe what the term STIGMA means and explain how it can affect a young person with a mental illness.", "options": [], "answer": "Stigma is a cluster of negative attitudes and beliefs that lead people to fear, reject, avoid and discriminate against those with a mental illness. It labels the person rather than the illness. For a young person it can cause shame and isolation, lead to bullying or being left out, and stop them telling anyone or seeking treatment, so the condition gets worse.", "explanation": "得分点拆分：定义须包含「负面标签→恐惧／排斥／歧视」2 分；对青少年的影响 2 分（羞耻与孤立、被欺凌或排斥、不敢求助导致病情恶化）。只写「别人看不起他」这类口语表达只能拿 1 分，因为没有体现歧视与回避。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Stigma + Term 2 · Lesson 2 Myths, Misconceptions & Stigma", "points": [{"t": "Stigma is a cluster of negative attitudes and beliefs that lead people to fear, reject, avoid and discriminate against those with a mental illness", "m": 1}, {"t": "It labels the person rather than the illness", "m": 1}, {"t": "For a young person it can cause shame and isolation, lead to bullying or being left out, and stop them telling anyone or seeking treatment, so the condition gets worse", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-015", "topic": "心理健康 · 四种常见精神疾病", "difficulty": "medium", "type": "short", "stem": "List and describe FOUR common mental health disorders.", "options": [], "answer": "Depression: persistent low mood and loss of interest for weeks, with low confidence, changed appetite and sleep, tiredness and, at worst, suicidal thoughts. Anxiety: excessive worry with physical tension, difficulty concentrating, avoidance of situations and being easily startled. Bipolar disorder: mood swings between manic highs (elevated energy, little sleep, risky behaviour) and depressive lows. Schizophrenia: disturbance of thinking and perception, including delusions and hallucinations, which changes how the person interprets reality. (Eating disorders and PTSD are also acceptable answers.)", "explanation": "得分点拆分：每种病名称 1 分＋典型症状描述 1 分，四组共 4–8 分。描述必须写该病特有的症状：把「心情不好」当抑郁、把「考试前紧张」当焦虑会失分。常见失分：四种都写了名称，但没有一个有具体症状。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Common mental health disorders + Term 2 · Lesson 1", "points": [{"t": "Depression: persistent low mood and loss of interest for weeks, with low confidence, changed appetite and sleep, tiredness and, at worst, suicidal thoughts", "m": 1}, {"t": "Anxiety: excessive worry with physical tension, difficulty concentrating, avoidance of situations and being easily startled", "m": 1}, {"t": "Bipolar disorder: mood swings between manic highs (elevated energy, little sleep, risky behaviour) and depressive lows", "m": 1}, {"t": "Schizophrenia: disturbance of thinking and perception, including delusions and hallucinations, which changes how the person interprets reality", "m": 1}, {"t": "(Eating disorders and PTSD are also acceptable answers.)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-016", "topic": "青春期 · 与父母关系的变化", "difficulty": "hard", "type": "short", "stem": "Explain why a teenager's relationship with their parents often changes during adolescence. Discuss at least TWO social changes and TWO emotional changes.", "options": [], "answer": "Social changes: teenagers develop their own values and are influenced more by peers and media than by parents, so conflict over rules increases; they form a sexual identity and want more privacy; they seek independence and greater responsibility, and want to negotiate rather than be told what to do. Emotional changes: moods and feelings swing more widely, they become more sensitive to others' opinions and self-conscious about how they look, and they want to make their own decisions. As a result the relationship shifts from parent-controlled to more equal, with more negotiation and sometimes more conflict, and it usually settles again as independence is worked out.", "explanation": "得分点拆分：社会变化至少 2 项并解释（2–3 分）；情感变化至少 2 项并解释（2–3 分）；指出关系总体从「被管」转向「协商／平等」并说明结果（1–2 分）。常见失分：只罗列清单里的关键词（values、identity、moods），不解释它们如何改变亲子互动，最多拿一半分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Adolescent relationships", "points": [{"t": "Social changes: teenagers develop their own values and are influenced more by peers and media than by parents, so conflict over rules increases", "m": 1}, {"t": "they form a sexual identity and want more privacy", "m": 1}, {"t": "they seek independence and greater responsibility, and want to negotiate rather than be told what to do. Emotional changes: moods and feelings swing more widely, they become more sensitive to others' opinions and self-conscious about how they look, and they want to make their own decisions. As a result the relationship shifts from parent-controlled to more equal, with more negotiation and sometimes more conflict, and it usually settles again as independence is worked out", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-017", "topic": "沟通 · 好的倾听者特征", "difficulty": "easy", "type": "short", "stem": "List some features of a good listener.", "options": [], "answer": "Gives eye contact and open body language; puts the phone away and stops other tasks; does not interrupt; lets the speaker finish before replying; asks clarifying questions; paraphrases or summarises what was said; shows empathy and does not judge; keeps the conversation confidential.", "explanation": "得分点拆分：每个特征 1 分，通常给 4–5 分。要写可观察的具体行为（眼神接触、不打断、复述要点、把手机放下）；只写「认真听」「很关心他」这种抽象评价不给分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Features of a good listener", "points": [{"t": "Gives eye contact and open body language", "m": 1}, {"t": "puts the phone away and stops other tasks", "m": 1}, {"t": "does not interrupt", "m": 1}, {"t": "lets the speaker finish before replying", "m": 1}, {"t": "asks clarifying questions", "m": 1}, {"t": "paraphrases or summarises what was said", "m": 1}, {"t": "shows empathy and does not judge", "m": 1}, {"t": "keeps the conversation confidential", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-018", "topic": "人际关系 · 分析维持尊重关系的行为", "difficulty": "hard", "type": "short", "stem": "Analyse the behaviours needed to maintain respectful relationships. Use at least FOUR of: trust, honesty, freedom, consent, open communication, mutual respect. You must describe each behaviour, show how the behaviours affect each other, and discuss the implications.", "options": [], "answer": "Description: trust is the confidence that the other person will not hurt or betray you; honesty means telling the truth even when it is difficult; freedom is each person's right to their own friends, interests and choices; consent means a clear, freely given yes to any physical or emotional intimacy; open communication means saying what you think and feel, and listening in return; mutual respect means treating the other person as an equal whose needs matter. Interaction: without honesty there can be no trust, therefore a relationship built on small lies gradually loses its security; without open communication consent cannot be given or checked, so respect breaks down and conflict or harm follows. Implications: a relationship missing trust and respect tends to become controlling or collapse, leading to emotional harm, isolation and, for young people, damage to self-esteem and mental health.", "explanation": "得分点拆分：描述 4 个行为各 1 分（4 分）；用连接词（therefore / as a result / leading to）说明行为之间的因果关系 2–3 分；讨论后果与影响（对个人、家庭、心理健康）2–3 分。分水岭在「分析」：只逐条解释、不写一个行为如何导致另一个行为，就拿不到分析与影响的分。", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Analysing respectful relationships", "points": [{"t": "Description: trust is the confidence that the other person will not hurt or betray you", "m": 1}, {"t": "honesty means telling the truth even when it is difficult", "m": 1}, {"t": "freedom is each person's right to their own friends, interests and choices", "m": 1}, {"t": "consent means a clear, freely given yes to any physical or emotional intimacy", "m": 1}, {"t": "open communication means saying what you think and feel, and listening in return", "m": 1}, {"t": "mutual respect means treating the other person as an equal whose needs matter. Interaction: without honesty there can be no trust, therefore a relationship built on small lies gradually loses its security", "m": 1}, {"t": "without open communication consent cannot be given or checked, so respect breaks down and conflict or harm follows. Implications: a relationship missing trust and respect tends to become controlling or collapse, leading to emotional harm, isolation and, for young people, damage to self-esteem and mental health", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-019", "topic": "急救 · DRSABCD 顺序", "difficulty": "easy", "type": "mcq", "stem": "In the DRSABCD action plan, what must you do FIRST before attending to a casualty?", "options": ["Check the area is safe for you, bystanders and the casualty", "Send another person to dial triple zero (000) straight away", "Check for a response by squeezing their shoulders firmly", "Start chest compressions on the casualty straight away"], "answer": 0, "explanation": "得分点拆分：顺序 1 分（D 在最前），理由 1 分（救援者自身安全优先）。D 是 Danger，不是 Defibrillation；现场不安全时应先撤离再呼救，而不是冲上去做 CPR。", "source": "Term 3 · Lesson 5 First Aid · DANGER", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-020", "topic": "急救 · CPR 按压通气比", "difficulty": "easy", "type": "mcq", "stem": "When performing CPR on an adult, what is the correct compression-to-breath ratio?", "options": ["50 compressions : 5 breaths", "30 compressions : 2 breaths", "15 compressions then 2 breaths", "5 compressions : 1 breath"], "answer": 1, "explanation": "得分点拆分：比例 30:2 记 1 分。还要知道开始 CPR 后只有三种情况可以停：救援到达、伤员恢复、或你体力上确实无法继续——这一条常在情景题里考。", "source": "Term 3 · Lesson 5 First Aid · CPR", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-021", "topic": "急救 · 车祸现场 DRSABCD", "difficulty": "hard", "type": "short", "stem": "You are the first person to arrive at a motorcycle crash on a busy road. Describe, in order, the actions you would take using DRSABCD, including two hazards you would manage.", "options": [], "answer": "Danger: stop safely with hazard lights on, keep clear of moving traffic and any fuel spill, and ask bystanders to warn oncoming vehicles. Response: check whether the rider responds by speaking to them and squeezing their shoulders. Send for help: call 000 or direct a bystander to do it. Airway: open the airway and clear any foreign material. Breathing: look, listen and feel; if breathing is not normal, start CPR at 30:2. Circulation: control any major bleeding. Defibrillation: apply an AED if available and follow the voice prompts.", "explanation": "得分点拆分：D 描述现场危险与自保 2 分；R 检查反应 1 分；S 呼救并说明 000／指定他人 1 分；A、B、C 顺序与判断正确 3 分；D 取 AED 1 分；两项以上现场危险（来车、燃油、电线、玻璃碎片）1–2 分。顺序写错或漏掉 Send for help 会连锁失分。", "source": "Term 1 · First Aid – Road Trauma + Term 3 · Lesson 5 First Aid · DRSABCD", "points": [{"t": "Danger: stop safely with hazard lights on, keep clear of moving traffic and any fuel spill, and ask bystanders to warn oncoming vehicles. Response: check whether the rider responds by speaking to them and squeezing their shoulders. Send for help: call 000 or direct a bystander to do it. Airway: open the airway and clear any foreign material. Breathing: look, listen and feel", "m": 1}, {"t": "if breathing is not normal, start CPR at 30:2. Circulation: control any major bleeding. Defibrillation: apply an AED if available and follow the voice prompts", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-022", "topic": "道路安全 · 分心驾驶的盲开距离", "difficulty": "easy", "type": "mcq", "stem": "At 60 km/h, how far does a car travel in the two seconds a driver's eyes are off the road?", "options": ["About 60 m", "About 120 m", "About 33 m", "About 17 m"], "answer": 2, "explanation": "得分点拆分：先用 60 ÷ 3.6 = 16.7 m/s，再乘 2 秒约 33 m，1 分。最常见的错选是 17 m——那只是 1 秒的距离；题目给的是 2 秒。", "source": "Term 1 · Lesson 2–3 · Are you driving blind?", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-023", "topic": "道路安全 · 新手司机风险倍数", "difficulty": "medium", "type": "mcq", "stem": "A 17-year-old driver on a P1 licence is how much more likely to be involved in a fatal crash than a driver over 26 years?", "options": ["Ten times as likely", "Three times as likely", "Two times as likely", "Four times as likely"], "answer": 3, "explanation": "得分点拆分：答案 4 倍记 1 分；能补充原因（不熟悉路况、危险感知能力尚未成熟、更倾向冒险）再加 1 分。这一数据是 Term 1 论文「年轻男性为何事故率更高」的核心论据，建议背下来。", "source": "Term 1 · Lesson 4 Influences on Road Safety · Young People on the Roads", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-024", "topic": "心理健康 · 患病率与常见类型", "difficulty": "medium", "type": "short", "stem": "What proportion of Australians aged 16–85 experience a mental illness in any one year? Name the three most common types and explain why they often occur together.", "options": [], "answer": "About one in five (20%). The most common are depression, anxiety and substance use disorders. They often occur together: a person with an anxiety disorder may go on to develop depression, and a person with depression may misuse alcohol or other drugs to cope, so one condition can trigger or hide another.", "explanation": "得分点拆分：20%（1 in 5）1 分；三种类型各 1 分（3 分）；解释共病与相互触发 2 分。数字写成 1 in 10 或 50% 直接失分；只写「三种病很常见」而没说相互关系，解释分不给。", "source": "Term 2 · Lesson 1 Common Mental Health Conditions · Prevalence", "points": [{"t": "The most common are depression, anxiety and substance use disorders", "m": 1}, {"t": "They often occur together: a person with an anxiety disorder may go on to develop depression, and a person with depression may misuse alcohol or other drugs to cope, so one condition can trigger or hide another", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-025", "topic": "心理健康 · 韧性特征", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is one of the characteristics of resilient people identified in the lesson?", "options": ["A strong sense of control over their own life", "Seeing themselves as a victim of circumstance", "Never asking anybody for help at all", "Avoiding every situation that feels difficult"], "answer": 0, "explanation": "得分点拆分：识别正确特征 1 分；能列出另外几项再加 1 分。五个特征是：控制感、强的问题解决能力、牢固的社交联系、把自己看作「幸存者」而非「受害者」、能主动求助。「从不求助」和「受害者心态」正好是反面。", "source": "Term 2 · Lesson 3 Characteristics of Resilient people", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-026", "topic": "心理健康 · 求助障碍", "difficulty": "hard", "type": "short", "stem": "Explain TWO barriers that stop young people, especially young males, from seeking help for a mental health issue, and outline one way each barrier could be reduced.", "options": [], "answer": "Stigma: seeing mental illness as weakness or as 'not masculine' makes young men hide their feelings and bottle them up, so problems get worse; it can be reduced through mental health education and campaigns that present help-seeking as normal. Low mental health literacy: many cannot recognise their own symptoms or do not know which service to contact, so they wait until crisis point; this can be reduced by teaching help-seeking skills in school and promoting services such as ReachOut, Beyond Blue and Headspace.", "explanation": "得分点拆分：每个障碍 1 分＋解释它为什么阻碍求助 1 分（共 4 分）；每个障碍对应的改进措施 1 分（共 2 分）。障碍与措施必须一一对应——用「加强教育」去解决「费用高」是无效配对，不得分。", "source": "Term 2 · Lesson 8 Seeking Help · Barriers to seeking help", "points": [{"t": "Stigma: seeing mental illness as weakness or as 'not masculine' makes young men hide their feelings and bottle them up, so problems get worse", "m": 1}, {"t": "it can be reduced through mental health education and campaigns that present help-seeking as normal. Low mental health literacy: many cannot recognise their own symptoms or do not know which service to contact, so they wait until crisis point", "m": 1}, {"t": "this can be reduced by teaching help-seeking skills in school and promoting services such as ReachOut, Beyond Blue and Headspace", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-027", "topic": "营养 · 健康服务的类型", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is listed in the course as a type of health service available to young people?", "options": ["Private driving lessons", "Nutritional support", "Private exam tutoring", "Careers counselling"], "answer": 1, "explanation": "得分点拆分：认出「营养支持」属于健康服务 1 分；能说出另外几类再加 1 分。Lesson 1 列出九类：心理保健、牙科、物质滥用治疗、预防保健、物理与职业治疗、营养支持、药物服务、交通、产前保健。营养师／膳食师就属于营养支持这一类。", "source": "Term 3 · Lesson 1 Health Services · Types of Health services", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-028", "topic": "营养 · 自我管理与长期健康", "difficulty": "medium", "type": "short", "stem": "Explain why nutrition and physical activity are described as self-management skills for adulthood, and give one specific example of each.", "options": [], "answer": "They are self-management skills because adults must regulate their own daily routine — no one else plans their meals or schedules their exercise — and these habits strongly shape long-term health, energy levels and disease risk. Example: planning meals around the core food groups (vegetables, fruit, grains, lean protein, dairy or alternatives) instead of relying on takeaway; example: scheduling at least 60 minutes of moderate physical activity each day.", "explanation": "得分点拆分：说明「为什么算自我管理」（要自己安排、没人替你规划、直接影响长期健康）2 分；营养例子 1 分；身体活动例子 1 分；点出与疾病风险的关系 1 分。例子要具体到行为，写「吃健康点」不算。", "source": "Term 3 · Lesson 8 Life Challenges · Self-Management Skills（营养与体能细节按课程标准补充）", "points": [{"t": "They are self-management skills because adults must regulate their own daily routine — no one else plans their meals or schedules their exercise — and these habits strongly shape long-term health, energy levels and disease risk. Example: planning meals around the core food groups (vegetables, fruit, grains, lean protein, dairy or alternatives) instead of relying on takeaway", "m": 1}, {"t": "example: scheduling at least 60 minutes of moderate physical activity each day", "m": 1}], "weak": true, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-029", "topic": "健康信息 · 可信度判断", "difficulty": "medium", "type": "mcq", "stem": "A website advertises a 'detox cleanse' that claims to cure anxiety. Which question would BEST help you judge the credibility of this service?", "options": ["How colourful and modern does the website look to you?", "Is the product cheap enough to be worth trying anyway?", "What qualifications and training does the practitioner have?", "How many people have shared this advertisement on social media?"], "answer": 2, "explanation": "得分点拆分：选出「资质与培训」1 分；能补出材料里其他判断问题再加 2 分：提供什么治疗、有何效果、费用、能否与传统药物配合。网页美观、转发量和价格都不能证明有效性——这是这类题的固定陷阱。", "source": "Term 3 · Lesson 3 Assessing Credibility of Health Information", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "pdh-030", "topic": "赌博 · 四大影响因素", "difficulty": "medium", "type": "mcq", "stem": "What are the four main influences on a young person's attitude to gambling identified in the lesson?", "options": ["Personality, fatigue, alcohol use and speeding", "Cost, transport, language barriers and long waiting times", "Family income, suburb, age and gender of the player", "Advertising, friends, easy access and gambling-like games"], "answer": 3, "explanation": "得分点拆分：四项各 1 分（4 分）——广告宣传、朋友是否赌（同辈压力）、获取的容易程度、看起来像赌博的游戏。「Cost, transport, language barriers and long waiting times」 是健康服务障碍，「Personality, fatigue, alcohol use and speeding」 是道路安全 Fatal Five，正好是这一题最常见的混淆项。", "source": "Term 1 · Lesson 8 Gambling · Potential Influences on Gambling（Study Guide Section 2 明确要求）", "weak": false, "subj": "pdh", "subjZh": "个人发展、健康与体育（PDHPE）"}, {"id": "out-001", "topic": "环境意识 · 生物多样性", "difficulty": "easy", "type": "mcq", "stem": "How is biodiversity defined in this unit?", "options": ["The variety of living organisms present", "The total number of species in a habitat", "The number of endangered species", "The non-living parts of that habitat"], "answer": 0, "explanation": "课程对 biodiversity 的定义就是“variety of living organisms”（生物种类的多样性）。它不等于某个栖息地的动物数量，也不等于非生物环境。", "source": "Study Guide · Lesson 1 Introduction to Environmental Awareness", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-002", "topic": "生态系统 · 生物与非生物因素", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is an ABIOTIC factor in an ecosystem?", "options": ["Bacteria living in soil", "Sunlight and soil moisture", "Kangaroos grazing on grass", "Fungi breaking down leaves"], "answer": 1, "explanation": "abiotic 指非生物因素：阳光、水、土壤、温度等；biotic 指活的生物。真菌和细菌虽然肉眼不明显，但它们是活的，属于 biotic，这是最常见的失分点。", "source": "Study Guide · Lesson 2 Ecosystems and Interactions", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-003", "topic": "生态系统 · 定义", "difficulty": "easy", "type": "mcq", "stem": "Which definition of an ecosystem matches the course?", "options": ["A group of animals of the same species in an area", "All the plants that grow in a particular region", "A community of living and non-living things interacting", "The physical features of a landscape, such as soil and rain"], "answer": 2, "explanation": "ecosystem 的关键词是“生物＋非生物＋相互作用”。只讲植物、只讲动物、或只讲非生物环境，都只是生态系统的一部分。", "source": "Study Guide · Lesson 2 Ecosystems and Interactions", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-004", "topic": "人类影响 · 短期与长期", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is an example of a LONG-TERM human impact on ecosystems?", "options": ["Littering a campsite with food packaging and cans", "Dropping a plastic bag into a creek during a picnic", "A bushwalker crushing vegetation by leaving the marked track", "Climate change gradually reducing biodiversity over decades"], "answer": 3, "explanation": "短期影响是立即发生的（乱丢垃圾、踩踏植被）；长期影响是随时间逐渐累积的，例如气候变化。长期影响往往更难逆转，因为栖息地可能被永久破坏。", "source": "Study Guide · Lesson 3 Human Impact on the Environment", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-005", "topic": "Leave No Trace · 七项原则", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is one of the seven Leave No Trace principles taught in this unit?", "options": ["Travel and camp on durable surfaces", "Build a fire ring at each campsite", "Leave marked tracks to find quiet spots", "Feed wildlife so they stay calm near people"], "answer": 0, "explanation": "“在耐踩踏的地表上行走和扎营（travel and camp on durable surfaces）”是七大原则之一。另外三个选项恰好都是典型的高影响行为：新建火圈、投喂野生动物、离开步道。", "source": "Study Guide · Lesson 5 Leave No Trace", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-006", "topic": "原住民视角 · Connection to Country", "difficulty": "easy", "type": "mcq", "stem": "What does 'Connection to Country' mean for Aboriginal and Torres Strait Islander peoples?", "options": ["A legal title to land that allows selling its natural resources", "A spiritual and cultural relationship with land and waterways", "An agreement with government to manage national parks", "A seasonal camp used for hunting and fishing only"], "answer": 1, "explanation": "Connection to Country 是精神性、文化性与环境性的关系，Country 包含土地、水道、动植物，也包含文化身份。关键观念是：Country 不是“被拥有的东西”，而是“要去照护和保护的对象”。", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-007", "topic": "原住民视角 · 文化燃烧", "difficulty": "medium", "type": "mcq", "stem": "Which description of cultural burning matches the lesson?", "options": ["Burning at random times with no planning or control at all", "Large, high-intensity fires lit in summer to clear all vegetation", "Small, low-intensity controlled fires that safely reduce fuel loads", "Burning only after a wildfire has already started, to stop it spreading"], "answer": 2, "explanation": "文化燃烧是“小型、低强度、在特定时间有计划地控制燃烧”，目的是降低可燃物载量（fuel load）。它的好处是减少大火风险、促进植物再生、支持生物多样性——不是无控制放火，也不是等火灾发生才烧。", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land · Cultural Burning", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-008", "topic": "Leave No Trace · 耐踩踏地表", "difficulty": "medium", "type": "mcq", "stem": "Why does Leave No Trace advise walking and camping on durable surfaces?", "options": ["It increases the chance of seeing wildlife up close", "It makes finding the way back much easier", "It keeps hikers' boots and tents cleaner", "It protects vegetation and reduces soil erosion"], "answer": 3, "explanation": "Response Guide 的示范答案说得很明确：走耐用地表“保护植被、减少踩踏造成的土壤侵蚀”。踩出来的小径会越踩越宽，最后变成冲沟，这是露营区最常见的长期损伤。", "source": "Study Guide · Lesson 5 Leave No Trace · Response Guide", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-009", "topic": "可持续实践 · 露营高影响行为", "difficulty": "medium", "type": "mcq", "stem": "Which camper behaviour is a HIGH-IMPACT practice?", "options": ["Cutting branches from live trees for a campfire", "Camping in an already established campsite", "Using a fuel stove instead of lighting a fire", "Carrying all your own rubbish out in a sealed bag"], "answer": 0, "explanation": "砍活树枝生火会直接破坏植被与栖息地，还提高灌木火风险，是典型的高影响行为。用燃料炉、用既有营位、把垃圾全部带走，都是低影响做法。", "source": "Study Guide · Lesson 4 Sustainable Practices and Camping Impact", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-010", "topic": "生态系统 · 相互依存", "difficulty": "medium", "type": "mcq", "stem": "In the Yellowstone example used in the unit, removing wolves caused elk numbers to rise and damage plant life, and reintroducing them gradually restored balance. What does this best demonstrate?", "options": ["Predators are harmful to ecosystems and should be removed", "Ecosystems are interconnected, so removing one part affects the rest", "Only abiotic factors can change the balance of an ecosystem", "Plant life always recovers on its own, whatever happens to animals"], "answer": 1, "explanation": "这个案例说明生态系统的相互依存性：抽掉一个环节（顶级捕食者），食物链下游会连锁反应。课程里用来回答“为什么不干脆把鲨鱼都除掉”的正是这个逻辑。", "source": "Study Guide · Lesson 2 Ecosystems and Interactions · Response Guide", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-011", "t
