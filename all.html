=\"229.6,220.8 219.1,226.6 229.0,232.0\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><polygon points=\"205.2,234.4 194.7,240.2 204.5,245.6\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><polygon points=\"180.7,248.0 170.2,253.8 180.0,259.2\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><polygon points=\"156.2,261.6 145.7,267.4 155.6,272.8\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><polygon points=\"130.8,273.4 119.9,278.2 129.2,284.5\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><polygon points=\"105.2,284.6 94.2,289.4 103.5,295.7\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><polygon points=\"79.5,295.8 68.5,300.6 77.9,306.9\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-width=\".8\"/><text x=\"372.0\" y=\"126.0\"fill=\"var(--accent)\" font-size=\"20\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">L</text><text x=\"508.0\" y=\"330.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"text-anchor=\"end\"letter-spacing=\"1.6\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">TASMAN SEA</text><text x=\"22.0\" y=\"316.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">NSW coast</text></svg>", "points": [{"id": "c1", "t": "Explains that tightly packed isobars mean a steep pressure gradient and therefore strong winds", "m": 1}, {"id": "c2", "t": "Explains that the strong winds generate large waves and a storm surge that raise water levels at the shore", "m": 1}, {"id": "c3", "t": "Explains that the cold front adds intense rainfall and runoff, so the combination of higher water and bigger waves produced a major storm cut and foredune erosion", "m": 1}], "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geo-027", "topic": "Management · Types and reasons", "difficulty": "easy", "type": "short", "stem": "Classify each strategy as prevention, mitigation or preparedness, and justify your choice: (a) zoning that prevents new building on the foredune; (b) a seawall; (c) an evacuation plan. (3 marks)", "options": [], "answer": "(a) Prevention — it removes the exposure before damage can occur. (b) Mitigation — it reduces the impact of wave energy on assets that already exist. (c) Preparedness — it plans the response for when an event happens.", "explanation_en": "The basis for judgement is 'before, during, or after the change': prevention avoids exposure, mitigation reduces damage to existing assets, and preparedness arranges for responses during events.", "source": "Term 3 · Lessons 3.1–3.2 Sustainable Management of Coastal Ecosystems", "marks": 3, "criteria": [{"id": "c1", "t": "Classifies the zoning strategy as prevention and explains that it removes the exposure before damage can occur", "m": 1}, {"id": "c2", "t": "Classifies the seawall as mitigation and explains that it reduces the impact of wave energy on assets that already exist", "m": 1}, {"id": "c3", "t": "Classifies the evacuation plan as preparedness and explains that it plans the response for when an event happens", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Classifies the zoning strategy as prevention and explains that it removes the exposure before damage can occur", "m": 1}, {"id": "c2", "t": "Classifies the seawall as mitigation and explains that it reduces the impact of wave energy on assets that already exist", "m": 1}, {"id": "c3", "t": "Classifies the evacuation plan as preparedness and explains that it plans the response for when an event happens", "m": 1}], "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geo-028", "topic": "Seawall debate · Evaluating a position", "difficulty": "hard", "type": "short", "stem": "Stimulus: Two stakeholders disagree about the Collaroy–Narrabeen seawall. One argues it protects homes; the other argues it damages the beach and shifts erosion along the coast. Evaluate both positions using your knowledge of coastal processes. (5 marks)", "options": [], "answer": "The protection argument is valid in the short term: the wall prevents wave attack on the houses immediately behind it. The criticism is also valid: a vertical wall reflects wave energy, removes sediment from the beach budget and can increase erosion at the ends of the wall, so the beach in front narrows and the problem shifts along the coast. The decision therefore trades protection of private assets against the loss of public beach.", "explanation_en": "Evaluation questions need both sides shown to be valid, with the cost of the decision explained: short-term protection works but carries real coastal-process costs. Arguing only one side will not score high marks.", "source": "Term 3 · Lesson 3.3 The Controversial Seawall(stakeholder perspectives)", "marks": 5, "criteria": [{"id": "c1", "t": "Explains the protection argument: the wall prevents wave attack on the houses immediately behind it, so it is valid in the short term", "m": 1}, {"id": "c2", "t": "Explains that a vertical wall reflects wave energy back onto the beach", "m": 1}, {"id": "c3", "t": "Explains that the wall removes sediment from the beach budget, so the beach in front narrows", "m": 1}, {"id": "c4", "t": "Explains that erosion can increase at the ends of the wall, so the problem shifts along the coast", "m": 1}, {"id": "c5", "t": "Reaches an evaluative judgement that the decision trades protection of private assets against the loss of public beach", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains the protection argument: the wall prevents wave attack on the houses immediately behind it, so it is valid in the short term", "m": 1}, {"id": "c2", "t": "Explains that a vertical wall reflects wave energy back onto the beach", "m": 1}, {"id": "c3", "t": "Explains that the wall removes sediment from the beach budget, so the beach in front narrows", "m": 1}, {"id": "c4", "t": "Explains that erosion can increase at the ends of the wall, so the problem shifts along the coast", "m": 1}, {"id": "c5", "t": "Reaches an evaluative judgement that the decision trades protection of private assets against the loss of public beach", "m": 1}], "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geoother-001", "topic": "Human wellbeing · GDP", "difficulty": "easy", "type": "mcq", "stem": "Why do geographers use GDP per capita rather than total GDP when comparing the wellbeing of different countries?", "options": ["It divides GDP by population, so countries of different sizes can be compared", "It measures only the income earned by the very richest people in that country", "It measures the value of unpaid work done inside the household", "It removes the need for any other development measure or index"], "answer": 0, "explanation_en": "GDP per capita is GDP divided by population, which removes the problem that large countries naturally have large totals. It still does not show how evenly income is distributed, though, and it cannot replace an indicator such as HDI.", "source": "Term 1 · Week 2 Global — Measuring and Mapping Human Wellbeing", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-002", "topic": "Human wellbeing · Human Development Index", "difficulty": "easy", "type": "mcq", "stem": "The Human Development Index (HDI) combines which three dimensions?", "options": ["GDP, inflation rate and the unemployment rate", "Health, education and standard of living (GNI per capita)", "Population size, land area and length of coastline", "Life expectancy, birth rate and the death rate"], "answer": 1, "explanation_en": "The three HDI dimensions are health, education and standard of living. Because it measures health and education as well as income, the HDI is more comprehensive than a single economic indicator such as GDP.", "source": "Term 1 · Week 2 Global — Lesson 3: quantitative (GDP) vs qualitative (HDI)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-003", "topic": "Population · Interpreting ageing data", "difficulty": "medium", "type": "mcq", "stem": "In the population-pyramid lesson students study China's ageing population. The source states that by 2100, 37.8% of China's population is projected to be aged over 60. Which is the most likely implication of this figure?", "options": ["A rising birth rate that will require many new schools and many more teachers", "A population pyramid with a very wide base and a much narrower top", "A smaller workforce supporting a larger elderly group, straining pensions", "A rapidly growing labour force that will raise industrial output sharply"], "answer": 2, "explanation_en": "An elderly population of nearly 40% means a higher dependency ratio, a smaller workforce and financial pressure on health care and aged care. A 'population pyramid with a very wide base and a much narrower top', by contrast, describes a high birth rate and an expanding population — the opposite of an ageing one.", "source": "Term 1 · Weeks 3–4 Geographic Skills — China's Ageing Population (37.8% over 60 by 2100)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-004", "topic": "Wellbeing differences · Sydney socio-economic patterns", "difficulty": "hard", "type": "short", "stem": "Describe the spatial pattern of advantage and disadvantage in Sydney and explain one factor that produces it.", "options": [], "answer": "Advantage is concentrated in the east, north and harbour-side suburbs, while disadvantage is concentrated in the west and south-west. Higher incomes, employment and better access to services, schools and healthy food cluster in the advantaged areas, while high housing costs push lower-income households further from those opportunities.", "explanation_en": "The answer needs 'pattern plus one cause'. The pattern is the contrast between the east and north on one side and the west and south-west on the other; the cause can be income, housing prices, or access to services and employment, following the course scaffold.", "source": "Term 1 · Weeks 7–8 Local — Sydney's socio-economic divide (East vs West)", "marks": 3, "criteria": [{"id": "c1", "t": "Describes the pattern of advantage: it is concentrated in the east, north and harbour-side suburbs", "m": 1}, {"id": "c2", "t": "Describes the pattern of disadvantage: it is concentrated in the west and south-west", "m": 1}, {"id": "c3", "t": "Explains one factor producing the pattern, such as high housing costs pushing lower-income households away from areas where income, employment and access to services cluster", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes the pattern of advantage: it is concentrated in the east, north and harbour-side suburbs", "m": 1}, {"id": "c2", "t": "Describes the pattern of disadvantage: it is concentrated in the west and south-west", "m": 1}, {"id": "c3", "t": "Explains one factor producing the pattern, such as high housing costs pushing lower-income households away from areas where income, employment and access to services cluster", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-005", "topic": "Indigenous wellbeing · Circle sentencing", "difficulty": "easy", "type": "mcq", "stem": "Circle sentencing in NSW is best described as:", "options": ["A separate court that hears only cases involving young offenders", "A process that replaces the court entirely with a community tribunal", "A police caution given before any charge is laid against an offender", "A sentencing process where Elders sit with a magistrate after a guilty verdict"], "answer": 3, "explanation_en": "Circle sentencing happens after a guilty verdict: community members and Elders take part in deciding the sentence, which improves cultural appropriateness and reduces reoffending. It does not replace the court, and it is not a pre-trial process.", "source": "Term 2 · Week 2.3 First Nations Justice — Action (circle sentencing)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-006", "topic": "Geographical skills · Ternary graphs", "difficulty": "medium", "type": "mcq", "stem": "On a ternary graph, what do the three axes represent?", "options": ["Three parts of a whole that add to 100%, read off one point", "Three separate time periods shown along a single horizontal line", "Three separate graphs placed side by side on one page", "Three countries compared by their total population"], "answer": 0, "explanation_en": "A ternary graph shows the proportions of three components that add to 100%, such as employment structure or soil composition. Each axis gives one component, and the three values must add to 100%.", "source": "Term 2 · Week 10.1 Ternary Graphs", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Ternary graph with three components and an example point read off at 50, 30 and 20 per cent\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"252.0,34.0 430.0,268.0 74.0,268.0\" fill=\"var(--surface)\" fill-opacity=\".55\" stroke=\"var(--border-strong)\" stroke-width=\"1.8\"/><line x1=\"394.4\" y1=\"221.2\" x2=\"109.6\" y2=\"221.2\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".8\"/><line x1=\"287.6\" y1=\"80.8\" x2=\"145.2\" y2=\"268.0\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".8\"/><line x1=\"216.4\" y1=\"80.8\" x2=\" troke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">20</text><text x=\"252.0\" y=\"22.0\"fill=\"var(--accent)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">A  100%</text><text x=\"440.0\" y=\"272.0\"fill=\"var(--warning)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B  100%</text><text x=\"64.0\" y=\"272.0\"fill=\"var(--success)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"text-anchor=\"end\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">C  100%</text><line x1=\"341.0\" y1=\"151.0\" x2=\"163.0\" y2=\"151.0\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" opacity=\".95\"/><line x1=\"305.4\" y1=\"104.2\" x2=\"180.8\" y2=\"268.0\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" opacity=\".95\"/><line x1=\"216.4\" y1=\"80.8\" x2=\"358.8\" y2=\"268.0\" stroke=\"var(--success)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" opacity=\".95\"/><circle cx=\"269.8\" cy=\"151.0\" r=\"5.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.6\"/><text x=\"278.8\" y=\"144.0\"fill=\"var(--foreground)\" font-size=\"12\"font-family=\"var(--font-mono,monospace)\"font-weight=\"700\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">P</text><line x1=\"84.0\" y1=\"302.0\" x2=\"104.0\" y2=\"302.0\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"110.0\" y=\"306.0\"fill=\"var(--accent)\" font-size=\"11.5\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">A = 50%</text><line x1=\"183.4\" y1=\"302.0\" x2=\"203.4\" y2=\"302.0\" stroke=\"var(--warning)\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"209.4\" y=\"306.0\"fill=\"var(--warning)\" font-size=\"11.5\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">B = 30%</text><line x1=\"282.8\" y1=\"302.0\" x2=\"302.8\" y2=\"302.0\" stroke=\"var(--success)\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"308.8\" y=\"306.0\"fill=\"var(--success)\" font-size=\"11.5\"font-family=\"var(--font-mono,monospace)\"font-weight=\"600\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">C = 20%</text><text x=\"260.0\" y=\"328.0\"fill=\"var(--muted)\" font-size=\"11\"font-family=\"var(--font-mono,monospace)\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">The three shares always add up to 100%.</text></svg>", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-007", "topic": "Geographical skills · Area and grid references", "difficulty": "medium", "type": "mcq", "stem": "Which statement correctly distinguishes an area reference (AR) from a grid reference (GR)?", "options": ["An AR gives elevation in metres; a GR gives distance in km", "An AR uses four figures for a square; a GR uses six for a point", "An AR is used on small-scale maps; a GR only on précis maps", "An AR uses six figures for a point; a GR uses four for a grid square"], "answer": 1, "explanation_en": "An AR uses four digits to locate a square of about 1 km × 1 km, while a GR uses six digits to locate a specific point inside that square, accurate to 100 m. Do not mix up the order of the digits.", "source": "Term 1 · Weeks 3–4 Topographic Skills — AR, GR and elevation", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-008", "topic": "Indigenous wellbeing · Evaluating sentencing outcomes", "difficulty": "medium", "type": "short", "stem": "Explain one way circle sentencing could improve outcomes for Aboriginal and Torres Strait Islander peoples compared with a standard court process.", "options": [], "answer": "It involves Elders and community members in deciding the sentence, so the outcome reflects the offender's community and culture and the offender is held accountable in front of people they know. This can increase respect for the process and reduce reoffending, which matters given the over-representation of Aboriginal people in custody.", "explanation_en": "You need 'mechanism → result': community and Elder involvement produces cultural safety and accountability, which makes the sentence more likely to be accepted and reduces reoffending. Writing only 'fairer' gains no marks.", "source": "Term 2 · Weeks 2.3 / 3.1 First Nations Justice — Action & Outcome", "marks": 3, "criteria": [{"id": "c1", "t": "Explains the mechanism: circle sentencing involves Elders and community members in deciding the sentence", "m": 1}, {"id": "c2", "t": "Explains the outcome: the sentence reflects the offender's community and culture and they are held accountable before people they know, which can increase respect for the process and reduce reoffending", "m": 1}, {"id": "c3", "t": "Links this to the over-representation of Aboriginal people in custody, explaining why improved outcomes matter", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains the mechanism: circle sentencing involves Elders and community members in deciding the sentence", "m": 1}, {"id": "c2", "t": "Explains the outcome: the sentence reflects the offender's community and culture and they are held accountable before people they know, which can increase respect for the process and reduce reoffending", "m": 1}, {"id": "c3", "t": "Links this to the over-representation of Aboriginal people in custody, explaining why improved outcomes matter", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-009", "topic": "Climate change · Cherry-picking", "difficulty": "easy", "type": "mcq", "stem": "In the climate misinformation lessons, 'cherry-picking' as a science-denial technique means:", "options": ["Choosing only the most reliable long-term dataset available", "Repeating an experiment until the results agree with the theory you hold", "Selecting data that support a position while ignoring contrary data", "Refusing to accept any scientific evidence whatsoever on the topic"], "answer": 2, "explanation_en": "Cherry-picking is one of the five FLICC techniques: only the data points that support the position are selected and the overall trend is ignored. The reflection questions in class are designed to make you notice this.", "source": "Term 4 · Lessons 1.1–1.2 Climate misinformation (FLICC) / Lesson 2.1", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-010", "topic": "Climate change · Enhanced greenhouse effect", "difficulty": "medium", "type": "mcq", "stem": "How does the enhanced greenhouse effect differ from the natural greenhouse effect?", "options": ["The enhanced effect is caused by more solar radiation reaching Earth", "Human activity has removed the natural effect, so less heat is trapped", "The natural effect involves only incoming solar radiation, with no re-emission of heat", "Human greenhouse gas emissions trap more infrared radiation, adding to warming"], "answer": 3, "explanation_en": "The natural greenhouse effect makes the Earth habitable; the extra greenhouse gases released by human activity strengthen it, so more infrared radiation is absorbed and re-radiated back to the surface. Telling the two apart is a common exam point.", "source": "Term 4 · Lesson 2.2 What are the causes of climate change? (Part 1)", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-011", "topic": "Climate change · Coral bleaching", "difficulty": "easy", "type": "mcq", "stem": "How does rising sea temperature cause coral bleaching?", "options": ["Heat stress makes corals expel their symbiotic algae, losing colour and food", "Warmer water dissolves the corals' calcium carbonate skeleton directly", "Warmer water multiplies the algae living inside corals, making them overgrow faster", "Corals absorb more dissolved carbon dioxide and so grow much faster"], "answer": 0, "explanation_en": "Corals live in a symbiotic relationship with zooxanthellae. When heat stresses them, the corals expel the zooxanthellae and lose both their colour and their main food source; if the heat persists, the coral dies rather than simply turning white.", "source": "Term 4 · Lesson 3.3 How does sea temperature rise lead to coral bleaching?", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-012", "topic": "Climate change · Global warming vs climate change", "difficulty": "easy", "type": "mcq", "stem": "Lesson 2.1 asks students to distinguish between global warming and climate change. Which statement is correct?", "options": ["Global warming refers only to sea temperatures; climate change only to air temperatures", "Global warming is the rise in average temperature; climate change also covers rainfall and sea level", "The two terms mean exactly the same thing and can be used interchangeably in every case", "Climate change happens naturally, while global warming is a separate process unrelated to it"], "answer": 1, "explanation_en": "Global warming is the rise in average temperature, which is only one part of climate change — a broader concept that also includes changes in precipitation, sea level, ice caps and extreme weather events.", "source": "Term 4 · Lesson 2.1 EVIDENCE — distinguishing global warming from climate change", "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-013", "topic": "Climate change · Ocean acidification", "difficulty": "hard", "type": "short", "stem": "Explain how ocean acidification impacts marine life.", "options": [], "answer": "The ocean absorbs extra carbon dioxide, which forms carbonic acid and lowers the pH of seawater. This reduces the availability of carbonate ions, so organisms such as corals, shellfish and some plankton cannot build or maintain their shells and skeletons, which then affects the wider food chain.", "explanation_en": "The mechanism involves: CO₂ dissolving in seawater → forming carbonic acid → decreasing pH → reducing carbonate ions → making it difficult for calcifying organisms to form shells and skeletons → affecting the food chain.", "source": "Term 4 · Lesson 4.1 Ocean Acidification & Its Impact on Marine Life", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the ocean absorbs extra carbon dioxide, which forms carbonic acid and lowers the pH of seawater", "m": 1}, {"id": "c2", "t": "Explains that fewer carbonate ions are available, so corals, shellfish and some plankton cannot build or maintain their shells and skeletons", "m": 1}, {"id": "c3", "t": "Explains that this then affects the wider food chain", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the ocean absorbs extra carbon dioxide, which forms carbonic acid and lowers the pH of seawater", "m": 1}, {"id": "c2", "t": "Explains that fewer carbonate ions are available, so corals, shellfish and some plankton cannot build or maintain their shells and skeletons", "m": 1}, {"id": "c3", "t": "Explains that this then affects the wider food chain", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "geoother-014", "topic": "Climate change · Sea level rise examples", "difficulty": "hard", "type": "short", "stem": "Using the Solomon Islands case study, explain two impacts of sea level rise on low-lying Pacific nations.", "options": [], "answer": "First, higher seas and larger storm surges erode beaches and inundate low-lying land, so villages, gardens and fresh-water supplies are lost and communities are forced to relocate. Second, salt water intrudes into soil and groundwater, reducing the land available for growing food and increasing dependence on outside aid.", "explanation_en": "This can be answered on two levels: environmental and land (erosion, flooding, saltwater intrusion) and socio-economic (forced relocation, food and water shortages, reliance on aid).", "source": "Term 4 · Lesson 3.2 Sea level rise — Solomon Islands case study", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that higher seas and larger storm surges erode beaches and inundate low-lying land", "m": 1}, {"id": "c2", "t": "Explains the social consequence: villages, gardens and fresh-water supplies are lost and communities are forced to relocate", "m": 1}, {"id": "c3", "t": "Explains that salt water intrudes into soil and groundwater, reducing land for growing food and increasing dependence on outside aid", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that higher seas and larger storm surges erode beaches and inundate low-lying land", "m": 1}, {"id": "c2", "t": "Explains the social consequence: villages, gardens and fresh-water supplies are lost and communities are forced to relocate", "m": 1}, {"id": "c3", "t": "Explains that salt water intrudes into soil and groundwater, reducing land for growing food and increasing dependence on outside aid", "m": 1}], "weak": false, "subj": "geoother", "subjZh": "Geography · Non-exam content (Terms 1–2, 4)"}, {"id": "pdh-001", "topic": "Risk behaviour · Positive and negative risks", "difficulty": "easy", "type": "short", "stem": "List THREE examples of positive risk taking and THREE examples of negative risk taking.", "options": [], "answer": "Positive: trying a new sport such as rock climbing or martial arts; joining the school play or band; volunteering for a community cause or running for the school committee. Negative: binge drinking or vaping; sexting; getting a lift with a driver who has been drinking; dangerous driving; skipping school; trespassing or vandalism.", "explanation_en": "Marks are awarded for three positive examples (1 mark each, 3 marks) and three negative examples (1 mark each, 3 marks). An extra mark is available for explaining the difference: positive risks carry uncertainty but bring new skills or growth, whereas negative risks bring harm, legal consequences or loss of health.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Risk taking", "marks": 6, "criteria": [{"id": "c1", "t": "Gives a valid example of positive risk taking (e.g. trying a new sport such as rock climbing or martial arts)", "m": 1}, {"id": "c2", "t": "Gives a second valid example of positive risk taking (e.g. joining the school play or band)", "m": 1}, {"id": "c3", "t": "Gives a third valid example of positive risk taking (e.g. volunteering for a community cause or running for the school committee)", "m": 1}, {"id": "c4", "t": "Gives a valid example of negative risk taking (e.g. binge drinking or vaping)", "m": 1}, {"id": "c5", "t": "Gives a second valid example of negative risk taking (e.g. sexting, or getting a lift with a driver who has been drinking)", "m": 1}, {"id": "c6", "t": "Gives a third valid example of negative risk taking (e.g. dangerous driving, skipping school, trespassing or vandalism)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Gives a valid example of positive risk taking (e.g. trying a new sport such as rock climbing or martial arts)", "m": 1}, {"id": "c2", "t": "Gives a second valid example of positive risk taking (e.g. joining the school play or band)", "m": 1}, {"id": "c3", "t": "Gives a third valid example of positive risk taking (e.g. volunteering for a community cause or running for the school committee)", "m": 1}, {"id": "c4", "t": "Gives a valid example of negative risk taking (e.g. binge drinking or vaping)", "m": 1}, {"id": "c5", "t": "Gives a second valid example of negative risk taking (e.g. sexting, or getting a lift with a driver who has been drinking)", "m": 1}, {"id": "c6", "t": "Gives a third valid example of negative risk taking (e.g. dangerous driving, skipping school, trespassing or vandalism)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-002", "topic": "Health services · Barriers to access", "difficulty": "hard", "type": "short", "stem": "List FIVE barriers that stop people from accessing health services. For TWO of the barriers, explain the effect this may have on a person's health.", "options": [], "answer": "Barriers: cost; fear about confidentiality; low health literacy (not realising a condition is treatable); transport and distance, especially in rural areas; long waiting times and complicated booking systems; language and communication difficulties; stigma and embarrassment; not knowing which service to contact. Effects: (1) Cost — a young person delays seeing a GP or dentist, so a treatable condition worsens and may eventually need hospital care. (2) Fear about confidentiality — they avoid discussing mental or sexual health with a doctor, so the problem goes untreated and can escalate into a crisis.", "explanation_en": "Marks are awarded for listing five barriers (1 mark each, 5 marks) and explaining the health effect of two of them (1 mark each, 2 marks). The explanation has to show a causal chain of 'delay → deterioration, complications or crisis'. One mark is for expression and structure.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Barriers to accessing health services", "marks": 7, "criteria": [{"id": "c1", "t": "Lists cost as one barrier to accessing health services", "m": 1}, {"id": "c2", "t": "Lists a barrier relating to fear or embarrassment (e.g. fear about confidentiality, stigma and embarrassment)", "m": 1}, {"id": "c3", "t": "Lists a barrier relating to access or logistics (e.g. transport and distance, especially in rural areas; long waiting times and complicated booking systems)", "m": 1}, {"id": "c4", "t": "Lists a barrier relating to knowledge or communication (e.g. low health literacy, language and communication difficulties, not knowing which service to contact)", "m": 1}, {"id": "c5", "t": "Lists a fifth distinct barrier, making five in total", "m": 1}, {"id": "c6", "t": "Explains the health effect of one barrier (e.g. cost makes a young person delay seeing a GP or dentist, so a treatable condition worsens and may need hospital care)", "m": 1}, {"id": "c7", "t": "Explains the health effect of a second barrier (e.g. fear about confidentiality means mental or sexual health is not discussed, so the problem is untreated and escalates into a crisis)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Lists cost as one barrier to accessing health services", "m": 1}, {"id": "c2", "t": "Lists a barrier relating to fear or embarrassment (e.g. fear about confidentiality, stigma and embarrassment)", "m": 1}, {"id": "c3", "t": "Lists a barrier relating to access or logistics (e.g. transport and distance, especially in rural areas; long waiting times and complicated booking systems)", "m": 1}, {"id": "c4", "t": "Lists a barrier relating to knowledge or communication (e.g. low health literacy, language and communication difficulties, not knowing which service to contact)", "m": 1}, {"id": "c5", "t": "Lists a fifth distinct barrier, making five in total", "m": 1}, {"id": "c6", "t": "Explains the health effect of one barrier (e.g. cost makes a young person delay seeing a GP or dentist, so a treatable condition worsens and may need hospital care)", "m": 1}, {"id": "c7", "t": "Explains the health effect of a second barrier (e.g. fear about confidentiality means mental or sexual health is not discussed, so the problem is untreated and escalates into a crisis)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-003", "topic": "Health services · Services for young people", "difficulty": "easy", "type": "short", "stem": "List FIVE health services that are available for young people in Australia.", "options": [], "answer": "A general practitioner (GP) under Medicare; Headspace or another youth mental health service; the school counsellor; a dental clinic; a sexual health clinic; physiotherapy; a community health centre; a pharmacy; a hospital emergency department; a dietitian or nutritional support service.", "explanation_en": "Marks are awarded for naming a specific service (1 mark each, 5 marks in total); a named institution or a type of service is required. An extra mark is available for noting which services are free or low-cost for adolescents (Medicare, Headspace, school counsellors).", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Health services for young people", "marks": 5, "criteria": [{"id": "c1", "t": "Names a valid health service for young people (e.g. a general practitioner under Medicare)", "m": 1}, {"id": "c2", "t": "Names a second service (e.g. Headspace or another youth mental health service)", "m": 1}, {"id": "c3", "t": "Names a third service (e.g. the school counsellor)", "m": 1}, {"id": "c4", "t": "Names a fourth service (e.g. a dental clinic, a sexual health clinic, physiotherapy or a community health centre)", "m": 1}, {"id": "c5", "t": "Names a fifth service, specified as a service or provider type rather than a vague 'see a doctor' or 'go to hospital' (e.g. a pharmacy, hospital emergency department, dietitian)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names a valid health service for young people (e.g. a general practitioner under Medicare)", "m": 1}, {"id": "c2", "t": "Names a second service (e.g. Headspace or another youth mental health service)", "m": 1}, {"id": "c3", "t": "Names a third service (e.g. the school counsellor)", "m": 1}, {"id": "c4", "t": "Names a fourth service (e.g. a dental clinic, a sexual health clinic, physiotherapy or a community health centre)", "m": 1}, {"id": "c5", "t": "Names a fifth service, specified as a service or provider type rather than a vague 'see a doctor' or 'go to hospital' (e.g. a pharmacy, hospital emergency department, dietitian)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-004", "topic": "Road safety · Ranking causes of crashes", "difficulty": "medium", "type": "mcq", "stem": "Which list ranks the leading causes of fatal road crashes in NSW from LARGEST to SMALLEST contribution (2025 data)?", "options": ["Speeding — Fatigue — Drink/drug impairment — Not wearing a seatbelt — Distraction", "Distraction — Speeding — Fatigue — Not wearing a seatbelt — Drink/drug impairment", "Drink/drug impairment — Speeding — Fatigue — Distraction — Not wearing a seatbelt", "Fatigue — Speeding — Distraction — Drink/drug impairment — Not wearing a seatbelt"], "answer": 0, "explanation_en": "Marking points are broken down into correct ordering, with 2 points for a fully correct order and 1 point for only the first half correct, based on 2025 NSW data: speeding first (around 39–40% of fatal crashes involved speeding, 134 deaths), fatigue second (around 20–21%, 75 deaths), drink-driving third, not wearing a seatbelt fourth (29 deaths), and distraction fifth (often underreported).", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Rank the top 5 causes + Term 1 · Lesson 2–3 (2025 Fatal Five)", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-005", "topic": "Road safety · Haddon matrix", "difficulty": "medium", "type": "short", "stem": "Road crashes are caused by a combination of human, vehicle and environmental factors. Classify each of the following, then explain which category is easiest to change and why: (a) a driver using a mobile phone; (b) worn brake pads; (c) a wet road on a bend.", "options": [], "answer": "(a) Human factor. (b) Vehicle factor. (c) Environmental factor. The human category is easiest to change, because the driver directly controls their own behaviour — speed, phone use, seatbelt use, fatigue and alcohol can all be changed through education, laws and police enforcement. Vehicle and environmental factors also matter, but about 95% of crashes involve human factors alone or in combination, so changing driver behaviour has the biggest effect on the road toll.", "explanation_en": "Marks are awarded for classifying all three categories (1 mark each, 3 marks). Identifying human factors as the most changeable is worth 1 mark, and the reasons are worth 2 marks: human factors are controllable, and around 95% of crashes involve human error, which can be changed through education, legislation and enforcement.", "source": "Term 1 · Lesson 2–3 Factors influencing road and traffic incidents (matches the \"list the major causes\" question)", "marks": 6, "criteria": [{"id": "c1", "t": "Classifies a driver using a mobile phone as a human factor", "m": 1}, {"id": "c2", "t": "Classifies worn brake pads as a vehicle factor", "m": 1}, {"id": "c3", "t": "Classifies a wet road on a bend as an environmental factor", "m": 1}, {"id": "c4", "t": "Identifies the human factor as the category easiest to change", "m": 1}, {"id": "c5", "t": "Explains that the driver directly controls their own behaviour (speed, phone use, seatbelt use, fatigue, alcohol) and that it can be changed through education, laws and police enforcement", "m": 1}, {"id": "c6", "t": "Supports the judgement with the scale of the problem: about 95% of crashes involve human factors alone or in combination, so changing driver behaviour has the biggest effect on the road toll", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Classifies a driver using a mobile phone as a human factor", "m": 1}, {"id": "c2", "t": "Classifies worn brake pads as a vehicle factor", "m": 1}, {"id": "c3", "t": "Classifies a wet road on a bend as an environmental factor", "m": 1}, {"id": "c4", "t": "Identifies the human factor as the category easiest to change", "m": 1}, {"id": "c5", "t": "Explains that the driver directly controls their own behaviour (speed, phone use, seatbelt use, fatigue, alcohol) and that it can be changed through education, laws and police enforcement", "m": 1}, {"id": "c6", "t": "Supports the judgement with the scale of the problem: about 95% of crashes involve human factors alone or in combination, so changing driver behaviour has the biggest effect on the road toll", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-006", "topic": "Road safety · In-car distractions", "difficulty": "easy", "type": "mcq", "stem": "Which two are the most common distractions for a driver that come from INSIDE the vehicle?", "options": ["Checking a map and setting a GPS destination", "Using a mobile phone and interacting with passengers", "Adjusting the radio and the air-conditioning controls", "Eating food and drinking coffee while driving"], "answer": 1, "explanation_en": "Marks are awarded for recognising two items (1 mark each, 2 marks); the two main ones are phone use and passenger interaction. Using a phone raises crash risk about fourfold, and P-plate drivers carrying three or more passengers more than double their crash rate.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Driver distractions + Term 1 · Lesson 2–3 & Lesson 5 Safety Plans", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-007", "topic": "Driving · BAC limits", "difficulty": "easy", "type": "mcq", "stem": "What are the legal blood alcohol concentration (BAC) limits in NSW for a learner, a provisional and a full licence holder?", "options": ["0.00 for learner, 0.05 for provisional, 0.05 for full", "0.02 for learner, 0.02 for provisional, 0.05 for full", "0.00 for learner, 0.00 for provisional, 0.05 for full", "0.05 for learner, 0.05 for provisional, 0.05 for full"], "answer": 2, "explanation_en": "Marks are awarded for filling in three blanks (1 mark each): Learner 0.00, Provisional 0.00 and Full 0.05. The most common mistake is writing 0.05 for a P-plate; in NSW both P-plate and L-plate drivers must be at zero, and only a full licence has a 0.05 limit.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · BAC (values per NSW legal standard; syllabus supplement)", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-008", "topic": "Gaming · Three motivations", "difficulty": "medium", "type": "mcq", "stem": "The lesson says games fall into three motivational drives. Which set is correct?", "options": ["Social, competition and loss of rewards", "Social, peer pressure and punishment for logging off", "Skill, reward and punishment for losing rank", "Social, pleasure (intermittent reward) and pain"], "answer": 3, "explanation_en": "Marks are awarded for filling in three blanks (1 mark each, 3 marks): Social (e.g. Farmville), Pleasure/intermittent reward (e.g. Call of Duty) and Pain (e.g. World of Warcraft). Only specific examples are accepted, not general terms such as 'fun' or 'addictive'.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Games – three motivational drives + Term 1 · Lesson 9 Online Safety", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-009", "topic": "Relationships · Five features of respect", "difficulty": "easy", "type": "short", "stem": "List FIVE common features of respectful relationships.", "options": [], "answer": "Mutual respect; trust; honesty; open communication; consent; equality (no one holds all the power); freedom to be yourself; support and encouragement.", "explanation_en": "Marks are awarded for each characteristic (1 mark each, 5 marks in total). Course terminology is required (mutual respect, trust, consent, open communication, equality), and only specific descriptions are accepted — not general terms such as 'treats me well' or 'doesn't argue'.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Features of respectful relationships", "marks": 5, "criteria": [{"id": "c1", "t": "Names a valid feature of respectful relationships (e.g. mutual respect, trust, honesty, open communication, consent, equality, freedom to be yourself, support and encouragement)", "m": 1}, {"id": "c2", "t": "Names a second valid feature from that range", "m": 1}, {"id": "c3", "t": "Names a third valid feature from that range", "m": 1}, {"id": "c4", "t": "Names a fourth valid feature from that range", "m": 1}, {"id": "c5", "t": "Names a fifth valid feature, using course terminology rather than a vague description such as 'being nice' or 'not arguing'", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names a valid feature of respectful relationships (e.g. mutual respect, trust, honesty, open communication, consent, equality, freedom to be yourself, support and encouragement)", "m": 1}, {"id": "c2", "t": "Names a second valid feature from that range", "m": 1}, {"id": "c3", "t": "Names a third valid feature from that range", "m": 1}, {"id": "c4", "t": "Names a fourth valid feature from that range", "m": 1}, {"id": "c5", "t": "Names a fifth valid feature, using course terminology rather than a vague description such as 'being nice' or 'not arguing'", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-010", "topic": "Relationships · Positive use of power", "difficulty": "medium", "type": "short", "stem": "Give examples of the POSITIVE use of power in a relationship.", "options": [], "answer": "Using influence to support and encourage the other person; making decisions together and giving them a voice; standing up for someone who is being bullied; mentoring a younger player and sharing responsibility; being honest about your own limits and asking for their input; using a leadership role to make sure everyone is included.", "explanation_en": "Marking points are broken down into each specific example, worth 1 point, usually given 3–4 points, with the criterion being 'power is used to give the other person more choices, making the relationship more equal', and negative uses of power, such as making all decisions for the other person, are also considered.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Positive use of power", "marks": 3, "criteria": [{"id": "c1", "t": "Gives a valid example of the positive use of power (e.g. using influence to support and encourage the other person, or making decisions together and giving them a voice)", "m": 1}, {"id": "c2", "t": "Gives a second valid example (e.g. standing up for someone who is being bullied, or mentoring a younger player and sharing responsibility)", "m": 1}, {"id": "c3", "t": "Gives a third valid example that increases the other person's choices and makes the relationship more equal (e.g. using a leadership role so that everyone is included, or asking for their input)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Gives a valid example of the positive use of power (e.g. using influence to support and encourage the other person, or making decisions together and giving them a voice)", "m": 1}, {"id": "c2", "t": "Gives a second valid example (e.g. standing up for someone who is being bullied, or mentoring a younger player and sharing responsibility)", "m": 1}, {"id": "c3", "t": "Gives a third valid example that increases the other person's choices and makes the relationship more equal (e.g. using a leadership role so that everyone is included, or asking for their input)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-011", "topic": "Relationships · Negative use of power", "difficulty": "easy", "type": "short", "stem": "Give examples of the NEGATIVE use of power in a relationship.", "options": [], "answer": "Coercion or threats; manipulation and guilt-tripping; peer pressure to do something risky; bullying or public humiliation; controlling who the other person sees or what they wear; withholding money or information; using physical size or status to intimidate; pressuring someone about consent.", "explanation_en": "Marking points are broken down into each specific example, worth 1 point, usually given 3–4 points, with negative power uses having in common 'using status, strength, or information difference to take away the other person's choices', including not just physical force but also emotional manipulation and economic control.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Negative use of power", "marks": 3, "criteria": [{"id": "c1", "t": "Gives a valid example of the negative use of power (e.g. coercion or threats, manipulation and guilt-tripping)", "m": 1}, {"id": "c2", "t": "Gives a second valid example (e.g. bullying or public humiliation, or peer pressure to do something risky)", "m": 1}, {"id": "c3", "t": "Gives a third valid example (e.g. controlling who the other person sees or what they wear, withholding money or information, intimidating through size or status, or pressuring someone about consent)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Gives a valid example of the negative use of power (e.g. coercion or threats, manipulation and guilt-tripping)", "m": 1}, {"id": "c2", "t": "Gives a second valid example (e.g. bullying or public humiliation, or peer pressure to do something risky)", "m": 1}, {"id": "c3", "t": "Gives a third valid example (e.g. controlling who the other person sees or what they wear, withholding money or information, intimidating through size or status, or pressuring someone about consent)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-012", "topic": "Relationships · Four communication styles", "difficulty": "hard", "type": "short", "stem": "List and describe the FOUR communication styles.", "options": [], "answer": "Passive: holding back your own needs and going along with others, often to avoid conflict. Aggressive: putting your own needs first and disregarding or violating the other person's rights (shouting, blaming, threats). Passive-aggressive: expressing anger indirectly — sulking, sarcasm, silent treatment or gossiping instead of saying it directly. Assertive: stating your needs clearly and calmly while respecting the other person's needs, using 'I' statements and staying open to negotiation.", "explanation_en": "Marks are awarded for naming the four styles (1 mark each, 4 marks) and describing each one accurately (1 mark each, 4 marks). The key is the two dimensions of 'my needs vs their needs'.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Four communication styles (marking points compiled from course content)", "marks": 8, "criteria": [{"id": "c1", "t": "Names passive communication", "m": 1}, {"id": "c2", "t": "Describes passive communication as holding back your own needs and going along with others, often to avoid conflict", "m": 1}, {"id": "c3", "t": "Names aggressive communication", "m": 1}, {"id": "c4", "t": "Describes aggressive communication as putting your own needs first while disregarding or violating the other person's rights (shouting, blaming, threats)", "m": 1}, {"id": "c5", "t": "Names passive-aggressive communication", "m": 1}, {"id": "c6", "t": "Describes passive-aggressive communication as expressing anger indirectly (sulking, sarcasm, silent treatment or gossiping instead of saying it directly)", "m": 1}, {"id": "c7", "t": "Names assertive communication", "m": 1}, {"id": "c8", "t": "Describes assertive communication as stating your needs clearly and calmly while respecting the other person's needs, using 'I' statements and staying open to negotiation", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names passive communication", "m": 1}, {"id": "c2", "t": "Describes passive communication as holding back your own needs and going along with others, often to avoid conflict", "m": 1}, {"id": "c3", "t": "Names aggressive communication", "m": 1}, {"id": "c4", "t": "Describes aggressive communication as putting your own needs first while disregarding or violating the other person's rights (shouting, blaming, threats)", "m": 1}, {"id": "c5", "t": "Names passive-aggressive communication", "m": 1}, {"id": "c6", "t": "Describes passive-aggressive communication as expressing anger indirectly (sulking, sarcasm, silent treatment or gossiping instead of saying it directly)", "m": 1}, {"id": "c7", "t": "Names assertive communication", "m": 1}, {"id": "c8", "t": "Describes assertive communication as stating your needs clearly and calmly while respecting the other person's needs, using 'I' statements and staying open to negotiation", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-013", "topic": "Self-concept · Sense of self", "difficulty": "easy", "type": "short", "stem": "Describe what SENSE OF SELF means.", "options": [], "answer": "A sense of self is how a person sees and values themselves — their self-esteem, self-worth and personal identity. It includes their beliefs about who they are, their values, their strengths and weaknesses, and how they think others see them. It is shaped by family, peers, culture, media, school and personal experience, and it keeps changing through adolescence.", "explanation_en": "Marks are awarded for: the definition (how a person views themselves), 1–2 marks; the components (self-esteem, self-worth, identity, values), 1–2 marks; and the influencing factors (family, peers, media, culture, experiences), 1 mark.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Sense of self (marking points compiled from course content)", "marks": 4, "criteria": [{"id": "c1", "t": "Defines sense of self as how a person sees and values themselves", "m": 1}, {"id": "c2", "t": "Identifies its components: self-esteem, self-worth and personal identity, including beliefs, values, strengths and weaknesses", "m": 1}, {"id": "c3", "t": "Explains that it is shaped by family, peers, culture, media, school and personal experience", "m": 1}, {"id": "c4", "t": "Notes that it includes how they think others see them and that it keeps changing through adolescence", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines sense of self as how a person sees and values themselves", "m": 1}, {"id": "c2", "t": "Identifies its components: self-esteem, self-worth and personal identity, including beliefs, values, strengths and weaknesses", "m": 1}, {"id": "c3", "t": "Explains that it is shaped by family, peers, culture, media, school and personal experience", "m": 1}, {"id": "c4", "t": "Notes that it includes how they think others see them and that it keeps changing through adolescence", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-014", "topic": "Mental health · Stigma", "difficulty": "medium", "type": "short", "stem": "Describe what the term STIGMA means and explain how it can affect a young person with a mental illness.", "options": [], "answer": "Stigma is a cluster of negative attitudes and beliefs that lead people to fear, reject, avoid and discriminate against those with a mental illness. It labels the person rather than the illness. For a young person it can cause shame and isolation, lead to bullying or being left out, and stop them telling anyone or seeking treatment, so the condition gets worse.", "explanation_en": "The marking criteria are broken down into: definition must include 'negative labels → fear/exclusion/discrimination' 2 marks; and the impact on adolescents 2 marks (shame and isolation, bullying or exclusion, and not daring to seek help leading to worsening conditions).", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Stigma + Term 2 · Lesson 2 Myths, Misconceptions & Stigma", "marks": 4, "criteria": [{"id": "c1", "t": "Defines stigma as a cluster of negative attitudes and beliefs about mental illness", "m": 1}, {"id": "c2", "t": "Explains that these attitudes lead people to fear, reject, avoid and discriminate against those with a mental illness, labelling the person rather than the illness", "m": 1}, {"id": "c3", "t": "Explains one effect on a young person: shame and isolation, or bullying and being left out", "m": 1}, {"id": "c4", "t": "Explains the further effect: it stops them telling anyone or seeking treatment, so the condition gets worse", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines stigma as a cluster of negative attitudes and beliefs about mental illness", "m": 1}, {"id": "c2", "t": "Explains that these attitudes lead people to fear, reject, avoid and discriminate against those with a mental illness, labelling the person rather than the illness", "m": 1}, {"id": "c3", "t": "Explains one effect on a young person: shame and isolation, or bullying and being left out", "m": 1}, {"id": "c4", "t": "Explains the further effect: it stops them telling anyone or seeking treatment, so the condition gets worse", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-015", "topic": "Mental health · Four common conditions", "difficulty": "medium", "type": "short", "stem": "List and describe FOUR common mental health disorders.", "options": [], "answer": "Depression: persistent low mood and loss of interest for weeks, with low confidence, changed appetite and sleep, tiredness and, at worst, suicidal thoughts. Anxiety: excessive worry with physical tension, difficulty concentrating, avoidance of situations and being easily startled. Bipolar disorder: mood swings between manic highs (elevated energy, little sleep, risky behaviour) and depressive lows. Schizophrenia: disturbance of thinking and perception, including delusions and hallucinations, which changes how the person interprets reality. (Eating disorders and PTSD are also acceptable answers.)", "explanation_en": "Marks are awarded for each disorder name (1 mark) plus a description of its typical symptoms (1 mark), so the four disorders together are worth 4–8 marks. Descriptions must include symptoms that are unique to each disorder.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Common mental health disorders + Term 2 · Lesson 1", "marks": 8, "criteria": [{"id": "c1", "t": "Names depression", "m": 1}, {"id": "c2", "t": "Describes depression as persistent low mood and loss of interest for weeks, with low confidence, changed appetite and sleep, tiredness and, at worst, suicidal thoughts", "m": 1}, {"id": "c3", "t": "Names anxiety", "m": 1}, {"id": "c4", "t": "Describes anxiety as excessive worry with physical tension, difficulty concentrating, avoidance of situations and being easily startled", "m": 1}, {"id": "c5", "t": "Names bipolar disorder", "m": 1}, {"id": "c6", "t": "Describes bipolar disorder as mood swings between manic highs (elevated energy, little sleep, risky behaviour) and depressive lows", "m": 1}, {"id": "c7", "t": "Names schizophrenia", "m": 1}, {"id": "c8", "t": "Describes schizophrenia as a disturbance of thinking and perception, including delusions and hallucinations, which changes how the person interprets reality", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names depression", "m": 1}, {"id": "c2", "t": "Describes depression as persistent low mood and loss of interest for weeks, with low confidence, changed appetite and sleep, tiredness and, at worst, suicidal thoughts", "m": 1}, {"id": "c3", "t": "Names anxiety", "m": 1}, {"id": "c4", "t": "Describes anxiety as excessive worry with physical tension, difficulty concentrating, avoidance of situations and being easily startled", "m": 1}, {"id": "c5", "t": "Names bipolar disorder", "m": 1}, {"id": "c6", "t": "Describes bipolar disorder as mood swings between manic highs (elevated energy, little sleep, risky behaviour) and depressive lows", "m": 1}, {"id": "c7", "t": "Names schizophrenia", "m": 1}, {"id": "c8", "t": "Describes schizophrenia as a disturbance of thinking and perception, including delusions and hallucinations, which changes how the person interprets reality", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-016", "topic": "Adolescence · Changing parental relationships", "difficulty": "hard", "type": "short", "stem": "Explain why a teenager's relationship with their parents often changes during adolescence. Discuss at least TWO social changes and TWO emotional changes.", "options": [], "answer": "Social changes: teenagers develop their own values and are influenced more by peers and media than by parents, so conflict over rules increases; they form a sexual identity and want more privacy; they seek independence and greater responsibility, and want to negotiate rather than be told what to do. Emotional changes: moods and feelings swing more widely, they become more sensitive to others' opinions and self-conscious about how they look, and they want to make their own decisions. As a result the relationship shifts from parent-controlled to more equal, with more negotiation and sometimes more conflict, and it usually settles again as independence is worked out.", "explanation_en": "Marks are awarded for: at least two social changes with explanations (2–3 marks); at least two emotional changes with explanations (2–3 marks); and identifying the overall shift in the relationship from 'being controlled' to 'negotiation/equality', with an explanation of the outcome (1–2 marks).", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Adolescent relationships", "marks": 6, "criteria": [{"id": "c1", "t": "Explains one social change: teenagers develop their own values and are influenced more by peers and media than by parents, so conflict over rules increases", "m": 1}, {"id": "c2", "t": "Explains a second social change: they seek independence and greater responsibility, form a sexual identity and want more privacy, and want to negotiate rather than be told what to do", "m": 1}, {"id": "c3", "t": "Explains one emotional change: moods and feelings swing more widely and they become more sensitive to others' opinions and self-conscious about how they look", "m": 1}, {"id": "c4", "t": "Explains a second emotional change: they want to make their own decisions", "m": 1}, {"id": "c5", "t": "Explains that the relationship therefore shifts from parent-controlled to more equal, with more negotiation and sometimes more conflict", "m": 1}, {"id": "c6", "t": "Explains the outcome: the relationship usually settles again as independence is worked out", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains one social change: teenagers develop their own values and are influenced more by peers and media than by parents, so conflict over rules increases", "m": 1}, {"id": "c2", "t": "Explains a second social change: they seek independence and greater responsibility, form a sexual identity and want more privacy, and want to negotiate rather than be told what to do", "m": 1}, {"id": "c3", "t": "Explains one emotional change: moods and feelings swing more widely and they become more sensitive to others' opinions and self-conscious about how they look", "m": 1}, {"id": "c4", "t": "Explains a second emotional change: they want to make their own decisions", "m": 1}, {"id": "c5", "t": "Explains that the relationship therefore shifts from parent-controlled to more equal, with more negotiation and sometimes more conflict", "m": 1}, {"id": "c6", "t": "Explains the outcome: the relationship usually settles again as independence is worked out", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-017", "topic": "Communication · Good listening", "difficulty": "easy", "type": "short", "stem": "List some features of a good listener.", "options": [], "answer": "Gives eye contact and open body language; puts the phone away and stops other tasks; does not interrupt; lets the speaker finish before replying; asks clarifying questions; paraphrases or summarises what was said; shows empathy and does not judge; keeps the conversation confidential.", "explanation_en": "Marks are awarded for each characteristic (1 mark each, usually 4–5 marks), and the features must be observable behaviours: eye contact, not interrupting, repeating key points, putting the phone down.", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Features of a good listener", "marks": 5, "criteria": [{"id": "c1", "t": "Names a valid feature of a good listener (e.g. giving eye contact and open body language, putting the phone away and stopping other tasks)", "m": 1}, {"id": "c2", "t": "Names a second valid feature (e.g. not interrupting, letting the speaker finish before replying)", "m": 1}, {"id": "c3", "t": "Names a third valid feature (e.g. asking clarifying questions, paraphrasing or summarising what was said)", "m": 1}, {"id": "c4", "t": "Names a fourth valid feature (e.g. showing empathy and not judging)", "m": 1}, {"id": "c5", "t": "Names a fifth valid feature and states it as an observable behaviour (e.g. keeping the conversation confidential) rather than a vague evaluation such as 'listens well'", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names a valid feature of a good listener (e.g. giving eye contact and open body language, putting the phone away and stopping other tasks)", "m": 1}, {"id": "c2", "t": "Names a second valid feature (e.g. not interrupting, letting the speaker finish before replying)", "m": 1}, {"id": "c3", "t": "Names a third valid feature (e.g. asking clarifying questions, paraphrasing or summarising what was said)", "m": 1}, {"id": "c4", "t": "Names a fourth valid feature (e.g. showing empathy and not judging)", "m": 1}, {"id": "c5", "t": "Names a fifth valid feature and states it as an observable behaviour (e.g. keeping the conversation confidential) rather than a vague evaluation such as 'listens well'", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-018", "topic": "Relationships · Maintaining respect", "difficulty": "hard", "type": "short", "stem": "Analyse the behaviours needed to maintain respectful relationships. Use at least FOUR of: trust, honesty, freedom, consent, open communication, mutual respect. You must describe each behaviour, show how the behaviours affect each other, and discuss the implications.", "options": [], "answer": "Description: trust is the confidence that the other person will not hurt or betray you; honesty means telling the truth even when it is difficult; freedom is each person's right to their own friends, interests and choices; consent means a clear, freely given yes to any physical or emotional intimacy; open communication means saying what you think and feel, and listening in return; mutual respect means treating the other person as an equal whose needs matter. Interaction: without honesty there can be no trust, therefore a relationship built on small lies gradually loses its security; without open communication consent cannot be given or checked, so respect breaks down and conflict or harm follows. Implications: a relationship missing trust and respect tends to become controlling or collapse, leading to emotional harm, isolation and, for young people, damage to self-esteem and mental health.", "explanation_en": "Marks are awarded for: describing four behaviours (1 mark each, 4 marks); using connecting words such as 'therefore', 'as a result' or 'leading to' to explain the causal links between behaviours (2–3 marks); and discussing the consequences and impact on individuals, families and mental health (2–3 marks).", "source": "Year 10 PDHPE Yearly Revision Questions 2023 · Analysing respectful relationships", "marks": 8, "criteria": [{"id": "c1", "t": "Describes one behaviour from the list (e.g. trust as the confidence that the other person will not hurt or betray you)", "m": 1}, {"id": "c2", "t": "Describes a second behaviour (e.g. honesty as telling the truth even when it is difficult)", "m": 1}, {"id": "c3", "t": "Describes a third behaviour (e.g. consent as a clear, freely given yes to any physical or emotional intimacy, or freedom as each person's right to their own friends, interests and choices)", "m": 1}, {"id": "c4", "t": "Describes a fourth behaviour (e.g. open communication as saying what you think and feel and listening in return, or mutual respect as treating the other person as an equal whose needs matter)", "m": 1}, {"id": "c5", "t": "Explains how the behaviours depend on each other (e.g. without honesty there can be no trust, so a relationship built on small lies gradually loses its security)", "m": 1}, {"id": "c6", "t": "Explains a second interaction (e.g. without open communication consent cannot be given or checked, so respect breaks down and conflict or harm follows)", "m": 1}, {"id": "c7", "t": "Discusses implications for the relationship: one missing trust and respect tends to become controlling or to collapse", "m": 1}, {"id": "c8", "t": "Discusses implications for the individual: emotional harm, isolation and, for young people, damage to self-esteem and mental health", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes one behaviour from the list (e.g. trust as the confidence that the other person will not hurt or betray you)", "m": 1}, {"id": "c2", "t": "Describes a second behaviour (e.g. honesty as telling the truth even when it is difficult)", "m": 1}, {"id": "c3", "t": "Describes a third behaviour (e.g. consent as a clear, freely given yes to any physical or emotional intimacy, or freedom as each person's right to their own friends, interests and choices)", "m": 1}, {"id": "c4", "t": "Describes a fourth behaviour (e.g. open communication as saying what you think and feel and listening in return, or mutual respect as treating the other person as an equal whose needs matter)", "m": 1}, {"id": "c5", "t": "Explains how the behaviours depend on each other (e.g. without honesty there can be no trust, so a relationship built on small lies gradually loses its security)", "m": 1}, {"id": "c6", "t": "Explains a second interaction (e.g. without open communication consent cannot be given or checked, so respect breaks down and conflict or harm follows)", "m": 1}, {"id": "c7", "t": "Discusses implications for the relationship: one missing trust and respect tends to become controlling or to collapse", "m": 1}, {"id": "c8", "t": "Discusses implications for the individual: emotional harm, isolation and, for young people, damage to self-esteem and mental health", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-019", "topic": "First aid · DRSABCD order", "difficulty": "easy", "type": "mcq", "stem": "In the DRSABCD action plan, what must you do FIRST before attending to a casualty?", "options": ["Check the area is safe for you, bystanders and the casualty", "Send another person to dial triple zero (000) straight away", "Check for a response by squeezing their shoulders firmly", "Start chest compressions on the casualty straight away"], "answer": 0, "explanation_en": "Marks are awarded for the sequence (1 mark — D comes first) and the reason (1 mark — the rescuer's safety comes first). D stands for Danger, not Defibrillation.", "source": "Term 3 · Lesson 5 First Aid · DANGER", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-020", "topic": "First aid · CPR compression ratio", "difficulty": "easy", "type": "mcq", "stem": "When performing CPR on an adult, what is the correct compression-to-breath ratio?", "options": ["50 compressions : 5 breaths", "30 compressions : 2 breaths", "15 compressions then 2 breaths", "5 compressions : 1 breath"], "answer": 1, "explanation_en": "Marks are awarded for the ratio 30:2 (1 mark), and for knowing that CPR can be stopped in only three situations: help arrives, the casualty recovers, or the rescuer is physically unable to continue.", "source": "Term 3 · Lesson 5 First Aid · CPR", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-021", "topic": "First aid · DRSABCD at a crash", "difficulty": "hard", "type": "short", "stem": "You are the first person to arrive at a motorcycle crash on a busy road. Describe, in order, the actions you would take using DRSABCD, including two hazards you would manage.", "options": [], "answer": "Danger: stop safely with hazard lights on, keep clear of moving traffic and any fuel spill, and ask bystanders to warn oncoming vehicles. Response: check whether the rider responds by speaking to them and squeezing their shoulders. Send for help: call 000 or direct a bystander to do it. Airway: open the airway and clear any foreign material. Breathing: look, listen and feel; if breathing is not normal, start CPR at 30:2. Circulation: control any major bleeding. Defibrillation: apply an AED if available and follow the voice prompts.", "explanation_en": "Marks are awarded for: D, describing the danger at the scene and how to protect yourself (2 marks); R, checking for a response (1 mark); S, calling for help and specifying 000 or directing someone to do it (1 mark); the A-B-C sequence and the judgement involved (3 marks); D, getting the AED (1 mark); and naming two or more dangers at the scene — oncoming cars, fuel, power lines, broken glass (1–2 marks).", "source": "Term 1 · First Aid – Road Trauma + Term 3 · Lesson 5 First Aid · DRSABCD", "marks": 9, "criteria": [{"id": "c1", "t": "States Danger first: stopping safely with hazard lights on and keeping clear of moving traffic and any fuel spill", "m": 1}, {"id": "c2", "t": "Manages two hazards at the scene (e.g. oncoming traffic, fuel spill, glass or power lines), including asking bystanders to warn oncoming vehicles", "m": 1}, {"id": "c3", "t": "States Response: checking whether the rider responds by speaking to them and squeezing their shoulders", "m": 1}, {"id": "c4", "t": "States Send for help: calling 000 or directing a bystander to do it", "m": 1}, {"id": "c5", "t": "States Airway: opening the airway and clearing any foreign material", "m": 1}, {"id": "c6", "t": "States Breathing: looking, listening and feeling, and starting CPR at 30:2 if breathing is not normal", "m": 1}, {"id": "c7", "t": "States Circulation: controlling any major bleeding", "m": 1}, {"id": "c8", "t": "States Defibrillation: applying an AED if available and following the voice prompts", "m": 1}, {"id": "c9", "t": "Presents the actions in the correct DRSABCD sequence", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States Danger first: stopping safely with hazard lights on and keeping clear of moving traffic and any fuel spill", "m": 1}, {"id": "c2", "t": "Manages two hazards at the scene (e.g. oncoming traffic, fuel spill, glass or power lines), including asking bystanders to warn oncoming vehicles", "m": 1}, {"id": "c3", "t": "States Response: checking whether the rider responds by speaking to them and squeezing their shoulders", "m": 1}, {"id": "c4", "t": "States Send for help: calling 000 or directing a bystander to do it", "m": 1}, {"id": "c5", "t": "States Airway: opening the airway and clearing any foreign material", "m": 1}, {"id": "c6", "t": "States Breathing: looking, listening and feeling, and starting CPR at 30:2 if breathing is not normal", "m": 1}, {"id": "c7", "t": "States Circulation: controlling any major bleeding", "m": 1}, {"id": "c8", "t": "States Defibrillation: applying an AED if available and following the voice prompts", "m": 1}, {"id": "c9", "t": "Presents the actions in the correct DRSABCD sequence", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-022", "topic": "Road safety · Blind distance when distracted", "difficulty": "easy", "type": "mcq", "stem": "At 60 km/h, how far does a car travel in the two seconds a driver's eyes are off the road?", "options": ["About 60 m", "About 120 m", "About 33 m", "About 17 m"], "answer": 2, "explanation_en": "Marks are awarded for the working: 60 ÷ 3.6 = 16.7 m/s, then × 2 seconds ≈ 33 m (1 mark).", "source": "Term 1 · Lesson 2–3 · Are you driving blind?", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-023", "topic": "Road safety · Novice driver risk", "difficulty": "medium", "type": "mcq", "stem": "A 17-year-old driver on a P1 licence is how much more likely to be involved in a fatal crash than a driver over 26 years?", "options": ["Ten times as likely", "Three times as likely", "Two times as likely", "Four times as likely"], "answer": 3, "explanation_en": "Marks are awarded for the answer, four times (1 mark), and for giving reasons — unfamiliarity with road conditions, undeveloped hazard perception and a tendency to take risks — for a further 1 mark.", "source": "Term 1 · Lesson 4 Influences on Road Safety · Young People on the Roads", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-024", "topic": "Mental health · Prevalence and types", "difficulty": "medium", "type": "short", "stem": "What proportion of Australians aged 16–85 experience a mental illness in any one year? Name the three most common types and explain why they often occur together.", "options": [], "answer": "About one in five (20%). The most common are depression, anxiety and substance use disorders. They often occur together: a person with an anxiety disorder may go on to develop depression, and a person with depression may misuse alcohol or other drugs to cope, so one condition can trigger or hide another.", "explanation_en": "The marks are broken down as follows: 20% (1 in 5) is 1 mark; three types each worth 1 mark (3 marks); explaining comorbidities and mutual triggers is 2 marks. Writing numbers as 1 in 10 or 50% will result in a loss of marks; simply stating that the three diseases are common without explaining their relationship will not be awarded marks.", "source": "Term 2 · Lesson 1 Common Mental Health Conditions · Prevalence", "marks": 6, "criteria": [{"id": "c1", "t": "States the proportion as about one in five, or 20%", "m": 1}, {"id": "c2", "t": "Names depression as one of the three most common types", "m": 1}, {"id": "c3", "t": "Names anxiety as one of the three most common types", "m": 1}, {"id": "c4", "t": "Names substance use disorders as one of the three most common types", "m": 1}, {"id": "c5", "t": "Explains that one condition can trigger another (e.g. a person with an anxiety disorder may go on to develop depression)", "m": 1}, {"id": "c6", "t": "Explains that one condition can hide another or be used to cope (e.g. depression leading to alcohol or other drug misuse)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States the proportion as about one in five, or 20%", "m": 1}, {"id": "c2", "t": "Names depression as one of the three most common types", "m": 1}, {"id": "c3", "t": "Names anxiety as one of the three most common types", "m": 1}, {"id": "c4", "t": "Names substance use disorders as one of the three most common types", "m": 1}, {"id": "c5", "t": "Explains that one condition can trigger another (e.g. a person with an anxiety disorder may go on to develop depression)", "m": 1}, {"id": "c6", "t": "Explains that one condition can hide another or be used to cope (e.g. depression leading to alcohol or other drug misuse)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-025", "topic": "Mental health · Resilience", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is one of the characteristics of resilient people identified in the lesson?", "options": ["A strong sense of control over their own life", "Seeing themselves as a victim of circumstance", "Never asking anybody for help at all", "Avoiding every situation that feels difficult"], "answer": 0, "explanation_en": "Marks are awarded for identifying the correct characteri
