le cx=\"221.0\" cy=\"184.8\" r=\"4.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.2\"/><circle cx=\"276.0\" cy=\"146.9\" r=\"4.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.2\"/><circle cx=\"331.0\" cy=\"106.9\" r=\"4.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.2\"/><circle cx=\"386.0\" cy=\"70.0\" r=\"4.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.2\"/><circle cx=\"441.0\" cy=\"35.2\" r=\"4.0\" fill=\"var(--foreground)\" stroke=\"var(--surface)\" stroke-width=\"1.2\"/></svg>", "points": [{"id": "c1", "t": "(a) Recognises that 5 m/s² is halfway between 4 m/s² (305 N) and 6 m/s² (448 N)", "m": 1}, {"id": "c2", "t": "(a) Interpolates to about 376 N (accept 370–380 N)", "m": 1}, {"id": "c3", "t": "(b) Describes a linear relationship: the force increases by a constant amount (about 74 N) for every extra 1 m/s² of deceleration", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Alkane formula", "difficulty": "easy", "type": "mcq", "stem": "Which general formula correctly represents the alkanes?", "options": ["CnH2n", "CnH2n-2", "CnH2n+2", "CnH2n+1OH"], "answer": 2, "explanation_en": "Alkanes are saturated hydrocarbons, with only single bonds between carbon atoms, and have the general formula CnH2n+2; alkenes have one double bond and the formula CnH2n, and alcohols have the formula CnH2n+1OH.", "id": "sci-028", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Naming", "difficulty": "easy", "type": "mcq", "stem": "What is the IUPAC name of the compound CH3–CH2–CH3?", "options": ["Ethane", "Butane", "Methane", "Propane"], "answer": 3, "explanation_en": "The three-carbon alkane is propane; methane has one carbon, ethane has two, and butane has four.", "id": "sci-029", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Functional groups", "difficulty": "medium", "type": "mcq", "stem": "Which functional group is present in ethanol, CH3CH2OH?", "options": ["Hydroxyl group (–OH)", "Carboxyl group (–COOH)", "Ester linkage (–COO–)", "Carbon–carbon double bond (C=C)"], "answer": 0, "explanation_en": "The functional group of ethanol is the hydroxyl group -OH, and it belongs to the category of alcohols; -COOH is a carboxylic acid, C=C is an alkene, and -COO- is an ester.", "id": "sci-030", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Test for unsaturation", "difficulty": "medium", "type": "mcq", "stem": "Bromine water is added to a sample. The orange-brown colour disappears. What does this show?", "options": ["The sample is an alkane", "The sample contains an alkene (C=C)", "The sample contains only single bonds", "The sample contains a carboxylic acid"], "answer": 1, "explanation_en": "The decolourisation of bromine water is a test for unsaturated bonds: alkenes undergo an addition reaction with Br₂, the double bond opens, and the colour disappears; alkanes do not react, and the colour remains.", "id": "sci-031", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Isomers", "difficulty": "hard", "type": "mcq", "stem": "Butane and 2-methylpropane both have the molecular formula C4H10. They are best described as:", "options": ["Polymers", "Isotopes", "Isomers", "Allotropes"], "answer": 2, "explanation_en": "Isomers have the same molecular formula but different structures; butane is a straight chain, and 2-methylpropane is a branched chain; isotopes are atoms of the same element with different numbers of neutrons, allotropes are different forms of the same element, and polymers are large molecules made up of many smaller molecules.", "id": "sci-032", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Combustion products", "difficulty": "easy", "type": "mcq", "stem": "A hydrocarbon burns completely in excess oxygen. Which two products are formed?", "options": ["Ethanol and carbon dioxide", "Carbon monoxide and hydrogen", "Carbon and oxygen", "Carbon dioxide and water"], "answer": 3, "explanation_en": "Complete combustion involves a hydrocarbon reacting with O₂ to produce CO₂ and H₂O, but incomplete combustion with insufficient oxygen produces CO and carbon black.", "id": "sci-033", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Testing for CO₂", "difficulty": "easy", "type": "mcq", "stem": "Which test identifies the gas produced when a hydrocarbon burns completely?", "options": ["It turns limewater milky", "It pops with a lighted splint", "It bleaches damp litmus paper", "It relights a glowing splint"], "answer": 0, "explanation_en": "CO₂ turns lime water cloudy by forming a CaCO₃ precipitate; a glowing wooden splint indicates oxygen, a popping sound indicates hydrogen, and bleaching wet litmus indicates chlorine.", "id": "sci-034", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Addition reactions", "difficulty": "medium", "type": "mcq", "stem": "Ethene reacts with hydrogen in the presence of a nickel catalyst. The product is:", "options": ["Ethanol", "Ethane", "Ethyl ethanoate", "Ethanoic acid"], "answer": 1, "explanation_en": "Hydrogenation involves adding hydrogen to an alkene, such as C₂H₄ + H2 → C₂H₆, converting it to an alkane, not an alcohol like ethanol.", "id": "sci-035", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Esterification", "difficulty": "hard", "type": "mcq", "stem": "Ethanol reacts with ethanoic acid to produce a compound with a sweet smell. This reaction is called:", "options": ["Polymerisation", "Combustion", "Esterification", "Neutralisation"], "answer": 2, "explanation_en": "An esterification reaction involves an alcohol and a carboxylic acid producing an ester and water, requiring concentrated sulfuric acid as a catalyst and heat, resulting in a fragrant ester like ethyl acetate.", "id": "sci-036", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Addition polymerisation", "difficulty": "medium", "type": "mcq", "stem": "Polythene (polyethylene) is made from ethene. Which type of reaction produces it?", "options": ["Substitution", "Condensation", "Fermentation", "Addition polymerisation"], "answer": 3, "explanation_en": "The polymerisation of ethene molecules (containing C=C) involves the opening of double bonds to form a long chain, called addition polymerisation, producing polyethylene.", "id": "sci-037", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Identifying functional groups", "difficulty": "medium", "type": "mcq", "stem": "Which of these compounds contains a carboxyl group and will turn blue litmus red?", "options": ["CH3COOH", "C₂H₄", "CH3OH", "CH3CH3"], "answer": 0, "explanation_en": "CH3COOH is acetic acid, a weak acid containing –COOH, which turns blue litmus red, whereas CH3OH is a neutral alcohol and CH3CH3 is an alkane, and C₂H₄ is an alkene.", "id": "sci-038", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Uses of ethanol", "difficulty": "easy", "type": "mcq", "stem": "Ethanol is increasingly used as a fuel because it:", "options": ["Burns without releasing carbon dioxide", "Can be produced by fermentation of plant material and is renewable", "Has a higher energy density than octane", "Does not require oxygen to burn"], "answer": 1, "explanation_en": "Ethanol can be produced by fermenting sugars and is a renewable fuel often mixed with petrol to make E10, producing CO₂ when burned, but with a lower energy density than petrol.", "id": "sci-039", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Formula and structure", "difficulty": "medium", "type": "mcq", "stem": "A molecule has the structural formula CH3–CH=CH–CH3. Which statement is correct?", "options": ["It is an alcohol", "It is a saturated compound with no double bonds", "It contains four carbon atoms and one double bond", "It contains a carboxyl group"], "answer": 2, "explanation_en": "A four-carbon molecule with a C=C bond is butene, an unsaturated compound, as it contains a double bond but no –OH or –COOH groups.", "id": "sci-040", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Boiling point trend", "difficulty": "hard", "type": "mcq", "stem": "As the carbon chain of a homologous series of alkanes increases, the boiling point:", "options": ["Decreases, because molecules get lighter", "Increases, because the molecules become more polar", "Stays the same", "Increases, because dispersion forces between molecules get stronger"], "answer": 3, "explanation_en": "In a homologous series, the longer the carbon chain, the stronger the dispersion forces between molecules, so more energy is needed to separate them and the boiling point is higher. In non-polar alkanes this is not caused by increased polarity.", "id": "sci-041", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Naming practice", "difficulty": "medium", "type": "mcq", "stem": "The compound CH3–CH2–CH2–OH is named:", "options": ["Propan-1-ol", "Propane", "Propanal", "Propanoic acid"], "answer": 0, "explanation_en": "A three-carbon chain with a hydroxyl group is propan-1-ol; propanoic acid is propionic acid, propanal is propionaldehyde, and propane is an alkane.", "id": "sci-042", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Reaction types", "difficulty": "medium", "type": "mcq", "stem": "Methane reacts with chlorine in the presence of ultraviolet light. This is an example of:", "options": ["Polymerisation", "Substitution", "Addition", "Esterification"], "answer": 1, "explanation_en": "Under UV light, alkanes react with halogens by substitution: a hydrogen atom is replaced by a chlorine atom, producing CH₃Cl and HCl. This is substitution, not addition, which would require a double bond.", "id": "sci-043", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Drawing structures", "difficulty": "hard", "type": "short", "stem": "Draw the full structural formula of ethanol and identify its functional group. Then explain why ethanol is soluble in water.", "answer": "CH3–CH2–OH, with every C–H and C–O bond shown (C₂H₅OH). Functional group: hydroxyl (–OH). Ethanol is soluble because the –OH group forms hydrogen bonds with water molecules.", "explanation_en": "Structural formulas must show all bonds and cannot be abbreviated as C2H6O; solubility arises from hydrogen bonding between the hydroxyl group and water, and the short carbon chain of only two carbon atoms is not enough to prevent dissolution.", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry (drawing + explanation questions)", "points": [{"id": "c1", "t": "Shows the full structural formula of ethanol with all bonds drawn (CH3–CH2–OH), not just the molecular formula C2H6O", "m": 1}, {"id": "c2", "t": "Identifies the functional group as the hydroxyl (–OH) group", "m": 1}, {"id": "c3", "t": "Explains solubility by hydrogen bonding between the –OH group and water molecules", "m": 1}], "id": "sci-044", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "Shows the full structural formula of ethanol with all bonds drawn (CH3–CH2–OH), not just the molecular formula C2H6O", "m": 1}, {"id": "c2", "t": "Identifies the functional group as the hydroxyl (–OH) group", "m": 1}, {"id": "c3", "t": "Explains solubility by hydrogen bonding between the –OH group and water molecules", "m": 1}], "auto_grade": true, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Explaining evidence", "difficulty": "hard", "type": "short", "stem": "A student adds bromine water to two unknown colourless liquids. Sample A decolourises the bromine water at room temperature; sample B does not. Explain what this tells you about the bonding in each sample, and name a possible compound for A and for B.", "answer": "Sample A contains a carbon–carbon double bond (unsaturated): bromine adds across the C=C, so the orange colour disappears. Sample B has only single bonds (saturated) and does not react at room temperature. A could be ethene/hexene; B could be hexane/ethane.", "explanation_en": "This is a typical 'evidence + explanation' question: give the chemical reason for what happens (addition), then the judgement for saturated vs unsaturated, then an example of each. Writing only 'A is unsaturated' will not earn full marks.", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "points": [{"id": "c1", "t": "Explains that sample A contains a carbon–carbon double bond (is unsaturated), so bromine adds across the C=C and the colour disappears", "m": 1}, {"id": "c2", "t": "Explains that sample B has only single bonds (is saturated), so it does not react with bromine water at room temperature", "m": 1}, {"id": "c3", "t": "Names a valid compound for each: an alkene for A (e.g. ethene or hexene) and an alkane for B (e.g. ethane or hexane)", "m": 1}], "id": "sci-045", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "Explains that sample A contains a carbon–carbon double bond (is unsaturated), so bromine adds across the C=C and the colour disappears", "m": 1}, {"id": "c2", "t": "Explains that sample B has only single bonds (is saturated), so it does not react with bromine water at room temperature", "m": 1}, {"id": "c3", "t": "Names a valid compound for each: an alkene for A (e.g. ethene or hexene) and an alkane for B (e.g. ethane or hexane)", "m": 1}], "auto_grade": true, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Comparison and uses", "difficulty": "medium", "type": "short", "stem": "Compare the structure and reactivity of an alkane and an alkene, and explain why alkenes are used to make plastics.", "answer": "Alkanes have only single C–C bonds and are saturated, so they mainly undergo substitution (with UV light) and combustion. Alkenes contain a C=C double bond, are unsaturated, and readily undergo addition reactions. Because alkenes can join to each other by addition (addition polymerisation), they form long-chain polymers such as polyethene and PVC.", "explanation_en": "Marks come from three parts: structural differences (single vs double bonds), reaction differences (substitution or burning vs addition), and the link to plastics (polymerisation). Miss one part and you lose a third of the marks.", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "points": [{"id": "c1", "t": "States that alkanes have only single C–C bonds and are saturated, so they mainly undergo substitution (with UV light) and combustion", "m": 1}, {"id": "c2", "t": "States that alkenes contain a C=C double bond, are unsaturated, and readily undergo addition reactions", "m": 1}, {"id": "c3", "t": "Explains that alkenes join by addition polymerisation to form long-chain polymers such as polyethene or PVC", "m": 1}], "id": "sci-046", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "States that alkanes have only single C–C bonds and are saturated, so they mainly undergo substitution (with UV light) and combustion", "m": 1}, {"id": "c2", "t": "States that alkenes contain a C=C double bond, are unsaturated, and readily undergo addition reactions", "m": 1}, {"id": "c3", "t": "Explains that alkenes join by addition polymerisation to form long-chain polymers such as polyethene or PVC", "m": 1}], "auto_grade": true, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Homologous series", "difficulty": "medium", "type": "short", "stem": "Methanol, ethanol and propanol are members of the same homologous series. State one property that changes in a regular way down the series and explain why.", "answer": "Boiling point increases from methanol to propanol. As the carbon chain lengthens, the molecules have more electrons and a larger surface area, so dispersion forces between molecules become stronger and more energy is needed to separate them.", "explanation_en": "For homologous series questions, first state which regular change the data points to (the rise in boiling point), then explain it in terms of intermolecular forces. Saying 'the molecules get bigger' is not enough: you have to link it to dispersion forces and the energy needed to separate the molecules.", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "points": [{"id": "c1", "t": "States one property that changes regularly down the series, e.g. boiling point increases from methanol to propanol", "m": 1}, {"id": "c2", "t": "Explains that a longer carbon chain has more electrons and a larger surface area, so dispersion forces between molecules are stronger and more energy is needed to separate them", "m": 1}], "id": "sci-047", "options": [], "marks": 2, "criteria": [{"id": "c1", "t": "States one property that changes regularly down the series, e.g. boiling point increases from methanol to propanol", "m": 1}, {"id": "c2", "t": "Explains that a longer carbon chain has more electrons and a larger surface area, so dispersion forces between molecules are stronger and more energy is needed to separate them", "m": 1}], "auto_grade": true, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"topic": "Organic chemistry · Experimental design", "difficulty": "hard", "type": "short", "stem": "Describe a fair test to compare how completely ethanol and octane burn. Identify the independent, dependent and controlled variables.", "answer": "Independent variable: the fuel used (ethanol vs octane). Dependent variable: a measure of completeness of combustion, e.g. the amount of soot produced, the colour of the flame, or the mass of CO₂/heat released per gram. Controlled: same mass of fuel, same burner, same distance from the flame to the surface, same volume of water heated, same starting temperature, same oxygen supply. Judge completeness by the least soot and the cleanest blue flame.", "explanation_en": "The syllabus Part C explicitly lists 'Identifying Variables' and 'Planning Investigations', the answer must have all three variables and provide measurable indicators, cannot just write 'observe the flame'.", "source": "Yearly Study Guide 2026 · Science Part C: Skills(Planning Investigations / Identifying Variables)", "points": [{"id": "c1", "t": "Identifies the independent variable (the fuel used, ethanol versus octane) and a measurable dependent variable (e.g. amount of soot, flame colour, mass of CO₂ or heat released per gram)", "m": 1}, {"id": "c2", "t": "Lists controlled variables such as the same mass of fuel, same burner, same distance from flame to surface, same volume and starting temperature of water, same oxygen supply", "m": 1}, {"id": "c3", "t": "Explains how completeness of combustion is judged, e.g. the least soot and the cleanest blue flame", "m": 1}], "id": "sci-048", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "Identifies the independent variable (the fuel used, ethanol versus octane) and a measurable dependent variable (e.g. amount of soot, flame colour, mass of CO₂ or heat released per gram)", "m": 1}, {"id": "c2", "t": "Lists controlled variables such as the same mass of fuel, same burner, same distance from flame to surface, same volume and starting temperature of water, same oxygen supply", "m": 1}, {"id": "c3", "t": "Explains how completeness of combustion is judged, e.g. the least soot and the cleanest blue flame", "m": 1}], "auto_grade": true, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sciother-001", "topic": "Earth's energy · Solar radiation", "difficulty": "easy", "type": "mcq", "stem": "Which two types of solar radiation reach the surface of the Earth and act as the main driving force for Earth's processes?", "options": ["Visible light and infrared", "Visible light and X-rays", "Microwaves and X-rays", "Microwaves and infrared"], "answer": 0, "explanation_en": "The main drivers of Earth's processes that reach the surface are visible light and infrared radiation: visible light provides energy for photosynthesis, and infrared radiation heats the hydrosphere, driving the water cycle. X-rays and microwaves are mostly absorbed by the atmosphere and do not reach the surface.", "source": "Term 1 · Earth's Energy – Earth.pdf(Topic 6 Earth · Solar radiation)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-002", "topic": "Earth's energy · Earth's spheres", "difficulty": "easy", "type": "mcq", "stem": "Which of Earth's four spheres is described as the outer part of the Earth, consisting of the crust and upper mantle and about 100 km thick?", "options": ["Biosphere", "Lithosphere", "Atmosphere", "Hydrosphere"], "answer": 1, "explanation_en": "The lithosphere = crust + upper mantle, approximately 100 km thick. The atmosphere is a layer of gas, the biosphere is the range of biological survival, and the hydrosphere is the solid/liquid/gaseous water on the surface.", "source": "Term 1 · Earth's Energy – Revision Booklet(Topic 6 Earth · Terminology)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-003", "topic": "Earth's energy · Albedo feedback", "difficulty": "medium", "type": "mcq", "stem": "Arctic sea ice melts and exposes the dark ocean underneath. Which statement best explains the effect on global temperature?", "options": ["Albedo increases, so more radiation is reflected and the temperature falls.", "Albedo stays the same because water and ice reflect the same amount of radiation.", "Albedo decreases, so more solar radiation is absorbed and the temperature rises further.", "Albedo decreases, so more radiation is reflected back to space and the temperature falls."], "answer": 2, "explanation_en": "As ice melts it exposes dark seawater, so the albedo falls, more solar radiation is absorbed and the temperature rises, which melts even more ice: a positive feedback loop.", "source": "Term 1 · Earth's Energy – STUDENT 5. Earth.docx(Practical 2 Albedo Effect)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-004", "topic": "Earth's energy · Water cycle", "difficulty": "medium", "type": "short", "stem": "Explain how solar radiation drives the water cycle.", "options": [], "answer": "Infrared radiation from the Sun warms the hydrosphere, so liquid water evaporates into water vapour. The vapour rises and cools, condenses into clouds, and eventually falls back to the surface as precipitation such as rain, hail or snow.", "explanation_en": "The water cycle is driven by solar infrared radiation heating the hydrosphere: evaporation → rising and cooling → condensation → precipitation, which returns water to the oceans, lakes and rivers.", "source": "Term 1 · Earth's Energy – Earth.pdf(Topic 6 · The Water Cycle)", "marks": 3, "criteria": [{"id": "c1", "t": "States that infrared radiation from the Sun warms the hydrosphere, so liquid water evaporates into water vapour", "m": 1}, {"id": "c2", "t": "States that the vapour rises and cools and condenses into clouds", "m": 1}, {"id": "c3", "t": "States that the water returns to the surface as precipitation such as rain, hail or snow", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that infrared radiation from the Sun warms the hydrosphere, so liquid water evaporates into water vapour", "m": 1}, {"id": "c2", "t": "States that the vapour rises and cools and condenses into clouds", "m": 1}, {"id": "c3", "t": "States that the water returns to the surface as precipitation such as rain, hail or snow", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-005", "topic": "Genetics · What a gene is", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines a gene?", "options": ["A compound that stores energy in all cells", "A whole chromosome containing many genes", "An inherited disease passed on to offspring", "A section of DNA that codes for a protein"], "answer": 3, "explanation_en": "A gene is a segment of DNA that encodes a protein. A chromosome is a form of DNA organisation (23 pairs in humans), and DNA is composed of nucleotides; the three are not at the same level.", "source": "Term 1 · Genetics – Revision Booklet(Topic 8 Genetics · Terminology)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-006", "topic": "Genetics · Complementary base pairing", "difficulty": "easy", "type": "mcq", "stem": "A section of DNA has the base sequence AGT TAC CTG. What is the sequence of the complementary DNA strand?", "options": ["TCA ATG GAC", "AGT TAC CTG", "UCA AUG GGC", "AGU UAC CUG"], "answer": 0, "explanation_en": "Complementary DNA base pairing is A–T and G–C, so AGT pairs with TCA, TAC with ATG and CTG with GAC. Any option containing U is an mRNA sequence, not a complementary DNA strand.", "source": "Term 1 · Genetics – 2020 Year 10 Yearly Examination Answers(Part D Q3)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-007", "topic": "Genetics · Base ratio calculations", "difficulty": "medium", "type": "mcq", "stem": "In a sample of DNA, 30% of the bases are adenine. What percentage of the bases is guanine?", "options": ["30%", "20%", "40%", "10%"], "answer": 1, "explanation_en": "Given A=T, T also makes up 30%, totaling 60% for both, and the remaining 40% is split evenly between G and C, so G makes up 20%.", "source": "Term 1 · Genetics – 2020 Year 10 Yearly Examination Answers (Part D Q4) + base-pairing rules", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-008", "topic": "Genetics · Mitosis vs meiosis", "difficulty": "medium", "type": "short", "stem": "Distinguish between mitosis and meiosis in terms of the number of daughter cells produced and the chromosome number in each daughter cell.", "options": [], "answer": "Mitosis produces two genetically identical diploid daughter cells and is used for growth and repair of body cells. Meiosis produces four genetically different haploid gametes, each with half the chromosome number of the parent cell.", "explanation_en": "Mitosis produces 2 diploid daughter cells for growth and repair, while meiosis produces 4 haploid gametes for sexual reproduction (23+23=46 to restore diploidy).", "source": "Term 1 · Genetics – Genetics.pdf(Knowledge 2 · Compare mitosis and meiosis)", "marks": 3, "criteria": [{"id": "c1", "t": "States that mitosis produces two genetically identical diploid daughter cells", "m": 1}, {"id": "c2", "t": "States that meiosis produces four genetically different haploid gametes, each with half the chromosome number of the parent cell", "m": 1}, {"id": "c3", "t": "Relates the difference to purpose: mitosis for growth and repair of body cells, meiosis for sexual reproduction", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that mitosis produces two genetically identical diploid daughter cells", "m": 1}, {"id": "c2", "t": "States that meiosis produces four genetically different haploid gametes, each with half the chromosome number of the parent cell", "m": 1}, {"id": "c3", "t": "Relates the difference to purpose: mitosis for growth and repair of body cells, meiosis for sexual reproduction", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-009", "topic": "Genetics · Frameshift mutation", "difficulty": "medium", "type": "mcq", "stem": "One extra base is inserted into the middle of a gene. Which statement best describes the likely effect on the protein produced?", "options": ["There is no effect because the genetic code is degenerate.", "The DNA double helix can no longer be replicated.", "The reading frame shifts, so every codon after that point may code for a different amino acid.", "Only the codon containing the extra base is affected; the rest of the protein is normal."], "answer": 2, "explanation_en": "Codons are read in groups of three bases, so inserting a single base shifts every codon after it (a frameshift) and usually changes the protein sequence drastically. Only inserting a multiple of three bases affects just one amino acid.", "source": "Term 1 · Genetics – Genetics.pdf(Knowledge 3 · Frameshift - Insertion)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-010", "topic": "Genetics · Mendelian ratios", "difficulty": "hard", "type": "mcq", "stem": "Two heterozygous tall pea plants (Tt) are crossed, and tall (T) is dominant over short (t). What fraction of the tall offspring is expected to be heterozygous?", "options": ["1/3", "1/2", "3/4", "2/3"], "answer": 3, "explanation_en": "For Tt × Tt the ratio is 1TT : 2Tt : 1tt, which is 3 : 1 tall to short. Because the question asks for the ratio within the tall plants (3 parts), the heterozygous Tt makes up 2/3 of them.", "source": "Term 1 · Genetics – Half Yearly Revision.pdf (Punnett squares: genotype and phenotype ratios)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-011", "topic": "Motion · Average speed", "difficulty": "easy", "type": "mcq", "stem": "A cyclist travels 300 m in 20 s. What is the cyclist's average speed?", "options": ["15 m/s", "0.067 m/s", "60 m/s", "320 m/s"], "answer": 0, "explanation_en": "The speed is v = d/t = 300 m / 20 s = 15 m/s, and 0.067 m/s is the result of inverting the formula (20/300), while 320 m/s is the sum of the two numbers.", "source": "Term 1 · Motion – Speed and Velocity Problem Solving Jan 10(v = d/t)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-012", "topic": "Motion · Scalars and vectors", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is a vector quantity?", "options": ["Time", "Displacement", "Speed", "Distance"], "answer": 1, "explanation_en": "Displacement has both magnitude and direction, and is a vector; distance, speed, and time have magnitude only, and are scalars.", "source": "Term 1 · Motion – Half Yearly Revision.pdf(Scalar vs Vector)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-013", "topic": "Motion · Acceleration formula", "difficulty": "medium", "type": "mcq", "stem": "A motorcycle travelling at 25 m/s accelerates at 7.0 m/s² for 6.0 s. What is its final speed?", "options": ["175 m/s", "42 m/s", "67 m/s", "56 m/s"], "answer": 2, "explanation_en": "The final velocity is v_f = v_i + at = 25 + 7.0 × 6.0 = 25 + 42 = 67 m/s. The 42 m/s option is only the change in velocity, from forgetting to add the initial velocity, and 175 m/s comes from 25 × 7, the wrong operation.", "source": "Term 1 · Motion – Acceleration Problems (Practice) (Question 10)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-014", "topic": "Motion · Motion graphs", "difficulty": "medium", "type": "mcq", "stem": "On a velocity–time graph, what does the gradient of the line represent?", "options": ["The net force", "The distance travelled", "The average speed", "The acceleration"], "answer": 3, "explanation_en": "The gradient of a velocity–time graph is Δv/Δt, which is acceleration, while the area under the line represents displacement — a common point of confusion (area vs gradient).", "source": "Term 1 · Motion – SG 1.1 Study Guide(velocity–time graph)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Velocity-time graph with a straight sloping line\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"144.0\" y1=\"20\" x2=\"144.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"232.0\" y1=\"20\" x2=\"232.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"320.0\" y1=\"20\" x2=\"320.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"408.0\" y1=\"20\" x2=\"408.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"496.0\" y1=\"20\" x2=\"496.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"298.0\" x2=\"496\" y2=\"298.0\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"242.4\" x2=\"496\" y2=\"242.4\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"186.8\" x2=\"496\" y2=\"186.8\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"131.2\" x2=\"496\" y2=\"131.2\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"75.6\" x2=\"496\" y2=\"75.6\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"20.0\" x2=\"496\" y2=\"20.0\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"56\" y1=\"298.0\" x2=\"496\" y2=\"298.0\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/><text x=\"144.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">2</text><text x=\"232.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">4</text><text x=\"320.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">6</text><text x=\"408.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">8</text><text x=\"496.0\" y=\"310.0\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">10</text><text x=\"49.0\" y=\"245.4\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">2</text><text x=\"49.0\" y=\"189.8\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">4</text><text x=\"49.0\" y=\"134.2\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">6</text><text x=\"49.0\" y=\"78.6\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">8</text><text x=\"49.0\" y=\"23.0\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">10</text><text x=\"496\" y=\"292.0\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">t (s)</text><text x=\"63.0\" y=\"29.0\" fill=\"var(--muted)\" font-size=\"11\" font-family=\"var(--font-mono,monospace)\" paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">v (m/s)</text><polyline points=\"56.0,270.2 254.0,172.9 452.0,75.6\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"496\" y=\"29.0\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"11\">gradient = acceleration</text></svg>", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-015", "topic": "Motion · Newton's second law", "difficulty": "hard", "type": "short", "stem": "A 1200 kg car travelling at 20 m/s brakes and comes to rest in 5.0 s. Calculate (a) its acceleration and (b) the net force acting on it.", "options": [], "answer": "a = (v_f − v_i)/t = (0 − 20)/5.0 = −4.0 m/s², so the car decelerates at 4.0 m/s². F = ma = 1200 × (−4.0) = −4800 N, that is, a net force of 4800 N opposite to the car's motion.", "explanation_en": "First use the acceleration formula — final velocity minus initial velocity, divided by time, which gives a negative value for deceleration — then substitute into F = ma. The net force is 4800 N, in the opposite direction to the motion.", "source": "Term 1 · Motion – Half Yearly Revision.pdf (DESA: average acceleration and F = ma)", "marks": 2, "criteria": [{"id": "c1", "t": "Calculates the acceleration as a = (0 − 20)/5.0 = −4.0 m/s², i.e. the car decelerates at 4.0 m/s²", "m": 1}, {"id": "c2", "t": "Calculates the net force with F = ma, giving 4800 N acting opposite to the car's motion", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Calculates the acceleration as a = (0 − 20)/5.0 = −4.0 m/s², i.e. the car decelerates at 4.0 m/s²", "m": 1}, {"id": "c2", "t": "Calculates the net force with F = ma, giving 4800 N acting opposite to the car's motion", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-016", "topic": "Chemistry · Acids and metals", "difficulty": "easy", "type": "mcq", "stem": "Magnesium is added to hydrochloric acid and a gas is produced that gives a 'pop' when a lit splint is held to it. Which gas is this?", "options": ["Hydrogen", "Oxygen", "Chlorine", "Carbon dioxide"], "answer": 0, "explanation_en": "Acid + metal gives a salt and hydrogen gas, and the hydrogen can be tested with a lit wooden splint (the pop test). Acid + carbonate gives CO₂, which is tested with limewater.", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 5 Answers(Acid-Metal Reaction)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-017", "topic": "Chemistry · Neutralisation", "difficulty": "easy", "type": "short", "stem": "Sodium hydroxide solution is added to hydrochloric acid. Name the type of reaction and write the word equation.", "options": [], "answer": "This is a neutralisation reaction. The word equation is: hydrochloric acid + sodium hydroxide → sodium chloride + water.", "explanation_en": "Acid + base → salt + water: a neutralisation reaction. The metal part of the salt comes from the base (Na⁺) and the non-metal part from the acid (Cl⁻), giving sodium chloride.", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers(Neutralisation Reaction)", "marks": 2, "criteria": [{"id": "c1", "t": "Names the reaction as a neutralisation reaction", "m": 1}, {"id": "c2", "t": "Writes the word equation: hydrochloric acid + sodium hydroxide → sodium chloride + water", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names the reaction as a neutralisation reaction", "m": 1}, {"id": "c2", "t": "Writes the word equation: hydrochloric acid + sodium hydroxide → sodium chloride + water", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-018", "topic": "Chemistry · Collision theory", "difficulty": "medium", "type": "mcq", "stem": "Using collision theory, why does raising the temperature increase the rate of a chemical reaction?", "options": ["The concentration of the reacting particles increases.", "Particles gain kinetic energy, so more collisions succeed.", "The particles get larger, so they collide more often.", "The activation energy of the reaction is lowered."], "answer": 1, "explanation_en": "The collision theory requires particles to collide with sufficient force and in the correct direction.", "source": "Term 2 · Reactive Chemistry – 2020 Year 10 Yearly Examination Answers (Part A Q7 — collision theory)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-019", "topic": "Chemistry · Acids and carbonates", "difficulty": "medium", "type": "short", "stem": "Copper carbonate is added to nitric acid. Write the word equation, name the salt formed, and describe how you would test for the gas produced.", "options": [], "answer": "copper carbonate + nitric acid → copper nitrate + water + carbon dioxide. The salt formed is copper nitrate. Bubble the gas through limewater; if the limewater turns milky (chalky white), the gas is carbon dioxide.", "explanation_en": "Acid + carbonate → salt + water + carbon dioxide; the second part of the salt's name comes from the acid (nitric acid → nitrate), so it's copper nitrate.", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers(balanced equations / acid-carbonate)", "marks": 3, "criteria": [{"id": "c1", "t": "Writes the word equation: copper carbonate + nitric acid → copper nitrate + water + carbon dioxide", "m": 1}, {"id": "c2", "t": "Names the salt formed as copper nitrate", "m": 1}, {"id": "c3", "t": "Describes testing the gas by bubbling it through limewater, which turns milky if the gas is carbon dioxide", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Writes the word equation: copper carbonate + nitric acid → copper nitrate + water + carbon dioxide", "m": 1}, {"id": "c2", "t": "Names the salt formed as copper nitrate", "m": 1}, {"id": "c3", "t": "Describes testing the gas by bubbling it through limewater, which turns milky if the gas is carbon dioxide", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-020", "topic": "Chemistry · Balancing equations", "difficulty": "hard", "type": "mcq", "stem": "Which set of coefficients correctly balances this equation: __Al + __HCl → __AlCl₃ + __H₂ ?", "options": ["3, 6, 2, 3", "2, 3, 2, 3", "2, 6, 2, 3", "1, 3, 1, 3"], "answer": 2, "explanation_en": "2Al + 6HCl → 2AlCl₃ + 3H₂: the number of atoms on the left side is Al 2, H 6, Cl 6, and on the right side is Al 2, Cl 6, H 6, making them equal.", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers(Balanced Equations part 2)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-021", "topic": "Nuclear reactions · Isotopes", "difficulty": "easy", "type": "mcq", "stem": "Carbon-12 and carbon-14 are both atoms of carbon. How do the two atoms differ?", "options": ["The number of protons", "The number of electrons in a neutral atom", "The number of electron shells", "The number of neutrons"], "answer": 3, "explanation_en": "Isotopes refer to atoms of the same element with the same number of protons but different numbers of neutrons.", "source": "Term 2 · Nuclear Reactions – atomic_models_interactive_v2.html(Isotopes)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-022", "topic": "Nuclear reactions · Stellar fusion", "difficulty": "medium", "type": "mcq", "stem": "In the core of a main sequence star such as the Sun, hydrogen nuclei are combined to form helium, releasing large amounts of energy. What is this process called?", "options": ["Nuclear fusion", "Nuclear fission of uranium", "Chemical combustion of hydrogen in oxygen", "Radioactive decay of carbon"], "answer": 0, "explanation_en": "The sun's core is about 15 million °C, where hydrogen nuclei fuse into helium nuclei, releasing enormous energy, which is the source of the sun's radiation.", "source": "Term 2 · Nuclear Reactions – The Universe 2020.pptx (Main Sequence Star) + Revision Booklet Topic 6 (definition of solar radiation)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-023", "topic": "Nuclear reactions · Radiometric dating", "difficulty": "medium", "type": "short", "stem": "Explain how scientists use radioactive carbon (carbon-14) in the remains of a once-living organism to work out when it died.", "options": [], "answer": "While an organism is alive it continuously takes in small amounts of radioactive carbon dioxide from the air. When it dies the intake stops, so the radioactive carbon slowly decays into the non-radioactive form. Measuring how much radioactive carbon is left in the remains therefore shows how long ago the organism died.", "explanation_en": "Living things constantly take in radioactive carbon; after death, the intake stops, and the remaining radioactive carbon decays at a fixed rate, allowing us to calculate the time of death.", "source": "Term 2 · Nuclear Reactions – Year 10 - Evolution.pptx(Techniques used to date fossils · Absolute dating)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that a living organism continuously takes in small amounts of radioactive carbon from the air", "m": 1}, {"id": "c2", "t": "Explains that the intake stops at death, so the radioactive carbon slowly decays into the non-radioactive form at a fixed rate", "m": 1}, {"id": "c3", "t": "Explains that measuring how much radioactive carbon is left in the remains shows how long ago the organism died", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that a living organism continuously takes in small amounts of radioactive carbon from the air", "m": 1}, {"id": "c2", "t": "Explains that the intake stops at death, so the radioactive carbon slowly decays into the non-radioactive form at a fixed rate", "m": 1}, {"id": "c3", "t": "Explains that measuring how much radioactive carbon is left in the remains shows how long ago the organism died", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-024", "topic": "Climate · Greenhouse effect", "difficulty": "easy", "type": "mcq", "stem": "Which statement correctly distinguishes the enhanced greenhouse effect from the natural greenhouse effect?", "options": ["The natural greenhouse effect stops all infrared radiation from leaving the atmosphere.", "The enhanced greenhouse effect is the additional warming caused by human activities releasing abnormally high amounts of greenhouse gases.", "The natural greenhouse effect is caused by human activity, while the enhanced effect is caused by volcanic eruptions.", "The enhanced greenhouse effect only occurs when the ozone layer is destroyed."], "answer": 1, "explanation_en": "The natural greenhouse effect is the absorption of infrared radiation by greenhouse gases in the atmosphere, keeping the Earth's temperature relatively stable.", "source": "Term 3 · Climate Science – Term 3 Earth Week 1 Answers(natural vs enhanced greenhouse effect)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-025", "topic": "Climate · Identifying greenhouse gases", "difficulty": "easy", "type": "mcq", "stem": "Which gas is a colourless, odourless, incombustible greenhouse gas formed during respiration, combustion and the breakdown of dead organic material?", "options": ["Methane", "Nitrogen", "Carbon dioxide", "Argon"], "answer": 2, "explanation_en": "The answer is carbon dioxide, as methane is combustible and nitrogen and argon are not the main greenhouse gases or products.", "source": "Term 3 · Climate Science – 2020 Year 10 Yearly Examination Answers(Part B Q2)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-026", "topic": "Climate · Mitigation and adaptation", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is an example of an adaptation strategy rather than a mitigation strategy?", "options": ["Building wind farms to generate electricity without coal", "Capturing and storing carbon dioxide from power stations", "Installing solar panels on the roofs of houses", "Painting roofs white to mimic the albedo effect"], "answer": 3, "explanation_en": "Mitigation involves reducing emissions and stabilising atmospheric greenhouse gas concentrations, while adaptation involves reducing social vulnerability to the impacts that are already happening.", "source": "Term 3 · Climate Science – Revision Booklet(Topic 6 · Mitigation / Adaptation strategies)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-027", "topic": "Climate · Ocean acidification", "difficulty": "hard", "type": "mcq", "stem": "Extra carbon dioxide dissolves in seawater and forms carbonic acid, which releases hydrogen ions. Why does this harm shellfish?", "options": ["The hydrogen ions compete with the shells for carbonate ions, so shellfish cannot build their shells.", "The hydrogen ions dissolve the calcium carbonate shells by raising the pH of the water.", "The extra carbon dioxide warms the water so the shellfish cannot respire.", "The carbonic acid removes calcium from the water so shellfish absorb more carbonate."], "answer": 0, "explanation_en": "An excess of H⁺ ions will combine with carbonate ions to form bicarbonate, competing with shell formation for carbonate ions, making it harder for shells to form.", "source": "Term 3 · Climate Science – Term 3 Earth Week 2 Answers(Ocean Acidification)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-028", "topic": "Climate · Permafrost feedback", "difficulty": "hard", "type": "short", "stem": "Large areas of Arctic permafrost are thawing. Explain why this is described as a positive feedback that makes global warming worse.", "options": [], "answer": "Frozen soils store large amounts of organic carbon and methane. When the permafrost thaws, microbes break this material down and release carbon dioxide and methane, which are both greenhouse gases. These extra gases trap more heat, which thaws even more permafrost, so the warming reinforces itself.", "explanation_en": "The chain reaction is: permafrost thawing → microbial decomposition → release of CO₂ and methane → enhanced greenhouse effect → warming → more permafrost thawing, creating a positive feedback loop.", "source": "Term 3 · Climate Science – SCNSW10CH00393.pdf (Global systems · permafrost) + Revision Booklet (permafrost methane)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that frozen permafrost soils store large amounts of organic carbon and methane", "m": 1}, {"id": "c2", "t": "Explains that when the permafrost thaws, microbes break this material down and release carbon dioxide and methane, which are greenhouse gases", "m": 1}, {"id": "c3", "t": "Explains the loop: the extra gases trap more heat, which thaws even more permafrost, so the warming reinforces itself", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that frozen permafrost soils store large amounts of organic carbon and methane", "m": 1}, {"id": "c2", "t": "Explains that when the permafrost thaws, microbes break this material down and release carbon dioxide and methane, which are greenhouse gases", "m": 1}, {"id": "c3", "t": "Explains the loop: the extra gases trap more heat, which thaws even more permafrost, so the warming reinforces itself", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-029", "topic": "Organic chemistry · Naming carbon chains", "difficulty": "easy", "type": "mcq", "stem": "Which name is correct for a straight-chain alkane containing six carbon atoms?", "options": ["Hexene", "Hexane", "Pentane", "Heptane"], "answer": 1, "explanation_en": "The prefix hex- indicates 6 carbon atoms, and the suffix -ane indicates an alkane, so it's hexane.", "source": "Term 3 · Organic Chemistry – KATZ - WEEK 3 LESSONS(Lesson 3 Naming Organic Compounds)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-030", "topic": "Organic chemistry · Homologous series formulas", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is the general formula of the alkanes?", "options": ["CnH2n+1OH", "CnH2n−2", "CnH2n+2", "CnH2n"], "answer": 2, "explanation_en": "The general formula for alkanes is CnH2n+2 (e.g. C5H12 when n=5), while alkenes are CnH2n and alkynes are CnH2n−2, with the last being alcohol classes (containing the -OH functional group).", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet(Part C Q6)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-031", "topic": "Organic chemistry · Fractional distillation", "difficulty": "medium", "type": "short", "stem": "Explain how fractional distillation separates crude oil into fractions, and why the smaller molecules are collected near the top of the column.", "options": [], "answer": "Crude oil is heated so that most of it vaporises, and the vapours rise up the fractionating column, which is hot at the bottom and cooler at the top. Each fraction condenses at the level where the temperature falls below its boiling point. Smaller molecules have lower boiling points, so they rise further and are collected near the top.", "explanation_en": "Distillation uses the difference in boiling points. The temperature inside the tower falls from bottom to top, so each component condenses at the height where the temperature drops below its boiling point. Smaller molecules have lower boiling points, rise higher and are drawn off near the top (LPG, gasoline), while larger molecules stay at the bottom (asphalt).", "source": "Term 3 · Organic Chemistry – KATZ - WEEK 3 LESSONS(Lesson 2 Fractional Distillation)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that crude oil is heated so most of it vaporises and the vapours rise up the column, which is hot at the bottom and cooler at the top", "m": 1}, {"id": "c2", "t": "Explains that each fraction condenses at the level where the temperature falls below its boiling point", "m": 1}, {"id": "c3", "t": "Explains that smaller molecules have lower boiling points, so they rise further up the column", "m": 1}, {"id": "c4", "t": "Concludes that the smaller molecules are therefore collected near the top of the column", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that crude oil is heated so most of it vaporises and the vapours rise up the column, which is hot at the bottom and cooler at the top", "m": 1}, {"id": "c2", "t": "Explains that each fraction condenses at the level where the temperature falls below its boiling point", "m": 1}, {"id": "c3", "t": "Explains that smaller molecules have lower boiling points, so they rise further up the column", "m": 1}, {"id": "c4", "t": "Concludes that the smaller molecules are therefore collected near the top of the column", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-032", "topic": "Organic chemistry · Naming branches", "difficulty": "hard", "type": "mcq", "stem": "What is the correct IUPAC name of the compound CH₃–CH(CH₃)–CH₂–CH₃?", "options": ["3-methylpentane", "2-methylpropane", "3-methylbutane", "2-methylbutane"], "answer": 3, "explanation_en": "The longest carbon chain has 4 carbon atoms (butane), with a methyl branch attached to the 2nd carbon; numbering must start from the end closest to the branch to get the smallest possible position number, so it's 2-methylbutane, and 3-methylbutane is an incorrect name for the same molecule numbered from the other end.", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet(Part G Q12)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "sciother-033", "topic": "Organic chemistry · Determining molecular formula", "difficulty": "hard", "type": "mcq", "stem": "A hydrocarbon has the molecular formula C₅H₁₀. Could it be an alkane?", "options": ["No, because alkanes follow CnH2n+2, which for five carbons is C₅H₁₂ and not C₅H₁₀.", "Yes, because any compound with five carbon atoms always has ten hydrogen atoms.", "No, because it does not contain enough hydrogen to be a hydrocarbon at all.", "Yes, because it contains only carbon and hydrogen."], "answer": 0, "explanation_en": "Substituting n=5 into the alkane formula CnH2n+2 gives C5H12; C5H10 has two fewer hydrogens, matching CnH2n, which is an alkene (or cycloalkane), and can't be a straight-chain alkane.", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet(Part N Q32)", "weak": false, "subj": "sciother", "subjZh": "Science · Non-exam content (Terms 1–3)"}, {"id": "matp-001", "topic": "Finance · Overtime pay", "difficulty": "easy", "type": "mcq", "stem": "Tomas earns $28 per hour for the first 38 hours he works each week. Any hours beyond 38 are paid at time-and-a-half. Last week he worked 45 hours. What was his total pay for the week?", "options": ["$1,358", "$1,890", "$1,260", "$1,456"], "answer": 0, "explanation_en": "For the first 38 hours, 38×$28=$1,064, and for the 7 overtime hours (45−38=7), the pay is $42 per hour, so 7×$42=$294, for a total of $1,358; common mistakes include calculating the total as $1,260 using only the basic hourly rate for 45 hours, or $1,456 using double the hourly rate for overtime.", "source": "Topic1 Interest and Depreciation.pdf · 1-01 Earning an income", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-002", "topic": "Finance · Compound interest (monthly)", "difficulty": "medium", "type": "mcq", "stem": "Sophie deposits $1,200 into a savings account that earns 5% per annum, compounded monthly. How much will she have in the account after 3 years?", "options": ["$1,389.15", "$1,393.77", "$1,380.00", "$1,458.61"], "answer": 1, "explanation_en": "For monthly compounding, convert both the interest rate and the number of periods to months: R=0.05/12, n=3×12=36, A=1200(1+0.05/12)^36≈$1,393.77; using simple interest gives $1,380, and using 5% as the annual interest rate with only 3 compounding periods gives $1,389.15, both of which are common mistakes.", "source": "1-04_ Compound Interest.pdf · A = P(1 + R)^n (R is the rate per period)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-003", "topic": "Finance · Declining-balance depreciation", "difficulty": "medium", "type": "short", "stem": "A delivery van is bought for $42,000. It depreciates at 15% per annum using the reducing-balance formula A = P(1 − R)^n. Find (a) its value after 4 years, correct to the nearest dollar, and (b) the total amount it has depreciated over those 4 years.", "options": [], "answer": "(a) A = 42,000 × (1 − 0.15)^4 = 42,000 × 0.85^4 = $21,924. (b) Depreciation = 42,000 − 21,924 = $20,076.", "explanation_en": "The reducing balance depreciation is multiplied by 0.85 each year for 4 years, not 42,000×(1−0.15×4); using the straight-line method (reducing by a fixed $6,300 each year) gives $16,800, which is another model.", "source": "1-07_ Depreciation.pdf · A = P(1 − R)^n(reducing balance)", "marks": 3, "criteria": [{"id": "c1", "t": "Substitutes correctly into A = P(1 − R)^n: A = 42,000 × (1 − 0.15)^4 (accept 42,000 × 0.85^4)", "m": 1}, {"id": "c2", "t": "Calculates the value after 4 years as $21,924 (correct to the nearest dollar)", "m": 1}, {"id": "c3", "t": "Calculates the total depreciation as 42,000 − 21,924 = $20,076", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Substitutes correctly into A = P(1 − R)^n: A = 42,000 × (1 − 0.15)^4 (accept 42,000 × 0.85^4)", "m": 1}, {"id": "c2", "t": "Calculates the value after 4 years as $21,924 (correct to the nearest dollar)", "m": 1}, {"id": "c3", "t": "Calculates the total depreciation as 42,000 − 21,924 = $20,076", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-004", "topic": "Algebra · Index laws", "difficulty": "easy", "type": "mcq", "stem": "Simplify (3a⁴)².", "options": ["6a⁶", "9a⁶", "9a⁸", "6a⁸"], "answer": 2, "explanation_en": "Each term inside the brackets is squared: 3² = 9, and the indices multiply, 4×2 = 8, so the answer is 9a⁸. The two most common mistakes are writing the coefficient 3 as 6, or working out 4×2 as 6.", "source": "Algebra Topic test + Solutions.pdf · Part A Q12 · 4-01_ Index Laws", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-005", "topic": "Algebra · Multiplying terms", "difficulty": "easy", "type": "mcq", "stem": "Simplify 2m × 5m p × 3n.", "options": ["30m np", "30m³np", "10m²np", "30m²np"], "answer": 3, "explanation_en": "The coefficient is 2×5×3 = 30; m×m = m² because the indices are added, and p and n each appear once, giving 30m²np. Treating m×m as 2m gives 10m²np, and treating it as m³ gives the wrong index.", "source": "Topic2 Algebra.pdf · 4-01 The index laws", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-006", "topic": "Algebra · Simplifying algebraic fractions", "difficulty": "medium", "type": "mcq", "stem": "Simplify (6x²y) ÷ (9xy³).", "options": ["2x / (3y²)", "2x / (3y³)", "2y² / (3x)", "3x / (2y²)"], "answer": 0, "explanation_en": "The coefficient simplifies to 6/9 = 2/3; when dividing like bases you subtract the indices, so x²÷x = x and y÷y³ = 1/y². The answer is 2x/(3y²). Common mistakes include writing the index of y as 3, or forgetting to simplify the coefficient.", "source": "4-03_ Multiplying and dividing algebraic fractions.pdf", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-007", "topic": "Algebra · Binomial expansion", "difficulty": "medium", "type": "mcq", "stem": "Expand and simplify (2x − 5)(3x + 7).", "options": ["6x² + 21x − 35", "6x² − x − 35", "6x² + x − 35", "6x² − 29x − 35"], "answer": 1, "explanation_en": "Multiplying each term gives 6x² + 14x − 15x − 35 = 6x² − x − 35. The middle terms 14x − 15x = −x; if −15x is written as +15x, it results in errors like 6x² + 29x.", "source": "4-05_ Expanding Binomial Products.pdf · Algebra Topic test + Solutions.pdf Q24c", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-008", "topic": "Algebra · Perfect squares", "difficulty": "medium", "type": "mcq", "stem": "If (7g + 3)² = 49g² + hg + 9, what is the value of h?", "options": ["84", "14", "42", "21"], "answer": 2, "explanation_en": "The middle term of the perfect square is 2×7g×3 = 42g, so h = 42. The most common mistake is calculating only 7×3 = 21, missing the 2 in the formula.", "source": "Algebra Topic test + Solutions.pdf · Part A Q14(perfect squares)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-009", "topic": "Algebra · Factorising", "difficulty": "medium", "type": "short", "stem": "Factorise each expression fully. (a) 12a²b − 21ab²  (b) x² + 7x + 10", "options": [], "answer": "(a) 3ab(4a − 7b)   (b) (x + 5)(x + 2)", "explanation_en": "(a) Take the greatest common factor: the HCF of 12 and 21 is 3, and the common factor of the variables a and b is ab, resulting in 3ab; inside the brackets, 3ab×4a=12a²b and 3ab×(−7b)=−21ab². (b) Find two numbers with a sum of 7 and a product of 10, which are 5 and 2.", "source": "4-06 Factorising monic quadratics.pdf · 2025 BBHS 10 (5.2) T2 Q14", "marks": 2, "criteria": [{"id": "c1", "t": "Factorises 12a²b − 21ab² as 3ab(4a − 7b), taking the highest common factor 3ab", "m": 1}, {"id": "c2", "t": "Factorises x² + 7x + 10 as (x + 5)(x + 2)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Factorises 12a²b − 21ab² as 3ab(4a − 7b), taking the highest common factor 3ab", "m": 1}, {"id": "c2", "t": "Factorises x² + 7x + 10 as (x + 5)(x + 2)", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-010", "topic": "Equations · Linear with unknowns both sides", "difficulty": "easy", "type": "mcq", "stem": "Solve 9x + 10 = 7x − 6.", "options": ["x = 8", "x = 2", "x = −2", "x = −8"], "answer": 3, "explanation_en": "Subtracting 7x and 10 from both sides gives 2x = −16, so x = −8. Common mistakes include forgetting to change the sign when moving the 10 (getting −2) or calculating −16 ÷ 2 as +8.", "source": "Topic 2 Equations and Inequality.pdf · 6-01 Equations(Example 1c)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-011", "topic": "Inequalities · Sign flip when dividing", "difficulty": "hard", "type": "mcq", "stem": "Solve the inequality −3(x − 2) ≥ 15.", "options": ["x ≤ −3", "x ≤ 3", "x ≥ 3", "x ≥ −3"], "answer": 0, "explanation_en": "Expanding gives −3x + 6 ≥ 15, which simplifies to −3x ≥ 9; when dividing both sides by −3, the inequality sign must be reversed, resulting in x ≤ −3. This can be verified by substituting x = −4: −3(−6)=18 ≥ 15, which holds true.", "source": "Topic 2 Equations and Inequality.pdf · 6-07 Solving inequalities (reverse the sign when dividing by a negative)", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-012", "topic": "Equations · Equations with fractions", "difficulty": "medium", "type": "short", "stem": "Solve x/3 − (x − 2)/4 = 2.", "options": [], "answer": "Multiply every term by 12: 4x − 3(x − 2) = 24, so 4x − 3x + 6 = 24 and x = 18.", "explanation_en": "The least common multiple of 3 and 4 is 12. The negative sign before the second term must be multiplied into the brackets, becoming +6; writing it as −6 results in x = 30, which is a common mistake.", "source": "Topic 2 Equations and Inequality.pdf · 6-02 Equations with algebraic fractions", "marks": 2, "criteria": [{"id": "c1", "t": "Multiplies every term by the common denominator 12 and expands correctly: 4x − 3(x − 2) = 24, giving 4x − 3x + 6 = 24", "m": 1}, {"id": "c2", "t": "Solves the resulting equation to x = 18", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Multiplies every term by the common denominator 12 and expands correctly: 4x − 3(x − 2) = 24, giving 4x − 3x + 6 = 24", "m": 1}, {"id": "c2", "t": "Solves the resulting equation to x = 18", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-013", "topic": "Simultaneous equations · Elimination", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations 5x + 2y = 19 and 3x − 2y = 5.", "options": ["x = 3, y = −2", "x = 3, y = 2", "x = 2, y = 3", "x = 4, y = −0.5"], "answer": 1, "explanation_en": "Adding the two equations eliminates y: 8x = 24, x = 3; substituting back into the first equation gives 2y = 19 − 15 = 4, y = 2. The distractor (4, −0.5) only satisfies the first equation and can be eliminated by substituting into the second.", "source": "Topic 2 Simultaneous Equations.pdf · 9-02 The elimination method", "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-014", "topic": "Simultaneous equations · Modelling", "difficulty": "hard", "type": "short", "stem": "At the school canteen, 3 sandwiches and 2 drinks cost $19.50, while 2 sandwiches and 3 drinks cost $18.00. Find the cost of one sandwich and one drink.", "options": [], "answer": "Solve 3s + 2d = 19.50 and 2s + 3d = 18.00 simultaneously: 5s = 22.50, so s = $4.50 and d = $3.00.", "explanation_en": "List the two equations and then eliminate one variable (multiplying the first equation by 3 and the second by 2 gives 5s = 22.50). Substituting back to check gives 3×4.50+2×3 = $19.50, which is correct.", "source": "Topic 2 Simultaneous Equations.pdf · 9-04 Simultaneous equations problems", "marks": 3, "criteria": [{"id": "c1", "t": "Sets up the two equations 3s + 2d = 19.50 and 2s + 3d = 18.00", "m": 1}, {"id": "c2", "t": "Eliminates one variable and finds s = $4.50 (e.g. 5s = 22.50)", "m": 1}, {"id": "c3", "t": "Finds d = $3.00 and states both prices", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Sets up the two equations 3s + 2d = 19.50 and 2s + 3d = 18.00", "m": 1}, {"id": "c2", "t": "Eliminates one variable and finds s = $4.50 (e.g. 5s = 22.50)", "m": 1}, {"id": "c3", "t": "Finds d = $3.00 and states both prices", "m": 1}], "weak": false, "subj": "matp", "subjZh": "Year 10 Mathematics (Standard)"}, {"id": "matp-015", "topic": "Coordinate geometry · Distance", "difficulty": "easy", "type": "mcq", "stem": "Find the distance between the points (2, −1) and (5, 3).", "options": ["7", "√7", "5", "25"], "answer": 2, "explanation_en": "d = √[(5−2)² + (3−(−1))²] = √(9+16) = √25 = 5. Forgetting to take the square root results in 25, and adding the differences directly gives 7.", "source": "Topic 1 Coordinate Geometry.pdf · 2-01 Length, midpoint and gradient of an interval", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Points (2, minus 1) and (5, 3)\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"56.0\" y1=\"20\" x2=\"56.0\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"118.9\" y1=\"20\" x2=\"118.9\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"181.7\" y1=\"20\" x2=\"181.7\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"244.6\" y1=\"20\" x2=\"244.6\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"307.4\" y1=\"20\" x2=\"307.4\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"370.3\" y1=\"20\" x2=\"370.3\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"433.1\" y1=\"20\" x2=\"433.1\" y2=\"298\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\".55\"/><line x1=\"49
