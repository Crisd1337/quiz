opic": "原住民视角 · 淡水溪流案例", "difficulty": "hard", "type": "mcq", "stem": "The Freshwater Creek case study compares an Indigenous significant site with the effects of Western urbanisation. Which statement BEST describes the difference?", "options": ["Indigenous management had little effect because the local clans did not use the wetlands", "Both approaches treated the wetlands mainly as a drinking water source", "Indigenous use kept the wetlands alive; urbanisation drained and piped them away", "Indigenous management drained the wetlands, while urbanisation restored them as parkland"], "answer": 2, "explanation": "案例对比的是：对 Gayamaygal 与 Garigal 族群而言，这里是饮用水、捕鱼与扎营的重要场所，具有极高精神价值；而城市化把它排干、填平，最后变成混凝土雨水暗渠，如今只以“海边排水口”的形式存在。", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land · Freshwater Creek Case Study", "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-012", "topic": "生态系统 · 生物与非生物互动", "difficulty": "medium", "type": "short", "stem": "Explain how biotic and abiotic factors interact within an ecosystem. Use TWO examples in your response.", "options": [], "answer": "Biotic and abiotic factors interact to keep ecosystems healthy. Plants depend on abiotic factors such as sunlight, water and soil to grow, while animals depend on those plants for food and shelter. If an abiotic factor changes — for example rainfall falling during a drought — plant growth declines, which then reduces food for herbivores and, in turn, for predators further up the food chain.", "explanation": "要写出“非生物→生物→食物链下游”的因果链。例一可用植物依赖阳光水土；例二可用干旱导致植物减少、草食动物再受影响。只列因素不写互动关系拿不到分。", "source": "Study Guide · Lesson 2 · Response Guide（4 分题 PEEL 范例）", "points": [{"t": "Biotic and abiotic factors interact to keep ecosystems healthy", "m": 1}, {"t": "Plants depend on abiotic factors such as sunlight, water and soil to grow, while animals depend on those plants for food and shelter", "m": 1}, {"t": "If an abiotic factor changes — for example rainfall falling during a drought — plant growth declines, which then reduces food for herbivores and, in turn, for predators further up the food chain", "m": 1}], "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-013", "topic": "人类影响 · 短期与长期对比", "difficulty": "medium", "type": "short", "stem": "Explain the difference between short-term and long-term human impacts on ecosystems, and give one example of each.", "options": [], "answer": "Short-term impacts occur immediately, while long-term impacts develop gradually over time. Littering a natural area is a short-term impact because it pollutes waterways and harms wildlife straight away. Climate change is a long-term impact because it slowly raises temperatures and reduces biodiversity over many years, and it is much harder to reverse.", "explanation": "区别要落在“立即发生 vs 逐渐累积”和“是否容易逆转”。各举一例，再点出长期影响更难修复（栖息地可能永久破坏、食物链被打断）。", "source": "Study Guide · Lesson 3 · Response Guide（4 分题 PEEL 范例）", "points": [{"t": "Short-term impacts occur immediately, while long-term impacts develop gradually over time", "m": 1}, {"t": "Littering a natural area is a short-term impact because it pollutes waterways and harms wildlife straight away", "m": 1}, {"t": "Climate change is a long-term impact because it slowly raises temperatures and reduces biodiversity over many years, and it is much harder to reverse", "m": 1}], "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-014", "topic": "Leave No Trace · 原则的作用", "difficulty": "hard", "type": "short", "stem": "Explain why Leave No Trace principles are important in protecting outdoor environments. Refer to at least TWO principles in your response.", "options": [], "answer": "Leave No Trace principles reduce the human impact of recreation so that natural areas stay healthy and can be enjoyed by future visitors. Disposing of waste properly reduces pollution and stops wildlife being harmed or attracted to human food. Travelling and camping on durable surfaces protects vegetation and reduces soil erosion caused by foot traffic. Respecting wildlife also matters, because feeding animals changes their behaviour, makes them dependent on humans and disrupts ecosystem balance.", "explanation": "材料要求至少点到两项原则并解释“如何保护生态系统”。可用的组合：妥善处理垃圾、走耐用地表、尊重野生动物、减少营火影响、提前计划与准备。只背原则名称不解释作用会失分。", "source": "Study Guide · Lesson 5 Leave No Trace + Response Guide / Practice Questions（5 分题）", "points": [{"t": "Leave No Trace principles reduce the human impact of recreation so that natural areas stay healthy and can be enjoyed by future visitors", "m": 1}, {"t": "Disposing of waste properly reduces pollution and stops wildlife being harmed or attracted to human food", "m": 1}, {"t": "Travelling and camping on durable surfaces protects vegetation and reduces soil erosion caused by foot traffic", "m": 1}, {"t": "Respecting wildlife also matters, because feeding animals changes their behaviour, makes them dependent on humans and disrupts ecosystem balance", "m": 1}], "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "out-015", "topic": "原住民视角 · 照护 Country 的评价", "difficulty": "hard", "type": "short", "stem": "Evaluate how Aboriginal and Torres Strait Islander peoples' approaches to caring for Country contribute to the protection of ecosystems AND communities.", "options": [], "answer": "Caring for Country supports ecosystems through practices such as cultural burning, which uses small, low-intensity controlled fires to reduce fuel loads, lower the risk of large bushfires, encourage plant regrowth and support biodiversity, and through seasonal resource use that takes only what is needed. These practices also support communities: healthy Country provides clean water, habitats and food, while continued connection to Country strengthens cultural identity and community wellbeing. Overall, this long-term custodial approach is more sustainable than treating land purely as a resource, although neither perspective is entirely right or wrong.", "explanation": "评价题要有“生态＋社区”两面，再加总体判断。要点：文化燃烧降低可燃物、促进再生；季节性取用体现可持续；健康的环境反过来提供水、食物与栖息地，并强化文化身份。最后要给出评价性结论（long-term care 更可持续）。", "source": "Study Guide · Lesson 6 · Response Guide + Practice Questions（10 分题）", "points": [{"t": "Caring for Country supports ecosystems through practices such as cultural burning, which uses small, low-intensity controlled fires to reduce fuel loads, lower the risk of large bushfires, encourage plant regrowth and support biodiversity, and through seasonal resource use that takes only what is needed", "m": 1}, {"t": "These practices also support communities: healthy Country provides clean water, habitats and food, while continued connection to Country strengthens cultural identity and community wellbeing", "m": 1}, {"t": "Overall, this long-term custodial approach is more sustainable than treating land purely as a resource, although neither perspective is entirely right or wrong", "m": 1}], "weak": false, "subj": "out", "subjZh": "户外教育（环境意识单元）"}, {"id": "ftn-001", "topic": "食品安全 · 危险温区", "difficulty": "easy", "type": "mcq", "stem": "What is the temperature range of the food safety 'danger zone'?", "options": ["5°C to 60°C", "0°C to 5°C", "60°C to 100°C", "-18°C to 4°C"], "answer": 0, "explanation": "危险温区是 5°C–60°C，这个区间里有害细菌繁殖最快。0°C 以下只是抑制生长，并不等于杀菌。", "source": "Structured Responses (Sample Answers).pdf — The Danger Zone", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-002", "topic": "食品安全 · 2 小时/4 小时规则", "difficulty": "easy", "type": "mcq", "stem": "Under the 2-hour / 4-hour rule, what must happen to potentially hazardous food that has been in the danger zone for more than 4 hours?", "options": ["It can be returned to the fridge and used again the next day", "It must be thrown away because bacteria levels are too high", "It can be frozen and kept for up to one week", "It can be reheated to 100°C and then served"], "answer": 1, "explanation": "超过 4 小时细菌数量已高到可能引发食物中毒，必须丢弃，不能靠回锅或冷冻补救。很多同学会误以为重新加热就安全。", "source": "Structured Responses (Sample Answers).pdf — The 2-Hour / 4-Hour Rule", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-003", "topic": "食品安全 · 2 小时/4 小时规则", "difficulty": "medium", "type": "mcq", "stem": "A tray of cooked chicken has been sitting at room temperature for 3 hours. Under the 2-hour / 4-hour rule, which action is correct?", "options": ["Reheat it, then freeze it for the following week", "Return it to the fridge and use it later", "Eat it now, but do not return it to the fridge", "Throw the chicken away immediately"], "answer": 2, "explanation": "超过 2 小时、不足 4 小时的食物仍可食用，但不能放回冰箱（否则只是把细菌一起冷藏）。只有 2 小时以内的食物才能冷藏。", "source": "Structured Responses (Sample Answers).pdf — The 2-Hour / 4-Hour Rule", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-004", "topic": "食品安全 · 冷藏温度", "difficulty": "easy", "type": "mcq", "stem": "To keep perishable food out of the danger zone, foods such as ham and salami should be stored at:", "options": ["8°C or below", "About 22°C", "About 60°C", "4°C or below"], "answer": 3, "explanation": "冷藏需控制在 4°C 或以下，才能让细菌繁殖速度降到很低。8°C、22°C 都高于安全冷藏温度，挡不住细菌增殖。", "source": "Structured Responses (Sample Answers).pdf — The Danger Zone（Industry Example）", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-005", "topic": "厨房运作 · Mise en place", "difficulty": "easy", "type": "mcq", "stem": "In a commercial kitchen, 'mise en place' refers to:", "options": ["Preparing ingredients and equipment before cooking", "Cleaning down kitchen benches at the end of service", "Plating the finished dish neatly for service", "Ordering stock and checking supplier deliveries"], "answer": 0, "explanation": "mise en place 是「备料到位」，包括切好洋葱、量好调料、预热烤箱等。缺了这一步会直接造成 poor workflow。", "source": "Term 1 · Assumed Knowledge Quiz 6: Mise en place；Structured Responses (Sample Answers).pdf — Poor Workflow", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-006", "topic": "食物公平 · 定义", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines food inequity?", "options": ["People choose not to eat certain foods for religious reasons", "Some groups have limited access to affordable, safe food while others do not", "Restaurants charge different prices for the same meal", "Everyone in a country has equal access to safe, nutritious food"], "answer": 1, "explanation": "food inequity 强调「可获得性不平等」，是有的人吃不到足量、安全、有营养的食物。不要和宗教饮食禁忌或个人选择混为一谈。", "source": "Term 1 · Food Inequity Assignment (Part 1 – Define)", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-007", "topic": "食物公平 · 受影响人群", "difficulty": "easy", "type": "mcq", "stem": "According to the Term 1 unit, which group is identified as likely to experience food inequity in developed and developing countries?", "options": ["Professional athletes on high incomes", "Full-time university students living on campus", "People on low incomes or who are unemployed", "Food critics who review restaurants"], "answer": 2, "explanation": "低收入或失业人群是课程列出的典型群体。同类的还有偏远地区居民、女性与儿童、老年人、慢性病患者、残障人士、原住民与无家可归者。", "source": "Term 1 · Food Inequity Assignment（Introduction 受影响人群列表）", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-008", "topic": "食物公平 · 慈善机构", "difficulty": "medium", "type": "mcq", "stem": "Which Australian organisation was listed in the Term 1 assignment as a charity that rescues surplus food and redistributes it to people experiencing food insecurity?", "options": ["Woolworths", "Fair Work Australia", "MasterChef Australia", "OzHarvest"], "answer": 3, "explanation": "OzHarvest 是澳洲典型的食物救援慈善机构，把商家剩余的食材收集后分发给有需要的人。Woolworths 是超市企业，Fair Work 是职场监管机构，都不是慈善机构。", "source": "Term 1 · Food Inequity Assignment (Part 1 – charity list)（机构职能为课程标准知识补充）", "weak": true, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-009", "topic": "食物趋势 · Snackification", "difficulty": "easy", "type": "mcq", "stem": "The food trend known as 'snackification' refers to:", "options": ["Replacing main meals with more frequent, smaller snacks", "Selling snacks only through supermarkets", "Eating only two large meals a day and no snacks in between", "Removing all snacks from your daily diet"], "answer": 0, "explanation": "snackification 指「正餐零食化」，人们用更多小份量、便携的进食场合取代传统三餐。它和「少吃零食」正好相反。", "source": "Term 2 · Food Trends: Quiz 4 Snackification and other Food Trends", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-010", "topic": "食物趋势 · 丑果蔬", "difficulty": "medium", "type": "mcq", "stem": "Supermarkets selling 'ugly' fruit and vegetables is a trend that mainly aims to:", "options": ["Charge a higher price for imperfect-looking produce", "Reduce food waste by selling produce rejected as ugly", "Replace fresh produce with canned produce", "Encourage farmers to grow fewer vegetables"], "answer": 1, "explanation": "这类趋势针对的是「长相不合格但完全可食用」的蔬果，目的是减少农场端和零售端的食物浪费。核心卖点是减废，而不是涨价。", "source": "Term 2 · Food Trends: Quiz 3 Veggies and Fruit too ugly for the supermarkets", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-011", "topic": "食物趋势 · 明星厨师", "difficulty": "medium", "type": "mcq", "stem": "How do celebrity chefs most directly influence food trends?", "options": ["By writing the national dietary guidelines used in all schools", "By inspecting restaurants for food safety compliance", "By popularising ingredients and dishes through media exposure", "By setting the official price of restaurant meals"], "answer": 2, "explanation": "明星厨师通过电视节目、社交媒体和食谱把某些食材或做法带火，形成流行趋势。他们并不制定价格、膳食指南或做卫生检查。", "source": "Term 2 · Food Trends: Quiz 2 Celebrity Chef", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-012", "topic": "特定需求 · 乳糜泻", "difficulty": "easy", "type": "mcq", "stem": "A person with coeliac disease must avoid:", "options": ["All nuts, seeds and peanut products", "All dairy products, such as milk", "All foods containing added sugar", "Gluten, found in wheat, barley and rye"], "answer": 3, "explanation": "乳糜泻是对麸质（gluten）的自身免疫反应，必须终身严格无麸质饮食。它属于免疫反应，不是普通「面粉过敏」。", "source": "Term 3 · Food for Specific Needs: Quiz 6 Coeliac Disease", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-013", "topic": "特定需求 · 血糖生成指数", "difficulty": "medium", "type": "mcq", "stem": "A food with a low glycaemic index (GI) is best described as one that:", "options": ["Is digested slowly and raises blood glucose gradually", "Contains no carbohydrate or sugar at all", "Must be avoided by everyone with diabetes at all times", "Raises blood glucose quickly and sharply"], "answer": 0, "explanation": "低 GI 食物消化吸收慢，血糖上升平缓，饱腹感也更持久。高 GI 才是快速冲高血糖。低 GI 不等于零碳水，也不是所有糖尿病患者都要完全回避。", "source": "Term 3 · Food for Specific Needs: Quiz 5 The Glycaemic Index", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-014", "topic": "特定需求 · 过敏与不耐受", "difficulty": "medium", "type": "mcq", "stem": "Which statement correctly distinguishes a food allergy from a food intolerance?", "options": ["An allergy can be removed by cooking the food thoroughly", "An allergy involves the immune system, while an intolerance does not", "An intolerance is always more dangerous than an allergy", "They are two names for exactly the same reaction"], "answer": 1, "explanation": "食物过敏由免疫系统介导，可能引发呼吸困难等严重反应；不耐受多是消化酶不足，症状以肠胃不适为主。两者机制不同，不能互换使用。", "source": "Term 3 · Food for Specific Needs: Quiz 8 Allergies and Intolerances", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-015", "topic": "特定需求 · 骨质疏松", "difficulty": "easy", "type": "mcq", "stem": "Which two nutrients are most important for reducing the risk of osteoporosis?", "options": ["Protein and vitamin B12", "Iron and vitamin C", "Calcium and vitamin D", "Sodium and potassium"], "answer": 2, "explanation": "钙是骨骼的主要矿物质，维生素 D 帮助钙吸收，两者缺一都会增加骨质疏松风险。只补钙不补维生素 D 吸收效率会打折扣。", "source": "Term 3 · Food for Specific Needs: Quiz 11 Osteoporosis", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-016", "topic": "特定需求 · 缺铁性贫血", "difficulty": "medium", "type": "mcq", "stem": "Iron-deficiency anaemia is best managed by including more of which foods in the diet?", "options": ["Refined white flour products such as white bread", "Foods high in calcium, such as milk and cheese", "Foods high in vitamin C only, such as citrus fruit and juice", "Iron-rich foods such as red meat, legumes and leafy greens"], "answer": 3, "explanation": "缺铁性贫血的饮食重点是补铁，红肉、豆类和深绿叶菜都是常见来源。维生素 C 能促进铁吸收，但它本身不是铁的来源。", "source": "Term 3 · Food for Specific Needs: Quiz 8A Anaemia", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-017", "topic": "特殊场合 · 农历新年", "difficulty": "easy", "type": "mcq", "stem": "In Chinese New Year celebrations, long noodles are served because they symbolise:", "options": ["Longevity and a long life", "The end of the harvest season", "Good luck in school examinations", "Wealth in the form of gold coins"], "answer": 0, "explanation": "长寿面象征长寿，讲究不断开、不剪断。金元宝形状的饺子才和财富相关，两样不要混。", "source": "Term 4 · Food for Special Occasions: Quiz 2 Chinese New Year", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-018", "topic": "特殊场合 · 亡灵节", "difficulty": "medium", "type": "mcq", "stem": "Día de los Muertos (Day of the Dead) is a celebration in which families:", "options": ["Fast for three days to mourn deceased relatives at home", "Build ofrendas with food to honour deceased relatives", "Give children cakes with a hidden coin inside", "Throw a decorated birthday cake into the sea"], "answer": 1, "explanation": "亡灵节是墨西哥 11 月初的纪念活动，家人搭建 ofrenda 祭坛，摆放逝者生前喜爱的食物与物品。它的基调是纪念与团聚，不是哀悼性禁食。", "source": "Term 4 · Food for Special Occasions: Quiz 3 Día de los muertos", "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-019", "topic": "厨房运作 · Poor workflow", "difficulty": "hard", "type": "short", "stem": "Discuss how poor workflow can impact a chef working in a commercial kitchen. In your answer, identify one cause of poor workflow and one way it could be improved.", "options": [], "answer": "Poor workflow is when a chef is unorganised in the commercial kitchen. It reduces the restaurant's efficiency in preparing food on time and lowers the quality of the food; it is caused by not completing mise en place or not following the recipe in a logical order, and it can be improved by preparing ingredients in advance and communicating clearly with the team.", "explanation": "结构化简答要按 Is–Affects–Caused by–Improved by–Example 五步写：先定义，再说影响、成因、改进方式，最后补一个行业例子。只写「很乱」拿不到分。", "source": "Structured Responses (Sample Answers).pdf — Poor Workflow", "points": [{"t": "Poor workflow is when a chef is unorganised in the commercial kitchen. It reduces the restaurant's efficiency in preparing food on time and lowers the quality of the food", "m": 1}, {"t": "it is caused by not completing mise en place or not following the recipe in a logical order, and it can be improved by preparing ingredients in advance and communicating clearly with the team", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-020", "topic": "食物公平 · 发达国家中的不公平", "difficulty": "hard", "type": "short", "stem": "Food inequity also exists in developed countries such as Australia. Identify two groups affected and explain one factor that makes it hard for them to access nutritious food.", "options": [], "answer": "Groups affected include people on low incomes or unemployed, rural and isolated people, the elderly, Aboriginal and Torres Strait Islander people, people with disabilities and homeless people. One key factor is the cost of fresh food combined with limited transport, which makes affordable nutritious food physically and financially hard to reach.", "explanation": "答案要「两个群体 + 一个原因」。常见失分是只列群体不解释原因；能被接受的典型原因是价格、交通距离、住宿条件（无厨房）或健康限制。", "source": "Term 1 · Food Inequity Assignment（Introduction 与 Part 1）", "points": [{"t": "Groups affected include people on low incomes or unemployed, rural and isolated people, the elderly, Aboriginal and Torres Strait Islander people, people with disabilities and homeless people", "m": 1}, {"t": "One key factor is the cost of fresh food combined with limited transport, which makes affordable nutritious food physically and financially hard to reach", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-021", "topic": "食物公平 · 慈善机构的作用与局限", "difficulty": "hard", "type": "short", "stem": "Explain how charities such as OzHarvest or Foodbank reduce food inequity, and outline one limitation of relying on charities to solve food insecurity.", "options": [], "answer": "Charities collect surplus or donated food and redistribute it, free or at low cost, to people who cannot afford enough nutritious food. A limitation is that supply is unpredictable and depends on donations, so they treat the symptom rather than fixing the underlying causes such as low income and high housing costs.", "explanation": "拿分点有两层：先说慈善机构怎么「救急」（收集余粮、再分配），再指出结构性问题无法靠捐赠解决。只说「他们帮助穷人」不够深入。", "source": "Term 1 · Food Inequity Assignment (Part 1 – charity research)＋Part 4（未来策略）", "points": [{"t": "Charities collect surplus or donated food and redistribute it, free or at low cost, to people who cannot afford enough nutritious food", "m": 1}, {"t": "A limitation is that supply is unpredictable and depends on donations, so they treat the symptom rather than fixing the underlying causes such as low income and high housing costs", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-022", "topic": "食物趋势 · 社交媒体", "difficulty": "hard", "type": "short", "stem": "Explain how social media drives food trends such as the #foodie movement and snackification, and identify one risk this creates for consumers.", "options": [], "answer": "Social media spreads visually appealing food content quickly, so dishes and products become popular through shares, hashtags and influencer posts, and manufacturers respond with convenient snack-style products. One risk is that consumers may copy unhealthy or unverified food advice and choose foods for appearance rather than nutrition.", "explanation": "要写出「传播机制」（视觉内容、hashtag、网红）和「风险」（误导性营养信息、份量与健康问题）。只描述现象不解释机制容易被扣分。", "source": "Term 2 · Food Trends: Quiz 6 #foodie；Quiz 4 Snackification and other Food Trends", "points": [{"t": "Social media spreads visually appealing food content quickly, so dishes and products become popular through shares, hashtags and influencer posts, and manufacturers respond with convenient snack-style products", "m": 1}, {"t": "One risk is that consumers may copy unhealthy or unverified food advice and choose foods for appearance rather than nutrition", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-023", "topic": "特定需求 · 运动员能量需求", "difficulty": "medium", "type": "short", "stem": "Explain why a professional NRL player has different daily energy and nutrient requirements from a sedentary office worker.", "options": [], "answer": "The NRL player trains and plays at high intensity for long periods, so he burns far more kilojoules and needs more carbohydrate to refuel muscles, plus extra protein for muscle repair and fluid and electrolytes to replace sweat losses. A sedentary office worker uses much less energy, so eating the same amount would lead to excess energy being stored as fat.", "explanation": "答案要落到「能量消耗差异 → 碳水/蛋白/水分需求差异」。只写「运动员吃得多」没有解释营养素的分配，属于低分答案。", "source": "Term 3 · Food for Specific Needs: Quiz 4 Fuel Requirements for NRL Players；Quiz 7 Diet of an Olympic Athlete", "points": [{"t": "The NRL player trains and plays at high intensity for long periods, so he burns far more kilojoules and needs more carbohydrate to refuel muscles, plus extra protein for muscle repair and fluid and electrolytes to replace sweat losses", "m": 1}, {"t": "A sedentary office worker uses much less energy, so eating the same amount would lead to excess energy being stored as fat", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-024", "topic": "特殊场合 · 用食物庆祝的原因", "difficulty": "medium", "type": "short", "stem": "Give two reasons why families and communities celebrate with particular foods, and support each reason with one example.", "options": [], "answer": "Food is used to mark significant events and bring people together, for example a birthday cake at a birthday party or a shared feast at Christmas. Particular foods also carry cultural or religious meaning and are used to pass on traditions, for example long noodles symbolising longevity at Chinese New Year.", "explanation": "两个理由要区分开：一个是「社交团聚」，一个是「文化/宗教象征」，并各配一个例子。只举例子不说明理由会丢分。", "source": "Term 4 · Food for Special Occasions: Quiz 6 Reasons for Celebrating with Food", "points": [{"t": "Food is used to mark significant events and bring people together, for example a birthday cake at a birthday party or a shared feast at Christmas", "m": 1}, {"t": "Particular foods also carry cultural or religious meaning and are used to pass on traditions, for example long noodles symbolising longevity at Chinese New Year", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "ftn-025", "topic": "食品安全 · 个人卫生", "difficulty": "hard", "type": "short", "stem": "Explain why personal hygiene is the responsibility of every food handler. Give two examples of poor personal hygiene that could contaminate food.", "options": [], "answer": "Every food handler can pass bacteria or viruses from their body to food, and food poisoning outbreaks are often traced back to one person's hygiene practices, so each worker is legally and ethically responsible. Examples include not washing hands after using the toilet or handling raw meat, and coughing or sneezing over food or working while sick with gastro.", "explanation": "要点是「个体行为会导致整批食物污染」以及具体错误做法（洗手、生病上岗、对着食物咳嗽）。Food Handler Basics 模块 2 就是这一块。", "source": "Term 1 · Food Handler Basics Training (Module 2: Personal hygiene)", "points": [{"t": "Every food handler can pass bacteria or viruses from their body to food, and food poisoning outbreaks are often traced back to one person's hygiene practices, so each worker is legally and ethically responsible", "m": 1}, {"t": "Examples include not washing hands after using the toilet or handling raw meat, and coughing or sneezing over food or working while sick with gastro", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "食品科技"}, {"id": "car-001", "topic": "澳洲就业路径 · ATAR 资格", "difficulty": "easy", "type": "mcq", "stem": "To be eligible for an ATAR in NSW, a Year 12 student must complete at least how many units of ATAR courses?", "options": ["10 units", "12 units", "8 units", "6 units"], "answer": 0, "explanation": "ATAR 资格要求至少 10 个 unit 的 ATAR 课程，其中还要含 8 个 unit 的 Category A 和 2 个 unit 英语。少一个 unit 就失去 ATAR 资格。", "source": "top-tips-for-choosing-hsc-courses.pdf（ATAR eligibility）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-002", "topic": "澳洲就业路径 · ATAR 资格", "difficulty": "easy", "type": "mcq", "stem": "Which of these is a compulsory part of ATAR eligibility?", "options": ["At least 6 different subjects", "At least 2 units of English", "At least 1 unit of a Category B course", "At least 4 units of Mathematics"], "answer": 1, "explanation": "英语是硬性要求，必须至少 2 个 unit。数学不是人人必修，Category B 是「最多只能算 2 个 unit」而不是必须选。", "source": "top-tips-for-choosing-hsc-courses.pdf（ATAR eligibility）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-003", "topic": "澳洲就业路径 · SBAT", "difficulty": "medium", "type": "mcq", "stem": "In the course's careers resource list, 'SBAT in NSW' refers to:", "options": ["A university early entry scheme for Year 10 students", "An online platform for sitting the HSC exams", "School Based Apprenticeships and Traineeships", "A scholarship program for elite athletes only"], "answer": 2, "explanation": "SBAT 是「校内学徒/实习生」路径，学生一边完成中学学业，一边做带薪的行业培训。它和大学提前录取、奖学金是不同概念。", "source": "Careers Education 2022（CAREER RESOURCES：SBAT in NSW）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-004", "topic": "澳洲就业路径 · Category B 上限", "difficulty": "hard", "type": "mcq", "stem": "Under the ATAR eligibility rules, what is the maximum number of Category B units a student may include?", "options": ["4 units", "6 units", "None", "2 units"], "answer": 3, "explanation": "Category B 最多只能算 2 个 unit（例如某些 VET 课程）。剩余 unit 必须来自 Category A，这是最容易被忽略的细则。", "source": "top-tips-for-choosing-hsc-courses.pdf（ATAR eligibility）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-005", "topic": "澳洲就业路径 · 学历层级", "difficulty": "easy", "type": "mcq", "stem": "How long does an undergraduate bachelor degree usually take in Australia?", "options": ["3 to 5 years of full-time study", "1 to 2 years of full-time study", "10 years of full-time study", "6 to 8 years of full-time study"], "answer": 0, "explanation": "本科通常 3–5 年全日制，可在其中选择主修方向（majors）。研究生证书、硕士、博士是本科之后的层级，时间另算。", "source": "Week 5 - Levels of education（University Entry）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-006", "topic": "澳洲就业路径 · VET", "difficulty": "easy", "type": "mcq", "stem": "Which of these is a vocational education and training (VET) qualification?", "options": ["Master of Teaching (Secondary)", "Certificate III in Electrotechnology", "Bachelor of Science (Physics major)", "Doctorate of Philosophy (PhD)"], "answer": 1, "explanation": "Certificate III 属于 VET 层级，通常由 TAFE 或政府认可的私立学院开设。Bachelor、Master、PhD 都是高等教育（university）层级。", "source": "Week 5 - Levels of education（VET / TAFE）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-007", "topic": "求职 · 简历", "difficulty": "easy", "type": "mcq", "stem": "What is the main advice given about writing a resume?", "options": ["Leave out sporting and academic awards completely", "Use exactly the same resume for your whole working life", "Be brief and clear so it is quick to read", "Include long, detailed paragraphs about every job you have had"], "answer": 2, "explanation": "课程强调 resume 要简洁清晰，把长段落留给面试去讲。另外简历不是一辈子一份，会随经历不断更新。奖项可以写，但要能对上你用的技能。", "source": "Building a resume（What is important on a resume?）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-008", "topic": "求职 · 求职信长度", "difficulty": "medium", "type": "mcq", "stem": "According to the cover letter resource, an appropriate length for a cover letter is about:", "options": ["Same as the resume", "800 to 1000 words", "50 to 100 words", "250 to 400 words"], "answer": 3, "explanation": "课程给的区间是 250–400 词，重点放在「为什么应聘、你能提供什么、如何跟进」。写成一长篇文章反而会失分。", "source": "Writing a cover letter（The Cover Letter）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-009", "topic": "求职 · 求职信类型", "difficulty": "medium", "type": "mcq", "stem": "A 'prospecting letter' is a cover letter that:", "options": ["Asks about jobs that have not been advertised", "Thanks an employer after an interview", "Is sent to a referee instead of an employer", "Responds to a position that has been advertised"], "answer": 0, "explanation": "prospecting letter 是「主动投递」性质，询问对方是否有未公开的空缺，因此更要把研究做得充分、抓住对方注意。回应广告的那类叫 application letter。", "source": "Writing a cover letter（Prospecting letter）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-010", "topic": "职业规划 · 行动方案", "difficulty": "easy", "type": "mcq", "stem": "The career action plan has four sections. Which set is correct?", "options": ["My Subjects, My Marks, My School, My Teacher", "My Profile, My Goals and Plans, My Progress, My Review", "My Resume, My Interview, My Salary, My Holidays", "My Budget, My Tax, My Super, My Bank"], "answer": 1, "explanation": "行动方案四个部分：我的档案、目标与计划、进展、复盘。它的作用是看清自己现在在哪、还缺哪些经验。", "source": "Career action plan（There are 4 sections to the action plan）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-011", "topic": "求职 · 面试与雇主调研", "difficulty": "easy", "type": "mcq", "stem": "Before you apply or interview for a job, what does the course advise you to do about the company?", "options": ["Avoid researching it so your answers sound spontaneous", "Bring no documents so you appear confident", "Research its values so you can align your skills", "Memorise one answer and use it for every question"], "answer": 2, "explanation": "课程提示要做公司调研：了解其 motto/价值观，再把你的技能与之一一对应，这会让申请显得有针对性。完全不查资料是常见失分点。", "source": "Week Ten- Submitting Your Resume & Cover Letter（NOTE：do your research on the company）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-012", "topic": "能力测评 · 多元智能", "difficulty": "medium", "type": "mcq", "stem": "The theory of multiple intelligences suggests that:", "options": ["Only mathematical ability matters for choosing a career", "Intelligence is a single number fixed at birth", "One standard test can measure all of a person's ability", "People are smart in several different ways"], "answer": 3, "explanation": "多元智能强调「不同的人有不同的聪明方式」，用来拓宽职业方向的理解。它反对用单一分数判定能力。", "source": "Week Two- Multiple Intelligences: Different Ways to be Smart", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-013", "topic": "澳洲就业路径 · USI", "difficulty": "easy", "type": "mcq", "stem": "What is a Unique Student Identifier (USI)?", "options": ["A national number linking your training records", "The password for the school wireless network", "The number used to calculate a student's ATAR score", "The bank account used to pay school fees"], "answer": 0, "explanation": "USI 是全国统一的学生标识，用来串起你参加过的培训与取得的资格。它和 ATAR、TFN 都不是一回事。", "source": "Week Eight- Creating a USI, TFN & MyGov account", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-014", "topic": "澳洲就业路径 · TFN", "difficulty": "medium", "type": "mcq", "stem": "Why does a student need a Tax File Number (TFN) when starting a job?", "options": ["It replaces a passport when travelling overseas", "The employer uses it so your pay and tax are recorded correctly", "It is the same number as your USI and MyGov password", "It sets the hourly pay rate your employer must pay you"], "answer": 1, "explanation": "TFN 是税务局编号，没有它雇主无法按正确税率扣税，你也会被按最高税率预扣。工资标准由裁定或合同决定，不是 TFN 决定的。", "source": "Week Eight- Creating a USI, TFN & MyGov account", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-015", "topic": "职场财务 · 退休金", "difficulty": "medium", "type": "mcq", "stem": "In Australia, superannuation is best described as:", "options": ["A tax added to every purchase you make", "A bank fee for keeping a savings account", "Money your employer pays into your retirement fund", "A bonus paid to students who finish their Year 12 studies"], "answer": 2, "explanation": "super 是雇主在工资之外额外缴入退休金账户的款项，长期投资到你退休。它不属于当期可花的工资，也不是购物税。", "source": "Week Five- Tax & Super", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-016", "topic": "职场权益 · 劳资关系", "difficulty": "medium", "type": "mcq", "stem": "Under Australian workplace law, all workers are entitled to:", "options": ["Ignore workplace safety rules because they are casual employees", "Be paid only when the employer decides the work was good enough", "Work any hours required without breaks or overtime pay", "Know your rights and responsibilities at work"], "answer": 3, "explanation": "课程的核心就是「知道自己的权利与责任」，包括最低工资、安全环境和休息时间。casual 身份并不免除安全义务，也不能随意克扣工资。", "source": "Week Three- Industrial Relations & Workplaces（Fair Work workplace basics）", "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-017", "topic": "澳洲就业路径 · 选课与加分迷思", "difficulty": "hard", "type": "short", "stem": "Explain why choosing subjects that are believed to be 'harder' or always 'scaled up' does not guarantee a higher ATAR.", "options": [], "answer": "A course's scaling depends on the average academic performance of all the students taking that course in that year, so it can change from year to year. For most courses your scaled mark is lower than your HSC mark, so the reliable strategy is to choose courses you are good at and interested in and do your best in them, rather than chasing rumours about scaling.", "explanation": "关键点是「scaling 由当年该科全体考生的整体表现决定」，不是课程标签决定。因此选自己擅长且需要的科目才稳。答题时别只写「不要听谣言」，要说明机制。", "source": "top-tips-for-choosing-hsc-courses.pdf（scaling myths 表格）", "points": [{"t": "A course's scaling depends on the average academic performance of all the students taking that course in that year, so it can change from year to year", "m": 1}, {"t": "For most courses your scaled mark is lower than your HSC mark, so the reliable strategy is to choose courses you are good at and interested in and do your best in them, rather than chasing rumours about scaling", "m": 1}], "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-018", "topic": "求职 · 求职信定制与跟进", "difficulty": "hard", "type": "short", "stem": "Describe how you would tailor a cover letter to a position that has been advertised, and explain one follow-up step you should take after sending it.", "options": [], "answer": "I would state where I saw the advertisement and the exact position title, then respond directly to the qualifications listed by giving evidence from my own experience, showing how my skills are transferable to that role. After sending it I should follow up within the time frame indicated, preferably with a phone call or, if calls are blocked, an email, and make sure all my contact details and a normal email address are included.", "explanation": "两问都要答：一是「逐条对应广告里的任职要求并给证据」，二是「在说明的时限内跟进」。只写「我很想申请」是拿不到分的。", "source": "Writing a cover letter（What You Have To Offer / How You Will Follow Up）", "points": [{"t": "I would state where I saw the advertisement and the exact position title, then respond directly to the qualifications listed by giving evidence from my own experience, showing how my skills are transferable to that role", "m": 1}, {"t": "After sending it I should follow up within the time frame indicated, preferably with a phone call or, if calls are blocked, an email, and make sure all my contact details and a normal email address are included", "m": 1}], "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-019", "topic": "学习技巧 · 复习时间表", "difficulty": "medium", "type": "short", "stem": "Describe how you would build a realistic study timetable for the end-of-year exams, and name two study strategies that improve memory retention.", "options": [], "answer": "I would list every exam date and subject first, then work backwards to allocate study blocks, putting the subjects with the earliest or hardest exams first and leaving gaps for rest and other commitments. Two strategies that improve retention are spaced practice (revisiting each topic several times over the weeks rather than cramming once) and active recall (testing yourself or writing study notes from memory instead of only re-reading).", "explanation": "时间表要「由考试日期倒推、留出缓冲」，而不是把时间平均分。记忆策略答「分散复习 + 主动回忆」最稳，只写「多看书」不算策略。", "source": "Week One- Term 4 Goals & Creating a Yearly Exam Study Timetable；Week Two- Study Skills & Memory Retention（记忆策略为课程标准知识）", "points": [{"t": "I would list every exam date and subject first, then work backwards to allocate study blocks, putting the subjects with the earliest or hardest exams first and leaving gaps for rest and other commitments", "m": 1}, {"t": "Two strategies that improve retention are spaced practice (revisiting each topic several times over the weeks rather than cramming once) and active recall (testing yourself or writing study notes from memory instead of only re-reading)", "m": 1}], "weak": true, "subj": "car", "subjZh": "生涯规划"}, {"id": "car-020", "topic": "职场体验 · 复盘", "difficulty": "hard", "type": "short", "stem": "Outline two benefits of completing Year 10 work experience, and explain how reflecting on it afterwards could change your career plan.", "options": [], "answer": "Work experience lets you see what the tasks, responsibilities and conditions of a job are really like, and it builds contacts and evidence of employability that you can use in future applications. Reflecting on it may show that the industry suits your strengths, or that the daily work does not match your expectations, which could lead you to change your subject choices or consider a different pathway.", "explanation": "得分点在「真实了解工作内容 + 积累人脉/履历」，然后是「反思可能让你确认或修正方向」。只写「很有意思」没有反思，拿不到高分。", "source": "Week Nine- Work Experience；Week Ten- Reflecting on Work Experience（reflection survey）", "points": [{"t": "Work experience lets you see what the tasks, responsibilities and conditions of a job are really like, and it builds contacts and evidence of employability that you can use in future applications", "m": 1}, {"t": "Reflecting on it may show that the industry suits your strengths, or that the daily work does not match your expectations, which could lead you to change your subject choices or consider a different pathway", "m": 1}], "weak": false, "subj": "car", "subjZh": "生涯规划"}, {"id": "sport-001", "topic": "运动安全 · 热身", "difficulty": "easy", "type": "mcq", "stem": "What is the main purpose of a warm-up before a training session or trial?", "options": ["To raise heart rate and muscle temperature and lower injury risk", "To replace the need for a cool-down at the end of the session", "To build muscle size quickly before the session starts", "To use up energy so you do not get tired later in the session"], "answer": 0, "explanation": "热身的核心是gradually提高心率、肌肉温度和关节活动度，让身体进入运动状态并降低拉伤风险。它不能替代放松，也不是用来「消耗体力」的。", "source": "Bally Volleyball（7:30am warm up before the 8:00am trial）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-002", "topic": "球类规则 · 排球人数", "difficulty": "easy", "type": "mcq", "stem": "In indoor volleyball, how many players from each team are on the court at one time?", "options": ["2", "6", "5", "11"], "answer": 1, "explanation": "室内排球每队场上 6 人，轮转发球。2 人是沙滩排球，11 人是足球/板球等项目的人数，不要混。", "source": "Bally Volleyball（Indoor volleyball team）＋课程标准知识", "weak": true, "subj": "sport", "subjZh": "体育"}, {"id": "sport-003", "topic": "球类规则 · 沙滩排球", "difficulty": "easy", "type": "mcq", "stem": "How many players are on each team in beach volleyball?", "options": ["1", "4", "2", "6"], "answer": 2, "explanation": "沙滩排球每队 2 人，场地更小但没有换人轮转。室内排球才是每队 6 人。", "source": "Bally Volleyball（2021 Indoor and Beach teams）＋课程标准知识", "weak": true, "subj": "sport", "subjZh": "体育"}, {"id": "sport-004", "topic": "运动安全 · 护具", "difficulty": "easy", "type": "mcq", "stem": "According to the Sydney North rugby league permission note, which piece of protective equipment is mandatory in all games and training sessions?", "options": ["Knee strapping on both legs", "Shin pads worn under the socks", "A padded scrum cap for the head", "A correctly fitted mouthguard"], "answer": 3, "explanation": "同意书明确写明「佩戴合适牙套在所有比赛和训练中都是强制的」，用来降低牙齿和颌面部损伤。护腿板、护膝不是该项目的强制装备。", "source": "Rugby_League_Trials_permission_note.docx", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-005", "topic": "赛事规则 · 田径晋级", "difficulty": "easy", "type": "mcq", "stem": "At the Balgowlah Boys Athletics Carnival, which athletes are expected to compete at the North Shore Athletics Carnival?", "options": ["The top two finishers in each age group", "Only the winner of each individual event", "Everyone who finishes the race on the day", "The fastest ten runners in each age group"], "answer": 0, "explanation": "田径嘉年华规定每个年龄组前两名进入 North Shore 嘉年华。前「十名」是越野跑的晋级标准，别把两项赛事规则搞混。", "source": "Bally Boys school athletics carnival permission note.doc（Zone Representation）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-006", "topic": "赛事规则 · 越野跑晋级", "difficulty": "medium", "type": "mcq", "stem": "To qualify for the Zone cross country team, a runner must:", "options": ["Finish in the top two of their age group", "Finish in the top ten of their age group", "Be selected by the sports captain", "Complete the course under 15 minutes"], "answer": 1, "explanation": "越野跑是各年龄组前十名进入 Zone 队，比田径的前两名门槛宽。这两个数字是考试最容易设陷阱的地方。", "source": "School XC Program 2025 - amended.docx（Guidelines — To qualify for Zone）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-007", "topic": "赛事规则 · 游泳晋级例外", "difficulty": "medium", "type": "mcq", "stem": "At the swimming carnival, the fastest two swimmers normally qualify for the Zone carnival. For which event does only the fastest swimmer qualify?", "options": ["50m Freestyle", "4 x 50m Relay", "100m Butterfly", "50m Breaststroke"], "answer": 2, "explanation": "200m 自由泳、200m 个人混合泳和 100m 蝶泳只取最快的一名，其余项目取前两名。50m 自由泳是前两名，而且前四名另组接力队。", "source": "Swimming Carnival Program 2020 (3).pdf（Zone qualifying table 说明）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-008", "topic": "赛事规则 · 游泳晋级情境", "difficulty": "medium", "type": "mcq", "stem": "A boy finishes third in the 50m Freestyle in his age group at the school swimming carnival. Which statement is correct?", "options": ["He must swim a final race against the other placegetters to decide the result", "He qualifies for the Zone carnival because the top three in each event go through", "He automatically becomes age champion because he finished in the top three", "He misses Zone in that event but may still make the age relay as a fastest four"], "answer": 3, "explanation": "50m 自由泳只有前两名进 Zone，第三名进不去；但「各年龄组 50m 自由泳最快四名组成年龄接力队」，所以第三名仍可能入选接力。另外所有项目按时间排名、不设决赛。", "source": "Swimming Carnival Program 2020 (3).pdf（Zone qualifiers / Age Relay Team）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-009", "topic": "体能训练 · 渐进超负荷", "difficulty": "medium", "type": "mcq", "stem": "The Wednesday Sport program only increases the running load slightly each week (for example walk 5 / jog 0, then jog 1 / walk 4, then jog 3 / walk 2). Why does it progress this way?", "options": ["So students can overload gradually and avoid injury", "So that everyone finishes the session at exactly the same time", "Because the teacher does not want students improving too quickly", "Because running over five minutes is unsafe for teenagers"], "answer": 0, "explanation": "这是渐进超负荷原则：每次只加一点量，让身体适应，避免突然加量造成肌肉酸痛和受伤。课程原文就写明「no sudden increase in volume or intensity」。", "source": "Wednesday sport Remote Learning Week 4 / Week 5", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-010", "topic": "运动安全 · 高温与防晒", "difficulty": "medium", "type": "mcq", "stem": "Which is the best preparation for an outdoor athletics carnival on a hot day?", "options": ["Wear brand new spikes you have never worn before", "Drink plenty of water and bring a hat and sun protection", "Avoid drinking until after your last event", "Wear an extra jumper so you sweat more and lose weight"], "answer": 1, "explanation": "课程通知明确要求带足饮水、做好防晒并戴帽子。刻意少喝水会增加中暑和抽筋风险；全新的钉鞋容易磨出水泡，比赛日不该第一次穿。", "source": "Bally Boys school athletics carnival permission note.doc（What to bring）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-011", "topic": "体能训练 · 训练术语", "difficulty": "easy", "type": "mcq", "stem": "In the Week 6 strength routine, students complete 'AMRAP in 20 minutes'. What does AMRAP mean?", "options": ["A measured running and pacing test over a set distance", "Alternating muscle recovery with performance work", "As many reps or rounds as possible in the set time", "A mandatory rest period after every repetition"], "answer": 2, "explanation": "AMRAP = as many reps/rounds as possible，即在规定时间内尽可能多完成循环（5 个超人式、10 个俯卧撑、15 个深蹲）。计时结束就停。", "source": "Wednesday Sport Remote Learning week 6", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-012", "topic": "赛事规则 · 年龄冠军", "difficulty": "medium", "type": "mcq", "stem": "How is the age champion decided at the swimming carnival?", "options": ["By the fastest 100m time recorded on the day", "By winning a single 50m freestyle race on the day", "By a vote of all teachers at the end of the carnival", "By the highest aggregate point score across events"], "answer": 3, "explanation": "年龄冠军看所有项目的累计积分最高者，所以多项进名次比单项夺冠更有利。单项冠军只是拿到该项目的一份积分。", "source": "Swimming Carnival Program 2020 (3).pdf（Age champion 说明）", "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-013", "topic": "运动安全 · 受伤处理", "difficulty": "hard", "type": "short", "stem": "During a 25-minute run a student feels a sharp pain in his hamstring. Describe what he should do and explain why continuing to run would be risky.", "options": [], "answer": "He should stop running immediately, tell the teacher or coach, and get the injury assessed and treated with rest, ice, compression and elevation before returning to play. Continuing to run is risky because a strained muscle can tear further, causing a much longer recovery, and pain is a warning sign that should never be pushed through.", "explanation": "得分点是「立即停止 + 报告老师/教练 + RICER 处理」，并说明继续跑会加重撕裂、延长恢复期。忍着跑完是最常见的错误选择。", "source": "School XC Program 2025（赛事安全指引）＋课程标准知识（RICER 急救原则）", "points": [{"t": "He should stop running immediately, tell the teacher or coach, and get the injury assessed and treated with rest, ice, compression and elevation before returning to play", "m": 1}, {"t": "Continuing to run is risky because a strained muscle can tear further, causing a much longer recovery, and pain is a warning sign that should never be pushed through", "m": 1}], "weak": true, "subj": "sport", "subjZh": "体育"}, {"id": "sport-014", "topic": "体能训练 · 渐进超负荷应用", "difficulty": "hard", "type": "short", "stem": "Using the Wednesday Sport program as an example, explain what progressive overload means and why it is safer than suddenly training much harder.", "options": [], "answer": "Progressive overload means gradually increasing the training demand over time, for example moving from a 45-minute walk with bodyweight exercises to jogging 4 minutes and walking 1 minute, and eventually to a continuous 25-minute run. It is safer because each small increase gives the body time to adapt, whereas a sudden jump in volume or intensity causes muscle soreness and greatly increases the risk of injury.", "explanation": "定义 + 材料里的具体例子 + 「为什么更安全」三部分都要有。只写「慢慢加量」而不举例子，或者不解释受伤风险，都拿不满分。", "source": "Wednesday Sport Remote Learning Week 1–6（train progressions and Week 6 25-minute run）", "points": [{"t": "Progressive overload means gradually increasing the training demand over time, for example moving from a 45-minute walk with bodyweight exercises to jogging 4 minutes and walking 1 minute, and eventually to a continuous 25-minute run", "m": 1}, {"t": "It is safer because each small increase gives the body time to adapt, whereas a sudden jump in volume or intensity causes muscle soreness and greatly increases the risk of injury", "m": 1}], "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "sport-015", "topic": "运动安全 · 知情同意", "difficulty": "hard", "type": "short", "stem": "Explain why a signed permission note and accurate medical information are required before a student competes in a representative sport event, and give one example of a safety rule from the school's sport documents.", "options": [], "answer": "A permission note shows that a parent or guardian knows the event details and accepts that some risk is inherent in sport, and medical information lets staff plan first aid and manage conditions such as asthma or allergy on the day. One example of a safety rule is that a correctly fitted mouthguard is mandatory in all rugby league games and training sessions.", "explanation": "两问：一是「家长知情同意 + 学校能提前准备急救/掌握病史」，二是举出一条真实规定（牙套强制、必须带水防晒等）。只写「学校要求签字」不解释原因会丢分。", "source": "Rugby_League_Trials_permission_note.docx；Bally Boys school athletics carnival permission note.doc", "points": [{"t": "A permission note shows that a parent or guardian knows the event details and accepts that some risk is inherent in sport, and medical information lets staff plan first aid and manage conditions such as asthma or allergy on the day", "m": 1}, {"t": "One example of a safety rule is that a correctly fitted mouthguard is mandatory in all rugby league games and training sessions", "m": 1}], "weak": false, "subj": "sport", "subjZh": "体育"}, {"id": "cw-001", "topic": "求助渠道 · 紧急情况", "difficulty": "easy", "type": "mcq", "stem": "You are walking home with a friend when they collapse and stop breathing. Which number should you call?", "options": ["000 (ambulance, police or fire)", "1800 011 511 (Mental Health Line)", "13 11 14 (Lifeline)", "1800 55 1800 (Kids Helpline)"], "answer": 0, "explanation": "000 是澳洲的紧急电话，救护车、警察、消防都是这个号。有人处于即时危险时必须打 000；其余三个都是心理支持与倾听热线，处理不了需要救护车的现场。", "source": "Urgent Help（Call 000 — ambulance, police or fire services）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-002", "topic": "求助渠道 · 24 小时热线", "difficulty": "easy", "type": "mcq", "stem": "It is 11 pm on a Sunday and you feel overwhelmed and want to talk to someone right now. Which service offers free, confidential crisis support at any hour?", "options": ["Your year advisor by email", "Lifeline on 13 11 14", "SSO Sara at school", "The counsellor's office"], "answer": 1, "explanation": "Lifeline 13 11 14 提供 24/7 的免费保密危机支持。校内的辅导员、SSO 和 Year Advisor 只在上班日的工作时间可用，所以半夜应先打热线。", "source": "Urgent Help（Lifeline — 13 11 14, available 24/7）· Support people at school", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-003", "topic": "健康 · 睡眠时长", "difficulty": "easy", "type": "mcq", "stem": "According to the Sleep page, how much sleep is recommended for someone aged 14 to 17?", "options": ["11–13 hours", "6–7 hours", "8–10 hours", "7–8 hours"], "answer": 2, "explanation": "14–17 岁的建议量是 8–10 小时；7–11 小时属于「可能可以」的区间，少于 7 小时或超过 11 小时都属于不建议。睡眠不足会直接影响记忆、专注力和情绪。", "source": "Sleep（Recommended sleep 表格：14–17 years — 8–10 hours）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-004", "topic": "心理健康 · 抑郁的判据", "difficulty": "easy", "type": "mcq", "stem": "The Depression page describes clinical depression as significant low mood lasting longer than which period and starting to get in the way of everyday life?", "options": ["one year", "three months", "24 hours", "two weeks"], "answer": 3, "explanation": "关键判据是「持续超过两周」且已经影响日常生活。一天或几天的低落属于正常情绪波动，不等于抑郁症；而且材料强调只有医疗专业人员才能下诊断。", "source": "Depression（lasting longer than two weeks and start to get in the way of your everyday life）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-005", "topic": "情绪管理 · 箱式呼吸", "difficulty": "easy", "type": "mcq", "stem": "The Anxiety page describes box breathing as a technique for slowing your breathing and calming your body. What is the pattern?", "options": ["Inhale 4 – hold 4 – exhale 4 – hold 4", "Inhale 10 – hold 10 – exhale 10", "Inhale 4 – hold 7 – exhale 8", "Inhale 2 – exhale 2, repeated quickly"], "answer": 0, "explanation": "箱式呼吸四个阶段各 4 秒，像走完一个正方形的四条边，重复至少 4 次。4-7-8 是同一页上的另一种技术，专门用于睡前脑子停不下来的时候，两者不要混。", "source": "Anxiety（Breathing techniques：Box breathing 与 The 4-7-8 technique）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-006", "topic": "心理健康 · 自伤的正确理解", "difficulty": "easy", "type": "mcq", "stem": "Which statement about self-harm matches what the Self Harm page says?", "options": ["It is simply attention seeking behaviour and should be ignored by everyone.", "It is usually a way of coping with intense feelings, not attention seeking.", "It will stop on its own, so professional help is not needed for it.", "It always means the person wants to die and has already planned how to."], "answer": 1, "explanation": "材料明确写 self harm is not \"attention seeking\"：它通常是应对强烈情绪和压力的方式，也不等于有自杀念头。但它会带来长期的身心伤害，必须寻求专业帮助。", "source": "Self Harm（self harm is not \"attention seeking\"；reasons people self harm）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-007", "topic": "情绪管理 · 愤怒的冰山", "difficulty": "medium", "type": "mcq", "stem": "The Anger page uses the idea of an 'iceberg' to explain anger. What does the metaphor mean?", "options": ["Anger cannot really be managed, so it should be suppressed at all times.", "Anger is always a sign of an anxiety disorder or another mental illness.", "Anger is the visible emotion, often hiding embarrassment, sadness or jealousy.", "Anger only comes from external events, such as a traffic jam, never our own thoughts."], "answer": 2, "explanation": "冰山比喻的关键是：愤怒浮在水面之上，底下压着尴尬、挫败、难过、嫉妒等其他情绪。先找出真正被触发的情绪，才谈得上处理；材料也明确说压抑愤怒不是办法，学会管理才是。", "source": "Anger（Why am I angry? — anger iceberg；external and internal events）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-008", "topic": "心理健康 · 如何支持朋友", "difficulty": "medium", "type": "mcq", "stem": "A friend tells you they think they have depression. Which response would the Depression page say is NOT helpful?", "options": ["\"What can I do to help?\"", "\"What's been on your mind recently?\"", "\"How have you been going lately? You seem a little down.\"", "\"Just cheer up and snap out of it.\""], "answer": 3, "explanation": "材料专门点名：不能对朋友说 cheer up、snap out of it、get over it，这会否定对方的感受。开放式提问、主动倾听、问「我能帮什么」才是有效回应。", "source": "Depression（Take their feelings seriously — cannot just \"cheer up\"、\"snap out of it\"）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-009", "topic": "求助渠道 · 预约学校辅导员", "difficulty": "medium", "type": "mcq", "stem": "You want to see a school counsellor. Which of these is a way the Support People at School page says you can arrange an appointment?", "options": ["Fill in a referral form, a referral slip, or message a counsellor on Canvas.", "Ask a friend to book the appointment with the school counsellor on your behalf.", "Ask your doctor to write a referral letter before a counsellor will see you.", "Wait for a teacher to notice that you are struggling and refer you themselves."], "answer": 0, "explanation": "学校给了三条路：填 School Counsellor Referral Form、到 G201 对面辅导室填推荐条、或通过 Canvas 直接给辅导员发消息。见学校辅导员不需要医生转介（需要转介的是部分校外服务）。", "source": "Support people at school（To organise an appointment with a school counsellor）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-010", "topic": "压力与应对 · 番茄工作法", "difficulty": "medium", "type": "mcq", "stem": "The Study Tips and Tricks page recommends the Pomodoro technique for breaking up study sessions. What does it involve?", "options": ["Study only in the hour before an exam.", "Work in 25-minute blocks with short breaks in between.", "Study for three hours straight, then take a whole day off.", "Study for 5 minutes and rest for 55 minutes."], "answer": 1, "explanation": "番茄工作法是 25 分钟一段、中间短休。材料还补了一条硬规则：不管用什么节奏，都不要连续超过一小时不休息，因为拖太久效率反而下降。", "source": "Study tips and tricks（Take breaks；Pomodoro technique — 25-minute intervals）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-011", "topic": "尊重与安全 · 不健康关系信号", "difficulty": "medium", "type": "mcq", "stem": "Which of these is listed on the Relationships page as a sign of an unhealthy relationship?", "options": ["Encouraging each other's hobbies, friendships and time apart", "Talking calmly through disagreements and respecting each other's view", "Checking your partner's phone and demanding to know where they are", "Being open and honest about your thoughts and feelings in the relationship"], "answer": 2, "explanation": "查手机、盘问行踪属于 controlling behaviour 加上 lack of trust，是材料列出的典型红旗。健康关系的四个要素是尊重、沟通、信任和支持。", "source": "Relationships（Signs of an Unhealthy Relationship / What Makes a Healthy Relationship?）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-012", "topic": "尊重与安全 · 性别与身份术语", "difficulty": "medium", "type": "mcq", "stem": "On the Identity and Gender page, which term refers to a person's biological characteristics, such as chromosomes and reproductive organs?", "options": ["Cisgender", "Gender", "Sexuality", "Sex"], "answer": 3, "explanation": "Sex 是生理性别（染色体、生殖器官等）；Gender 是认同与表达（男性、女性、非二元、性别流动、无性别等）；Sexuality 是被谁吸引（性取向）。Cisgender 指性别认同与出生指定性别一致。", "source": "Identity and Gender（GENDER / SEX / SEXUALITY 对照表及 Key Terms）", "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-013", "topic": "心理健康 · 酒精与其他药物的信号", "difficulty": "hard", "type": "short", "stem": "A friend has stopped coming to footy training, is sleeping badly, has frequent mood swings and drinks on weekends 'to relax'. Name three signs of substance misuse listed on the Alcohol and Other Drugs page and describe one thing you could do to help.", "options": [], "answer": "Signs include becoming disengaged from activities he used to enjoy, significant behaviour or mood changes, relying on alcohol to relax, and changes in eating and sleeping habits. I would raise it with him calmly and suggest he talks to SSO Sara, who can refer him to a youth drug and alcohol service.", "explanation": "材料把「脱离原本喜欢的活动」「情绪突变」「靠酒放松」「作息饮食紊乱」「耐受性上升」都列为 substance misuse 的信号；校内的第一站是 SSO Sara，可转介 DAYSS、SDECC 这类青少年戒治服务。", "source": "Alcohol and Other Drugs（Signs of substance misuse or addiction；Where to go for support）", "points": [{"t": "Signs include becoming disengaged from activities he used to enjoy, significant behaviour or mood changes, relying on alcohol to relax, and changes in eating and sleeping habits", "m": 1}, {"t": "I would raise it with him calmly and suggest he talks to SSO Sara, who can refer him to a youth drug and alcohol service", "m": 1}], "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-014", "topic": "心理健康 · 保密与安全优先", "difficulty": "hard", "type": "short", "stem": "A friend tells you in confidence that they have been hurting themselves and asks you to keep it secret. Describe what the Wellbeing Hub material advises you to do.", "options": [], "answer": "Encourage them to speak to a parent, a school counsellor or SSO Sara, and offer to go with them. If they cannot seek help themselves, ask their permission to tell an adult you trust — but if they refuse and you are still seriously concerned, tell a trusted adult anyway, and call 000 if they are injured or in immediate danger.", "explanation": "安全优先于保密承诺。材料明确写：若对方不愿求助而你仍然非常担心，就应该去告诉值得信任的成年人；一旦已经受伤或有即时危险，立刻打 000。", "source": "Depression（Help them find support）· Self Harm（Who can help?）· Urgent Help（call 000）", "points": [{"t": "Encourage them to speak to a parent, a school counsellor or SSO Sara, and offer to go with them", "m": 1}, {"t": "If they cannot seek help themselves, ask their permission to tell an adult you trust — but if they refuse and you are still seriously concerned, tell a trusted adult anyway, and call 000 if they are injured or in immediate danger", "m": 1}], "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "cw-015", "topic": "压力与应对 · 备考减压策略", "difficulty": "hard", "type": "short", "stem": "Exams are two weeks away. Describe two strategies suggested in the Wellbeing Hub for managing stress, and explain why each one helps.", "options": [], "answer": "Box breathing (inhale 4, hold 4, exhale 4, hold 4, repeated at least four times) slows your breathing and calms your body's stress response. Planning a study timetable and studying a little every day spreads the workload and avoids last-minute cramming, which is itself a major source of stress.", "explanation": "呼吸法处理「当下」的身体反应，时间管理处理「来源」，两者配合才有效。材料还提醒：连续学习超过一小时不休息，效率会下降，反而更焦虑。", "source": "Anxiety（Box breathing；progressive muscle relaxation）· Study tips and tricks（Plan your time / Study every day / Take breaks）", "points": [{"t": "Box breathing (inhale 4, hold 4, exhale 4, hold 4, repeated at least four times) slows your breathing and calms your body's stress response", "m": 1}, {"t": "Planning a study timetable and studying a little every day spreads the workload and avoids last-minute cramming, which is itself a major source of stress", "m": 1}], "weak": false, "subj": "cw", "subjZh": "心理与福祉（Wellbeing Hub）"}, {"id": "engother-001", "topic": "核心概念 · 偏见", "difficulty": "easy", "type": "mcq", "stem": "Which term from the unit glossary means 'a preconceived opinion that is not based on reason or actual experience'?", "options": ["Prejudice", "Justice", "Ethics", "Empathy"], "answer": 0, "explanation": "这是 Term 3 词汇表中 prejudice 的原定义：先入为主、无理性或经验依据的看法。empathy 是共情，justice 是公平，ethics 是道德原则体系。", "source": "Term 3 · Justice, Ethics and Morality — Key Definitions glossary (10ENGA)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-002", "topic": "核心概念 · 共情", "difficulty": "easy", "type": "mcq", "stem": "According to the unit's key definitions, which statement best defines 'empathy'?", "options": ["Treating every individual in an equitable and fair way", "Understanding and sharing the feelings of another person", "A system of moral principles that guides behaviour", "The belief that one's own race is superior to another"], "answer": 1, "explanation": "empathy 在词汇表中定义为“理解并分享他人感受”。第二项是 ethics，第三项是 justice，第四项是 racism，同在一张词汇表里，要逐条区分。", "source": "Term 3 · JEM Key Definitions (10ENGA / LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-003", "topic": "核心概念 · 战争悲悯（pathos）", "difficulty": "easy", "type": "mcq", "stem": "The Term 1 unit defines 'the pathos of war' as:", "options": ["The historical timeline of the Western Front from 1914 to 1918", "The patriotic pride soldiers feel when they enlist", "The deep emotional suffering and human tragedy caused by conflict", "The strategic and political causes of a particular battle"], "answer": 2, "explanation": "材料原文把 pathos of war 定义为冲突带来的深层情感痛苦与人的悲剧（grief、loss、devastation），强调的不是战略、政治或爱国情绪。", "source": "Term 1 · Pathos of War — All Quiet on the Western Front, introductory definition (10ENGR)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-004", "topic": "战争单元 · 身份与青春", "difficulty": "medium", "type": "mcq", "stem": "Read the extract: 'Young men of iron. Young? None of us is more than twenty. But young? Young men? That was a long time ago. We are old now.'\nWhat does this extract most strongly suggest about the soldiers?", "options": ["That they are physically the oldest soldiers in the whole regiment", "That they are proud of being described as 'young men of iron'", "That they have genuinely forgotten how old they actually are", "That the war has aged them psychologically, so they no longer feel young"], "answer": 3, "explanation": "连续的设问与 'We are old now' 构成悖论：实际不到二十岁，心却被战争耗尽。战争摧毁的是心理上的青春，不是年龄；答题要抓住“反问＋对比”这两处手法。", "source": "Term 2 · AQWF essay extract — 'the impact of war on a soldier's identity' (Glover 10ENGY)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-005", "topic": "战争单元 · 反问修辞", "difficulty": "medium", "type": "mcq", "stem": "Read the extract: 'Like an emptying tube, after a couple of minutes he collapses. What good is it to him now that he was such a good mathematician at school?'\nThe rhetorical question mainly works to:", "options": ["Emphasise how pointless his education now seems", "Praise Leer's achievements at school before he dies", "Suggest that Leer had never been a good student", "Blame Leer himself for the injury that kills him"], "answer": 0, "explanation": "反问句把“数学好”与“正在死去”并置，答案显然是“毫无用处”，从而放大战争的荒诞与生命的浪费，这是 pathos 的典型写法。", "source": "Term 2 · AQWF essay extract — Leer's death passage (Glover 10ENGY)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-006", "topic": "战争单元 · 传统战争观", "difficulty": "medium", "type": "mcq", "stem": "An essay question asks: 'How does Remarque refute traditional notions of war?' What does 'traditional notions of war' refer to?", "options": ["Ideas about the causes of the Treaty of Versailles", "Ideas of honour, glory, duty and patriotic heroism", "Ideas about how novels should be structured", "Ideas about trench construction and military logistics"], "answer": 1, "explanation": "traditional notions of war 指社会对战争的浪漫化想象——荣誉、光荣、责任、英雄主义；Remarque 用血肉、恐惧与无意义的死亡反驳的正是这一整套叙事。", "source": "Term 1 · AQWF additional practice questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-007", "topic": "战争单元 · 去浪漫化手法", "difficulty": "medium", "type": "short", "stem": "Explain how Remarque challenges traditional, romanticised ideas about war in All Quiet on the Western Front. Refer to at least one technique. (4 marks)", "options": [], "answer": "1 mark — he replaces heroic language with clinical bodily detail (rats, dysentery, amputations, the sounds of dying men).\n1 mark — first-person narration through Paul makes the damage personal rather than statistical.\n1 mark — the ironic gap between the schoolmaster's patriotic speeches and the soldiers' reality undermines the rhetoric of honour and duty.\n1 mark — the effect is to make the reader experience war as physical and psychological damage rather than as glory.", "explanation": "四点：身体/疾病/尸体的具体细节 → 第一人称让损失个人化 → 学校爱国演讲与现实的反讽 → 读者体验落在“伤害”而非“光荣”。答题时至少要点名一种手法（意象、反讽、叙述视角）。", "source": "Term 1 · The Pathos of War — 'Romanticism of War' lesson and AQWF novel study (LEEDER 10ENGB)", "points": [{"t": "he replaces heroic language with clinical bodily detail (rats, dysentery, amputations, the sounds of dying men).", "m": 1}, {"t": "first-person narration through Paul makes the damage personal rather than statistical.", "m": 1}, {"t": "the ironic gap between the schoolmaster's patriotic speeches and the soldiers' reality undermines the rhetoric of honour and duty.", "m": 1}, {"t": "the effect is to make the reader experience war as physical and psychological damage rather than as glory.", "m": 1}], "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-008", "topic": "诗歌单元 · 弗罗斯特作品", "difficulty": "easy", "type": "mcq", "stem": "Which Robert Frost poem studied in Term 2 is built around a speaker choosing between two paths in a wood?", "options": ["'Mending Wall'", "'Birches'", "'The Road Not Taken'", "'Stopping by Woods on a Snowy Evening'"], "answer": 2, "explanation": "The Road Not Taken 的核心情境就是林中岔路与选择；Mending Wall 讲邻居修墙，Birches 讲童年荡树，Stopping by Woods 讲雪夜驻足。", "source": "Term 2 · Robert Frost Poetry — The Road Not Taken, poem and questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-009", "topic": "诗歌单元 · Mending Wall 主题", "difficulty": "medium", "type": "mcq", "stem": "Which Frost poem studied in Term 2 is built around two neighbours repairing a stone wall between their properties?", "options": ["'Birches'", "'The Road Not Taken'", "'Stopping by Woods on a Snowy Evening'", "'Mending Wall'"], "answer": 3, "explanation": "Mending Wall 的核心情境就是每年春天两家人一同修补石墙，并借墙讨论边界、传统与「Good fences make good neighbours」这句老话。", "source": "Term 2 · Robert Frost Poetry — Mending Wall, poem and questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-010", "topic": "诗歌单元 · 责任与诱惑", "difficulty": "easy", "type": "mcq", "stem": "The exam study materials say an imaginative response may draw on 'the central idea of obligation and responsibility' from 'Stopping by Woods on a Snowy Evening'. Which situation best matches that idea?", "options": ["A traveller lingers in beautiful woods but remembers his promises", "A speaker boasting that he took the difficult path", "A child swinging on birch trees and dreaming of escape", "Two neighbours arguing about who owns the strip of land between them"], "answer": 0, "explanation": "材料原文点明这首诗的核心是 obligation and responsibility：雪夜景色迷人，但旅人想到“还有诺言要守”，必须继续赶路。Birches 对应童年与逃离，Mending Wall 对应邻里边界，The Road Not Taken 对应选择。", "source": "Year 10 English 2026 — YEAR 10 EXAM STUDY MATERIALS (Frost imaginative prompts)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-011", "topic": "诗歌单元 · 创造性仿写", "difficulty": "hard", "type": "short", "stem": "A question asks you to write an imaginative piece 'dealing with solitude and reflection', using a character from the world of Frost's poetry. Explain how you would develop setting, character and structure without simply retelling the poem. (5 marks)", "options": [], "answer": "1 mark — borrow the situation, not the plot: keep the isolated setting (a snow-filled wood, a stone wall at dusk) but invent a new persona.\n1 mark — give the character a specific voice and a memory that explains their solitude.\n1 mark — use one recurring image and controlled sentence length to create the reflective tone.\n1 mark — organise the piece with a flashback that turns the reflection into a decision or a changed understanding.\n1 mark — end on that change rather than on a summary of Frost's lines, so the piece is a new story rather than a retelling.", "explanation": "材料要求“用弗罗斯特诗歌的语言特征、惯例与主题进行创作”，不是复述。五点：借情境不借情节 → 给人物的声音与记忆 → 单一意象＋句式控节奏 → 用 flashback 形成转折 → 收在“转变”而不是概述原诗。", "source": "Term 2 · Frost imaginative task — 'construct an imaginative piece that deals with solitude and reflection' (Glover 10ENGY)", "points": [{"t": "borrow the situation, not the plot: keep the isolated setting (a snow-filled wood, a stone wall at dusk) but invent a new persona.", "m": 1}, {"t": "give the character a specific voice and a memory that explains their solitude.", "m": 1}, {"t": "use one recurring image and controlled sentence length to create the reflective tone.", "m": 1}, {"t": "organise the piece with a flashback that turns the reflection into a decision or a changed understanding.", "m": 1}, {"t": "end on that change rather than on a summary of Frost's lines, so the piece is a new story rather than a retelling.", "m": 1}], "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-012", "topic": "阅读卷 · 文本类型", "difficulty": "easy", "type": "mcq", "stem": "In the Term 3 Reading Section (15 marks), which set of texts are you asked to analyse?", "options": ["Australian newspaper editorials and film reviews", "Historical images, protest poetry and speech extracts", "Shakespearean soliloquies and Romantic poetry", "Novel chapters and wartime diary entries"], "answer": 1, "explanation": "材料明确列出三类文本：历史图像、抗议与民权诗歌、民权人物演讲节选。三类文本的分析术语不同，备考时各要练一篇。", "source": "Term 3 · Reading Section (15 marks) — task outline (10ENGA)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-013", "topic": "阅读卷 · 诗歌态度", "difficulty": "medium", "type": "mcq", "stem": "'Still I Rise' is studied in the Term 3 Reading Section. Which attitude does the speaker most clearly represent?", "options": ["Indifference towards history, politics and the struggle for change", "Nostalgia for a lost childhood home and the songs of the past", "Defiant pride and a refusal to be diminished by oppression", "Resigned acceptance of injustice and a longing for silence"], "answer": 2, "explanation": "这首诗以反复的 'I rise' 表现反抗与尊严，属于材料所说的 representations of injustice, discrimination and resistance 中的 resistance（抵抗），而非认命或怀旧。", "source": "Term 3 · 'Still I Rise' poem and questions (10ENGL TERM THREE HOMEPAGE)", "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}, {"id": "engother-014", "topic": "阅读卷 · 抗议诗手法", "difficulty": "hard", "type": "short", "stem": "Explain how repetition and direct address help a protest poem construct resistance. (4 marks)", "options": [], "answer": "1 mark — repetition of an assertive phrase works like a refrain, turning a private feeling into a public chant.\n1 mark — the repeated assertion makes the speaker's defiance sound unstoppable, which is itself an argument against oppression.\n1 mark — direct address ('you') pulls the reader or the oppressor into the poem, so the audience cannot remain neutral.\n1 mark — combined with a rising tone, the poem turns testimony into a demand for recognition.", "explanation": "四点：反复＝副歌化、把私人情绪变成公共口号 → 语气显得“压不住” → 直接称呼把读者/压迫者拉进场 → 见证转成要求。分析要写“对读者产生什么效果”，不能只数修辞格。", "source": "Term 3 · Poem Techniques — 'Still I Rise' / 'Caged Bird' / 'They Took Me from My Mother' reading practice", "points": [{"t": "repetition of an assertive phrase works like a refrain, turning a private feeling into a public chant.", "m": 1}, {"t": "the repeated assertion makes the speaker's defiance sound unstoppable, which is itself an argument against oppression.", "m": 1}, {"t": "direct address ('you') pulls the reader or the oppressor into the poem, so the audience cannot remain neutral.", "m": 1}, {"t": "combined with a rising tone, the poem turns testimony into a demand for recognition.", "m": 1}], "weak": false, "subj": "engother", "subjZh": "英语 · 非年考内容"}]};
const KEY = "dsh-quiz-all";
const MULTI = DATA.slug === "all";
const app = document.getElementById("app");
let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = DATA.questions.map((_,i)=>i);
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderSetup() {
  const subs = DATA.subjects || {};
  const keys = Object.keys(subs);
  const saved = state.pick || {};
  const opts = keys.map(k => {
    const on = saved[k] !== false;
    return `<label class="pick"><input type="checkbox" data-s="${k}" ${on ? "checked" : ""}>
      <span class="nm" title="${esc(subs[k].zh || k)}">${esc(subs[k].zh || k)}</span><em>${subs[k].n}</em></label>`;
  }).join("");
  const per = (state.per === undefined || state.per === null) ? 10 : state.per;
  const DAILY = ["sci","eng","his","geo","pdh","matp","maths53"];
  app.innerHTML = `<div class="setup">
    <div class="setup-head">
      <h2>综合卷 · 全科</h2>
      <p class="muted">从各科抽题混着做；做错的题会按它原本的科目进错题本，并按第 1/3/7 天排期。</p>
    </div>

    <section class="setup-block">
      <div class="setup-label">1 · 选科目 <span class="muted" id="pickcount"></span></div>
      <div class="picks">${opts}</div>
    </section>

    <section class="setup-block">
      <div class="setup-label">2 · 每科抽几题</div>
      <div class="seg">${[5,10,20,0].map(n => `<button data-n="${n}" class="${per===n?'on':''}">${n? n+' 题':'全部'}</button>`).join("")}</div>
    </section>

    <div class="setup-foot">
      <div class="sum">共 <b id="cnt">0</b> 题</div>
      <button class="btn ghost" id="daily">今日挑战</button>
      <button class="btn" id="startmix">开始答题 →</button>
    </div>
  </div>`;
  const chosenCount = () => {
    let c = 0;
    app.querySelectorAll(".pick input").forEach(cb => { if (cb.checked) c++; });
    return c || Object.keys(subs).filter(k => (state.pick || {})[k] !== false).length;
  };
  const calc = () => {
    let n = 0;
    app.querySelectorAll(".pick input").forEach(cb => {
      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = "已选 " + chosenCount() + " 科";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
