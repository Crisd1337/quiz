“倒霉”，而是性格缺陷：他把自己当成不可冒犯的“龙”，愤怒盖过判断，因此放逐与分国都是性格推动的结果——这正是悲剧结构要求的因果。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge.", "m": 1}, {"t": "wrath has replaced judgement: he acts from injured pride rather than reason, and cannot tolerate being contradicted.", "m": 1}, {"t": "because this flaw (not fate) drives the banishments and the division of the kingdom, his downfall follows from character, which is what makes the play a tragedy.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-011", "topic": "李尔王 · 权力、失去与身份", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: I gave you all—\nREGAN: And in good time you gave it.\n\nAnalyse what this exchange reveals about power, loss and identity. (4 marks)", "options": [], "answer": "1 mark — Lear still speaks as the giver: his identity is bound up in what he handed over, so he assumes authority continues after the gift.\n1 mark — Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude.\n1 mark — the daughters now own the power he thought he kept; the title of king remains but the substance has gone.\n1 mark — the play shows identity collapsing when power is transferred: Lear is reduced to 'a poor old man' and has to rebuild a self from bare humanity.", "explanation": "4 分要覆盖三个概念：权力已转移、身份仍停留在“给予者”、以及作品借此说明“头衔≠实质”。Regan 那句冷冰冰的 'in good time' 是权力关系的转折点。", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "Lear still speaks as the giver: his identity is bound up in what he handed over, so he assumes authority continues after the gift.", "m": 1}, {"t": "Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude.", "m": 1}, {"t": "the daughters now own the power he thought he kept; the title of king remains but the substance has gone.", "m": 1}, {"t": "the play shows identity collapsing when power is transferred: Lear is reduced to 'a poor old man' and has to rebuild a self from bare humanity.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-012", "topic": "李尔王 · 「reason not the need」", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: O, reason not the need: our basest beggars\nAre in the poorest thing superfluous:\n\nWhat does this speech reveal about Lear's understanding of need? (3 marks)", "options": [], "answer": "1 mark — he argues that bare necessity is not enough for human dignity: even beggars have something 'superfluous' beyond survival.\n1 mark — he is defending his hundred knights as a symbol of status and respect, not as a practical requirement.\n1 mark — the speech shows him reasoning about humanity and hardship, but still from a king's position, so the insight is genuine yet incomplete.", "explanation": "这题的关键是“need 有两层”：生存所需 vs 人的尊严所需。Lear 已经能替乞丐说话（这是进步），但他争夺的仍是排场与体面，说明此处认识尚未完成。", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "he argues that bare necessity is not enough for human dignity: even beggars have something 'superfluous' beyond survival.", "m": 1}, {"t": "he is defending his hundred knights as a symbol of status and respect, not as a practical requirement.", "m": 1}, {"t": "the speech shows him reasoning about humanity and hardship, but still from a king's position, so the insight is genuine yet incomplete.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-013", "topic": "李尔王 · 暴风雨的象征（Act 3 Sc 2）", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 2:\n\nLEAR: Blow, winds, and crack your cheeks! rage! blow! ...\nI am a man\nMore sinn'd against than sinning.\n\n(a) How does Shakespeare use the storm symbolically in this scene? (3 marks)\n(b) What does 'More sinn'd against than sinning' reveal about Lear's self-knowledge at this point? (3 marks)", "options": [], "answer": "(a) 1 mark — the storm externalises Lear's inner rage and gives his fury a cosmic scale.\n1 mark — it is also indifferent nature: wind and rain do not answer him, which cuts human authority down to size.\n1 mark — by stripping him of shelter and followers it forces him to confront exposed humanity, preparing the 'poor naked wretches' speech.\n(b) 1 mark — he sees himself chiefly as a victim: 'sinn'd against' comes first and carries the weight.\n1 mark — he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial, not full confession.\n1 mark — fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey.", "explanation": "(a) 暴风雨有三重功能：外化愤怒、显示自然的冷漠、剥掉权力外壳。(b) 注意 'more ... than' 的让步结构——他承认有错，但把自己主要写成受害者，所以要判“部分自觉”，不能说“他已经完全悔悟”。", "source": "King Lear Act 3 Scene 2 (quote: Shakespeare, King Lear 3.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the storm externalises Lear's inner rage and gives his fury a cosmic scale.", "m": 1}, {"t": "it is also indifferent nature: wind and rain do not answer him, which cuts human authority down to size.", "m": 1}, {"t": "by stripping him of shelter and followers it forces him to confront exposed humanity, preparing the 'poor naked wretches' speech.", "m": 1}, {"t": "he sees himself chiefly as a victim: 'sinn'd against' comes first and carries the weight.", "m": 1}, {"t": "he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial, not full confession.", "m": 1}, {"t": "fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-014", "topic": "李尔王 · poor naked wretches（转折点）", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Poor naked wretches, wheresoe'er you are,\nThat bide the pelting of this pitiless storm ...\nO, I have ta'en\nToo little care of this!\n\nExplain why this speech is a turning point in Lear's moral understanding. (4 marks)", "options": [], "answer": "1 mark — for the first time he thinks about other people's suffering instead of listing his own injuries.\n1 mark — he admits neglect as a ruler: 'too little care of this' is a confession of political and moral failure.\n1 mark — the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too.\n1 mark — the insight only arrives after he loses power and shelter, so suffering becomes his teacher; the lesson costs him everything.", "explanation": "4 分：①第一次想到别人的苦 ②承认统治者失责 ③具体意象让贫穷变成可感之物 ④这份觉悟是“失去权力”换来的。答题不要停在第①点，否则只拿 1 分。", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "for the first time he thinks about other people's suffering instead of listing his own injuries.", "m": 1}, {"t": "he admits neglect as a ruler: 'too little care of this' is a confession of political and moral failure.", "m": 1}, {"t": "the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too.", "m": 1}, {"t": "the insight only arrives after he loses power and shelter, so suffering becomes his teacher; the lesson costs him everything.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-015", "topic": "李尔王 · 「lendings」与身份剥除", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Is man no more than this? Consider him well. ...\nOff, off, you lendings! come unbutton here.\n\nWhat does Lear's stripping off his clothes represent? (3 marks)", "options": [], "answer": "1 mark — 'lendings' treats clothes as borrowed status rather than as part of the self.\n1 mark — stripping tests what a human being is when rank, retinue and clothing are removed.\n1 mark — it dramatises the play's theme of identity: a king discovers he is only 'a poor, bare, forked animal', which is both a loss and a form of truth.", "explanation": "3 分：衣服＝借来的身份、剥衣＝把人还原为“赤裸的人类”、以及这动作同时是失去也是觉悟。能点到 'poor, bare, forked animal' 的悖论更好（不必逐字引）。", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "'lendings' treats clothes as borrowed status rather than as part of the self.", "m": 1}, {"t": "stripping tests what a human being is when rank, retinue and clothing are removed.", "m": 1}, {"t": "it dramatises the play's theme of identity: a king discovers he is only 'a poor, bare, forked animal', which is both a loss and a form of truth.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-016", "topic": "李尔王 · Gloucester 失明（Act 3 Sc 7）", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 7:\n\nCORNWALL: Out, vile jelly!\nWhere is thy lustre now?\n\n(Gloucester has just been bound to a chair and blinded.)\n\nHow does Shakespeare make Gloucester's blinding more than physical violence? (4 marks)", "options": [], "answer": "1 mark — the language ('vile jelly', 'lustre') turns eyes into objects, so the horror is deliberately grotesque rather than heroic.\n1 mark — it literalises the blindness motif: Gloucester is punished in his eyes for the moral blindness that let Edmund deceive him.\n1 mark — the staging is an abuse of power (a bound guest, a host's authority turned to torture), echoing Lear's abuse of Cordelia and Kent.\n1 mark — the audience is forced to watch what the characters refused to see, so the scene makes sight a moral act for the viewer as well.", "explanation": "这题要说明“字面失明 = 隐喻失明的兑现”：Gloucester 因看不清 Edmund 而失去眼睛；同时暴行是权力滥用，与 Lear 放逐亲人形成平行。最后一点答“观众被迫看见”可拿第 4 分。", "source": "King Lear Act 3 Scene 7 (quote: Shakespeare, King Lear 3.7); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the language ('vile jelly', 'lustre') turns eyes into objects, so the horror is deliberately grotesque rather than heroic.", "m": 1}, {"t": "it literalises the blindness motif: Gloucester is punished in his eyes for the moral blindness that let Edmund deceive him.", "m": 1}, {"t": "the staging is an abuse of power (a bound guest, a host's authority turned to torture), echoing Lear's abuse of Cordelia and Kent.", "m": 1}, {"t": "the audience is forced to watch what the characters refused to see, so the scene makes sight a moral act for the viewer as well.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-017", "topic": "李尔王 · 「I stumbled when I saw」的反讽", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: I have no way, and therefore want no eyes;\nI stumbled when I saw ...\n\nExplain the irony in Gloucester's lines. (3 marks)", "options": [], "answer": "1 mark — when he had eyes he was morally blind, refusing to see Edmund's treachery and turning against Edgar.\n1 mark — now that he is physically blind he sees his own errors and Edgar's love, so insight arrives after sight is gone.\n1 mark — the paradox 'I stumbled when I saw' states the play's inversion: physical sight and moral vision are opposites, which also describes Lear's journey.", "explanation": "3 分：①有眼时看不见真相 ②失明后才看清 ③点明全剧“视力/洞察”倒置的悖论。答题时最好把 Gloucester 与 Lear 的平行关系带一句，显示整体理解。", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "when he had eyes he was morally blind, refusing to see Edmund's treachery and turning against Edgar.", "m": 1}, {"t": "now that he is physically blind he sees his own errors and Edgar's love, so insight arrives after sight is gone.", "m": 1}, {"t": "the paradox 'I stumbled when I saw' states the play's inversion: physical sight and moral vision are opposites, which also describes Lear's journey.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-018", "topic": "李尔王 · Edmund 的价值观与戏剧功能", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 2:\n\nEDMUND: Thou, Nature, art my goddess; to thy law\nMy services are bound.\n\n(a) What does Edmund's address to Nature reveal about his values? (2 marks)\n(b) Explain Edmund's dramatic function in the play. (3 marks)", "options": [], "answer": "(a) 1 mark — he rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead.\n1 mark — his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority.\n(b) 1 mark — he is the engine of the plot: the forged letter sets Edgar running and destroys Gloucester's trust.\n1 mark — his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error.\n1 mark — his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern, not an accident.", "explanation": "(a) Edmund 把“自然”当女神，其实是把私欲合法化。(b) 三条功能：推动情节（伪造信件）、揭出他人的“看不见”、以及用平行情节强化主题。答到“恶的引擎”与“镜像结构”即可满分。", "source": "King Lear Act 1 Scene 2 (quote: Shakespeare, King Lear 1.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "he rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead.", "m": 1}, {"t": "his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority.", "m": 1}, {"t": "he is the engine of the plot: the forged letter sets Edgar running and destroys Gloucester's trust.", "m": 1}, {"t": "his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error.", "m": 1}, {"t": "his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern, not an accident.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-019", "topic": "李尔王 · 伪造信与戏剧反讽", "difficulty": "medium", "type": "short", "stem": "Section 1 — scene description (no quotation):\n\nIn Act 1 Scene 2 Edmund shows his father Gloucester a letter that he has forged in Edgar's handwriting. He then warns Edgar that their father is furious with him and advises him to arm himself and flee.\n\nExplain how Shakespeare creates dramatic irony here and why it matters. (3 marks)", "options": [], "answer": "1 mark — the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter.\n1 mark — each character then acts on information the audience knows to be false, so their choices look like self-destruction.\n1 mark — the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence, trust) can be manufactured.", "explanation": "戏剧反讽的判分点：观众看到 Edmund 同时演两场戏 → 人物依据假信息行动 → 由此证明“看见/信任”是可以被伪造的。第 3 分要提升到主题层，不能只复述情节。", "source": "Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage (Act 1 Scenes 1–3 questions and practice extracts)", "points": [{"t": "the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter.", "m": 1}, {"t": "each character then acts on information the audience knows to be false, so their choices look like self-destruction.", "m": 1}, {"t": "the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence, trust) can be manufactured.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-020", "topic": "李尔王 · 诸神与人的处境", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: As flies to wanton boys, are we to the gods;\nThey kill us for their sport.\n\nWhat view of the gods and of human agency does this image express, and how does it fit the play's tragic vision? (4 marks)", "options": [], "answer": "1 mark — the gods are 'wanton boys': careless, playful and not just, so divine authority is emptied of moral purpose.\n1 mark — humans are flies: small, disposable and without control over their fate.\n1 mark — the image reverses Gloucester's earlier confidence that the gods are just, and it answers Lear's repeated appeals to the heavens.\n1 mark — the play leaves the question open: the innocent die (Cordelia) while the guilty partly escape, so the ending refuses to console the audience with divine justice.", "explanation": "4 分：①神被写成顽童（不义） ②人是苍蝇（无掌控） ③这与 Gloucester 早先“神是公正的”信念相反，并回应 Lear 对诸神的呼喊 ④结局（Cordelia 之死）让“天理”问题悬空，突出悲剧性。", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the gods are 'wanton boys': careless, playful and not just, so divine authority is emptied of moral purpose.", "m": 1}, {"t": "humans are flies: small, disposable and without control over their fate.", "m": 1}, {"t": "the image reverses Gloucester's earlier confidence that the gods are just, and it answers Lear's repeated appeals to the heavens.", "m": 1}, {"t": "the play leaves the question open: the innocent die (Cordelia) while the guilty partly escape, so the ending refuses to console the audience with divine justice.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-021", "topic": "李尔王 · Cordelia 之死与诗性公正", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 5 Scene 3:\n\nLEAR: She's gone for ever!\nI know when one is dead, and when one lives;\nShe's dead as earth. ...\nDo you see this? Look on her, look, her lips,\nLook there, look there!\n\nWhy does Cordelia's death make the ending hard to read as poetic justice? (5 marks)", "options": [], "answer": "1 mark — poetic justice would reward Cordelia's loyalty and punish the guilty in proportion, restoring a moral order.\n1 mark — instead the innocent daughter is hanged on Edmund's order, and the reprieve arrives too late to save her.\n1 mark — Lear's hard-won sight is rewarded only with her corpse: insight and loss arrive at the same moment.\n1 mark — his final 'Look there, look there!' is ambiguous — he may die believing she lives — so the audience is denied a clear consolation.\n1 mark — the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just.", "explanation": "5 分依次是：诗性公正的定义 → 无辜者被处死且救援太迟 → 觉悟与失去同时发生 → 最后台词含糊、不给安慰 → 秩序未恢复，因此“不公”感是刻意的。答题时务必先给“什么是 poetic justice”，否则后面没有对照标准。", "source": "King Lear Act 5 Scene 3 (quote: Shakespeare, King Lear 5.3); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "poetic justice would reward Cordelia's loyalty and punish the guilty in proportion, restoring a moral order.", "m": 1}, {"t": "instead the innocent daughter is hanged on Edmund's order, and the reprieve arrives too late to save her.", "m": 1}, {"t": "Lear's hard-won sight is rewarded only with her corpse: insight and loss arrive at the same moment.", "m": 1}, {"t": "his final 'Look there, look there!' is ambiguous — he may die believing she lives — so the audience is denied a clear consolation.", "m": 1}, {"t": "the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-022", "topic": "李尔王 · 「I am not ague-proof」与身份转变", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 6:\n\nLEAR: They told me I was every thing; 'tis a lie, I am not ague-proof.\n\nWhat does this line show about Lear's changed identity? (4 marks)", "options": [], "answer": "1 mark — he recalls being told he was 'everything': flattery had built a false, unlimited self.\n1 mark — 'tis a lie' is an explicit act of self-correction, spoken by the king about his own former image.\n1 mark — 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man.\n1 mark — the line therefore shows loss producing a truer identity, not simply destroying one, which is central to the play's ending.", "explanation": "4 分：①曾被谄媚塑造成“无所不能” ②亲口否证 ③以身体脆弱（ague = 疟疾）确认普通人的处境 ④因此“失去”也带来更真实的自我。最后一分是主题层，别漏。", "source": "King Lear Act 4 Scene 6 (quote: Shakespeare, King Lear 4.6); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "he recalls being told he was 'everything': flattery had built a false, unlimited self.", "m": 1}, {"t": "'tis a lie' is an explicit act of self-correction, spoken by the king about his own former image.", "m": 1}, {"t": "'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man.", "m": 1}, {"t": "the line therefore shows loss producing a truer identity, not simply destroying one, which is central to the play's ending.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-023", "topic": "比较论文 · thesis 判别", "difficulty": "easy", "type": "mcq", "stem": "Section 2 asks: 'How do Lee and Parker expose systemic racism?' Which thesis best answers the question?", "options": ["Lee's novel is more effective than Parker's film because a novel can explain what characters are thinking, while a film can only show what they do.", "Parker relies on music and camera angles to create meaning, while Lee relies on first-person narration and on dialogue between the characters.", "Both Lee and Parker show racism as a system that shields the guilty, but Lee builds a child's slow awareness while Parker forces the viewer to watch.", "Both texts show that racism is a serious problem in America and that it damages the lives of ordinary people in small towns across the country."], "answer": 2, "explanation": "好 thesis 要同时做到：点两个文本、给一个有争议的论点（racism 是“保护有罪者的制度”）、并预告比较角度（儿童视角 vs 强制观看）。其余选项分别只是泛泛而谈、评优劣、以及罗列手法而没有论点。", "source": "Section 2 · Comparative essay — thesis and introduction (10ENGA unit overview; LEEDER 10ENGB exam outline)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-024", "topic": "比较论文 · 主题句功能", "difficulty": "easy", "type": "mcq", "stem": "What is the main job of a topic sentence in a comparative body paragraph?", "options": ["To provide a quotation from each text and explain what happens in that scene", "To summarise the plot of both texts so the reader can follow the argument", "To introduce the paragraph by naming the text and the technique it will discuss", "To state a comparative claim about both texts that answers part of the essay question"], "answer": 3, "explanation": "主题句＝这一段要证明的「比较性论点」，必须同时覆盖两个文本并回应题目。「To introduce the paragraph by naming the text and the technique it will discuss」只是路标，不是论点；「To provide a quotation from each text and explain what happens in that scene」是证据；「To summarise the plot of both texts so the reader can follow the argument」是复述。", "source": "Section 2 · Comparative essay — body paragraph structure (TKAMB BP1/BP2/BP3 scaffolds)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-025", "topic": "比较论文 · 写 thesis statement", "difficulty": "medium", "type": "short", "stem": "Write a thesis statement for the question: 'How do Lee and Parker represent the failure of justice?' (4 marks)", "options": [], "answer": "Model answer: 'Lee and Parker both show justice failing because the community closes ranks around its own, yet Lee traces that failure through a child's gradual recognition while Parker makes the viewer complicit in seeing it.'\n1 mark — names both composers/texts.\n1 mark — makes one arguable claim about the failure of justice.\n1 mark — signals the comparative angle (how the two composers differ in method).\n1 mark — uses the question's key term ('failure of justice') rather than drifting into a general statement about racism.", "explanation": "评分看四点：两部作品都点到、有一个可争论的论点、有比较角度、扣住题目的关键词。只写“两个文本都表现了司法不公”没有比较，最多 2 分。", "source": "Section 2 · Comparative essay — thesis writing (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "points": [{"t": "names both composers/texts.", "m": 1}, {"t": "makes one arguable claim about the failure of justice.", "m": 1}, {"t": "signals the comparative angle (how the two composers differ in method).", "m": 1}, {"t": "uses the question's key term ('failure of justice') rather than drifting into a general statement about racism.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-026", "topic": "比较论文 · 引文整合策略", "difficulty": "medium", "type": "mcq", "stem": "You want to use one line from the supplied extract in a body paragraph. Which approach integrates it most effectively?", "options": ["Quote only the few words that carry the technique, then analyse how they shape meaning in the whole text.", "Paraphrase the extract without quoting, because quotations take up too much of your word count.", "Quote the line, then say that it shows the theme of justice without explaining how the words create that effect.", "Quote the whole extract so the marker can see you have read it, then explain what it means."], "answer": 0, "explanation": "整合＝短引文嵌入自己的句子，并分析措辞如何产生意义，再连回全文与题目。整段抄（0）是复述，只转述（1）失去语言证据，引而不析（3）拿不到分析分。", "source": "Section 2 · Comparative essay — integrating the supplied extract (LEEDER 10ENGB exam outline, 20 marks)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-027", "topic": "比较论文 · 节选整合的要求", "difficulty": "medium", "type": "short", "stem": "Section 2 requires you to integrate the extract you are given. Explain what this means in practice, and what you should avoid. (4 marks)", "options": [], "answer": "1 mark — quote selectively: a few words that carry the technique or idea you need.\n1 mark — analyse the wording itself (connotation, syntax, imagery) and link it explicitly to the question.\n1 mark — connect the extract to the rest of the text, so the extract is a starting point rather than the whole evidence.\n1 mark — avoid long quotation, mentioning the extract only in the introduction, or turning the extract into plot summary.", "explanation": "四个得分点：短引 → 析词 → 连全文 → 避免“整段抄/只在开头提一句/当情节复述”。这是 Section 2 最容易丢分的地方，评分标准明确写 integrate the extract。", "source": "Section 2 · Comparative essay — extract integration (LEEDER 10ENGB exam outline)", "points": [{"t": "quote selectively: a few words that carry the technique or idea you need.", "m": 1}, {"t": "analyse the wording itself (connotation, syntax, imagery) and link it explicitly to the question.", "m": 1}, {"t": "connect the extract to the rest of the text, so the extract is a starting point rather than the whole evidence.", "m": 1}, {"t": "avoid long quotation, mentioning the extract only in the introduction, or turning the extract into plot summary.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-028", "topic": "比较论文 · 手法对比（叙述 vs 镜头）", "difficulty": "medium", "type": "mcq", "stem": "Which option states a genuine point of comparison between Lee's novel and Parker's film?", "options": ["Lee uses words to describe things and Parker uses pictures, which means the film is easier to understand.", "Lee controls what Scout notices and when she understands it, while Parker controls what the camera shows and when the viewer sees it.", "Lee's novel is set in the 1930s and Parker's film is set in the 1960s, so the film is more historically accurate than the novel.", "Lee's novel has chapters and a narrator, while Parker's film has scenes and actors who speak dialogue."], "answer": 1, "explanation": "有效的比较要落到「作者如何控制信息与读者的反应」：Lee 用 Scout 的有限视角延迟理解，Parker 用取景与剪辑控制观众何时看见。「Lee's novel has chapters and a narrator, while Parker's film has scenes and actors who speak dialogue.」只是媒介形式差异，不构成比较点；「Lee's novel is set in the 1930s and Parker's film is set in the 1960s, so the film is more historically accurate than the novel.」把时代差异当成“更纪实”，没有依据；「Lee uses words to describe things and Parker uses pictures, which means the film is easier to understand.」是媒介常识加无根据判断。", "source": "Section 2 · Comparative essay — comparing literary and film techniques (10ENGA film study: visual storytelling, cinematography, director's purpose)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-029", "topic": "比较论文 · 主题轴「法律失效」", "difficulty": "easy", "type": "mcq", "stem": "Which pair of moments best supports the claim that both texts show the law failing?", "options": ["The novel criticises the town's gossip about Boo Radley, and the film criticises the way the agents speak to local people.", "The novel shows a young child learning about her neighbours, and the film shows two agents slowly learning about a small town.", "Tom Robinson is convicted despite Atticus's defence, and the film's inquiry begins only because local police are implicated.", "Scout narrates the trial from the gallery, and the film's opening shows two water fountains side by side in the street."], "answer": 2, "explanation": "“法律失效”的证据必须直接指向司法/执法：Tom 被判有罪、以及影片中地方执法本身涉案所以只能由联邦介入。其余选项讲的是视角、流言或“学习了解小镇”，都不证明法律失效。", "source": "Section 2 · Comparative essay — theme axis: the law fails (10ENGA unit overview; film study context)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-030", "topic": "比较论文 · 主题轴「个体责任」", "difficulty": "easy", "type": "mcq", "stem": "Which claim best fits the theme of individual responsibility in both texts?", "options": ["Both texts place responsibility on the main characters, since the wider community is never shown to be at fault.", "Both texts place responsibility on families, since children learn prejudice at home and not in public.", "Both texts place responsibility on the law alone, since individuals cannot be held accountable for prejudice.", "Both texts place responsibility on individuals who let prejudice pass unchallenged, not only on the law."], "answer": 3, "explanation": "个体责任＝普通人默许偏见也有责任，责任不止在制度。「Both texts place responsibility on the law alone, since individuals cannot be held accountable for prejudice.」把责任全推给法律，与主题相反；「Both texts place responsibility on families, since children learn prejudice at home and not in public.」把范围缩到家庭；「Both texts place responsibility on the main characters, since the wider community is never shown to be at fault.」说社群无责——三者都与两部作品的立场相反。", "source": "Section 2 · Comparative essay — theme axis: individual responsibility (10ENGA unit overview)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-031", "topic": "比较论文 · 段落规划", "difficulty": "hard", "type": "short", "stem": "Plan one comparative body paragraph for the question: 'How do Lee and Parker expose systemic racism?' Give a topic sentence, one textual point from each text, and the comparison you would draw. (5 marks)", "options": [], "answer": "1 mark — a topic sentence naming both texts and making a comparative claim (e.g. both expose a town that protects its own).\n1 mark — a specific point from Lee's novel: the trial and the town's hierarchy, with the technique that carries it (Scout's limited narration; the courtroom as a stage).\n1 mark — a specific point from Parker's film: for example the opening water-fountain sequence, with the technique that carries it (mid shot, framing, juxtaposition).\n1 mark — a comparison sentence explaining how the two methods differ in effect (delayed recognition vs immediate visual exposure).\n1 mark — a link back to the question's key term 'systemic', showing what the comparison proves.", "explanation": "5 分：主题句（含两文本与比较论点）→ Lee 的证据+手法 → Parker 的证据+手法 → 比较句（效果差异）→ 扣回“制度性”。注意两边的证据都要带手法，只说情节扣不到分析分。", "source": "Section 2 · Comparative essay — paragraph planning (TKAMB BP scaffolds + film deconstruction lessons)", "points": [{"t": "a topic sentence naming both texts and making a comparative claim (e.g. both expose a town that protects its own).", "m": 1}, {"t": "a specific point from Lee's novel: the trial and the town's hierarchy, with the technique that carries it (Scout's limited narration; the courtroom as a stage).", "m": 1}, {"t": "a specific point from Parker's film: for example the opening water-fountain sequence, with the technique that carries it (mid shot, framing, juxtaposition).", "m": 1}, {"t": "a comparison sentence explaining how the two methods differ in effect (delayed recognition vs immediate visual exposure).", "m": 1}, {"t": "a link back to the question's key term 'systemic', showing what the comparison proves.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-032", "topic": "比较论文 · 结尾回收", "difficulty": "hard", "type": "mcq", "stem": "Which conclusion best completes a comparative essay without simply repeating the introduction?", "options": ["The comparison matters because Lee's slow recognition and Parker's forced witness demand different responses, so empathy must become action.", "In conclusion, both Harper Lee and Alan Parker show that racism is bad, and this is why the two texts are still studied in schools today.", "In conclusion, Lee's novel and Parker's film are both important texts that teach readers and viewers about the dangers of prejudice.", "In conclusion, this essay has discussed characterisation, setting and narrative in To Kill a Mockingbird and Mississippi Burning as I set out."], "answer": 0, "explanation": "结尾要“回收论点并推进”：把比较结果说成对读者/观众的不同道德要求（共情须化为行动），而不是重复论点。其余三项分别是空泛评价、复述结构、以及只重复“反对偏见”的老话。", "source": "Section 2 · Comparative essay — conclusion (LEEDER 10ENGB exam outline: integrate the extract, sustain the argument)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-033", "topic": "写作技巧 · 描述 vs 分析", "difficulty": "easy", "type": "mcq", "stem": "Which sentence analyses rather than describes?", "options": ["Parker uses a mid shot in the opening scene, and a mid shot is a camera shot taken from a medium distance.", "The camera holds both fountains side by side, so segregation becomes an ordinary arrangement the viewer absorbs before judging it.", "In the opening scene Parker shows two water fountains, one for white people and one for black people, standing in the street.", "The scene is effective because it shows the audience that segregation really existed in towns in America at that time."], "answer": 1, "explanation": "分析句要有「手法 → 效果 → 对观者的作用」三步：取景把隔离变成“日常安排”，观众先接受再判断。「In the opening scene Parker shows two water fountains, one for white people and one for black people, standing in the street.」只复述内容；「Parker uses a mid shot in the opening scene, and a mid shot is a camera shot taken from a medium distance.」是术语定义；「The scene is effective because it shows the audience that segregation really existed in towns in America at that time.」是空泛断言，没说清怎么产生效果。", "source": "Writing skills · Analytical vs descriptive sentences (Term 3 weeks 8–10: refining analytical writing)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-034", "topic": "写作技巧 · 什么叫「使用节选」", "difficulty": "easy", "type": "mcq", "stem": "What does it mean to 'use' the extract supplied with an essay question?", "options": ["Copying the extract into your essay so the marker knows you have read the question.", "Mentioning that the extract exists and then writing about the rest of the text only.", "Quoting a few words from the extract inside your own sentence and analysing their effect.", "Summarising the extract in your own words without discussing its language."], "answer": 2, "explanation": "“使用”＝把节选当证据：短引文嵌入自己的句子、分析措辞效果、再连回题目与全文。整段抄、只在开头提一句、或只转述，都不算 integrate。", "source": "Writing skills · Using the supplied extract (LEEDER 10ENGB exam outline, Section 2 criteria)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-035", "topic": "写作技巧 · 写主题句", "difficulty": "medium", "type": "short", "stem": "Write one comparative topic sentence for a paragraph arguing that both texts show communities protecting their own. (3 marks)", "options": [], "answer": "Model answer: 'Both Lee's Maycomb and Parker's Mississippi town close ranks to protect the people who belong, and each composer shows that protection turning into complicity.'\n1 mark — names both texts/communities.\n1 mark — states one comparative claim that answers the question (protection becomes complicity).\n1 mark — signals the comparison of method or effect rather than just listing two facts.", "explanation": "3 分：两部作品都点到、有一个比较性论点（保护→共谋）、并预告比较角度。只写“两边都有社群”是并列而非比较，最多 1 分。", "source": "Writing skills · Topic sentences for comparative paragraphs (TKAMB BP scaffolds)", "points": [{"t": "names both texts/communities.", "m": 1}, {"t": "states one comparative claim that answers the question (protection becomes complicity).", "m": 1}, {"t": "signals the comparison of method or effect rather than just listing two facts.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-036", "topic": "写作技巧 · 比较性主题句", "difficulty": "easy", "type": "mcq", "stem": "Why does a comparative essay need a comparative topic sentence in every body paragraph?", "options": ["Because the examiner only reads the first sentence of each paragraph when marking the essay.", "Because the introduction cannot mention either text and the body must do it instead.", "Because quotations from two texts must appear in the same sentence for the essay to count.", "Because the argument must run across both texts, so every paragraph has to keep both in view."], "answer": 3, "explanation": "比较论文的分数来自“贯穿全文的比较论证”，所以每段主题句都要同时覆盖两个文本并推进论点。其余选项都是关于阅卷或格式的错误说法。", "source": "Writing skills · Comparative topic sentences (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "his-001", "topic": "年考术语 · 单极格局", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines unipolarity?", "options": ["One state is dominant, with no rival of comparable power", "Power is dispersed among several competing great powers", "Power is shared between two rival blocs that balance each other", "Power rests with whichever state acts first without consulting others"], "answer": 0, "explanation": "单极＝只有一个占绝对优势的力量中心，没有同级对手。两极是冷战的美苏互衡，多极是多方均衡；「Power rests with whichever state acts first without consulting others」 描述的是单边主义的行事方式，不是权力结构。", "source": "Term 4 · Yearly Assessment Notification — Section One（Unipolarity）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-002", "topic": "年考术语 · 多边行动", "difficulty": "easy", "type": "mcq", "stem": "Which action is the clearest example of multilateral action?", "options": ["One state acting alone without notifying any other government", "A coalition of states acting together under UN Security Council authorisation", "One state threatening to act alone unless its allies fall into line", "Two neighbouring states signing a border and trade agreement"], "answer": 1, "explanation": "multilateral 指多国共同参与、通常经国际机构协调的行动，关键词是「多国＋授权」。「One state acting alone without notifying any other government」 和 「One state threatening to act alone unless its allies fall into line」 是单边；「Two neighbouring states signing a border and trade agreement」 只有两国，属 bilateral，不是 multilateral。", "source": "Term 4 · Yearly Assessment Notification — Section One（Multilateral）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-003", "topic": "年考术语 · 单边主义", "difficulty": "medium", "type": "mcq", "stem": "A government repeatedly insists it will act alone when allies disagree, even at the cost of isolation. This pattern of behaviour is best described as:", "options": ["Humanitarian intervention — force to protect civilians", "Multilateralism — several states act together", "Unilateralism — the habit of acting alone by choice", "Collective security — allies respond together"], "answer": 2, "explanation": "unilateralism 是一种「偏好／习惯」：明知盟友反对仍倾向自行行动。collective security 强调集体回应侵略，multilateralism 强调多国协调，都与题干相反。", "source": "Term 4 · Yearly Assessment Notification — Section One（Unilateralism）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-004", "topic": "年考术语 · 集体安全", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines collective security?", "options": ["A single state decides when and where military force will be used", "Each state builds enough weapons to deter rivals without any allies", "A powerful state intervenes inside another to stop human rights abuses", "States agree that an attack on one member is an attack on all"], "answer": 3, "explanation": "集体安全的核心是「一国受攻＝全体受攻」，成员共同回应（通常经联合国）。「Each state builds enough weapons to deter rivals without any allies」 是自行威慑，「A powerful state intervenes inside another to stop human rights abuses」 是人道干预，「A single state decides when and where military force will be used」 是单边决策。", "source": "Term 4 · Yearly Assessment Notification — Section One（Collective Security）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-005", "topic": "年考术语 · 集体安全 vs 人道干预", "difficulty": "medium", "type": "mcq", "stem": "Which action is the clearest example of collective security rather than humanitarian intervention?", "options": ["A UN-authorised coalition repelling Iraq's 1990 invasion of Kuwait", "US troops landing in Somalia in 1992 to protect food convoys", "US-led forces invading Iraq in 2003 without any explicit UN approval", "NATO aircraft bombing Serbia in 1999 to stop ethnic cleansing"], "answer": 0, "explanation": "海湾战争回应的是「跨国侵略」这一对成员国的攻击，属集体安全的典型。其余三个的动因都是保护平民或推翻政权，属人道干预或先发制人，不是集体安全。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Gulf War 1991）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-006", "topic": "年考术语 · 先发制人", "difficulty": "easy", "type": "mcq", "stem": "In the Bush Doctrine, pre-emption means:", "options": ["Intervening to stop a government killing its own citizens", "Striking first at a state or group judged to pose a future threat", "Waiting for an attack, then responding with UN approval", "Working through alliances so no single state decides on war"], "answer": 1, "explanation": "先发制人把动武时点前移到「威胁可能成真」之前，不等待实际攻击发生。这正是 Bush Doctrine 与集体安全、人道干预的关键区别。", "source": "Term 4 · Yearly Assessment Notification — Section One（Pre-emption）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-007", "topic": "年考术语 · 先发制人 vs 人道干预", "difficulty": "medium", "type": "mcq", "stem": "Which feature most clearly separates pre-emption from humanitarian intervention?", "options": ["Pre-emption targets only non-state groups; intervention only states", "Pre-emption is always multilateral; intervention is always unilateral in form", "Pre-emption answers a future threat; intervention answers harm under way", "Pre-emption always needs UN authorisation; intervention never does"], "answer": 2, "explanation": "区分点在「威胁的时间性」：先发制人针对尚未发生的威胁，人道干预针对正在发生的大规模伤害。授权方式、参与国数量、目标类型都不是二者的分界。", "source": "Term 4 · Yearly Assessment Notification — Section One（Pre-emption / Humanitarian Intervention）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-008", "topic": "年考术语 · 人道干预", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines humanitarian intervention?", "options": ["Defensive action taken after a direct attack on one's own soil", "Military action to seize disputed territory and its natural resources", "Economic sanctions agreed by a regional trade or security organisation", "Military action inside a state, without consent, to stop mass suffering"], "answer": 3, "explanation": "人道干预的三个要件：进入他国、未经该国同意、目的是制止大规模人道灾难。「Economic sanctions agreed by a regional trade or security organisation」 是制裁而非军事干预，「Defensive action taken after a direct attack on one's own soil」 是自卫。", "source": "Term 4 · Yearly Assessment Notification — Section One（Humanitarian Intervention）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-009", "topic": "年考术语 · 单边与多边辨析", "difficulty": "medium", "type": "mcq", "stem": "In 2003 State A went to war with a small group of allies after failing to win UN Security Council support, while State B sent troops to a UN-authorised mission. Which pairing is correct?", "options": ["A — unilateral action; B — multilateral action", "A — multilateral action; B — unilateral action", "A — collective security; B — humanitarian intervention", "A — humanitarian intervention; B — collective security"], "answer": 0, "explanation": "判准是「是否有广泛授权」：A 只带少数盟友、绕过安理会，属单边；B 参与联合国授权任务，属多边。注意 A 虽有盟友，但「小圈子＋无授权」仍被归为单边行动。", "source": "Term 4 · Yearly Assessment Notification — Body 2（invasion of Iraq）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-010", "topic": "年考术语 · unilateral 与 unilateralism", "difficulty": "medium", "type": "mcq", "stem": "Why does the course list both 'unilateral' and 'unilateralism' as separate terms?", "options": ["'Unilateralism' describes one action; 'unilateral' a whole doctrine", "'Unilateral' is one action taken alone; 'unilateralism' is the doctrine", "They are synonyms, listed twice for emphasis in the notes", "'Unilateral' describes economic policy; 'unilateralism' military policy"], "answer": 1, "explanation": "unilateral 是形容词，描述「单方采取的一次行动」；unilateralism 是名词，指「倾向单方行动的主义／政策取向」。Section One 考 metalanguage，正是要辨清词性与层级。", "source": "Term 4 · Yearly Assessment Notification — Section One（Unilateral / Unilateralism）", "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-011", "topic": "年考论证 · Body 1 选材", "difficulty": "easy", "type": "short", "stem": "Body 1 of the essay covers the 1990s. Name the two events from the notification's list that you would use, and justify your choice in one sentence. (2 marks)", "options": [], "answer": "The Gulf War (1991) and Somalia (1992–94). Together they show the two ends of the decade: a UN-authorised, broadly multilateral success, and a humanitarian mission whose failure produced a rapid US withdrawal and shaped later reluctance to intervene.", "explanation": "Body 1 只需两个事件，但要形成「对照」而非并列：一个成功多边、一个暴露局限。选 Gulf War＋Somalia、或 Gulf War＋Kosovo 都可，关键是说明为何这两个能支撑主题句。", "source": "Term 4 · Yearly Assessment Notification — Body 1（possible events）", "points": [{"t": "The Gulf War (1991) and Somalia (1992–94)", "m": 1}, {"t": "Together they show the two ends of the decade: a UN-authorised, broadly multilateral success, and a humanitarian mission whose failure produced a rapid US withdrawal and shaped later reluctance to intervene", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-012", "topic": "年考论证 · 海湾战争与多边主义", "difficulty": "easy", "type": "short", "stem": "Explain how the Gulf War of 1991 demonstrates multilateralism. (2 marks)", "options": [], "answer": "The United States led a broad coalition of states acting with United Nations Security Council authorisation to reverse Iraq's invasion of Kuwait, so the response was collectively authorised and its costs and risks were shared rather than carried by one state.", "explanation": "多边主义的两个标志：联合国授权＋多国共同承担。答题要写出「谁授权、多少方参与、为何这算多边」，只写「很多国家参加」不够。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Gulf War 1991）", "points": [{"t": "The United States led a broad coalition of states acting with United Nations Security Council authorisation to reverse Iraq's invasion of Kuwait, so the response was collectively authorised and its costs and risks were shared rather than carried by one state.", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-013", "topic": "年考论证 · 海湾战争为何属集体安全", "difficulty": "medium", "type": "short", "stem": "Explain why the Gulf War of 1991 is better described as collective security than as humanitarian intervention. (3 marks)", "options": [], "answer": "The war responded to a cross-border act of aggression — Iraq's invasion and annexation of Kuwait — and was authorised collectively against that aggression. Its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government, which is the trigger that defines humanitarian intervention.", "explanation": "关键分界是「触发原因」：集体安全回应国家对国家的侵略，人道干预回应政府对自己人民的伤害。海湾战争是前者，1990 年代后期科索沃才是后者的争议案例。", "source": "Term 4 · Yearly Assessment Notification — Section One + Body 1", "points": [{"t": "The war responded to a cross-border act of aggression — Iraq's invasion and annexation of Kuwait — and was authorised collectively against that aggression", "m": 1}, {"t": "Its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government, which is the trigger that defines humanitarian intervention", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-014", "topic": "年考论证 · 索马里与人道干预的局限", "difficulty": "medium", "type": "short", "stem": "What did the US experience in Somalia (1992–94) reveal about the limits of humanitarian intervention? (3 marks)", "options": [], "answer": "A humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias, and the deaths of US soldiers in 1993 led to a rapid withdrawal. It showed that without clear objectives and local consent, casualties can end an intervention before it stabilises the country.", "explanation": "索马里常被用作「干预容易、收尾困难」的反面教材：任务目标从送粮扩到战斗、伤亡引发国内压力、最后撤军。写清这条因果链才能拿满分。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Somalia 1992-94）＋ 课程标准补充", "points": [{"t": "A humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias, and the deaths of US soldiers in 1993 led to a rapid withdrawal", "m": 1}, {"t": "It showed that without clear objectives and local consent, casualties can end an intervention before it stabilises the country", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-015", "topic": "年考论证 · 卢旺达 1994 的干预失败", "difficulty": "medium", "type": "short", "stem": "Why is Rwanda (1994) usually described as a failure of humanitarian intervention? (3 marks)", "options": [], "answer": "The genocide of Tutsi and moderate Hutu civilians was carried out while the international community had a small, under-resourced peacekeeping force on the ground and refused to reinforce it or even to describe the killings as genocide. The world stood aside, so the decade's humanitarian language was not matched by action.", "explanation": "答「失败」要有两层：现场力量不足＋大国政治上不愿介入（连 genocide 一词都回避）。这正好与同期科索沃的积极干预形成对照。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Rwanda 1994）＋ 课程标准补充", "points": [{"t": "The genocide of Tutsi and moderate Hutu civilians was carried out while the international community had a small, under-resourced peacekeeping force on the ground and refused to reinforce it or even to describe the killings as genocide", "m": 1}, {"t": "The world stood aside, so the decade's humanitarian language was not matched by action", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-016", "topic": "年考论证 · 科索沃的灰色地带", "difficulty": "hard", "type": "short", "stem": "Why is NATO's 1999 intervention in Kosovo often called a 'grey case' of humanitarian intervention? (4 marks)", "options": [], "answer": "The motive was genuinely humanitarian — halting the ethnic cleansing of Kosovar Albanians — but NATO acted without explicit UN Security Council authorisation, so the intervention was of questionable legality while being widely seen as legitimate. It therefore sits between a legitimate humanitarian rescue and a unilateral use of force by an alliance.", "explanation": "「灰色」＝动机正当但授权缺失：合法性与正当性分离。答题要同时写出两边，只说「救了人」或只说「违法」都拿不到高分。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Kosovo 1999）＋ 课程标准补充", "points": [{"t": "The motive was genuinely humanitarian — halting the ethnic cleansing of Kosovar Albanians — but NATO acted without explicit UN Security Council authorisation, so the intervention was of questionable legality while being widely seen as legitimate", "m": 1}, {"t": "It therefore sits between a legitimate humanitarian rescue and a unilateral use of force by an alliance", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-017", "topic": "年考写作 · Body 1 主题句", "difficulty": "medium", "type": "short", "stem": "Write a topic sentence for Body 1 (the 1990s) that directly answers the essay question. (2 marks)", "options": [], "answer": "In the 1990s the United States used its position as the world's single superpower to lead broadly multilateral, UN-authorised interventions, but its retreat from Somalia and its inaction over Rwanda exposed the limits of that approach.", "explanation": "主题句必须含「时段＋论点」，不能只写「1990 年代有很多事件」。好的主题句还会预告张力（多边领导 vs 局限），为结尾 link 句留接口。", "source": "Term 4 · Yearly Assessment Notification — Body 1（topic sentence row）", "points": [{"t": "In the 1990s the United States used its position as the world's single superpower to lead broadly multilateral, UN-authorised interventions, but its retreat from Somalia and its inaction over Rwanda exposed the limits of that approach.", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-018", "topic": "年考论证 · 九一一的转向", "difficulty": "easy", "type": "short", "stem": "Explain how the 9/11 attacks changed the priorities of US foreign policy. (3 marks)", "options": [], "answer": "They shifted US priorities from managing the post-Cold War order to a global 'war on terror'. The response included the invasion of Afghanistan in 2001, expanded surveillance and detention powers, much higher defence spending, and a willingness to use force pre-emptively and with limited international authorisation.", "explanation": "答题锚点是「优先级转移」：从维持后冷战秩序转向反恐。要写出至少两个具体表现（阿富汗、监控、军费、先发制人），不能只写「变得更 aggressive」。", "source": "Term 4 · Lesson 3.1 9/11 Attacks; Notification — Body 2（Impact of 9/11）", "points": [{"t": "They shifted US priorities from managing the post-Cold War order to a global 'war on terror'", "m": 1}, {"t": "The response included the invasion of Afghanistan in 2001, expanded surveillance and detention powers, much higher defence spending, and a willingness to use force pre-emptively and with limited international authorisation", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-019", "topic": "年考论证 · Bush Doctrine 的特征", "difficulty": "easy", "type": "short", "stem": "Outline the key features of the Bush Doctrine. (3 marks)", "options": [], "answer": "Pre-emption — striking first against states or groups judged to pose a future threat; a willingness to act unilaterally when multilateral agreement could not be reached; regime change and the promotion of democracy; and the claim that American security required action beyond UN authorisation.", "explanation": "四个特征要能分别举例对应：先发制人（伊拉克）、单边（绕开安理会）、政权更替（推翻萨达姆）、推广民主。只背名字不解释会失分。", "source": "Term 4 · Lesson 3.2 The Bush Doctrine; Notification — Body 2", "points": [{"t": "Pre-emption — striking first against states or groups judged to pose a future threat", "m": 1}, {"t": "a willingness to act unilaterally when multilateral agreement could not be reached", "m": 1}, {"t": "regime change and the promotion of democracy", "m": 1}, {"t": "and the claim that American security required action beyond UN authorisation", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-020", "topic": "年考论证 · 伊拉克战争为何是单边", "difficulty": "medium", "type": "short", "stem": "Explain why the 2003 invasion of Iraq is often described as unilateral rather than multilateral. (3 marks)", "options": [], "answer": "The United States proceeded with a 'coalition of the willing' after failing to obtain explicit UN Security Council authorisation, and supplied most of the troops and funding itself. Key allies such as France and Germany opposed the war, so it lacked the broad, institutionally authorised coalition that made the 1991 Gulf War multilateral.", "explanation": "判准不是「有没有盟友」，而是「有没有广泛授权与共同承担」。美国确有盟友，但小圈子＋无安理会授权，因此在教材分类中被归为单边。", "source": "Term 4 · Lesson 4.2 Iraq; Notification — Body 2（invasion of Iraq）", "points": [{"t": "The United States proceeded with a 'coalition of the willing' after failing to obtain explicit UN Security Council authorisation, and supplied most of the troops and funding itself", "m": 1}, {"t": "Key allies such as France and Germany opposed the war, so it lacked the broad, institutionally authorised coalition that made the 1991 Gulf War multilateral", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-021", "topic": "年考论证 · 1991 与 2003 对照", "difficulty": "hard", "type": "short", "stem": "Contrast the multilateralism of the 1991 Gulf War with the unilateralism of the 2003 invasion of Iraq. (4 marks)", "options": [], "answer": "In 1991 the United States operated through the UN Security Council, built a large coalition with shared costs, and limited the objective to reversing Iraq's aggression. In 2003 it acted after failing to secure explicit Security Council authorisation, with a smaller ad hoc coalition and US forces dominating, and the objective was regime change and disarmament rather than repelling an attack.", "explanation": "对照要落在三个可比的维度：授权（有／无）、联盟规模与分担（广泛／小圈子）、目标（恢复现状／改变政权）。三点对齐，分数就稳。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Gulf War）＋ Body 2（Iraq）", "points": [{"t": "In 1991 the United States operated through the UN Security Council, built a large coalition with shared costs, and limited the objective to reversing Iraq's aggression", "m": 1}, {"t": "In 2003 it acted after failing to secure explicit Security Council authorisation, with a smaller ad hoc coalition and US forces dominating, and the objective was regime change and disarmament rather than repelling an attack", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-022", "topic": "年考论证 · 中国崛起与单极秩序", "difficulty": "hard", "type": "short", "stem": "Explain how the rise of China challenged unipolarity after 2001. (3 marks)", "options": [], "answer": "China's rapid economic growth, its entry into the World Trade Organization in 2001, sustained military modernisation, and initiatives such as the Belt and Road and the Asian Infrastructure Investment Bank gave it regional and global influence. As a result the United States could no longer act as an unchallenged single pole, especially in the Indo-Pacific.", "explanation": "单极受到挑战＝出现接近同级的对手。答题要给经济（WTO、体量）＋军事＋制度性倡议三类证据，只说「中国变强了」太空泛。", "source": "Term 4 · Yearly Assessment Notification — Body 3（Rise of China）＋ 课程标准补充", "points": [{"t": "China's rapid economic growth, its entry into the World Trade Organization in 2001, sustained military modernisation, and initiatives such as the Belt and Road and the Asian Infrastructure Investment Bank gave it regional and global influence", "m": 1}, {"t": "As a result the United States could no longer act as an unchallenged single pole, especially in the Indo-Pacific", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-023", "topic": "年考论证 · 软实力下降", "difficulty": "easy", "type": "short", "stem": "Explain what a decline in US soft power means, and give one example from the period. (2 marks)", "options": [], "answer": "Soft power is influence gained through attraction — culture, values and institutions — rather than through coercion or payment. The Iraq War and the abuse of prisoners at Abu Ghraib damaged America's international reputation in the 2000s, making other states less willing to cooperate.", "explanation": "软实力＝吸引力（文化、价值、制度），与以军力或金钱施压的硬实力相对。举 2003 年后形象受损的例子最直接。", "source": "Term 4 · Yearly Assessment Notification — Body 3（Decline in US soft power）＋ 课程标准补充", "points": [{"t": "Soft power is influence gained through attraction — culture, values and institutions — rather than through coercion or payment", "m": 1}, {"t": "The Iraq War and the abuse of prisoners at Abu Ghraib damaged America's international reputation in the 2000s, making other states less willing to cooperate", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-024", "topic": "年考论证 · 保护主义与去全球化", "difficulty": "easy", "type": "short", "stem": "Explain how the rise of protectionism and deglobalisation shaped US foreign policy after 2008. (2 marks)", "options": [], "answer": "The global financial crisis and the loss of manufacturing jobs pushed US policy away from promoting free trade. The United States withdrew from the Trans-Pacific Partnership in 2017 and imposed tariffs on Chinese goods from 2018, so trade became a tool of economic pressure rather than of liberal cooperation.", "explanation": "保护主义＝用关税与壁垒保护本国产业；去全球化＝削弱贸易与投资的一体化。答题要给具体政策（退出 TPP、对华关税），否则只是复述定义。", "source": "Term 4 · Yearly Assessment Notification — Body 3（protectionism/deglobalisation）＋ 课程标准补充", "points": [{"t": "The global financial crisis and the loss of manufacturing jobs pushed US policy away from promoting free trade", "m": 1}, {"t": "The United States withdrew from the Trans-Pacific Partnership in 2017 and imposed tariffs on Chinese goods from 2018, so trade became a tool of economic pressure rather than of liberal cooperation", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-025", "topic": "年考论证 · 单极到多极", "difficulty": "hard", "type": "short", "stem": "Explain the shift from unipolarity towards a more multipolar order between 1991 and 2019. (3 marks)", "options": [], "answer": "In 1991 the United States was the only superpower, with no economic or military peer. By 2019 China had become a near-peer economically, the European Union and Russia asserted independent positions, and regional powers had more room to act, so influence was more widely distributed even though the United States remained militarily dominant.", "explanation": "多极化的证据是「权力分散」：经济体量接近、区域大国自主性上升、制度性替代出现。注意区分「军事仍最强」与「总体权力不再独大」。", "source": "Term 4 · Yearly Assessment Notification — Body 3 ＋ 课程标准补充", "points": [{"t": "In 1991 the United States was the only superpower, with no economic or military peer", "m": 1}, {"t": "By 2019 China had become a near-peer economically, the European Union and Russia asserted independent positions, and regional powers had more room to act, so influence was more widely distributed even though the United States remained militarily dominant", "m": 1}], "weak": true, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-026", "topic": "年考写作 · Body 2 的结构", "difficulty": "medium", "type": "short", "stem": "Explain how you would structure Body 2 (9/11 and Iraq) — which events, and what the link sentence must do. (3 marks)", "options": [], "answer": "Open with the 9/11 attacks as the trigger, then the Bush Doctrine as the doctrinal response (pre-emption, unilateralism, regime change), then the invasion of Iraq in 2003 as the application of that doctrine. The link sentence must draw out the change: from multilateral, UN-authorised action in the 1990s to pre-emptive, largely unilateral force.", "explanation": "Body 2 的写法是「触发→理论→实践」三步。link 句不能只说「所以美国变了」，要指明「相对 Body 1 变了什么」。", "source": "Term 4 · Yearly Assessment Notification — Body 2（events to include）", "points": [{"t": "Open with the 9/11 attacks as the trigger, then the Bush Doctrine as the doctrinal response (pre-emption, unilateralism, regime change), then the invasion of Iraq in 2003 as the application of that doctrine", "m": 1}, {"t": "The link sentence must draw out the change: from multilateral, UN-authorised action in the 1990s to pre-emptive, largely unilateral force", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-027", "topic": "年考写作 · 论点句", "difficulty": "hard", "type": "short", "stem": "Write a thesis statement that answers: 'Explain the development of US foreign policy between 1991 and 2019.' (3 marks)", "options": [], "answer": "Between 1991 and 2019, US foreign policy moved from leading multilateral, UN-authorised interventions as the world's single superpower, to asserting pre-emptive and largely unilateral force after 9/11, and finally to defending a declining position against a rising China.", "explanation": "论点句要能覆盖三段而不只是第一段：多边领导 → 单边先发 → 应对衰落。一句话讲清「变化方向」，就是 thesis。", "source": "Term 4 · Yearly Assessment Notification — Section Two（thesis statement row）", "points": [{"t": "Between 1991 and 2019, US foreign policy moved from leading multilateral, UN-authorised interventions as the world's single superpower, to asserting pre-emptive and largely unilateral force after 9/11, and finally to defending a declining position against a rising China.", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "his-028", "topic": "年考写作 · 三段如何合成一条论证线", "difficulty": "hard", "type": "short", "stem": "Explain how the three body paragraphs together answer the essay question. (4 marks)", "options": [], "answer": "Body 1 establishes the multilateral, collective-security phase of the 1990s. Body 2 explains the rupture after 9/11, when pre-emption and unilateralism displaced UN authorisation. Body 3 shows the consequences up to 2019, as China's rise, declining US soft power and a turn to protectionism ended the unipolar moment. Together they trace one line: from multilateral leadership, to unilateral assertiveness, to managed decline.", "explanation": "论述题高分靠「一条线」而不是三段独立：每段是同一变化过程中的一个阶段。答题要写出段与段之间的转折关系，而非各段内容摘要。", "source": "Term 4 · Yearly Assessment Notification — Body 1 / 2 / 3", "points": [{"t": "Body 1 establishes the multilateral, collective-security phase of the 1990s", "m": 1}, {"t": "Body 2 explains the rupture after 9/11, when pre-emption and unilateralism displaced UN authorisation", "m": 1}, {"t": "Body 3 shows the consequences up to 2019, as China's rise, declining US soft power and a turn to protectionism ended the unipolar moment", "m": 1}, {"t": "Together they trace one line: from multilateral leadership, to unilateral assertiveness, to managed decline", "m": 1}], "weak": false, "subj": "his", "subjZh": "历史 · 年考版"}, {"id": "hisother-001", "topic": "大屠杀 · 史料视角分析", "difficulty": "easy", "type": "mcq", "stem": "The Holocaust practice questions set out three steps for 'accounting for the perspective' of a source. After stating what the perspective is, what must you do next?", "options": ["Explain how the perspective appears in the source and why it is there", "Summarise the source in one sentence without using its evidence", "State whether the source is a primary or secondary source", "Describe how long the source is, where it was published and who wrote it"], "answer": 0, "explanation": "材料的三步是：先判断视角（犹太视角还是反犹视角），再说明视角如何在史料中体现、为什么这样呈现。只概括内容而不分析视角，是这类题最常见的失分点。", "source": "Term 1 · Practice Questions.pdf — Account for the perspective of Source A", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-002", "topic": "大屠杀 · 特别行动队", "difficulty": "easy", "type": "mcq", "stem": "In the Lessons 3.2–4.1 sequence, the Einsatzgruppen are described as which of the following?", "options": ["Jewish resistance fighters", "Mobile killing squads", "The Gestapo secret police", "Camp-based killing units"], "answer": 1, "explanation": "课程标题直接写明 The Einsatzgruppen — mobile killing squads。它们随德军进入东欧和苏联，以大规模枪决方式屠杀，与集中营体系是不同的屠杀形式。", "source": "Term 1 · Lessons 3.2–4.1 The Einsatzgruppen (module list)", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-003", "topic": "大屠杀 · 宣传画分析", "difficulty": "hard", "type": "mcq", "stem": "A 1934 Nazi propaganda image shows a Jewish man as greedy and physically repellent while a German family looks healthy and prosperous. Which conclusion is most defensible for a historian?", "options": ["It proves German families were wealthier than Jewish families in 1934", "It shows that antisemitism only began in Germany in 1934", "It shows the regime's dehumanising portrayal, not how Jews lived", "It is too one-sided to be of much use to any historian"], "answer": 2, "explanation": "宣传画的价值在于反映制作者的意图与被推广的刻板印象，而不是事实本身。选「没有价值」是典型错误——偏见本身就是研究纳粹意识形态的重要证据。", "source": "Term 1 · Lesson 1.3 Nazi propaganda & the skill of perspective", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-004", "topic": "大屠杀 · 史料价值判断", "difficulty": "medium", "type": "short", "stem": "Explain why a historian studying Kristallnacht might still find a source produced by a Nazi official valuable, even though it is biased.", "options": [], "answer": "It reveals the perpetrator's perspective, language and motives — what the regime wanted its audience to believe and how it justified the attacks. The bias is itself evidence of Nazi intent, but the source must be checked against other evidence, such as victim testimony.", "explanation": "偏见不等于无价值：犯罪者视角能揭示宣传意图与动机，但要与受害者证词等史料对照使用。答题要落到「谁、为什么这样说」而不是只判断真假。", "source": "Term 1 · Practice Questions.pdf / Lesson 4.1 Propaganda value source analysis", "points": [{"t": "It reveals the perpetrator's perspective, language and motives — what the regime wanted its audience to believe and how it justified the attacks", "m": 1}, {"t": "The bias is itself evidence of Nazi intent, but the source must be checked against other evidence, such as victim testimony", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-005", "topic": "大屠杀 · 内容与视角", "difficulty": "medium", "type": "short", "stem": "Distinguish between a source's content and its perspective, and explain why a historian needs both.", "options": [], "answer": "Content is what the source says or shows — the events, people and details in it. Perspective is the point of view from which it was made, shaped by the author's side, purpose and audience. A historian needs the content as evidence and the perspective to judge how far that evidence can be trusted.", "explanation": "内容回答「说了什么」，视角回答「谁、站在哪一边、为什么这样说」。两者分开，才能既使用史料又评估史料。", "source": "Term 1 · Source Analysis Study Notes / Practice Questions", "points": [{"t": "Content is what the source says or shows — the events, people and details in it", "m": 1}, {"t": "Perspective is the point of view from which it was made, shaped by the author's side, purpose and audience", "m": 1}, {"t": "A historian needs the content as evidence and the perspective to judge how far that evidence can be trusted", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-006", "topic": "冷战 · 波茨坦会议", "difficulty": "easy", "type": "mcq", "stem": "Which conference does Lesson 2.1 use as the starting point for explaining how the Cold War began?", "options": ["The Yalta Conference", "The Versailles Conference", "The Geneva Conference", "The Potsdam Conference"], "answer": 3, "explanation": "材料写明本课目标是理解 the Potsdam Conference and its impact in creating the Cold War Conflict。雅尔塔会议也在战争末期召开，但课程设定的起点是波茨坦。", "source": "Term 2 · Lesson 2.1 Origins of the Cold War (Potsdam Conference)", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-007", "topic": "冷战 · 马歇尔计划与北约", "difficulty": "medium", "type": "mcq", "stem": "Which pairing correctly matches the two containment instruments taught in Lesson 2.3?", "options": ["Marshall Plan — economic aid; NATO — collective security alliance", "Marshall Plan — cultural exchange; NATO — trade agreement", "Marshall Plan — military alliance; NATO — economic aid programme", "Marshall Plan — covert CIA action; NATO — nuclear sharing"], "answer": 0, "explanation": "马歇尔计划用经济援助重建西欧、削弱共产主义的吸引力；北约（1949）是集体安全军事同盟。一文一武，共同构成欧洲的遏制体系。", "source": "Term 2 · Lesson 2.3 The Policy of Containment in Europe — Marshall Plan & NATO", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-008", "topic": "冷战 · 柏林危机 1961", "difficulty": "easy", "type": "mcq", "stem": "What was the immediate result of the Berlin Crisis of 1961?", "options": ["The reunification of Germany under a single government", "The building of the Berlin Wall, dividing East from West Berlin", "The withdrawal of all Soviet troops from East Germany", "The signing of a formal peace treaty formally ending the Cold War"], "answer": 1, "explanation": "1961 年柏林危机中，东德在苏联支持下修建柏林墙阻止人口外流，柏林墙成为冷战分裂的象征。", "source": "Term 2 · Lesson 5.2 The Berlin Crisis (1961)", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-009", "topic": "冷战 · 遏制手段比较", "difficulty": "medium", "type": "short", "stem": "Explain one significant difference between Truman's and Eisenhower's methods of containing communism.", "options": [], "answer": "Truman relied mainly on economic and military aid (the Truman Doctrine, the Marshall Plan) and on collective security through NATO, plus a limited conventional war in Korea. Eisenhower preferred nuclear deterrence, brinkmanship and covert CIA action because it contained communism at a lower cost.", "explanation": "核心差别是手段与成本：杜鲁门重经济援助与同盟，艾森豪威尔重核威慑与隐蔽行动。答题要落到具体政策名称上，不能只写「方式不同」。", "source": "Term 2 · Unit essay question (Lessons 3.2 / 6.1 modelling)", "points": [{"t": "Truman relied mainly on economic and military aid (the Truman Doctrine, the Marshall Plan) and on collective security through NATO, plus a limited conventional war in Korea", "m": 1}, {"t": "Eisenhower preferred nuclear deterrence, brinkmanship and covert CIA action because it contained communism at a lower cost", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-010", "topic": "冷战 · 古巴导弹危机", "difficulty": "hard", "type": "short", "stem": "Explain why the Cuban Missile Crisis of 1962 is treated as the most dangerous moment of the Cold War.", "options": [], "answer": "The discovery of Soviet nuclear missiles in Cuba led to a US naval quarantine and a direct superpower standoff in which any miscalculation could have triggered nuclear war. It ended with the Soviet withdrawal of the missiles and a US pledge not to invade Cuba, and it pushed both sides towards arms control.", "explanation": "危险在于两个核大国直接对峙、决策时间极短；结果是苏联撤导弹、美国承诺不入侵古巴（并秘密撤走驻土耳其导弹），此后双方开始军控谈判。", "source": "Term 2 · Lesson 5.3 JFK and the Cuban Missile Crisis (1962)", "points": [{"t": "The discovery of Soviet nuclear missiles in Cuba led to a US naval quarantine and a direct superpower standoff in which any miscalculation could have triggered nuclear war", "m": 1}, {"t": "It ended with the Soviet withdrawal of the missiles and a US pledge not to invade Cuba, and it pushed both sides towards arms control", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-011", "topic": "民权 · 世界人权宣言", "difficulty": "easy", "type": "mcq", "stem": "Lesson 1.2 examines the significance of the UDHR. Which description of the UDHR is correct?", "options": ["An Australian law passed in 1948 that ended the White Australia Policy", "A document listing the punishments given at the Nuremberg Trials", "A 1948 UN declaration of fundamental rights that influenced later conventions", "A treaty signed only by the United States and the Soviet Union in 1948"], "answer": 2, "explanation": "《世界人权宣言》1948 年由联合国大会通过，本身不是条约，但成为后续人权公约与国内法的规范基础——这正是它「意义」之所在。", "source": "Term 3 · Lesson 1.2 The significance of the UDHR to human rights & freedoms", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-012", "topic": "民权 · 澳洲自由之行", "difficulty": "easy", "type": "mcq", "stem": "According to the Significant Individuals list in the assessment guide, who led the 1965 Freedom Ride?", "options": ["Vincent Lingiari", "Eddie Koiki Mabo", "William Cooper", "Charles Perkins"], "answer": 3, "explanation": "材料明确写 Charles Perkins — led the 1965 Freedom Ride。其他几位分别对应 1966 年 Wave Hill 罢工（Lingiari）、1992 年 Mabo 案、1938 年哀悼日（Cooper）。", "source": "Term 3 · Civil Rights Comic Book Assessment Guide — Significant Individuals", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-013", "topic": "民权 · Mabo 与原住民所有权", "difficulty": "medium", "type": "mcq", "stem": "Which statement explains the significance of Eddie Koiki Mabo's case (1992)?", "options": ["It overturned terra nullius and recognised native title in law", "It created the first Aboriginal community-controlled health service", "It gave Aboriginal Australians the right to vote in elections", "It ended the forced removal of Aboriginal children from families"], "answer": 0, "explanation": "Mabo 判决否定了「无主之地」的法律前提，承认原住民与托雷斯海峡岛民的土地权利，是土地权运动的转折点。", "source": "Term 3 · Assessment Guide — Significant Individuals (Eddie Koiki Mabo)", "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-014", "topic": "民权 · 被偷走的一代", "difficulty": "medium", "type": "short", "stem": "Explain what is meant by the 'Stolen Generations'.", "options": [], "answer": "They are the Aboriginal and Torres Strait Islander children who were forcibly removed from their families by government agencies and church missions under protection and welfare laws, mainly across the twentieth century. The removals broke families and caused long-term trauma that still affects communities.", "explanation": "要点是「被强行带走」而非自愿离开，依据的是各州保护法／福利法；后果是家庭断裂与代际创伤。", "source": "Term 3 · Lesson 5.2 The Stolen Generations", "points": [{"t": "They are the Aboriginal and Torres Strait Islander children who were forcibly removed from their families by government agencies and church missions under protection and welfare laws, mainly across the twentieth century", "m": 1}, {"t": "The removals broke families and caused long-term trauma that still affects communities", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"id": "hisother-015", "topic": "民权 · 土地权与原住民所有权", "difficulty": "hard", "type": "short", "stem": "Distinguish between 'land rights' and 'native title' as used in Lesson 5.3.", "options": [], "answer": "Land rights are grants or recognition of land by government legislation — land returned or given to Aboriginal communities. Native title is a right recognised by the courts as belonging to Aboriginal and Torres Strait Islander peoples whose traditional laws and customs connect them to the land; it is understood to have survived colonisation rather than being granted.", "explanation": "关键差别在来源：land rights 来自立法与政府授予，native title 来自法庭承认的、殖民前即存在的传统权利（Mabo 判决）。", "source": "Term 3 · Lesson 5.3 The Significance of the Land Rights Movement & Native Title", "points": [{"t": "Land rights are grants or recognition of land by government legislation — land returned or given to Aboriginal communities. Native title is a right recognised by the courts as belonging to Aboriginal and Torres Strait Islander peoples whose traditional laws and customs connect them to the land", "m": 1}, {"t": "it is understood to have survived colonisation rather than being granted", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "历史 · 非年考内容"}, {"topic": "A Changing Global Climate · 温室气体", "difficulty": "easy", "type": "mcq", "stem": "Which group lists only greenhouse gases?", "options": ["Carbon dioxide, methane, water vapour", "Oxygen, nitrogen, argon", "Nitrogen, methane, neon", "Oxygen, carbon dioxide, helium"], "answer": 0, "explanation": "温室气体能吸收并再辐射红外线：CO₂、CH₄、水汽、N₂O、CFCs。氧气和氮气占大气 99% 但几乎不吸收红外线，不是温室气体。", "source": "Yearly Study Guide 2026 · Geography Section I（terms / metalanguage）", "id": "geo-001", "weak": false, "subj": "geo", "subjZh": "地理 · 海岸单元考版"}, {"topic": "A Changing Global Climate · 增强温室效应", "difficulty": "easy", "type": "mcq", "stem": "The enhanced greenhouse effect refers to:", "options": ["The reflection of sunlight by clouds", "Extra warming caused by human increases in greenhouse gas concentrations", "The natural warming that keeps Earth habitable", "The cooling effect of volcanic ash"], "answer": 1, "explanation": "自然温室效应让地球平均约 15°C 而不是 −18°C，是必需的；『增强』指人类活动额外增加的温室气体让这个效应变强。", "source": "Yearly Study Guide 2026 · Geography Section I", "id": "geo-002", "weak": false, "subj": "geo", "subjZh":
