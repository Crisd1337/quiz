subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-012", "topic": "运动 · 标量与矢量", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is a vector quantity?", "options": ["Time", "Displacement", "Speed", "Distance"], "answer": 1, "explanation": "位移有大小也有方向，是矢量；距离、速率、时间只有大小，是标量。速度（velocity）和力也是矢量。", "source": "Term 1 · Motion – Half Yearly Revision.pdf（Scalar vs Vector）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-013", "topic": "运动 · 加速度公式", "difficulty": "medium", "type": "mcq", "stem": "A motorcycle travelling at 25 m/s accelerates at 7.0 m/s² for 6.0 s. What is its final speed?", "options": ["175 m/s", "42 m/s", "67 m/s", "56 m/s"], "answer": 2, "explanation": "v_f=v_i+at=25+7.0×6.0=25+42=67 m/s。42 m/s 只是速度的增加量，忘记加上初速度；175 m/s 是 25×7，用错了运算。", "source": "Term 1 · Motion – Acceleration Problems (Practice)（第 10 题）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-014", "topic": "运动 · 运动图像", "difficulty": "medium", "type": "mcq", "stem": "On a velocity–time graph, what does the gradient (slope) of the line represent?", "options": ["The net force", "The distance travelled", "The average speed", "The acceleration"], "answer": 3, "explanation": "v–t 图的斜率＝Δv/Δt＝加速度；线下的面积才代表位移。这是本题最常见的混淆点（面积 vs 斜率）。", "source": "Term 1 · Motion – SG 1.1 Study Guide（velocity–time graph）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-015", "topic": "运动 · 牛顿第二定律", "difficulty": "hard", "type": "short", "stem": "A 1200 kg car travelling at 20 m/s brakes and comes to rest in 5.0 s. Calculate (a) its acceleration and (b) the net force acting on it.", "options": [], "answer": "a = (v_f − v_i)/t = (0 − 20)/5.0 = −4.0 m/s², so the car decelerates at 4.0 m/s². F = ma = 1200 × (−4.0) = −4800 N, that is, a net force of 4800 N opposite to the car's motion.", "explanation": "先用加速度公式（末速减初速除以时间，负号表示减速），再代入 F=ma。合力 4800 N，方向与运动方向相反。", "source": "Term 1 · Motion – Half Yearly Revision.pdf（DESA：average acceleration 与 F = ma）", "points": [{"t": "a = (v_f − v_i)/t = (0 − 20)/5.0 = −4.0 m/s², so the car decelerates at 4.0 m/s²", "m": 1}, {"t": "F = ma = 1200 × (−4.0) = −4800 N, that is, a net force of 4800 N opposite to the car's motion", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-016", "topic": "化学 · 酸与金属反应", "difficulty": "easy", "type": "mcq", "stem": "Magnesium is added to hydrochloric acid and a gas is produced that gives a 'pop' when a lit splint is held to it. Which gas is this?", "options": ["Hydrogen", "Oxygen", "Chlorine", "Carbon dioxide"], "answer": 0, "explanation": "酸＋金属→盐＋氢气，氢气用点燃的木条检验会发出爆鸣声（pop test）。若是酸＋碳酸盐，产生的气体是 CO2，要用石灰水检验。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 5 Answers（Acid-Metal Reaction）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-017", "topic": "化学 · 中和反应", "difficulty": "easy", "type": "short", "stem": "Sodium hydroxide solution is added to hydrochloric acid. Name the type of reaction and write the word equation.", "options": [], "answer": "This is a neutralisation reaction. The word equation is: hydrochloric acid + sodium hydroxide → sodium chloride + water.", "explanation": "酸＋碱→盐＋水，即中和反应。盐的金属部分来自碱（Na⁺），非金属部分来自酸（Cl⁻），所以生成氯化钠。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers（Neutralisation Reaction）", "points": [{"t": "This is a neutralisation reaction", "m": 1}, {"t": "The word equation is: hydrochloric acid + sodium hydroxide → sodium chloride + water", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-018", "topic": "化学 · 碰撞理论", "difficulty": "medium", "type": "mcq", "stem": "Using collision theory, why does raising the temperature increase the rate of a chemical reaction?", "options": ["The concentration of the reacting particles increases.", "Particles gain kinetic energy, so more collisions succeed.", "The particles get larger, so they collide more often.", "The activation energy of the reaction is lowered."], "answer": 1, "explanation": "碰撞理论要求粒子以足够的力和正确的方向相撞。升温提高平均动能，碰撞更频繁、超过活化能的有效碰撞比例更高，所以速率增大；降低活化能是催化剂的作用。", "source": "Term 2 · Reactive Chemistry – 2020 Year 10 Yearly Examination Answers（Part A Q7 碰撞理论）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-019", "topic": "化学 · 酸与碳酸盐", "difficulty": "medium", "type": "short", "stem": "Copper carbonate is added to nitric acid. Write the word equation, name the salt formed, and describe how you would test for the gas produced.", "options": [], "answer": "copper carbonate + nitric acid → copper nitrate + water + carbon dioxide. The salt formed is copper nitrate. Bubble the gas through limewater; if the limewater turns milky (chalky white), the gas is carbon dioxide.", "explanation": "酸＋碳酸盐→盐＋水＋二氧化碳；盐名后半来自酸（硝酸→硝酸盐），所以是 copper nitrate。CO2 用石灰水变浑浊检验，注意不是用点燃的木条。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers（balanced equations / acid-carbonate）", "points": [{"t": "copper carbonate + nitric acid → copper nitrate + water + carbon dioxide. The salt formed is copper nitrate. Bubble the gas through limewater", "m": 1}, {"t": "if the limewater turns milky (chalky white), the gas is carbon dioxide", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-020", "topic": "化学 · 化学方程式配平", "difficulty": "hard", "type": "mcq", "stem": "Which set of coefficients correctly balances this equation: __Al + __HCl → __AlCl₃ + __H₂ ?", "options": ["3, 6, 2, 3", "2, 3, 2, 3", "2, 6, 2, 3", "1, 3, 1, 3"], "answer": 2, "explanation": "2Al+6HCl→2AlCl₃+3H₂：左边 Al 2、H 6、Cl 6；右边 Al 2、Cl 2×3=6、H 3×2=6，两边原子数相等。配平只能改前面的系数，不能改下标。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers（Balanced Equations part 2）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-021", "topic": "核反应 · 同位素", "difficulty": "easy", "type": "mcq", "stem": "Carbon-12 and carbon-14 are both atoms of carbon. How do the two atoms differ?", "options": ["The number of protons", "The number of electrons in a neutral atom", "The number of electron shells", "The number of neutrons"], "answer": 3, "explanation": "同位素指质子数相同、中子数不同的同种元素原子。碳-12 有 6 个中子，碳-14 有 8 个中子；中性原子电子数相同，都是 6 个。", "source": "Term 2 · Nuclear Reactions – atomic_models_interactive_v2.html（Isotopes）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-022", "topic": "核反应 · 恒星核聚变", "difficulty": "medium", "type": "mcq", "stem": "In the core of a main sequence star such as the Sun, hydrogen nuclei are combined to form helium, releasing large amounts of energy. What is this process called?", "options": ["Nuclear fusion", "Nuclear fission of uranium", "Chemical combustion of hydrogen in oxygen", "Radioactive decay of carbon"], "answer": 0, "explanation": "太阳核心约 1500 万 °C，氢核聚变成氦核并释放巨大能量，这正是太阳辐射的来源。它属于核反应，不是化学燃烧（化学燃烧不改变原子核）。", "source": "Term 2 · Nuclear Reactions – The Universe 2020.pptx（Main Sequence Star）+ Revision Booklet Topic 6（solar radiation 定义）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-023", "topic": "核反应 · 放射性测年", "difficulty": "medium", "type": "short", "stem": "Explain how scientists use radioactive carbon (carbon-14) in the remains of a once-living organism to work out when it died.", "options": [], "answer": "While an organism is alive it continuously takes in small amounts of radioactive carbon dioxide from the air. When it dies the intake stops, so the radioactive carbon slowly decays into the non-radioactive form. Measuring how much radioactive carbon is left in the remains therefore shows how long ago the organism died.", "explanation": "活着时不断摄入放射性碳；死亡后摄入停止，放射性碳按固定速率衰变。测剩余比例即可推算死亡时间（绝对测年）。", "source": "Term 2 · Nuclear Reactions – Year 10 - Evolution.pptx（Techniques used to date fossils · Absolute dating）", "points": [{"t": "While an organism is alive it continuously takes in small amounts of radioactive carbon dioxide from the air", "m": 1}, {"t": "When it dies the intake stops, so the radioactive carbon slowly decays into the non-radioactive form", "m": 1}, {"t": "Measuring how much radioactive carbon is left in the remains therefore shows how long ago the organism died", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-024", "topic": "气候 · 温室效应", "difficulty": "easy", "type": "mcq", "stem": "Which statement correctly distinguishes the enhanced greenhouse effect from the natural greenhouse effect?", "options": ["The natural greenhouse effect stops all infrared radiation from leaving the atmosphere.", "The enhanced greenhouse effect is the additional warming caused by human activities releasing abnormally high amounts of greenhouse gases.", "The natural greenhouse effect is caused by human activity, while the enhanced effect is caused by volcanic eruptions.", "The enhanced greenhouse effect only occurs when the ozone layer is destroyed."], "answer": 1, "explanation": "自然温室效应是大气温室气体吸收红外辐射、使地球温度相对稳定；增强温室效应是人类活动额外排放温室气体造成的附加升温。臭氧层空洞是另一个问题，不能混为一谈。", "source": "Term 3 · Climate Science – Term 3 Earth Week 1 Answers（natural vs enhanced greenhouse effect）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-025", "topic": "气候 · 温室气体识别", "difficulty": "easy", "type": "mcq", "stem": "Which gas is a colourless, odourless, incombustible greenhouse gas formed during respiration, combustion and the breakdown of dead organic material?", "options": ["Methane", "Nitrogen", "Carbon dioxide", "Argon"], "answer": 2, "explanation": "题眼是 incombustible（不可燃）：甲烷可燃，氮气和氩气既不是题述来源的产物也不是主要温室气体，所以是二氧化碳。", "source": "Term 3 · Climate Science – 2020 Year 10 Yearly Examination Answers（Part B Q2）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-026", "topic": "气候 · 减缓与适应策略", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is an example of an adaptation strategy rather than a mitigation strategy?", "options": ["Building wind farms to generate electricity without coal", "Capturing and storing carbon dioxide from power stations", "Installing solar panels on the roofs of houses", "Painting roofs white to mimic the albedo effect"], "answer": 3, "explanation": "减缓（mitigation）针对减排、稳定大气温室气体浓度（风能、太阳能、碳封存）；适应（adaptation）针对已经发生的影响、降低社会脆弱性，例如把屋顶刷白提高反照率。", "source": "Term 3 · Climate Science – Revision Booklet（Topic 6 · Mitigation / Adaptation strategies）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-027", "topic": "气候 · 海洋酸化", "difficulty": "hard", "type": "mcq", "stem": "Extra carbon dioxide dissolves in seawater and forms carbonic acid, which releases hydrogen ions. Why does this harm shellfish?", "options": ["The hydrogen ions compete with the shells for carbonate ions, so shellfish cannot build their shells.", "The hydrogen ions dissolve the calcium carbonate shells by raising the pH of the water.", "The extra carbon dioxide warms the water so the shellfish cannot respire.", "The carbonic acid removes calcium from the water so shellfish absorb more carbonate."], "answer": 0, "explanation": "碳酸根是造壳原料，多出的 H⁺ 会与碳酸根结合成碳酸氢根，等于和贝壳“抢”碳酸根，壳体难以生成。另外酸化的方向是 pH 降低，不是升高。", "source": "Term 3 · Climate Science – Term 3 Earth Week 2 Answers（Ocean Acidification）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-028", "topic": "气候 · 冻土正反馈", "difficulty": "hard", "type": "short", "stem": "Large areas of Arctic permafrost are thawing. Explain why this is described as a positive feedback that makes global warming worse.", "options": [], "answer": "Frozen soils store large amounts of organic carbon and methane. When the permafrost thaws, microbes break this material down and release carbon dioxide and methane, which are both greenhouse gases. These extra gases trap more heat, which thaws even more permafrost, so the warming reinforces itself.", "explanation": "链条是：冻土解冻→微生物分解→释放 CO2 和甲烷→温室效应增强→升温→更多冻土解冻。输出反过来加强输入，所以是正反馈。", "source": "Term 3 · Climate Science – SCNSW10CH00393.pdf（Global systems · permafrost）+ Revision Booklet（冻土甲烷）", "points": [{"t": "Frozen soils store large amounts of organic carbon and methane", "m": 1}, {"t": "When the permafrost thaws, microbes break this material down and release carbon dioxide and methane, which are both greenhouse gases", "m": 1}, {"t": "These extra gases trap more heat, which thaws even more permafrost, so the warming reinforces itself", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-029", "topic": "有机化学 · 碳链命名", "difficulty": "easy", "type": "mcq", "stem": "Which name is correct for a straight-chain alkane containing six carbon atoms?", "options": ["Hexene", "Hexane", "Pentane", "Heptane"], "answer": 1, "explanation": "前缀 hex- 表示 6 个碳，烷烃词尾是 -ane，所以是 hexane。hexene 虽然也是 6 个碳但含双键属烯烃，heptane 是 7 个碳。", "source": "Term 3 · Organic Chemistry – KATZ - WEEK 3 LESSONS（Lesson 3 Naming Organic Compounds）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-030", "topic": "有机化学 · 同系物通式", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is the general formula of the alkanes?", "options": ["CnH2n+1OH", "CnH2n−2", "CnH2n+2", "CnH2n"], "answer": 2, "explanation": "烷烃通式 CnH2n+2（例如 n=5 时 C5H12）；烯烃 CnH2n，炔烃 CnH2n−2，最后一个是醇类（含 −OH 官能团）。", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet（Part C Q6）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-031", "topic": "有机化学 · 分馏", "difficulty": "medium", "type": "short", "stem": "Explain how fractional distillation separates crude oil into fractions, and why the smaller molecules are collected near the top of the column.", "options": [], "answer": "Crude oil is heated so that most of it vaporises, and the vapours rise up the fractionating column, which is hot at the bottom and cooler at the top. Each fraction condenses at the level where the temperature falls below its boiling point. Smaller molecules have lower boiling points, so they rise further and are collected near the top.", "explanation": "分馏利用沸点差：塔内温度自下而上降低，各组分在温度低于自身沸点的高度冷凝。小分子沸点低→升得更高→塔顶（LPG、汽油），大分子留在塔底（沥青）。", "source": "Term 3 · Organic Chemistry – KATZ - WEEK 3 LESSONS（Lesson 2 Fractional Distillation）", "points": [{"t": "Crude oil is heated so that most of it vaporises, and the vapours rise up the fractionating column, which is hot at the bottom and cooler at the top", "m": 1}, {"t": "Each fraction condenses at the level where the temperature falls below its boiling point", "m": 1}, {"t": "Smaller molecules have lower boiling points, so they rise further and are collected near the top", "m": 1}], "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-032", "topic": "有机化学 · 支链命名", "difficulty": "hard", "type": "mcq", "stem": "What is the correct IUPAC name of the compound CH₃–CH(CH₃)–CH₂–CH₃?", "options": ["3-methylpentane", "2-methylpropane", "3-methylbutane", "2-methylbutane"], "answer": 3, "explanation": "最长碳链为 4 个碳（butane），甲基支链接在 2 号碳上；编号必须从靠近支链的一端开始以使位号最小，所以是 2-methylbutane。3-methylbutane 是同一分子从另一端编号的错误命名。", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet（Part G Q12）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "sciother-033", "topic": "有机化学 · 分子式判断", "difficulty": "hard", "type": "mcq", "stem": "A hydrocarbon has the molecular formula C₅H₁₀. Could it be an alkane?", "options": ["No, because alkanes follow CnH2n+2, which for five carbons is C₅H₁₂ and not C₅H₁₀.", "Yes, because any compound with five carbon atoms always has ten hydrogen atoms.", "No, because it does not contain enough hydrogen to be a hydrocarbon at all.", "Yes, because it contains only carbon and hydrogen."], "answer": 0, "explanation": "把 n=5 代入烷烃通式 CnH2n+2 得 C5H12；C5H10 少两个氢，符合 CnH2n，属于烯烃（或环烷烃），不可能是直链烷烃。", "source": "Term 3 · Organic Chemistry – Year 10 Organic Chemistry Homework Worksheet（Part N Q32）", "weak": false, "subj": "sciother", "subjZh": "科学 · 非年考内容（Term 1–3）"}, {"id": "matp-001", "topic": "金融数学 · 加班工资", "difficulty": "easy", "type": "mcq", "stem": "Tomas earns $28 per hour for the first 38 hours he works each week. Any hours beyond 38 are paid at time-and-a-half. Last week he worked 45 hours. What was his total pay for the week?", "options": ["$1,358", "$1,890", "$1,260", "$1,456"], "answer": 0, "explanation": "前 38 小时 38×28=$1,064，超时 45−38=7 小时按 1.5 倍时薪 $42 计，7×42=$294，合计 $1,358。常见错误是 45 小时全按基本时薪得 $1,260，或把加班时薪算成双倍得 $1,456。", "source": "Topic1 Interest and Depreciation.pdf · 1-01 Earning an income", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-002", "topic": "金融数学 · 复利（按月）", "difficulty": "medium", "type": "mcq", "stem": "Sophie deposits $1,200 into a savings account that earns 5% per annum, compounded monthly. How much will she have in the account after 3 years?", "options": ["$1,389.15", "$1,393.77", "$1,380.00", "$1,458.61"], "answer": 1, "explanation": "按月复利要把利率和期数同时换成月：R=0.05/12，n=3×12=36，A=1200(1+0.05/12)^36≈$1,393.77。用单利得 $1,380，把 5% 当成年利率只复 3 次得 $1,389.15，都是常见错误。", "source": "1-04_ Compound Interest.pdf · A = P(1 + R)^n（R 为每期利率）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-003", "topic": "金融数学 · 折余折旧", "difficulty": "medium", "type": "short", "stem": "A delivery van is bought for $42,000. It depreciates at 15% per annum using the reducing-balance formula A = P(1 − R)^n. Find (a) its value after 4 years, correct to the nearest dollar, and (b) the total amount it has depreciated over those 4 years.", "options": [], "answer": "(a) A = 42,000 × (1 − 0.15)^4 = 42,000 × 0.85^4 = $21,924. (b) Depreciation = 42,000 − 21,924 = $20,076.", "explanation": "减少率折旧是每年乘 0.85，共 4 次，不是 42,000×(1−0.15×4)。用直线法（每年固定减 $6,300）会得 $16,800，那是另一种模型。", "source": "1-07_ Depreciation.pdf · A = P(1 − R)^n（reducing balance）", "points": [{"t": "(a) A = 42,000 × (1 − 0.15)^4 = 42,000 × 0.85^4 = $21,924", "m": 1}, {"t": "(b) Depreciation = 42,000 − 21,924 = $20,076", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-004", "topic": "代数 · 指数律（幂的乘方）", "difficulty": "easy", "type": "mcq", "stem": "Simplify (3a⁴)².", "options": ["6a⁶", "9a⁶", "9a⁸", "6a⁸"], "answer": 2, "explanation": "括号内每一项都要乘方：3²=9，指数相乘 4×2=8，所以是 9a⁸。只把系数 3 错写成 6，或把 4×2 误算成 6，是两个最常见的错。", "source": "Algebra Topic test + Solutions.pdf · Part A Q12 · 4-01_ Index Laws", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-005", "topic": "代数 · 单项式乘法", "difficulty": "easy", "type": "mcq", "stem": "Simplify 2m × 5m p × 3n.", "options": ["30m np", "30m³np", "10m²np", "30m²np"], "answer": 3, "explanation": "系数 2×5×3=30；m×m=m²（指数相加），p 和 n 各出现一次，结果是 30m²np。把 m×m 当成 2m 会得 10m²np，当成 m³ 则指数加错。", "source": "Topic2 Algebra.pdf · 4-01 The index laws", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-006", "topic": "代数 · 代数分式约分", "difficulty": "medium", "type": "mcq", "stem": "Simplify (6x²y) ÷ (9xy³).", "options": ["2x / (3y²)", "2x / (3y³)", "2y² / (3x)", "3x / (2y²)"], "answer": 0, "explanation": "系数约分 6/9=2/3；同底数相除指数相减：x²÷x=x，y÷y³=1/y²。所以是 2x/(3y²)。把 y 的指数写成 3，或忘记约分系数，都是常见错误。", "source": "4-03_ Multiplying and dividing algebraic fractions.pdf", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-007", "topic": "代数 · 二项式展开", "difficulty": "medium", "type": "mcq", "stem": "Expand and simplify (2x − 5)(3x + 7).", "options": ["6x² + 21x − 35", "6x² − x − 35", "6x² + x − 35", "6x² − 29x − 35"], "answer": 1, "explanation": "逐项相乘得 6x² + 14x − 15x − 35 = 6x² − x − 35。中间项 14x − 15x = −x，若把 −15x 误写成 +15x 就会得到 6x² + 29x 一类的错误。", "source": "4-05_ Expanding Binomial Products.pdf · Algebra Topic test + Solutions.pdf Q24c", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-008", "topic": "代数 · 完全平方中项", "difficulty": "medium", "type": "mcq", "stem": "If (7g + 3)² = 49g² + hg + 9, what is the value of h?", "options": ["84", "14", "42", "21"], "answer": 2, "explanation": "完全平方的中项是 2×7g×3 = 42g，所以 h = 42。只算 7×3 = 21（漏掉公式里的 2）是最常见的错误。", "source": "Algebra Topic test + Solutions.pdf · Part A Q14（perfect squares）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-009", "topic": "代数 · 因式分解", "difficulty": "medium", "type": "short", "stem": "Factorise each expression fully. (a) 12a²b − 21ab²  (b) x² + 7x + 10", "options": [], "answer": "(a) 3ab(4a − 7b)   (b) (x + 5)(x + 2)", "explanation": "(a) 取最大公因式：12 与 21 的 HCF 是 3，字母取公有因子 a、b，得 3ab；括号内 3ab×4a=12a²b、3ab×(−7b)=−21ab²。(b) 找和为 7、积为 10 的两个数，即 5 和 2。", "source": "4-06 Factorising monic quadratics.pdf · 2025 BBHS 10 (5.2) T2 Q14", "points": [{"t": "(a) 3ab(4a − 7b)   (b) (x + 5)(x + 2)", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-010", "topic": "方程 · 一元一次（两边有未知数）", "difficulty": "easy", "type": "mcq", "stem": "Solve 9x + 10 = 7x − 6.", "options": ["x = 8", "x = 2", "x = −2", "x = −8"], "answer": 3, "explanation": "两边同减 7x、同减 10，得 2x = −16，故 x = −8。常见错误是把 10 移项时忘记变号（得 −2），或把 −16 ÷ 2 算成 +8。", "source": "Topic 2 Equations and Inequality.pdf · 6-01 Equations（Example 1c）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-011", "topic": "不等式 · 除以负数变号", "difficulty": "hard", "type": "mcq", "stem": "Solve the inequality −3(x − 2) ≥ 15.", "options": ["x ≤ −3", "x ≤ 3", "x ≥ 3", "x ≥ −3"], "answer": 0, "explanation": "展开得 −3x + 6 ≥ 15，即 −3x ≥ 9；两边同除以 −3 时不等号必须反向，得 x ≤ −3。可以用 x = −4 代回检验：−3(−6)=18 ≥ 15 成立。", "source": "Topic 2 Equations and Inequality.pdf · 6-07 Solving inequalities（除负数要 reverse the sign）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-012", "topic": "方程 · 含分式的方程", "difficulty": "medium", "type": "short", "stem": "Solve x/3 − (x − 2)/4 = 2.", "options": [], "answer": "Multiply every term by 12: 4x − 3(x − 2) = 24, so 4x − 3x + 6 = 24 and x = 18.", "explanation": "分母 3 和 4 的最小公倍数是 12。第二项前的负号要乘进括号，变成 +6；若写成 −6 会得到 x = 6，这是最常见的失分点。", "source": "Topic 2 Equations and Inequality.pdf · 6-02 Equations with algebraic fractions", "points": [{"t": "Multiply every term by 12: 4x − 3(x − 2) = 24, so 4x − 3x + 6 = 24 and x = 18.", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-013", "topic": "联立方程 · 消元法", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations 5x + 2y = 19 and 3x − 2y = 5.", "options": ["x = 3, y = −2", "x = 3, y = 2", "x = 2, y = 3", "x = 4, y = −0.5"], "answer": 1, "explanation": "两式相加消去 y：8x = 24，x = 3；代回第一式得 2y = 19 − 15 = 4，y = 2。干扰项 (4, −0.5) 只满足第一个方程，代回第二个即可排除。", "source": "Topic 2 Simultaneous Equations.pdf · 9-02 The elimination method", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-014", "topic": "联立方程 · 应用建模", "difficulty": "hard", "type": "short", "stem": "At the school canteen, 3 sandwiches and 2 drinks cost $19.50, while 2 sandwiches and 3 drinks cost $18.00. Find the cost of one sandwich and one drink.", "options": [], "answer": "Solve 3s + 2d = 19.50 and 2s + 3d = 18.00 simultaneously: 5s = 22.50, so s = $4.50 and d = $3.00.", "explanation": "先列两个方程，再消元（第一式×3 减第二式×2 得 5s = 22.50）。只用一个条件无法定出两个价格；代回检验 3×4.50+2×3 = $19.50 正确。", "source": "Topic 2 Simultaneous Equations.pdf · 9-04 Simultaneous equations problems", "points": [{"t": "Solve 3s + 2d = 19.50 and 2s + 3d = 18.00 simultaneously: 5s = 22.50, so s = $4.50 and d = $3.00.", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-015", "topic": "坐标几何 · 两点距离", "difficulty": "easy", "type": "mcq", "stem": "Find the distance between the points (2, −1) and (5, 3).", "options": ["7", "√7", "5", "25"], "answer": 2, "explanation": "d = √[(5−2)² + (3−(−1))²] = √(9+16) = √25 = 5。忘记开方会得 25，把两段差直接相加会得 7。", "source": "Topic 1 Coordinate Geometry.pdf · 2-01 Length, midpoint and gradient of an interval", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-016", "topic": "坐标几何 · 斜率", "difficulty": "easy", "type": "mcq", "stem": "Find the gradient of the line passing through (2, 5) and (6, −3).", "options": ["2", "−1/2", "1/2", "−2"], "answer": 3, "explanation": "m = (y₂−y₁)/(x₂−x₁) = (−3−5)/(6−2) = −8/4 = −2。上面减下面的顺序颠倒会得 −1/2；漏写负号则得 2。", "source": "Topic 1 Coordinate Geometry.pdf · 2-01 Length, midpoint and gradient of an interval", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-017", "topic": "坐标几何 · 求直线方程", "difficulty": "medium", "type": "mcq", "stem": "Which equation describes the line with gradient 3 that passes through the point (2, −1)?", "options": ["y = 3x − 7", "y = 3x − 1", "y = 3x + 7", "y = −3x + 5"], "answer": 0, "explanation": "代入 y = mx + b：−1 = 3(2) + b，得 b = −7，所以 y = 3x − 7。把已知点的坐标当成 y 轴截距（得 y = 3x − 1）是典型错误。", "source": "Topic 1 Coordinate Geometry.pdf · 2-06 Finding the equation of a line", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-018", "topic": "坐标几何 · 垂直直线", "difficulty": "hard", "type": "short", "stem": "Find the equation of the line that is perpendicular to y = 2x + 5 and passes through the point (4, 1). Give your answer in the form y = mx + b.", "options": [], "answer": "The perpendicular gradient is −1/2, so y − 1 = −1/2 (x − 4), which gives y = −1/2 x + 3.", "explanation": "垂直直线斜率之积为 −1，所以用 −1/2（不是 −2，也不是 2）；再代入 (4, 1) 求截距得 3。验证：x = 4 时 y = −2 + 3 = 1。", "source": "Topic 1 Coordinate Geometry.pdf · 2-07 Equations of parallel and perpendicular lines", "points": [{"t": "The perpendicular gradient is −1/2, so y − 1 = −1/2 (x − 4), which gives y = −1/2 x + 3.", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-019", "topic": "函数 · 正比例", "difficulty": "easy", "type": "mcq", "stem": "y varies directly as x. If y = 12 when x = 5, find x when y = 30.", "options": ["2.5", "12.5", "10", "72"], "answer": 1, "explanation": "正比例写成 y = kx，先求常数 k = 12/5 = 2.4；y = 30 时 x = 30 ÷ 2.4 = 12.5。把比例关系倒过来乘会得到 72。", "source": "Topic 1 Graphs.pdf · 7-01 Direct proportion", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-020", "topic": "函数 · 反比例", "difficulty": "medium", "type": "mcq", "stem": "y is inversely proportional to x. When x = 5, y = 8. Find y when x = 20.", "options": ["0.5", "160", "2", "32"], "answer": 2, "explanation": "反比例写成 y = k/x，由 5×8 得 k = 40；x = 20 时 y = 40/20 = 2。若误当正比例会用 k = 8/5 得 32，是典型错误。", "source": "Topic 1 Graphs.pdf · 7-02 Inverse proportion", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-021", "topic": "函数 · 圆的方程", "difficulty": "easy", "type": "short", "stem": "A circle has equation x² + y² = 49. State its centre and radius, and determine whether the point (5, 5) lies on the circle.", "options": [], "answer": "Centre (0, 0) and radius 7. The point (5, 5) does not lie on the circle, because 5² + 5² = 50, not 49.", "explanation": "x² + y² = r² 的圆心在原点，半径 r = √49 = 7。判断点在不在圆上，只要把坐标代入看左边是否恰好等于 49。", "source": "Topic 1 Graphs.pdf · 7-06 The circle", "points": [{"t": "Centre (0, 0) and radius 7", "m": 1}, {"t": "The point (5, 5) does not lie on the circle, because 5² + 5² = 50, not 49", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-022", "topic": "三角 · 毕氏定理", "difficulty": "easy", "type": "mcq", "stem": "A right-angled triangle has two shorter sides of 9 cm and 12 cm. Find the length of the hypotenuse.", "options": ["225 cm", "21 cm", "108 cm", "15 cm"], "answer": 3, "explanation": "斜边 = √(9² + 12²) = √225 = 15 cm。把两条直角边直接相加得 21，或忘记开方得 225，是最常见的两种错。", "source": "Topic 3 Trigonometry.pdf · 8-01 Pythagoras' theorem", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-023", "topic": "三角 · 用正切求边", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle an angle is 35° and the side adjacent to it is 12 m. Find the length of the opposite side, correct to two decimal places.", "options": ["8.40 m", "6.88 m", "17.14 m", "14.65 m"], "answer": 0, "explanation": "tan 35° = 对边/邻边，所以 opposite = 12 × tan 35° ≈ 8.40 m。选错比值会得 12 sin 35° = 6.88 m 或 12/tan 35° = 17.14 m。", "source": "Topic 3 Trigonometry.pdf · 8-03 Finding an unknown side", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-024", "topic": "三角 · 求未知角", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle, sin θ = 7/12. Find θ, correct to one decimal place.", "options": ["54.3°", "35.7°", "30.3°", "60.0°"], "answer": 1, "explanation": "θ = sin⁻¹(7/12) ≈ 35.7°。用 tan⁻¹(7/12) 得 30.3°，或误取余角 90° − 35.7° = 54.3°，都是常见的按键/概念错误。", "source": "Topic 3 Trigonometry.pdf · 8-04 Finding an unknown angle", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-025", "topic": "三角 · 仰角", "difficulty": "medium", "type": "short", "stem": "From a point on level ground 45 m from the base of a vertical tower, the angle of elevation of the top of the tower is 62°. Find the height of the tower, correct to one decimal place.", "options": [], "answer": "tan 62° = h / 45, so h = 45 × tan 62° ≈ 84.6 m.", "explanation": "仰角是从水平线向上量到视线的角，45 m 是与 62° 相邻的边，所以用 tan。误用 sin 会得 39.7 m，是因为把 45 m 当成了斜边。", "source": "Topic 3 Trigonometry.pdf · 8-05 Angles of elevation and depression", "points": [{"t": "tan 62° = h / 45, so h = 45 × tan 62° ≈ 84.6 m.", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-026", "topic": "三角 · 方位角", "difficulty": "hard", "type": "short", "stem": "A plane flies 15 km due north and then 20 km due east. Find (a) its distance from the starting point and (b) its bearing from the starting point, correct to the nearest degree.", "options": [], "answer": "Distance = √(15² + 20²) = 25 km. Bearing = tan⁻¹(20/15) ≈ 53°, measured clockwise from north, so the bearing is 053°.", "explanation": "方位角一律从正北顺时针量：位移是「北 15、东 20」，所以角度在正北以东 53°。写成 037° 是把 15 和 20 用反了（tan⁻¹(15/20)）。", "source": "Topic 3 Trigonometry.pdf · 8-06 Bearings / 8-07 Problems involving bearings", "points": [{"t": "Distance = √(15² + 20²) = 25 km", "m": 1}, {"t": "Bearing = tan⁻¹(20/15) ≈ 53°, measured clockwise from north, so the bearing is 053°", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-027", "topic": "体积 · 圆柱（直径陷阱）", "difficulty": "easy", "type": "mcq", "stem": "A cylinder has a diameter of 14 cm and a height of 20 cm. Find its volume, correct to one decimal place.", "options": ["1026.3 cm³", "439.8 cm³", "3078.8 cm³", "12315.0 cm³"], "answer": 2, "explanation": "先求半径 r = 14 ÷ 2 = 7 cm，V = πr²h = π × 49 × 20 = 980π ≈ 3078.8 cm³。直接把直径当半径会得 12315.0 cm³，这是本题最主要的陷阱。", "source": "Topic3 Surface area and Volume.pdf · 3-05 Volumes of prisms and cylinders（V = πr²h）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-028", "topic": "面积 · 组合图形", "difficulty": "medium", "type": "mcq", "stem": "A shape is made by attaching a semicircle of radius 4 cm to one side of a rectangle measuring 12 cm by 8 cm. Find the total area, correct to one decimal place.", "options": ["146.3 cm²", "96.0 cm²", "108.6 cm²", "121.1 cm²"], "answer": 3, "explanation": "矩形 12 × 8 = 96 cm²，半圆 ½ × π × 4² = 8π ≈ 25.13 cm²，合计 ≈ 121.1 cm²。忘记取一半会得 146.3，只算四分之一圆会得 108.6。", "source": "Topic3 Surface area and Volume.pdf · 3-01 Areas of composite shapes", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-029", "topic": "表面积 · 圆柱与涂漆成本", "difficulty": "hard", "type": "short", "stem": "A cylindrical water tank has a radius of 5 m and a height of 10 m. Its entire surface, including the top and the bottom, is to be painted. (a) Find the total surface area, correct to the nearest square metre. (b) If paint costs $12 per square metre, find the total cost.", "options": [], "answer": "(a) SA = 2πr² + 2πrh = 50π + 100π = 150π ≈ 471.24 m², so 471 m². (b) Cost = 471 × 12 = $5,652.", "explanation": "两个圆面加一个侧面共 150π。只算侧面（100π ≈ 314 m²）会漏掉顶和底；若中间不四舍五入、用 471.24 × 12 得 $5,654.88，也算正确。", "source": "2025 BBHS 10 (5.2) T2 - soln.pdf · Q19 · Topic3 Surface area and Volume.pdf", "points": [{"t": "(a) SA = 2πr² + 2πrh = 50π + 100π = 150π ≈ 471.24 m², so 471 m²", "m": 1}, {"t": "(b) Cost = 471 × 12 = $5,652", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-030", "topic": "统计 · 分布形状", "difficulty": "easy", "type": "mcq", "stem": "A data distribution has a long tail extending towards the higher scores. How is this distribution described?", "options": ["Positively skewed", "Negatively skewed", "Symmetrical", "Bimodal"], "answer": 0, "explanation": "尾部指向高分一侧叫 positively skewed（正偏）；负偏的尾指向低分一侧。两者最容易记反，记法是「尾巴往哪边甩，就叫哪边偏」。", "source": "Topic 1 Investigating Data.pdf · 5-01 The shape of a frequency distribution", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-031", "topic": "统计 · 四分位距 IQR", "difficulty": "easy", "type": "mcq", "stem": "Find the interquartile range of the data set 4, 7, 7, 9, 12, 15, 15, 18, 20, 22.", "options": ["8", "11", "13.5", "18"], "answer": 1, "explanation": "n = 10，中位数 = (12+15)/2 = 13.5；下半组中位数 Q1 = 7，上半组中位数 Q3 = 18，IQR = 18 − 7 = 11。选 13.5 是把它当成 IQR 了，其实那是中位数。", "source": "Topic 1 Investigating Data.pdf · 5-02 Quartiles and interquartile range", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-032", "topic": "统计 · 五数概括与偏度", "difficulty": "hard", "type": "short", "stem": "The ages of 13 participants in a sports event are: 12, 14, 15, 16, 17, 17, 18, 20, 21, 22, 25, 27, 30. (a) Write the five-number summary. (b) Calculate the interquartile range. (c) State, with a reason, whether the distribution is symmetrical or skewed.", "options": [], "answer": "(a) Lowest 12, Q1 = 15.5, median = 18, Q3 = 23.5, highest 30. (b) IQR = 23.5 − 15.5 = 8. (c) Positively skewed, because the upper whisker (23.5 to 30) is longer than the lower whisker (12 to 15.5).", "explanation": "13 个数中，中位数取第 7 个；Q1、Q3 分别取上下各 6 个数的中位数。上须 6.5 比下须 3.5 长，说明高分一侧拖尾，所以是正偏。", "source": "Topic 1 Investigating Data.pdf · 5-03 Boxplots · 2025 BBHS 10 (5.2) T2 - soln.pdf Q9", "points": [{"t": "(a) Lowest 12, Q1 = 15.5, median = 18, Q3 = 23.5, highest 30", "m": 1}, {"t": "(b) IQR = 23.5 − 15.5 = 8", "m": 1}, {"t": "(c) Positively skewed, because the upper whisker (23.5 to 30) is longer than the lower whisker (12 to 15.5)", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-033", "topic": "概率 · 韦恩图（至少/都不）", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play basketball and 6 play both. How many students play neither sport?", "options": ["0", "12", "6", "24"], "answer": 2, "explanation": "至少会一项的人数 = 18 + 12 − 6 = 24，其中交集 6 人被数了两次，必须减掉。所以两项都不玩的有 30 − 24 = 6 人。忘记减交集会算成 0。", "source": "Topic 3 Probability.pdf · 10-02 Venn diagrams", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-034", "topic": "概率 · 双向表与条件概率", "difficulty": "hard", "type": "mcq", "stem": "Year 11 students were surveyed about part-time work. The results were: male with part-time work 43, male without part-time work 27, female with part-time work 35, female without part-time work 31. What is the probability that a randomly selected student works part-time, given that the student is male?", "options": ["70/136", "43/78", "43/136", "43/70"], "answer": 3, "explanation": "条件概率的分母必须是「已知是男生」的总人数 43 + 27 = 70，所以是 43/70。用全校 136 人（43/136）或所有兼职者 78 人（43/78）作分母，都是没把条件落到样本空间上。", "source": "Topic 3 Probability.pdf · 10-03 Two-way tables（Example 5）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-035", "topic": "概率 · 不放回抽样", "difficulty": "medium", "type": "short", "stem": "A bag contains 3 red and 5 blue marbles. Two marbles are drawn at random one after the other without replacement. Find the probability that both marbles are red.", "options": [], "answer": "P(both red) = 3/8 × 2/7 = 6/56 = 3/28.", "explanation": "不放回抽样时第二次的样本空间少了一个球，所以是 3/8 × 2/7。写成 3/8 × 3/8 是把不放回当成放回了，这是最常见的错误。", "source": "Topic 3 Probability.pdf · 10-05 Selecting with and without replacement", "points": [{"t": "P(both red) = 3/8 × 2/7 = 6/56 = 3/28.", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-036", "topic": "金融数学 · 应税收入与可扣除项", "difficulty": "easy", "type": "mcq", "stem": "Priya's records for the financial year show: wages $62,400, bank interest $310, a $200 bonus, private school fees $4,800, work-related tool expenses $680, a donation to charity $150, a speeding fine $420 and her tax agent's fee $120. Using Taxable income = gross income − allowable deductions, calculate her taxable income.", "options": ["$61,960", "$63,860", "$56,740", "$62,910"], "answer": 0, "explanation": "收入合计 62,400+310+200 = $62,910；可扣除的只有与赚取收入相关的支出和捐赠：工具费 680 + 捐款 150 + 报税代理费 120 = $950，所以应税收入 = $61,960。私人学费和罚款不属于 allowable deductions，把它们也扣掉会错得 $56,740。", "source": "1-02_ Income tax.pdf（Taxable income = gross income − allowable deductions）· 2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-037", "topic": "金融数学 · 所得税（19c 档）", "difficulty": "easy", "type": "mcq", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Calculate the income tax payable on a taxable income of $30,000.", "options": ["$11,800.00", "$2,242.00", "$3,572.00", "$5,700.00"], "answer": 1, "explanation": "$30,000 落在 19c 档：0.19 × (30,000 − 18,200) = 0.19 × 11,800 = $2,242。必须先减掉 $18,200 的免税门槛，直接用 0.19 × 30,000 会得 $5,700；$11,800 是只减门槛没乘税率。", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q5a（官方答案 $2 242）· 1-02_ Income tax.pdf", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-038", "topic": "金融数学 · 所得税（37c 档）", "difficulty": "medium", "type": "mcq", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Calculate the income tax payable on a taxable income of $150,000.", "options": ["$80,447.00", "$40,297.00", "$43,447.00", "$55,500.00"], "answer": 2, "explanation": "$150,000 在 37c 档：17,547 + 0.37 × (150,000 − 80,000) = 17,547 + 25,900 = $43,447。两个高频错误是漏掉基准金额（0.37 × 150,000 = $55,500）和用错基准（拿顶层 54,547 得 $80,447）；$40,297 是错用上一档 32.5c 算的。", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q5c（官方答案 $43 447）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-039", "topic": "金融数学 · 税率档边界", "difficulty": "hard", "type": "short", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Ann's taxable income is $80,000 and Ben's is $80,001. Ignoring the Medicare levy, calculate the tax each person pays and state how much more tax Ben pays than Ann.", "options": [], "answer": "Ann pays $3,572 + 0.325 × (80,000 − 37,000) = $3,572 + $13,975 = $17,547. Ben pays $17,547 + 0.37 × $1 = $17,547.37. Ben pays 37 cents more than Ann.", "explanation": "税率档是连续的：32.5c 档顶端的金额 17,547 正好等于 37c 档的基准金额，所以 Ben 只多出的那 1 元按 37c 计税，差额只有 37 分。误以为跨档要把全部收入按 37% 重算，会算出几千元的差距。", "source": "2022 Year 10 5.2 Term 1 Revision Booklet.pdf · Exercise 1J Q4（官方答案：37 cents）", "points": [{"t": "Ann pays $3,572 + 0.325 × (80,000 − 37,000) = $3,572 + $13,975 = $17,547", "m": 1}, {"t": "Ben pays $17,547 + 0.37 × $1 = $17,547.37", "m": 1}, {"t": "Ben pays 37 cents more than Ann", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-040", "topic": "金融数学 · 净收入", "difficulty": "medium", "type": "short", "stem": "Australian resident tax rates — $0–$18,200: Nil; $18,201–$37,000: 19c for each $1 over $18,200; $37,001–$80,000: $3,572 plus 32.5c for each $1 over $37,000; $80,001–$180,000: $17,547 plus 37c for each $1 over $80,000; $180,001 and over: $54,547 plus 45c for each $1 over $180,000. Kim's gross pay for the year is $54,300. She has no allowable deductions, so her taxable income is also $54,300. Calculate (a) her income tax payable and (b) her net pay, given that she also pays $960 in other deductions (union fees and health fund contributions).", "options": [], "answer": "(a) Tax = $3,572 + 0.325 × ($54,300 − $37,000) = $3,572 + $5,622.50 = $9,194.50. (b) Net pay = $54,300 − $9,194.50 − $960 = $44,145.50.", "explanation": "净收入公式是 net pay = gross pay − tax − other deductions，税和其他扣除两项都要减。只减税会得 $45,105.50，这是本题最主要的错误。", "source": "1-02_ Income tax.pdf（Net pay = gross pay − tax − other deduction；Example 3）", "points": [{"t": "(a) Tax = $3,572 + 0.325 × ($54,300 − $37,000) = $3,572 + $5,622.50 = $9,194.50", "m": 1}, {"t": "(b) Net pay = $54,300 − $9,194.50 − $960 = $44,145.50", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-041", "topic": "统计 · 标准差的含义", "difficulty": "easy", "type": "mcq", "stem": "Two netball teams each score a mean of 24 goals per game over a season. Team A's scores have a standard deviation of 2.1 goals and Team B's have a standard deviation of 6.4 goals. What does this tell you?", "options": ["Team A's standard deviation must be wrong, because both teams have the same mean.", "Team B scored more goals in total than Team A.", "Both teams had exactly the same range of scores.", "Team A's scores were more consistent from game to game than Team B's."], "answer": 3, "explanation": "标准差衡量数据相对均值的离散程度：两个均值相同时，标准差越大说明每场得分波动越大，所以 A 队更稳定。标准差与总分无关，也不等于极差，所以前两个选项都推不出来。", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation · 2025 BBHS 10 (5.2) T2 Ana (IntDep+Alg+Data+Pav).pdf Q7(e)", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-042", "topic": "统计 · 计算标准差", "difficulty": "medium", "type": "mcq", "stem": "Find the standard deviation of the data set 2, 4, 4, 4, 5, 5, 7, 9, correct to one decimal place. Use σ = √(Σ(x − x̄)² ÷ n).", "options": ["2.0", "2.1", "1.5", "4.0"], "answer": 0, "explanation": "均值 x̄ = 40 ÷ 8 = 5，偏差平方和 = 9+1+1+1+0+0+4+16 = 32，σ = √(32 ÷ 8) = √4 = 2.0。选 4.0 是忘了开方（那是方差）；2.1 是除以 n−1 的样本标准差。", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation（σ = √(Σ(x − x̄)² ÷ n)）", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "matp-043", "topic": "统计 · 均值与标准差", "difficulty": "hard", "type": "short", "stem": "A team scored the following number of goals in its 10 matches: 0, 1, 1, 2, 2, 2, 3, 3, 5, 6. (a) Find the mean. (b) Find the standard deviation, correct to two decimal places, using σ = √(Σ(x − x̄)² ÷ n).", "options": [], "answer": "(a) Mean = 25 ÷ 10 = 2.5 goals. (b) Σ(x − 2.5)² = 30.5, so σ = √(30.5 ÷ 10) = √3.05 ≈ 1.75 goals.", "explanation": "先求均值 2.5，再逐个算偏差平方：6.25+2.25+2.25+0.25+0.25+0.25+0.25+0.25+6.25+12.25 = 30.5，除以 n=10 后开方得 1.75。本题按总体标准差（除以 n）计算；若除以 n−1=9 会得 1.84，那是样本标准差的口径。", "source": "2025 BBHS 10 (5.2) T2 Ana (IntDep+Alg+Data+Pav).pdf · Q7(e) · New Century 10 Standard-Core Textbook.pdf · 5.03", "points": [{"t": "(a) Mean = 25 ÷ 10 = 2.5 goals", "m": 1}, {"t": "(b) Σ(x − 2.5)² = 30.5, so σ = √(30.5 ÷ 10) = √3.05 ≈ 1.75 goals", "m": 1}], "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"topic": "网络 · 术语", "difficulty": "easy", "type": "mcq", "stem": "In a network diagram, the number of edges meeting at a vertex is called its:", "options": ["Order", "Degree", "Weight", "Path"], "answer": 1, "explanation": "一个顶点连出的边数叫度数（degree）。奇度顶点数决定能否一笔画完：全偶数→可回到起点；恰好两个奇数→可一笔画但终点不同。", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard（Networks: terminology）", "id": "matp-044", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"topic": "网络 · 欧拉回路", "difficulty": "medium", "type": "mcq", "stem": "A connected network has vertices with degrees 2, 2, 4, 2, 2. Which statement is true?", "options": ["It has no Eulerian circuit", "It cannot be drawn without lifting the pen", "It has an Eulerian circuit because every vertex has even degree", "It has exactly one odd vertex"], "answer": 2, "explanation": "所有顶点度数都是偶数 → 存在欧拉回路（从任意点出发、每条边走一次并回到起点）。只要有一个奇度点就不成立。", "source": "Yearly Study Guide 2026 · Mathematics Standard（Eulerian trails and circuits）", "id": "matp-045", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"topic": "网络 · 欧拉路径", "difficulty": "medium", "type": "mcq", "stem": "A network has exactly two vertices of odd degree. What can be concluded?", "options": ["No Eulerian trail exists", "The network is not connected", "Every vertex must be visited twice", "An Eulerian trail exists, starting and finishing at the two odd-degree vertices"], "answer": 3, "explanation": "恰好两个奇度点 → 存在欧拉路径（一笔画），必须从一个奇点出发、另一个奇点结束。若想回到起点（回路）则需要全部为偶数。", "source": "Yearly Study Guide 2026 · Mathematics Standard（Eulerian trials and circuits）", "id": "matp-046", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"topic": "网络 · 最小生成树", "difficulty": "hard", "type": "mcq", "stem": "A town must connect four buildings with cable at minimum total length. The possible connections and lengths (km) are AB 2, AC 5, BC 3, BD 4, CD 1. What is the minimum total length?", "options": ["6 km", "10 km", "8 km", "7 km"], "answer": 0, "explanation": "最小生成树=选 3 条边连成整体且不成环。按长度排序：CD 1、AB 2、BC 3 → 三条边连接 A-B-C-D 且无环，总长 1+2+3=6。再加任一条都会成环。", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard（Shortest path and minimum spanning trees）", "id": "matp-047", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"topic": "网络 · 最短路径", "difficulty": "medium", "type": "mcq", "stem": "Using the network in which AB = 2, BC = 3, AC = 5, BD = 4 and CD = 1 (all in km), what is the shortest distance from A to D?", "options": ["7 km", "6 km", "5 km", "9 km"], "answer": 1, "explanation": "所有路线都经过 C 或 B：A→B→D=6，A→B→C→D=6，A→C→D=6。最短为 6 km，所以选 6 km。", "source": "Yearly Study Guide 2026 · Mathematics Core/Standard（Shortest path）", "id": "matp-048", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"topic": "网络 · 平面图", "difficulty": "medium", "type": "mcq", "stem": "A planar graph is one that:", "options": ["Has no cycles", "Has all vertices of equal degree", "Can be drawn on a plane without any edges crossing", "Contains no more than four vertices"], "answer": 2, "explanation": "平面图指能在平面上画出、边彼此不交叉的图。是否看起来交叉不重要，能否重新画成不交叉才重要。", "source": "Yearly Study Guide 2026 · Mathematics Core（Network terminology and planar graphs）", "id": "matp-049", "weak": false, "subj": "matp", "subjZh": "数学 P（Standard 5.2）"}, {"id": "maths53-001", "topic": "根式 · 化简根式", "difficulty": "easy", "type": "mcq", "stem": "Simplify √72.", "options": ["6√2", "8√2", "6√3", "2√6"], "answer": 0, "explanation": "√72 = √(36×2) = 6√2。关键是把被开方数拆出最大的平方因数（36×2 而不是 9×8），一直化简到根号内不能再拆为止。", "source": "Chapter 1 Surds · 1.02 Simplifying surds (Ex 1.02, p.8)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-002", "topic": "根式 · 同类根式加减", "difficulty": "easy", "type": "mcq", "stem": "Simplify √50 + √32 − √18.", "options": ["6√6", "6√2", "4√2", "9√2"], "answer": 1, "explanation": "先化成同类根式：5√2 + 4√2 − 3√2 = 6√2。常见错误是直接把被开方数相加减（50+32−18=64），那等于 8。", "source": "Chapter 1 Surds · 1.03 Adding and subtracting surds (Ex 1.03, p.11)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-003", "topic": "根式 · 分母有理化", "difficulty": "medium", "type": "mcq", "stem": "Write 10/√5 with a rational denominator, in simplest form.", "options": ["2√10", "5√2", "2√5", "10√5"], "answer": 2, "explanation": "上下同乘 √5：10√5/5 = 2√5。注意最后要约掉 10 与 5，只约系数，不要把 √5 也约掉。", "source": "Chapter 1 Surds · 1.06 Rationalising the denominator (Ex 1.06, p.20)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-004", "topic": "根式 · 二项分母有理化", "difficulty": "medium", "type": "short", "stem": "Rationalise the denominator and simplify: 4/(√5 − 1).", "options": [], "answer": "Multiply by the conjugate (√5 + 1): 4(√5 + 1)/((√5)² − 1²) = 4(√5 + 1)/4 = √5 + 1.", "explanation": "分母含根式相加/减时，要乘共轭 (√5+1)；乘完后分母是 5−1=4，正好与分子约成 1，答案 √5+1（≈3.24）。", "source": "Chapter 1 Surds · 1.06 Rationalising the denominator, binomial denominators (Ex 1.06)", "points": [{"t": "Multiply by the conjugate (√5 + 1): 4(√5 + 1)/((√5)² − 1²) = 4(√5 + 1)/4 = √5 + 1.", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-005", "topic": "代数式 · 二项式展开", "difficulty": "easy", "type": "mcq", "stem": "Expand and simplify (2x − 3)(x + 5).", "options": ["2x² + 7x + 15", "2x² − 7x − 15", "2x² + 13x − 15", "2x² + 7x − 15"], "answer": 3, "explanation": "2x·x=2x²，2x·5=10x，−3·x=−3x，−3·5=−15，合并得 2x²+7x−15。别漏了 −3×5 的负号。", "source": "Chapter 5 Products and factors · 5.06 Expanding binomial products (Ex 5.06)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-006", "topic": "代数式 · 非首一二次三项式因式分解", "difficulty": "hard", "type": "mcq", "stem": "Factorise 6x² + 11x − 35.", "options": ["(2x + 7)(3x − 5)", "(2x − 7)(3x + 5)", "(3x − 7)(2x + 5)", "(6x − 5)(x + 7)"], "answer": 0, "explanation": "要凑出 6x² 与 −35，且交叉项为 +11x：6×(−35)=−210，需两数积 −210、和 +11，即 21 与 −10。于是 6x²+21x−10x−35 = 3x(2x+7)−5(2x+7) = (2x+7)(3x−5)。", "source": "Chapter 5 Products and factors · 5.09 Factorising non-monic quadratic trinomials (Ex 5.09)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-007", "topic": "代数式 · 代数分式化简", "difficulty": "medium", "type": "short", "stem": "Simplify (x² − 9)/(x² + x − 12), stating any restrictions on x.", "options": [], "answer": "(x + 3)/(x + 4), where x ≠ 3 and x ≠ −4.", "explanation": "分子是平方差 (x−3)(x+3)，分母分解为 (x+4)(x−3)，约去 (x−3) 得 (x+3)/(x+4)。约掉的因式对应的 x 值必须排除：x≠3、x≠−4。", "source": "Chapter 5 Products and factors · 5.11 Factorising algebraic fractions (Ex 5.11)", "points": [{"t": "(x + 3)/(x + 4), where x ≠ 3 and x ≠ −4.", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-008", "topic": "指数 · 幂的乘方", "difficulty": "easy", "type": "mcq", "stem": "Simplify (2x³)⁴.", "options": ["2x¹²", "16x¹²", "16x⁷", "8x¹²"], "answer": 1, "explanation": "系数与字母都要取四次方：2⁴=16，(x³)⁴=x¹²，所以是 16x¹²。常见错误是只把指数相乘却漏掉 2 的幂。", "source": "Chapter 5 Indices · 5.01 Index laws (Ex 5.01)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-009", "topic": "指数 · 分数与负指数", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 27^(−2/3).", "options": ["−1/9", "1/6", "1/9", "−9"], "answer": 2, "explanation": "27^(1/3)=3，再平方得 9；负指数取倒数得 1/9。注意负指数只表示倒数，不会让结果变负数。", "source": "Chapter 5 Indices · 5.02 Fractional indices (Ex 5.02)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-010", "topic": "指数 · 分数指数综合", "difficulty": "hard", "type": "short", "stem": "Simplify (8x⁶y⁻³)^(2/3), giving your answer with positive indices.", "options": [], "answer": "4x⁴/y²  (8^(2/3) = 4, (x⁶)^(2/3) = x⁴, (y⁻³)^(2/3) = y⁻² = 1/y²)", "explanation": "把 2/3 分别乘到每个指数上：8^(2/3)=4，x^(6×2/3)=x⁴，y^(−3×2/3)=y⁻²，再用负指数法则写成 4x⁴/y²。", "source": "Chapter 5 Indices · 5.02 Fractional indices / 5.04 Multiplying and dividing algebraic fractions", "points": [{"t": "4x⁴/y²  (8^(2/3) = 4, (x⁶)^(2/3) = x⁴, (y⁻³)^(2/3) = y⁻² = 1/y²)", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-011", "topic": "对数 · 对数定义", "difficulty": "easy", "type": "mcq", "stem": "Evaluate log₃ 81.", "options": ["1/4", "3", "27", "4"], "answer": 3, "explanation": "log₃81 问的是“3 的几次方等于 81”，3⁴=81，所以答案是 4。不要把对数当成除法 81÷3。", "source": "Chapter 7 Equations and logarithms · 7.09 Logarithms (p.270)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-012", "topic": "对数 · 对数法则", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 2 log₃ 6 − log₃ 4.", "options": ["2", "3", "log₃ 8", "log₃ 2"], "answer": 0, "explanation": "先由幂法则得 log₃36，再由商法则得 log₃(36/4)=log₃9=2。系数 2 要先变成指数，不能直接与后面的 4 相减。", "source": "Chapter 7 Equations and logarithms · 7.10 Logarithm laws, Example 20 (p.273)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-013", "topic": "对数 · 指数方程", "difficulty": "medium", "type": "mcq", "stem": "Solve 3ˣ = 243.", "options": ["x = 81", "x = 5", "x = log 3 ÷ log 243", "x = 4"], "answer": 1, "explanation": "两边取对数：x·log3 = log243，x = log243/log3 = 5。也可直接看出 3⁵=243；注意商的方向不能颠倒。", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations, Example 23 (p.274)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-014", "topic": "对数 · 对数方程", "difficulty": "hard", "type": "short", "stem": "Solve log₂ x + log₂ (x − 2) = 3.", "options": [], "answer": "x = 4 (the solution x = −2 is rejected, because the logarithm of a negative number is undefined).", "explanation": "合并左边：log₂[x(x−2)] = 3，即 x²−2x = 8，解得 x = 4 或 x = −2。必须检验定义域：x>0 且 x−2>0，所以只剩 x = 4。", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations (Ex 7.11)", "points": [{"t": "x = 4 (the solution x = −2 is rejected, because the logarithm of a negative number is undefined).", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-015", "topic": "二次方程 · 因式分解法", "difficulty": "easy", "type": "mcq", "stem": "Solve x² − 5x − 24 = 0.", "options": ["x = 6 or x = −4", "x = 12 or x = −2", "x = 8 or x = −3", "x = −8 or x = 3"], "answer": 2, "explanation": "找两数积 −24、和 −5：−8 与 3，所以 (x−8)(x+3)=0，x=8 或 x=−3。注意这里是减 24，两数异号，别都写成正。", "source": "Chapter 11 Quadratic equations and the parabola · 11.01 Quadratic equations (Ex 11.01)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-016", "topic": "抛物线 · 对称轴与顶点", "difficulty": "medium", "type": "mcq", "stem": "Find the coordinates of the vertex of the parabola y = 3x² − 12x + 7.", "options": ["(−2, −5)", "(2, 7)", "(2, 5)", "(2, −5)"], "answer": 3, "explanation": "对称轴 x = −b/(2a) = 12/6 = 2；代回 y = 3(4) − 24 + 7 = −5，顶点为 (2, −5)。别把 x=2 直接当成顶点坐标。", "source": "Chapter 11 Quadratic equations and the parabola · 11.08 Axis of symmetry and vertex (Ex 11.08)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-017", "topic": "二次方程 · 求根公式", "difficulty": "hard", "type": "short", "stem": "Solve 2x² + 3x − 7 = 0 using the quadratic formula. Give the answers correct to 2 decimal places.", "options": [], "answer": "x ≈ 1.27 or x ≈ −2.77  (x = (−3 ± √65)/4)", "explanation": "a=2、b=3、c=−7，判别式 b²−4ac = 9+56 = 65，所以 x = (−3 ± √65)/4 ≈ (−3 ± 8.0623)/4，得 1.2656 与 −2.7656，取两位小数为 1.27 与 −2.77。", "source": "Chapter 11 Quadratic equations and the parabola · 11.03 The quadratic formula (Ex 11.03)", "points": [{"t": "x ≈ 1.27 or x ≈ −2.77  (x = (−3 ± √65)/4)", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-018", "topic": "二次方程 · 高次方程", "difficulty": "hard", "type": "short", "stem": "Solve x⁴ − 5x² + 4 = 0.", "options": [], "answer": "x = 1, x = −1, x = 2 or x = −2", "explanation": "令 u = x²，方程化为 u²−5u+4=0，即 (u−1)(u−4)=0，u=1 或 4。再解 x²=1 与 x²=4，得四个解 x=±1、±2；不要只写 x=1 和 2。", "source": "Chapter 11 Quadratic equations and the parabola · 11.05 Higher-order quadratic equations (Ex 11.05)", "points": [{"t": "x = 1, x = −1, x = 2 or x = −2", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-019", "topic": "坐标几何 · 中点公式", "difficulty": "easy", "type": "mcq", "stem": "Find the midpoint of the interval joining A(−3, 5) and B(7, −1).", "options": ["(2, 2)", "(4, 4)", "(5, −3)", "(2, 3)"], "answer": 0, "explanation": "中点坐标是两端坐标的平均值：x = (−3+7)/2 = 2，y = (5−1)/2 = 2。别把中点公式当成两点相减。", "source": "Coordinate Geometry · 3.01 Length, midpoint and gradient of an interval (Ex 3.01, p.62)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-020", "topic": "坐标几何 · 两点间斜率", "difficulty": "easy", "type": "mcq", "stem": "Find the gradient of the line passing through (2, −1) and (6, 7).", "options": ["1/2", "2", "−2", "4"], "answer": 1, "explanation": "m = (y₂−y₁)/(x₂−x₁) = (7−(−1))/(6−2) = 8/4 = 2。分子是 7 减 −1 得 8，符号最容易出错。", "source": "Coordinate Geometry · 3.01 Length, midpoint and gradient of an interval (Ex 3.01, p.62)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-021", "topic": "坐标几何 · 垂直直线的斜率", "difficulty": "easy", "type": "mcq", "stem": "The line L has equation 3x + 4y − 8 = 0. What is the gradient of a line perpendicular to L?", "options": ["−4/3", "−3/4", "4/3", "3/4"], "answer": 2, "explanation": "化成斜截式得 y = −(3/4)x + 2，L 的斜率是 −3/4；垂直直线斜率取负倒数，即 4/3。别忘记变号。", "source": "Coordinate Geometry · 3.02 Parallel and perpendicular lines (Ex 3.02, p.69)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-022", "topic": "坐标几何 · 由两点求直线方程", "difficulty": "hard", "type": "short", "stem": "Find the equation of the line passing through (−2, 3) and (4, 1), giving your answer in the general form ax + by + c = 0.", "options": [], "answer": "x + 3y − 7 = 0", "explanation": "先求斜率 m = (1−3)/(4−(−2)) = −2/6 = −1/3；用点斜式 y−3 = −(1/3)(x+2)，两边乘 3 得 3y−9 = −x−2，整理为 x+3y−7 = 0。代回两点可检验。", "source": "Coordinate Geometry · 3.05 The general form ax + by + c = 0 / 3.07 Finding the equation of a line (p.81–86)", "points": [{"t": "x + 3y − 7 = 0", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-023", "topic": "联立方程 · 消元法", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations x + 3y = 7 and 4x − 3y = 13.", "options": ["x = 2, y = 5", "x = 4, y = −1", "x = 1, y = 4", "x = 4, y = 1"], "answer": 3, "explanation": "两式相加消去 y：5x = 20，x = 4；代回 x+3y=7 得 y = 1。因为 +3y 与 −3y 异号，所以要相加而不是相减。", "source": "Chapter 10 Simultaneous equations · 10.02 The elimination method, Example 2 (p.401)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-024", "topic": "联立方程 · 直线与抛物线交点", "difficulty": "medium", "type": "mcq", "stem": "Find the points of intersection of the parabola y = x² and the line y = x + 2.", "options": ["(2, 4) and (−1, 1)", "(2, 4) only", "(2, 4) and (1, 3)", "(−1, 1) and (2, −4)"], "answer": 0, "explanation": "令 x² = x + 2，得 x²−x−2=0，即 (x−2)(x+1)=0，x=2 或 −1；分别代回求 y 得 (2,4) 与 (−1,1)。两个交点都要写，别只取正根。", "source": "Chapter 11 · 11.09 Non-linear simultaneous equations (Ex 11.09)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-025", "topic": "联立方程 · 应用题", "difficulty": "medium", "type": "short", "stem": "At the school canteen, 3 pies and 2 drinks cost $14.50, while 2 pies and 5 drinks cost $17.00. Find the cost of one pie and one drink.", "options": [], "answer": "A pie costs $3.50 and a drink costs $2.00.", "explanation": "设派为 p、饮料为 d：3p+2d=14.50，2p+5d=17.00。第一式乘 5、第二式乘 2 得 15p+10d=72.50 与 4p+10d=34.00，相减得 11p=38.50，p=3.50，代回得 d=2.00。", "source": "Chapter 10 Simultaneous equations · 10.04 Problems involving simultaneous equations (Ex 10.04)", "points": [{"t": "A pie costs $3.50 and a drink costs $2.00.", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-026", "topic": "函数图像 · 圆", "difficulty": "easy", "type": "mcq", "stem": "State the centre and radius of the circle (x − 3)² + (y + 2)² = 25.", "options": ["Centre (−3, 2), radius 12.5", "Centre (3, −2), radius 5", "Centre (3, −2), radius 25", "Centre (−3, 2), radius 5"], "answer": 1, "explanation": "标准式是 (x−a)² + (y−b)² = r²，故圆心 (a, b) = (3, −2)；半径是 25 的平方根即 5，不是 25。注意 y+2 对应 b=−2。", "source": "Chapter 8 Graphing curves · 8.13 The circle (x − a)² + (y − b)² = r² (Ex 8.13)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-027", "topic": "函数图像 · 指数曲线", "difficulty": "easy", "type": "mcq", "stem": "Which statement describes the graph of y = 3ˣ?", "options": ["It passes through (1, 0) and has the y-axis as an asymptote.", "It passes through (0, 0) and has no asymptote.", "It passes through (0, 1) and has the x-axis as an asymptote.", "It passes through (0, 3) and has the line y = 3 as an asymptote."], "answer": 2, "explanation": "任何 y = aˣ 都过 (0,1)，因为 a⁰=1；当 x 趋于负无穷时 y 趋于 0，所以 x 轴是渐近线。它永远不等于 0，因此没有 x 截距。", "source": "Chapter 8 Graphing curves · 8.12 The exponential curve y = aˣ (Ex 8.12)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-028", "topic": "函数图像 · 三次曲线", "difficulty": "medium", "type": "mcq", "stem": "At which values of x does the curve y = (x − 1)(x + 2)(x − 4) cut the x-axis?", "options": ["x = 1, x = 2 and x = 4", "x = −1, x = 2 and x = −4", "x = 1 only", "x = 1, x = −2 and x = 4"], "answer": 3, "explanation": "令 y = 0，每个因式分别为零：x−1=0、x+2=0、x−4=0，得 x=1、−2、4。注意 (x+2) 给出的是 −2，符号容易看错。", "source": "Chapter 8 Graphing curves · 8.08 The cubic curve y = a(x − r)(x − s)(x − t) (Ex 8.08)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-029", "topic": "函数图像 · 双曲线", "difficulty": "medium", "type": "short", "stem": "The graph of y = k/x passes through the point (4, −3). Find k and state the equations of the two asymptotes.", "options": [], "answer": "k = −12; the asymptotes are x = 0 (the y-axis) and y = 0 (the x-axis).", "explanation": "代入得 −3 = k/4，所以 k = −12，即 y = −12/x。x 不能为 0、y 也永远不为 0，因此两条渐近线分别是 x = 0 与 y = 0。", "source": "Chapter 8 Graphing curves · 8.11 The hyperbola y = k/x (Ex 8.11)", "points": [{"t": "k = −12; the asymptotes are x = 0 (the y-axis) and y = 0 (the x-axis).", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-030", "topic": "函数 · 函数值", "difficulty": "easy", "type": "mcq", "stem": "If f(x) = 2x² − 3x, find f(−2).", "options": ["14", "−2", "−14", "2"], "answer": 0, "explanation": "f(−2) = 2(−2)² − 3(−2) = 2×4 + 6 = 14。平方先算得 4，第二项是 −3×(−2)=+6，两个符号都要处理对。", "source": "Chapter 14 Functions · 14.02 Function notation (Ex 14.02)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-031", "topic": "函数 · 定义域与值域", "difficulty": "medium", "type": "short", "stem": "State the domain and range of the function f(x) = √(x − 4).", "options": [], "answer": "Domain: x ≥ 4; range: y ≥ 0.", "explanation": "根号内必须非负，所以 x−4 ≥ 0，定义域 x ≥ 4；算术平方根的结果不会是负数，因此值域 y ≥ 0。注意值域是 y 的范围，不是 x 的范围。", "source": "Chapter 14 Functions · 14.02 The domain and range of a function (p.540)", "points": [{"t": "Domain: x ≥ 4", "m": 1}, {"t": "range: y ≥ 0", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-032", "topic": "三角 · 三角形面积", "difficulty": "easy", "type": "mcq", "stem": "Find the area of a triangle with two sides of 8 cm and 11 cm and an included angle of 30°.", "options": ["88 cm²", "22 cm²", "44 cm²", "11 cm²"], "answer": 1, "explanation": "面积 = ½ab·sinC = ½×8×11×sin30° = 44×0.5 = 22 cm²。忘记乘 ½ 就会得到 44，这是最常见的错误。", "source": "Non-right Angled Trigonometry · 9.11 Area of a triangle (Ex 9.11)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-033", "topic": "三角 · 正弦定理求边", "difficulty": "medium", "type": "mcq", "stem": "In triangle ABC, ∠A = 35°, ∠B = 62° and a = 9.4 cm. Find b, correct to 1 decimal place.", "options": ["5.9 cm", "6.1 cm", "14.5 cm", "10.7 cm"], "answer": 2, "explanation": "由正弦定理 b/sinB = a/sinA 得 b = 9.4×sin62°/sin35° ≈ 9.4×0.8830/0.5736 ≈ 14.5 cm。若把正弦比倒过来（乘以 sin35/sin62）就会得到 6.1，这是典型错误。", "source": "Non-right Angled Trigonometry · 9.07 Sine rule for sides (Ex 9.07)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-034", "topic": "三角 · 余弦定理求边", "difficulty": "medium", "type": "mcq", "stem": "In a triangle, two sides of 7 cm and 9 cm include an angle of 120°. Find the third side, correct to 1 decimal place.", "options": ["8.2 cm", "15.7 cm", "11.4 cm", "13.9 cm"], "answer": 3, "explanation": "c² = 7² + 9² − 2(7)(9)cos120° = 49 + 81 + 63 = 193，c ≈ 13.9 cm。cos120° 是负值，所以 −2ab·cosC 这一项变加号，别把符号弄丢。", "source": "Non-right Angled Trigonometry · 9.09 Cosine rule for sides (Ex 9.09)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-035", "topic": "三角 · 正弦定理的模糊情况", "difficulty": "hard", "type": "short", "stem": "In a triangle, a = 12 cm, b = 15 cm and ∠A = 40°. Find all possible values of ∠B, correct to 1 decimal place, and explain why more than one answer exists.", "options": [], "answer": "∠B ≈ 53.5° or ∠B ≈ 126.5°, because sin B = b sin A / a = 15 sin40°/12 ≈ 0.8035 and the sine rule can produce an acute and an obtuse solution (the ambiguous case).", "explanation": "由正弦定理 sinB = 15×sin40°/12 ≈ 0.8035，得 B ≈ 53.5°；因为 sin(180°−θ)=sinθ，B 也可能是 180°−53.5° = 126.5°。需检验两解是否都能与 40° 组成三角形；题目只给两边一角（SSA），所以出现模糊情况。", "source": "Non-right Angled Trigonometry · 9.08 Sine rule for angles (Ex 9.08)", "points": [{"t": "∠B ≈ 53.5° or ∠B ≈ 126.5°, because sin B = b sin A / a = 15 sin40°/12 ≈ 0.8035 and the sine rule can produce an acute and an obtuse solution (the ambiguous case).", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-036", "topic": "概率 · 相对频率", "difficulty": "easy", "type": "mcq", "stem": "A die is rolled 50 times and a 6 appears 7 times. What is the relative frequency of rolling a 6?", "options": ["0.14", "0.86", "0.12", "0.07"], "answer": 0, "explanation": "相对频率 = 出现次数 ÷ 试验总次数 = 7/50 = 0.14。常见错误：把试验次数当 100（7/100 = 0.07）、用点数 6 代替频数（6/50 = 0.12）、或算成补事件 43/50 = 0.86。", "source": "Chapter 12 Probability · 12.01 Relative frequency", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-037", "topic": "概率 · 韦恩图（重叠事件）", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play tennis and 7 play both. How many students play neither sport?", "options": ["5 students", "7 students", "0 students", "23 students"], "answer": 1, "explanation": "先求并集：18 + 12 − 7 = 23 人至少会一项，再用 30 − 23 = 7 得两项都不参加。23 是\"至少会一项\"（忘了从总数里减掉），5 是只会网球（12 − 7），0 是把 18 + 12 = 30 直接当成并集（7 人被重复计算）后再 30 − 30 得到的。", "source": "Chapter 12 Probability · 12.02 Venn diagrams", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-038", "topic": "概率 · 双向表读数", "difficulty": "easy", "type": "mcq", "stem": "A survey of 100 students recorded how they travel to school:\n\n            Walk   Bus\nYear 10      28     22\nYear 11      35     15\n\nWhat is the probability that a randomly selected student catches the bus?", "options": ["0.15", "0.22", "0.37", "0.63"], "answer": 2, "explanation": "坐校车的总人数是 22 + 15 = 37，总人数 100，所以 P = 0.37。0.22 与 0.15 只读了表格里的一行，0.63 是走路的比例（1 − 0.37），都是没把整列相加或取成补事件的错误。", "source": "Chapter 12 Probability · 12.03 Two-way tables", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-039", "topic": "概率 · 独立事件的乘积法则", "difficulty": "medium", "type": "mcq", "stem": "A coin is tossed and a die is rolled at the same time. What is the probability of getting a head and an even number?", "options": ["3/4", "1/12", "1/2", "1/4"], "answer": 3, "explanation": "两事件独立，用乘积法则：P(H) × P(even) = 1/2 × 1/2 = 1/4。1/2 只算了骰子为偶数（忘了乘硬币），1/12 是错把 P(4) = 1/6 当成偶数概率，3/4 是 1 − 1/4 的补事件。", "source": "Chapter 12 Probability · 12.06 Dependent and independent events (product rule)", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-040", "topic": "概率 · 无放回抽样", "difficulty": "medium", "type": "mcq", "stem": "A bag contains 5 red and 3 blue counters. Two counters are drawn at random without replacement. What is the probability that both counters are red? Give your answer correct to 2 decimal places.", "options": ["0.36", "0.39", "0.63", "0.57"], "answer": 0, "explanation": "无放回：第一次 5/8，第二次只剩 7 个其中 4 个红，所以 P = 5/8 × 4/7 = 20/56 ≈ 0.36。0.39 是错用放回的分母（25/64 = 0.3906），0.63 是只算第一次（5/8），0.57 是只算第二次（4/7）。", "source": "Chapter 12 Probability · 12.05 Selecting with and without replacement", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-041", "topic": "概率 · 条件概率", "difficulty": "medium", "type": "mcq", "stem": "A bag contains 4 red and 6 blue marbles. One marble is drawn at random and not replaced. Given that the first marble was red, what is the probability that the second marble is blue?", "options": ["2/5", "2/3", "3/5", "1/3"], "answer": 1, "explanation": "已知第一颗是红且不放回，袋里剩 3 红 6 蓝共 9 颗，故 P(第二颗蓝 | 第一颗红) = 6/9 = 2/3。3/5 是没把总数从 10 改成 9（6/10），1/3 是算成剩下的红（3/9），2/5 是第一次抽到红的概率（4/10）。", "source": "Chapter 12 Probability · 12.07 Conditional probability", "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-042", "topic": "概率 · 树状图与无放回", "difficulty": "hard", "type": "short", "stem": "A box contains 6 white and 4 black balls. Two balls are drawn at random without replacement. Using a tree diagram, find the probability that exactly one of the balls is black. Give your answer as a fraction in simplest form.", "options": [], "answer": "8/15  (2 × 6/10 × 4/9 = 48/90 = 8/15 ≈ 0.533)", "explanation": "树状图有两条合格路径：白→黑 (6/10 × 4/9 = 24/90) 和黑→白 (4/10 × 6/9 = 24/90)，相加得 48/90 = 8/15。注意第二条分支的分母也要变成 9（不放回），且\"恰好一个黑\"两条路径都要算，只算一条会漏一半。", "source": "Chapter 12 Probability · 12.04 Tree diagrams / 12.05 Selecting with and without replacement", "points": [{"t": "8/15  (2 × 6/10 × 4/9 = 48/90 = 8/15 ≈ 0.533)", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"id": "maths53-043", "topic": "概率 · 韦恩图与条件概率", "difficulty": "hard", "type": "short", "stem": "In a survey of 80 people, 45 own a dog, 30 own a cat and 18 own both. One person is chosen at random.\n(a) Find the probability that the person owns a cat, given that they own a dog.\n(b) Find the probability that the person owns neither animal.", "options": [], "answer": "(a) 18/45 = 2/5 = 0.4   (b) 80 − (45 + 30 − 18) = 23, so P(neither) = 23/80 = 0.2875 ≈ 0.29", "explanation": "(a) 条件概率的分母是\"已知养狗\"的 45 人，交集 18 人，故 18/45 = 2/5（≈0.4）。(b) 先求并集 45 + 30 − 18 = 57 人，再 80 − 57 = 23 人两者都没有，概率 23/80 ≈ 0.29；别把 18 在并集里重复加。", "source": "Chapter 12 Probability · 12.02 Venn diagrams / 12.07 Conditional probability", "points": [{"t": "(a) 18/45 = 2/5 = 0.4   (b) 80 − (45 + 30 − 18) = 23, so P(neither) = 23/80 = 0.2875 ≈ 0.29", "m": 1}], "weak": false, "subj": "maths53", "subjZh": "5.3 数学"}, {"topic": "李尔王 · 剧情", "difficulty": "easy", "type": "mcq", "stem": "How does King Lear decide how to divide his kingdom at the start of the play?", "options": ["By asking each daughter to say how much she loves him", "By drawing lots with his daughters", "By holding a tournament between the dukes", "By giving the largest share to the eldest daughter"], "answer": 0, "explanation": "开场李尔要求三个女儿各自表达对他的爱，按表达分国土。这是全剧的引爆点——把爱变成可计量的表演。", "source": "Yearly Study Guide 2026 · English（5 multiple choice questions based on the events of your play）", "id": "eng-001", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"topic": "李尔王 · 剧情", "difficulty": "easy", "type": "mcq", "stem": "What word does Cordelia use when asked to declare her love, which triggers Lear's rage?", "options": ["Everything", "Nothing", "Half", "Love"], "answer": 1, "explanation": "Cordelia 回答 \"Nothing\"：她不愿用溢美之词换取国土。Lear 把诚实当作否定，随即剥夺她的继承权。", "source": "Yearly Study Guide 2026 · English", "id": "eng-002", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"topic": "李尔王 · 剧情", "difficulty": "medium", "type": "mcq", "stem": "Who is the faithful nobleman banished for speaking in defence of Cordelia, and how does he return?", "options": ["Edmund, disguised as a messenger", "Albany, disguised as a knight", "Kent, disguised as the servant Caius", "Gloucester, disguised as Poor Tom"], "answer": 2, "explanation": "Kent 因替 Cordelia 辩护被驱逐，之后装扮成仆役 Caius 继续服侍李尔。Poor Tom 是 Edgar 的伪装，Albany 未伪装。", "source": "Yearly Study Guide 2026 · English", "id": "eng-003", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"topic": "李尔王 · 剧情", "difficulty": "medium", "type": "mcq", "stem": "How does Goneril and Regan's treatment of Lear change after they gain power?", "options": ["They crown him king of a smaller region", "They exile him to France", "They give him more knights than he had before", "They reduce the number of knights he may keep, eventually refusing them entirely"], "answer": 3, "explanation": "李尔约定保留 100 名骑士，Goneril 先减到 50，Regan 再减到 25（后为 0），并拒绝收留他。剥夺随从是关键羞辱点。", "source": "Yearly Study Guide 2026 · English", "id": "eng-004", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"topic": "李尔王 · 剧情", "difficulty": "medium", "type": "mcq", "stem": "Edmund plots against Edgar and Gloucester. Which action most directly sets his plan in motion?", "options": ["He tells Edgar that Gloucester wants him dead, then claims Edgar plotted to kill Gloucester", "He forges a letter and calls a tournament", "He reports Edgar to the King", "He openly challenges Edgar to a duel"], "answer": 0, "explanation": "Edmund 伪造信件、诱骗 Edgar 逃跑，再向 Gloucester 报告『Edgar 谋害父亲』，使 Edgar 被通缉，自己成为合法继承人。", "source": "Yearly Study Guide 2026 · English", "id": "eng-005", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"topic": "李尔王 · 剧情", "difficulty": "hard", "type": "mcq", "stem": "How does the play end for Lear and Cordelia?", "options": ["They rule the kingdom together", "Cordelia is hanged on Edmund's orders and Lear dies of grief with her body", "Lear is killed in battle by Albany", "They flee to France and survive"], "answer": 1, "explanation": "Edmund 下令吊死 Cordelia，李尔赶到时已晚，抱着她的尸体死去。没有恢复秩序的幸福结局，只有 Albany 与 Edgar 收拾残局。", "source": "Yearly Study Guide 2026 · English", "id": "eng-006", "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-007", "topic": "李尔王 · 分国与 Cordelia 的「Nothing」", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nCORDELIA: Nothing, my lord.\nKING LEAR: Nothing!\nCORDELIA: Nothing.\nKING LEAR: Nothing will come of nothing: speak again.\n\n(a) What does Cordelia's reply reveal about her values? (2 marks)\n(b) Explain how Lear's response sets the tragedy in motion. (3 marks)", "options": [], "answer": "(a) 1 mark — Cordelia refuses to flatter or perform love for a reward; she will not compete with her sisters' speeches.\n1 mark — her plain 'Nothing' signals honesty and a measured, private love (she loves 'according to my bond'), not an absence of feeling.\n(b) 1 mark — Lear equates love with public declaration, so silence is read as rejection.\n1 mark — his pun, 'Nothing will come of nothing', shows him thinking in terms of a bargain or debt rather than affection.\n1 mark — he banishes Cordelia (and Kent) and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him.", "explanation": "两问是一组因果链：(a) 考 Cordelia 为什么说 Nothing（拒绝把爱当表演，爱是“本分”不是报价）；(b) 要串起三点——把言语当爱、用双关当交易、放逐造成权力真空。只写“他很生气”拿不到第 3 分。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "Cordelia refuses to flatter or perform love for a reward; she will not compete with her sisters' speeches.", "m": 1}, {"t": "her plain 'Nothing' signals honesty and a measured, private love (she loves 'according to my bond'), not an absence of feeling.", "m": 1}, {"t": "Lear equates love with public declaration, so silence is read as rejection.", "m": 1}, {"t": "his pun, 'Nothing will come of nothing', shows him thinking in terms of a bargain or debt rather than affection.", "m": 1}, {"t": "he banishes Cordelia (and Kent) and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-008", "topic": "李尔王 · 谄媚的语言（Act 1 Sc 1）", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nGONERIL: Sir, I love you more than words can wield the matter;\nDearer than eye-sight, space, and liberty;\nBeyond what can be valued, rich or rare;\n\n(a) Identify two features of Goneril's language. (2 marks)\n(b) Explain why Shakespeare gives this speech to Goneril rather than to Cordelia. (3 marks)", "options": [], "answer": "(a) 1 mark — hyperbole and unverifiable comparison ('more than words can wield', 'dearer than eyesight, space and liberty').\n1 mark — a catalogue of absolutes: love is measured against everything (sight, space, liberty, wealth) and therefore means nothing specific.\n(b) 1 mark — the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and truth as plain speech.\n1 mark — it positions the audience above Lear: we can hear the inflation before he can (dramatic irony).\n1 mark — it establishes the play's central error: love treated as language to be counted rather than felt.", "explanation": "这题考“语言如何被量化”：Goneril 用夸张和绝对化清单，把爱变成可比较、可报价的东西。(b) 的重点是“对比 + 观众知道得比 Lear 多”，不要只写“她不是真心的”。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "hyperbole and unverifiable comparison ('more than words can wield', 'dearer than eyesight, space and liberty').", "m": 1}, {"t": "a catalogue of absolutes: love is measured against everything (sight, space, liberty, wealth) and therefore means nothing specific.", "m": 1}, {"t": "the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and truth as plain speech.", "m": 1}, {"t": "it positions the audience above Lear: we can hear the inflation before he can (dramatic irony).", "m": 1}, {"t": "it establishes the play's central error: love treated as language to be counted rather than felt.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-009", "topic": "李尔王 · 视觉隐喻与 blindness motif", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nKENT: See better, Lear; and let me still remain\nThe true blank of thine eye.\n\nExplain what Kent's image of sight suggests about Lear's error and about the play's wider concerns. (3 marks)", "options": [], "answer": "1 mark — sight here means judgement or insight, not physical vision: Kent is telling Lear that he is misreading his daughters.\n1 mark — Kent offers to be the 'blank' (the true target/centre) of Lear's eye, that is, the honest perspective Lear refuses.\n1 mark — the image plants the blindness motif that structures the whole play: Gloucester is literally blinded, and Lear only learns to 'see' once he has lost everything.", "explanation": "3 分分别给：sight = 判断力（不是视力）、Kent 自愿当“眼中靶心”的忠心、以及这一隐喻为全剧 blindness motif 埋线（后接 Gloucester 被挖眼、Lear 清醒时已一无所有）。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "sight here means judgement or insight, not physical vision: Kent is telling Lear that he is misreading his daughters.", "m": 1}, {"t": "Kent offers to be the 'blank' (the true target/centre) of Lear's eye, that is, the honest perspective Lear refuses.", "m": 1}, {"t": "the image plants the blindness motif that structures the whole play: Gloucester is literally blinded, and Lear only learns to 'see' once he has lost everything.", "m": 1}], "weak": false, "subj": "eng", "subjZh": "英语 · 年考版"}, {"id": "eng-010", "topic": "李尔王 · hamartia（龙的比喻）", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nLEAR: Come not between the dragon and his wrath.\n\nHow does this line help to explain Lear's hamartia? (3 marks)", "options": [], "answer": "1 mark — the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge.\n1 mark — wrath has replaced judgement: he acts from injured pride rather than reason, and cannot tolerate being contradicted.\n1 mark — because this flaw (not fate) drives the banishments and the division of the kingdom, his downfall follows from character, which is what makes the play a tragedy.", "explanation": "hamartia 不是
