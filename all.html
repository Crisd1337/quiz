y Sport & Representative Sport"}, {"id": "sport-004", "topic": "Sport safety · Protective equipment", "difficulty": "easy", "type": "mcq", "stem": "According to the Sydney North rugby league permission note, which piece of protective equipment is mandatory in all games and training sessions?", "options": ["Knee strapping on both legs", "Shin pads worn under the socks", "A padded scrum cap for the head", "A correctly fitted mouthguard"], "answer": 3, "explanation_en": "The consent form states explicitly that 'wearing suitable mouthguards in all games and training is compulsory', to reduce teeth and facial injuries. Shin pads and knee strapping are not compulsory equipment in this sport.", "source": "Rugby_League_Trials_permission_note.docx", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-005", "topic": "Competition rules · Athletics progression", "difficulty": "easy", "type": "mcq", "stem": "At the Balgowlah Boys Athletics Carnival, which athletes are expected to compete at the North Shore Athletics Carnival?", "options": ["The top two finishers in each age group", "Only the winner of each individual event", "Everyone who finishes the race on the day", "The fastest ten runners in each age group"], "answer": 0, "explanation_en": "The athletics carnival rules send the top two in each age group to the North Shore carnival; the top 'ten' is the qualifying standard for cross-country. Do not mix up the rules for the two events.", "source": "Bally Boys school athletics carnival permission note.doc(Zone Representation)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-006", "topic": "Competition rules · Cross-country progression", "difficulty": "medium", "type": "mcq", "stem": "To qualify for the Zone cross country team, a runner must:", "options": ["Finish in the top two of their age group", "Finish in the top ten of their age group", "Be selected by the sports captain", "Complete the course under 15 minutes"], "answer": 1, "explanation_en": "Cross-country takes the top ten in each age group into the Zone team, a much wider threshold than the top two for athletics. These two numbers are the pair an exam question is most likely to trip you up on.", "source": "School XC Program 2025 - amended.docx(Guidelines — To qualify for Zone)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-007", "topic": "Competition rules · Swimming progression exceptions", "difficulty": "medium", "type": "mcq", "stem": "At the swimming carnival, the fastest two swimmers normally qualify for the Zone carnival. For which event does only the fastest swimmer qualify?", "options": ["50 m freestyle", "4 × 50 m relay", "100 m butterfly", "50 m breaststroke"], "answer": 2, "explanation_en": "Only the fastest swimmer is taken for the 200 m freestyle, the 200 m individual medley and the 100 m butterfly; the top two go through in the other events. In the 50 m freestyle the top two qualify and the next two form the relay team.", "source": "Swimming Carnival Program 2020 (3).pdf (zone qualifying table)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-008", "topic": "Competition rules · Swimming progression scenarios", "difficulty": "medium", "type": "mcq", "stem": "A boy finishes third in the 50 m freestyle in his age group at the school swimming carnival. Which statement is correct?", "options": ["He must swim a final race against the other placegetters to decide the result", "He qualifies for the Zone carnival because the top three in each event go through", "He automatically becomes age champion because he finished in the top three", "He misses Zone in that event but may still make the age relay as a fastest four"], "answer": 3, "explanation_en": "In the 50 m freestyle only the top two go through to Zone, so third place misses out on that event; but 'the top four in each age group for 50 m freestyle will form an age relay team', so the third-placed swimmer can still be picked for the relay. All events are also ranked on time, with no finals.", "source": "Swimming Carnival Program 2020 (3).pdf(Zone qualifiers / Age Relay Team)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-009", "topic": "Fitness training · Progressive overload", "difficulty": "medium", "type": "mcq", "stem": "The Wednesday Sport program only increases the running load slightly each week (for example walk 5 / jog 0, then jog 1 / walk 4, then jog 3 / walk 2). Why does it progress this way?", "options": ["So students can overload gradually and avoid injury", "So that everyone finishes the session at exactly the same time", "Because the teacher does not want students improving too quickly", "Because running over five minutes is unsafe for teenagers"], "answer": 0, "explanation_en": "This is the principle of progressive overload: increase the load only a little at a time so that the body can adapt, avoiding sudden jumps that cause muscle soreness and injury. The course notes put it as 'no sudden increase in volume or intensity'.", "source": "Wednesday sport Remote Learning Week 4 / Week 5", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-010", "topic": "Sport safety · Heat and sun protection", "difficulty": "medium", "type": "mcq", "stem": "Which is the best preparation for an outdoor athletics carnival on a hot day?", "options": ["Wear brand new spikes you have never worn before", "Drink plenty of water and bring a hat and sun protection", "Avoid drinking until after your last event", "Wear an extra jumper so you sweat more and lose weight"], "answer": 1, "explanation_en": "The course notice says it is essential to bring enough water, protect yourself from the sun and wear a hat. Deliberately drinking less water raises the risk of heatstroke and cramps, and new spiked shoes cause blisters, so they should not be worn for the first time on competition day.", "source": "Bally Boys school athletics carnival permission note.doc(What to bring)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-011", "topic": "Fitness training · Terminology", "difficulty": "easy", "type": "mcq", "stem": "In the Week 6 strength routine, students complete 'AMRAP in 20 minutes'. What does AMRAP mean?", "options": ["A measured running and pacing test over a set distance", "Alternating muscle recovery with performance work", "As many reps or rounds as possible in the set time", "A mandatory rest period after every repetition"], "answer": 2, "explanation_en": "AMRAP means as many reps or rounds as possible: you complete as many cycles of the circuit as you can within the set time — 5 superman poses, 10 push-ups and 15 squats — and stop when the time is up.", "source": "Wednesday Sport Remote Learning week 6", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-012", "topic": "Competition rules · Age championships", "difficulty": "medium", "type": "mcq", "stem": "How is the age champion decided at the swimming carnival?", "options": ["By the fastest 100 m time recorded on the day", "By winning a single 50 m freestyle race on the day", "By a vote of all teachers at the end of the carnival", "By the highest aggregate point score across events"], "answer": 3, "explanation_en": "The age champion is decided by the highest cumulative score across all events, so several placings are worth more than a single win, which earns only one score.", "source": "Swimming Carnival Program 2020 (3).pdf (age champion rules)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-013", "topic": "Sport safety · Managing injuries", "difficulty": "hard", "type": "short", "stem": "During a 25-minute run a student feels a sharp pain in his hamstring. Describe what he should do and explain why continuing to run would be risky.", "options": [], "answer": "He should stop running immediately, tell the teacher or coach, and get the injury assessed and treated with rest, ice, compression and elevation before returning to play. Continuing to run is risky because a strained muscle can tear further, causing a much longer recovery, and pain is a warning sign that should never be pushed through.", "explanation_en": "The marks come from 'stopping immediately + reporting to the teacher or coach + RICER treatment', and from explaining that continuing to run will worsen the injury and lengthen recovery. Running through the pain is the most common wrong choice.", "source": "School XC Program 2025 (event safety guidelines) + syllabus knowledge (RICER first-aid principles)", "marks": 4, "criteria": [{"id": "c1", "t": "States that he should stop running immediately", "m": 1}, {"id": "c2", "t": "States that he should tell the teacher or coach and have the injury assessed", "m": 1}, {"id": "c3", "t": "Describes treating it with rest, ice, compression and elevation before returning to play", "m": 1}, {"id": "c4", "t": "Explains the risk: a strained muscle can tear further, causing a much longer recovery, and pain is a warning sign that must not be pushed through", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that he should stop running immediately", "m": 1}, {"id": "c2", "t": "States that he should tell the teacher or coach and have the injury assessed", "m": 1}, {"id": "c3", "t": "Describes treating it with rest, ice, compression and elevation before returning to play", "m": 1}, {"id": "c4", "t": "Explains the risk: a strained muscle can tear further, causing a much longer recovery, and pain is a warning sign that must not be pushed through", "m": 1}], "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-014", "topic": "Fitness training · Applying progressive overload", "difficulty": "hard", "type": "short", "stem": "Using the Wednesday Sport program as an example, explain what progressive overload means and why it is safer than suddenly training much harder.", "options": [], "answer": "Progressive overload means gradually increasing the training demand over time, for example moving from a 45-minute walk with bodyweight exercises to jogging 4 minutes and walking 1 minute, and eventually to a continuous 25-minute run. It is safer because each small increase gives the body time to adapt, whereas a sudden jump in volume or intensity causes muscle soreness and greatly increases the risk of injury.", "explanation_en": "All three parts are needed: the definition, specific examples from the materials and the reason it is safer. Writing only 'gradually increase the amount', with no examples and no explanation of the injury risk, will not earn full marks.", "source": "Wednesday Sport Remote Learning Week 1–6(train progressions and Week 6 25-minute run)", "marks": 4, "criteria": [{"id": "c1", "t": "Defines progressive overload as gradually increasing the training demand over time", "m": 1}, {"id": "c2", "t": "Gives the program example: from a 45-minute walk with bodyweight exercises to jogging 4 minutes and walking 1 minute, then a continuous 25-minute run", "m": 1}, {"id": "c3", "t": "Explains that each small increase gives the body time to adapt", "m": 1}, {"id": "c4", "t": "Contrasts this with a sudden jump in volume or intensity, which causes muscle soreness and greatly increases the risk of injury", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines progressive overload as gradually increasing the training demand over time", "m": 1}, {"id": "c2", "t": "Gives the program example: from a 45-minute walk with bodyweight exercises to jogging 4 minutes and walking 1 minute, then a continuous 25-minute run", "m": 1}, {"id": "c3", "t": "Explains that each small increase gives the body time to adapt", "m": 1}, {"id": "c4", "t": "Contrasts this with a sudden jump in volume or intensity, which causes muscle soreness and greatly increases the risk of injury", "m": 1}], "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-015", "topic": "Sport safety · Informed consent", "difficulty": "hard", "type": "short", "stem": "Explain why a signed permission note and accurate medical information are required before a student competes in a representative sport event, and give one example of a safety rule from the school's sport documents.", "options": [], "answer": "A permission note shows that a parent or guardian knows the event details and accepts that some risk is inherent in sport, and medical information lets staff plan first aid and manage conditions such as asthma or allergy on the day. One example of a safety rule is that a correctly fitted mouthguard is mandatory in all rugby league games and training sessions.", "explanation_en": "Two things are asked for: 'parental informed consent + the school's first-aid preparedness and knowledge of medical history', and a genuine rule from the documents, such as mandatory mouthguards or bringing water and sun protection. Writing only 'the school requires a signature', without explaining why, loses marks.", "source": "Rugby_League_Trials_permission_note.docx; Bally Boys school athletics carnival permission note.doc", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that a permission note shows a parent or guardian knows the event details and accepts that some risk is inherent in sport", "m": 1}, {"id": "c2", "t": "Explains that accurate medical information lets staff plan first aid and manage conditions such as asthma or allergy on the day", "m": 1}, {"id": "c3", "t": "Gives one accurate safety rule from the school's sport documents, such as a correctly fitted mouthguard being mandatory in rugby league games and training", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that a permission note shows a parent or guardian knows the event details and accepts that some risk is inherent in sport", "m": 1}, {"id": "c2", "t": "Explains that accurate medical information lets staff plan first aid and manage conditions such as asthma or allergy on the day", "m": 1}, {"id": "c3", "t": "Gives one accurate safety rule from the school's sport documents, such as a correctly fitted mouthguard being mandatory in rugby league games and training", "m": 1}], "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "cw-001", "topic": "Where to get help · Emergencies", "difficulty": "easy", "type": "mcq", "stem": "You are walking home with a friend when they collapse and stop breathing. Which number should you call?", "options": ["000 (ambulance, police or fire)", "1800 011 511 (Mental Health Line)", "13 11 14 (Lifeline)", "1800 55 1800 (Kids Helpline)"], "answer": 0, "explanation_en": "000 is Australia's emergency number for ambulance, police and fire services. It is for immediate danger, whereas the other three numbers offer psychological support and cannot respond to a situation that needs an ambulance.", "source": "Urgent Help(Call 000 — ambulance, police or fire services)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-002", "topic": "Where to get help · 24-hour helplines", "difficulty": "easy", "type": "mcq", "stem": "It is 11 pm on a Sunday and you feel overwhelmed and want to talk to someone right now. Which service offers free, confidential crisis support at any hour?", "options": ["Your year adviser by email", "Lifeline on 13 11 14", "SSO Sara at school", "The counsellor's office"], "answer": 1, "explanation_en": "Lifeline on 13 11 14 gives free, confidential crisis support 24/7, whereas school counsellors, SSOs and Year Advisers are only available during business hours — so at night the hotline is the option.", "source": "Urgent Help(Lifeline — 13 11 14, available 24/7)· Support people at school", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-003", "topic": "Health · Sleep duration", "difficulty": "easy", "type": "mcq", "stem": "According to the Sleep page, how much sleep is recommended for someone aged 14 to 17?", "options": ["11–13 hours", "6–7 hours", "8–10 hours", "7–8 hours"], "answer": 2, "explanation_en": "The recommended sleep duration for 14–17-year-olds is 8–10 hours, with 7–11 hours being 'possibly okay' and anything outside that range not recommended, because sleep deprivation affects memory, focus and mood.", "source": "Sleep (recommended sleep table: 14–17 years — 8–10 hours)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-004", "topic": "Mental health · Signs of depression", "difficulty": "easy", "type": "mcq", "stem": "The Depression page describes clinical depression as a significant low mood that lasts longer than which period and starts to get in the way of everyday life?", "options": ["one year", "three months", "24 hours", "two weeks"], "answer": 3, "explanation_en": "The key criterion is 'lasting more than two weeks' and affecting daily life, since a day or two of low mood is a normal emotional fluctuation rather than depression, and only a medical professional can diagnose it.", "source": "Depression(lasting longer than two weeks and start to get in the way of your everyday life)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-005", "topic": "Emotional regulation · Box breathing", "difficulty": "easy", "type": "mcq", "stem": "The Anxiety page describes box breathing as a technique for slowing your breathing and calming your body. What is the pattern?", "options": ["Inhale 4, hold 4, exhale 4, hold 4", "Inhale 10, hold 10, exhale 10", "Inhale 4, hold 7, exhale 8", "Inhale 2, exhale 2, repeated quickly"], "answer": 0, "explanation_en": "Box breathing has four stages of 4 seconds each — inhale, hold, exhale, hold — so it is like walking around the four sides of a square. Repeat it at least four times. Do not confuse it with the 4–7–8 technique on the same page, which is used to get to sleep.", "source": "Anxiety (breathing techniques: box breathing and the 4-7-8 technique)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-006", "topic": "Mental health · Understanding self-harm", "difficulty": "easy", "type": "mcq", "stem": "Which statement about self-harm matches what the Self Harm page says?", "options": ["It is simply attention seeking behaviour and should be ignored by everyone.", "It is usually a way of coping with intense feelings, not attention seeking.", "It will stop on its own, so professional help is not needed for it.", "It always means the person wants to die and has already planned how to."], "answer": 1, "explanation_en": "Self-harm is not about 'attention seeking': it is often a way of coping with intense emotions and stress, and it does not necessarily mean the person is having suicidal thoughts. It can still cause long-term physical and emotional harm, so professional help is necessary.", "source": "Self Harm(self harm is not \"attention seeking\"; reasons people self harm)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-007", "topic": "Emotional regulation · Anger iceberg", "difficulty": "medium", "type": "mcq", "stem": "The Anger page uses the idea of an 'iceberg' to explain anger. What does the metaphor mean?", "options": ["Anger cannot really be managed, so it should be suppressed at all times.", "Anger is always a sign of an anxiety disorder or another mental illness.", "Anger is the visible emotion, often hiding embarrassment, sadness or jealousy.", "Anger only comes from external events, such as a traffic jam, never our own thoughts."], "answer": 2, "explanation_en": "The point of the iceberg analogy is that anger is what shows on the surface, while embarrassment, frustration, sadness and jealousy sit underneath, so you have to identify the underlying emotion before you can deal with it. The material also states clearly that suppressing anger is not the answer — learning to manage it is.", "source": "Anger(Why am I angry? — anger iceberg; external and internal events)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-008", "topic": "Mental health · Supporting a friend", "difficulty": "medium", "type": "mcq", "stem": "A friend tells you they think they have depression. Which response would the Depression page say is NOT helpful?", "options": ["\"What can I do to help?\"", "\"What's been on your mind recently?\"", "\"How have you been going lately? You seem a little down.\"", "\"Just cheer up and snap out of it.\""], "answer": 3, "explanation_en": "The material specifically says you should not tell a friend to 'cheer up', 'snap out of it' or 'get over it', because that dismisses their feelings. Instead, ask open-ended questions, listen actively and offer a concrete 'how can I help'.", "source": "Depression(Take their feelings seriously — cannot just \"cheer up\", \"snap out of it\")", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-009", "topic": "Where to get help · Booking the school counsellor", "difficulty": "medium", "type": "mcq", "stem": "Which of these does the Support People at School page list as a way to arrange an appointment with a school counsellor?", "options": ["Fill in a referral form or a referral slip, or message a counsellor on Canvas.", "Ask a friend to book the appointment with the school counsellor on your behalf.", "Ask your doctor to write a referral letter before a counsellor will see you.", "Wait for a teacher to notice that you are struggling and refer you themselves."], "answer": 0, "explanation_en": "The page gives three options: fill in the School Counsellor Referral Form, go to the counselling room opposite G201 to fill in a referral slip, or send the counsellor a message on Canvas. Seeing a school counsellor does not require a doctor's referral, although some external services do.", "source": "Support people at school(To organise an appointment with a school counsellor)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-010", "topic": "Stress and coping · Pomodoro technique", "difficulty": "medium", "type": "mcq", "stem": "The Study Tips and Tricks page recommends the Pomodoro technique for breaking up study sessions. What does it involve?", "options": ["Study only in the hour before an exam.", "Work in 25-minute blocks with short breaks in between.", "Study for three hours straight, then take a whole day off.", "Study for 5 minutes and rest for 55 minutes."], "answer": 1, "explanation_en": "The Pomodoro Technique works in 25-minute intervals with short breaks in between. The material adds a firm rule: whatever pace you use, do not work for more than an hour without a break, because productivity falls if you push on for too long.", "source": "Study tips and tricks(Take breaks; Pomodoro technique — 25-minute intervals)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-011", "topic": "Respect and safety · Signs of an unhealthy relationship", "difficulty": "medium", "type": "mcq", "stem": "Which of these is listed on the Relationships page as a sign of an unhealthy relationship?", "options": ["Encouraging each other's hobbies, friendships and time apart", "Talking calmly through disagreements and respecting each other's views", "Checking your partner's phone and demanding to know where they are", "Being open and honest about your thoughts and feelings in the relationship"], "answer": 2, "explanation_en": "Checking a partner's phone or demanding to know where they are is controlling behaviour and shows a lack of trust — both are typical red flags in the material. The four elements of a healthy relationship are respect, communication, trust and support.", "source": "Relationships(Signs of an Unhealthy Relationship / What Makes a Healthy Relationship?)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-012", "topic": "Respect and safety · Gender and identity terms", "difficulty": "medium", "type": "mcq", "stem": "On the Identity and Gender page, which term refers to a person's biological characteristics, such as chromosomes and reproductive organs?", "options": ["Cisgender", "Gender", "Sexuality", "Sex"], "answer": 3, "explanation_en": "Sex refers to biological characteristics such as chromosomes and reproductive organs; gender refers to identity and expression (male, female, non-binary, gender fluid); and sexuality refers to who you are attracted to. Cisgender means your gender identity matches the sex you were assigned at birth.", "source": "Identity and Gender (GENDER / SEX / SEXUALITY comparison table and key terms)", "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-013", "topic": "Mental health · Alcohol and other drug warning signs", "difficulty": "hard", "type": "short", "stem": "A friend has stopped coming to footy training, is sleeping badly, has frequent mood swings and drinks on weekends 'to relax'. Name three signs of substance misuse listed on the Alcohol and Other Drugs page and describe one thing you could do to help.", "options": [], "answer": "Signs include becoming disengaged from activities he used to enjoy, significant behaviour or mood changes, relying on alcohol to relax, and changes in eating and sleeping habits. I would raise it with him calmly and suggest he talks to SSO Sara, who can refer him to a youth drug and alcohol service.", "explanation_en": "The material lists 'avoiding activities you used to enjoy', 'mood swings', 'using alcohol to relax', 'disrupted sleep and diet', and 'increased tolerance' as signs of substance misuse; the first point of contact at school is SSO Sara, who can refer you to services like DAYSS and SDECC.", "source": "Alcohol and Other Drugs(Signs of substance misuse or addiction; Where to go for support)", "marks": 4, "criteria": [{"id": "c1", "t": "Names one listed sign of substance misuse, such as becoming disengaged from activities he used to enjoy", "m": 1}, {"id": "c2", "t": "Names a second listed sign, such as significant behaviour or mood changes", "m": 1}, {"id": "c3", "t": "Names a third listed sign, such as relying on alcohol to relax or changes in eating and sleeping habits", "m": 1}, {"id": "c4", "t": "Describes a helpful action: raising it with him calmly and suggesting he talks to SSO Sara, who can refer him to a youth drug and alcohol service", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names one listed sign of substance misuse, such as becoming disengaged from activities he used to enjoy", "m": 1}, {"id": "c2", "t": "Names a second listed sign, such as significant behaviour or mood changes", "m": 1}, {"id": "c3", "t": "Names a third listed sign, such as relying on alcohol to relax or changes in eating and sleeping habits", "m": 1}, {"id": "c4", "t": "Describes a helpful action: raising it with him calmly and suggesting he talks to SSO Sara, who can refer him to a youth drug and alcohol service", "m": 1}], "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-014", "topic": "Mental health · Confidentiality and safety first", "difficulty": "hard", "type": "short", "stem": "A friend tells you in confidence that they have been hurting themselves and asks you to keep it secret. Describe what the Wellbeing Hub material advises you to do.", "options": [], "answer": "Encourage them to speak to a parent, a school counsellor or SSO Sara, and offer to go with them. If they cannot seek help themselves, ask their permission to tell an adult you trust — but if they refuse and you are still seriously concerned, tell a trusted adult anyway, and call 000 if they are injured or in immediate danger.", "explanation_en": "Safety takes priority over confidentiality; the material clearly states that if someone doesn't want to seek help but you're still very concerned, you should tell a trusted adult; if someone is already hurt or in immediate danger, call 000 immediately.", "source": "Depression(Help them find support)· Self Harm(Who can help?)· Urgent Help(call 000)", "marks": 4, "criteria": [{"id": "c1", "t": "Advises encouraging the friend to speak to a parent, the school counsellor or SSO Sara, and offering to go with them", "m": 1}, {"id": "c2", "t": "Advises asking their permission to tell an adult you trust if they cannot seek help themselves", "m": 1}, {"id": "c3", "t": "States that if they refuse and you are still seriously concerned you should tell a trusted adult anyway, because safety comes before the promise of secrecy", "m": 1}, {"id": "c4", "t": "States that you should call 000 if they are injured or in immediate danger", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Advises encouraging the friend to speak to a parent, the school counsellor or SSO Sara, and offering to go with them", "m": 1}, {"id": "c2", "t": "Advises asking their permission to tell an adult you trust if they cannot seek help themselves", "m": 1}, {"id": "c3", "t": "States that if they refuse and you are still seriously concerned you should tell a trusted adult anyway, because safety comes before the promise of secrecy", "m": 1}, {"id": "c4", "t": "States that you should call 000 if they are injured or in immediate danger", "m": 1}], "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "cw-015", "topic": "Stress · Coping strategies", "difficulty": "hard", "type": "short", "stem": "Exams are two weeks away. Describe two strategies suggested in the Wellbeing Hub for managing stress, and explain why each one helps.", "options": [], "answer": "Box breathing (inhale 4, hold 4, exhale 4, hold 4, repeated at least four times) slows your breathing and calms your body's stress response. Planning a study timetable and studying a little every day spreads the workload and avoids last-minute cramming, which is itself a major source of stress.", "explanation_en": "Breathing techniques help with the physical response 'in the moment', while time management helps with the source of the issue; the material also reminds us that studying for more than an hour without a break can decrease productivity and increase anxiety.", "source": "Anxiety(Box breathing; progressive muscle relaxation)· Study tips and tricks(Plan your time / Study every day / Take breaks)", "marks": 4, "criteria": [{"id": "c1", "t": "Describes box breathing as a strategy: inhale 4, hold 4, exhale 4, hold 4, repeated at least four times", "m": 1}, {"id": "c2", "t": "Explains that box breathing slows your breathing and calms the body's stress response", "m": 1}, {"id": "c3", "t": "Describes planning a study timetable and studying a little every day as the second strategy", "m": 1}, {"id": "c4", "t": "Explains that this spreads the workload and avoids last-minute cramming, which is itself a major source of stress", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes box breathing as a strategy: inhale 4, hold 4, exhale 4, hold 4, repeated at least four times", "m": 1}, {"id": "c2", "t": "Explains that box breathing slows your breathing and calms the body's stress response", "m": 1}, {"id": "c3", "t": "Describes planning a study timetable and studying a little every day as the second strategy", "m": 1}, {"id": "c4", "t": "Explains that this spreads the workload and avoids last-minute cramming, which is itself a major source of stress", "m": 1}], "weak": false, "subj": "cw", "subjZh": "Counsellor and Wellbeing"}, {"id": "engother-001", "topic": "Core concepts · Bias", "difficulty": "easy", "type": "mcq", "stem": "Which term from the unit glossary means 'a preconceived opinion that is not based on reason or actual experience'?", "options": ["Prejudice", "Justice", "Ethics", "Empathy"], "answer": 0, "explanation_en": "The Term 3 vocabulary list defines prejudice as 'a preconceived opinion that is not based on reason or experience'. Empathy is understanding and sharing the feelings of others, ethics is a system of moral principles, and justice is fairness.", "source": "Term 3 · Justice, Ethics and Morality — Key Definitions glossary (10ENGA)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-002", "topic": "Core concepts · Empathy", "difficulty": "easy", "type": "mcq", "stem": "According to the unit's key definitions, which statement best defines 'empathy'?", "options": ["Treating every individual in an equitable and fair way", "Understanding and sharing the feelings of another person", "A system of moral principles that guides behaviour", "The belief that one's own race is superior to another"], "answer": 1, "explanation_en": "Empathy is defined in the vocabulary list as 'understanding and sharing the feelings of others'; the other items on the list are ethics, justice, and racism, which need to be distinguished from one another.", "source": "Term 3 · JEM Key Definitions (10ENGA / LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-003", "topic": "Core concepts · Pathos in war writing", "difficulty": "easy", "type": "mcq", "stem": "The Term 1 unit defines 'the pathos of war' as:", "options": ["The historical timeline of the Western Front from 1914 to 1918", "The patriotic pride soldiers feel when they enlist", "The deep emotional suffering and human tragedy caused by conflict", "The strategic and political causes of a particular battle"], "answer": 2, "explanation_en": "The term 'pathos of war' refers to the deep emotional pain and human tragedy, such as grief, loss, and devastation, that result from conflict, rather than strategic, political or patriotic aspects.", "source": "Term 1 · Pathos of War — All Quiet on the Western Front, introductory definition (10ENGR)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-004", "topic": "War unit · Identity and youth", "difficulty": "medium", "type": "mcq", "stem": "Read the extract: 'Young men of iron. Young? None of us is more than twenty. But young? Young men? That was a long time ago. We are old now.'\nWhat does this extract most strongly suggest about the soldiers?", "options": ["That they are physically the oldest soldiers in the whole regiment", "That they are proud of being described as 'young men of iron'", "That they have genuinely forgotten how old they actually are", "That the war has aged them psychologically, so they no longer feel young"], "answer": 3, "explanation_en": "The repeated questioning and the phrase 'We are old now' create a paradox: the war has aged the soldiers psychologically, although they are not old in years. An answer should name the techniques involved — rhetorical question + contrast.", "source": "Term 2 · AQWF essay extract — 'the impact of war on a soldier's identity' (Glover 10ENGY)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-005", "topic": "War unit · Rhetorical questions", "difficulty": "medium", "type": "mcq", "stem": "Read the extract: 'Like an emptying tube, after a couple of minutes he collapses. What good is it to him now that he was such a good mathematician at school?'\nThe rhetorical question mainly works to:", "options": ["Emphasise how pointless his education now seems", "Praise Leer's achievements at school before he dies", "Suggest that Leer had never been a good student", "Blame Leer himself for the injury that kills him"], "answer": 0, "explanation_en": "The rhetorical question sets 'being good at maths' beside 'dying' and implies that the skill is now useless, which heightens the absurdity of war and the waste of life — a typical example of pathos.", "source": "Term 2 · AQWF essay extract — Leer's death passage (Glover 10ENGY)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-006", "topic": "War unit · Traditional view of war", "difficulty": "medium", "type": "mcq", "stem": "An essay question asks: 'How does Remarque refute traditional notions of war?' What does 'traditional notions of war' refer to?", "options": ["Ideas about the causes of the Treaty of Versailles", "Ideas of honour, glory, duty and patriotic heroism", "Ideas about how novels should be structured", "Ideas about trench construction and military logistics"], "answer": 1, "explanation_en": "Traditional notions of war are the romantic ideas of honour, glory, duty and heroism. Remarque counters that narrative with the harsh realities of blood, fear and meaningless death.", "source": "Term 1 · AQWF additional practice questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-007", "topic": "War unit · De-romanticising techniques", "difficulty": "medium", "type": "short", "stem": "Explain how Remarque challenges traditional, romanticised ideas about war in All Quiet on the Western Front. Refer to at least one technique. (4 marks)", "options": [], "answer": "1 mark — he replaces heroic language with clinical bodily detail (rats, dysentery, amputations, the sounds of dying men).\n1 mark — first-person narration through Paul makes the damage personal rather than statistical.\n1 mark — the ironic gap between the schoolmaster's patriotic speeches and the soldiers' reality undermines the rhetoric of honour and duty.\n1 mark — the effect is to make the reader experience war as physical and psychological damage rather than as glory.", "explanation_en": "Four points carry the marks: vivid detail about bodies, disease and corpses; personalising the loss through first-person narration; contrasting the schoolmaster's patriotic speeches with the soldiers' reality; and focusing on the reader's experience of 'harm' rather than 'glory'. Name at least one literary device, such as imagery, irony or narrative perspective.", "source": "Term 1 · The Pathos of War — 'Romanticism of War' lesson and AQWF novel study (LEEDER 10ENGB)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that Remarque replaces heroic language with clinical bodily detail such as rats, dysentery, amputations and the sounds of dying men", "m": 1}, {"id": "c2", "t": "Explains that first-person narration through Paul makes the damage personal rather than statistical", "m": 1}, {"id": "c3", "t": "Explains the ironic gap between the schoolmaster's patriotic speeches and the soldiers' reality, which undermines the rhetoric of honour and duty", "m": 1}, {"id": "c4", "t": "Explains the effect on the reader: war is experienced as physical and psychological damage rather than glory", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Remarque replaces heroic language with clinical bodily detail such as rats, dysentery, amputations and the sounds of dying men", "m": 1}, {"id": "c2", "t": "Explains that first-person narration through Paul makes the damage personal rather than statistical", "m": 1}, {"id": "c3", "t": "Explains the ironic gap between the schoolmaster's patriotic speeches and the soldiers' reality, which undermines the rhetoric of honour and duty", "m": 1}, {"id": "c4", "t": "Explains the effect on the reader: war is experienced as physical and psychological damage rather than glory", "m": 1}], "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-008", "topic": "Poetry unit · Frost's poetry", "difficulty": "easy", "type": "mcq", "stem": "Which Robert Frost poem studied in Term 2 is built around a speaker choosing between two paths in a wood?", "options": ["'Mending Wall'", "'Birches'", "'The Road Not Taken'", "'Stopping by Woods on a Snowy Evening'"], "answer": 2, "explanation_en": "The central situation of 'The Road Not Taken' is a choice at a fork in the road, whereas 'Mending Wall' is about two neighbours repairing the wall between their properties, 'Birches' is about childhood and escape, and 'Stopping by Woods on a Snowy Evening' is about pausing in snowy woods.", "source": "Term 2 · Robert Frost Poetry — The Road Not Taken, poem and questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-009", "topic": "Poetry unit · Themes in Mending Wall", "difficulty": "medium", "type": "mcq", "stem": "Which Frost poem studied in Term 2 is built around two neighbours repairing a stone wall between their properties?", "options": ["'Birches'", "'The Road Not Taken'", "'Stopping by Woods on a Snowy Evening'", "'Mending Wall'"], "answer": 3, "explanation_en": "The central situation of 'Mending Wall' is two neighbours repairing the stone wall between their properties each spring; the wall becomes a way of discussing boundaries and tradition, and gives the poem its key line, 'Good fences make good neighbours'.", "source": "Term 2 · Robert Frost Poetry — Mending Wall, poem and questions (LEEDER 10ENGB Homepage)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-010", "topic": "Poetry unit · Duty and temptation", "difficulty": "easy", "type": "mcq", "stem": "The exam study materials say an imaginative response may draw on 'the central idea of obligation and responsibility' from 'Stopping by Woods on a Snowy Evening'. Which situation best matches that idea?", "options": ["A traveller lingers in beautiful woods but remembers his promises", "A speaker boasting that he took the difficult path", "A child swinging on birch trees and dreaming of escape", "Two neighbours arguing about who owns the strip of land between them"], "answer": 0, "explanation_en": "The material stresses that the poem's core is obligation and responsibility: the traveller is drawn to the snowy woods but remembers his 'promises to keep' and travels on. 'Birches' corresponds to childhood and escape, 'Mending Wall' to neighbourly boundaries, and 'The Road Not Taken' to choice.", "source": "Year 10 English 2026 — YEAR 10 EXAM STUDY MATERIALS (Frost imaginative prompts)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-011", "topic": "Poetry unit · Creative imitation", "difficulty": "hard", "type": "short", "stem": "A question asks you to write an imaginative piece 'dealing with solitude and reflection', using a character from the world of Frost's poetry. Explain how you would develop setting, character and structure without simply retelling the poem. (5 marks)", "options": [], "answer": "1 mark — borrow the situation, not the plot: keep the isolated setting (a snow-filled wood, a stone wall at dusk) but invent a new persona.\n1 mark — give the character a specific voice and a memory that explains their solitude.\n1 mark — use one recurring image and controlled sentence length to create the reflective tone.\n1 mark — organise the piece with a flashback that turns the reflection into a decision or a changed understanding.\n1 mark — end on that change rather than on a summary of Frost's lines, so the piece is a new story rather than a retelling.", "explanation_en": "The task asks you to use Frost's language features, conventions and themes to make something new rather than simply retelling. The five points are: borrow the situation, not the plot; give the character a voice and a memory; use a single recurring image and sentence structure to control pace; use a flashback to create a turn; and focus on 'transformation', not on summarising the original poem.", "source": "Term 2 · Frost imaginative task — 'construct an imaginative piece that deals with solitude and reflection' (Glover 10ENGY)", "marks": 5, "criteria": [{"id": "c1", "t": "Borrows the situation rather than the plot, keeping an isolated Frost setting such as a snow-filled wood or a stone wall at dusk but inventing a new persona", "m": 1}, {"id": "c2", "t": "Gives the character a specific voice and a memory that explains their solitude", "m": 1}, {"id": "c3", "t": "Uses one recurring image and controlled sentence length to create the reflective tone", "m": 1}, {"id": "c4", "t": "Organises the piece with a flashback that turns the reflection into a decision or a changed understanding", "m": 1}, {"id": "c5", "t": "Ends on that change rather than a summary of Frost's lines, so the piece is a new story rather than a retelling", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Borrows the situation rather than the plot, keeping an isolated Frost setting such as a snow-filled wood or a stone wall at dusk but inventing a new persona", "m": 1}, {"id": "c2", "t": "Gives the character a specific voice and a memory that explains their solitude", "m": 1}, {"id": "c3", "t": "Uses one recurring image and controlled sentence length to create the reflective tone", "m": 1}, {"id": "c4", "t": "Organises the piece with a flashback that turns the reflection into a decision or a changed understanding", "m": 1}, {"id": "c5", "t": "Ends on that change rather than a summary of Frost's lines, so the piece is a new story rather than a retelling", "m": 1}], "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-012", "topic": "Reading paper · Text types", "difficulty": "easy", "type": "mcq", "stem": "In the Term 3 Reading Section (15 marks), which texts are you asked to analyse?", "options": ["Australian newspaper editorials and film reviews", "Historical images, protest poetry and speech extracts", "Shakespearean soliloquies and Romantic poetry", "Novel chapters and wartime diary entries"], "answer": 1, "explanation_en": "The material lists three text types: historical images, protest and civil rights poetry, and excerpts from the speeches of civil rights figures. Each needs its own analytical terms, so practise them separately.", "source": "Term 3 · Reading Section (15 marks) — task outline (10ENGA)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-013", "topic": "Reading paper · Tone and attitude", "difficulty": "medium", "type": "mcq", "stem": "'Still I Rise' is studied in the Term 3 Reading Section. Which attitude does the speaker most clearly represent?", "options": ["Indifference towards history, politics and the struggle for change", "Nostalgia for a lost childhood home and the songs of the past", "Defiant pride and a refusal to be diminished by oppression", "Resigned acceptance of injustice and a longing for silence"], "answer": 2, "explanation_en": "The poem voices resistance and dignity through the repeated phrase 'I rise'; it belongs with the poems that represent injustice, discrimination and resistance, rather than resignation or nostalgia.", "source": "Term 3 · 'Still I Rise' poem and questions (10ENGL TERM THREE HOMEPAGE)", "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}, {"id": "engother-014", "topic": "Reading paper · Protest poetry techniques", "difficulty": "hard", "type": "short", "stem": "Explain how repetition and direct address help a protest poem construct resistance. (4 marks)", "options": [], "answer": "1 mark — repetition of an assertive phrase works like a refrain, turning a private feeling into a public chant.\n1 mark — the repeated assertion makes the speaker's defiance sound unstoppable, which is itself an argument against oppression.\n1 mark — direct address ('you') pulls the reader or the oppressor into the poem, so the audience cannot remain neutral.\n1 mark — combined with a rising tone, the poem turns testimony into a demand for recognition.", "explanation_en": "Four points carry the marks: repetition working as a refrain; private emotion turned into a public slogan; an 'unstoppable' tone; and direct address to the reader or the oppressor, which turns testimony into a demand. The analysis must focus on effect, not on counting devices.", "source": "Term 3 · Poem Techniques — 'Still I Rise' / 'Caged Bird' / 'They Took Me from My Mother' reading practice", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that repetition of an assertive phrase works like a refrain, turning a private feeling into a public chant", "m": 1}, {"id": "c2", "t": "Explains that the repeated assertion makes the speaker's defiance sound unstoppable, which is itself an argument against oppression", "m": 1}, {"id": "c3", "t": "Explains that direct address pulls the reader or the oppressor into the poem, so the audience cannot remain neutral", "m": 1}, {"id": "c4", "t": "Explains that, combined with a rising tone, the poem turns testimony into a demand for recognition", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that repetition of an assertive phrase works like a refrain, turning a private feeling into a public chant", "m": 1}, {"id": "c2", "t": "Explains that the repeated assertion makes the speaker's defiance sound unstoppable, which is itself an argument against oppression", "m": 1}, {"id": "c3", "t": "Explains that direct address pulls the reader or the oppressor into the poem, so the audience cannot remain neutral", "m": 1}, {"id": "c4", "t": "Explains that, combined with a rising tone, the poem turns testimony into a demand for recognition", "m": 1}], "weak": false, "subj": "engother", "subjZh": "English · Non-exam content (Terms 1–3)"}]};

/* ===== 简答自动预判：关键词覆盖率（离线，无需后端） ===== */
const AUTO_STOP = ("the a an of and or to in on for with that this these those is are was were be been being " +
  "as at by from it its their they them we you your our not no but if then than so such can could may might " +
  "will would should must have has had do does did which who whom what when where why how all any more most " +
  "other some only own same very just also into over under about after before between through during").split(" ");
const AUTO_STOP_SET = {};
AUTO_STOP.forEach(function(w){ AUTO_STOP_SET[w] = 1; });
function autoStem(w){
  return String(w||"").toLowerCase()
    .replace(/'s$/,"").replace(/ies$/,"y").replace(/ing$/,"").replace(/ed$/,"")
    .replace(/es$/,"").replace(/s$/,"");
}
function autoKeywords(text){
  var raw = String(text||"").toLowerCase().split(/[^a-z'-]+/);
  var out = [];
  raw.forEach(function(w){
    if(w.length < 4) return;
    if(AUTO_STOP_SET[w]) return;
    var st = autoStem(w);
    if(st.length < 3) return;
    if(out.indexOf(st) < 0) out.push(st);
  });
  return out;
}
function autoScore(pointText, answerText){
  var kw = autoKeywords(pointText);
  if(!kw.length) return {hit:false, ratio:0, matched:0, total:0, missing:[]};
  var mine = {};
  String(answerText||"").toLowerCase().split(/[^a-z'-]+/).forEach(function(w){ mine[autoStem(w)] = 1; });
  var matched = 0, missing = [];
  kw.forEach(function(k){ if(mine[k]) matched++; else missing.push(k); });
  var ratio = matched / kw.length;
  return {hit: ratio >= 0.5, ratio: ratio, matched: matched, total: kw.length, missing: missing.slice(0,4)};
}

}
