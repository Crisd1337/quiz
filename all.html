stic (1 mark) and for listing additional ones (a further 1 mark). The five characteristics are: control, strong problem-solving skills, solid social connections, seeing oneself as a 'survivor' rather than a 'victim', and being able to seek help. 'Never seeking help' and a 'victim mentality' are the opposite.", "source": "Term 2 · Lesson 3 Characteristics of Resilient people", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-026", "topic": "Mental health · Barriers to help-seeking", "difficulty": "hard", "type": "short", "stem": "Explain TWO barriers that stop young people, especially young males, from seeking help for a mental health issue, and outline one way each barrier could be reduced.", "options": [], "answer": "Stigma: seeing mental illness as weakness or as 'not masculine' makes young men hide their feelings and bottle them up, so problems get worse; it can be reduced through mental health education and campaigns that present help-seeking as normal. Low mental health literacy: many cannot recognise their own symptoms or do not know which service to contact, so they wait until crisis point; this can be reduced by teaching help-seeking skills in school and promoting services such as ReachOut, Beyond Blue and Headspace.", "explanation_en": "Marks are awarded for each barrier (1 mark) plus an explanation of why it stops help-seeking (1 mark), 4 marks in total, and for the matching improvement measure for each barrier (1 mark each, 2 marks). Barriers and measures must be matched one to one: using 'strengthening education' to solve 'high costs' is an invalid pairing and earns nothing.", "source": "Term 2 · Lesson 8 Seeking Help · Barriers to seeking help", "marks": 6, "criteria": [{"id": "c1", "t": "Identifies stigma as a barrier for young people, especially young males", "m": 1}, {"id": "c2", "t": "Explains why stigma blocks help-seeking: seeing mental illness as weakness or as 'not masculine' makes young men hide their feelings and bottle them up, so problems get worse", "m": 1}, {"id": "c3", "t": "Outlines one way stigma could be reduced (e.g. mental health education and campaigns that present help-seeking as normal)", "m": 1}, {"id": "c4", "t": "Identifies low mental health literacy as the second barrier", "m": 1}, {"id": "c5", "t": "Explains why it blocks help-seeking: many cannot recognise their own symptoms or do not know which service to contact, so they wait until crisis point", "m": 1}, {"id": "c6", "t": "Outlines one way this could be reduced (e.g. teaching help-seeking skills in school and promoting services such as ReachOut, Beyond Blue and Headspace)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies stigma as a barrier for young people, especially young males", "m": 1}, {"id": "c2", "t": "Explains why stigma blocks help-seeking: seeing mental illness as weakness or as 'not masculine' makes young men hide their feelings and bottle them up, so problems get worse", "m": 1}, {"id": "c3", "t": "Outlines one way stigma could be reduced (e.g. mental health education and campaigns that present help-seeking as normal)", "m": 1}, {"id": "c4", "t": "Identifies low mental health literacy as the second barrier", "m": 1}, {"id": "c5", "t": "Explains why it blocks help-seeking: many cannot recognise their own symptoms or do not know which service to contact, so they wait until crisis point", "m": 1}, {"id": "c6", "t": "Outlines one way this could be reduced (e.g. teaching help-seeking skills in school and promoting services such as ReachOut, Beyond Blue and Headspace)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-027", "topic": "Nutrition · Types of health services", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is listed in the course as a type of health service available to young people?", "options": ["Private driving lessons", "Nutritional support", "Private exam tutoring", "Careers counselling"], "answer": 1, "explanation_en": "Marks are awarded for recognising 'nutrition support' as a health service (1 mark) and for listing additional categories (a further 1 mark). Lesson 1 lists nine categories: mental health, dental, substance abuse treatment, preventive care, physical and occupational therapy, nutrition support, pharmaceutical services, transportation, and prenatal care. A nutritionist or dietitian sits in the nutrition support category.", "source": "Term 3 · Lesson 1 Health Services · Types of Health services", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-028", "topic": "Nutrition · Self-management", "difficulty": "medium", "type": "short", "stem": "Explain why nutrition and physical activity are described as self-management skills for adulthood, and give one specific example of each.", "options": [], "answer": "They are self-management skills because adults must regulate their own daily routine — no one else plans their meals or schedules their exercise — and these habits strongly shape long-term health, energy levels and disease risk. Example: planning meals around the core food groups (vegetables, fruit, grains, lean protein, dairy or alternatives) instead of relying on takeaway; example: scheduling at least 60 minutes of moderate physical activity each day.", "explanation_en": "Marks are awarded for explaining why it is self-management — you have to plan it yourself, with no one planning it for you, and it directly affects long-term health (2 marks); a nutrition example (1 mark); a physical activity example (1 mark); and pointing out the link to disease risk (1 mark). Examples must name a specific behaviour; 'eating healthily' does not count.", "source": "Term 3 · Lesson 8 Life Challenges · Self-Management Skills (nutrition and fitness detail supplemented from the syllabus)", "marks": 5, "criteria": [{"id": "c1", "t": "Explains that these are self-management skills because adults must regulate their own daily routine: no one else plans their meals or schedules their exercise", "m": 1}, {"id": "c2", "t": "Explains that these habits strongly shape long-term health and energy levels", "m": 1}, {"id": "c3", "t": "Links the behaviours to disease risk, showing why the habits matter for adult health", "m": 1}, {"id": "c4", "t": "Gives one specific nutrition example (e.g. planning meals around the core food groups — vegetables, fruit, grains, lean protein, dairy or alternatives — instead of relying on takeaway)", "m": 1}, {"id": "c5", "t": "Gives one specific physical activity example (e.g. scheduling at least 60 minutes of moderate physical activity each day)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that these are self-management skills because adults must regulate their own daily routine: no one else plans their meals or schedules their exercise", "m": 1}, {"id": "c2", "t": "Explains that these habits strongly shape long-term health and energy levels", "m": 1}, {"id": "c3", "t": "Links the behaviours to disease risk, showing why the habits matter for adult health", "m": 1}, {"id": "c4", "t": "Gives one specific nutrition example (e.g. planning meals around the core food groups — vegetables, fruit, grains, lean protein, dairy or alternatives — instead of relying on takeaway)", "m": 1}, {"id": "c5", "t": "Gives one specific physical activity example (e.g. scheduling at least 60 minutes of moderate physical activity each day)", "m": 1}], "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-029", "topic": "Health information · Judging credibility", "difficulty": "medium", "type": "mcq", "stem": "A website advertises a 'detox cleanse' that claims to cure anxiety. Which question would BEST help you judge the credibility of this service?", "options": ["How colourful and modern does the website look to you?", "Is the product cheap enough to be worth trying anyway?", "What qualifications and training does the practitioner have?", "How many people have shared this advertisement on social media?"], "answer": 2, "explanation_en": "Marks are awarded for choosing 'qualifications and training' (1 mark), and for supplementing that judgement with further questions drawn from the material (a further 2 marks): what treatment is provided, what effects it has, the cost, and whether it can be used alongside conventional medicine. A website's appearance, how often it has been forwarded and its price cannot prove effectiveness — this is a common trap in this type of question.", "source": "Term 3 · Lesson 3 Assessing Credibility of Health Information", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "pdh-030", "topic": "Gambling · Four influences", "difficulty": "medium", "type": "mcq", "stem": "What are the four main influences on a young person's attitude to gambling identified in the lesson?", "options": ["Personality, fatigue, alcohol use and speeding", "Cost, transport, language barriers and long waiting times", "Family income, suburb, age and gender of the player", "Advertising, friends, easy access and gambling-like games"], "answer": 3, "explanation_en": "Marks are awarded for each of the four items (1 mark each, 4 marks): advertising, whether friends gamble (peer pressure), ease of access, and games that look like gambling. 'Cost, transport, language barriers and long waiting times' are barriers to health services, and 'personality, fatigue, alcohol use and speeding' are the Fatal Five of road safety, which students often confuse with this question.", "source": "Term 1 · Lesson 8 Gambling · Potential Influences on Gambling (explicitly required by Study Guide Section 2)", "weak": false, "subj": "pdh", "subjZh": "Year 10 PDHPE"}, {"id": "out-001", "topic": "Environmental awareness · Biodiversity", "difficulty": "easy", "type": "mcq", "stem": "How is biodiversity defined in this unit?", "options": ["The variety of living organisms present", "The total number of species in a habitat", "The number of endangered species", "The non-living parts of that habitat"], "answer": 0, "explanation_en": "The course defines biodiversity as the 'variety of living organisms', which is not the same as the number of animals in a habitat, or the non-living environment.", "source": "Study Guide · Lesson 1 Introduction to Environmental Awareness", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-002", "topic": "Ecosystems · Biotic and abiotic factors", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is an ABIOTIC factor in an ecosystem?", "options": ["Bacteria living in soil", "Sunlight and soil moisture", "Kangaroos grazing on grass", "Fungi breaking down leaves"], "answer": 1, "explanation_en": "Abiotic means non-living: sunlight, water, soil, temperature and so on. Biotic refers to living organisms — fungi and bacteria are invisible to the naked eye, but they are alive and therefore biotic. That distinction is where marks are most commonly lost.", "source": "Study Guide · Lesson 2 Ecosystems and Interactions", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-003", "topic": "Ecosystems · Definition", "difficulty": "easy", "type": "mcq", "stem": "Which definition of an ecosystem matches the course?", "options": ["A group of animals of the same species in an area", "All the plants that grow in a particular region", "A community of living and non-living things interacting", "The physical features of a landscape, such as soil and rain"], "answer": 2, "explanation_en": "The key to an ecosystem is the combination of 'biotic + abiotic + interactions'. Focusing on the plants, the animals or the non-living environment alone covers only part of it.", "source": "Study Guide · Lesson 2 Ecosystems and Interactions", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-004", "topic": "Human impacts · Short term and long term", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is an example of a LONG-TERM human impact on ecosystems?", "options": ["Littering a campsite with food packaging and cans", "Dropping a plastic bag into a creek during a picnic", "A bushwalker crushing vegetation by leaving the marked track", "Climate change gradually reducing biodiversity over decades"], "answer": 3, "explanation_en": "Short-term impacts happen immediately, such as littering or trampling vegetation, while long-term impacts accumulate over time, like climate change, and are often harder to reverse as habitats can be permanently damaged.", "source": "Study Guide · Lesson 3 Human Impact on the Environment", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-005", "topic": "Leave No Trace · Seven principles", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is one of the seven Leave No Trace principles taught in this unit?", "options": ["Travel and camp on durable surfaces", "Build a fire ring at each campsite", "Leave marked tracks to find quiet spots", "Feed wildlife so they stay calm near people"], "answer": 0, "explanation_en": "One of the seven principles is to 'travel and camp on durable surfaces', whereas building a new fire ring, feeding wildlife, or leaving the trail are all high-impact actions.", "source": "Study Guide · Lesson 5 Leave No Trace", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-006", "topic": "Indigenous perspectives · Connection to Country", "difficulty": "easy", "type": "mcq", "stem": "What does 'Connection to Country' mean for Aboriginal and Torres Strait Islander peoples?", "options": ["A legal title to land that allows selling its natural resources", "A spiritual and cultural relationship with land and waterways", "An agreement with government to manage national parks", "A seasonal camp used for hunting and fishing only"], "answer": 1, "explanation_en": "Connection to Country is a spiritual, cultural and environmental relationship in which Country takes in land, water, plants and animals as well as cultural identity. The key idea is that Country is not something to be owned but something to be cared for and protected.", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-007", "topic": "Indigenous perspectives · Cultural burning", "difficulty": "medium", "type": "mcq", "stem": "Which description of cultural burning matches the lesson?", "options": ["Burning at random times with no planning or control at all", "Large, high-intensity fires lit in summer to clear all vegetation", "Small, low-intensity controlled fires that safely reduce fuel loads", "Burning only after a wildfire has already started, to stop it spreading"], "answer": 2, "explanation_en": "Cultural burning involves small, low-intensity, planned burns at specific times to reduce fuel loads, and its benefits include reducing the risk of large fires, promoting plant regeneration and supporting biodiversity, which is different from uncontrolled fires or waiting for fires to happen.", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land · Cultural Burning", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-008", "topic": "Leave No Trace · Durable surfaces", "difficulty": "medium", "type": "mcq", "stem": "Why does Leave No Trace advise walking and camping on durable surfaces?", "options": ["It increases the chance of seeing wildlife up close", "It makes finding the way back much easier", "It keeps hikers' boots and tents cleaner", "It protects vegetation and reduces soil erosion"], "answer": 3, "explanation_en": "The sample answer in the Response Guide states that walking on durable surfaces 'protects vegetation and reduces soil erosion from trampling', because new paths widen over time and can turn into gullies — a common form of long-term damage in camping areas.", "source": "Study Guide · Lesson 5 Leave No Trace · Response Guide", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-009", "topic": "Sustainable practice · High-impact camping", "difficulty": "medium", "type": "mcq", "stem": "Which camper behaviour is a HIGH-IMPACT practice?", "options": ["Cutting branches from live trees for a campfire", "Camping in an already established campsite", "Using a fuel stove instead of lighting a fire", "Carrying all your own rubbish out in a sealed bag"], "answer": 0, "explanation_en": "Cutting live branches for firewood damages vegetation and habitat directly and raises the risk of bushfire, so it is a high-impact action. Using a fuel stove, camping on an established site and carrying out all your rubbish are low-impact practices.", "source": "Study Guide · Lesson 4 Sustainable Practices and Camping Impact", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-010", "topic": "Ecosystems · Interdependence", "difficulty": "medium", "type": "mcq", "stem": "In the Yellowstone example used in the unit, removing wolves caused elk numbers to rise and damage plant life, and reintroducing them gradually restored balance. What does this best demonstrate?", "options": ["Predators are harmful to ecosystems and should be removed", "Ecosystems are interconnected, so removing one part affects the rest", "Only abiotic factors can change the balance of an ecosystem", "Plant life always recovers on its own, whatever happens to animals"], "answer": 1, "explanation_en": "This case illustrates the interdependence of ecosystems: removing one element, such as a top predator, has a ripple effect along the food chain. That is the reasoning used to answer a question such as 'why not just get rid of sharks?'", "source": "Study Guide · Lesson 2 Ecosystems and Interactions · Response Guide", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-011", "topic": "Indigenous perspectives · Freshwater stream case study", "difficulty": "hard", "type": "mcq", "stem": "The Freshwater Creek case study compares an Indigenous significant site with the effects of Western urbanisation. Which statement BEST describes the difference?", "options": ["Indigenous management had little effect because the local clans did not use the wetlands", "Both approaches treated the wetlands mainly as a drinking water source", "Indigenous use kept the wetlands alive; urbanisation drained and piped them away", "Indigenous management drained the wetlands, while urbanisation restored them as parkland"], "answer": 2, "explanation_en": "The case compares the high spiritual value of the area for the Gayamaygal and Garigal people as a source of drinking water, fishing and camping, to its destruction and conversion into a concrete stormwater drain through urbanisation.", "source": "Study Guide · Lesson 6 Cultural Perspectives & Connection to Land · Freshwater Creek Case Study", "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-012", "topic": "Ecosystems · Biotic and abiotic interactions", "difficulty": "medium", "type": "short", "stem": "Explain how biotic and abiotic factors interact within an ecosystem. Use TWO examples in your response.", "options": [], "answer": "Biotic and abiotic factors interact to keep ecosystems healthy. Plants depend on abiotic factors such as sunlight, water and soil to grow, while animals depend on those plants for food and shelter. If an abiotic factor changes — for example rainfall falling during a drought — plant growth declines, which then reduces food for herbivores and, in turn, for predators further up the food chain.", "explanation_en": "You need to write a causal chain: 'abiotic → biotic → downstream food chain'. Useful examples are plants depending on sunlight, water and soil, or drought reducing plant growth, which then leaves herbivores short of food. Simply listing factors without explaining the links gains no marks.", "source": "Study Guide · Lesson 2 · Response Guide (PEEL model answer for a 4-mark question)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that plants depend on abiotic factors such as sunlight, water and soil to grow", "m": 1}, {"id": "c2", "t": "Explains that animals depend on those plants for food and shelter", "m": 1}, {"id": "c3", "t": "Gives a second example: a change in an abiotic factor, such as lower rainfall during a drought, reduces plant growth", "m": 1}, {"id": "c4", "t": "Traces the causal chain: fewer plants means less food for herbivores and, in turn, for predators further up the food chain", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that plants depend on abiotic factors such as sunlight, water and soil to grow", "m": 1}, {"id": "c2", "t": "Explains that animals depend on those plants for food and shelter", "m": 1}, {"id": "c3", "t": "Gives a second example: a change in an abiotic factor, such as lower rainfall during a drought, reduces plant growth", "m": 1}, {"id": "c4", "t": "Traces the causal chain: fewer plants means less food for herbivores and, in turn, for predators further up the food chain", "m": 1}], "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-013", "topic": "Human impacts · Short vs long term", "difficulty": "medium", "type": "short", "stem": "Explain the difference between short-term and long-term human impacts on ecosystems, and give one example of each.", "options": [], "answer": "Short-term impacts occur immediately, while long-term impacts develop gradually over time. Littering a natural area is a short-term impact because it pollutes waterways and harms wildlife straight away. Climate change is a long-term impact because it slowly raises temperatures and reduces biodiversity over many years, and it is much harder to reverse.", "explanation_en": "You need the distinction between 'immediate vs cumulative' and 'reversible vs irreversible', with an example of each, plus the point that long-term impacts are harder to repair because habitats can be permanently damaged or food chains disrupted.", "source": "Study Guide · Lesson 3 · Response Guide (PEEL model answer for a 4-mark question)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that short-term impacts occur immediately", "m": 1}, {"id": "c2", "t": "Explains that long-term impacts develop gradually over time and are much harder to reverse", "m": 1}, {"id": "c3", "t": "Gives one valid short-term example, such as littering polluting waterways and harming wildlife straight away", "m": 1}, {"id": "c4", "t": "Gives one valid long-term example, such as climate change slowly raising temperatures and reducing biodiversity over many years", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that short-term impacts occur immediately", "m": 1}, {"id": "c2", "t": "Explains that long-term impacts develop gradually over time and are much harder to reverse", "m": 1}, {"id": "c3", "t": "Gives one valid short-term example, such as littering polluting waterways and harming wildlife straight away", "m": 1}, {"id": "c4", "t": "Gives one valid long-term example, such as climate change slowly raising temperatures and reducing biodiversity over many years", "m": 1}], "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-014", "topic": "Leave No Trace · Purpose of the principles", "difficulty": "hard", "type": "short", "stem": "Explain why Leave No Trace principles are important in protecting outdoor environments. Refer to at least TWO principles in your response.", "options": [], "answer": "Leave No Trace principles reduce the human impact of recreation so that natural areas stay healthy and can be enjoyed by future visitors. Disposing of waste properly reduces pollution and stops wildlife being harmed or attracted to human food. Travelling and camping on durable surfaces protects vegetation and reduces soil erosion caused by foot traffic. Respecting wildlife also matters, because feeding animals changes their behaviour, makes them dependent on humans and disrupts ecosystem balance.", "explanation_en": "You must refer to at least two principles and explain how each one protects ecosystems. Usable choices include disposing of waste properly, travelling and camping on durable surfaces, respecting wildlife, minimising campfire impacts, and planning and preparation. Reciting principle names without explaining what they do loses marks.", "source": "Study Guide · Lesson 5 Leave No Trace + Response Guide / Practice Questions (5-mark question)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains the general purpose: Leave No Trace reduces the human impact of recreation so natural areas stay healthy for future visitors", "m": 1}, {"id": "c2", "t": "Refers to one principle and explains its effect, e.g. disposing of waste properly reduces pollution and stops wildlife being harmed or attracted to human food", "m": 1}, {"id": "c3", "t": "Refers to a second principle and explains its effect, e.g. camping on durable surfaces protects vegetation and reduces soil erosion", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains the general purpose: Leave No Trace reduces the human impact of recreation so natural areas stay healthy for future visitors", "m": 1}, {"id": "c2", "t": "Refers to one principle and explains its effect, e.g. disposing of waste properly reduces pollution and stops wildlife being harmed or attracted to human food", "m": 1}, {"id": "c3", "t": "Refers to a second principle and explains its effect, e.g. camping on durable surfaces protects vegetation and reduces soil erosion", "m": 1}], "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "out-015", "topic": "Indigenous perspectives · Evaluating Caring for Country", "difficulty": "hard", "type": "short", "stem": "Evaluate how Aboriginal and Torres Strait Islander peoples' approaches to caring for Country contribute to the protection of ecosystems AND communities.", "options": [], "answer": "Caring for Country supports ecosystems through practices such as cultural burning, which uses small, low-intensity controlled fires to reduce fuel loads, lower the risk of large bushfires, encourage plant regrowth and support biodiversity, and through seasonal resource use that takes only what is needed. These practices also support communities: healthy Country provides clean water, habitats and food, while continued connection to Country strengthens cultural identity and community wellbeing. Overall, this long-term custodial approach is more sustainable than treating land purely as a resource, although neither perspective is entirely right or wrong.", "explanation_en": "For an evaluation, cover both 'ecology + community' and finish with an overall judgement: cultural practices reduce flammable material and promote regeneration, and a healthy environment provides water, food and habitat that reinforce cultural identity. That is what supports the conclusion that long-term care is more sustainable.", "source": "Study Guide · Lesson 6 · Response Guide + Practice Questions (10-mark question)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains how cultural burning supports ecosystems: small, low-intensity controlled fires reduce fuel loads and lower the risk of large bushfires", "m": 1}, {"id": "c2", "t": "Explains that these practices encourage plant regrowth and support biodiversity, and that seasonal resource use takes only what is needed", "m": 1}, {"id": "c3", "t": "Explains how caring for Country supports communities: healthy Country provides clean water, habitats and food, and connection to Country strengthens cultural identity and wellbeing", "m": 1}, {"id": "c4", "t": "Reaches an evaluative judgement that this long-term custodial approach is more sustainable than treating land purely as a resource", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains how cultural burning supports ecosystems: small, low-intensity controlled fires reduce fuel loads and lower the risk of large bushfires", "m": 1}, {"id": "c2", "t": "Explains that these practices encourage plant regrowth and support biodiversity, and that seasonal resource use takes only what is needed", "m": 1}, {"id": "c3", "t": "Explains how caring for Country supports communities: healthy Country provides clean water, habitats and food, and connection to Country strengthens cultural identity and wellbeing", "m": 1}, {"id": "c4", "t": "Reaches an evaluative judgement that this long-term custodial approach is more sustainable than treating land purely as a resource", "m": 1}], "weak": false, "subj": "out", "subjZh": "Year 10 Outdoor Education"}, {"id": "ftn-001", "topic": "Food safety · Temperature danger zone", "difficulty": "easy", "type": "mcq", "stem": "What is the temperature range of the food safety 'danger zone'?", "options": ["5°C to 60°C", "0°C to 5°C", "60°C to 100°C", "−18°C to 4°C"], "answer": 0, "explanation_en": "The danger zone for bacterial growth is 5°C–60°C, where harmful bacteria multiply fastest. Temperatures below 0°C only slow growth down; they do not kill the bacteria.", "source": "Structured Responses (Sample Answers).pdf — The Danger Zone", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-002", "topic": "Food safety · 2-hour / 4-hour rule", "difficulty": "easy", "type": "mcq", "stem": "Under the 2-hour/4-hour rule, what must happen to potentially hazardous food that has been in the danger zone for more than 4 hours?", "options": ["It can be returned to the fridge and used again the next day", "It must be thrown away because bacteria levels are too high", "It can be frozen and kept for up to one week", "It can be reheated to 100°C and then served"], "answer": 1, "explanation_en": "If food has been out for more than 4 hours, the bacterial count will be too high and it must be thrown away; reheating or refrigerating it will not fix the problem.", "source": "Structured Responses (Sample Answers).pdf — The 2-Hour / 4-Hour Rule", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-003", "topic": "Food safety · 2-hour / 4-hour rule", "difficulty": "medium", "type": "mcq", "stem": "A tray of cooked chicken has been sitting at room temperature for 3 hours. Under the 2-hour/4-hour rule, which action is correct?", "options": ["Reheat it, then freeze it for the following week", "Return it to the fridge and use it later", "Eat it now, but do not return it to the fridge", "Throw the chicken away immediately"], "answer": 2, "explanation_en": "Food that has been in the danger zone for more than 2 hours but less than 4 hours can still be eaten, but it cannot go back into the fridge; only food that has been out for less than 2 hours may be refrigerated.", "source": "Structured Responses (Sample Answers).pdf — The 2-Hour / 4-Hour Rule", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-004", "topic": "Food safety · Refrigeration temperatures", "difficulty": "easy", "type": "mcq", "stem": "To keep perishable food out of the danger zone, foods such as ham and salami should be stored at:", "options": ["8°C or below", "About 22°C", "About 60°C", "4°C or below"], "answer": 3, "explanation_en": "To slow down bacterial growth, food must be refrigerated at 4°C or below, as temperatures like 8°C or 22°C are too high to prevent bacterial multiplication.", "source": "Structured Responses (Sample Answers).pdf — The Danger Zone(Industry Example)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-005", "topic": "Kitchen operations · Mise en place", "difficulty": "easy", "type": "mcq", "stem": "In a commercial kitchen, 'mise en place' refers to:", "options": ["Preparing ingredients and equipment before cooking", "Cleaning down kitchen benches at the end of service", "Plating the finished dish neatly for service", "Ordering stock and checking supplier deliveries"], "answer": 0, "explanation_en": "Mise en place refers to having all ingredients ready, including chopping onions, measuring seasonings, and preheating the oven, as skipping this step can lead to poor workflow.", "source": "Term 1 · Assumed Knowledge Quiz 6: Mise en place; Structured Responses (Sample Answers).pdf — Poor Workflow", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-006", "topic": "Food equity · Definition", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines food inequity?", "options": ["People choose not to eat certain foods for religious reasons", "Some groups have limited access to affordable, safe food while others do not", "Restaurants charge different prices for the same meal", "Everyone in a country has equal access to safe, nutritious food"], "answer": 1, "explanation_en": "Food inequity highlights the issue of unequal access to sufficient, safe, and nutritious food, and should not be confused with religious dietary restrictions or personal choices.", "source": "Term 1 · Food Inequity Assignment (Part 1 – Define)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-007", "topic": "Food equity · Affected groups", "difficulty": "easy", "type": "mcq", "stem": "According to the Term 1 unit, which group is identified as likely to experience food inequity in developed and developing countries?", "options": ["Professional athletes on high incomes", "Full-time university students living on campus", "People on low incomes or who are unemployed", "Food critics who review restaurants"], "answer": 2, "explanation_en": "People on low incomes or who are unemployed are the typical examples of groups affected by food inequity, along with rural residents, women and children, the elderly, people with chronic illnesses, people with disabilities, Aboriginal and Torres Strait Islander peoples, and people who are homeless.", "source": "Term 1 · Food Inequity Assignment (Introduction — list of affected groups)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-008", "topic": "Food equity · Charities", "difficulty": "medium", "type": "mcq", "stem": "Which Australian organisation was listed in the Term 1 assignment as a charity that rescues surplus food and redistributes it to people experiencing food insecurity?", "options": ["Woolworths", "Fair Work Australia", "MasterChef Australia", "OzHarvest"], "answer": 3, "explanation_en": "OzHarvest is an Australian food-rescue charity: it collects surplus food from businesses and distributes it to people in need. Woolworths, by contrast, is a supermarket chain and Fair Work is a workplace regulator, neither of which is a charity.", "source": "Term 1 · Food Inequity Assignment (Part 1 – charity list) (charity functions supplemented from syllabus knowledge)", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-009", "topic": "Food trends · Snackification", "difficulty": "easy", "type": "mcq", "stem": "The food trend known as 'snackification' refers to:", "options": ["Replacing main meals with more frequent, smaller snacks", "Selling snacks only through supermarkets", "Eating only two large meals a day and no snacks in between", "Removing all snacks from your daily diet"], "answer": 0, "explanation_en": "Snackification refers to the trend of replacing traditional meals with more frequent, smaller, and convenient eating occasions, which is the opposite of reducing snacking.", "source": "Term 2 · Food Trends: Quiz 4 Snackification and other Food Trends", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-010", "topic": "Food trends · Ugly fruit and vegetables", "difficulty": "medium", "type": "mcq", "stem": "Supermarkets selling 'ugly' fruit and vegetables is a trend that mainly aims to:", "options": ["Charge a higher price for imperfect-looking produce", "Reduce food waste by selling produce rejected as ugly", "Replace fresh produce with canned produce", "Encourage farmers to grow fewer vegetables"], "answer": 1, "explanation_en": "This trend targets 'ugly' but perfectly edible produce in order to reduce food waste at the farm and retail level. The selling point is waste reduction, not a higher price.", "source": "Term 2 · Food Trends: Quiz 3 Veggies and Fruit too ugly for the supermarkets", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-011", "topic": "Food trends · Celebrity chefs", "difficulty": "medium", "type": "mcq", "stem": "How do celebrity chefs most directly influence food trends?", "options": ["By writing the national dietary guidelines used in all schools", "By inspecting restaurants for food safety compliance", "By popularising ingredients and dishes through media exposure", "By setting the official price of restaurant meals"], "answer": 2, "explanation_en": "Celebrity chefs popularise particular ingredients or cooking methods through TV shows, social media and recipes, and trends follow. They do not set prices, write dietary guidelines or carry out health inspections.", "source": "Term 2 · Food Trends: Quiz 2 Celebrity Chef", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-012", "topic": "Special dietary needs · Coeliac disease", "difficulty": "easy", "type": "mcq", "stem": "A person with coeliac disease must avoid:", "options": ["All nuts, seeds and peanut products", "All dairy products, such as milk", "All foods containing added sugar", "Gluten, found in wheat, barley and rye"], "answer": 3, "explanation_en": "Coeliac disease is an autoimmune reaction to gluten and requires a strict gluten-free diet for life. It is an immune response, not simply an ordinary allergy to flour.", "source": "Term 3 · Food for Specific Needs: Quiz 6 Coeliac Disease", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-013", "topic": "Special dietary needs · Glycaemic index", "difficulty": "medium", "type": "mcq", "stem": "A food with a low glycaemic index (GI) is best described as one that:", "options": ["Is digested slowly and raises blood glucose gradually", "Contains no carbohydrate or sugar at all", "Must be avoided by everyone with diabetes at all times", "Raises blood glucose quickly and sharply"], "answer": 0, "explanation_en": "Low GI foods are digested and absorbed slowly, causing a gradual increase in blood sugar levels and a longer feeling of fullness, whereas high GI foods cause a rapid spike in blood sugar.", "source": "Term 3 · Food for Specific Needs: Quiz 5 The Glycaemic Index", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-014", "topic": "Special dietary needs · Allergy vs intolerance", "difficulty": "medium", "type": "mcq", "stem": "Which statement correctly distinguishes a food allergy from a food intolerance?", "options": ["An allergy can be removed by cooking the food thoroughly", "An allergy involves the immune system, while an intolerance does not", "An intolerance is always more dangerous than an allergy", "They are two names for exactly the same reaction"], "answer": 1, "explanation_en": "Food allergies are mediated by the immune system and can trigger severe reactions like breathing difficulties, whereas intolerances are often due to enzyme deficiencies and typically cause gastrointestinal discomfort.", "source": "Term 3 · Food for Specific Needs: Quiz 8 Allergies and Intolerances", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-015", "topic": "Special dietary needs · Osteoporosis", "difficulty": "easy", "type": "mcq", "stem": "Which two nutrients are most important for reducing the risk of osteoporosis?", "options": ["Protein and vitamin B12", "Iron and vitamin C", "Calcium and vitamin D", "Sodium and potassium"], "answer": 2, "explanation_en": "Calcium is the main mineral in bone, and vitamin D helps the body absorb it. A lack of either raises the risk of osteoporosis, and calcium taken without vitamin D is absorbed less efficiently.", "source": "Term 3 · Food for Specific Needs: Quiz 11 Osteoporosis", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-016", "topic": "Special dietary needs · Iron-deficiency anaemia", "difficulty": "medium", "type": "mcq", "stem": "Iron-deficiency anaemia is best managed by including more of which foods in the diet?", "options": ["Refined white flour products such as white bread", "Foods high in calcium, such as milk and cheese", "Foods high in vitamin C only, such as citrus fruit and juice", "Iron-rich foods such as red meat, legumes and leafy greens"], "answer": 3, "explanation_en": "The dietary focus for iron-deficiency anaemia is on increasing iron intake, with red meat, legumes and dark leafy greens being common sources. Vitamin C improves iron absorption, but it is not a source of iron itself.", "source": "Term 3 · Food for Specific Needs: Quiz 8A Anaemia", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-017", "topic": "Special occasions · Lunar New Year", "difficulty": "easy", "type": "mcq", "stem": "In Chinese New Year celebrations, long noodles are served because they symbolise:", "options": ["Longevity and a long life", "The end of the harvest season", "Good luck in school examinations", "Wealth in the form of gold coins"], "answer": 0, "explanation_en": "Longevity noodles symbolise long life and are typically served uncut and unbroken, whereas gold ingot-shaped dumplings are associated with wealth, and the two should not be confused.", "source": "Term 4 · Food for Special Occasions: Quiz 2 Chinese New Year", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-018", "topic": "Special occasions · Day of the Dead", "difficulty": "medium", "type": "mcq", "stem": "Día de los Muertos (Day of the Dead) is a celebration in which families:", "options": ["Fast for three days to mourn deceased relatives at home", "Build ofrendas with food to honour deceased relatives", "Give children cakes with a hidden coin inside", "Throw a decorated birthday cake into the sea"], "answer": 1, "explanation_en": "The Day of the Dead is a Mexican celebration in early November where families build an ofrenda altar with the deceased's favourite foods and items, and its tone is one of remembrance and reunion rather than mourning or abstinence.", "source": "Term 4 · Food for Special Occasions: Quiz 3 Día de los muertos", "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-019", "topic": "Kitchen operations · Poor workflow", "difficulty": "hard", "type": "short", "stem": "Discuss how poor workflow can impact a chef working in a commercial kitchen. In your answer, identify one cause of poor workflow and one way it could be improved.", "options": [], "answer": "Poor workflow is when a chef is unorganised in the commercial kitchen. It reduces the restaurant's efficiency in preparing food on time and lowers the quality of the food; it is caused by not completing mise en place or not following the recipe in a logical order, and it can be improved by preparing ingredients in advance and communicating clearly with the team.", "explanation_en": "A structured short answer should follow the 'what it is → how it affects → what causes it → how to improve it → example' pattern: define the concept, discuss its impact, causes and improvements, and give an industry example.", "source": "Structured Responses (Sample Answers).pdf — Poor Workflow", "marks": 4, "criteria": [{"id": "c1", "t": "Defines poor workflow as a chef being unorganised in the commercial kitchen", "m": 1}, {"id": "c2", "t": "Explains the impact: it reduces the restaurant's efficiency in preparing food on time and lowers the quality of the food", "m": 1}, {"id": "c3", "t": "Identifies one cause, such as not completing mise en place or not following the recipe in a logical order", "m": 1}, {"id": "c4", "t": "Identifies one improvement, such as preparing ingredients in advance or communicating clearly with the team", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines poor workflow as a chef being unorganised in the commercial kitchen", "m": 1}, {"id": "c2", "t": "Explains the impact: it reduces the restaurant's efficiency in preparing food on time and lowers the quality of the food", "m": 1}, {"id": "c3", "t": "Identifies one cause, such as not completing mise en place or not following the recipe in a logical order", "m": 1}, {"id": "c4", "t": "Identifies one improvement, such as preparing ingredients in advance or communicating clearly with the team", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-020", "topic": "Food equity · Inequity in developed countries", "difficulty": "hard", "type": "short", "stem": "Food inequity also exists in developed countries such as Australia. Identify two groups affected and explain one factor that makes it hard for them to access nutritious food.", "options": [], "answer": "Groups affected include people on low incomes or unemployed, rural and isolated people, the elderly, Aboriginal and Torres Strait Islander people, people with disabilities and homeless people. One key factor is the cost of fresh food combined with limited transport, which makes affordable nutritious food physically and financially hard to reach.", "explanation_en": "Answers need 'two groups + one reason'. Common reasons include price, the distance to shops, housing conditions and health restrictions.", "source": "Term 1 · Food Inequity Assignment (Introduction and Part 1)", "marks": 3, "criteria": [{"id": "c1", "t": "Identifies one group affected in Australia, such as people on low incomes, rural and isolated people, the elderly or homeless people", "m": 1}, {"id": "c2", "t": "Identifies a second, different group affected, such as Aboriginal and Torres Strait Islander people or people with disabilities", "m": 1}, {"id": "c3", "t": "Explains one factor, such as the cost of fresh food combined with limited transport making nutritious food physically and financially hard to reach", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies one group affected in Australia, such as people on low incomes, rural and isolated people, the elderly or homeless people", "m": 1}, {"id": "c2", "t": "Identifies a second, different group affected, such as Aboriginal and Torres Strait Islander people or people with disabilities", "m": 1}, {"id": "c3", "t": "Explains one factor, such as the cost of fresh food combined with limited transport making nutritious food physically and financially hard to reach", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-021", "topic": "Food equity · Charities — role and limits", "difficulty": "hard", "type": "short", "stem": "Explain how charities such as OzHarvest or Foodbank reduce food inequity, and outline one limitation of relying on charities to solve food insecurity.", "options": [], "answer": "Charities collect surplus or donated food and redistribute it, free or at low cost, to people who cannot afford enough nutritious food. A limitation is that supply is unpredictable and depends on donations, so they treat the symptom rather than fixing the underlying causes such as low income and high housing costs.", "explanation_en": "To score points, explain how charities 'provide emergency relief' by collecting and redistributing surplus food, and then discuss how structural problems cannot be solved by donations alone.", "source": "Term 1 · Food Inequity Assignment (Part 1 – charity research) + Part 4 (future strategies)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that charities collect surplus or donated food and redistribute it", "m": 1}, {"id": "c2", "t": "Explains that they provide it free or at low cost to people who cannot afford enough nutritious food", "m": 1}, {"id": "c3", "t": "Outlines a limitation: supply is unpredictable and depends on donations", "m": 1}, {"id": "c4", "t": "Explains that this treats the symptom rather than the underlying causes, such as low income and high housing costs", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that charities collect surplus or donated food and redistribute it", "m": 1}, {"id": "c2", "t": "Explains that they provide it free or at low cost to people who cannot afford enough nutritious food", "m": 1}, {"id": "c3", "t": "Outlines a limitation: supply is unpredictable and depends on donations", "m": 1}, {"id": "c4", "t": "Explains that this treats the symptom rather than the underlying causes, such as low income and high housing costs", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-022", "topic": "Food trends · Social media", "difficulty": "hard", "type": "short", "stem": "Explain how social media drives food trends such as the #foodie movement and snackification, and identify one risk this creates for consumers.", "options": [], "answer": "Social media spreads visually appealing food content quickly, so dishes and products become popular through shares, hashtags and influencer posts, and manufacturers respond with convenient snack-style products. One risk is that consumers may copy unhealthy or unverified food advice and choose foods for appearance rather than nutrition.", "explanation_en": "You need both the 'mechanism of transmission' and the 'risks' — for example misleading nutrition information and problems with portion control. Describing the trend without explaining the mechanism loses marks.", "source": "Term 2 · Food Trends: Quiz 6 #foodie; Quiz 4 Snackification and other Food Trends", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that social media spreads visually appealing food content quickly", "m": 1}, {"id": "c2", "t": "Explains that dishes and products become popular through shares, hashtags and influencer posts, and manufacturers respond with convenient snack-style products", "m": 1}, {"id": "c3", "t": "Identifies one risk: consumers may copy unhealthy or unverified food advice", "m": 1}, {"id": "c4", "t": "Identifies a second risk: consumers may choose foods for appearance rather than nutrition", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that social media spreads visually appealing food content quickly", "m": 1}, {"id": "c2", "t": "Explains that dishes and products become popular through shares, hashtags and influencer posts, and manufacturers respond with convenient snack-style products", "m": 1}, {"id": "c3", "t": "Identifies one risk: consumers may copy unhealthy or unverified food advice", "m": 1}, {"id": "c4", "t": "Identifies a second risk: consumers may choose foods for appearance rather than nutrition", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-023", "topic": "Special dietary needs · Energy needs of athletes", "difficulty": "medium", "type": "short", "stem": "Explain why a professional NRL player has different daily energy and nutrient requirements from a sedentary office worker.", "options": [], "answer": "The NRL player trains and plays at high intensity for long periods, so he burns far more kilojoules and needs more carbohydrate to refuel muscles, plus extra protein for muscle repair and fluid and electrolytes to replace sweat losses. A sedentary office worker uses much less energy, so eating the same amount would lead to excess energy being stored as fat.", "explanation_en": "Answers should focus on 'differences in energy expenditure leading to differences in carbohydrate, protein and water requirements'. Simply saying that athletes eat more is not enough; you also have to explain why the mix of nutrients changes.", "source": "Term 3 · Food for Specific Needs: Quiz 4 Fuel Requirements for NRL Players; Quiz 7 Diet of an Olympic Athlete", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that the NRL player trains and plays at high intensity for long periods, so he burns far more kilojoules", "m": 1}, {"id": "c2", "t": "Explains that he needs more carbohydrate to refuel his muscles", "m": 1}, {"id": "c3", "t": "Explains that he needs extra protein for muscle repair, plus fluid and electrolytes to replace sweat losses", "m": 1}, {"id": "c4", "t": "Explains the contrast: the sedentary office worker uses much less energy, so eating the same amount would lead to excess energy being stored as fat", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the NRL player trains and plays at high intensity for long periods, so he burns far more kilojoules", "m": 1}, {"id": "c2", "t": "Explains that he needs more carbohydrate to refuel his muscles", "m": 1}, {"id": "c3", "t": "Explains that he needs extra protein for muscle repair, plus fluid and electrolytes to replace sweat losses", "m": 1}, {"id": "c4", "t": "Explains the contrast: the sedentary office worker uses much less energy, so eating the same amount would lead to excess energy being stored as fat", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-024", "topic": "Special occasions · Why we celebrate with food", "difficulty": "medium", "type": "short", "stem": "Give two reasons why families and communities celebrate with particular foods, and support each reason with one example.", "options": [], "answer": "Food is used to mark significant events and bring people together, for example a birthday cake at a birthday party or a shared feast at Christmas. Particular foods also carry cultural or religious meaning and are used to pass on traditions, for example long noodles symbolising longevity at Chinese New Year.", "explanation_en": "Give two distinct reasons — one about 'social gatherings' and one about 'cultural or religious symbols' — and support each with an example. Listing examples without explaining the reasons loses marks.", "source": "Term 4 · Food for Special Occasions: Quiz 6 Reasons for Celebrating with Food", "marks": 4, "criteria": [{"id": "c1", "t": "Gives one reason: food marks significant events and brings people together", "m": 1}, {"id": "c2", "t": "Supports it with one relevant example, such as a birthday cake at a birthday party or a shared feast at Christmas", "m": 1}, {"id": "c3", "t": "Gives a second, different reason: particular foods carry cultural or religious meaning and are used to pass on traditions", "m": 1}, {"id": "c4", "t": "Supports it with one relevant example, such as long noodles symbolising longevity at Chinese New Year", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Gives one reason: food marks significant events and brings people together", "m": 1}, {"id": "c2", "t": "Supports it with one relevant example, such as a birthday cake at a birthday party or a shared feast at Christmas", "m": 1}, {"id": "c3", "t": "Gives a second, different reason: particular foods carry cultural or religious meaning and are used to pass on traditions", "m": 1}, {"id": "c4", "t": "Supports it with one relevant example, such as long noodles symbolising longevity at Chinese New Year", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "ftn-025", "topic": "Food safety · Personal hygiene", "difficulty": "hard", "type": "short", "stem": "Explain why personal hygiene is the responsibility of every food handler. Give two examples of poor personal hygiene that could contaminate food.", "options": [], "answer": "Every food handler can pass bacteria or viruses from their body to food, and food poisoning outbreaks are often traced back to one person's hygiene practices, so each worker is legally and ethically responsible. Examples include not washing hands after using the toilet or handling raw meat, and coughing or sneezing over food or working while sick with gastro.", "explanation_en": "The key points are that one person's behaviour can contaminate an entire batch of food, and that you can name specific unsafe practices such as not washing hands, working while sick or coughing over food. This material is covered in Food Handler Basics, Module 2.", "source": "Term 1 · Food Handler Basics Training (Module 2: Personal hygiene)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that every food handler can pass bacteria or viruses from their body to food", "m": 1}, {"id": "c2", "t": "Explains that outbreaks are often traced back to one person's hygiene practices, so each worker is legally and ethically responsible", "m": 1}, {"id": "c3", "t": "Gives one example of poor hygiene, such as not washing hands after using the toilet or handling raw meat", "m": 1}, {"id": "c4", "t": "Gives a second example, such as coughing or sneezing over food or working while sick with gastro", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that every food handler can pass bacteria or viruses from their body to food", "m": 1}, {"id": "c2", "t": "Explains that outbreaks are often traced back to one person's hygiene practices, so each worker is legally and ethically responsible", "m": 1}, {"id": "c3", "t": "Gives one example of poor hygiene, such as not washing hands after using the toilet or handling raw meat", "m": 1}, {"id": "c4", "t": "Gives a second example, such as coughing or sneezing over food or working while sick with gastro", "m": 1}], "weak": false, "subj": "ftn", "subjZh": "Year 10 Food Technology"}, {"id": "car-001", "topic": "Australian pathways · ATAR eligibility", "difficulty": "easy", "type": "mcq", "stem": "To be eligible for an ATAR in NSW, a Year 12 student must complete at least how many units of ATAR courses?", "options": ["10 units", "12 units", "8 units", "6 units"], "answer": 0, "explanation_en": "To be eligible for an ATAR, you need to complete at least 10 units of ATAR courses, including 8 units from Category A and 2 units of English; missing one unit will make you ineligible for an ATAR.", "source": "top-tips-for-choosing-hsc-courses.pdf(ATAR eligibility)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-002", "topic": "Australian pathways · ATAR eligibility", "difficulty": "easy", "type": "mcq", "stem": "Which of these is a compulsory part of ATAR eligibility?", "options": ["At least 6 different subjects", "At least 2 units of English", "At least 1 unit of a Category B course", "At least 4 units of Mathematics"], "answer": 1, "explanation_en": "English is a compulsory subject with a minimum of 2 units, while maths is not mandatory and Category B courses can only count for a maximum of 2 units.", "source": "top-tips-for-choosing-hsc-courses.pdf(ATAR eligibility)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-003", "topic": "Australian pathways · SBAT", "difficulty": "medium", "type": "mcq", "stem": "In this course's careers resource list, 'SBAT in NSW' refers to:", "options": ["A university early entry scheme for Year 10 students", "An online platform for sitting the HSC exams", "School Based Apprenticeships and Traineeships", "A scholarship program for elite athletes only"], "answer": 2, "explanation_en": "SBAT stands for School Based Apprenticeships and Traineeships: an in-school pathway in which students finish their secondary education while completing paid industry training. It is not a scholarship, an online exam platform or an early entry scheme.", "source": "Careers Education 2022(CAREER RESOURCES: SBAT in NSW)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-004", "topic": "Australian pathways · Category B limit", "difficulty": "hard", "type": "mcq", "stem": "Under the ATAR eligibility rules, what is the maximum number of Category B units a student may include?", "options": ["4 units", "6 units", "None", "2 units"], "answer": 3, "explanation_en": "Category B courses can only count for a maximum of 2 units, and the remaining units must come from Category A, which is often overlooked.", "source": "top-tips-for-choosing-hsc-courses.pdf(ATAR eligibility)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-005", "topic": "Australian pathways · Qualification levels", "difficulty": "easy", "type": "mcq", "stem": "How long does an undergraduate bachelor degree usually take in Australia?", "options": ["3 to 5 years of full-time study", "1 to 2 years of full-time study", "10 years of full-time study", "6 to 8 years of full-time study"], "answer": 0, "explanation_en": "Undergraduate degrees usually take 3–5 years of full-time study and let you choose a major. Postgraduate certificates, masters degrees and PhDs are the levels that come after, and each takes additional time.", "source": "Week 5 - Levels of education(University Entry)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-006", "topic": "Australian pathways · VET", "difficulty": "easy", "type": "mcq", "stem": "Which of these is a vocational education and training (VET) qualification?", "options": ["Master of Teaching (Secondary)", "Certificate III in Electrotechnology", "Bachelor of Science (Physics major)", "Doctorate of Philosophy (PhD)"], "answer": 1, "explanation_en": "Certificate III is a VET qualification usually offered by TAFE or government-recognised private colleges, whereas Bachelor, Master, and PhD are university-level qualifications.", "source": "Week 5 - Levels of education(VET / TAFE)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-007", "topic": "Job seeking · Resumes", "difficulty": "easy", "type": "mcq", "stem": "What is the main advice given about writing a resume?", "options": ["Leave out sporting and academic awards completely", "Use exactly the same resume for your whole working life", "Be brief and clear so it is quick to read", "Include long, detailed paragraphs about every job you have had"], "answer": 2, "explanation_en": "The course stresses that a resume should be concise and clear so that it can be read quickly, and that a resume is not static — you update it as you gain experience. Long, detailed paragraphs about every job you have had are better left for the interview.", "source": "Building a resume(What is important on a resume?)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-008", "topic": "Job seeking · Cover letter length", "difficulty": "medium", "type": "mcq", "stem": "According to the cover letter resource, an appropriate length for a cover letter is about:", "options": ["Same as the resume", "800 to 1000 words", "50 to 100 words", "250 to 400 words"], "answer": 3, "explanation_en": "The course sets a limit of 250–400 words, and the letter should focus on 'why you're applying, what you can offer, and how you'll follow up'; writing a long essay is exactly what the course warns against.", "source": "Writing a cover letter(The Cover Letter)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-009", "topic": "Job seeking · Types of cover letter", "difficulty": "medium", "type": "mcq", "stem": "A 'prospecting letter' is a cover letter that:", "options": ["Asks about jobs that have not been advertised", "Thanks an employer after an interview", "Is sent to a referee instead of an employer", "Responds to a position that has been advertised"], "answer": 0, "explanation_en": "A prospecting letter is a 'cold call' that asks about vacancies which have not been advertised. It needs thorough research to grab the reader's attention, which is what separates it from an application letter responding to a job advertisement.", "source": "Writing a cover letter(Prospecting letter)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-010", "topic": "Career planning · Action plan", "difficulty": "easy", "type": "mcq", "stem": "The career action plan has four sections. Which set lists them correctly?", "options": ["My Subjects, My Marks, My School, My Teacher", "My Profile, My Goals and Plans, My Progress, My Review", "My Resume, My Interview, My Salary, My Holidays", "My Budget, My Tax, My Super, My Bank"], "answer": 1, "explanation_en": "The action plan has four parts — my profile, my goals and plans, my progress and my review — and it helps you see where you are now and which experiences you still lack.", "source": "Career action plan(There are 4 sections to the action plan)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-011", "topic": "Job seeking · Interviews and researching employers", "difficulty": "easy", "type": "mcq", "stem": "Before you apply or interview for a job, what does the course advise you to do about the company?", "options": ["Avoid researching it so your answers sound spontaneous", "Bring no documents so you appear confident", "Research its values so you can align your skills", "Memorise one answer and use it for every question"], "answer": 2, "explanation_en": "The course advises researching the company: understand its motto and values, then match your skills to them so that the application is targeted. Not doing that research is a common mistake.", "source": "Week Ten- Submitting Your Resume & Cover Letter(NOTE: do your research on the company)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-012", "topic": "Aptitude · Multiple intelligences", "difficulty": "medium", "type": "mcq", "stem": "The theory of multiple intelligences suggests that:", "options": ["Only mathematical ability matters for choosing a career", "Intelligence is a single number fixed at birth", "One standard test can measure all of a person's ability", "People are smart in several different ways"], "answer": 3, "explanation_en": "The theory of multiple intelligences holds that people are intelligent in several different ways, which widens the range of careers worth considering, and it argues against judging ability from a single test score.", "source": "Week Two- Multiple Intelligences: Different Ways to be Smart", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-013", "topic": "Australian pathways · USI", "difficulty": "easy", "type": "mcq", "stem": "What is a Unique Student Identifier (USI)?", "options": ["A national number linking your training records", "The password for the school wireless network", "The number used to calculate a student's ATAR score", "The bank account used to pay school fees"], "answer": 0, "explanation_en": "USI is a national student identifier that links your training and qualifications, distinct from ATAR and TFN.", "source": "Week Eight- Creating a USI, TFN & MyGov account", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-014", "topic": "Australian pathways · Tax File Number", "difficulty": "medium", "type": "mcq", "stem": "Why does a student need a Tax File Number (TFN) when starting a job?", "options": ["It replaces a passport when travelling overseas", "The employer uses it so your pay and tax are recorded correctly", "It is the same number as your USI and MyGov password", "It sets the hourly pay rate your employer must pay you"], "answer": 1, "explanation_en": "A TFN is a tax file number, and employers need it to deduct tax at the correct rate; without one you are taxed at the highest rate. Your hourly pay rate, by contrast, is set by an award or a contract, not by your TFN.", "source": "Week Eight- Creating a USI, TFN & MyGov account", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-015", "topic": "Workplace finances · Superannuation", "difficulty": "medium", "type": "mcq", "stem": "In Australia, superannuation is best described as:", "options": ["A tax added to every purchase you make", "A bank fee for keeping a savings account", "Money your employer pays into your retirement fund", "A bonus paid to students who finish their Year 12 studies"], "answer": 2, "explanation_en": "Superannuation is an extra amount that your employer pays into your retirement account. It is a long-term investment for your retirement, it is separate from your take-home pay, and it is not a tax on purchases.", "source": "Week Five- Tax & Super", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-016", "topic": "Workplace rights · Industrial relations", "difficulty": "medium", "type": "mcq", "stem": "Under Australian workplace law, all workers are entitled to:", "options": ["Ignore workplace safety rules because they are casual employees", "Be paid only when the employer decides the work was good enough", "Work any hours required without breaks or overtime pay", "Know your rights and responsibilities at work"], "answer": 3, "explanation_en": "The core of the course is 'knowing your rights and responsibilities', which includes minimum wage, a safe workplace and rest breaks. Casual workers are not exempt from safety obligations, and their pay cannot be deducted arbitrarily.", "source": "Week Three- Industrial Relations & Workplaces(Fair Work workplace basics)", "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-017", "topic": "Australian pathways · Subject choice and scaling myths", "difficulty": "hard", "type": "short", "stem": "Explain why choosing subjects that are believed to be 'harder' or always 'scaled up' does not guarantee a higher ATAR.", "options": [], "answer": "A course's scaling depends on the average academic performance of all the students taking that course in that year, so it can change from year to year. For most courses your scaled mark is lower than your HSC mark, so the reliable strategy is to choose courses you are good at and interested in and do your best in them, rather than chasing rumours about scaling.", "explanation_en": "The key point is that 'scaling is determined by the overall performance of all students in that subject that year', not by how hard the course is said to be. Choose subjects you are good at and that you need, and make sure you explain the mechanism in your answer.", "source": "top-tips-for-choosing-hsc-courses.pdf (scaling myths table)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that a course's scaling depends on the average academic performance of all the students taking that course in that year", "m": 1}, {"id": "c2", "t": "Explains the consequence: scaling can change from year to year and for most courses the scaled mark is lower than the HSC mark", "m": 1}, {"id": "c3", "t": "States the reliable strategy: choose courses you are good at and interested in and do your best in them rather than chasing scaling rumours", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that a course's scaling depends on the average academic performance of all the students taking that course in that year", "m": 1}, {"id": "c2", "t": "Explains the consequence: scaling can change from year to year and for most courses the scaled mark is lower than the HSC mark", "m": 1}, {"id": "c3", "t": "States the reliable strategy: choose courses you are good at and interested in and do your best in them rather than chasing scaling rumours", "m": 1}], "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-018", "topic": "Job seeking · Tailoring and following up a cover letter", "difficulty": "hard", "type": "short", "stem": "Describe how you would tailor a cover letter to a position that has been advertised, and explain one follow-up step you should take after sending it.", "options": [], "answer": "I would state where I saw the advertisement and the exact position title, then respond directly to the qualifications listed by giving evidence from my own experience, showing how my skills are transferable to that role. After sending it I should follow up within the time frame indicated, preferably with a phone call or, if calls are blocked, an email, and make sure all my contact details and a normal email address are included.", "explanation_en": "Both questions must be answered: 'address each requirement in the job ad with evidence' and 'follow up within the specified timeframe', as simply stating 'I want to apply' will not score points.", "source": "Writing a cover letter(What You Have To Offer / How You Will Follow Up)", "marks": 4, "criteria": [{"id": "c1", "t": "States where the advertisement was seen and the exact position title", "m": 1}, {"id": "c2", "t": "Responds directly to the qualifications listed in the advertisement", "m": 1}, {"id": "c3", "t": "Gives evidence from their own experience showing how their skills are transferable to that role", "m": 1}, {"id": "c4", "t": "Follows up within the time frame indicated, by phone call or email, with correct contact details included", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States where the advertisement was seen and the exact position title", "m": 1}, {"id": "c2", "t": "Responds directly to the qualifications listed in the advertisement", "m": 1}, {"id": "c3", "t": "Gives evidence from their own experience showing how their skills are transferable to that role", "m": 1}, {"id": "c4", "t": "Follows up within the time frame indicated, by phone call or email, with correct contact details included", "m": 1}], "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-019", "topic": "Study skills · Revision timetable", "difficulty": "medium", "type": "short", "stem": "Describe how you would build a realistic study timetable for the end-of-year exams, and name two study strategies that improve memory retention.", "options": [], "answer": "I would list every exam date and subject first, then work backwards to allocate study blocks, putting the subjects with the earliest or hardest exams first and leaving gaps for rest and other commitments. Two strategies that improve retention are spaced practice (revisiting each topic several times over the weeks rather than cramming once) and active recall (testing yourself or writing study notes from memory instead of only re-reading).", "explanation_en": "A timetable should be 'backwards planned from the exam dates with buffers', not spread evenly across the term, and the memory strategies should be 'spaced practice + active recall'. Simply 'reading more' is not a strategy.", "source": "Week One - Term 4 Goals & Creating a Yearly Exam Study Timetable; Week Two - Study Skills & Memory Retention (memory strategies are syllabus content)", "marks": 4, "criteria": [{"id": "c1", "t": "Lists every exam date and subject first", "m": 1}, {"id": "c2", "t": "Works backwards to allocate study blocks, putting the earliest or hardest exams first and leaving gaps for rest and other commitments", "m": 1}, {"id": "c3", "t": "Names spaced practice and explains it as revisiting each topic several times over the weeks rather than cramming once", "m": 1}, {"id": "c4", "t": "Names active recall and explains it as testing yourself or writing notes from memory instead of only re-reading", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Lists every exam date and subject first", "m": 1}, {"id": "c2", "t": "Works backwards to allocate study blocks, putting the earliest or hardest exams first and leaving gaps for rest and other commitments", "m": 1}, {"id": "c3", "t": "Names spaced practice and explains it as revisiting each topic several times over the weeks rather than cramming once", "m": 1}, {"id": "c4", "t": "Names active recall and explains it as testing yourself or writing notes from memory instead of only re-reading", "m": 1}], "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "car-020", "topic": "Workplace experience · Debrief", "difficulty": "hard", "type": "short", "stem": "Outline two benefits of completing Year 10 work experience, and explain how reflecting on it afterwards could change your career plan.", "options": [], "answer": "Work experience lets you see what the tasks, responsibilities and conditions of a job are really like, and it builds contacts and evidence of employability that you can use in future applications. Reflecting on it may show that the industry suits your strengths, or that the daily work does not match your expectations, which could lead you to change your subject choices or consider a different pathway.", "explanation_en": "Marks come from 'genuinely understanding the work content + building networks and experience', and then from 'reflecting on whether the direction was confirmed or corrected'. Saying only that 'it was interesting', without any reflection, will not score well.", "source": "Week Nine- Work Experience; Week Ten- Reflecting on Work Experience(reflection survey)", "marks": 4, "criteria": [{"id": "c1", "t": "Outlines one benefit: work experience shows what the tasks, responsibilities and conditions of a job are really like", "m": 1}, {"id": "c2", "t": "Outlines a second benefit: it builds contacts and evidence of employability for future applications", "m": 1}, {"id": "c3", "t": "Explains that reflecting may confirm that the industry suits the student's strengths", "m": 1}, {"id": "c4", "t": "Explains that reflecting may show the daily work does not match expectations, so the student changes subject choices or considers a different pathway", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Outlines one benefit: work experience shows what the tasks, responsibilities and conditions of a job are really like", "m": 1}, {"id": "c2", "t": "Outlines a second benefit: it builds contacts and evidence of employability for future applications", "m": 1}, {"id": "c3", "t": "Explains that reflecting may confirm that the industry suits the student's strengths", "m": 1}, {"id": "c4", "t": "Explains that reflecting may show the daily work does not match expectations, so the student changes subject choices or considers a different pathway", "m": 1}], "weak": false, "subj": "car", "subjZh": "Year 10 Careers"}, {"id": "sport-001", "topic": "Sport safety · Warm-up", "difficulty": "easy", "type": "mcq", "stem": "What is the main purpose of a warm-up before a training session or trial?", "options": ["To raise heart rate and muscle temperature and lower injury risk", "To replace the need for a cool-down at the end of the session", "To build muscle size quickly before the session starts", "To use up energy so you do not get tired later in the session"], "answer": 0, "explanation_en": "The point of a warm-up is to raise heart rate, muscle temperature and joint mobility gradually, so that the body is ready for exercise and the risk of a muscle strain is lower. It does not replace a cool-down, and it is not a way of 'using up energy'.", "source": "Bally Volleyball(7:30am warm up before the 8:00am trial)", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-002", "topic": "Ball sport rules · Volleyball team size", "difficulty": "easy", "type": "mcq", "stem": "In indoor volleyball, how many players from each team are on the court at one time?", "options": ["2", "6", "5", "11"], "answer": 1, "explanation_en": "Indoor volleyball has 6 players per team on the court, and players rotate when it is their turn to serve. Beach volleyball has 2, while 11 is the number for football, cricket and similar sports — do not mix the codes up.", "source": "Bally Volleyball (indoor volleyball team) + syllabus knowledge", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesday Sport & Representative Sport"}, {"id": "sport-003", "topic": "Ball sport rules · Beach volleyball", "difficulty": "easy", "type": "mcq", "stem": "How many players are on each team in beach volleyball?", "options": ["1", "4", "2", "6"], "answer": 2, "explanation_en": "Beach volleyball has 2 players on each team. The court is smaller and there is no rotation or substitution, unlike indoor volleyball, which has 6 players per team.", "source": "Bally Volleyball (2021 indoor and beach teams) + syllabus knowledge", "weak": false, "subj": "sport", "subjZh": "Sport — Wednesda
