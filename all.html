old me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey.", "explanation_en": "(a) The storm has three functions: externalising anger, showing nature's indifference, and stripping away the facade of power. (b) Note the concessional structure 'more ... than' — he admits fault but portrays himself as a victim, so it's 'partly self-aware', not 'completely repentant'.", "source": "King Lear Act 3 Scene 2 (quote: Shakespeare, King Lear 3.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 6, "criteria": [{"id": "c1", "t": "Explains that the storm externalises Lear's inner rage and gives his fury a cosmic scale", "m": 1}, {"id": "c2", "t": "Explains that the storm is also indifferent nature (wind and rain do not answer him), which cuts human authority down to size", "m": 1}, {"id": "c3", "t": "Explains that stripping him of shelter and followers forces him to confront exposed humanity and prepares the 'poor naked wretches' speech", "m": 1}, {"id": "c4", "t": "Explains that Lear sees himself chiefly as a victim, with 'sinn'd against' placed first and carrying the weight", "m": 1}, {"id": "c5", "t": "Explains that he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial rather than a full confession", "m": 1}, {"id": "c6", "t": "Explains that fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the storm externalises Lear's inner rage and gives his fury a cosmic scale", "m": 1}, {"id": "c2", "t": "Explains that the storm is also indifferent nature (wind and rain do not answer him), which cuts human authority down to size", "m": 1}, {"id": "c3", "t": "Explains that stripping him of shelter and followers forces him to confront exposed humanity and prepares the 'poor naked wretches' speech", "m": 1}, {"id": "c4", "t": "Explains that Lear sees himself chiefly as a victim, with 'sinn'd against' placed first and carrying the weight", "m": 1}, {"id": "c5", "t": "Explains that he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial rather than a full confession", "m": 1}, {"id": "c6", "t": "Explains that fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-014", "topic": "King Lear · 'Poor naked wretches' (turning point)", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Poor naked wretches, wheresoe'er you are,\nThat bide the pelting of this pitiless storm ...\nO, I have ta'en\nToo little care of this!\n\nExplain why this speech is a turning point in Lear's moral understanding. (4 marks)", "options": [], "answer": "1 mark — for the first time he thinks about other people's suffering instead of listing his own injuries.\n1 mark — he admits neglect as a ruler: 'too little care of this' is a confession of political and moral failure.\n1 mark — the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too.\n1 mark — the insight only arrives after he loses power and shelter, so suffering becomes his teacher; the lesson costs him everything.", "explanation_en": "4 marks: ① thinking of others' suffering ② acknowledging the ruler's responsibility ③ specific imagery making poverty tangible ④ this awareness is gained through 'losing power'. Don't stop at ① or you'll only get 1 mark.", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that for the first time he thinks about other people's suffering instead of listing his own injuries", "m": 1}, {"id": "c2", "t": "Explains that he admits neglect as a ruler, so 'too little care of this' is a confession of political and moral failure", "m": 1}, {"id": "c3", "t": "Explains that the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too", "m": 1}, {"id": "c4", "t": "Explains that the insight only arrives after he loses power and shelter, so suffering becomes his teacher at the cost of everything", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that for the first time he thinks about other people's suffering instead of listing his own injuries", "m": 1}, {"id": "c2", "t": "Explains that he admits neglect as a ruler, so 'too little care of this' is a confession of political and moral failure", "m": 1}, {"id": "c3", "t": "Explains that the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too", "m": 1}, {"id": "c4", "t": "Explains that the insight only arrives after he loses power and shelter, so suffering becomes his teacher at the cost of everything", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-015", "topic": "King Lear · 'Lendings' and stripping of identity", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Is man no more than this? Consider him well. ...\nOff, off, you lendings! come unbutton here.\n\nWhat does Lear's stripping off his clothes represent? (3 marks)", "options": [], "answer": "1 mark — 'lendings' treats clothes as borrowed status rather than as part of the self.\n1 mark — stripping tests what a human being is when rank, retinue and clothing are removed.\n1 mark — it dramatises the play's theme of identity: a king discovers he is only 'a poor, bare, forked animal', which is both a loss and a form of truth.", "explanation_en": "3 marks: clothes = borrowed identity, undressing = reducing someone to a 'bare, forked animal', and this action is both loss and awareness. It's better if you can point out the paradox of 'poor, bare, forked animal' (no need to quote verbatim).", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that 'lendings' treats clothes as borrowed status rather than as part of the self", "m": 1}, {"id": "c2", "t": "Explains that stripping tests what a human being is once rank, retinue and clothing are removed", "m": 1}, {"id": "c3", "t": "Explains that the action dramatises the play's theme of identity, since the king discovers he is only 'a poor, bare, forked animal' — both a loss and a form of truth", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that 'lendings' treats clothes as borrowed status rather than as part of the self", "m": 1}, {"id": "c2", "t": "Explains that stripping tests what a human being is once rank, retinue and clothing are removed", "m": 1}, {"id": "c3", "t": "Explains that the action dramatises the play's theme of identity, since the king discovers he is only 'a poor, bare, forked animal' — both a loss and a form of truth", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-016", "topic": "King Lear · Gloucester's blinding (3.7)", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 7:\n\nCORNWALL: Out, vile jelly!\nWhere is thy lustre now?\n\n(Gloucester has just been bound to a chair and blinded.)\n\nHow does Shakespeare make Gloucester's blinding more than physical violence? (4 marks)", "options": [], "answer": "1 mark — the language ('vile jelly', 'lustre') turns eyes into objects, so the horror is deliberately grotesque rather than heroic.\n1 mark — it literalises the blindness motif: Gloucester is punished in his eyes for the moral blindness that let Edmund deceive him.\n1 mark — the staging is an abuse of power (a bound guest, a host's authority turned to torture), echoing Lear's abuse of Cordelia and Kent.\n1 mark — the audience is forced to watch what the characters refused to see, so the scene makes sight a moral act for the viewer as well.", "explanation_en": "This question requires explaining 'literal blindness = metaphorical blindness fulfilled': Gloucester loses his eyes due to not seeing Edmund clearly, and the atrocity is a misuse of power, parallel to Lear's banishment of his daughter. If you say 'the audience is forced to see', you can get the 4th mark.", "source": "King Lear Act 3 Scene 7 (quote: Shakespeare, King Lear 3.7); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that the language ('vile jelly', 'lustre') turns eyes into objects, making the horror grotesque rather than heroic", "m": 1}, {"id": "c2", "t": "Explains that the blinding literalises the blindness motif, punishing in his eyes the moral blindness that let Edmund deceive him", "m": 1}, {"id": "c3", "t": "Explains that the staging is an abuse of power (a bound guest tortured by a host's authority), echoing Lear's treatment of Cordelia and Kent", "m": 1}, {"id": "c4", "t": "Explains that the audience is forced to watch what the characters refused to see, making sight a moral act for the viewer as well", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the language ('vile jelly', 'lustre') turns eyes into objects, making the horror grotesque rather than heroic", "m": 1}, {"id": "c2", "t": "Explains that the blinding literalises the blindness motif, punishing in his eyes the moral blindness that let Edmund deceive him", "m": 1}, {"id": "c3", "t": "Explains that the staging is an abuse of power (a bound guest tortured by a host's authority), echoing Lear's treatment of Cordelia and Kent", "m": 1}, {"id": "c4", "t": "Explains that the audience is forced to watch what the characters refused to see, making sight a moral act for the viewer as well", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-017", "topic": "King Lear · Irony of 'I stumbled when I saw'", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: I have no way, and therefore want no eyes;\nI stumbled when I saw ...\n\nExplain the irony in Gloucester's lines. (3 marks)", "options": [], "answer": "1 mark — when he had eyes he was morally blind, refusing to see Edmund's treachery and turning against Edgar.\n1 mark — now that he is physically blind he sees his own errors and Edgar's love, so insight arrives after sight is gone.\n1 mark — the paradox 'I stumbled when I saw' states the play's inversion: physical sight and moral vision are opposites, which also describes Lear's journey.", "explanation_en": "3 marks: ① having eyes but not seeing the truth ② seeing clearly after becoming blind ③ highlighting the play's 'sight/insight' paradox. It's best to mention the parallel between Gloucester and Lear to show overall understanding.", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that when he had eyes Gloucester was morally blind, refusing to see Edmund's treachery and turning against Edgar", "m": 1}, {"id": "c2", "t": "Explains that now, physically blind, he sees his own errors and Edgar's love, so insight arrives after sight is gone", "m": 1}, {"id": "c3", "t": "Explains that the paradox 'I stumbled when I saw' states the play's inversion of physical sight and moral vision, which also describes Lear's journey", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that when he had eyes Gloucester was morally blind, refusing to see Edmund's treachery and turning against Edgar", "m": 1}, {"id": "c2", "t": "Explains that now, physically blind, he sees his own errors and Edgar's love, so insight arrives after sight is gone", "m": 1}, {"id": "c3", "t": "Explains that the paradox 'I stumbled when I saw' states the play's inversion of physical sight and moral vision, which also describes Lear's journey", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-018", "topic": "King Lear · Edmund's values and dramatic function", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 2:\n\nEDMUND: Thou, Nature, art my goddess; to thy law\nMy services are bound.\n\n(a) What does Edmund's address to Nature reveal about his values? (2 marks)\n(b) Explain Edmund's dramatic function in the play. (3 marks)", "options": [], "answer": "(a) 1 mark — he rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead.\n1 mark — his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority.\n(b) 1 mark — he is the engine of the plot: the forged letter sets Edgar running and destroys Gloucester's trust.\n1 mark — his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error.\n1 mark — his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern, not an accident.", "explanation_en": "(a) Edmund uses 'nature' as a goddess to legitimise his desires. (b) Three functions: driving the plot (forging letters), revealing others' 'blindness', and reinforcing the theme through parallel plot. If you mention 'engine of evil' and 'mirror structure', you can get full marks.", "source": "King Lear Act 1 Scene 2 (quote: Shakespeare, King Lear 1.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "Explains that Edmund rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead", "m": 1}, {"id": "c2", "t": "Explains that his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority", "m": 1}, {"id": "c3", "t": "Explains that he is the engine of the plot, since the forged letter sets Edgar running and destroys Gloucester's trust", "m": 1}, {"id": "c4", "t": "Explains that his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error", "m": 1}, {"id": "c5", "t": "Explains that his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern rather than an accident", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Edmund rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead", "m": 1}, {"id": "c2", "t": "Explains that his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority", "m": 1}, {"id": "c3", "t": "Explains that he is the engine of the plot, since the forged letter sets Edgar running and destroys Gloucester's trust", "m": 1}, {"id": "c4", "t": "Explains that his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error", "m": 1}, {"id": "c5", "t": "Explains that his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern rather than an accident", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-019", "topic": "King Lear · The forged letter and dramatic irony", "difficulty": "medium", "type": "short", "stem": "Section 1 — scene description (no quotation):\n\nIn Act 1 Scene 2 Edmund shows his father Gloucester a letter that he has forged in Edgar's handwriting. He then warns Edgar that their father is furious with him and advises him to arm himself and flee.\n\nExplain how Shakespeare creates dramatic irony here and why it matters. (3 marks)", "options": [], "answer": "1 mark — the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter.\n1 mark — each character then acts on information the audience knows to be false, so their choices look like self-destruction.\n1 mark — the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence, trust) can be manufactured.", "explanation_en": "The marking points for dramatic irony are: the audience sees Edmund playing two scenes → characters act on false information → this proves 'seeing/trusting' can be fabricated. For the 3rd mark, you need to elevate to the theme level, not just retell the plot.", "source": "Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage (Act 1 Scenes 1–3 questions and practice extracts)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter", "m": 1}, {"id": "c2", "t": "Explains that each character then acts on information the audience knows to be false, so their choices look like self-destruction", "m": 1}, {"id": "c3", "t": "Explains that the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence and trust) can be manufactured", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter", "m": 1}, {"id": "c2", "t": "Explains that each character then acts on information the audience knows to be false, so their choices look like self-destruction", "m": 1}, {"id": "c3", "t": "Explains that the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence and trust) can be manufactured", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-020", "topic": "King Lear · The gods and the human condition", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: As flies to wanton boys, are we to the gods;\nThey kill us for their sport.\n\nWhat view of the gods and of human agency does this image express, and how does it fit the play's tragic vision? (4 marks)", "options": [], "answer": "1 mark — the gods are 'wanton boys': careless, playful and not just, so divine authority is emptied of moral purpose.\n1 mark — humans are flies: small, disposable and without control over their fate.\n1 mark — the image reverses Gloucester's earlier confidence that the gods are just, and it answers Lear's repeated appeals to the heavens.\n1 mark — the play leaves the question open: the innocent die (Cordelia) while the guilty partly escape, so the ending refuses to console the audience with divine justice.", "explanation_en": "4 marks: ① gods are portrayed as unjust ② humans are like flies (powerless) ③ this contrasts with Gloucester's earlier belief that 'the gods are just' and responds to Lear's appeal to the gods ④ the ending (Cordelia's death) leaves the 'moral order' in question, highlighting the tragic nature.", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that the gods are 'wanton boys' — careless, playful and not just — so divine authority is emptied of moral purpose", "m": 1}, {"id": "c2", "t": "Explains that humans are flies: small, disposable and without control over their fate", "m": 1}, {"id": "c3", "t": "Explains that the image reverses Gloucester's earlier confidence that the gods are just, and answers Lear's repeated appeals to the heavens", "m": 1}, {"id": "c4", "t": "Explains that the play leaves the question open, since the innocent Cordelia dies while the guilty partly escape, so the ending refuses the consolation of divine justice", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the gods are 'wanton boys' — careless, playful and not just — so divine authority is emptied of moral purpose", "m": 1}, {"id": "c2", "t": "Explains that humans are flies: small, disposable and without control over their fate", "m": 1}, {"id": "c3", "t": "Explains that the image reverses Gloucester's earlier confidence that the gods are just, and answers Lear's repeated appeals to the heavens", "m": 1}, {"id": "c4", "t": "Explains that the play leaves the question open, since the innocent Cordelia dies while the guilty partly escape, so the ending refuses the consolation of divine justice", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-021", "topic": "King Lear · Cordelia's death and poetic justice", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 5 Scene 3:\n\nLEAR: She's gone for ever!\nI know when one is dead, and when one lives;\nShe's dead as earth. ...\nDo you see this? Look on her, look, her lips,\nLook there, look there!\n\nWhy does Cordelia's death make the ending hard to read as poetic justice? (5 marks)", "options": [], "answer": "1 mark — poetic justice would reward Cordelia's loyalty and punish the guilty in proportion, restoring a moral order.\n1 mark — instead the innocent daughter is hanged on Edmund's order, and the reprieve arrives too late to save her.\n1 mark — Lear's hard-won sight is rewarded only with her corpse: insight and loss arrive at the same moment.\n1 mark — his final 'Look there, look there!' is ambiguous — he may die believing she lives — so the audience is denied a clear consolation.\n1 mark — the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just.", "explanation_en": "5 marks are: defining poetic justice → innocent people are killed and rescue comes too late → awareness and loss happen simultaneously → the final lines are ambiguous and offer no comfort → order is not restored, so the sense of 'injustice' is intentional. When answering, you must first define 'what is poetic justice', or you won't have a standard for comparison.", "source": "King Lear Act 5 Scene 3 (quote: Shakespeare, King Lear 5.3); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "Defines poetic justice as the reward of loyalty and the punishment of the guilty in proportion, restoring a moral order", "m": 1}, {"id": "c2", "t": "Explains that the innocent daughter is hanged on Edmund's order and the reprieve arrives too late to save her", "m": 1}, {"id": "c3", "t": "Explains that Lear's hard-won sight is rewarded only with her corpse, so insight and loss arrive at the same moment", "m": 1}, {"id": "c4", "t": "Explains that his final 'Look there, look there!' is ambiguous (he may die believing she lives), so the audience is denied clear consolation", "m": 1}, {"id": "c5", "t": "Explains that the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines poetic justice as the reward of loyalty and the punishment of the guilty in proportion, restoring a moral order", "m": 1}, {"id": "c2", "t": "Explains that the innocent daughter is hanged on Edmund's order and the reprieve arrives too late to save her", "m": 1}, {"id": "c3", "t": "Explains that Lear's hard-won sight is rewarded only with her corpse, so insight and loss arrive at the same moment", "m": 1}, {"id": "c4", "t": "Explains that his final 'Look there, look there!' is ambiguous (he may die believing she lives), so the audience is denied clear consolation", "m": 1}, {"id": "c5", "t": "Explains that the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-022", "topic": "King Lear · 'I am not ague-proof' and change", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 6:\n\nLEAR: They told me I was every thing; 'tis a lie, I am not ague-proof.\n\nWhat does this line show about Lear's changed identity? (4 marks)", "options": [], "answer": "1 mark — he recalls being told he was 'everything': flattery had built a false, unlimited self.\n1 mark — 'tis a lie' is an explicit act of self-correction, spoken by the king about his own former image.\n1 mark — 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man.\n1 mark — the line therefore shows loss producing a truer identity, not simply destroying one, which is central to the play's ending.", "explanation_en": "4 marks: ① being flattered into 'omnipotence' ② self-denial ③ confirming human vulnerability through physical weakness (ague = malaria) ④ thus 'loss' also brings a more realistic self. The last mark is at the theme level, don't miss it.", "source": "King Lear Act 4 Scene 6 (quote: Shakespeare, King Lear 4.6); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that he recalls being told he was 'every thing', so flattery had built a false, unlimited self", "m": 1}, {"id": "c2", "t": "Explains that describing that image as a lie ('tis a lie) is an explicit act of self-correction, spoken by the king about his own former image", "m": 1}, {"id": "c3", "t": "Explains that 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man", "m": 1}, {"id": "c4", "t": "Explains that the line shows loss producing a truer identity rather than simply destroying one, which is central to the play's ending", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that he recalls being told he was 'every thing', so flattery had built a false, unlimited self", "m": 1}, {"id": "c2", "t": "Explains that describing that image as a lie ('tis a lie) is an explicit act of self-correction, spoken by the king about his own former image", "m": 1}, {"id": "c3", "t": "Explains that 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man", "m": 1}, {"id": "c4", "t": "Explains that the line shows loss producing a truer identity rather than simply destroying one, which is central to the play's ending", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-023", "topic": "Comparative essay · Judging a thesis", "difficulty": "easy", "type": "mcq", "stem": "Section 2 asks: 'How do Lee and Parker expose systemic racism?' Which thesis best answers the question?", "options": ["Lee's novel is more effective than Parker's film because a novel can explain what characters are thinking, while a film can only show what they do.", "Parker relies on music and camera angles to create meaning, while Lee relies on first-person narration and on dialogue between the characters.", "Both Lee and Parker show racism as a system that shields the guilty, but Lee builds a child's slow awareness while Parker forces the viewer to watch.", "Both texts show that racism is a serious problem in America and that it damages the lives of ordinary people in small towns across the country."], "answer": 2, "explanation_en": "A good thesis should: cover two texts, provide a controversial argument (racism is 'an institution that protects the guilty'), and forecast the comparison angle (child's perspective vs forced watching). The other options are just general discussions, evaluating merits, and listing techniques without an argument.", "source": "Section 2 · Comparative essay — thesis and introduction (10ENGA unit overview; LEEDER 10ENGB exam outline)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-024", "topic": "Comparative essay · Function of topic sentences", "difficulty": "easy", "type": "mcq", "stem": "What is the main job of a topic sentence in a comparative body paragraph?", "options": ["To provide a quotation from each text and explain what happens in that scene", "To summarise the plot of both texts so the reader can follow the argument", "To introduce the paragraph by naming the text and the technique it will discuss", "To state a comparative claim about both texts that answers part of the essay question"], "answer": 3, "explanation_en": "A topic sentence = the comparative argument this paragraph aims to prove, which must cover both texts and respond to the question. 'To introduce the paragraph by naming the text and the technique it will discuss' is just a signpost, not an argument. 'To provide a quotation from each text and explain what happens in that scene' is evidence. 'To summarise the plot of both texts so the reader can follow the argument' is just retelling.", "source": "Section 2 · Comparative essay — body paragraph structure (TKAMB BP1/BP2/BP3 scaffolds)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-025", "topic": "Comparative essay · Writing a thesis", "difficulty": "medium", "type": "short", "stem": "Write a thesis statement for the question: 'How do Lee and Parker represent the failure of justice?' (4 marks)", "options": [], "answer": "Model answer: 'Lee and Parker both show justice failing because the community closes ranks around its own, yet Lee traces that failure through a child's gradual recognition while Parker makes the viewer complicit in seeing it.'\n1 mark — names both composers/texts.\n1 mark — makes one arguable claim about the failure of justice.\n1 mark — signals the comparative angle (how the two composers differ in method).\n1 mark — uses the question's key term ('failure of justice') rather than drifting into a general statement about racism.", "explanation_en": "To score well you must cover four points: discuss both texts, present a debatable argument, explore comparative angles, and address the keywords of the question.", "source": "Section 2 · Comparative essay — thesis writing (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "marks": 4, "criteria": [{"id": "c1", "t": "Names both composers/texts (Lee and Parker)", "m": 1}, {"id": "c2", "t": "Makes one arguable claim about the failure of justice", "m": 1}, {"id": "c3", "t": "Signals the comparative angle, showing how the two composers differ in method", "m": 1}, {"id": "c4", "t": "Uses the question's key term 'failure of justice' rather than drifting into a general statement about racism", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names both composers/texts (Lee and Parker)", "m": 1}, {"id": "c2", "t": "Makes one arguable claim about the failure of justice", "m": 1}, {"id": "c3", "t": "Signals the comparative angle, showing how the two composers differ in method", "m": 1}, {"id": "c4", "t": "Uses the question's key term 'failure of justice' rather than drifting into a general statement about racism", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-026", "topic": "Comparative essay · Integrating quotations", "difficulty": "medium", "type": "mcq", "stem": "You want to use one line from the supplied extract in a body paragraph. Which approach integrates it most effectively?", "options": ["Quote only the few words that carry the technique, then analyse how they shape meaning in the whole text.", "Paraphrase the extract without quoting, because quotations take up too much of your word count.", "Quote the line, then say that it shows the theme of justice without explaining how the words create that effect.", "Quote the whole extract so the marker can see you have read it, then explain what it means."], "answer": 0, "explanation_en": "Integration means embedding short quotes into your own sentences, analysing how the language creates meaning, and linking it back to the whole text and question. Copying a whole paragraph is just repetition, paraphrasing alone loses the language evidence, and quoting without analysis earns no analysis marks.", "source": "Section 2 · Comparative essay — integrating the supplied extract (LEEDER 10ENGB exam outline, 20 marks)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-027", "topic": "Comparative essay · Using the supplied extract", "difficulty": "medium", "type": "short", "stem": "Section 2 requires you to integrate the extract you are given. Explain what this means in practice, and what you should avoid. (4 marks)", "options": [], "answer": "1 mark — quote selectively: a few words that carry the technique or idea you need.\n1 mark — analyse the wording itself (connotation, syntax, imagery) and link it explicitly to the question.\n1 mark — connect the extract to the rest of the text, so the extract is a starting point rather than the whole evidence.\n1 mark — avoid long quotation, mentioning the extract only in the introduction, or turning the extract into plot summary.", "explanation_en": "The four scoring points are: quote → analyse language → link to whole text → avoid 'copying a whole paragraph/only mentioning at the start/just retelling the plot'. This is where Section 2 students often lose marks, as the marking criteria clearly state 'integrate the extract'.", "source": "Section 2 · Comparative essay — extract integration (LEEDER 10ENGB exam outline)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that integration means quoting selectively, using a few words that carry the technique or idea needed", "m": 1}, {"id": "c2", "t": "Explains that it means analysing the extract's wording (connotation, syntax, imagery) and linking it explicitly to the question", "m": 1}, {"id": "c3", "t": "Explains that the extract must be connected to the rest of the text, so it is a starting point rather than the whole evidence", "m": 1}, {"id": "c4", "t": "Identifies what to avoid: long quotation, mentioning the extract only in the introduction, or turning it into plot summary", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that integration means quoting selectively, using a few words that carry the technique or idea needed", "m": 1}, {"id": "c2", "t": "Explains that it means analysing the extract's wording (connotation, syntax, imagery) and linking it explicitly to the question", "m": 1}, {"id": "c3", "t": "Explains that the extract must be connected to the rest of the text, so it is a starting point rather than the whole evidence", "m": 1}, {"id": "c4", "t": "Identifies what to avoid: long quotation, mentioning the extract only in the introduction, or turning it into plot summary", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-028", "topic": "Comparative essay · Technique (prose vs film)", "difficulty": "medium", "type": "mcq", "stem": "Which option states a genuine point of comparison between Lee's novel and Parker's film?", "options": ["Lee uses words to describe things and Parker uses pictures, which means the film is easier to understand.", "Lee controls what Scout notices and when she understands it, while Parker controls what the camera shows and when the viewer sees it.", "Lee's novel is set in the 1930s and Parker's film is set in the 1960s, so the film is more historically accurate than the novel.", "Lee's novel has chapters and a narrator, while Parker's film has scenes and actors who speak dialogue."], "answer": 1, "explanation_en": "Effective comparison focuses on 'how the authors control information and the reader's response': Lee uses Scout's limited perspective to delay understanding, while Parker uses camera angles and editing to control what the audience sees. Saying 'Lee's novel has chapters and a narrator, while Parker's film has scenes and actors' just states the difference in medium, and doesn't constitute a comparison point.", "source": "Section 2 · Comparative essay — comparing literary and film techniques (10ENGA film study: visual storytelling, cinematography, director's purpose)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-029", "topic": "Comparative essay · Theme: law failing", "difficulty": "easy", "type": "mcq", "stem": "Which pair of moments best supports the claim that both texts show the law failing?", "options": ["The novel criticises the town's gossip about Boo Radley, and the film criticises the way the agents speak to local people.", "The novel shows a young child learning about her neighbours, and the film shows two agents slowly learning about a small town.", "Tom Robinson is convicted despite Atticus's defence, and the film's inquiry begins only because local police are implicated.", "Scout narrates the trial from the gallery, and the film's opening shows two water fountains side by side in the street."], "answer": 2, "explanation_en": "Evidence of 'legal failure' must directly relate to the justice system: Tom being found guilty, and the local law enforcement being involved in the case, requiring federal intervention. Other options discuss perspective, rumour, or 'learning about the town', which don't prove legal failure.", "source": "Section 2 · Comparative essay — theme axis: the law fails (10ENGA unit overview; film study context)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-030", "topic": "Comparative essay · Theme: individual responsibility", "difficulty": "easy", "type": "mcq", "stem": "Which claim best fits the theme of individual responsibility in both texts?", "options": ["Both texts place responsibility on the main characters, since the wider community is never shown to be at fault.", "Both texts place responsibility on families, since children learn prejudice at home and not in public.", "Both texts place responsibility on the law alone, since individuals cannot be held accountable for prejudice.", "Both texts place responsibility on individuals who let prejudice pass unchallenged, not only on the law."], "answer": 3, "explanation_en": "Individual responsibility means ordinary people who condone prejudice are also responsible, and responsibility isn't just limited to institutions. Saying 'both texts place responsibility on the law alone' or 'on families' or 'on the main characters' goes against the theme of both works.", "source": "Section 2 · Comparative essay — theme axis: individual responsibility (10ENGA unit overview)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-031", "topic": "Comparative essay · Paragraph planning", "difficulty": "hard", "type": "short", "stem": "Plan one comparative body paragraph for the question: 'How do Lee and Parker expose systemic racism?' Give a topic sentence, one textual point from each text, and the comparison you would draw. (5 marks)", "options": [], "answer": "1 mark — a topic sentence naming both texts and making a comparative claim (e.g. both expose a town that protects its own).\n1 mark — a specific point from Lee's novel: the trial and the town's hierarchy, with the technique that carries it (Scout's limited narration; the courtroom as a stage).\n1 mark — a specific point from Parker's film: for example the opening water-fountain sequence, with the technique that carries it (mid shot, framing, juxtaposition).\n1 mark — a comparison sentence explaining how the two methods differ in effect (delayed recognition vs immediate visual exposure).\n1 mark — a link back to the question's key term 'systemic', showing what the comparison proves.", "explanation_en": "For 5 points, you need: a topic sentence (including both texts and comparative argument) → Lee's evidence and technique → Parker's evidence and technique → comparative sentence (effect difference) → conclusion on 'institutional'. Note that both sides need evidence with technique, and just stating the plot won't get you analysis marks.", "source": "Section 2 · Comparative essay — paragraph planning (TKAMB BP scaffolds + film deconstruction lessons)", "marks": 5, "criteria": [{"id": "c1", "t": "Writes a topic sentence that names both texts and makes a comparative claim (e.g. both expose a town that protects its own)", "m": 1}, {"id": "c2", "t": "Gives a specific point from Lee's novel with the technique that carries it (e.g. the trial and the town's hierarchy; Scout's limited narration; the courtroom as a stage)", "m": 1}, {"id": "c3", "t": "Gives a specific point from Parker's film with the technique that carries it (e.g. the opening water-fountain sequence; mid shot, framing, juxtaposition)", "m": 1}, {"id": "c4", "t": "Includes a comparison sentence explaining how the two methods differ in effect (delayed recognition versus immediate visual exposure)", "m": 1}, {"id": "c5", "t": "Links back to the question's key term 'systemic', showing what the comparison proves", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Writes a topic sentence that names both texts and makes a comparative claim (e.g. both expose a town that protects its own)", "m": 1}, {"id": "c2", "t": "Gives a specific point from Lee's novel with the technique that carries it (e.g. the trial and the town's hierarchy; Scout's limited narration; the courtroom as a stage)", "m": 1}, {"id": "c3", "t": "Gives a specific point from Parker's film with the technique that carries it (e.g. the opening water-fountain sequence; mid shot, framing, juxtaposition)", "m": 1}, {"id": "c4", "t": "Includes a comparison sentence explaining how the two methods differ in effect (delayed recognition versus immediate visual exposure)", "m": 1}, {"id": "c5", "t": "Links back to the question's key term 'systemic', showing what the comparison proves", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-032", "topic": "Comparative essay · Conclusion", "difficulty": "hard", "type": "mcq", "stem": "Which conclusion best completes a comparative essay without simply repeating the introduction?", "options": ["The comparison matters because Lee's slow recognition and Parker's forced witness demand different responses, so empathy must become action.", "In conclusion, both Harper Lee and Alan Parker show that racism is bad, and this is why the two texts are still studied in schools today.", "In conclusion, Lee's novel and Parker's film are both important texts that teach readers and viewers about the dangers of prejudice.", "In conclusion, this essay has discussed characterisation, setting and narrative in To Kill a Mockingbird and Mississippi Burning as I set out."], "answer": 0, "explanation_en": "The conclusion should 'recap the argument and take it further': discussing how the comparison leads to different moral demands on the reader/audience (empathy must lead to action), rather than just restating the argument. The other options are vague evaluations, retelling the structure, or just repeating 'opposing prejudice'.", "source": "Section 2 · Comparative essay — conclusion (LEEDER 10ENGB exam outline: integrate the extract, sustain the argument)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-033", "topic": "Writing · Describing vs analysing", "difficulty": "easy", "type": "mcq", "stem": "Which sentence analyses rather than describes?", "options": ["Parker uses a mid shot in the opening scene, and a mid shot is a camera shot taken from a medium distance.", "The camera holds both fountains side by side, so segregation becomes an ordinary arrangement the viewer absorbs before judging it.", "In the opening scene Parker shows two water fountains, one for white people and one for black people, standing in the street.", "The scene is effective because it shows the audience that segregation really existed in towns in America at that time."], "answer": 1, "explanation_en": "Analysis sentences should have 'technique → effect → impact on the audience' in three steps: the camera angle makes segregation seem like a 'normal arrangement', making the audience accept before judging. Simply retelling the content, defining terms, or making vague assertions won't suffice.", "source": "Writing skills · Analytical vs descriptive sentences (Term 3 weeks 8–10: refining analytical writing)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-034", "topic": "Writing · What 'using the extract' means", "difficulty": "easy", "type": "mcq", "stem": "What does it mean to 'use' the extract supplied with an essay question?", "options": ["Copying the extract into your essay so the marker knows you have read the question.", "Mentioning that the extract exists and then writing about the rest of the text only.", "Quoting a few words from the extract inside your own sentence and analysing their effect.", "Summarising the extract in your own words without discussing its language."], "answer": 2, "explanation_en": "'Using' the extract means embedding it as evidence: quoting, analysing language, and linking back to the question and whole text. Copying a whole paragraph, only mentioning at the start, or just paraphrasing don't count as integration.", "source": "Writing skills · Using the supplied extract (LEEDER 10ENGB exam outline, Section 2 criteria)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-035", "topic": "Writing · Writing topic sentences", "difficulty": "medium", "type": "short", "stem": "Write one comparative topic sentence for a paragraph arguing that both texts show communities protecting their own. (3 marks)", "options": [], "answer": "Model answer: 'Both Lee's Maycomb and Parker's Mississippi town close ranks to protect the people who belong, and each composer shows that protection turning into complicity.'\n1 mark — names both texts/communities.\n1 mark — states one comparative claim that answers the question (protection becomes complicity).\n1 mark — signals the comparison of method or effect rather than just listing two facts.", "explanation_en": "For 3 points, you need to discuss both texts, have a comparative argument (protection → complicity), and forecast comparative angles. Simply stating 'both have community' is parallel, not comparative, and will only get you 1 point.", "source": "Writing skills · Topic sentences for comparative paragraphs (TKAMB BP scaffolds)", "marks": 3, "criteria": [{"id": "c1", "t": "Names both texts/communities (Lee's Maycomb and Parker's Mississippi town)", "m": 1}, {"id": "c2", "t": "States one comparative claim that answers the question (protection becomes complicity)", "m": 1}, {"id": "c3", "t": "Signals the comparison of method or effect rather than just listing two facts", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names both texts/communities (Lee's Maycomb and Parker's Mississippi town)", "m": 1}, {"id": "c2", "t": "States one comparative claim that answers the question (protection becomes complicity)", "m": 1}, {"id": "c3", "t": "Signals the comparison of method or effect rather than just listing two facts", "m": 1}], "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "eng-036", "topic": "Writing · Comparative topic sentences", "difficulty": "easy", "type": "mcq", "stem": "Why does a comparative essay need a comparative topic sentence in every body paragraph?", "options": ["Because the examiner only reads the first sentence of each paragraph when marking the essay.", "Because the introduction cannot mention either text and the body must do it instead.", "Because quotations from two texts must appear in the same sentence for the essay to count.", "Because the argument must run across both texts, so every paragraph has to keep both in view."], "answer": 3, "explanation_en": "Comparison essay marks come from 'sustained comparative argument throughout the text', so every paragraph's topic sentence should cover both texts and advance the argument. The other options are incorrect statements about marking or format.", "source": "Writing skills · Comparative topic sentences (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "weak": false, "subj": "eng", "subjZh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, {"id": "his-001", "topic": "Terms · Unipolarity", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines unipolarity?", "options": ["One state is dominant, with no rival of comparable power", "Power is dispersed among several competing great powers", "Power is shared between two rival blocs that balance each other", "Power rests with whichever state acts first without consulting others"], "answer": 0, "explanation_en": "A unipolar system has only one dominant power centre with no peer rivals, whereas bipolarity refers to the Cold War's US-Soviet balance, and multipolarity refers to multiple balancing powers; 'Power rests with whichever state acts first without consulting others' describes unilateralism, not the power structure.", "source": "Term 4 · Yearly Assessment Notification — Section One(Unipolarity)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-002", "topic": "Terms · Multilateral action", "difficulty": "easy", "type": "mcq", "stem": "Which action is the clearest example of multilateral action?", "options": ["One state acting alone without notifying any other government", "A coalition of states acting together under UN Security Council authorisation", "One state threatening to act alone unless its allies fall into line", "Two neighbouring states signing a border and trade agreement"], "answer": 1, "explanation_en": "Multilateral refers to actions involving multiple countries, usually coordinated through international institutions, with the key phrase being 'multiple countries + authorisation'; 'One state acting alone without notifying any other government' and 'One state threatening to act alone unless its allies fall into line' are unilateral, while 'Two neighbouring states signing a border and trade agreement' is bilateral, not multilateral.", "source": "Term 4 · Yearly Assessment Notification — Section One(Multilateral)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-003", "topic": "Terms · Unilateralism", "difficulty": "medium", "type": "mcq", "stem": "A government repeatedly insists it will act alone when allies disagree, even at the cost of isolation. This pattern of behaviour is best described as:", "options": ["Humanitarian intervention — force to protect civilians", "Multilateralism — several states act together", "Unilateralism — the habit of acting alone by choice", "Collective security — allies respond together"], "answer": 2, "explanation_en": "Unilateralism is a preference or habit where a country takes action alone despite knowing its allies oppose it, which is the opposite of collective security and multilateralism.", "source": "Term 4 · Yearly Assessment Notification — Section One(Unilateralism)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-004", "topic": "Terms · Collective security", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines collective security?", "options": ["A single state decides when and where military force will be used", "Each state builds enough weapons to deter rivals without any allies", "A powerful state intervenes inside another to stop human rights abuses", "States agree that an attack on one member is an attack on all"], "answer": 3, "explanation_en": "Collective security rests on the principle that an attack on one country is an attack on all, with members responding together, usually through the United Nations. Self-deterrence, humanitarian intervention and unilateral decision-making are different concepts.", "source": "Term 4 · Yearly Assessment Notification — Section One(Collective Security)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-005", "topic": "Terms · Collective security vs intervention", "difficulty": "medium", "type": "mcq", "stem": "Which action is the clearest example of collective security rather than humanitarian intervention?", "options": ["A UN-authorised coalition repelling Iraq's 1990 invasion of Kuwait", "US troops landing in Somalia in 1992 to protect food convoys", "US-led forces invading Iraq in 2003 without any explicit UN approval", "NATO aircraft bombing Serbia in 1999 to stop ethnic cleansing"], "answer": 0, "explanation_en": "The Gulf War is the classic example of collective security, because it responded to cross-border aggression. The other examples were driven by protecting civilians or overthrowing a regime, which makes them humanitarian intervention or pre-emption, not collective security.", "source": "Term 4 · Yearly Assessment Notification — Body 1(Gulf War 1991)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-006", "topic": "Terms · Pre-emption", "difficulty": "easy", "type": "mcq", "stem": "In the Bush Doctrine, pre-emption means:", "options": ["Intervening to stop a government killing its own citizens", "Striking first at a state or group judged to pose a future threat", "Waiting for an attack, then responding with UN approval", "Working through alliances so no single state decides on war"], "answer": 1, "explanation_en": "Pre-emption involves taking military action before a threat materialises, which is a key difference between the Bush Doctrine and collective security or humanitarian intervention.", "source": "Term 4 · Yearly Assessment Notification — Section One(Pre-emption)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-007", "topic": "Terms · Pre-emption vs humanitarian intervention", "difficulty": "medium", "type": "mcq", "stem": "Which feature most clearly separates pre-emption from humanitarian intervention?", "options": ["Pre-emption targets only non-state groups; intervention only states", "Pre-emption is always multilateral; intervention is always unilateral in form", "Pre-emption answers a future threat; intervention answers harm under way", "Pre-emption always needs UN authorisation; intervention never does"], "answer": 2, "explanation_en": "The key distinction lies in the timing of the threat: pre-emption targets threats that have not yet occurred, while humanitarian intervention responds to ongoing large-scale harm.", "source": "Term 4 · Yearly Assessment Notification — Section One(Pre-emption / Humanitarian Intervention)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-008", "topic": "Terms · Humanitarian intervention", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines humanitarian intervention?", "options": ["Defensive action taken after a direct attack on one's own soil", "Military action to seize disputed territory and its natural resources", "Economic sanctions agreed by a regional trade or security organisation", "Military action inside a state, without consent, to stop mass suffering"], "answer": 3, "explanation_en": "Humanitarian intervention has three requirements: entering another country, without their consent, and aiming to stop a large-scale humanitarian disaster, which is different from economic sanctions or self-defence.", "source": "Term 4 · Yearly Assessment Notification — Section One(Humanitarian Intervention)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-009", "topic": "Terms · Unilateral vs multilateral", "difficulty": "medium", "type": "mcq", "stem": "In 2003 State A went to war with a small group of allies after failing to win UN Security Council support, while State B sent troops to a UN-authorised mission. Which pairing is correct?", "options": ["A — unilateral action; B — multilateral action", "A — multilateral action; B — unilateral action", "A — collective security; B — humanitarian intervention", "A — humanitarian intervention; B — collective security"], "answer": 0, "explanation_en": "The criterion for judgement is whether there is widespread authorisation: A is unilateral as it involves a small group of allies and bypasses the UN Security Council, while B is multilateral as it involves a UN- authorised mission.", "source": "Term 4 · Yearly Assessment Notification — Body 2(invasion of Iraq)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-010", "topic": "Terms · Unilateral vs unilateralism", "difficulty": "medium", "type": "mcq", "stem": "Why does the course list both 'unilateral' and 'unilateralism' as separate terms?", "options": ["'Unilateralism' describes one action; 'unilateral' a whole doctrine", "'Unilateral' is one action taken alone; 'unilateralism' is the doctrine", "They are synonyms, listed twice for emphasis in the notes", "'Unilateral' describes economic policy; 'unilateralism' military policy"], "answer": 1, "explanation_en": "Unilateral refers to a single action taken by one party, while unilateralism refers to a policy or ideology that tends towards solo actions, and understanding this distinction is crucial for Section One.", "source": "Term 4 · Yearly Assessment Notification — Section One(Unilateral / Unilateralism)", "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-011", "topic": "Essay · Choosing evidence for Body 1", "difficulty": "easy", "type": "short", "stem": "Body 1 of the essay covers the 1990s. Name the two events from the notification's list that you would use, and justify your choice in one sentence. (2 marks)", "options": [], "answer": "The Gulf War (1991) and Somalia (1992–94). Together they show the two ends of the decade: a UN-authorised, broadly multilateral success, and a humanitarian mission whose failure produced a rapid US withdrawal and shaped later reluctance to intervene.", "explanation_en": "Body 1 needs only two events, but they must contrast rather than simply be listed: one successful multilateral example and one that exposes its limits — the Gulf War and Somalia, or the Gulf War and Kosovo.", "source": "Term 4 · Yearly Assessment Notification — Body 1(possible events)", "marks": 2, "criteria": [{"id": "c1", "t": "Names two relevant 1990s events from the notification's list (e.g. the Gulf War 1991 with Somalia 1992–94, or the Gulf War with Kosovo 1999)", "m": 1}, {"id": "c2", "t": "Justifies the choice in one sentence by saying what the pair shows (a broadly multilateral UN-authorised success against a mission that exposed the limits of intervention)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names two relevant 1990s events from the notification's list (e.g. the Gulf War 1991 with Somalia 1992–94, or the Gulf War with Kosovo 1999)", "m": 1}, {"id": "c2", "t": "Justifies the choice in one sentence by saying what the pair shows (a broadly multilateral UN-authorised success against a mission that exposed the limits of intervention)", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-012", "topic": "Essay · Gulf War and multilateralism", "difficulty": "easy", "type": "short", "stem": "Explain how the Gulf War of 1991 demonstrates multilateralism. (2 marks)", "options": [], "answer": "The United States led a broad coalition of states acting with United Nations Security Council authorisation to reverse Iraq's invasion of Kuwait, so the response was collectively authorised and its costs and risks were shared rather than carried by one state.", "explanation_en": "Multilateralism has two key features: UN authorisation and several countries sharing the burden. Answers must explain who authorised the action, how many parties took part and why it counts as multilateral, rather than just saying that many countries were involved.", "source": "Term 4 · Yearly Assessment Notification — Body 1(Gulf War 1991)", "marks": 2, "criteria": [{"id": "c1", "t": "States that the United States led a broad coalition of states acting with United Nations Security Council authorisation against Iraq's invasion of Kuwait", "m": 1}, {"id": "c2", "t": "Explains that the response was therefore collectively authorised, with costs and risks shared rather than carried by one state", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that the United States led a broad coalition of states acting with United Nations Security Council authorisation against Iraq's invasion of Kuwait", "m": 1}, {"id": "c2", "t": "Explains that the response was therefore collectively authorised, with costs and risks shared rather than carried by one state", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-013", "topic": "Essay · Gulf War as collective security", "difficulty": "medium", "type": "short", "stem": "Explain why the Gulf War of 1991 is better described as collective security than as humanitarian intervention. (3 marks)", "options": [], "answer": "The war responded to a cross-border act of aggression — Iraq's invasion and annexation of Kuwait — and was authorised collectively against that aggression. Its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government, which is the trigger that defines humanitarian intervention.", "explanation_en": "The key distinction is the trigger: collective security responds to state-on-state aggression, while humanitarian intervention responds to a government harming its own people, with the Gulf War being an example of the former and the late 1990s Kosovo crisis being a controversial example of the latter.", "source": "Term 4 · Yearly Assessment Notification — Section One + Body 1", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the war responded to a cross-border act of aggression (Iraq's invasion and annexation of Kuwait) and was authorised collectively against that aggression", "m": 1}, {"id": "c2", "t": "Explains that its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government", "m": 1}, {"id": "c3", "t": "Contrasts this with the trigger that defines humanitarian intervention (a government harming its own people), which is why the war belongs to collective security", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the war responded to a cross-border act of aggression (Iraq's invasion and annexation of Kuwait) and was authorised collectively against that aggression", "m": 1}, {"id": "c2", "t": "Explains that its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government", "m": 1}, {"id": "c3", "t": "Contrasts this with the trigger that defines humanitarian intervention (a government harming its own people), which is why the war belongs to collective security", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-014", "topic": "Essay · Somalia and limits of intervention", "difficulty": "medium", "type": "short", "stem": "What did the US experience in Somalia (1992–94) reveal about the limits of humanitarian intervention? (3 marks)", "options": [], "answer": "A humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias, and the deaths of US soldiers in 1993 led to a rapid withdrawal. It showed that without clear objectives and local consent, casualties can end an intervention before it stabilises the country.", "explanation_en": "Somalia is often used to show that intervention can be easy to start but hard to end: the mission's objective grew from delivering food aid to combat, casualties created domestic pressure, and the result was withdrawal. Answers must set out that causal chain clearly to score full marks.", "source": "Term 4 · Yearly Assessment Notification — Body 1 (Somalia 1992-94) + syllabus supplement", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that a humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias", "m": 1}, {"id": "c2", "t": "Explains that the deaths of US soldiers in 1993 led to a rapid withdrawal", "m": 1}, {"id": "c3", "t": "Explains the lesson drawn: without clear objectives and local consent, casualties can end an intervention before it stabilises the country", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that a humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias", "m": 1}, {"id": "c2", "t": "Explains that the deaths of US soldiers in 1993 led to a rapid withdrawal", "m": 1}, {"id": "c3", "t": "Explains the lesson drawn: without clear objectives and local consent, casualties can end an intervention before it stabilises the country", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-015", "topic": "Essay · Rwanda 1994", "difficulty": "medium", "type": "short", "stem": "Why is Rwanda (1994) usually described as a failure of humanitarian intervention? (3 marks)", "options": [], "answer": "The genocide of Tutsi and moderate Hutu civilians was carried out while the international community had a small, under-resourced peacekeeping force on the ground and refused to reinforce it or even to describe the killings as genocide. The world stood aside, so the decade's humanitarian language was not matched by action.", "explanation_en": "To answer 'failure' requires two aspects: insufficient on-the-ground power and a lack of willingness to intervene in global politics (even avoiding the term 'genocide'). This contrasts with the proactive intervention in Kosovo around the same time.", "source": "Term 4 · Yearly Assessment Notification — Body 1 (Rwanda 1994) + syllabus supplement", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the genocide of Tutsi and moderate Hutu civilians continued while only a small, under-resourced peacekeeping force was on the ground", "m": 1}, {"id": "c2", "t": "Explains that the international community refused to reinforce that force or even to describe the killings as genocide", "m": 1}, {"id": "c3", "t": "Explains that the world stood aside, so the decade's humanitarian language was not matched by action", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the genocide of Tutsi and moderate Hutu civilians continued while only a small, under-resourced peacekeeping force was on the ground", "m": 1}, {"id": "c2", "t": "Explains that the international community refused to reinforce that force or even to describe the killings as genocide", "m": 1}, {"id": "c3", "t": "Explains that the world stood aside, so the decade's humanitarian language was not matched by action", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-016", "topic": "Essay · Kosovo's grey area", "difficulty": "hard", "type": "short", "stem": "Why is NATO's 1999 intervention in Kosovo often called a 'grey case' of humanitarian intervention? (4 marks)", "options": [], "answer": "The motive was genuinely humanitarian — halting the ethnic cleansing of Kosovar Albanians — but NATO acted without explicit UN Security Council authorisation, so the intervention was of questionable legality while being widely seen as legitimate. It therefore sits between a legitimate humanitarian rescue and a unilateral use of force by an alliance.", "explanation_en": "The term 'grey' means having a justified motive but lacking authorisation: a separation of legitimacy and justification. To score high, you must discuss both sides, as simply stating 'saved people' or 'illegal' won't suffice.", "source": "Term 4 · Yearly Assessment Notification — Body 1 (Kosovo 1999) + syllabus supplement", "marks": 4, "criteria": [{"id": "c1", "t": "Identifies the genuinely humanitarian motive: halting the ethnic cleansing of Kosovar Albanians", "m": 1}, {"id": "c2", "t": "Explains that NATO acted without explicit UN Security Council authorisation, so the intervention was of questionable legality", "m": 1}, {"id": "c3", "t": "Explains that it was nevertheless widely seen as legitimate", "m": 1}, {"id": "c4", "t": "Concludes that it therefore sits between a legitimate humanitarian rescue and a unilateral use of force by an alliance", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies the genuinely humanitarian motive: halting the ethnic cleansing of Kosovar Albanians", "m": 1}, {"id": "c2", "t": "Explains that NATO acted without explicit UN Security Council authorisation, so the intervention was of questionable legality", "m": 1}, {"id": "c3", "t": "Explains that it was nevertheless widely seen as legitimate", "m": 1}, {"id": "c4", "t": "Concludes that it therefore sits between a legitimate humanitarian rescue and a unilateral use of force by an alliance", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-017", "topic": "Essay writing · Body 1 topic sentence", "difficulty": "medium", "type": "short", "stem": "Write a topic sentence for Body 1 (the 1990s) that directly answers the essay question. (2 marks)", "options": [], "answer": "In the 1990s the United States used its position as the world's single superpower to lead broadly multilateral, UN-authorised interventions, but its retreat from Somalia and its inaction over Rwanda exposed the limits of that approach.", "explanation_en": "A topic sentence must include 'time period + argument', rather than just 'many events in the 1990s'. A good topic sentence also foreshadows tension (multilateral leadership vs limitations) and leaves an interface for the link sentence.", "source": "Term 4 · Yearly Assessment Notification — Body 1(topic sentence row)", "marks": 2, "criteria": [{"id": "c1", "t": "Names the period (the 1990s) and makes an arguable claim that directly answers the essay question", "m": 1}, {"id": "c2", "t": "Signals the tension the paragraph will develop (multilateral leadership against its limits) instead of merely listing events", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names the period (the 1990s) and makes an arguable claim that directly answers the essay question", "m": 1}, {"id": "c2", "t": "Signals the tension the paragraph will develop (multilateral leadership against its limits) instead of merely listing events", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-018", "topic": "Essay · The post-9/11 shift", "difficulty": "easy", "type": "short", "stem": "Explain how the 9/11 attacks changed the priorities of US foreign policy. (3 marks)", "options": [], "answer": "They shifted US priorities from managing the post-Cold War order to a global 'war on terror'. The response included the invasion of Afghanistan in 2001, expanded surveillance and detention powers, much higher defence spending, and a willingness to use force pre-emptively and with limited international authorisation.", "explanation_en": "The anchor for answering is 'priority shift': from maintaining the post-Cold War order to counter-terrorism. You must write about at least two specific manifestations (Afghanistan, surveillance, military spending, pre-emptive strikes), rather than just stating 'became more aggressive'.", "source": "Term 4 · Lesson 3.1 9/11 Attacks; Notification — Body 2(Impact of 9/11)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that priorities shifted from managing the post-Cold War order to a global 'war on terror'", "m": 1}, {"id": "c2", "t": "Gives specific responses: the invasion of Afghanistan in 2001 and/or expanded surveillance and detention powers", "m": 1}, {"id": "c3", "t": "Explains that much higher defence spending and a willingness to use force pre-emptively, with limited international authorisation, followed", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that priorities shifted from managing the post-Cold War order to a global 'war on terror'", "m": 1}, {"id": "c2", "t": "Gives specific responses: the invasion of Afghanistan in 2001 and/or expanded surveillance and detention powers", "m": 1}, {"id": "c3", "t": "Explains that much higher defence spending and a willingness to use force pre-emptively, with limited international authorisation, followed", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-019", "topic": "Essay · The Bush Doctrine", "difficulty": "easy", "type": "short", "stem": "Outline the key features of the Bush Doctrine. (3 marks)", "options": [], "answer": "Pre-emption — striking first against states or groups judged to pose a future threat; a willingness to act unilaterally when multilateral agreement could not be reached; regime change and the promotion of democracy; and the claim that American security required action beyond UN authorisation.", "explanation_en": "The four characteristics must be illustrated with corresponding examples: pre-emptive strikes (Iraq), unilateralism (bypassing the UN Security Council), regime change (overthrowing Saddam), and promoting democracy. Simply memorising names without explanation will lose marks.", "source": "Term 4 · Lesson 3.2 The Bush Doctrine; Notification — Body 2", "marks": 3, "criteria": [{"id": "c1", "t": "Outlines pre-emption: striking first against states or groups judged to pose a future threat", "m": 1}, {"id": "c2", "t": "Outlines unilateral action: a willingness to act without multilateral agreement and beyond UN authorisation", "m": 1}, {"id": "c3", "t": "Outlines regime change and the promotion of democracy as aims of the doctrine", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Outlines pre-emption: striking first against states or groups judged to pose a future threat", "m": 1}, {"id": "c2", "t": "Outlines unilateral action: a willingness to act without multilateral agreement and beyond UN authorisation", "m": 1}, {"id": "c3", "t": "Outlines regime change and the promotion of democracy as aims of the doctrine", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-020", "topic": "Essay · Why Iraq was unilateral", "difficulty": "medium", "type": "short", "stem": "Explain why the 2003 invasion of Iraq is often described as unilateral rather than multilateral. (3 marks)", "options": [], "answer": "The United States proceeded with a 'coalition of the willing' after failing to obtain explicit UN Security Council authorisation, and supplied most of the troops and funding itself. Key allies such as France and Germany opposed the war, so it lacked the broad, institutionally authorised coalition that made the 1991 Gulf War multilateral.", "explanation_en": "The criterion is not 'having allies', but 'having broad authorisation and shared responsibility'. Although the US had allies, its small circle and lack of UN Security Council authorisation mean it is classified as unilateral in the textbook.", "source": "Term 4 · Lesson 4.2 Iraq; Notification — Body 2(invasion of Iraq)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the United States proceeded with a 'coalition of the willing' after failing to obtain explicit UN Security Council authorisation", "m": 1}, {"id": "c2", "t": "Explains that the United States supplied most of the troops and funding itself, and that key allies such as France and Germany opposed the war", "m": 1}, {"id": "c3", "t": "Explains that it therefore lacked the broad, institutionally authorised coalition that made the 1991 Gulf War multilateral", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the United States proceeded with a 'coalition of the willing' after failing to obtain explicit UN Security Council authorisation", "m": 1}, {"id": "c2", "t": "Explains that the United States supplied most of the troops and funding itself, and that key allies such as France and Germany opposed the war", "m": 1}, {"id": "c3", "t": "Explains that it therefore lacked the broad, institutionally authorised coalition that made the 1991 Gulf War multilateral", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-021", "topic": "Essay · 1991 vs 2003", "difficulty": "hard", "type": "short", "stem": "Contrast the multilateralism of the 1991 Gulf War with the unilateralism of the 2003 invasion of Iraq. (4 marks)", "options": [], "answer": "In 1991 the United States operated through the UN Security Council, built a large coalition with shared costs, and limited the objective to reversing Iraq's aggression. In 2003 it acted after failing to secure explicit Security Council authorisation, with a smaller ad hoc coalition and US forces dominating, and the objective was regime change and disarmament rather than repelling an attack.", "explanation_en": "Contrasts must be made in three comparable dimensions: authorisation (present/absent), alliance scale and burden-sharing (broad/narrow), and goals (restoring the status quo/changing the regime). Aligning these three points will ensure a stable score.", "source": "Term 4 · Yearly Assessment Notification — Body 1(Gulf War) + Body 2(Iraq)", "marks": 4, "criteria": [{"id": "c1", "t": "Contrasts authorisation: 1991 operated through the UN Security Council, while 2003 proceeded after failing to secure explicit Security Council authorisation", "m": 1}, {"id": "c2", "t": "Contrasts the coalition: a large coalition with shared costs in 1991 against a smaller ad hoc coalition dominated by US forces in 2003", "m": 1}, {"id": "c3", "t": "Contrasts the objectives: reversing Iraq's aggression and restoring Kuwait in 1991 against regime change and disarmament in 2003", "m": 1}, {"id": "c4", "t": "Sustains the comparison across these dimensions, explaining what makes one case multilateral and the other unilateral", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Contrasts authorisation: 1991 operated through the UN Security Council, while 2003 proceeded after failing to secure explicit Security Council authorisation", "m": 1}, {"id": "c2", "t": "Contrasts the coalition: a large coalition with shared costs in 1991 against a smaller ad hoc coalition dominated by US forces in 2003", "m": 1}, {"id": "c3", "t": "Contrasts the objectives: reversing Iraq's aggression and restoring Kuwait in 1991 against regime change and disarmament in 2003", "m": 1}, {"id": "c4", "t": "Sustains the comparison across these dimensions, explaining what makes one case multilateral and the other unilateral", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}
