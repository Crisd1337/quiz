, {"id": "his-022", "topic": "Essay · China's rise and unipolarity", "difficulty": "hard", "type": "short", "stem": "Explain how the rise of China challenged unipolarity after 2001. (3 marks)", "options": [], "answer": "China's rapid economic growth, its entry into the World Trade Organization in 2001, sustained military modernisation, and initiatives such as the Belt and Road and the Asian Infrastructure Investment Bank gave it regional and global influence. As a result the United States could no longer act as an unchallenged single pole, especially in the Indo-Pacific.", "explanation_en": "A unipolar system being challenged means the emergence of near-peer competitors. Answers must provide economic (WTO, scale), military, and institutional initiative evidence, as simply stating 'China has grown stronger' is too vague.", "source": "Term 4 · Yearly Assessment Notification — Body 3 (Rise of China) + syllabus supplement", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that China's rapid economic growth and its 2001 entry into the World Trade Organization increased its economic weight", "m": 1}, {"id": "c2", "t": "Explains that sustained military modernisation and initiatives such as the Belt and Road and the Asian Infrastructure Investment Bank extended its regional and global influence", "m": 1}, {"id": "c3", "t": "Explains the consequence: the United States could no longer act as an unchallenged single pole, especially in the Indo-Pacific", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that China's rapid economic growth and its 2001 entry into the World Trade Organization increased its economic weight", "m": 1}, {"id": "c2", "t": "Explains that sustained military modernisation and initiatives such as the Belt and Road and the Asian Infrastructure Investment Bank extended its regional and global influence", "m": 1}, {"id": "c3", "t": "Explains the consequence: the United States could no longer act as an unchallenged single pole, especially in the Indo-Pacific", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-023", "topic": "Essay · Decline of soft power", "difficulty": "easy", "type": "short", "stem": "Explain what a decline in US soft power means, and give one example from the period. (2 marks)", "options": [], "answer": "Soft power is influence gained through attraction — culture, values and institutions — rather than through coercion or payment. The Iraq War and the abuse of prisoners at Abu Ghraib damaged America's international reputation in the 2000s, making other states less willing to cooperate.", "explanation_en": "Soft power refers to attractiveness (culture, values, institutions), as opposed to hard power, which involves coercion through military force or money. Providing examples of a damaged image after 2003 is the most direct approach.", "source": "Term 4 · Yearly Assessment Notification — Body 3 (Decline in US soft power) + syllabus supplement", "marks": 2, "criteria": [{"id": "c1", "t": "Defines soft power as influence gained through attraction (culture, values and institutions) rather than through coercion or payment", "m": 1}, {"id": "c2", "t": "Gives one valid example of decline from the period (e.g. the Iraq War or the abuse of prisoners at Abu Ghraib damaging America's international reputation in the 2000s)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines soft power as influence gained through attraction (culture, values and institutions) rather than through coercion or payment", "m": 1}, {"id": "c2", "t": "Gives one valid example of decline from the period (e.g. the Iraq War or the abuse of prisoners at Abu Ghraib damaging America's international reputation in the 2000s)", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-024", "topic": "Essay · Protectionism and deglobalisation", "difficulty": "easy", "type": "short", "stem": "Explain how the rise of protectionism and deglobalisation shaped US foreign policy after 2008. (2 marks)", "options": [], "answer": "The global financial crisis and the loss of manufacturing jobs pushed US policy away from promoting free trade. The United States withdrew from the Trans-Pacific Partnership in 2017 and imposed tariffs on Chinese goods from 2018, so trade became a tool of economic pressure rather than of liberal cooperation.", "explanation_en": "Protectionism refers to using tariffs and barriers to protect domestic industries, while de-globalisation means weakening trade and investment integration. Answers must provide specific policies (withdrawing from TPP, tariffs on China), otherwise, they are just reiterating definitions.", "source": "Term 4 · Yearly Assessment Notification — Body 3 (protectionism/deglobalisation) + syllabus supplement", "marks": 2, "criteria": [{"id": "c1", "t": "Explains that the global financial crisis and the loss of manufacturing jobs pushed US policy away from promoting free trade", "m": 1}, {"id": "c2", "t": "Gives specific policy evidence: withdrawal from the Trans-Pacific Partnership in 2017 and tariffs on Chinese goods from 2018, making trade a tool of economic pressure", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the global financial crisis and the loss of manufacturing jobs pushed US policy away from promoting free trade", "m": 1}, {"id": "c2", "t": "Gives specific policy evidence: withdrawal from the Trans-Pacific Partnership in 2017 and tariffs on Chinese goods from 2018, making trade a tool of economic pressure", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-025", "topic": "Essay · Unipolar to multipolar", "difficulty": "hard", "type": "short", "stem": "Explain the shift from unipolarity towards a more multipolar order between 1991 and 2019. (3 marks)", "options": [], "answer": "In 1991 the United States was the only superpower, with no economic or military peer. By 2019 China had become a near-peer economically, the European Union and Russia asserted independent positions, and regional powers had more room to act, so influence was more widely distributed even though the United States remained militarily dominant.", "explanation_en": "Evidence of multipolarisation is 'power diffusion': economic scale approaching parity, rising autonomy of regional powers, and emerging institutional alternatives. Be careful to distinguish between 'military strength remaining dominant' and 'overall power no longer being singularly dominant'.", "source": "Term 4 · Yearly Assessment Notification — Body 3 + syllabus supplement", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that in 1991 the United States was the only superpower, with no economic or military peer", "m": 1}, {"id": "c2", "t": "Explains that by 2019 China had become a near-peer economically, while the European Union and Russia asserted independent positions", "m": 1}, {"id": "c3", "t": "Explains that influence was therefore more widely distributed even though the United States remained militarily dominant", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that in 1991 the United States was the only superpower, with no economic or military peer", "m": 1}, {"id": "c2", "t": "Explains that by 2019 China had become a near-peer economically, while the European Union and Russia asserted independent positions", "m": 1}, {"id": "c3", "t": "Explains that influence was therefore more widely distributed even though the United States remained militarily dominant", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-026", "topic": "Essay writing · Structuring Body 2", "difficulty": "medium", "type": "short", "stem": "Explain how you would structure Body 2 (9/11 and Iraq) — which events, and what the link sentence must do. (3 marks)", "options": [], "answer": "Open with the 9/11 attacks as the trigger, then the Bush Doctrine as the doctrinal response (pre-emption, unilateralism, regime change), then the invasion of Iraq in 2003 as the application of that doctrine. The link sentence must draw out the change: from multilateral, UN-authorised action in the 1990s to pre-emptive, largely unilateral force.", "explanation_en": "Body 2 should be written in a 'trigger → theory → practice' three-step approach. The link sentence cannot simply state 'so the US changed', but must specify 'what changed relative to Body 1'.", "source": "Term 4 · Yearly Assessment Notification — Body 2(events to include)", "marks": 3, "criteria": [{"id": "c1", "t": "Opens the body with the 9/11 attacks as the trigger", "m": 1}, {"id": "c2", "t": "Explains the Bush Doctrine as the doctrinal response (pre-emption, unilateralism, regime change) and the 2003 invasion of Iraq as its application", "m": 1}, {"id": "c3", "t": "Explains what the link sentence must do: draw out the change from multilateral, UN-authorised action in the 1990s to pre-emptive, largely unilateral force", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Opens the body with the 9/11 attacks as the trigger", "m": 1}, {"id": "c2", "t": "Explains the Bush Doctrine as the doctrinal response (pre-emption, unilateralism, regime change) and the 2003 invasion of Iraq as its application", "m": 1}, {"id": "c3", "t": "Explains what the link sentence must do: draw out the change from multilateral, UN-authorised action in the 1990s to pre-emptive, largely unilateral force", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-027", "topic": "Essay writing · Thesis statement", "difficulty": "hard", "type": "short", "stem": "Write a thesis statement that answers: 'Explain the development of US foreign policy between 1991 and 2019.' (3 marks)", "options": [], "answer": "Between 1991 and 2019, US foreign policy moved from leading multilateral, UN-authorised interventions as the world's single superpower, to asserting pre-emptive and largely unilateral force after 9/11, and finally to defending a declining position against a rising China.", "explanation_en": "The topic sentence must cover all three paragraphs, not just the first: multi-directional leadership → unilateral initiative → responding to decline. It should state the 'direction of change' in one sentence, and that sentence is the thesis.", "source": "Term 4 · Yearly Assessment Notification — Section Two(thesis statement row)", "marks": 3, "criteria": [{"id": "c1", "t": "Covers the whole period 1991–2019 rather than only one phase", "m": 1}, {"id": "c2", "t": "States a direction of change: from multilateral, UN-authorised leadership as the single superpower to pre-emptive and largely unilateral force after 9/11", "m": 1}, {"id": "c3", "t": "Carries the argument through to the final phase: defending a declining position against a rising China", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Covers the whole period 1991–2019 rather than only one phase", "m": 1}, {"id": "c2", "t": "States a direction of change: from multilateral, UN-authorised leadership as the single superpower to pre-emptive and largely unilateral force after 9/11", "m": 1}, {"id": "c3", "t": "Carries the argument through to the final phase: defending a declining position against a rising China", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "his-028", "topic": "Essay writing · Building one argument", "difficulty": "hard", "type": "short", "stem": "Explain how the three body paragraphs together answer the essay question. (4 marks)", "options": [], "answer": "Body 1 establishes the multilateral, collective-security phase of the 1990s. Body 2 explains the rupture after 9/11, when pre-emption and unilateralism displaced UN authorisation. Body 3 shows the consequences up to 2019, as China's rise, declining US soft power and a turn to protectionism ended the unipolar moment. Together they trace one line: from multilateral leadership, to unilateral assertiveness, to managed decline.", "explanation_en": "High-scoring essays run a single thread throughout instead of writing three independent paragraphs: each paragraph is a stage in the same process of change, and the link between paragraphs must be explained rather than each one merely summarised.", "source": "Term 4 · Yearly Assessment Notification — Body 1 / 2 / 3", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that Body 1 establishes the multilateral, collective-security phase of the 1990s", "m": 1}, {"id": "c2", "t": "Explains that Body 2 covers the rupture after 9/11, when pre-emption and unilateralism displaced UN authorisation", "m": 1}, {"id": "c3", "t": "Explains that Body 3 shows the consequences up to 2019, as China's rise, declining US soft power and a turn to protectionism ended the unipolar moment", "m": 1}, {"id": "c4", "t": "Identifies the single line the three paragraphs trace (multilateral leadership, then unilateral assertiveness, then managed decline) rather than summarising each one separately", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Body 1 establishes the multilateral, collective-security phase of the 1990s", "m": 1}, {"id": "c2", "t": "Explains that Body 2 covers the rupture after 9/11, when pre-emption and unilateralism displaced UN authorisation", "m": 1}, {"id": "c3", "t": "Explains that Body 3 shows the consequences up to 2019, as China's rise, declining US soft power and a turn to protectionism ended the unipolar moment", "m": 1}, {"id": "c4", "t": "Identifies the single line the three paragraphs trace (multilateral leadership, then unilateral assertiveness, then managed decline) rather than summarising each one separately", "m": 1}], "weak": false, "subj": "his", "subjZh": "Year 10 History — Yearly Exam"}, {"id": "hisother-001", "topic": "The Holocaust · Analysing source perspective", "difficulty": "easy", "type": "mcq", "stem": "The Holocaust practice questions set out three steps for 'accounting for the perspective' of a source. After stating what the perspective is, what must you do next?", "options": ["Explain how the perspective appears in the source and why it is there", "Summarise the source in one sentence without using its evidence", "State whether the source is a primary or secondary source", "Describe how long the source is, where it was published and who wrote it"], "answer": 0, "explanation_en": "The material sets out three steps: first, identify the perspective; then explain how that perspective is presented in the source and why; simply summarising content without analysing perspective is a common way to lose marks.", "source": "Term 1 · Practice Questions.pdf — Account for the perspective of Source A", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-002", "topic": "The Holocaust · Einsatzgruppen", "difficulty": "easy", "type": "mcq", "stem": "In the Lessons 3.2–4.1 sequence, the Einsatzgruppen are described as which of the following?", "options": ["Jewish resistance fighters", "Mobile killing squads", "The Gestapo secret police", "Camp-based killing units"], "answer": 1, "explanation_en": "The lesson is titled 'The Einsatzgruppen — mobile killing squads'. They followed the German army into Eastern Europe and the Soviet Union and killed on a large scale through mass shootings, a different form of killing from the concentration camp system.", "source": "Term 1 · Lessons 3.2–4.1 The Einsatzgruppen (module list)", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-003", "topic": "The Holocaust · Analysing propaganda posters", "difficulty": "hard", "type": "mcq", "stem": "A 1934 Nazi propaganda image shows a Jewish man as greedy and physically repellent while a German family looks healthy and prosperous. Which conclusion is most defensible for a historian?", "options": ["It proves German families were wealthier than Jewish families in 1934", "It shows that antisemitism only began in Germany in 1934", "It shows the regime's dehumanising portrayal, not how Jews lived", "It is too one-sided to be of much use to any historian"], "answer": 2, "explanation_en": "The value of a propaganda poster lies in what it reveals about the intentions of its creators and the stereotypes they promoted, not in the facts it states. Choosing 'no value' is the typical mistake: bias is itself important evidence about Nazi ideology.", "source": "Term 1 · Lesson 1.3 Nazi propaganda & the skill of perspective", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-004", "topic": "The Holocaust · Judging source value", "difficulty": "medium", "type": "short", "stem": "Explain why a historian studying Kristallnacht might still find a source produced by a Nazi official valuable, even though it is biased.", "options": [], "answer": "It reveals the perpetrator's perspective, language and motives — what the regime wanted its audience to believe and how it justified the attacks. The bias is itself evidence of Nazi intent, but the source must be checked against other evidence, such as victim testimony.", "explanation_en": "Bias does not mean a source has no value: the perpetrator's perspective can reveal propaganda intentions and motives, but it must be used alongside other evidence such as victim testimony. Answers should attend to 'who and why', not simply to true or false.", "source": "Term 1 · Practice Questions.pdf / Lesson 4.1 Propaganda value source analysis", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the source reveals the perpetrator's perspective, language and motives — what the regime wanted its audience to believe and how it justified the attacks", "m": 1}, {"id": "c2", "t": "Argues that the bias is itself evidence of Nazi intent and values", "m": 1}, {"id": "c3", "t": "States that the source must be checked against other evidence, such as victim testimony", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the source reveals the perpetrator's perspective, language and motives — what the regime wanted its audience to believe and how it justified the attacks", "m": 1}, {"id": "c2", "t": "Argues that the bias is itself evidence of Nazi intent and values", "m": 1}, {"id": "c3", "t": "States that the source must be checked against other evidence, such as victim testimony", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-005", "topic": "The Holocaust · Content and perspective", "difficulty": "medium", "type": "short", "stem": "Distinguish between a source's content and its perspective, and explain why a historian needs both.", "options": [], "answer": "Content is what the source says or shows — the events, people and details in it. Perspective is the point of view from which it was made, shaped by the author's side, purpose and audience. A historian needs the content as evidence and the perspective to judge how far that evidence can be trusted.", "explanation_en": "Content answers 'what was said'; perspective answers 'who said it, from which side, and why'. Keeping the two apart lets you both use the source and evaluate it.", "source": "Term 1 · Source Analysis Study Notes / Practice Questions", "marks": 3, "criteria": [{"id": "c1", "t": "Defines content as what the source says or shows — the events, people and details in it", "m": 1}, {"id": "c2", "t": "Defines perspective as the point of view from which the source was made, shaped by the author's side, purpose and audience", "m": 1}, {"id": "c3", "t": "Explains that a historian needs the content as evidence and the perspective to judge how far that evidence can be trusted", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines content as what the source says or shows — the events, people and details in it", "m": 1}, {"id": "c2", "t": "Defines perspective as the point of view from which the source was made, shaped by the author's side, purpose and audience", "m": 1}, {"id": "c3", "t": "Explains that a historian needs the content as evidence and the perspective to judge how far that evidence can be trusted", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-006", "topic": "Cold War · Potsdam Conference", "difficulty": "easy", "type": "mcq", "stem": "Which conference does Lesson 2.1 use as the starting point for explaining how the Cold War began?", "options": ["The Yalta Conference", "The Versailles Conference", "The Geneva Conference", "The Potsdam Conference"], "answer": 3, "explanation_en": "The lesson sets out to understand the Potsdam Conference and its role in creating the Cold War conflict. The Yalta Conference also took place near the end of the war, but the course starts with Potsdam.", "source": "Term 2 · Lesson 2.1 Origins of the Cold War (Potsdam Conference)", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-007", "topic": "Cold War · Marshall Plan and NATO", "difficulty": "medium", "type": "mcq", "stem": "Which pairing correctly matches the two containment instruments taught in Lesson 2.3?", "options": ["Marshall Plan — economic aid; NATO — collective security alliance", "Marshall Plan — cultural exchange; NATO — trade agreement", "Marshall Plan — military alliance; NATO — economic aid program", "Marshall Plan — covert CIA action; NATO — nuclear sharing"], "answer": 0, "explanation_en": "The Marshall Plan used economic aid to rebuild Western Europe and reduce the appeal of communism, while NATO (1949) was a collective security alliance. Together they formed the containment system in Europe.", "source": "Term 2 · Lesson 2.3 The Policy of Containment in Europe — Marshall Plan & NATO", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-008", "topic": "Cold War · Berlin Crisis 1961", "difficulty": "easy", "type": "mcq", "stem": "What was the immediate result of the Berlin Crisis of 1961?", "options": ["The reunification of Germany under a single government", "The building of the Berlin Wall, dividing East from West Berlin", "The withdrawal of all Soviet troops from East Germany", "The signing of a formal peace treaty ending the Cold War"], "answer": 1, "explanation_en": "In the 1961 Berlin Crisis, East Germany built the Berlin Wall with Soviet support to stop the outflow of its population, and the wall became a symbol of the Cold War division of Europe.", "source": "Term 2 · Lesson 5.2 The Berlin Crisis (1961)", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-009", "topic": "Cold War · Comparing containment methods", "difficulty": "medium", "type": "short", "stem": "Explain one significant difference between Truman's and Eisenhower's methods of containing communism.", "options": [], "answer": "Truman relied mainly on economic and military aid (the Truman Doctrine, the Marshall Plan) and on collective security through NATO, plus a limited conventional war in Korea. Eisenhower preferred nuclear deterrence, brinkmanship and covert CIA action because it contained communism at a lower cost.", "explanation_en": "The difference lies in means and cost: Truman relied on economic aid and alliances, while Eisenhower relied on nuclear deterrence and covert operations. Answers also need the specific policy names.", "source": "Term 2 · Unit essay question (Lessons 3.2 / 6.1 modelling)", "marks": 3, "criteria": [{"id": "c1", "t": "Identifies Truman's method as mainly economic and military aid (Truman Doctrine, Marshall Plan) and collective security through NATO, plus a limited conventional war in Korea", "m": 1}, {"id": "c2", "t": "Identifies Eisenhower's method as nuclear deterrence, brinkmanship and covert CIA action", "m": 1}, {"id": "c3", "t": "Explains the significance of the difference: Eisenhower's approach contained communism at a lower cost", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies Truman's method as mainly economic and military aid (Truman Doctrine, Marshall Plan) and collective security through NATO, plus a limited conventional war in Korea", "m": 1}, {"id": "c2", "t": "Identifies Eisenhower's method as nuclear deterrence, brinkmanship and covert CIA action", "m": 1}, {"id": "c3", "t": "Explains the significance of the difference: Eisenhower's approach contained communism at a lower cost", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-010", "topic": "Cold War · Cuban Missile Crisis", "difficulty": "hard", "type": "short", "stem": "Explain why the Cuban Missile Crisis of 1962 is treated as the most dangerous moment of the Cold War.", "options": [], "answer": "The discovery of Soviet nuclear missiles in Cuba led to a US naval quarantine and a direct superpower standoff in which any miscalculation could have triggered nuclear war. It ended with the Soviet withdrawal of the missiles and a US pledge not to invade Cuba, and it pushed both sides towards arms control.", "explanation_en": "The danger was direct confrontation between two nuclear powers with very little decision time. The outcome was the Soviet withdrawal of the missiles, a US promise not to invade Cuba (and a secret US withdrawal of missiles from Turkey), and a move towards arms-control talks.", "source": "Term 2 · Lesson 5.3 JFK and the Cuban Missile Crisis (1962)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the discovery of Soviet nuclear missiles in Cuba led to a US naval quarantine and a direct superpower standoff", "m": 1}, {"id": "c2", "t": "Explains why it was so dangerous: two nuclear-armed superpowers faced each other directly and any miscalculation could have triggered nuclear war", "m": 1}, {"id": "c3", "t": "Describes the resolution and its aftermath: Soviet withdrawal of the missiles, a US pledge not to invade Cuba, and a push towards arms control", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the discovery of Soviet nuclear missiles in Cuba led to a US naval quarantine and a direct superpower standoff", "m": 1}, {"id": "c2", "t": "Explains why it was so dangerous: two nuclear-armed superpowers faced each other directly and any miscalculation could have triggered nuclear war", "m": 1}, {"id": "c3", "t": "Describes the resolution and its aftermath: Soviet withdrawal of the missiles, a US pledge not to invade Cuba, and a push towards arms control", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-011", "topic": "Civil rights · Universal Declaration of Human Rights", "difficulty": "easy", "type": "mcq", "stem": "Lesson 1.2 examines the significance of the UDHR. Which description of the UDHR is correct?", "options": ["An Australian law passed in 1948 that ended the White Australia Policy", "A document listing the punishments given at the Nuremberg Trials", "A 1948 UN declaration of fundamental rights that influenced later conventions", "A treaty signed only by the United States and the Soviet Union in 1948"], "answer": 2, "explanation_en": "The Universal Declaration of Human Rights, adopted by the UN General Assembly in 1948, is not a treaty. It provides the normative basis for later human rights conventions and for domestic law, and that is where its significance lies.", "source": "Term 3 · Lesson 1.2 The significance of the UDHR to human rights & freedoms", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-012", "topic": "Civil rights · Freedom Ride", "difficulty": "easy", "type": "mcq", "stem": "According to the Significant Individuals list in the assessment guide, who led the 1965 Freedom Ride?", "options": ["Vincent Lingiari", "Eddie Koiki Mabo", "William Cooper", "Charles Perkins"], "answer": 3, "explanation_en": "The material states clearly that Charles Perkins led the 1965 Freedom Ride. The other figures pair with the 1966 Wave Hill strike (Lingiari), the 1992 Mabo case and the 1938 Day of Mourning (Cooper).", "source": "Term 3 · Civil Rights Comic Book Assessment Guide — Significant Individuals", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-013", "topic": "Civil rights · Mabo and native title", "difficulty": "medium", "type": "mcq", "stem": "Which statement explains the significance of Eddie Koiki Mabo's case (1992)?", "options": ["It overturned terra nullius and recognised native title in law", "It created the first Aboriginal community-controlled health service", "It gave Aboriginal Australians the right to vote in elections", "It ended the forced removal of Aboriginal children from families"], "answer": 0, "explanation_en": "The Mabo decision rejected the legal doctrine of 'terra nullius' and recognised the land rights of Aboriginal and Torres Strait Islander peoples, which was a turning point in the land rights movement.", "source": "Term 3 · Assessment Guide — Significant Individuals (Eddie Koiki Mabo)", "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-014", "topic": "Civil rights · Stolen Generations", "difficulty": "medium", "type": "short", "stem": "Explain what is meant by the 'Stolen Generations'.", "options": [], "answer": "They are the Aboriginal and Torres Strait Islander children who were forcibly removed from their families by government agencies and church missions under protection and welfare laws, mainly across the twentieth century. The removals broke families and caused long-term trauma that still affects communities.", "explanation_en": "The key point is forced removal rather than voluntary departure, carried out under state protection and welfare laws, with family disruption and intergenerational trauma as the result.", "source": "Term 3 · Lesson 5.2 The Stolen Generations", "marks": 3, "criteria": [{"id": "c1", "t": "Identifies the Stolen Generations as Aboriginal and Torres Strait Islander children who were forcibly removed from their families", "m": 1}, {"id": "c2", "t": "Explains that the removals were carried out by government agencies and church missions under protection and welfare laws, mainly across the twentieth century", "m": 1}, {"id": "c3", "t": "Explains the consequence: the removals broke families and caused long-term trauma that still affects communities", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies the Stolen Generations as Aboriginal and Torres Strait Islander children who were forcibly removed from their families", "m": 1}, {"id": "c2", "t": "Explains that the removals were carried out by government agencies and church missions under protection and welfare laws, mainly across the twentieth century", "m": 1}, {"id": "c3", "t": "Explains the consequence: the removals broke families and caused long-term trauma that still affects communities", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"id": "hisother-015", "topic": "Civil rights · Land rights and native title", "difficulty": "hard", "type": "short", "stem": "Distinguish between 'land rights' and 'native title' as used in Lesson 5.3.", "options": [], "answer": "Land rights are grants or recognition of land by government legislation — land returned or given to Aboriginal communities. Native title is a right recognised by the courts as belonging to Aboriginal and Torres Strait Islander peoples whose traditional laws and customs connect them to the land; it is understood to have survived colonisation rather than being granted.", "explanation_en": "The crucial difference lies in the source: land rights come from legislation and government grants, while native title comes from court-recognised traditional rights existing before colonisation (the Mabo decision).", "source": "Term 3 · Lesson 5.3 The Significance of the Land Rights Movement & Native Title", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that land rights are grants or recognition of land by government legislation — land returned or given to Aboriginal communities", "m": 1}, {"id": "c2", "t": "Explains that native title is a right recognised by the courts, belonging to peoples whose traditional laws and customs connect them to the land", "m": 1}, {"id": "c3", "t": "Distinguishes the source of each right: native title is understood to have survived colonisation rather than being granted", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that land rights are grants or recognition of land by government legislation — land returned or given to Aboriginal communities", "m": 1}, {"id": "c2", "t": "Explains that native title is a right recognised by the courts, belonging to peoples whose traditional laws and customs connect them to the land", "m": 1}, {"id": "c3", "t": "Distinguishes the source of each right: native title is understood to have survived colonisation rather than being granted", "m": 1}], "weak": false, "subj": "hisother", "subjZh": "History · Non-exam content (Terms 1–3)"}, {"topic": "Climate · Greenhouse gases", "difficulty": "easy", "type": "mcq", "stem": "Which group lists only greenhouse gases?", "options": ["Carbon dioxide, methane, water vapour", "Oxygen, nitrogen, argon", "Nitrogen, methane, neon", "Oxygen, carbon dioxide, helium"], "answer": 0, "explanation_en": "Greenhouse gases that absorb and re-emit infrared radiation include CO₂, CH₄, water vapour, N₂O and CFCs. Oxygen and nitrogen make up 99% of the atmosphere, but they do not absorb infrared radiation and are not greenhouse gases.", "source": "Yearly Study Guide 2026 · Geography Section I(terms / metalanguage)", "id": "geo-001", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Enhanced greenhouse effect", "difficulty": "easy", "type": "mcq", "stem": "The enhanced greenhouse effect refers to:", "options": ["The reflection of sunlight by clouds", "Extra warming caused by human increases in greenhouse gas concentrations", "The natural warming that keeps Earth habitable", "The cooling effect of volcanic ash"], "answer": 1, "explanation_en": "The natural greenhouse effect keeps the Earth's average temperature at about 15°C rather than −18°C, and it is essential. 'Enhanced' refers to the additional greenhouse gases released by human activities, which strengthen that effect.", "source": "Yearly Study Guide 2026 · Geography Section I", "id": "geo-002", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · How the greenhouse effect works", "difficulty": "medium", "type": "mcq", "stem": "In the greenhouse effect, which sequence is correct?", "options": ["The ozone layer traps heat near the surface", "Long-wave radiation from the Sun is absorbed by the surface", "Short-wave solar radiation passes through the atmosphere, is absorbed by the surface and re-emitted as long-wave radiation, which is then trapped", "Greenhouse gases reflect short-wave radiation back to space"], "answer": 2, "explanation_en": "Solar radiation, mainly short-wave, passes through the atmosphere to reach the Earth's surface; as the surface warms, it radiates long-wave (infrared) radiation, which is absorbed and re-emitted by greenhouse gases, with some returning to the surface.", "source": "Yearly Study Guide 2026 · Geography Section II(greenhouse effect)", "id": "geo-003", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Carbon sources and sinks", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is best described as a carbon sink?", "options": ["Deforestation in the Amazon", "Cattle producing methane", "A coal-fired power station", "The ocean absorbing dissolved carbon dioxide"], "answer": 3, "explanation_en": "Carbon sinks, such as oceans, forests, and soil, absorb and store carbon, while sources like coal burning, deforestation, and ruminant animals release carbon.", "source": "Yearly Study Guide 2026 · Geography Section I", "id": "geo-004", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Sea level rise", "difficulty": "medium", "type": "mcq", "stem": "Global sea level is rising mainly because of:", "options": ["Thermal expansion of warming seawater and melting of land-based ice", "More rain falling into the oceans", "The ocean becoming saltier", "Volcanic eruptions under the sea"], "answer": 0, "explanation_en": "There are two main mechanisms: thermal expansion of seawater (accounting for about half of the contribution) and the melting of land-based ice (glaciers, Greenland, Antarctica) flowing into the oceans; note that 'sea ice melting' does not raise sea levels as it already floats on water.", "source": "Yearly Study Guide 2026 · Geography Section II(sea level rise)", "id": "geo-005", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Ocean acidification", "difficulty": "medium", "type": "mcq", "stem": "Ocean acidification occurs because:", "options": ["Coral reefs release acid", "Carbon dioxide dissolves in seawater forming carbonic acid, lowering pH", "Salt concentration increases", "Acid rain falls directly into the sea"], "answer": 1, "explanation_en": "The reaction CO₂ + H₂O → H₂CO₃ (carbonic acid) releases H⁺, decreasing pH; since the Industrial Revolution, the pH of surface seawater has decreased by about 0.1 (an increase in acidity of around 30%).", "source": "Yearly Study Guide 2026 · Geography Section II(ocean acidification)", "id": "geo-006", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Coral bleaching", "difficulty": "medium", "type": "mcq", "stem": "Coral bleaching is caused by:", "options": ["Too much oxygen in the water", "An increase in coral predators only", "Loss of the symbiotic algae (zooxanthellae) due to heat stress, exposing the white skeleton", "Corals being covered by sand"], "answer": 2, "explanation_en": "When water temperatures remain high, corals expel their symbiotic algae (zooxanthellae), losing their colour and primary source of energy, revealing their white skeletons; if high temperatures persist for too long, corals will die.", "source": "Yearly Study Guide 2026 · Geography Section II(ocean temperature and coral bleaching)", "id": "geo-007", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Synoptic charts · Front symbols", "difficulty": "easy", "type": "mcq", "stem": "On a synoptic chart, a line with triangles pointing in the direction of movement represents:", "options": ["An isobar", "A high pressure centre", "A warm front", "A cold front"], "answer": 3, "explanation_en": "Cold fronts are represented by a triangle symbol (▲) and warm fronts by a semicircle symbol (◗), with the direction of the triangle or semicircle indicating the direction of the front's movement; isobars are shown as fine solid lines.", "source": "Yearly Study Guide 2026 · Geography Section I(synoptic charts)", "id": "geo-008", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Synoptic chart excerpt: a front drawn as a line with triangles and an arrow showing its direction of movement\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0 0.0,340.0 0.0,0.0\" fill=\"var(--surface)\" fill-opacity=\".65\" stroke=\"none\"/><polyline points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0, me as climate: a single cold snap cannot overturn a 30-year warming trend.", "source": "Yearly Study Guide 2026 · Geography Section I(critical thinking · FLICC)", "id": "geo-010", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · FLICC · Fake experts", "difficulty": "medium", "type": "mcq", "stem": "A blog cites 'a retired physicist' with no climate science background as proof that CO₂ does not trap heat. Which FLICC technique is this?", "options": ["Cherry picking", "Conspiracy theory", "Fake experts", "Impossible expectations"], "answer": 2, "explanation_en": "Fake experts are used to create the illusion of 'expert controversy' by using people without relevant field credentials; judge them based on their research field and peer review record, not just their title.", "source": "Yearly Study Guide 2026 · Geography Section I(FLICC)", "id": "geo-011", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Feedback · Albedo", "difficulty": "hard", "type": "mcq", "stem": "As sea ice melts, the darker ocean surface absorbs more sunlight, which causes further warming. This is an example of:", "options": ["Ocean acidification", "The greenhouse effect", "A negative feedback loop", "A positive feedback loop (albedo effect)"], "answer": 3, "explanation_en": "High albedo ice reflects sunlight, but when it melts, the exposed dark sea surface absorbs more heat, leading to further warming and ice melting, which is a positive feedback loop.", "source": "Yearly Study Guide 2026 · Geography Section I(critical thinking / climate system)", "id": "geo-012", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Reading graphs", "difficulty": "medium", "type": "mcq", "stem": "A graph shows CO₂ concentration and global average temperature rising together over 150 years. The most defensible conclusion is:", "options": ["Ther increases coastal erosion risk in eastern Australia?", "options": ["Lower sea level and weaker storms", "Higher sea level, larger storm surges and more intense East Coast Lows", "Less coastal development", "Colder ocean temperatures"], "answer": 1, "explanation_en": "Sea level rise allows the same storm surge to act on a higher base, and the combined effects of storm surge, East Coast Lows, and increased exposure due to coastal development amplify the risk.", "source": "Yearly Study Guide 2026 · Geography(climate change and impacts on coastal environments)", "id": "geo-014", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Greenhouse effect (short answer)", "difficulty": "medium", "type": "short", "stem": "Explain, step by step, how the greenhouse effect keeps Earth warmer than it would otherwise be.", "answer": "Short-wave radiation from the Sun passes through the atmosphere and is absorbed by the Earth's surface, warming it. The surface re-emits this energy as longer-wave infrared radiation. Greenhouse gases (CO₂, methane, water vapour) absorb this infrared radiation and re-radiate it in all directions, including back towards the surface. This trapped energy raises the average surface temperature. Without this effect the Earth's average temperature would be about −18°C instead of about 15°C.", "explanation_en": "The four steps that earn marks are: short-wave entry; surface absorption and long-wave emission; greenhouse gas absorption and re-radiation; and the resulting warming. Getting the order wrong, or leaving out 're-radiation back to the surface', loses marks.", "source": "Yearly Study Guide 2026 · Geography Section II(greenhouse effect)", "points": [{"id": "c1", "t": "States that short-wave solar radiation passes through the atmosphere and is absorbed by the Earth's surface", "m": 1}, {"id": "c2", "t": "States that the warmed surface re-emits the energy as longer-wave infrared radiation", "m": 1}, {"id": "c3", "t": "Explains that greenhouse gases absorb the outgoing infrared radiation and re-radiate it in all directions, including back towards the surface", "m": 1}, {"id": "c4", "t": "Concludes that the trapped energy raises the average surface temperature, so Earth is warmer than it would be without the atmosphere", "m": 1}], "id": "geo-015", "options": [], "marks": 4, "criteria": [{"id": "c1", "t": "States that short-wave solar radiation passes through the atmosphere and is absorbed by the Earth's surface", "m": 1}, {"id": "c2", "t": "States that the warmed surface re-emits the energy as longer-wave infrared radiation", "m": 1}, {"id": "c3", "t": "Explains that greenhouse gases absorb the outgoing infrared radiation and re-radiate it in all directions, including back towards the surface", "m": 1}, {"id": "c4", "t": "Concludes that the trapped energy raises the average surface temperature, so Earth is warmer than it would be without the atmosphere", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Natural vs enhanced (short answer)", "difficulty": "medium", "type": "short", "stem": "Distinguish between the natural greenhouse effect and the enhanced greenhouse effect.", "answer": "The natural greenhouse effect is a process that has always operated: naturally occurring greenhouse gases trap some outgoing infrared radiation and keep the average surface temperature at about 15°C, which makes life possible. The enhanced greenhouse effect is the additional warming caused by human activities that increase greenhouse gas concentrations — burning fossil fuels (CO₂), agriculture and livestock (methane), and deforestation. The mechanism is identical; what differs is the extra quantity of greenhouse gases and therefore the extra trapped energy.", "explanation_en": "The key is that the mechanism is the same but the quantities differ. Writing only that 'one is natural and the other is human-caused' will not earn full marks; you have to point out that the extra greenhouse gases retain more energy.", "source": "Yearly Study Guide 2026 · Geography Section II", "points": [{"id": "c1", "t": "Defines the natural greenhouse effect as naturally occurring greenhouse gases trapping outgoing infrared and keeping the average surface temperature near 15°C", "m": 1}, {"id": "c2", "t": "Identifies the enhanced greenhouse effect as the extra warming from human activities that raise greenhouse gas concentrations (fossil fuels, agriculture and livestock, deforestation)", "m": 1}, {"id": "c3", "t": "Explains that the mechanism is identical and the difference is the greater quantity of greenhouse gases, and therefore the extra trapped energy", "m": 1}], "id": "geo-016", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "Defines the natural greenhouse effect as naturally occurring greenhouse gases trapping outgoing infrared and keeping the average surface temperature near 15°C", "m": 1}, {"id": "c2", "t": "Identifies the enhanced greenhouse effect as the extra warming from human activities that raise greenhouse gas concentrations (fossil fuels, agriculture and livestock, deforestation)", "m": 1}, {"id": "c3", "t": "Explains that the mechanism is identical and the difference is the greater quantity of greenhouse gases, and therefore the extra trapped energy", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Sea level rise (short answer)", "difficulty": "hard", "type": "short", "stem": "Explain the two main mechanisms of sea level rise and describe two impacts on the Australian coast.", "answer": "First, thermal expansion: as seawater warms it expands and takes up more volume. Second, melting of land-based ice (glaciers, Greenland, Antarctica) adds water to the ocean. (Melting sea ice does not raise sea level because it already displaces its own weight.) Impacts: increased coastal erosion and shoreline retreat during storms; inundation of low-lying areas and infrastructure; saltwater intrusion into estuaries and coastal groundwater; loss of beaches and wetlands; greater damage from storm surges.", "explanation_en": "The mechanisms must include two items (thermal expansion and land ice), and note that sea ice is not included; the impacts must be specifically related to the consequences for the Australian coast (erosion, inundation, saltwater, and wetland loss).", "source": "Yearly Study Guide 2026 · Geography Section II(sea level rise)", "points": [{"id": "c1", "t": "Explains thermal expansion: warming seawater expands and takes up more volume", "m": 1}, {"id": "c2", "t": "Explains that melting land-based ice (glaciers, Greenland, Antarctica) adds water to the ocean", "m": 1}, {"id": "c3", "t": "Describes one valid coastal impact, such as erosion and shoreline retreat, inundation of low-lying land and infrastructure, or greater storm-surge damage", "m": 1}, {"id": "c4", "t": "Describes a second, different coastal impact, such as saltwater intrusion into estuaries and groundwater, or loss of beaches and wetlands", "m": 1}], "id": "geo-017", "options": [], "marks": 4, "criteria": [{"id": "c1", "t": "Explains thermal expansion: warming seawater expands and takes up more volume", "m": 1}, {"id": "c2", "t": "Explains that melting land-based ice (glaciers, Greenland, Antarctica) adds water to the ocean", "m": 1}, {"id": "c3", "t": "Describes one valid coastal impact, such as erosion and shoreline retreat, inundation of low-lying land and infrastructure, or greater storm-surge damage", "m": 1}, {"id": "c4", "t": "Describes a second, different coastal impact, such as saltwater intrusion into estuaries and groundwater, or loss of beaches and wetlands", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Ocean acidification (short answer)", "difficulty": "hard", "type": "short", "stem": "Explain how ocean acidification occurs and why it threatens marine life.", "answer": "The ocean absorbs about a quarter of human CO₂ emissions. Dissolved CO₂ reacts with water to form carbonic acid (CO₂ + H₂O → H₂CO₃), which releases hydrogen ions and lowers the pH of seawater (ocean acidification). The extra hydrogen ions combine with carbonate ions, reducing the carbonate available to organisms. Corals, shellfish and plankton need carbonate to build calcium carbonate shells and skeletons, so their growth slows and shells can dissolve, weakening reef structures and food webs.", "explanation_en": "The three steps are: absorption of CO₂, formation of carbonic acid and decrease in pH, and reduction of carbonate ions and inhibition of calcification; the final step must be related to the biological consequences (coral, shellfish, and plankton).", "source": "Yearly Study Guide 2026 · Geography Section II(ocean acidification)", "points": [{"id": "c1", "t": "Explains that the ocean absorbs human CO₂, which forms carbonic acid and releases hydrogen ions that lower the pH of seawater", "m": 1}, {"id": "c2", "t": "Explains that the extra hydrogen ions combine with carbonate ions, so less carbonate is available to organisms", "m": 1}, {"id": "c3", "t": "Explains that corals, shellfish and plankton need carbonate to build calcium carbonate shells and skeletons, so growth slows and shells can dissolve", "m": 1}, {"id": "c4", "t": "Explains the consequence for marine life: reef structures and food webs are weakened", "m": 1}], "id": "geo-018", "options": [], "marks": 4, "criteria": [{"id": "c1", "t": "Explains that the ocean absorbs human CO₂, which forms carbonic acid and releases hydrogen ions that lower the pH of seawater", "m": 1}, {"id": "c2", "t": "Explains that the extra hydrogen ions combine with carbonate ions, so less carbonate is available to organisms", "m": 1}, {"id": "c3", "t": "Explains that corals, shellfish and plankton need carbonate to build calcium carbonate shells and skeletons, so growth slows and shells can dissolve", "m": 1}, {"id": "c4", "t": "Explains the consequence for marine life: reef structures and food webs are weakened", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Coral bleaching (short answer)", "difficulty": "hard", "type": "short", "stem": "Describe the process of coral bleaching and explain the conditions under which a reef can recover.", "answer": "Corals live in symbiosis with zooxanthellae, algae that live in their tissue, give them their colour and supply most of their energy through photosynthesis. When water temperatures rise well above the summer average (or the coral is stressed by pollution or extreme low tides), the coral expels the zooxanthellae. The coral tissue becomes transparent, showing the white calcium carbonate skeleton — bleaching. If the stress is short and temperatures return to normal, the coral can take up algae again and recover over weeks to months. If the heat stress persists, the coral starves and dies, and recovery can take a decade or more.", "explanation_en": "You have to explain the link that 'the symbiotic algae supply energy and colour', otherwise you cannot explain why the coral dies. The recovery conditions are relief from heat stress in time and good water quality.", "source": "Yearly Study Guide 2026 · Geography Section II(ocean temperature and coral bleaching)", "points": [{"id": "c1", "t": "Explains that corals live in symbiosis with zooxanthellae, which give them their colour and supply most of their energy", "m": 1}, {"id": "c2", "t": "Explains that heat stress causes the coral to expel the zooxanthellae, so the tissue becomes transparent and the white skeleton shows", "m": 1}, {"id": "c3", "t": "States that recovery requires the stress to end quickly and the water quality to be suitable", "m": 1}, {"id": "c4", "t": "States that prolonged stress means the coral starves and dies, with recovery then taking a decade or more", "m": 1}], "id": "geo-019", "options": [], "marks": 4, "criteria": [{"id": "c1", "t": "Explains that corals live in symbiosis with zooxanthellae, which give them their colour and supply most of their energy", "m": 1}, {"id": "c2", "t": "Explains that heat stress causes the coral to expel the zooxanthellae, so the tissue becomes transparent and the white skeleton shows", "m": 1}, {"id": "c3", "t": "States that recovery requires the stress to end quickly and the water quality to be suitable", "m": 1}, {"id": "c4", "t": "States that prolonged stress means the coral starves and dies, with recovery then taking a decade or more", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Synoptic chart reading (short answer)", "difficulty": "hard", "type": "short", "stem": "A synoptic chart shows a cold front approaching the NSW coast from the west, with a low pressure centre to the south and a high pressure system over the Tasman Sea. Predict the weather change over the next 24 hours and explain your reasoning.", "answer": "Before the front arrives: warm, moist north-westerly winds ahead of the front, rising temperature and humidity, increasing cloud. As the cold front crosses: a narrow band of heavy rain, thunderstorms, a sharp temperature drop and a wind shift from north-west to south-west, with a rapid rise in pressure afterwards. After the front passes: cooler, drier air, clearing skies and settled weather as the high moves in, with cold nights.", "explanation_en": "The trick is to read the chart in three stages: ahead of the front (warm and humid, pressure falling) → the crossing (heavy rain, cooling, a sudden change in wind direction) → behind the front (dry and cold, clearing, pressure rising). Every point you make must match an element of the chart.", "source": "Yearly Study Guide 2026 · Geography Section II(synoptic charts)", "points": [{"id": "c1", "t": "Predicts that ahead of the front it is warm and humid with increasing cloud and falling pressure, driven by moist north-westerly winds", "m": 1}, {"id": "c2", "t": "Predicts that as the cold front crosses there is a narrow band of heavy rain and thunderstorms, a sharp temperature drop and a wind shift, followed by a rapid rise in pressure", "m": 1}, {"id": "c3", "t": "Predicts that behind the front it becomes cooler and drier with clearing skies and settled weather as the high moves in", "m": 1}], "id": "geo-020", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "Predicts that ahead of the front it is warm and humid with increasing cloud and falling pressure, driven by moist north-westerly winds", "m": 1}, {"id": "c2", "t": "Predicts that as the cold front crosses there is a narrow band of heavy rain and thunderstorms, a sharp temperature drop and a wind shift, followed by a rapid rise in pressure", "m": 1}, {"id": "c3", "t": "Predicts that behind the front it becomes cooler and drier with clearing skies and settled weather as the high moves in", "m": 1}], "auto_grade": true, "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Synoptic chart: a cold front approaching the NSW coast from the west, a low to the south and a high over the Tasman Sea\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0 0.0,340.0 0.0,0.0\" fill=\"var(--surface)\" fill-opacity=\".65\" stroke=\"none\"/><polyline points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0\" fill=\"none\" stroke=\"var(--border-strong)\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"349.2,276.0 349.3,276.9 349.2,277.9 349.1,278.8 348.8,279.8 348.3,280.7 347.7,281.6 346.9,282.5 345.9,283.3 344.8,284.0 343.6,284.6 342.2,285.1 340.8,285.5 339.3,285.8 337.8,285.9 336.3, =\"700\"text-anchor=\"middle\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">H</text><text x=\"508.0\" y=\"330.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"text-anchor=\"end\"letter-spacing=\"1.6\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">TASMAN SEA</text><text x=\"22.0\" y=\"316.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">NSW coast</text></svg>", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Rebutting FLICC (short answer)", "difficulty": "hard", "type": "short", "stem": "Someone posts: 'Climate has always changed, so this is natural. Scientists are only saying this to get more funding.' Identify the two FLICC techniques used and write a short, accurate rebuttal.", "answer": "The two techniques are: (1) cherry-picking/oversimplification — 'climate has always changed' ignores the rate and the different driver (natural cycles such as orbital change operated over tens of thousands of years, whereas current warming tracks the added greenhouse gases and is far faster), and (2) conspiracy theory — claiming scientists are motivated by funding rather than evidence. Rebuttal: natural factors alone cannot reproduce the observed warming of the last century, particularly the pattern of stratospheric cooling alongside tropospheric warming, which is the fingerprint of greenhouse gases. Scientific claims should be assessed on evidence and mechanism, not on assumed motives; the funding accusation is not evidence.", "explanation_en": "Marks come from two things: correctly identifying the two techniques, and giving evidence-based rebuttals. Simply criticising people without evidence scores nothing.", "source": "Yearly Study Guide 2026 · Geography Section I(critical thinking · FLICC)", "points": [{"id": "c1", "t": "Identifies cherry-picking (or oversimplification) in the claim that climate has always changed", "m": 1}, {"id": "c2", "t": "Identifies conspiracy theory in the claim that scientists are only saying this to get more funding", "m": 1}, {"id": "c3", "t": "Gives an evidence-based rebuttal, e.g. natural factors alone cannot reproduce the observed warming and the stratospheric cooling with tropospheric warming is the greenhouse gas fingerprint", "m": 1}], "id": "geo-021", "options": [], "marks": 3, "criteria": [{"id": "c1", "t": "Identifies cherry-picking (or oversimplification) in the claim that climate has always changed", "m": 1}, {"id": "c2", "t": "Identifies conspiracy theory in the claim that scientists are only saying this to get more funding", "m": 1}, {"id": "c3", "t": "Gives an evidence-based rebuttal, e.g. natural factors alone cannot reproduce the observed warming and the stratospheric cooling with tropospheric warming is the greenhouse gas fingerprint", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"topic": "Climate · Mitigation vs adaptation (short answer)", "difficulty": "medium", "type": "short", "stem": "Define mitigation and adaptation in relation to climate change and give one Australian example of each.", "answer": "Mitigation reduces the causes of climate change by cutting greenhouse gas emissions or increasing carbon sinks — for example building large-scale solar and wind generation and retiring coal-fired power, or protecting and restoring coastal wetlands as a carbon sink. Adaptation reduces vulnerability to the effects that can no longer be avoided — for example building sea walls and dune restoration programs at Collaroy-Narrabeen, or planning retreat zones and raising building floor levels.", "explanation_en": "Mitigation reduces the cause of the problem — cutting emissions or increasing absorption — while adaptation reduces the impact, through protection or avoidance. Examples should be Australian ones, ideally from the coast.", "source": "Yearly Study Guide 2026 · Geography(climate change responses)", "points": [{"id": "c1", "t": "Defines mitigation as reducing the causes of climate change by cutting emissions or increasing carbon sinks", "m": 1}, {"id": "c2", "t": "Defines adaptation as reducing vulnerability to the effects of climate change that cannot be avoided", "m": 1}, {"id": "c3", "t": "Gives one valid Australian example of mitigation, such as large-scale solar and wind generation or protecting and restoring coastal wetlands as a carbon sink", "m": 1}, {"id": "c4", "t": "Gives one valid Australian example of adaptation, such as sea walls and dune restoration at Collaroy-Narrabeen or planning retreat zones", "m": 1}], "id": "geo-022", "options": [], "marks": 4, "criteria": [{"id": "c1", "t": "Defines mitigation as reducing the causes of climate change by cutting emissions or increasing carbon sinks", "m": 1}, {"id": "c2", "t": "Defines adaptation as reducing vulnerability to the effects of climate change that cannot be avoided", "m": 1}, {"id": "c3", "t": "Gives one valid Australian example of mitigation, such as large-scale solar and wind generation or protecting and restoring coastal wetlands as a carbon sink", "m": 1}, {"id": "c4", "t": "Gives one valid Australian example of adaptation, such as sea walls and dune restoration at Collaroy-Narrabeen or planning retreat zones", "m": 1}], "auto_grade": true, "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geo-023", "topic": "Environmental change · Rate and scale", "difficulty": "easy", "type": "mcq", "stem": "Stimulus: A beach can lose a large volume of sand during a single East Coast Low, while a dune system may migrate inland over thousands of years. What does this comparison illustrate?", "options": ["That erosion is permanent and that deposition never occurs anywhere", "That coastal change is caused only by human activity", "That environmental change operates at different rates and scales", "That all coastal change is gradual rather than sudden"], "answer": 2, "explanation_en": "The core concept is that environmental change has both time and spatial scales: a single storm can reshape a beach in hours, while dune migration takes thousands of years. That is why 'change' has to be described in terms of rate and scale.", "source": "Term 3 · Lesson 1.1 Environmental Change(rate and scale of change)", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geo-024", "topic": "East Coast Lows · Chart reading", "difficulty": "medium", "type": "mcq", "stem": "Stimulus: A synoptic chart shows tightly packed isobars and a closed low-pressure centre just off the NSW coast, with a cold front crossing the coast. What does this chart indicate, and why does it matter for Collaroy–Narrabeen?", "options": ["A stationary front producing no wind and no coastal impact", "A high-pressure ridge, bringing calm seas and steady offshore winds", "A tropical cyclone tracking inland across the ranges from the west", "An East Coast Low, bringing heavy rain and large erosion-driven waves"], "answer": 3, "explanation_en": "Dense isobars mean a large pressure gradient, which equals strong winds; a closed low-pressure system with a cold front brings heavy rain, strong winds, and large waves to the east coast, which was the weather context for the severe erosion of the beach in 2016.", "source": "Term 3 · Lesson 2.2 Understanding East Coast Lows(synoptic map)", "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Synoptic chart: tightly packed isobars around a low off the NSW coast with a cold front crossing the coast\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0 0. ke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">TASMAN SEA</text><text x=\"22.0\" y=\"316.0\"fill=\"var(--muted)\" font-size=\"10\"font-family=\"var(--font-sans,sans-serif)\"paint-order=\"stroke\" stroke=\"var(--surface-secondary)\" stroke-width=\"3\" stroke-linejoin=\"round\">NSW coast</text></svg>", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geo-025", "topic": "Management · Prevent / mitigate / prepare", "difficulty": "easy", "type": "mcq", "stem": "Which set correctly matches the three management categories taught in Lessons 3.1–3.2?", "options": ["Prevention — stopping change; mitigation — reducing impact; preparedness — planning response", "Prevention — reducing impact; mitigation — planning response; preparedness — stopping change", "All three categories describe the same action taken at different scales", "Prevention — planning response; mitigation — stopping change; preparedness — reducing impact"], "answer": 0, "explanation_en": "Prevention stops the problem from arising, mitigation reduces the impact of change, and preparedness plans the response to an event. The category a strategy belongs to decides the standard it is evaluated against, so do not mix them up.", "source": "Term 3 · Lessons 3.1–3.2 Sustainable Management of Coastal Ecosystems", "weak": false, "subj": "geo", "subjZh": "Year 10 Geography — Coastal Ecosystems Exam"}, {"id": "geo-026", "topic": "East Coast Lows · 2016 event mechanics", "difficulty": "hard", "type": "short", "stem": "Stimulus: A synoptic chart shows tightly packed isobars and a closed low off the NSW coast with a cold front crossing the coast. Explain why this system produced such destructive conditions at Collaroy–Narrabeen in 2016. (3 marks)", "options": [], "answer": "Tightly packed isobars mean a steep pressure gradient and therefore strong winds, which generate large waves and a storm surge that raises water levels at the shore. The cold front adds intense rainfall and runoff, so the combination of higher water and bigger waves produced a major storm cut and foredune erosion.", "explanation_en": "The chain of mechanism is: dense isobars → strong winds → large waves and storm surge; cold front → heavy rain. When these coincide with high tide, the erosion is destructive. Saying only 'the wind was strong' will not earn full marks.", "source": "Term 3 · Lesson 2.2 Understanding East Coast Lows", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that tightly packed isobars mean a steep pressure gradient and therefore strong winds", "m": 1}, {"id": "c2", "t": "Explains that the strong winds generate large waves and a storm surge that raise water levels at the shore", "m": 1}, {"id": "c3", "t": "Explains that the cold front adds intense rainfall and runoff, so the combination of higher water and bigger waves produced a major storm cut and foredune erosion", "m": 1}], "auto_grade": true, "fig": "<svg class=\"fig\" viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Synoptic chart: tightly packed isobars around a low off the NSW coast with a cold front crossing the coast\" preserveAspectRatio=\"xMidYMid meet\"><polygon points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0 0.0,340.0 0.0,0.0\" fill=\"var(--surface)\" fill-opacity=\".65\" stroke=\"none\"/><polyline points=\"302.0,0.0 292.0,58.0 276.0,118.0 272.0,168.0 283.0,222.0 301.0,278.0 318.0,322.0 325.0,340.0\" fill=\"none\" stroke=\"var(--border-strong)\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"388.1,118.0 388.3,119.0 388.4,120.1 388.4,121.2 388.2,122.2 387.8,123.3 387.2,124.3 386.4,125.3 385.5,126.1 384.4,126.9 383.1,127.5 381.8,128.1 380.4,128.5 379.0,128.8 377.5,128.9 376.1,129.0 374.7,129.0 373.3,128.9 372.0,128.8 370.7,128.6 369.4,128.4 368.2,128.2 367.0,127.9 365.8,127.6 364.6,127.3 363.4,126.9 362.2,126.4 361.1,125.9 360.0,125.3 359.0,124.6 358.0,123.8 357.2,123.0 356.5,122.1 3
