    return {light:"Light",dark:"Dark",system:"Auto"};
  }
  var LABEL=labels();
  function paint(box){
    var m=mode();
    if(box.getAttribute("data-theme-ctl")==="cycle"){
      var en=LABEL.light==="Light";
      box.innerHTML='<button class="themebtn" data-cycle="1" title="'+(en?"Theme: ":"外观：")+LABEL[m]+
        (en?" (click to cycle Light / Dark / Auto)":"（点击切换 浅色 / 深色 / 自动）")+'">'+
        (en?"Theme ":"外观 ")+'<b>'+LABEL[m]+'</b></button>';
    }else{
      box.innerHTML=['light','dark','system'].map(function(k){
        return '<button data-mode="'+k+'" class="'+(k===m?"on":"")+'">'+LABEL[k]+'</button>';
      }).join("");
    }
  }
  function apply(m){
    var r=document.documentElement;
    if(m==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",m);
    r.setAttribute("data-theme-mode",m);
    document.querySelectorAll("[data-theme-ctl]").forEach(paint);
  }
  function set(m){
    try{localStorage.setItem(KEY,m);}catch(e){}
    apply(m);
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest("[data-mode],[data-cycle]") : null;
    if(!b) return;
    if(b.hasAttribute("data-cycle")){
      var order=["system","light","dark"], cur=mode();
      set(order[(order.indexOf(cur)+1)%3]);
    }else{ set(b.getAttribute("data-mode")); }
    ev.preventDefault();
  });
  try{
    var mq=window.matchMedia("(prefers-color-scheme: dark)");
    var onSys=function(){ if(mode()==="system") apply("system"); };
    if(mq.addEventListener) mq.addEventListener("change",onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }catch(e){}
  window.DSH_THEME={set:set,mode:mode};

  /* ── 语言开关：2026-11-12 全站英文，控件已下线（保留空函数防旧引用报错）── */
  (function(){
    var box=document.querySelector("[data-lang-ctl]");
    if(box) box.remove();
  })();
  document.querySelectorAll("[data-theme-ctl]").forEach(paint);
})();
</script>
<script>
const DATA = {"slug": "all", "title": "综合卷 · 全科", "examMin": 120, "subjects": {"sci": {"zh": "Year 10 Science", "n": 48, "title": "Year 10 Science"}, "sciother": {"zh": "Science · Non-exam content (Terms 1–3)", "n": 33, "title": "Science · Non-exam content (Terms 1–3)"}, "matp": {"zh": "Year 10 Mathematics (Standard)", "n": 49, "title": "Year 10 Mathematics (Standard)"}, "maths53": {"zh": "Stage 5 - 5.3 Mathematics (Year 10)", "n": 43, "title": "Stage 5 - 5.3 Mathematics (Year 10)"}, "eng": {"zh": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)", "n": 36, "title": "Year 10 English 2026 — Yearly Exam (King Lear + Comparative Essay)"}, "his": {"zh": "Year 10 History — Yearly Exam", "n": 28, "title": "Year 10 History — Yearly Exam"}, "hisother": {"zh": "History · Non-exam content (Terms 1–3)", "n": 15, "title": "History · Non-exam content (Terms 1–3)"}, "geo": {"zh": "Year 10 Geography — Coastal Ecosystems Exam", "n": 28, "title": "Year 10 Geography — Coastal Ecosystems Exam"}, "geoother": {"zh": "Geography · Non-exam content (Terms 1–2, 4)", "n": 14, "title": "Geography · Non-exam content (Terms 1–2, 4)"}, "pdh": {"zh": "Year 10 PDHPE", "n": 30, "title": "Year 10 PDHPE"}, "out": {"zh": "Year 10 Outdoor Education", "n": 15, "title": "Year 10 Outdoor Education"}, "ftn": {"zh": "Year 10 Food Technology", "n": 25, "title": "Year 10 Food Technology"}, "car": {"zh": "Year 10 Careers", "n": 20, "title": "Year 10 Careers"}, "sport": {"zh": "Sport — Wednesday Sport & Representative Sport", "n": 15, "title": "Sport — Wednesday Sport & Representative Sport"}, "cw": {"zh": "Counsellor and Wellbeing", "n": 15, "title": "Counsellor and Wellbeing"}, "engother": {"zh": "English · Non-exam content (Terms 1–3)", "n": 14, "title": "English · Non-exam content (Terms 1–3)"}}, "questions": [{"id": "sci-001", "topic": "Evolution · Darwin's evidence", "difficulty": "easy", "type": "mcq", "stem": "Darwin collected 13 species of finch on the Galapagos Islands. Which feature differed most clearly between the specimens?", "options": ["Beak size and shape", "Number of legs on each bird", "Wing length and shape", "Body colour and pattern"], "explanation_en": "There are 13 species of finch with similar body size and plumage but different beak sizes and shapes, each matched to a different food source on a different island — the classic evidence for natural selection.", "source": "Year 10 - Evolution.pptx(Galapagos finches)", "answer": 0, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-002", "topic": "Evolution · Lamarck vs Darwin", "difficulty": "easy", "type": "mcq", "stem": "How did Lamarck explain the long necks of giraffes?", "options": ["Giraffes with longer necks obtained food more easily, survived and passed the trait on to their offspring.", "Giraffes stretched their necks to reach high leaves and passed the longer necks on to their offspring.", "Long necks appeared suddenly because of a mutation in a single generation.", "Giraffe necks grew longer because the climate changed."], "explanation_en": "Lamarck advocated for 'use and disuse + inheritance of acquired traits': stretching one's neck and passing the change on to offspring, whereas 'Giraffes with longer necks obtained food more easily, survived and passed the trait on to their offspring' is Darwin's explanation of natural selection.", "source": "Term 4 - Evolution - Week 2(Lamarckian Theory vs Darwinian Theory)", "answer": 1, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-003", "topic": "Evolution · Selection pressure", "difficulty": "hard", "type": "mcq", "stem": "In parts of Australia where cane toads live, the average head size of red-bellied black snakes has become smaller. Which explanation is consistent with natural selection?", "options": ["The toads release a chemical that directly shrinks the heads of the snakes they meet.", "Snakes that ate toads pulled their heads smaller during their lifetime and passed the smaller heads on to their offspring.", "Snakes with larger heads could swallow the bigger, more toxic toads and died, so smaller-headed snakes survived and reproduced.", "Head size is not heritable, so this change cannot be evolution by natural selection."], "explanation_en": "The toad is a selective pressure: snakes with larger heads that swallow larger toads and ingest more toxins die (are eliminated), while individuals with smaller heads or that don't eat toads survive and reproduce, but 'Snakes that ate toads pulled their heads smaller during their lifetime and passed the smaller heads on to their offspring' is a incorrect Lamarckian statement.", "source": "Term 4 - Evolution - Week 3 Answers(Cane toads / red-bellied black snake)", "answer": 2, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-004", "topic": "Evolution · Defining selection pressure", "difficulty": "easy", "type": "short", "stem": "Define the term 'selection pressure' and give two examples of selection pressures. (2 marks)", "options": [], "answer": "• A selection pressure is an external agent that affects an organism's ability to survive and reproduce in a given environment.\n• Examples: predators, climate and temperature, food and water supply, disease, or competition for mates and resources.", "explanation_en": "A selective pressure is an external factor that affects an organism's ability to survive and reproduce in a particular environment — predators, climate, food and water, disease, or competition.", "source": "Year10_Evolution_Worksheet_Student(1).docx(Part A · Selection pressures / B1)", "marks": 2, "criteria": [{"id": "c1", "t": "Defines a selection pressure as an external agent or environmental factor that affects an organism's ability to survive and reproduce in a given environment", "m": 1}, {"id": "c2", "t": "Gives two valid examples of selection pressures, e.g. predators, climate and temperature, food or water supply, disease, competition for mates or resources (any two)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines a selection pressure as an external agent or environmental factor that affects an organism's ability to survive and reproduce in a given environment", "m": 1}, {"id": "c2", "t": "Gives two valid examples of selection pressures, e.g. predators, climate and temperature, food or water supply, disease, competition for mates or resources (any two)", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-005", "topic": "Evolution · Steps of natural selection", "difficulty": "medium", "type": "short", "stem": "The steps of natural selection are listed out of order: reproduction and inheritance; increased prevalence in the gene pool; survival of the fittest; variation in a population; selection pressure. Number them 1–5 in the correct order and write one sentence explaining step 3. (5 marks)", "options": [], "answer": "• 1 Variation in a population — individuals differ in their inherited traits.\n• 2 Selection pressure — an external agent such as a predator or a change in climate acts on the population.\n• 3 Survival of the fittest — individuals whose traits suit the environment are more likely to survive.\n• 4 Reproduction and inheritance — survivors breed and pass the helpful alleles on to their offspring.\n• 5 Increased prevalence in the gene pool — over many generations the helpful trait becomes more common in the population.", "explanation_en": "The order is: variation → selective pressure → survival of the fittest → reproduction and inheritance → increase in the gene pool, where the third step means 'individuals with traits more suited to the environment are more likely to survive'.", "source": "Year10_Evolution_Worksheet_Student(1).docx(Part B2)", "marks": 5, "criteria": [{"id": "c1", "t": "Places 'variation in a population' as step 1", "m": 1}, {"id": "c2", "t": "Places 'selection pressure' as step 2", "m": 1}, {"id": "c3", "t": "Places 'survival of the fittest' as step 3", "m": 1}, {"id": "c4", "t": "Places 'reproduction and inheritance' as step 4 and 'increased prevalence in the gene pool' as step 5", "m": 1}, {"id": "c5", "t": "Explains step 3: individuals whose inherited traits suit the environment are more likely to survive (and so reproduce)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Places 'variation in a population' as step 1", "m": 1}, {"id": "c2", "t": "Places 'selection pressure' as step 2", "m": 1}, {"id": "c3", "t": "Places 'survival of the fittest' as step 3", "m": 1}, {"id": "c4", "t": "Places 'reproduction and inheritance' as step 4 and 'increased prevalence in the gene pool' as step 5", "m": 1}, {"id": "c5", "t": "Explains step 3: individuals whose inherited traits suit the environment are more likely to survive (and so reproduce)", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-006", "topic": "Evolution · Sources of variation", "difficulty": "easy", "type": "short", "stem": "Where does the variation in a population originally come from? (1 mark)", "options": [], "answer": "• Mutations — random changes in the DNA (genes or chromosomes) that are inherited and create new alleles; sexual reproduction also shuffles existing alleles into new combinations.", "explanation_en": "The fundamental source of variation is genetic mutation (producing new alleles), and sexual reproduction recombines these alleles.", "source": "Year10_Evolution_Worksheet_Student(1).docx(Part B3)+ Year 10 - Evolution.pptx(Mutations)", "marks": 1, "criteria": [{"id": "c1", "t": "States that variation originally comes from mutation — random changes in DNA that produce new alleles (accept: sexual reproduction reshuffles existing alleles)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that variation originally comes from mutation — random changes in DNA that produce new alleles (accept: sexual reproduction reshuffles existing alleles)", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-007", "topic": "Evolution · Observations and inferences", "difficulty": "easy", "type": "short", "stem": "Darwin made a set of observations and used them to make inferences. Outline two of his observations and the inference he drew from them. (4 marks)", "options": [], "answer": "• Observation: individuals in a species vary, and much of that variation is heritable.\n• Observation: organisms produce far more offspring than can survive, while resources are limited.\n• Inference: there is a struggle for existence, and the individuals best suited to their environment survive and reproduce.\n• Over time populations adapt to their environment, and this can lead to new species.", "explanation_en": "Darwin's observations: individuals have heritable variations; the number of offspring exceeds the resources available, leading to the conclusion that there is a struggle for survival, and the most adapted individuals survive and reproduce, with the population gradually adapting to the environment or even forming new species.", "source": "Year 10 - Evolution.pptx(The Theory of Evolution)", "marks": 4, "criteria": [{"id": "c1", "t": "Outlines one observation: individuals in a species vary, and much of that variation is heritable", "m": 1}, {"id": "c2", "t": "Outlines a second observation: organisms produce far more offspring than can survive while resources are limited", "m": 1}, {"id": "c3", "t": "States the inference: there is a struggle for existence, and the individuals best suited to their environment survive and reproduce", "m": 1}, {"id": "c4", "t": "Adds that over time the population becomes adapted to its environment, which can lead to new species", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Outlines one observation: individuals in a species vary, and much of that variation is heritable", "m": 1}, {"id": "c2", "t": "Outlines a second observation: organisms produce far more offspring than can survive while resources are limited", "m": 1}, {"id": "c3", "t": "States the inference: there is a struggle for existence, and the individuals best suited to their environment survive and reproduce", "m": 1}, {"id": "c4", "t": "Adds that over time the population becomes adapted to its environment, which can lead to new species", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-008", "topic": "Evolution · Lamarck vs Darwin (compare)", "difficulty": "medium", "type": "short", "stem": "Explain how Lamarck's explanation of evolution differs from Darwin's. (3 marks)", "options": [], "answer": "• Lamarck proposed use and disuse plus the inheritance of acquired characteristics: an organism changes during its life by using a feature more, then passes that change to its offspring (e.g. a giraffe stretching its neck).\n• Darwin proposed natural selection: variation already exists in the population, and individuals with inherited traits suited to the environment survive and reproduce more, so those traits become more common.\n• Lamarck's mechanism has no role for genes, and acquired changes are not inherited.", "explanation_en": "Lamarck relied on 'use and disuse + inheritance of acquired traits', while Darwin relied on existing variations in the population + natural selection, with the key difference being that only heritable variations can be passed on to the next generation.", "source": "Term 4 - Evolution - Week 2(Lamarckian Theory vs Darwinian Theory)+ Year 10 - Evolution.pptx", "marks": 3, "criteria": [{"id": "c1", "t": "Outlines Lamarck's mechanism: use and disuse plus inheritance of acquired characteristics, so a change made during an organism's life is passed to its offspring (e.g. a giraffe stretching its neck)", "m": 1}, {"id": "c2", "t": "Outlines Darwin's mechanism: variation already exists, and individuals with inherited traits suited to the environment survive and reproduce more, so those traits become more common", "m": 1}, {"id": "c3", "t": "Identifies the key difference: Lamarck's mechanism has no role for genes and acquired changes are not inherited, so only heritable variation can be passed on", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Outlines Lamarck's mechanism: use and disuse plus inheritance of acquired characteristics, so a change made during an organism's life is passed to its offspring (e.g. a giraffe stretching its neck)", "m": 1}, {"id": "c2", "t": "Outlines Darwin's mechanism: variation already exists, and individuals with inherited traits suited to the environment survive and reproduce more, so those traits become more common", "m": 1}, {"id": "c3", "t": "Identifies the key difference: Lamarck's mechanism has no role for genes and acquired changes are not inherited, so only heritable variation can be passed on", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-009", "topic": "Evolution · Industrial melanism", "difficulty": "medium", "type": "short", "stem": "Explain, using natural selection, why the dark (melanic) form of the peppered moth became common in industrial towns in the 1800s. (4 marks)", "options": [], "answer": "• Soot pollution killed the lichens and blackened the tree trunks.\n• The pale peppered form then stood out against the dark bark and was eaten by birds, so it was selected against.\n• The dark melanic form was better camouflaged and survived to breed, passing its alleles to the next generation.\n• Over many generations the dark form became more common, i.e. the population evolved as the environment changed.", "explanation_en": "The soot darkened the tree trunks, so light-coloured moths lost their camouflage and were eaten by birds, while dark-coloured moths survived and reproduced, increasing their share of the population over generations — an example of natural selection changing direction as the environment changes.", "source": "Term 4 - Evolution - Week 2(Case Study: Peppered Moth)", "marks": 4, "criteria": [{"id": "c1", "t": "Describes the environmental change: soot pollution killed the lichens and blackened the tree trunks", "m": 1}, {"id": "c2", "t": "Explains that the pale form stood out against the dark bark and was eaten by birds, so it was selected against", "m": 1}, {"id": "c3", "t": "Explains that the dark (melanic) form was better camouflaged, survived to breed and passed its alleles to the next generation", "m": 1}, {"id": "c4", "t": "Concludes that over many generations the dark form became more common as the population evolved with the changed environment", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes the environmental change: soot pollution killed the lichens and blackened the tree trunks", "m": 1}, {"id": "c2", "t": "Explains that the pale form stood out against the dark bark and was eaten by birds, so it was selected against", "m": 1}, {"id": "c3", "t": "Explains that the dark (melanic) form was better camouflaged, survived to breed and passed its alleles to the next generation", "m": 1}, {"id": "c4", "t": "Concludes that over many generations the dark form became more common as the population evolved with the changed environment", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-010", "topic": "Evolution · Evidence from living species", "difficulty": "medium", "type": "short", "stem": "Name three types of evidence from living species that support the theory of evolution, and explain what one of them shows. (3 marks)", "options": [], "answer": "• Comparative anatomy (e.g. the same bone arrangement in the forelimbs of vertebrates — homologous structures).\n• Comparative embryology (closely related species have similar embryos at early stages).\n• Biochemical / DNA evidence (the closer the DNA base sequence of two species, the more closely related they are).\n• Vestigial structures (structures that once had a function but are now functionless) also indicate common ancestry.", "explanation_en": "Evidence from living organisms includes comparative anatomy, comparative embryology, biochemical and DNA evidence, and vestigial organs, all of which point to a common ancestor.", "source": "Year 10 - Evolution.pptx(Evidence for Evolution – Living Species)", "marks": 3, "criteria": [{"id": "c1", "t": "Names at least two types of evidence from living species (comparative anatomy, comparative embryology, biochemical or DNA evidence)", "m": 1}, {"id": "c2", "t": "Names a third valid type of evidence, e.g. vestigial structures (or gives a specific example such as homologous forelimb bones)", "m": 1}, {"id": "c3", "t": "Explains what one type shows, e.g. homologous structures indicate common ancestry / similar early embryos indicate relatedness / closer DNA base sequences indicate a closer relationship", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names at least two types of evidence from living species (comparative anatomy, comparative embryology, biochemical or DNA evidence)", "m": 1}, {"id": "c2", "t": "Names a third valid type of evidence, e.g. vestigial structures (or gives a specific example such as homologous forelimb bones)", "m": 1}, {"id": "c3", "t": "Explains what one type shows, e.g. homologous structures indicate common ancestry / similar early embryos indicate relatedness / closer DNA base sequences indicate a closer relationship", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-011", "topic": "Evolution · Dating fossils", "difficulty": "medium", "type": "short", "stem": "Describe the difference between relative dating and absolute dating of fossils, and give one problem with relative dating. (3 marks)", "options": [], "answer": "• Relative dating uses the order of the rock layers: lower layers were laid down first, so fossils in lower layers are older — it gives the order of age, not an actual age.\n• Absolute dating measures how much radioactive carbon is left in a sample to calculate when the organism died.\n• Problem with relative dating: plate movement, folding or faulting can overturn or shift layers, so the layer order no longer shows the true sequence of ages.", "explanation_en": "Relative dating looks at the order of rock layers, providing only a sequence, not a specific age, while absolute dating uses the amount of radioactive carbon remaining to calculate the age of death; however, relative dating has issues with plate movement, folding, and faulting causing rock layers to become inverted.", "source": "Year 10 - Evolution.pptx(Techniques used to date fossils)", "marks": 3, "criteria": [{"id": "c1", "t": "Describes relative dating: the order of rock layers shows which fossil is older (lower layers were laid down first), so it gives the order of age rather than an actual age", "m": 1}, {"id": "c2", "t": "Describes absolute dating: measures how much radioactive carbon is left in a sample to calculate when the organism died", "m": 1}, {"id": "c3", "t": "Gives one problem with relative dating: plate movement, folding or faulting can overturn or shift layers, so the layer order no longer shows the true sequence of ages", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes relative dating: the order of rock layers shows which fossil is older (lower layers were laid down first), so it gives the order of age rather than an actual age", "m": 1}, {"id": "c2", "t": "Describes absolute dating: measures how much radioactive carbon is left in a sample to calculate when the organism died", "m": 1}, {"id": "c3", "t": "Gives one problem with relative dating: plate movement, folding or faulting can overturn or shift layers, so the layer order no longer shows the true sequence of ages", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-012", "topic": "Evolution · Wallace's Line", "difficulty": "easy", "type": "short", "stem": "What does Wallace's Line show, and what is the most likely explanation for it? (3 marks)", "options": [], "answer": "• It marks the boundary between the fauna of Asia (for example tigers and elephants, which are placental mammals) and the fauna of Australia (marsupials and monotremes).\n• It runs between Bali and Lombok, between Borneo and Sulawesi, then northeast past the Philippines.\n• It is approximately the collision zone between the Asian and Australian continental plates, so the two regions were isolated from each other and their species evolved separately.", "explanation_en": "The Wallace Line is the boundary between the Asian fauna, which includes placental mammals, and the Australian fauna, which includes marsupials and monotremes. It roughly follows the collision zone between the Eurasian and Australian plates, and the geographic isolation on each side led to independent evolution.", "source": "Year 10 - Evolution.pptx(Wallace's Line)", "marks": 3, "criteria": [{"id": "c1", "t": "States that the line marks the boundary between the Asian fauna (placental mammals such as tigers and elephants) and the Australian fauna (marsupials and monotremes)", "m": 1}, {"id": "c2", "t": "Describes where the line runs: between Bali and Lombok, between Borneo and Sulawesi, then northeast past the Philippines", "m": 1}, {"id": "c3", "t": "Explains it as approximately the collision zone between the Asian and Australian plates, so the two regions were isolated and their species evolved separately", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that the line marks the boundary between the Asian fauna (placental mammals such as tigers and elephants) and the Australian fauna (marsupials and monotremes)", "m": 1}, {"id": "c2", "t": "Describes where the line runs: between Bali and Lombok, between Borneo and Sulawesi, then northeast past the Philippines", "m": 1}, {"id": "c3", "t": "Explains it as approximately the collision zone between the Asian and Australian plates, so the two regions were isolated and their species evolved separately", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-013", "topic": "Evolution · Origin-of-life experiment", "difficulty": "easy", "type": "short", "stem": "Describe what the Urey–Miller experiment demonstrated and state one limitation of the experiment. (3 marks)", "options": [], "answer": "• Miller heated water and a mixture of gases representing the early ocean and atmosphere, and passed electric sparks through them to simulate lightning.\n• After a week he found a range of amino acids, the building blocks of proteins.\n• It showed that organic molecules can form spontaneously from inorganic ingredients, but it does not prove how life actually began (and the early atmosphere may not have had the composition he assumed).", "explanation_en": "Miller used electric sparks to simulate lightning and produced various amino acids in a simulated mixture of primitive ocean and atmosphere, showing that inorganic substances can spontaneously form organic molecules, but this does not prove how life originated.", "source": "Year 10 - Evolution.pptx(Urey-Miller experiment)", "marks": 3, "criteria": [{"id": "c1", "t": "Describes the procedure: heated water and a gas mixture representing the early ocean and atmosphere, and passed electric sparks through them to simulate lightning", "m": 1}, {"id": "c2", "t": "States the result: a range of amino acids (the building blocks of proteins) formed, showing organic molecules can form spontaneously from inorganic ingredients", "m": 1}, {"id": "c3", "t": "States one limitation: it does not prove how life actually began, and the early atmosphere may not have had the composition he assumed", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes the procedure: heated water and a gas mixture representing the early ocean and atmosphere, and passed electric sparks through them to simulate lightning", "m": 1}, {"id": "c2", "t": "States the result: a range of amino acids (the building blocks of proteins) formed, showing organic molecules can form spontaneously from inorganic ingredients", "m": 1}, {"id": "c3", "t": "States one limitation: it does not prove how life actually began, and the early atmosphere may not have had the composition he assumed", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-014", "topic": "Evolution · Lizard scenario", "difficulty": "hard", "type": "short", "stem": "Stimulus 1 — Desert lizards: In a desert region a population of lizards varies in skin colour; some are light brown, some dark brown. Before a predatory bird arrived in the 1990s both forms were common. Since then the light-coloured lizards, which blend into the sand, have become more common, while dark lizards remain common in areas without the bird. Using the steps of natural selection, explain why the light-coloured trait has become more prevalent. (4 marks)", "options": [], "answer": "• Variation: the population already contained inherited variation in colour — both light and dark brown lizards.\n• Selection pressure: the predatory bird, which hunts visually during the day.\n• Survival of the fittest: light lizards are camouflaged against the sand and are less likely to be seen and eaten, while dark lizards stand out and are removed.\n• Reproduction and inheritance: the surviving light lizards breed and pass the light-colour alleles to their offspring, so over generations light lizards become more common in the gene pool.", "explanation_en": "Follow the five steps: pre-existing variation, selection pressure, survival and reproduction of the fittest, inheritance, and an increased proportion over generations — for example, light-coloured lizards being better concealed and so surviving to reproduce.", "source": "Year10_Evolution_Worksheet_Student(1).docx(Part C · Stimulus 1 / C1)", "marks": 4, "criteria": [{"id": "c1", "t": "Identifies the variation: the population already contained inherited variation in colour (light and dark brown lizards)", "m": 1}, {"id": "c2", "t": "Identifies the selection pressure: the predatory bird, which hunts visually during the day", "m": 1}, {"id": "c3", "t": "Explains survival of the fittest: light lizards are camouflaged against the sand and less likely to be eaten, while dark lizards stand out and are removed", "m": 1}, {"id": "c4", "t": "Explains reproduction and inheritance: the surviving light lizards breed and pass the light-colour alleles to their offspring, so light lizards become more common over generations", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies the variation: the population already contained inherited variation in colour (light and dark brown lizards)", "m": 1}, {"id": "c2", "t": "Identifies the selection pressure: the predatory bird, which hunts visually during the day", "m": 1}, {"id": "c3", "t": "Explains survival of the fittest: light lizards are camouflaged against the sand and less likely to be eaten, while dark lizards stand out and are removed", "m": 1}, {"id": "c4", "t": "Explains reproduction and inheritance: the surviving light lizards breed and pass the light-colour alleles to their offspring, so light lizards become more common over generations", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-015", "topic": "Evolution · Guppy scenario", "difficulty": "hard", "type": "short", "stem": "Stimulus 3 — Guppies: A river population of guppies varies in body colour, from bright to dull. Where predators are common, dull guppies are harder to see and survive better. In predator-free stretches, bright males attract more mates and reproduce more successfully. Over time dull guppies dominate predator-rich areas and bright guppies dominate predator-free areas. Explain why the two areas ended up with different dominant forms. (5 marks)", "options": [], "answer": "• Variation: the population contains inherited variation in colour, from bright to dull.\n• The selection pressure is different in each area — predation in one, mate choice in the other.\n• In predator-rich water the dull fish are camouflaged and survive to breed, so dull alleles are selected for and increase.\n• In predator-free water the bright males attract more mates and leave more offspring, so bright alleles are selected for and increase.\n• Different selection pressures push the same species in opposite directions, so the dominant form differs between the two areas.", "explanation_en": "The same species in two regions face different selection pressures: 'concealment' is selected for when there are predators, while 'attracting a mate' is selected for when there are no predators, resulting in opposite directions and different advantageous types.", "source": "Year10_Evolution_Worksheet_Student(1).docx(Part C · Stimulus 3 / C3)", "marks": 5, "criteria": [{"id": "c1", "t": "Identifies the variation: the population contains inherited variation in colour, from bright to dull", "m": 1}, {"id": "c2", "t": "States that the selection pressure is different in each area — predation in one, mate choice in the other", "m": 1}, {"id": "c3", "t": "Explains that in predator-rich water the dull fish are camouflaged and survive to breed, so dull alleles increase", "m": 1}, {"id": "c4", "t": "Explains that in predator-free water bright males attract more mates and leave more offspring, so bright alleles increase", "m": 1}, {"id": "c5", "t": "Concludes that different selection pressures push the same species in opposite directions, so the dominant form differs between the two areas", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies the variation: the population contains inherited variation in colour, from bright to dull", "m": 1}, {"id": "c2", "t": "States that the selection pressure is different in each area — predation in one, mate choice in the other", "m": 1}, {"id": "c3", "t": "Explains that in predator-rich water the dull fish are camouflaged and survive to breed, so dull alleles increase", "m": 1}, {"id": "c4", "t": "Explains that in predator-free water bright males attract more mates and leave more offspring, so bright alleles increase", "m": 1}, {"id": "c5", "t": "Concludes that different selection pressures push the same species in opposite directions, so the dominant form differs between the two areas", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-016", "topic": "Evolution · Lactose tolerance (applied)", "difficulty": "hard", "type": "short", "stem": "Lactose is the sugar in milk and lactase is the enzyme that digests it. In most mammals, lactase production falls after infancy, which causes lactose intolerance in adults. A mutation allows some people to keep producing lactase throughout adult life. Lactose intolerance is present in only about 5% of Europeans but about 97% of the Australian Indigenous population. Use Darwin's theory of natural selection to suggest why these proportions differ. (6 marks)", "options": [], "answer": "• The ability to keep producing lactase is an inherited mutation, so there is heritable variation in the trait.\n• In populations with a long history of dairying, adults who could digest milk had an extra reliable food source, especially when other food was scarce.\n• Those individuals were more likely to survive and reproduce, so they passed the lactase-persistence allele to their offspring.\n• Over many generations the allele became common, so lactose intolerance is now rare in those populations (about 5%).\n• In populations without dairy herding, digesting milk gave no survival advantage, so the mutation was not selected for and lactose intolerance stayed common (about 97%).\n• This is natural selection acting on existing heritable variation — not the inheritance of a trait acquired during life.", "explanation_en": "In populations with a history of dairy farming, the ability to digest lactose into adulthood equals an additional reliable food source, making it easier to survive and reproduce, thus increasing the frequency of the lactase persistence allele; in populations without a tradition of animal husbandry, there is no such selective advantage, so lactose intolerance remains prevalent.", "source": "Year10_Evolution_Worksheet_Student(1).docx(Part D · Apply your knowledge / D1)", "marks": 6, "criteria": [{"id": "c1", "t": "Identifies that keeping lactase production into adulthood is an inherited mutation, so there is heritable variation in the trait", "m": 1}, {"id": "c2", "t": "Explains the advantage in dairying populations: adults who could digest milk had an extra reliable food source, especially when other food was scarce", "m": 1}, {"id": "c3", "t": "Explains that those individuals were more likely to survive and reproduce and passed the lactase-persistence allele to their offspring", "m": 1}, {"id": "c4", "t": "Explains that over many generations the allele became common, so lactose intolerance is now rare in those populations (about 5%)", "m": 1}, {"id": "c5", "t": "Explains that without dairy herding digesting milk gave no survival advantage, so the mutation was not selected for and lactose intolerance stayed common (about 97%)", "m": 1}, {"id": "c6", "t": "States that this is natural selection acting on existing heritable variation, not the inheritance of a trait acquired during life", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies that keeping lactase production into adulthood is an inherited mutation, so there is heritable variation in the trait", "m": 1}, {"id": "c2", "t": "Explains the advantage in dairying populations: adults who could digest milk had an extra reliable food source, especially when other food was scarce", "m": 1}, {"id": "c3", "t": "Explains that those individuals were more likely to survive and reproduce and passed the lactase-persistence allele to their offspring", "m": 1}, {"id": "c4", "t": "Explains that over many generations the allele became common, so lactose intolerance is now rare in those populations (about 5%)", "m": 1}, {"id": "c5", "t": "Explains that without dairy herding digesting milk gave no survival advantage, so the mutation was not selected for and lactose intolerance stayed common (about 97%)", "m": 1}, {"id": "c6", "t": "States that this is natural selection acting on existing heritable variation, not the inheritance of a trait acquired during life", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-017", "topic": "Skills · Graphing (CUTLAS)", "difficulty": "easy", "type": "mcq", "stem": "The CUTLAS checklist is used to mark a line graph. Which list gives the six things a good line graph must have?", "options": ["Calculations, Units, Title, Line, Average, Summary", "Crosses, Variables, Title, Legend, Axes, Gradient", "Colour, Units, Table, Labels, Arrows, Scale", "Crosses, Units, Title, Line, Axes, Scale"], "explanation_en": "A CUTLAS graph includes Crosses, Units, Title, Line, Axes, and Scale, making up about 80% of the graph.", "source": "Stage 5 Graphing-1.docx(CUTLAS checklist)", "answer": 3, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-018", "topic": "Skills · Identifying variables", "difficulty": "easy", "type": "mcq", "stem": "A student investigates how the length of a wire affects its resistance. Which is the dependent variable?", "options": ["The resistance of the wire", "The temperature of the room", "The type of wire used", "The length of the wire"], "explanation_en": "The independent variable is the factor deliberately changed by the experimenter, the dependent variable is the measured result, and the controlled variables are the factors kept constant.", "source": "Identifying Variables.docx (definitions of independent / dependent / controlled variables)", "answer": 0, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-019", "topic": "Skills · Error and reliability", "difficulty": "medium", "type": "mcq", "stem": "A student repeats a measurement five times and gets almost identical results, but the thermometer used always reads 2 °C too high. Which statement best describes the results?", "options": ["They are both accurate and reliable.", "They are reliable but not accurate.", "They are accurate but not reliable.", "They are both invalid and unreliable."], "explanation_en": "Results that are consistent when repeated are reliable, but accuracy refers to how close a measurement is to the true value — for example, a thermometer with a constant high bias is reliable but not accurate; reliability does not equal accuracy.", "source": "Half Yearly Revision.pdf(Reliability / Accuracy / systematic error)", "answer": 1, "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-020", "topic": "Skills · Experimental design", "difficulty": "easy", "type": "short", "stem": "A student investigates whether the surface area of calcium carbonate affects the rate at which it reacts with hydrochloric acid. Identify the independent variable, the dependent variable and two controlled variables. (3 marks)", "options": [], "answer": "• Independent variable: the surface area (particle size) of the calcium carbonate.\n• Dependent variable: the rate of the reaction, e.g. the volume of gas collected per minute.\n• Controlled variables (any two): the concentration and volume of hydrochloric acid, the mass of calcium carbonate used, the temperature, or the same beaker.", "explanation_en": "The independent variable is the surface area of the calcium carbonate; the dependent variable is the reaction rate; and the controlled variables are acid concentration and volume, calcium carbonate mass, and temperature.", "source": "Identifying Variables.docx + Term 3 Reactive Chemistry Week 7(surface area investigation)", "marks": 3, "criteria": [{"id": "c1", "t": "Identifies the independent variable as the surface area (particle size) of the calcium carbonate", "m": 1}, {"id": "c2", "t": "Identifies the dependent variable as the rate of reaction, e.g. the volume of gas collected per minute", "m": 1}, {"id": "c3", "t": "Gives two controlled variables, e.g. the concentration and volume of hydrochloric acid, the mass of calcium carbonate, the temperature, the same beaker (any two)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies the independent variable as the surface area (particle size) of the calcium carbonate", "m": 1}, {"id": "c2", "t": "Identifies the dependent variable as the rate of reaction, e.g. the volume of gas collected per minute", "m": 1}, {"id": "c3", "t": "Gives two controlled variables, e.g. the concentration and volume of hydrochloric acid, the mass of calcium carbonate, the temperature, the same beaker (any two)", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-021", "topic": "Skills · Tabulating data", "difficulty": "easy", "type": "short", "stem": "State two rules you must follow when tabulating experimental data. (2 marks)", "options": [], "answer": "• Put the independent variable in the leftmost column, and label every column with the quantity and its unit in the heading (units appear only in the heading, not in every cell).\n• Use a closed table with a value in every cell, with as many rows and columns as the data require, and put each measurement in the correct column.", "explanation_en": "The leftmost column of the table contains the independent variable, with column headings written as 'Physical Quantity (Unit)', and units are only written in the headings; each cell must have a value, and the table must be closed.", "source": "How to Tabulate Data.docx", "marks": 2, "criteria": [{"id": "c1", "t": "States that the independent variable goes in the leftmost column and each heading gives the quantity with its unit (units in the heading only, not in every cell)", "m": 1}, {"id": "c2", "t": "States that the table must be closed with a value in every cell, with each measurement in the correct column and as many rows and columns as the data require", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that the independent variable goes in the leftmost column and each heading gives the quantity with its unit (units in the heading only, not in every cell)", "m": 1}, {"id": "c2", "t": "States that the table must be closed with a value in every cell, with each measurement in the correct column and as many rows and columns as the data require", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-022", "topic": "Skills · Choosing a graph type", "difficulty": "medium", "type": "short", "stem": "Explain when a column graph should be used instead of a line graph. (2 marks)", "options": [], "answer": "• A column graph is used when the variable on the x-axis is a set of categories being compared (for example months, states, colours or subcontinents).\n• A line graph is used when both variables are continuous numerical data, so that trends and patterns can be seen and a line of best fit drawn.", "explanation_en": "The x-axis is used for categorisation (months, states, colours, countries) with a bar graph; when both variables are continuous numerical values and you want to show a trend, use a line graph.", "source": "How to draw a column graph.docx + Stage 5 Graphing-1.docx", "marks": 2, "criteria": [{"id": "c1", "t": "Explains that a column graph is used when the x-axis variable is a set of categories being compared (e.g. months, states, colours, subcontinents)", "m": 1}, {"id": "c2", "t": "Contrasts it with a line graph, which is used when both variables are continuous numerical data so that trends can be seen and a line of best fit drawn", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that a column graph is used when the x-axis variable is a set of categories being compared (e.g. months, states, colours, subcontinents)", "m": 1}, {"id": "c2", "t": "Contrasts it with a line graph, which is used when both variables are continuous numerical data so that trends can be seen and a line of best fit drawn", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-023", "topic": "Skills · Types of error", "difficulty": "medium", "type": "short", "stem": "Describe the difference between a random error and a systematic error, and state how each can be reduced. (3 marks)", "options": [], "answer": "• Random errors are unpredictable fluctuations in either direction caused by the limitations of the measuring device or by the experimenter (e.g. reaction time); they are reduced by repeating the measurement and averaging.\n• Systematic errors are reproducible inaccuracies that are always in the same direction, caused by an inaccuracy in the system itself (e.g. a poorly calibrated thermometer reading 2 °C too high); they are reduced by calibrating and maintaining the equipment and taking careful readings.", "explanation_en": "Random errors have an unpredictable direction (such as reaction time), and can be reduced by repeating the measurement multiple times and taking the average; systematic errors have a fixed direction (instrument calibration bias), and can be reduced by calibrating the instrument and standardising the readings.", "source": "Half Yearly Revision.pdf(Validity – Errors)", "marks": 3, "criteria": [{"id": "c1", "t": "Describes random error: unpredictable fluctuations in either direction caused by the limitations of the measuring device or by the experimenter (e.g. reaction time)", "m": 1}, {"id": "c2", "t": "Describes systematic error: a reproducible inaccuracy always in the same direction, caused by the system itself (e.g. a poorly calibrated thermometer reading 2 °C too high)", "m": 1}, {"id": "c3", "t": "States how each is reduced: random errors by repeating and averaging, systematic errors by calibrating and maintaining the equipment and taking careful readings", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Describes random error: unpredictable fluctuations in either direction caused by the limitations of the measuring device or by the experimenter (e.g. reaction time)", "m": 1}, {"id": "c2", "t": "Describes systematic error: a reproducible inaccuracy always in the same direction, caused by the system itself (e.g. a poorly calibrated thermometer reading 2 °C too high)", "m": 1}, {"id": "c3", "t": "States how each is reduced: random errors by repeating and averaging, systematic errors by calibrating and maintaining the equipment and taking careful readings", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-024", "topic": "Skills · Validity and reliability", "difficulty": "medium", "type": "short", "stem": "Distinguish between the validity and the reliability of an investigation. (2 marks)", "options": [], "answer": "• Validity is the extent to which the investigation actually tests what it claims to test — a fair test with one independent variable and everything else controlled.\n• Reliability is the extent to which repeated measurements taken under identical conditions give similar results, so an investigation is reliable when it has been repeated many times.", "explanation_en": "Validity refers to whether the measurement actually measures what it's supposed to (single variable, controlled fairly); reliability refers to whether the results of repeated measurements are consistent.", "source": "Half Yearly Revision.pdf(Validity / Reliability)", "marks": 2, "criteria": [{"id": "c1", "t": "Defines validity as the extent to which the investigation actually tests what it claims to test (a fair test with one independent variable and everything else controlled)", "m": 1}, {"id": "c2", "t": "Defines reliability as the extent to which repeated measurements under identical conditions give similar results, so it requires the investigation to be repeated", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines validity as the extent to which the investigation actually tests what it claims to test (a fair test with one independent variable and everything else controlled)", "m": 1}, {"id": "c2", "t": "Defines reliability as the extent to which repeated measurements under identical conditions give similar results, so it requires the investigation to be repeated", "m": 1}], "weak": false, "subj": "sci", "subjZh": "Year 10 Science"}, {"id": "sci-025", "topic": "Skills · Data trends and base pairing", "difficulty": "hard", "type": "short", "stem": "The table gives the percentage of adenine and guanine in the DNA of five species.\n\n(a) Describe the trend shown in the table. (b) Explain the trend using the base-pairing rule. (c) Predict the percentage of thymine when adenine is 20%. (4 marks)", "options": [], "answer": "• (a) As the percentage of adenine increases, the percentage of guanine decreases — roughly %A + %G ≈ 50, so the two are inversely related.\n• (b) Adenine always pairs with thymine and guanine always pairs with cytosine, so %A = %T and %G = %C; because the four bases add to 100%, 2(%A) + 2(%G) = 100, i.e. %A + %G = 50.\n• (c) Thymine would be 20%.", "explanation_en": "As A increases, G decreases, because A = T, G = C, and the total of the four bases is 100%, so A + G = 50; when A is 20%, T is also 20% (the data for species D confirms this).", "source": "2020 Year 10 Yearly Examination Answers (Part E Q1–Q3 — DNA base data analysis)", "marks": 4, "criteria": [{"id": "c1", "t": "(a) Describes the trend: as the percentage of adenine increases, the percentage of guanine decreases (roughly %A + %G ≈ 50), so they are inversely related", "m": 1}, {"id": "c2", "t": "(b) States the base-pairing rule: adenine pairs with thymine and guanine with cytosine, so %A = %T and %G = %C", "m": 1}, {"id": "c3", "t": "(b) Explains why %A + %G ≈ 50: because the four bases add to 100%, 2(%A) + 2(%G) = 100", "m": 1}, {"id": "c4", "t": "(c) Predicts that the percentage of thymine is 20%", "m": 1}], "auto_grade": true, "fig": "<div class=\"fig-tablewrap\"><table class=\"fig-
