const KEY = "dsh-review-v1";
function db(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } }
function render(){
  const d = db(), now = Date.now();
  const rows = [], grad = [];
  Object.keys(d).forEach(k => {
    const it = d[k] || {};
    const parts = k.split("::");
    const slug = parts[0], qid = parts.slice(1).join("::");
    const subj = IDX[slug]; const q = subj && subj.q[qid];
    if (!subj || !q) return;
    if (FILTER && slug !== FILTER) return;
    const row = {slug, qid, subj, q, due: it.due || 0, stage: it.stage || 0};
    if (row.due <= now) rows.push(row); else grad.push(row);
  });
  rows.sort((a,b) => a.due - b.due || a.slug.localeCompare(b.slug));
  grad.sort((a,b) => a.due - b.due);
  const dueN = rows.length;
  const soon = grad.filter(r => r.due - now <= 7*864e5).length;
  const later = grad.length - soon;
  document.getElementById("due").textContent = dueN;
  document.getElementById("soon").textContent = soon;
  document.getElementById("later").textContent = later;
  document.getElementById("grad").textContent = grad.length;

  renderFilters();
  renderWeak();
  const box = document.getElementById("list");
  const inv = (function(){ try{ return JSON.parse(localStorage.getItem("dsh-inv-v1")||"{}"); }catch(e){ return {}; } })();
  const passN = (inv.uses && inv.uses.pass) || 0;
  let html = "";
  if (!dueN) {
    html += `<div class="empty">今天没有到期的错题${grad.length ? "，休息一下。" : "——先把题目做一遍，错题会自动进来。"}</div>`;
  } else {
    html += `<div class="sec">现在要做（${dueN}）</div>`;
    rows.forEach(r => {
      html += `<a class="item" href="${r.slug}.html?q=${encodeURIComponent(r.qid)}">
        <div class="b">
          <div class="t"><span class="chip">${r.subj.zh || ""}</span>${r.q.t} <span class="dup">第 ${r.stage+1} 轮</span></div>
          <div class="s">${r.q.s.replace(/[<>&]/g, "")}…</div>
        </div>
        <div class="go">去做 →</div>${passN ? `<button class="ticket" data-skip="${r.slug}::${r.qid}">🎫</button>` : ""}</a>`;
    });
  }
  if (grad.length) {
    html += `<div class="sec">排队中（${grad.length}，按到期日排序）</div>`;
    grad.slice(0, 40).forEach(r => {
      const days = Math.max(1, Math.ceil((r.due - now) / 864e5));
      html += `<a class="item" href="${r.slug}.html?q=${encodeURIComponent(r.qid)}">
        <div class="b">
          <div class="t"><span class="chip">${r.subj.zh || ""}</span>${r.q.t}</div>
          <div class="s">${days} 天后再练（第 ${r.stage+1} 轮）</div>
        </div><div class="go">提前做 →</div></a>`;
    });
    if (grad.length > 40) html += `<div class="empty">还有 ${grad.length - 40} 条…</div>`;
  }
  box.innerHTML = html;
  if(window.applyI18n) setTimeout(applyI18n, 0);
}
var FILTER = "";
function renderFilters(){
  const d = db(), box = document.getElementById("filters");
  const slugs = {};
  Object.keys(d).forEach(k => { slugs[k.split("::")[0]] = 1; });
  const list = Object.keys(slugs);
  if (list.length < 2) { box.innerHTML = ""; return; }
  box.innerHTML = '<button class="fchip' + (FILTER === "" ? " on" : "") + '" data-f="">全部</button>' +
    list.map(s => '<button class="fchip' + (FILTER === s ? " on" : "") + '" data-f="' + s + '">' +
      ((IDX[s] && IDX[s].zh) || s) + '</button>').join("");
  box.querySelectorAll(".fchip").forEach(b => b.onclick = () => { FILTER = b.dataset.f; render(); });
}
function renderWeak(){
  const log = (function(){ try { return JSON.parse(localStorage.getItem("dsh-log-v1") || "[]"); } catch(e){ return []; } })();
  const cnt = {};
  log.forEach(x => {
    if (x.ok) return;
    const subj = IDX[x.s], q = subj && subj.q[x.q];
    if (!q) return;
    const key = x.s + "|" + q.t;
    cnt[key] = (cnt[key] || 0) + 1;
  });
  const rows = Object.keys(cnt).map(k => { const p = k.split("|"); return {slug:p[0], topic:p[1], n:cnt[k]}; })
    .sort((a,b) => b.n - a.n).slice(0, 5);
  const el = document.getElementById("weak");
  if (!rows.length) { el.innerHTML = ""; return; }
  const max = rows[0].n;
  el.innerHTML = '<div class="sec" style="margin-top:0">你最常错的考点</div><div class="weak">' +
    rows.map(r => '<div class="row"><span style="width:44%">' +
      ((IDX[r.slug] && IDX[r.slug].zh) || r.slug) + ' · ' + r.topic +
      '</span><span class="bar"><i style="width:' + Math.round(r.n/max*100) + '%"></i></span>' +
      '<span style="color:var(--dim)">' + r.n + ' 次</span></div>').join("") + '</div>';
}

  function applyI18n(){
    if(window.LANG()==="zh") return;
    var walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n, changed=[];
    while((n=walker.nextNode())){
      var s=(n.nodeValue||"").trim(); if(!s) continue;
      if(I18N[s]){ n.nodeValue=n.nodeValue.replace(s, I18N[s]); continue; }
      var nv=n.nodeValue, did=false;
      for(var si=0; si<I18N_SUB.length; si++){
        if(nv.indexOf(I18N_SUB[si][0])>=0){ nv=nv.split(I18N_SUB[si][0]).join(I18N_SUB[si][1]); did=true; }
      }
      if(did){ n.nodeValue=nv; continue; }
      for(var i=0;i<I18N_PAT.length;i++){
        if(I18N_PAT[i][0].test(s)){ n.nodeValue=n.nodeValue.replace(s, s.replace(I18N_PAT[i][0], I18N_PAT[i][1])); break; }
      }
    }
    document.querySelectorAll("[placeholder]").forEach(function(el){
      var p=el.getAttribute("placeholder");
      if(I18N[p]) el.setAttribute("placeholder", I18N[p]);
    });
    document.querySelectorAll("[title]").forEach(function(el){
      var t2=el.getAttribute("title");
      if(I18N[t2]) el.setAttribute("title", I18N[t2]);
    });
  }

  var LB={sort:"pct", list:[], open:false, at:0, timer:null};
  var LB_TABS=[["pct","正确率"],["score","答对题数"],["speed","用时"]];

  function lbMetric(x, sort){
    if(sort==="score") return (x.correct!==undefined?x.correct:Math.round(x.pct*x.answered/100))+" 题";
    if(sort==="speed") return x.ms>0 ? fmtMs(x.ms) : "—";
    return x.pct+"%";
  }
  function fmtMs(ms){ var s=Math.round(ms/1000); return Math.floor(s/60)+"'"+String(s%60).padStart(2,"0")+'"'; }

  function lbFetch(cb){
    if(!apibase()){ if(cb) cb(); return; }
    var now=Date.now();
    if(now-LB.at < 3500 && LB.list.length){ if(cb) cb(); return; }
    LB.at=now;
    fetch(apibase()+"/board?day="+encodeURIComponent(todayKey())+"&sort="+LB.sort)
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok && d.list){ LB.list=d.list; if(cb) cb(); } })
      .catch(function(){});
  }

  function lbNearRange(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<3) return null;
    return [Math.max(0,idx-2), Math.min(LB.list.length-1, idx+2)];
  }

  function lbRowsHtml(){
    var me=nick()||"我";
    var start = LB.list.length>3 ? 3 : 0;
    var near = lbNearRange();
    return LB.list.slice(start).map(function(x,i){
      if(near && (i+start)>=near[0] && (i+start)<=near[1]) return "";
      var mine = x.name===me;
      return '<div class="lb-row'+(mine?' me':'')+'" data-k="'+x.name+'">'+
        '<span class="rk">'+(i+start+1)+'</span>'+
        '<span class="rname">'+x.name+(mine?'（我）':'')+
          (x.ms>0?'<span class="lb-time">'+fmtMs(x.ms)+'</span>':'')+'</span>'+
        '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>';
    }).join("") || '<div class="mutedsmall">今天还没有人上榜</div>';
  }

  function lbPodiumHtml(){
    var top=LB.list.slice(0,3), me=nick()||"我";
    if(!top.length) return "";
    var order=[1,0,2]; // 2nd, 1st, 3rd
    return '<div class="podium">'+order.map(function(idx){
      var x=top[idx]; if(!x) return '<div></div>';
      var place=idx+1, cls="p"+place;
      return '<div class="pod '+cls+'"><div class="pl">第'+["一","二","三"][idx]+'名</div><div class="av">'+place+'</div>'+
        '<div class="nm">'+x.name+(x.name===me?' ·我':'')+'</div>'+
        '<div class="sc">'+lbMetric(x,LB.sort)+'</div></div>';
    }).join("")+'</div>';
  }

  function lbSelfHtml(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<0) return '<div class="lb-self"><span class="rk">—</span><span class="rname">你还没上榜，交卷即可参与</span></div>';
    var x=LB.list[idx];
    return '<div class="lb-self"><span class="rk">'+(idx+1)+'</span><span class="rname">'+me+'（我）</span>'+
      '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>';
  }

  var LB_FREEZE=false, LB_PENDING=0, LB_SCROLL_T=null, LB_PREV=null;

  function lbNeighborsHtml(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    var r=lbNearRange();
    if(!r) return "";
    var a=r[0], b=r[1], out=[];
    for(var k=a;k<=b;k++){
      var x=LB.list[k], mine=(k===idx);
      out.push('<div class="lb-row'+(mine?' me':'')+'" data-k="'+x.name+'">'+

        '<span class="rname">'+x.name+(mine?'（我）':'')+

    return '<div class="lb-near"><div class="near-h">你附近 · 再对一道题就能超过</div>'+out.join("")+'</div>';

    var S=seen(), e=S[id]||{n:0,right:false,sealed:false}, mul=1, note="";

      else { mul=0.3; note="重做已会的题，经验 ×0.3"; }
    } else if(e.right && !ok){
      mul=1; note="";
    } else if(!e.right && ok && e.n>0){
      mul=1; note="纠错 + 全额";

    e.n=(e.n||0)+1;
    if(ok){ e.right=true; if(e.n>=3 && mul===0) e.sealed=true; }

  function qseed(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }

    var q = ev.target.closest && ev.target.closest("[data-claim]");
    if(q){ claimQuest(q.getAttribute("data-claim")); renderAll(); return; }
    if(ev.target.closest && ev.target.closest("#mecode")){
      if(!nick()){ var nm=prompt("给自己起个名字（显示在好友榜）",""); if(nm) setNick(nm.slice(0,12)); }
      var r=myCode();
      if(!r.ok){ toast(r.msg,false); return; }
      var ta=document.createElement("textarea"); ta.value=r.code;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("战绩码已复制，发给同学吧", true); }
      catch(e){ toast("复制失败，手动选中："+r.code.slice(0,20)+"…", false); }
      ta.remove();
      return;
    }
    if(ev.target.closest && ev.target.closest("#cfgapi")){
      var cur=apibase();
      var v=prompt("填入 Cloudflare Worker 地址（留空则清除）", cur);
      if(v===null) return;
      setApi(v);
      toast(v.trim()?"已保存，正在拉取云端榜…":"已清除服务器地址", true);
      renderAll(); return;
    }
    if(ev.target.closest && ev.target.closest("#pushscore")){
      var r2=pushScore(); toast(r2.msg, r2.ok); return;
    }
    if(ev.target.closest && ev.target.closest("#addcode")){
      var inp=document.getElementById("friendcode");
      var res=addCode(inp?inp.value:"");
      toast(res.msg, res.ok); renderAll(); return;
    }
  });
  applyTheme();
  if(document.readyState!=='loading'){ renderAll(); if(window.lbInit) lbInit(); }
  else document.addEventListener('DOMContentLoaded', function(){ renderAll(); if(window.lbInit) lbInit(); });
})();

</script>
<button class="lang-btn" id="langBtn">Language <b id="langNow">EN</b></button>
<script>
(function(){
  var b=document.getElementById("langBtn");
  function paint(){ var l=(window.LANG?LANG():"en"); var n=document.getElementById("langNow");
    if(n) n.textContent = l==="en"?"EN":(l==="zh"?"中文":"EN+中"); }
  if(b) b.onclick=function(){
    var order=["en","zh","both"], cur=(window.LANG?LANG():"en");
    var nx=order[(order.indexOf(cur)+1)%3]; if(window.setLANG) setLANG(nx);
    paint(); if(window.applyI18n) applyI18n(); if(typeof render==="function") render();
  };
  paint();
})();
</script>
</body></html>
