.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

const KEY = "dsh-review-v1";
function db(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } }
function render(){
  const d = db(), now = Date.now();
  const rows = [], grad = [];
  Object.keys(d).forEach(k => {
    const it = d[k] || {};
    const parts = k.split("::");
    const slug = parts[0], qid = parts.slice(1).join("::");
    const subj = IDX[slug]; const q = subj && subj.q[qid];
    if (!subj || !q) return;
    if (FILTER && slug !== FILTER) return;
    const row = {slug, qid, subj, q, due: it.due || 0, stage: it.stage || 0};
    if (row.due <= now) rows.push(row); else grad.push(row);
  });
  rows.sort((a,b) => a.due - b.due || a.slug.localeCompare(b.slug));
  grad.sort((a,b) => a.due - b.due);
  const dueN = rows.length;
  const soon = grad.filter(r => r.due - now <= 7*864e5).length;
  const later = grad.length - soon;
  document.getElementById("due").textContent = dueN;
  document.getElementById("soon").textContent = soon;
  document.getElementById("later").textContent = later;
  document.getElementById("grad").textContent = grad.length;

  renderFilters();
  renderWeak();
  const box = document.getElementById("list");
  const inv = (function(){ try{ return JSON.parse(localStorage.getItem("dsh-inv-v1")||"{}"); }catch(e){ return {}; } })();
  const passN = (inv.uses && inv.uses.pass) || 0;
  let html = "";
  if (!dueN) {
    html += `<div class="empty">今天没有到期的错题${grad.length ? "，休息一下。" : "——先把题目做一遍，错题会自动进来。"}</div>`;
  } else {
    html += `<div class="sec">现在要做（${dueN}）</div>`;
    rows.forEach(r => {
      html += `<a class="item" href="${r.slug}.html?q=${encodeURIComponent(r.qid)}">
        <div class="b">
          <div class="t"><span class="chip">${r.subj.zh || ""}</span>${r.q.t} <span class="dup">第 ${r.stage+1} 轮</span></div>
          <div class="s">${r.q.s.replace(/[<>&]/g, "")}…</div>
        </div>
        <div class="go">去做 →</div>${passN ? `<button class="ticket" data-skip="${r.slug}::${r.qid}">🎫</button>` : ""}</a>`;
    });
  }
  if (grad.length) {
    html += `<div class="sec">排队中（${grad.length}，按到期日排序）</div>`;
    grad.slice(0, 40).forEach(r => {
      const days = Math.max(1, Math.ceil((r.due - now) / 864e5));
      html += `<a class="item" href="${r.slug}.html?q=${encodeURIComponent(r.qid)}">
        <div class="b">
          <div class="t"><span class="chip">${r.subj.zh || ""}</span>${r.q.t}</div>
          <div class="s">${days} 天后再练（第 ${r.stage+1} 轮）</div>
        </div><div class="go">提前做 →</div></a>`;
    });
    if (grad.length > 40) html += `<div class="empty">还有 ${grad.length - 40} 条…</div>`;
  }
  box.innerHTML = html;
}
var FILTER = "";
function renderFilters(){
  const d = db(), box = document.getElementById("filters");
  const slugs = {};
  Object.keys(d).forEach(k => { slugs[k.split("::")[0]] = 1; });
  const list = Object.keys(slugs);
  if (list.length < 2) { box.innerHTML = ""; return; }
  box.innerHTML = '<button class="fchip' + (FILTER === "" ? " on" : "") + '" data-f="">全部</button>' +
    list.map(s => '<button class="fchip' + (FILTER === s ? " on" : "") + '" data-f="' + s + '">' +
      ((IDX[s] && IDX[s].zh) || s) + '</button>').join("");
  box.querySelectorAll(".fchip").forEach(b => b.onclick = () => { FILTER = b.dataset.f; render(); });
}
function renderWeak(){
  const log = (function(){ try { return JSON.parse(localStorage.getItem("dsh-log-v1") || "[]"); } catch(e){ return []; } })();
  const cnt = {};
  log.forEach(x => {
    if (x.ok) return;
    const subj = IDX[x.s], q = subj && subj.q[x.q];
    if (!q) return;
    const key = x.s + "|" + q.t;
    cnt[key] = (cnt[key] || 0) + 1;
  });
  const rows = Object.keys(cnt).map(k => { const p = k.split("|"); return {slug:p[0], topic:p[1], n:cnt[k]}; })
    .sort((a,b) => b.n - a.n).slice(0, 5);
  const el = document.getElementById("weak");
  if (!rows.length) { el.innerHTML = ""; return; }
  const max = rows[0].n;
  el.innerHTML = '<div class="sec" style="margin-top:0">你最常错的考点</div><div class="weak">' +
    rows.map(r => '<div class="row"><span style="width:44%">' +
      ((IDX[r.slug] && IDX[r.slug].zh) || r.slug) + ' · ' + r.topic +
      '</span><span class="bar"><i style="width:' + Math.round(r.n/max*100) + '%"></i></span>' +
      '<span style="color:var(--dim)">' + r.n + ' 次</span></div>').join("") + '</div>';
}

      const data = obj.data || obj;
      let n = 0;
      Object.keys(data).forEach(k => { localStorage.setItem(k, data[k]); n++; });
      alert("已导入 " + n + " 项，页面将刷新。");
      location.reload();
    } catch(e) { alert("导入失败：" + e.message); }
  };
  fr.readAsText(f);
};

document.addEventListener("click", function(ev){
  var b = ev.target.closest && ev.target.closest("[data-skip]");
  if(!b) return;
  ev.preventDefault();
  var inv = (function(){ try{ return JSON.parse(localStorage.getItem("dsh-inv-v1")||"{}"); }catch(e){ return {}; } })();
  if(!inv.uses || !inv.uses.pass){ alert("没有延后券了，去商城买一张？"); return; }
  inv.uses.pass -= 1;
  try{ localStorage.setItem("dsh-inv-v1", JSON.stringify(inv)); }catch(e){}
  var d = db(); var key=b.getAttribute("data-skip");
  if(d[key]){ d[key].due = (d[key].due||Date.now()) + 86400000; }
  try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
  render();
});
document.getElementById("clear").onclick = () => {
  if (!confirm("清空整个错题本？各科做题记录不受影响。")) return;
  localStorage.removeItem(KEY); render();
};
render();
</script>
</body></html>
