<script>
const DATA = {"slug": "sci", "title": "科学 · 10 年级", "examMin": 80, "questions": [{"id": "sci-001", "topic": "进化 · 达尔文的证据", "difficulty": "easy", "type": "mcq", "stem": "Darwin collected 13 species of finch on the Galapagos Islands. Which feature differed most clearly between the specimens?", "options": ["Beak size and shape", "Number of legs on each bird", "Wing length and shape", "Body colour and pattern"], "explanation": "13 种雀鸟体型羽色相近，但喙的大小和形状不同，对应不同岛屿的不同食物来源，是自然选择的经典证据。", "source": "Year 10 - Evolution.pptx（Galapagos finches）", "answer": 0, "zh": {"stem": "达尔文在加拉帕戈斯群岛采集了 13 种地雀。这些标本之间差异最明显的是哪个特征？", "options": ["喙的大小与形状", "每只鸟的腿数", "翅膀的长度与形状", "体色与花纹"], "answer": 0}, "weak": false}, {"id": "sci-002", "topic": "进化 · 拉马克与达尔文", "difficulty": "easy", "type": "mcq", "stem": "How did Lamarck explain the long necks of giraffes?", "options": ["Giraffes with longer necks obtained food more easily, survived and passed the trait on to their offspring.", "Giraffes stretched their necks to reach high leaves and passed the longer necks on to their offspring.", "Long necks appeared suddenly because of a mutation in a single generation.", "Giraffe necks grew longer because the climate changed."], "explanation": "拉马克主张「用进废退＋获得性性状可遗传」：伸长脖子并把这一改变传给后代。「Giraffes with longer necks obtained food more easily, survived and passed the trait on to their offspring.」 才是达尔文自然选择的解释。", "source": "Term 4 - Evolution - Week 2（Lamarckian Theory vs Darwinian Theory）", "answer": 1, "zh": {"stem": "拉马克如何解释长颈鹿的长脖子？", "options": ["脖子较长的长颈鹿更容易取食，存活下来并把性状传给后代。", "长颈鹿为了够到高处的叶子不断伸长脖子，再把拉长的脖子传给后代。", "长脖子因为一次突变在一代之内突然出现。", "长颈鹿的脖子因气候变化而变长。"], "answer": 1}, "weak": false}, {"id": "sci-003", "topic": "进化 · 选择压力", "difficulty": "hard", "type": "mcq", "stem": "In parts of Australia where cane toads live, the average head size of red-bellied black snakes has become smaller. Which explanation is consistent with natural selection?", "options": ["The toads release a chemical that directly shrinks the heads of the snakes they meet.", "Snakes that ate toads pulled their heads smaller during their lifetime and passed the smaller heads on to their offspring.", "Snakes with larger heads could swallow the bigger, more toxic toads and died, so smaller-headed snakes survived and reproduced.", "Head size is not heritable, so this change cannot be evolution by natural selection."], "explanation": "蔗蟾是选择压力：头大的蛇吞下大蟾、摄入更多毒素而死亡（被淘汰），头小或不愿吃蟾的个体存活繁殖。「Snakes that ate toads pulled their heads smaller during their lifetime and passed the smaller heads on to their offspring.」 是拉马克式错误说法。", "source": "Term 4 - Evolution - Week 3 Answers（Cane toads / red-bellied black snake）", "answer": 2, "zh": {"stem": "在澳洲有甘蔗蟾蜍的地区，红腹黑蛇的平均头部尺寸变小了。哪种解释与自然选择一致？", "options": ["蟾蜍释放化学物质，直接让遇到的蛇头部变小。", "蛇在捕食蟾蜍时把头部缩小，并把变小后的头传给后代。", "头较大的蛇能吞下更大更毒的蟾蜍因而死亡，于是小头个体存活并繁殖。", "头部大小不可遗传，所以这一变化不属于自然选择。"], "answer": 2}, "weak": false}, {"id": "sci-004", "topic": "进化 · 选择压力定义", "difficulty": "easy", "type": "short", "stem": "Define the term 'selection pressure' and give two examples of selection pressures. (2 marks)", "options": [], "answer": "• A selection pressure is an external agent that affects an organism's ability to survive and reproduce in a given environment.\n• Examples: predators, climate and temperature, food and water supply, disease, or competition for mates and resources.", "explanation": "选择压力＝影响生物能否在特定环境存活繁殖的外部因素，如捕食者、气候、食物水源、疾病、竞争。", "source": "Year10_Evolution_Worksheet_Student（1）.docx（Part A · Selection pressures / B1）", "zh": {"stem": "定义「选择压力」，并给出两个选择压力的例子。（2 分）"}, "points": [{"t": "A selection pressure is an external agent that affects an organism's ability to survive and reproduce in a given environment.", "m": 1}, {"t": "Examples: predators, climate and temperature, food and water supply, disease, or competition for mates and resources.", "m": 1}], "weak": false}, {"id": "sci-005", "topic": "进化 · 自然选择的步骤", "difficulty": "medium", "type": "short", "stem": "The steps of natural selection are listed out of order: reproduction and inheritance; increased prevalence in the gene pool; survival of the fittest; variation in a population; selection pressure. Number them 1–5 in the correct order and write one sentence explaining step 3. (5 marks)", "options": [], "answer": "• 1 Variation in a population — individuals differ in their inherited traits.\n• 2 Selection pressure — an external agent such as a predator or a change in climate acts on the population.\n• 3 Survival of the fittest — individuals whose traits suit the environment are more likely to survive.\n• 4 Reproduction and inheritance — survivors breed and pass the helpful alleles on to their offspring.\n• 5 Increased prevalence in the gene pool — over many generations the helpful trait becomes more common in the population.", "explanation": "顺序：变异→选择压力→适者生存→繁殖与遗传→基因库中比例上升。第 3 步的含义是「性状更适合环境的个体更容易存活」。", "source": "Year10_Evolution_Worksheet_Student（1）.docx（Part B2）", "zh": {"stem": "下列自然选择的步骤顺序被打乱：繁殖与遗传；在基因库中比例上升；适者生存；变异……请把它们排成正确顺序。（分值见题）"}, "points": [{"t": "1 Variation in a population — individuals differ in their inherited traits.", "m": 1}, {"t": "2 Selection pressure — an external agent such as a predator or a change in climate acts on the population.", "m": 1}, {"t": "3 Survival of the fittest — individuals whose traits suit the environment are more likely to survive.", "m": 1}, {"t": "4 Reproduction and inheritance — survivors breed and pass the helpful alleles on to their offspring.", "m": 1}, {"t": "5 Increased prevalence in the gene pool — over many generations the helpful trait becomes more common in the population.", "m": 1}], "weak": false}, {"id": "sci-006", "topic": "进化 · 变异的来源", "difficulty": "easy", "type": "short", "stem": "Where does the variation in a population originally come from? (1 mark)", "options": [], "answer": "• Mutations — random changes in the DNA (genes or chromosomes) that are inherited and create new alleles; sexual reproduction also shuffles existing alleles into new combinations.", "explanation": "变异的根本来源是基因突变（产生新等位基因），有性生殖再把等位基因重新组合。", "source": "Year10_Evolution_Worksheet_Student（1）.docx（Part B3）+ Year 10 - Evolution.pptx（Mutations）", "zh": {"stem": "种群中的变异最初来自哪里？（1 分）"}, "points": [{"t": "• Mutations — random changes in the DNA (genes or chromosomes) that are inherited and create new alleles", "m": 1}, {"t": "sexual reproduction also shuffles existing alleles into new combinations", "m": 1}], "weak": false}, {"id": "sci-007", "topic": "进化 · 达尔文的观察与推论", "difficulty": "easy", "type": "short", "stem": "Darwin made a set of observations and used them to make inferences. Outline two of his observations and the inference he drew from them. (4 marks)", "options": [], "answer": "• Observation: individuals in a species vary, and much of that variation is heritable.\n• Observation: organisms produce far more offspring than can survive, while resources are limited.\n• Inference: there is a struggle for existence, and the individuals best suited to their environment survive and reproduce.\n• Over time populations adapt to their environment, and this can lead to new species.", "explanation": "达尔文的观察：个体有可遗传的变异；后代数量超过资源能承载的量。推论：存在生存斗争，最适应环境的个体存活繁殖，种群逐渐适应环境甚至形成新种。", "source": "Year 10 - Evolution.pptx（The Theory of Evolution）", "zh": {"stem": "达尔文提出了一系列观察并据此作出推论。概述其中两项观察以及由它们得出的推论。（4 分）"}, "points": [{"t": "Observation: individuals in a species vary, and much of that variation is heritable.", "m": 1}, {"t": "Observation: organisms produce far more offspring than can survive, while resources are limited.", "m": 1}, {"t": "Inference: there is a struggle for existence, and the individuals best suited to their environment survive and reproduce.", "m": 1}, {"t": "Over time populations adapt to their environment, and this can lead to new species.", "m": 1}], "weak": false}, {"id": "sci-008", "topic": "进化 · 拉马克与达尔文对比", "difficulty": "medium", "type": "short", "stem": "Explain how Lamarck's explanation of evolution differs from Darwin's. (3 marks)", "options": [], "answer": "• Lamarck proposed use and disuse plus the inheritance of acquired characteristics: an organism changes during its life by using a feature more, then passes that change to its offspring (e.g. a giraffe stretching its neck).\n• Darwin proposed natural selection: variation already exists in the population, and individuals with inherited traits suited to the environment survive and reproduce more, so those traits become more common.\n• Lamarck's mechanism has no role for genes, and acquired changes are not inherited.", "explanation": "拉马克靠「用进废退＋获得性性状遗传」，达尔文靠种群中已有的变异＋自然选择。关键差别：只有可遗传的变异才能传递给下一代。", "source": "Term 4 - Evolution - Week 2（Lamarckian Theory vs Darwinian Theory）+ Year 10 - Evolution.pptx", "zh": {"stem": "说明拉马克对进化的解释与达尔文有何不同。（3 分）"}, "points": [{"t": "Lamarck proposed use and disuse plus the inheritance of acquired characteristics: an organism changes during its life by using a feature more, then passes that change to its offspring (e.g. a giraffe stretching its neck).", "m": 1}, {"t": "Darwin proposed natural selection: variation already exists in the population, and individuals with inherited traits suited to the environment survive and reproduce more, so those traits become more common.", "m": 1}, {"t": "Lamarck's mechanism has no role for genes, and acquired changes are not inherited.", "m": 1}], "weak": false}, {"id": "sci-009", "topic": "进化 · 工业黑化", "difficulty": "medium", "type": "short", "stem": "Explain, using natural selection, why the dark (melanic) form of the peppered moth became common in industrial towns in the 1800s. (4 marks)", "options": [], "answer": "• Soot pollution killed the lichens and blackened the tree trunks.\n• The pale peppered form then stood out against the dark bark and was eaten by birds, so it was selected against.\n• The dark melanic form was better camouflaged and survived to breed, passing its alleles to the next generation.\n• Over many generations the dark form became more common, i.e. the population evolved as the environment changed.", "explanation": "煤烟把树干熏黑→浅色蛾失去保护被鸟捕食→黑色型隐蔽存活并繁殖→多代后比例上升。这是自然选择方向随环境改变的例子。", "source": "Term 4 - Evolution - Week 2（Case Study: Peppered Moth）", "zh": {"stem": "用自然选择解释：为什么 1800 年代工业城镇中桦尺蛾的深色（黑化）型变得常见。（4 分）"}, "points": [{"t": "Soot pollution killed the lichens and blackened the tree trunks.", "m": 1}, {"t": "The pale peppered form then stood out against the dark bark and was eaten by birds, so it was selected against.", "m": 1}, {"t": "The dark melanic form was better camouflaged and survived to breed, passing its alleles to the next generation.", "m": 1}, {"t": "Over many generations the dark form became more common, i.e. the population evolved as the environment changed.", "m": 1}], "weak": false}, {"id": "sci-010", "topic": "进化 · 现存物种的证据", "difficulty": "medium", "type": "short", "stem": "Name three types of evidence from living species that support the theory of evolution, and explain what one of them shows. (3 marks)", "options": [], "answer": "• Comparative anatomy (e.g. the same bone arrangement in the forelimbs of vertebrates — homologous structures).\n• Comparative embryology (closely related species have similar embryos at early stages).\n• Biochemical / DNA evidence (the closer the DNA base sequence of two species, the more closely related they are).\n• Vestigial structures (structures that once had a function but are now functionless) also indicate common ancestry.", "explanation": "现存生物的证据包括比较解剖学（同源结构）、比较胚胎学、生化/DNA 证据，以及痕迹器官；它们都指向共同祖先。", "source": "Year 10 - Evolution.pptx（Evidence for Evolution – Living Species）", "zh": {"stem": "举出三种来自现存物种、支持进化论的证据，并说明其中一种证据说明了什么。（3 分）"}, "points": [{"t": "Comparative anatomy (e.g. the same bone arrangement in the forelimbs of vertebrates — homologous structures).", "m": 1}, {"t": "Comparative embryology (closely related species have similar embryos at early stages).", "m": 1}, {"t": "Biochemical / DNA evidence (the closer the DNA base sequence of two species, the more closely related they are).", "m": 1}, {"t": "Vestigial structures (structures that once had a function but are now functionless) also indicate common ancestry.", "m": 1}], "weak": false}, {"id": "sci-011", "topic": "进化 · 化石测年", "difficulty": "medium", "type": "short", "stem": "Describe the difference between relative dating and absolute dating of fossils, and give one problem with relative dating. (3 marks)", "options": [], "answer": "• Relative dating uses the order of the rock layers: lower layers were laid down first, so fossils in lower layers are older — it gives the order of age, not an actual age.\n• Absolute dating measures how much radioactive carbon is left in a sample to calculate when the organism died.\n• Problem with relative dating: plate movement, folding or faulting can overturn or shift layers, so the layer order no longer shows the true sequence of ages.", "explanation": "相对测年只看岩层上下顺序（只给先后，不给具体年代），绝对测年靠放射性碳剩余量算出死亡年代。相对测年的问题是板块运动、褶皱、断层会让岩层翻转错位。", "source": "Year 10 - Evolution.pptx（Techniques used to date fossils）", "zh": {"stem": "描述化石的相对测年与绝对测年的区别，并指出相对测年的一个问题。（3 分）"}, "points": [{"t": "Relative dating uses the order of the rock layers: lower layers were laid down first, so fossils in lower layers are older — it gives the order of age, not an actual age.", "m": 1}, {"t": "Absolute dating measures how much radioactive carbon is left in a sample to calculate when the organism died.", "m": 1}, {"t": "Problem with relative dating: plate movement, folding or faulting can overturn or shift layers, so the layer order no longer shows the true sequence of ages.", "m": 1}], "weak": false}, {"id": "sci-012", "topic": "进化 · 华莱士线", "difficulty": "easy", "type": "short", "stem": "What does Wallace's Line show, and what is the most likely explanation for it? (3 marks)", "options": [], "answer": "• It marks the boundary between the fauna of Asia (for example tigers and elephants, which are placental mammals) and the fauna of Australia (marsupials and monotremes).\n• It runs through Bali and Borneo, north through Lombok and Sulawesi, then east of the Philippines.\n• It is approximately the collision zone between the Asian and Australian continental plates, so the two regions were isolated from each other and their species evolved separately.", "explanation": "华莱士线是亚洲动物区系（胎盘哺乳类）与澳洲动物区系（有袋类/单孔类）的分界，大致对应亚欧板块与澳洲板块的碰撞带——地理隔离导致两边独立演化。", "source": "Year 10 - Evolution.pptx（Wallace's Line）", "zh": {"stem": "华莱士线说明了什么？最可能的解释是什么？（3 分）"}, "points": [{"t": "It marks the boundary between the fauna of Asia (for example tigers and elephants, which are placental mammals) and the fauna of Australia (marsupials and monotremes).", "m": 1}, {"t": "It runs through Bali and Borneo, north through Lombok and Sulawesi, then east of the Philippines.", "m": 1}, {"t": "It is approximately the collision zone between the Asian and Australian continental plates, so the two regions were isolated from each other and their species evolved separately.", "m": 1}], "weak": false}, {"id": "sci-013", "topic": "进化 · 生命起源实验", "difficulty": "easy", "type": "short", "stem": "Describe what the Urey–Miller experiment demonstrated and state one limitation of the experiment. (3 marks)", "options": [], "answer": "• Miller heated water and a mixture of gases representing the early ocean and atmosphere, and passed electric sparks through them to simulate lightning.\n• After a week he found a range of amino acids, the building blocks of proteins.\n• It showed that organic molecules can form spontaneously from inorganic ingredients, but it does not prove how life actually began (and the early atmosphere may not have had the composition he assumed).", "explanation": "米勒用电火花模拟闪电，在模拟原始海洋与大气的混合气体中得到多种氨基酸——说明无机物可以自发形成有机分子；但这不能证明生命如何起源。", "source": "Year 10 - Evolution.pptx（Urey-Miller experiment）", "zh": {"stem": "描述米勒–尤里实验证明了什么，并指出该实验的一个局限。（3 分）"}, "points": [{"t": "Miller heated water and a mixture of gases representing the early ocean and atmosphere, and passed electric sparks through them to simulate lightning.", "m": 1}, {"t": "After a week he found a range of amino acids, the building blocks of proteins.", "m": 1}, {"t": "It showed that organic molecules can form spontaneously from inorganic ingredients, but it does not prove how life actually began (and the early atmosphere may not have had the composition he assumed).", "m": 1}], "weak": false}, {"id": "sci-014", "topic": "进化 · 蜥蜴情景分析", "difficulty": "hard", "type": "short", "stem": "Stimulus 1 – Desert lizards: In a desert region a population of lizards varies in skin colour; some are light brown, some dark brown. Before a predatory bird arrived in the 1990s both forms were common. Since then the light-coloured lizards, which blend into the sand, have become more common, while dark lizards remain common in areas without the bird. Using the steps of natural selection, explain why the light-coloured trait has become more prevalent. (4 marks)", "options": [], "answer": "• Variation: the population already contained inherited variation in colour — both light and dark brown lizards.\n• Selection pressure: the predatory bird, which hunts visually during the day.\n• Survival of the fittest: light lizards are camouflaged against the sand and are less likely to be seen and eaten, while dark lizards stand out and are removed.\n• Reproduction and inheritance: the surviving light lizards breed and pass the light-colour alleles to their offspring, so over generations light lizards become more common in the gene pool.", "explanation": "按五步走：原有变异（浅/深）→选择压力（白天靠视觉捕食的鸟）→浅色更隐蔽而存活、深色被吃→浅色繁殖并遗传→多代后浅色比例上升。", "source": "Year10_Evolution_Worksheet_Student（1）.docx（Part C · Stimulus 1 / C1）", "zh": {"stem": "【材料 1 · 沙漠蜥蜴】某沙漠地区的蜥蜴肤色有浅棕与深棕两种。在捕食性鸟类出现之前……（按要求作答）"}, "points": [{"t": "Variation: the population already contained inherited variation in colour — both light and dark brown lizards.", "m": 1}, {"t": "Selection pressure: the predatory bird, which hunts visually during the day.", "m": 1}, {"t": "Survival of the fittest: light lizards are camouflaged against the sand and are less likely to be seen and eaten, while dark lizards stand out and are removed.", "m": 1}, {"t": "Reproduction and inheritance: the surviving light lizards breed and pass the light-colour alleles to their offspring, so over generations light lizards become more common in the gene pool.", "m": 1}], "weak": false}, {"id": "sci-015", "topic": "进化 · 孔雀鱼情景分析", "difficulty": "hard", "type": "short", "stem": "Stimulus 3 – Guppies: A river population of guppies varies in body colour, from bright to dull. Where predators are common, dull guppies are harder to see and survive better. In predator-free stretches, bright males attract more mates and reproduce more successfully. Over time dull guppies dominate predator-rich areas and bright guppies dominate predator-free areas. Explain why the two areas ended up with different dominant forms. (5 marks)", "options": [], "answer": "• Variation: the population contains inherited variation in colour, from bright to dull.\n• The selection pressure is different in each area — predation in one, mate choice in the other.\n• In predator-rich water the dull fish are camouflaged and survive to breed, so dull alleles are selected for and increase.\n• In predator-free water the bright males attract more mates and leave more offspring, so bright alleles are selected for and increase.\n• Different selection pressures push the same species in opposite directions, so the dominant form differs between the two areas.", "explanation": "同一物种在两个区域面对不同选择压力：有捕食者时「隐蔽」被选择，无捕食者时「吸引配偶」被选择，方向相反，所以优势型不同。", "source": "Year10_Evolution_Worksheet_Student（1）.docx（Part C · Stimulus 3 / C3）", "zh": {"stem": "【材料 3 · 孔雀鱼】某河流中的孔雀鱼体色从鲜艳到暗淡不等。在有较多捕食者的水域，暗淡的个体更不易被发现……（按要求作答）"}, "points": [{"t": "Variation: the population contains inherited variation in colour, from bright to dull.", "m": 1}, {"t": "The selection pressure is different in each area — predation in one, mate choice in the other.", "m": 1}, {"t": "In predator-rich water the dull fish are camouflaged and survive to breed, so dull alleles are selected for and increase.", "m": 1}, {"t": "In predator-free water the bright males attract more mates and leave more offspring, so bright alleles are selected for and increase.", "m": 1}, {"t": "Different selection pressures push the same species in opposite directions, so the dominant form differs between the two areas.", "m": 1}], "weak": false}, {"id": "sci-016", "topic": "进化 · 乳糖耐受综合应用", "difficulty": "hard", "type": "short", "stem": "Lactose is the sugar in milk and lactase is the enzyme that digests it. In most mammals, lactase production falls after infancy, which causes lactose intolerance in adults. A mutation allows some people to keep producing lactase throughout adult life. Lactose intolerance is present in only about 5% of Europeans but about 97% of the Australian Indigenous population. Use Darwin's theory of natural selection to suggest why these proportions differ. (6 marks)", "options": [], "answer": "• The ability to keep producing lactase is an inherited mutation, so there is heritable variation in the trait.\n• In populations with a long history of dairying, adults who could digest milk had an extra reliable food source, especially when other food was scarce.\n• Those individuals were more likely to survive and reproduce, so they passed the lactase-persistence allele to their offspring.\n• Over many generations the allele became common, so lactose intolerance is now rare in those populations (about 5%).\n• In populations without dairy herding, digesting milk gave no survival advantage, so the mutation was not selected for and lactose intolerance stayed common (about 97%).\n• This is natural selection acting on existing heritable variation — not the inheritance of a trait acquired during life.", "explanation": "有乳制品饲养史的人群中，成年后能消化乳糖＝多一个可靠食物来源→更易存活繁殖→乳糖酶持续表达的等位基因频率升高；无畜牧传统的人群没有这个选择优势，所以乳糖不耐仍占多数。", "source": "Year10_Evolution_Worksheet_Student（1）.docx（Part D · Apply your knowledge / D1）", "zh": {"stem": "【综合】乳糖是牛奶中的糖，乳糖酶是分解它的酶。多数哺乳动物在幼年后乳糖酶产量下降，从而出现乳糖不耐受……（按要求作答）"}, "points": [{"t": "The ability to keep producing lactase is an inherited mutation, so there is heritable variation in the trait.", "m": 1}, {"t": "In populations with a long history of dairying, adults who could digest milk had an extra reliable food source, especially when other food was scarce.", "m": 1}, {"t": "Those individuals were more likely to survive and reproduce, so they passed the lactase-persistence allele to their offspring.", "m": 1}, {"t": "Over many generations the allele became common, so lactose intolerance is now rare in those populations (about 5%).", "m": 1}, {"t": "In populations without dairy herding, digesting milk gave no survival advantage, so the mutation was not selected for and lactose intolerance stayed common (about 97%).", "m": 1}, {"t": "This is natural selection acting on existing heritable variation — not the inheritance of a trait acquired during life.", "m": 1}], "weak": false}, {"id": "sci-017", "topic": "技能 · 数据制图", "difficulty": "easy", "type": "mcq", "stem": "The CUTLAS checklist is used to mark a line graph. Which list gives the six things a good line graph must have?", "options": ["Calculations, Units, Title, Line, Average, Summary", "Crosses, Variables, Title, Legend, Axes, Slope", "Colour, Units, Table, Labels, Arrows, Scale", "Crosses, Units, Title, Line, Axes, Scale"], "explanation": "CUTLAS＝Crosses（用叉画点）、Units（两轴带单位）、Title（含两个变量）、Line（平滑趋势线，不是连点）、Axes（标注且自变量在 x 轴）、Scale（占满约 80%）。", "source": "Stage 5 Graphing-1.docx（CUTLAS checklist）", "answer": 3, "zh": {"stem": "CUTLAS 清单用于给折线图评分。下列哪一组是合格折线图必须具备的六项？", "options": ["计算、单位、标题、连线、平均值、总结", "十字叉、变量、标题、图例、坐标轴、斜率", "颜色、单位、表格、标签、箭头、刻度", "十字叉、单位、标题、连线、坐标轴、刻度"], "answer": 3}, "weak": false}, {"id": "sci-018", "topic": "技能 · 变量识别", "difficulty": "easy", "type": "mcq", "stem": "A student investigates how the length of a wire affects its resistance. Which is the dependent variable?", "options": ["The resistance of the wire", "The temperature of the room", "The type of wire used", "The length of the wire"], "explanation": "自变量是实验者主动改变的（导线长度），因变量是被测量的结果（电阻），其余保持不变的是控制变量。", "source": "Identifying Variables.docx（独立 / 依赖 / 控制变量定义）", "answer": 0, "zh": {"stem": "某学生研究导线长度如何影响其电阻。哪个是因变量？", "options": ["导线的电阻", "房间的温度", "所用导线的材料", "导线的长度"], "answer": 0}, "weak": false}, {"id": "sci-019", "topic": "技能 · 误差与可靠性", "difficulty": "medium", "type": "mcq", "stem": "A student repeats a measurement five times and gets almost identical results, but the thermometer used always reads 2 °C too high. Which statement best describes the results?", "options": ["They are both accurate and reliable.", "They are reliable but not accurate.", "They are accurate but not reliable.", "They are both invalid and unreliable."], "explanation": "重复多次结果一致＝可靠（reliable）；温度计恒定偏高属于系统误差，因此不准确（accurate 指接近真值）。可靠不等于准确。", "source": "Half Yearly Revision.pdf（Reliability / Accuracy / systematic error）", "answer": 1, "zh": {"stem": "某学生重复测量五次，结果几乎完全相同，但所用温度计读数始终偏高 2 °C。下列哪项描述最准确？", "options": ["既准确又可靠。", "可靠但不准确。", "准确但不可靠。", "既无效又不可靠。"], "answer": 1}, "weak": false}, {"id": "sci-020", "topic": "技能 · 实验设计", "difficulty": "easy", "type": "short", "stem": "A student investigates whether the surface area of calcium carbonate affects the rate at which it reacts with hydrochloric acid. Identify the independent variable, the dependent variable and two controlled variables. (3 marks)", "options": [], "answer": "• Independent variable: the surface area (particle size) of the calcium carbonate.\n• Dependent variable: the rate of the reaction, e.g. the volume of gas collected per minute.\n• Controlled variables (any two): the concentration and volume of hydrochloric acid, the mass of calcium carbonate used, the temperature, or the same beaker.", "explanation": "自变量＝碳酸钙表面积；因变量＝反应速率（如每分钟气体体积）；控制变量＝酸浓度与体积、碳酸钙质量、温度等。", "source": "Identifying Variables.docx + Term 3 Reactive Chemistry Week 7（surface area investigation）", "zh": {"stem": "某学生研究碳酸钙的表面积是否影响它与盐酸反应的速率。请指出自变量、因变量和至少两个控制变量。"}, "points": [{"t": "Independent variable: the surface area (particle size) of the calcium carbonate.", "m": 1}, {"t": "Dependent variable: the rate of the reaction, e.g. the volume of gas collected per minute.", "m": 1}, {"t": "Controlled variables (any two): the concentration and volume of hydrochloric acid, the mass of calcium carbonate used, the temperature, or the same beaker.", "m": 1}], "weak": false}, {"id": "sci-021", "topic": "技能 · 数据制表", "difficulty": "easy", "type": "short", "stem": "State two rules you must follow when tabulating experimental data. (2 marks)", "options": [], "answer": "• Put the independent variable in the leftmost column, and label every column with the quantity and its unit in the heading (units appear only in the heading, not in every cell).\n• Use a closed table with a value in every cell, with as many rows and columns as the data require, and put each measurement in the correct column.", "explanation": "表格最左列放自变量，列标题写「物理量（单位）」，单位只写在标题里；每个格子都要有数值，表格要封口。", "source": "How to Tabulate Data.docx", "zh": {"stem": "列出实验数据制表时必须遵守的两条规则。（2 分）"}, "points": [{"t": "Put the independent variable in the leftmost column, and label every column with the quantity and its unit in the heading (units appear only in the heading, not in every cell).", "m": 1}, {"t": "Use a closed table with a value in every cell, with as many rows and columns as the data require, and put each measurement in the correct column.", "m": 1}], "weak": false}, {"id": "sci-022", "topic": "技能 · 图表类型选择", "difficulty": "medium", "type": "short", "stem": "Explain when a column graph should be used instead of a line graph. (2 marks)", "options": [], "answer": "• A column graph is used when the variable on the x-axis is a set of categories being compared (for example months, states, colours or subcontinents).\n• A line graph is used when both variables are continuous numerical data, so that trends and patterns can be seen and a line of best fit drawn.", "explanation": "x 轴是分类（月份、州、颜色、国家）用柱状图；两个变量都是连续数值、要看趋势时用折线图。", "source": "How to draw a column graph.docx + Stage 5 Graphing-1.docx", "zh": {"stem": "说明什么时候应该用柱状图而不是折线图。（2 分）"}, "points": [{"t": "A column graph is used when the variable on the x-axis is a set of categories being compared (for example months, states, colours or subcontinents).", "m": 1}, {"t": "A line graph is used when both variables are continuous numerical data, so that trends and patterns can be seen and a line of best fit drawn.", "m": 1}], "weak": false}, {"id": "sci-023", "topic": "技能 · 误差类型", "difficulty": "medium", "type": "short", "stem": "Describe the difference between a random error and a systematic error, and state how each can be reduced. (3 marks)", "options": [], "answer": "• Random errors are unpredictable fluctuations in either direction caused by the limitations of the measuring device or by the experimenter (e.g. reaction time); they are reduced by repeating the measurement and averaging.\n• Systematic errors are reproducible inaccuracies that are always in the same direction, caused by an inaccuracy in the system itself (e.g. a poorly calibrated thermometer reading 2 °C too high); they are reduced by calibrating and maintaining the equipment and taking careful readings.", "explanation": "随机误差方向不定（如反应时间），靠多次重复取平均减小；系统误差方向固定（仪器校准偏差），要靠校准仪器、规范读数减小。", "source": "Half Yearly Revision.pdf（Validity – Errors）", "zh": {"stem": "描述随机误差与系统误差的区别，并说明各自如何减小。（3 分）"}, "points": [{"t": "Random errors are unpredictable fluctuations in either direction caused by the limitations of the measuring device or by the experimenter (e.g. reaction time); they are reduced by repeating the measurement and averaging.", "m": 1}, {"t": "Systematic errors are reproducible inaccuracies that are always in the same direction, caused by an inaccuracy in the system itself (e.g. a poorly calibrated thermometer reading 2 °C too high); they are reduced by calibrating and maintaining the equipment and taking careful readings.", "m": 1}], "weak": false}, {"id": "sci-024", "topic": "技能 · 效度与信度", "difficulty": "medium", "type": "short", "stem": "Distinguish between the validity and the reliability of an investigation. (2 marks)", "options": [], "answer": "• Validity is the extent to which the investigation actually tests what it claims to test — a fair test with one independent variable and everything else controlled.\n• Reliability is the extent to which repeated measurements taken under identical conditions give similar results, so an investigation is reliable when it has been repeated many times.", "explanation": "效度（validity）＝是否测到了想测的东西（单一变量、控制公平）；信度（reliability）＝重复测量结果是否一致。", "source": "Half Yearly Revision.pdf（Validity / Reliability）", "zh": {"stem": "区分一项研究的效度（validity）与信度（reliability）。（2 分）"}, "points": [{"t": "Validity is the extent to which the investigation actually tests what it claims to test — a fair test with one independent variable and everything else controlled.", "m": 1}, {"t": "Reliability is the extent to which repeated measurements taken under identical conditions give similar results, so an investigation is reliable when it has been repeated many times.", "m": 1}], "weak": false}, {"id": "sci-025", "topic": "技能 · 数据趋势与碱基配对", "difficulty": "hard", "type": "short", "stem": "The table gives the percentage of adenine and guanine in the DNA of five species.\n\nSpecies: A | B | C | D | E\n% Adenine: 38 | 26 | 8 | 20 | 33\n% Guanine: 12 | 22 | 40 | 32 | 18\n\n(a) Describe the trend shown in the table. (b) Explain the trend using the base-pairing rule. (c) Predict the percentage of thymine when adenine is 20%. (4 marks)", "options": [], "answer": "• (a) As the percentage of adenine increases, the percentage of guanine decreases — roughly %A + %G ≈ 50, so the two are inversely related.\n• (b) Adenine always pairs with thymine and guanine always pairs with cytosine, so %A = %T and %G = %C; because the four bases add to 100%, 2(%A) + 2(%G) = 100, i.e. %A + %G = 50.\n• (c) Thymine would be 20%.", "explanation": "A 增大则 G 减小，因为 A=T、G=C 且四种碱基合计 100%，所以 A+G=50；A=20% 时 T 也是 20%（物种 D 的数据正好验证）。", "source": "2020 Year 10 Yearly Examination Answers（Part E Q1–Q3 DNA 碱基数据分析）", "zh": {"stem": "下表给出五个物种 DNA 中腺嘌呤与鸟嘌呤的百分比。物种 A–E 的腺嘌呤为 38/26/8/20/33，鸟嘌呤为 12/2……（按碱基配对规律作答）"}, "points": [{"t": "(a) As the percentage of adenine increases, the percentage of guanine decreases — roughly %A + %G ≈ 50, so the two are inversely related.", "m": 1}, {"t": "(b) Adenine always pairs with thymine and guanine always pairs with cytosine, so %A = %T and %G = %C; because the four bases add to 100%, 2(%A) + 2(%G) = 100, i.e. %A + %G = 50.", "m": 1}, {"t": "(c) Thymine would be 20%.", "m": 1}], "weak": false}, {"id": "sci-026", "topic": "技能 · 求梯度与斜率含义", "difficulty": "hard", "type": "short", "stem": "A graph of voltage (y-axis) against current (x-axis) for a resistor is a straight line of best fit passing through (0, 0) and (10 A, 5 V). Calculate the gradient of the line and hence state the resistance of the resistor. Show your working. (3 marks)", "options": [], "answer": "• gradient = rise ÷ run = (5 − 0) V ÷ (10 − 0) A = 0.5\n• Because R = V ÷ I, the gradient equals the resistance, so the resistance is 0.5 Ω.", "explanation": "梯度＝ΔV/ΔI＝5/10＝0.5；由 R=V/I 可知斜率就是电阻，所以电阻是 0.5 Ω（斜率单位 V/A 即 Ω）。", "source": "2020 Year 10 Yearly Examination Answers（Part E Q7：由梯度求电阻）", "zh": {"stem": "某电阻的电压（y 轴）对电流（x 轴）图像是一条过 (0,0) 与 (10 A, 5 V) 的最佳拟合直线。计算斜率并说明它代表什么。"}, "points": [{"t": "gradient = rise ÷ run = (5 − 0) V ÷ (10 − 0) A = 0.5", "m": 1}, {"t": "Because R = V ÷ I, the gradient equals the resistance, so the resistance is 0.5 Ω.", "m": 1}], "weak": false}, {"id": "sci-027", "topic": "技能 · 插值读数", "difficulty": "medium", "type": "short", "stem": "The table shows the force acting on a passenger at different decelerations.\n\nDeceleration (m/s²): 1 | 2 | 4 | 6 | 8 | 10 | 12 | 14\nForce (N): 80 | 149 | 305 | 448 | 598 | 756 | 902 | 1040\n\n(a) Estimate the force on the passenger when the deceleration is 5 m/s². (b) Describe the relationship between deceleration and force. (3 marks)", "options": [], "answer": "• (a) 5 m/s² is halfway between 4 m/s² (305 N) and 6 m/s² (448 N), so the force is about (305 + 448) ÷ 2 ≈ 376 N (accept 370–380 N).\n• (b) The relationship is linear: the force increases by a constant amount (about 74 N) for every extra 1 m/s² of deceleration.", "explanation": "5 m/s² 位于 4 与 6 之间，插值得 (305+448)/2≈376 N；两者是线性关系，每增加 1 m/s² 力约增加 74 N（梯度 960/13≈74）。", "source": "Half Yearly Revision.pdf（Deceleration–Force 数据表）", "zh": {"stem": "下表给出乘客在不同减速度下受到的力。减速度 1/2/4/6/8/10/12/14 m/s² 对应力 80/149/305……（做插值读数）"}, "points": [{"t": "(a) 5 m/s² is halfway between 4 m/s² (305 N) and 6 m/s² (448 N), so the force is about (305 + 448) ÷ 2 ≈ 376 N (accept 370–380 N).", "m": 1}, {"t": "(b) The relationship is linear: the force increases by a constant amount (about 74 N) for every extra 1 m/s² of deceleration.", "m": 1}], "weak": false}, {"topic": "有机化学 · 烷烃通式", "difficulty": "easy", "type": "mcq", "stem": "Which general formula correctly represents the alkanes?", "options": ["CnH2n", "CnH2n-2", "CnH2n+2", "CnH2n+1OH"], "answer": 2, "explanation": "烷烃是饱和烃，碳碳之间全是单键，通式 CnH2n+2。CnH2n 是烯烃（一个双键），CnH2n+1OH 是醇。", "id": "sci-028", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "zh": {"stem": "哪个通式正确表示烷烃？", "options": ["CnH2n", "CnH2n-2", "CnH2n+2", "CnH2n+1OH"], "answer": 2}, "weak": false}, {"topic": "有机化学 · 命名", "difficulty": "easy", "type": "mcq", "stem": "What is the IUPAC name of the compound CH3–CH2–CH3?", "options": ["Ethane", "Butane", "Methane", "Propane"], "answer": 3, "explanation": "三个碳的烷烃是 propane（丙烷）。methane 1 个碳，ethane 2 个，butane 4 个。", "id": "sci-029", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "zh": {"stem": "化合物 CH3–CH2–CH3 的 IUPAC 名称是什么？", "options": ["乙烷", "丁烷", "甲烷", "丙烷"], "answer": 3}, "weak": false}, {"topic": "有机化学 · 官能团", "difficulty": "medium", "type": "mcq", "stem": "Which functional group is present in ethanol, CH3CH2OH?", "options": ["Hydroxyl group (–OH)", "Carboxyl group (–COOH)", "Ester linkage (–COO–)", "Carbon–carbon double bond (C=C)"], "answer": 0, "explanation": "乙醇的官能团是羟基 –OH，化合物类别为醇。–COOH 是羧酸，C=C 是烯烃，–COO– 是酯。", "id": "sci-030", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "zh": {"stem": "乙醇 CH3CH2OH 中含有哪种官能团？", "options": ["羟基（–OH）", "羧基（–COOH）", "酯键（–COO–）", "碳碳双键（C=C）"], "answer": 0}, "weak": false}, {"topic": "有机化学 · 不饱和烃检验", "difficulty": "medium", "type": "mcq", "stem": "Bromine water is added to a sample. The orange-brown colour disappears. What does this show?", "options": ["The sample is an alkane", "The sample contains an alkene (C=C)", "The sample contains only single bonds", "The sample contains a carboxylic acid"], "answer": 1, "explanation": "溴水褪色是不饱和键的检验：烯烃与 Br2 加成，双键打开，颜色消失。烷烃不发生这个反应，颜色不变。", "id": "sci-031", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "zh": {"stem": "向样品中加入溴水，橙棕色褪去。这说明什么？", "options": ["样品是烷烃", "样品含有烯烃（C=C）", "样品只含单键", "样品含有羧酸"], "answer": 1}, "weak": false}, {"topic": "有机化学 · 同分异构", "difficulty": "hard", "type": "mcq", "stem": "Butane and 2-methylpropane both have the molecular formula C4H10. They are best described as:", "options": ["Polymers", "Isotopes", "Isomers", "Allotropes"], "answer": 2, "explanation": "同分异构体：分子式相同、结构不同。丁烷是直链，2-甲基丙烷是支链。isotope 是同位素（原子），allotrope 是同素异形体（单质），polymer 是聚合物。", "id": "sci-032", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "zh": {"stem": "丁烷与 2-甲基丙烷的分子式都是 C4H10，它们最准确的称呼是：", "options": ["聚合物", "同位素", "同分异构体", "同素异形体"], "answer": 2}, "weak": false}, {"topic": "有机化学 · 燃烧产物", "difficulty": "easy", "type": "mcq", "stem": "A hydrocarbon burns completely in excess oxygen. Which two products are formed?", "options": ["Ethanol and carbon dioxide", "Carbon monoxide and hydrogen", "Carbon and oxygen", "Carbon dioxide and water"], "answer type": "short", "stem": "Draw the full structural formula of ethanol and identify its functional group. Then explain why ethanol is soluble in water.", "answer": "CH3–CH2–OH, with every C–H and C–O bond shown (C2H5OH). Functional group: hydroxyl (–OH). Ethanol is soluble because the –OH group forms hydrogen bonds with water molecules.", "explanation": "结构式要画出所有键，不能只写 C2H6O。可溶性来自羟基与水的氢键——碳链只有 2 个碳，疏水部分小，不足以阻止溶解。", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry（绘图 + 解释题）", "points": [{"t": "CH3–CH2–OH, with every C–H and C–O bond shown (C2H5OH)", "m": 1}, {"t": "Functional group: hydroxyl (–OH)", "m": 1}, {"t": "Ethanol is soluble because the –OH group forms hydrogen bonds with water molecules", "m": 1}], "id": "sci-044", "options": [], "zh": {"stem": "画出乙醇的完整结构式，指出它的官能团，并解释乙醇为什么能溶于水。"}, "weak": false}, {"topic": "有机化学 · 证据解释", "difficulty": "hard", "type": "short", "stem": "A student adds bromine water to two unknown colourless liquids. Sample A decolourises the bromine water at room temperature; sample B does not. Explain what this tells you about the bonding in each sample, and name a possible compound for A and for B.", "answer": "Sample A contains a carbon–carbon double bond (unsaturated): bromine adds across the C=C, so the orange colour disappears. Sample B has only single bonds (saturated) and does not react at room temperature. A could be ethene/hexene; B could be hexane/ethane.", "explanation": "这道是典型的「证据 + 解释」题：先给现象对应的化学原因（加成），再分别给出饱和/不饱和的判断，最后各举一例。只写「A 不饱和」拿不到满分。", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "points": [{"t": "Sample A contains a carbon–carbon double bond (unsaturated): bromine adds across the C=C, so the orange colour disappears. Sample B has only single bonds (saturated) and does not react at room temperature. A could be ethene/hexene", "m": 1}, {"t": "B could be hexane/ethane", "m": 1}], "id": "sci-045", "options": [], "zh": {"stem": "某学生向两种未知无色液体中加入溴水：样品 A 在室温下使溴水褪色，样品 B 不褪色。解释这说明两者各自的成键情况，并各举一个可能的化合物。"}, "weak": false}, {"topic": "有机化学 · 比较与用途", "difficulty": "medium", "type": "short", "stem": "Compare the structure and reactivity of an alkane and an alkene, and explain why alkenes are used to make plastics.", "answer": "Alkanes have only single C–C bonds and are saturated, so they mainly undergo substitution (with UV light) and combustion. Alkenes contain a C=C double bond, are unsaturated, and readily undergo addition reactions. Because alkenes can join to each other by addition (addition polymerisation), they form long-chain polymers such as polyethene and PVC.", "explanation": "分值来自三块：结构差异（单键 vs 双键）、反应差异（取代/燃烧 vs 加成）、与塑料的联系（加聚）。缺一块扣一块。", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "points": [{"t": "Alkanes have only single C–C bonds and are saturated, so they mainly undergo substitution (with UV light) and combustion", "m": 1}, {"t": "Alkenes contain a C=C double bond, are unsaturated, and readily undergo addition reactions", "m": 1}, {"t": "Because alkenes can join to each other by addition (addition polymerisation), they form long-chain polymers such as polyethene and PVC", "m": 1}], "id": "sci-046", "options": [], "zh": {"stem": "比较烷烃与烯烃的结构和反应性，并解释为什么烯烃被用来制造塑料。"}, "weak": false}, {"topic": "有机化学 · 同系物规律", "difficulty": "medium", "type": "short", "stem": "Methanol, ethanol and propanol are members of the same homologous series. State one property that changes in a regular way down the series and explain why.", "answer": "Boiling point increases from methanol to propanol. As the carbon chain lengthens, the molecules have more electrons and a larger surface area, so dispersion forces between molecules become stronger and more energy is needed to separate them.", "explanation": "同系物题的套路：先说「指向哪个规律性变化」（沸点升高），再用分子间作用力解释。只说「分子变大」不够，要落到色散力/能量。", "source": "Yearly Study Guide 2026 · Science Part A: Organic Chemistry", "points": [{"t": "Boiling point increases from methanol to propanol", "m": 1}, {"t": "As the carbon chain lengthens, the molecules have more electrons and a larger surface area, so dispersion forces between molecules become stronger and more energy is needed to separate them", "m": 1}], "id": "sci-047", "options": [], "zh": {"stem": "甲醇、乙醇、丙醇属于同一同系物。指出一个随碳链增长而规律变化的性质，并解释原因。"}, "weak": false}, {"topic": "有机化学 · 实验设计", "difficulty": "hard", "type": "short", "stem": "Describe a fair test to compare how completely ethanol and octane burn. Identify the independent, dependent and controlled variables.", "answer": "Independent variable: the fuel used (ethanol vs octane). Dependent variable: a measure of completeness of combustion, e.g. the amount of soot produced, the colour of the flame, or the mass of CO2/heat released per gram. Controlled: same mass of fuel, same burner, same distance from the flame to the surface, same volume of water heated, same starting temperature, same oxygen supply. Judge completeness by the least soot and the cleanest blue flame.", "explanation": "考纲 Part C 明确列了「Identifying Variables」和「Planning Investigations」。答案必须三项变量齐全，并给出可测量的指标，不能只写「观察火焰」。", "source": "Yearly Study Guide 2026 · Science Part C: Skills（Planning Investigations / Identifying Variables）", "points": [{"t": "Independent variable: the fuel used (ethanol vs octane)", "m": 1}, {"t": "Dependent variable: a measure of completeness of combustion, e.g", "m": 1}, {"t": "the amount of soot produced, the colour of the flame, or the mass of CO2/heat released per gram", "m": 1}, {"t": "Controlled: same mass of fuel, same burner, same distance from the flame to the surface, same volume of water heated, same starting temperature, same oxygen supply", "m": 1}, {"t": "Judge completeness by the least soot and the cleanest blue flame", "m": 1}], "id": "sci-048", "options": [], "zh": {"stem": "设计一个公平实验比较乙醇与辛烷燃烧的完全程度，指出自变量、因变量和控制变量。"}, "weak": false}]};
const KEY = "dsh-quiz-sci";
const MULTI = DATA.slug === "all";
const app = document.getElementById("app");
let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = DATA.questions.map((_,i)=>i);
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

  const chosenCount = () => {

  };
  const calc = () => {
    let n = 0;

      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = "已选 " + chosenCount() + " 科";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
    state.answers={}; state.daily=key; state.rewarded=false; state.t0=Date.now(); save(); render();
  }
  document.getElementById("daily").onclick = startDaily;
  document.getElementById("startmix").onclick = () => {
    const chosen = keys.filter(k => (state.pick || {})[k] !== false);
    if (!chosen.length) { alert("至少选一科"); return; }
    let idxs = [];
    chosen.forEach(k => {
      let pool = DATA.questions.map((q, i) => q.subj === k ? i : -1).filter(i => i >= 0);
      pool.sort(() => Math.random() - 0.5);
      idxs = idxs.concat(per ? pool.slice(0, per) : pool);
    });
    idxs.sort(() => Math.random() - 0.5);
    state.order = idxs; state.idx = 0; state.started = true; state.setup = false;
    state.answers = {}; state.t0 = Date.now(); save(); render();
  };
  calc();
}

var UI_TEXT = {
  en: { grid:"Index", exam:"Exam mode", restart:"Restart", prev:"< Previous", next:"Next >",
        finish:"See results", back:"< Subjects", again:"Redo all", lb:"Today's leaderboard" },

        finish:"看成绩", back:"← 科目列表", again:"整套重做", lb:"查看今日榜单" }
};
function T(k){
  var lang = LANG(); var d = UI_TEXT[lang === "zh" ? "zh" : "en"];
  return d[k] || UI_TEXT.en[k] || k;
}
function applyChrome(){
  var map = { grid:"#grid", exam:"#exam", restart:"#restart" };
  Object.keys(map).forEach(function(k){ var el=document.querySelector(map[k]); if(el) el.textContent=T(k); });

}
function cycleLang(){
  var order=["en","zh","both"], i=order.indexOf(LANG());
  setLANG(order[(i+1)%3] || "en");
  applyChrome(); render();
}

function render() {
  if (MULTI && location.hash === "#daily" && !state.started && !state.dailyAuto) {
    state.dailyAuto = true; if (typeof startDaily === "function") startDaily();
  }
  if (MULTI && state.setup && !state.started) return renderSetup();
  const qs = state.order.map(i => DATA.questions[i]);
  const q = qs[state.idx];
  const L = LANG(), ZH = (q && q.zh) || null;
  const total = qs.length;
  const answered = qs.filter(x => state.answers[x.id]).length;
  const right = qs.filter(x => state.answers[x.id] === "ok").length;
  const wrong = qs.filter(x => state.answers[x.id] === "bad").length;
  document.getElementById("counter").textContent = (state.idx+1) + " / " + total;
  document.getElementById("scorepill").textContent = "✓ " + right + "  ✗ " + wrong;
  document.getElementById("pbar").style.width = (answered/total*100).toFixed(1) + "%";
  if (!q) { app.innerHTML = "<p>这套题是空的。</p>"; return; }

  const rec = state.answers[q.id];
  const chips = `<div class="chips">
      ${MULTI && q.subjZh ? `<span class="chip">${esc(q.subjZh)}</span>` : ""}
      <span class="chip">${esc(q.topic)}</span>
      <span class="chip ${esc(q.difficulty)}">${ {easy:"简单",medium:"中等",hard:"较难"}[q.difficulty] || esc(q.difficulty) }</span>
      <span class="chip">${q.type === "mcq" ? "选择题" : "简答"}</span>
      <span class="chip">第 ${state.idx+1} 题 / 共 ${total}</span>
    </div>`;

  let bodyHtml = "";
  if (q.type === "mcq") {
    const opts = (q.options || []).map((o, i) => {
      let cls = "opt", mark = "";
      if (rec) {
        if (i === q.answer) { cls += " correct"; mark = '<span class="mk">✓</span>'; }
        else if (rec.chosen === i) { cls += " wrong"; mark = '<span class="mk">✗</span>'; }
      }
      const zo = (ZH && Array.isArray(ZH.options) && ZH.options[i]) ? ZH.options[i] : "";
      const zhSpan = (L !== "en" && zo) ? `<span class="otr">${esc(zo)}</span>` : "";
      return `<button class="${cls}" data-i="${i}" ${rec ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[i]}</span><span class="txt">${esc(o)}${zhSpan}</span>${mark}</button>`;
    }).join("");
    bodyHtml = `<div class="opts">${opts}</div>`;
  } else {
    const pts = q.points && q.points.length ? q.points : [{t:q.answer, m:1}];
    const totalMarks = pts.reduce((a,p)=>a+(p.m||1),0);
    const checked = (rec && rec.checked) ? rec.checked : [];
    const earned = pts.reduce((a,p,i)=>a + (checked.indexOf(i)>=0 ? (p.m||1) : 0), 0);
    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    bodyHtml = `<textarea id="ta" placeholder="先自己写（英文），写完点下面的按钮对照得分点">${rec && rec.text ? esc(rec.text) : ""}</textarea>
      <div class="actions">
        <button class="btn" id="reveal">${rec ? "重新对照得分点" : "对照得分点"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        ${rec ? `<span class="pill" style="align-self:center">已得 <b>${earned}</b> / ${totalMarks} 分</span>` : `<span class="muted" style="align-self:center">共 ${totalMarks} 分 · ${pts.length} 个得分点</span>`}
      </div>`;
    if (rec) {
      bodyHtml += `<div class="panel">
        <div class="panel-h">自评 · 勾选你写到的得分点</div>
        <div class="pts">${pts.map((p,i)=>`
          <label class="pt ${checked.indexOf(i)>=0?'on':''}"><input type="checkbox" data-i="${i}" ${checked.indexOf(i)>=0?'checked':''}><span>${esc(p.t)}</span><em>${p.m||1} 分</em></label>`).join("")}</div>
        <div class="actions">
          <button class="btn ghost" id="allpt">全部勾上</button>
          <button class="btn ghost" id="nonept">全部取消</button>
        </div>
        <div class="mine"><b>你写的：</b><div>${esc(((rec.text||"").trim()) || "（空）")}</div></div>
      </div>`;
    }
  }

  const expHtml = rec ? `<div class="exp show"><b>解析：</b>${esc(q.explanation)}
      ${q.type === "short" ? `<details class="fullans"><summary>看完整参考答案</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">出处：${esc(q.source || "")}</div></div>` : "";

  const last = state.idx >= total - 1;
  let stemHtml;
  if (L === "zh" && ZH && ZH.stem) {
    stemHtml = `<div class="stem zh"><span class="orig">${esc(q.stem)}</span>${esc(ZH.stem)}</div>`;
  } else if (L === "both" && ZH && ZH.stem) {
    stemHtml = `<div class="stem">${esc(q.stem)}<div class="tr">${esc(ZH.stem)}</div></div>`;
  } else {
    stemHtml = `<div class="stem">${esc(q.stem)}</div>`;
  }
  setTimeout(function(){ if(window.applyI18n) applyI18n(); }, 0);
  app.innerHTML = `<div class="card">${chips}${stemHtml}
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>${T("prev")}</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">${T("finish")}</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>${T("next")}</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq", i === q.answer);
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq");
      save(); render();
    }));
  } else {
    const ta = document.getElementById("ta");
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    document.getElementById("reveal").onclick = () => {
      const c = cur();
      state.answers[q.id] = {chosen:-1, text: ta.value, checked: c.checked || [], ok:"ok"};
      save(); render();
    };
    app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur(); const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      state.answers[q.id] = {chosen:-1, text: c.text, checked: [...set].sort((a,b)=>a-b), ok:"ok"};
      const full = pts.every((_,i)=>set.has(i));
      if (window.awardForQ && full && !(c.checked && c.checked.length >= pts.length)) awardForQ(q.id, q.difficulty, "short", true);
      reviewMark(q.subj || DATA.slug, q.id, full);
      logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short");
      save(); render();
    }));
    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const u = numsOf(ta.value), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!u.length) { res.textContent = "你还没写数字"; res.style.color = "var(--dim)"; return; }
      if (!a.length) { res.textContent = "参考答案无数字"; res.style.color = "var(--dim)"; return; }
      const last = u[u.length-1];
      const hit = a.some(v => Math.abs(v-last) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "✓ 数值与参考答案一致" : "✗ 数值与参考答案不一致";
      res.style.color = hit ? "var(--ok)" : "var(--bad)";
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:pts.map((_,i)=>i),ok:"ok"}; save(); render(); };
    if (none) none.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:[],ok:"ok"}; save(); render(); };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        if (window.lbSubmit) lbSubmit(state.t0 ? (Date.now() - state.t0) : 0);
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
        if (window.lbOpen) setTimeout(function(){ lbOpen(); }, 600);
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.awardXP && answered > 0) awardXP(20 + Math.min(80, answered), true);
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.points && x.points.length) ? x.points : [{m:1}];
    const tot = pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const got = (r && r.checked) ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  app.innerHTML = `<div class="card done">
      <h2>选择题 ${right.length} / ${mcq.length} 正确（${pct}%）</h2>
      <div class="stats">
        <div class="stat"><b>${right.length}</b><span>选择题答对</span></div>
        <div class="stat"><b>${wrong.length}</b><span>选择题答错</span></div>
        <div class="stat"><b>${earnedM}</b><span>简答得分 / ${totalM}</span></div>
        <div class="stat"><b>${todo.length}</b><span>未做</span></div>
      </div>
      ${weak.length ? `<div><b>简答没拿满的题（${weak.length}）：</b><ol class="wronglist">${weak.map(x => `<li>${esc(x.topic)}</li>`).join("")}</ol></div>` : ""}
      ${wrong.length ? `<div><b>选择题错题：</b><ol class="wronglist">${wrong.map(x => `<li>${esc(x.topic)} — ${esc((x.stem||"").slice(0,60))}…</li>`).join("")}</ol></div>` : ""}
      <div class="actions">
        ${needRedo.length ? `<button class="btn" id="redo">只练错题（${needRedo.length} 题）</button>` : ""}
        <button class="btn ghost" id="showlb">${T("lb")}</button>
        <button class="btn ghost" id="again">${T("again")}</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← 回到科目列表</a>
      </div></div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    state.order = wrongIds.map(id => DATA.questions.findIndex(x => x.id === id)).filter(i => i >= 0);
    wrongIds.forEach(id => delete state.answers[id]);
    state.idx = 0; save(); render();
  };
  const showlb = document.getElementById("showlb");
  if (showlb) showlb.onclick = () => { if (window.lbOpen) lbOpen(); };
  document.getElementById("again").onclick = () => {
    state = {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
    save(); render();
  };
}

document.addEventListener("keydown", e => {
  if (MULTI && state.setup && !state.started) {
    if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("startmix"); if (b && b.onclick) b.onclick(); }
    return;
  }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") document.getElementById("nav").classList.remove("on"); return; }
  const q = state.order.length ? DATA.questions[state.order[state.idx]] : null;
  if (e.key === "ArrowRight" || e.key === "j") { if (state.idx < state.order.length-1){ state.idx++; save(); render(); } return; }
  if (e.key === "ArrowLeft" || e.key === "k") { if (state.idx > 0){ state.idx--; save(); render(); } return; }
  if (e.key === "g" || e.key === "G") { document.getElementById("nav").classList.contains("on") ? document.getElementById("nav").classList.remove("on") : openNav(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state.order && state.idx < state.order.length - 1) { state.idx++; save(); render(); }
    else showResult();
    return;
  }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); showResult(); return; }
  if (!q || q.type !== "mcq") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= (q.options || []).length) {
    if (!state.answers[q.id]) {
      state.answers[q.id] = {chosen:n-1, ok: n-1 === q.answer ? "ok" : "bad"};
      save(); render();
    }
  }
});

const REVIEW_KEY = "dsh-review-v1";
const GAPS = [1, 3, 7];
function reviewDb(){ try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); } catch(e){ return {}; } }
function reviewSave(db){ try { localStorage.setItem(REVIEW_KEY, JSON.stringify(db)); } catch(e){} }
function reviewMark(slug, qid, correct){
  const db = reviewDb(), id = slug + "::" + qid, now = Date.now();
  if (correct) {
    const it = db[id];
    if (!it) return;
    const st = (it.stage || 0) + 1;
    if (st >= GAPS.length) delete db[id];
    else { it.stage = st; it.due = now + GAPS[st]*864e5; it.last = now; }
  } else {
    const old = db[id] || {};
    db[id] = {stage:0, due: now + GAPS[0]*864e5, added: old.added || now, last: now};
  }
  reviewSave(db);
}
function numsOf(t){ return (String(t).match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

const LOG_KEY = "dsh-log-v1";
function logAnswer(slug, qid, ok, diff, ty){
  try {
    let arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    arr.push({t: Date.now(), s: slug, q: qid, ok: ok ? 1 : 0, d: diff || "", ty: ty || ""});
    if (arr.length > 3000) arr = arr.slice(-3000);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function navState(qi){
  const q = DATA.questions[qi], a = state.answers[q.id];
  if (!a) return "";
  if (q.type === "mcq") return a.ok === "ok" ? "ok" : "bad";
  const pts = q.points || [{m:1}], c = (a.checked || []).length;
  if (c >= pts.length) return "ok";
  if (c > 0) return "part";
  return "";
}
function openNav(){
  const grid = document.getElementById("navgrid");
  grid.innerHTML = state.order.map((qi, pos) =>
    `<button class="${navState(qi)}" data-pos="${pos}">${pos+1}</button>`).join("");
  grid.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.idx = +b.dataset.pos; save();
    document.getElementById("nav").classList.remove("on"); render();
  });
  document.getElementById("nav").classList.add("on");
}

let timerId = null;
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tickClock(){
  const el = document.getElementById("clock");
  if (!state.deadline) { if (el) el.style.display = "none"; return; }
  const left = state.deadline - Date.now();
  if (el) { el.style.display = ""; el.textContent = "⏱ " + fmtLeft(left);
            el.style.color = left < 5*60000 ? "var(--bad)" : "var(--dim)"; }
  if (left <= 0) { clearInterval(timerId); timerId = null; state.deadline = 0; save(); showResult(); }
}
function startExam(){
  const def = DATA.examMin || 60;
  const v = prompt("考试模式：倒计时多少分钟？（到点自动收卷）", def);
  if (v === null) return;
  const mins = parseInt(v, 10);
  if (!mins || mins <= 0) return;
  state.deadline = Date.now() + mins*60000; save();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
  tickClock();
}


load(); render();
</script>
