<script>/* theme boot: 在首次绘制前定好主题，避免闪烁 */
(function(){try{
  var m=(location.search.match(/[?&]theme=(light|dark|system)/)||[])[1]||null;
  var s=m||localStorage.getItem("dsh-theme")||"system";
  var r=document.documentElement;
  if(s==="light"||s==="dark") r.setAttribute("data-theme",s);
  r.setAttribute("data-theme-mode",s);
}catch(e){}})();</script>

/* ══ design tokens ═══════════════════════════════════════ */

}

/* ══ foundations ═════════════════════════════════════════ */
:root{
  /* type */
  --font-sans:"Geist Variable","Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"Geist Mono Variable","Geist Mono",ui-monospace,SFMono-Regular,"SF Mono",
    Menlo,Consolas,monospace;
  --text-2xl:28px; --text-xl:20px; --text-lg:17px; --text-md:15px;
  --text-base:14px; --text-sm:12px; --text-xs:11px;
  --lh-tight:1.25; --lh-snug:1.45; --lh-base:1.6; --lh-prose:1.75;
  /* space (4px scale) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  /* radius */
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-full:999px;
  /* layout */
  --page-max:1120px;
  --read-max:760px;
  --page-x:32px;
  /* motion */
  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:.12s; --norm:.2s;
}

@font-face{
  font-family:"Geist Variable";
  src:url("fonts/geist-latin.woff2") format("woff2-variations"),
      url("fonts/geist-latin.woff2") format("woff2");
  font-weight:400 700; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,
    U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Geist Mono Variable";
  src:url("fonts/geist-mono-latin.woff2") format("woff2-variations"),
      url("fonts/geist-mono-latin.woff2") format("woff2");
  font-weight:400 600; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,
    U+2212,U+2215,U+FEFF,U+FFFD;
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font-sans);
  font-size:var(--text-base);
  line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv11";
  font-synthesis-weight:none;
  transition:background-color var(--norm) var(--ease),color var(--norm) var(--ease);
}
body,body *{-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{letter-spacing:-.015em;line-height:var(--lh-tight);font-weight:600}
h1{font-size:var(--text-2xl)}
h2{font-size:var(--text-xl)}
h3{font-size:var(--text-md)}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
::selection{background:var(--accent-soft);color:var(--foreground)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
hr{border:0;border-top:1px solid var(--border);margin:var(--s6) 0}
code,kbd,samp{font-family:var(--font-mono);font-size:.92em}
kbd{background:var(--surface-secondary);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:var(--r-sm);padding:1px 6px;color:var(--muted);font-size:11px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* 数字统一等宽，避免跳动 */
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ══ 共享顶栏（首页 / 商城 / 错题本）═════════════════════ */
.topbar{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--background) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border)}
.topbar-in{max-width:var(--page-max);margin:0 auto;padding:0 var(--page-x);
  height:56px;display:flex;align-items:center;gap:var(--s4)}
.brand{display:inline-flex;align-items:center;gap:9px;color:var(--foreground);
  text-decoration:none;font-weight:600;font-size:13.5px;letter-spacing:-.01em;flex:0 0 auto}
.brand:hover{text-decoration:none}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);
  color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;
  font-weight:600;font-family:var(--font-mono);line-height:1}
.nav{display:flex;align-items:center;gap:1px;min-width:0;overflow:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:12.5px;color:var(--muted);padding:5px 9px;border-radius:var(--r-sm);
  text-decoration:none;white-space:nowrap;
  transition:color var(--fast) var(--ease),background-color var(--fast) var(--ease)}
.nav a:hover{color:var(--foreground);background:var(--surface-secondary);text-decoration:none}
.nav a.on{color:var(--foreground);font-weight:500}
.grow{flex:1}
@media (max-width:720px){
  .topbar-in{height:auto;flex-wrap:wrap;gap:8px;padding:9px var(--page-x) 0}
  .brand .bname{display:none}
  .topbar .nav{order:10;width:100%;margin:2px calc(-1 * var(--page-x)) 0;
    padding:0 var(--page-x) 8px;border-top:1px solid var(--border)}
  .topbar .themectl{margin-left:auto}
}

/* 分段控件选中态 */
.seg button.on{border-color:var(--foreground)!important}

/* ══ components ══════════════════════════════════════════ */
.btn,.btn-ghost,.btn2{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:13px;font-weight:500;line-height:1;
  height:34px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color var(--fast) var(--ease),border-color var(--fast) var(--ease),
    color var(--fast) var(--ease),opacity var(--fast) var(--ease);
  text-decoration:none;
}
.btn{
  background:var(--primary);color:var(--primary-foreground);
  border-color:var(--primary);
}
.btn:hover{opacity:.88;text-decoration:none}
.btn:active{transform:translateY(.5px)}
.btn:disabled,.btn[disabled]{background:var(--surface-secondary);color:var(--muted);
  border-color:var(--border);opacity:1;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost,.btn.ghost,.btn2{
  background:var(--surface);color:var(--foreground);border-color:var(--border);
}
.btn-ghost:hover,.btn.ghost:hover,.btn2:hover{
  background:var(--surface-secondary);border-color:var(--border-strong);text-decoration:none;
}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed;background:var(--surface)}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--r-sm)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{opacity:.9;color:#fff}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s5);box-shadow:none;
}
.input,input[type="text"],input[type="search"],input[type="number"],textarea,select{
  font-family:inherit;font-size:var(--text-base);color:var(--foreground);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 11px;outline:none;transition:border-color var(--fast) var(--ease),
    box-shadow var(--fast) var(--ease);
}
.input:hover,input:hover,textarea:hover,select:hover{border-color:var(--border-strong)}
.input:focus,input:focus,textarea:focus,select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
::placeholder{color:var(--muted);opacity:.85}

.chip,.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--text-xs);line-height:1.6;font-weight:500;
  padding:2px 8px;border-radius:var(--r-sm);
  background:var(--surface-secondary);border:1px solid var(--border);color:var(--muted);
  white-space:nowrap;
}

/* 主题切换控件 */
.themectl{display:inline-flex;align-items:center;gap:2px;padding:2px;
  background:var(--surface-secondary);border:1px solid var(--border);border-radius:var(--r-sm)}
.themectl button{
  font:inherit;font-size:11.5px;font-weight:500;line-height:1;height:24px;padding:0 9px;
  border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;
  transition:background-color var(--fast) var(--ease),color var(--fast) var(--ease);
}
.themectl button:hover{color:var(--foreground)}
.themectl button.on{background:var(--surface);color:var(--foreground);
  box-shadow:var(--shadow-sm)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);height:28px;padding:0 10px;cursor:pointer;
  transition:color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.themebtn:hover{color:var(--foreground);border-color:var(--border-strong)}
.themebtn b{color:var(--foreground);font-weight:500}

/* 浅色下别让深色主题的重阴影漏过来 */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .submit-card{box-shadow:var(--shadow-lg)}
  :root:not([data-theme="dark"]) .lb-fab{box-shadow:var(--shadow-md)}
  :root:not([data-theme="dark"]) .lang-btn{box-shadow:var(--shadow-sm)}
}
:root[data-theme="light"] .submit-card{box-shadow:var(--shadow-lg)}
:root[data-theme="light"] .lb-fab{box-shadow:var(--shadow-md)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:900px){ :root{--page-x:20px} }
@media (max-width:560px){ :root{--page-x:16px} }

*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;min-height:100vh}
header{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--background) 88%,transparent);
  -webkit-backdrop-filter:saturate(150%) blur(12px);backdrop-filter:saturate(150%) blur(12px);
  border-bottom:1px solid var(--border);padding:9px 0 0}
.bar{max-width:var(--page-max);margin:0 auto;padding:0 var(--page-x);display:flex;
  align-items:center;gap:7px;flex-wrap:wrap;min-height:34px}
.bar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.bar .meta{color:var(--muted);font-size:12px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--r-sm);padding:3px 8px;font-size:11.5px;
  color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  white-space:nowrap;text-decoration:none}
a.pill:hover{border-color:var(--border-strong);color:var(--foreground);text-decoration:none}
.progress{height:3px;background:var(--surface-secondary);border-radius:99px;overflow:hidden;
  margin:9px 0 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
  transition:width .3s var(--ease)}
main{width:100%;max-width:860px;margin:0 auto;padding:var(--s6) var(--page-x) 96px;flex:1 0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s5)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip.easy{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,var(--border));
  background:var(--success-soft)}
.chip.medium{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,var(--border));
  background:var(--warning-soft)}
.chip.hard{color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,var(--border));
  background:var(--error-soft)}
.stem{font-size:17px;line-height:1.7;margin:4px 0 16px;white-space:pre-wrap;
  color:var(--foreground);letter-spacing:-.005em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--border);color:var(--foreground);
  border-radius:var(--r-sm);padding:12px 14px;font:inherit;font-size:14.5px;line-height:1.6;
  cursor:pointer;transition:border-color var(--fast) var(--ease),
  background-color var(--fast) var(--ease)}
.opt:hover:not(:disabled){border-color:var(--border-strong);background:var(--surface-secondary)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 22px;height:22px;border-radius:4px;background:var(--surface-secondary);
  border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:600;
  color:var(--muted);font-family:var(--font-mono)}
.opt.correct{border-color:var(--success);background:var(--success-soft)}
.opt.correct .k{background:var(--success);color:var(--surface);border-color:var(--success)}
.opt.wrong{border-color:var(--error);background:var(--error-soft)}
.opt.wrong .k{background:var(--error);color:var(--surface);border-color:var(--error)}
textarea{width:100%;min-height:96px;background:var(--surface);color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font:inherit;
  font-size:14px;line-height:1.65;resize:vertical}
.exp{margin-top:14px;padding:12px 14px;border-left:2px solid var(--accent);

  font-size:13.5px;line-height:1.7;display:none}
.exp.show{display:block}
.exp b{color:var(--accent-text)}
.src{margin-top:8px;color:var(--muted);font-size:11.5px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button.btn{height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--primary);
  background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:13px;
  font-weight:500;cursor:pointer;transition:opacity var(--fast) var(--ease)}
button.btn:hover:not(:disabled){opacity:.88}
button.btn.ghost{background:var(--surface);color:var(--foreground);border-color:var(--border)}
button.btn.ghost:hover:not(:disabled){background:var(--surface-secondary);
  border-color:var(--border-strong)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.done h2{margin:0 0 6px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.stat{background:var(--surface-secondary);border:1px solid var(--border);border-radius:var(--r-sm);

.stat b{display:block;font-size:22px;line-height:1.2;font-family:var(--font-mono);

.stat span{color:var(--muted);font-size:11.5px}
.wronglist{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.wronglist li{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 16px 30px;line-height:1.7}

.chip.warn{border-color:#f5a62366;color:#f5a623}
.muted{color:var(--dim);font-size:13px}
.pts{display:grid;gap:8px;margin-top:12px}
.pt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.pt.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card2))}
.pt input{margin-top:3px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--ok)}
.pt span{flex:1;min-width:0}
.pt em{color:var(--dim);font-style:normal;font-size:12px;white-space:nowrap}
.mine{margin-top:14px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
.mine div{margin-top:6px;white-space:pre-wrap;color:var(--dim)}
.fullans{margin-top:10px;font-size:14px}
.fullans summary{cursor:pointer;color:var(--accent)}
.fullans div{margin-top:8px;white-space:pre-wrap;color:var(--dim)}
.setup{max-width:760px;margin:0 auto}
.setup-head{margin:4px 0 20px}
.setup-head h2{margin:0 0 6px;font-size:22px}

      g.gain.exponentialRampToValueAtTime(vol||0.06, AC.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(dur||0.12));
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime+(dur||0.12)+0.02);
    }catch(e){}
  }

  function readInv(){
    var d={owned:[],equipped:{theme:"",title:""},uses:{}};
    try{ var o=JSON.parse(localStorage.getItem(INV_KEY)||'null'); if(o){ d.owned=o.owned||[]; d.equipped=o.equipped||{theme:"",title:""}; d.uses=o.uses||{}; } }catch(e){}

  }
  function saveInv(d){ try{ localStorage.setItem(INV_KEY,JSON.stringify(d)); }catch(e){} }
  function readBuffs(){ var d={xp2Until:0}; try{ d=JSON.parse(localStorage.getItem(BUFF_KEY)||'null')||d; }catch(e){} return d; }
  function saveBuffs(d){ try{ localStorage.setItem(BUFF_KEY,JSON.stringify(d)); }catch(e){} }

  function buy(id){
    var item=null; SHOP.forEach(function(x){ if(x.id===id) item=x; });
    if(!item) return {ok:false,msg:"没有这件商品"};
    var c=readCoins(), inv=readInv();
    if(item.t!=="use" && inv.owned.indexOf(id)>=0) return {ok:false,msg:"已经拥有了"};
    var isDust = item.cur==="dust";
    var bal = isDust ? (c.dust||0) : (c.n||0);
    if(bal < item.p) return {ok:false,msg:(isDust?"星尘":"金币")+"不够，还差 "+(item.p-bal)};
    if(isDust){ c.dust=(c.dust||0)-item.p; } else { c.n=(c.n||0)-item.p; }
    saveCoins(c);
    if(item.t==="use"){ inv.uses[id]=(inv.uses[id]||0)+1; }
    else { inv.owned.push(id); }
    saveInv(inv);
    if(item.t==="theme"){ inv.equipped.theme=item.v; saveInv(inv); applyTheme(); }
    if(item.t==="title"){ inv.equipped.title=item.v; saveInv(inv); }
    if(item.t==="buff"){ var b=readBuffs(); b.xp2Until=Date.now()+30*60000; saveBuffs(b); }
    return {ok:true,msg:"已购买："+item.n};
  }

  function todayCount(){
    var d0=new Date(); d0.setHours(0,0,0,0);
    return log().filter(function(x){ return x.t>=d0.getTime(); }).length;
  }
  function streakDays(){
    var days={}, d0=new Date(); d0.setHours(0,0,0,0), t0=d0.getTime();
    log().forEach(function(x){ var d=new Date(x.t); d.setHours(0,0,0,0); days[d.getTime()]=1; });
    var gaps=shieldCount(), n=0, c=t0, used=0;
    while(true){
      if(days[c]){ n++; c-=864e5; continue; }
      if(c===t0){ c-=864e5; continue; }
      if(used<gaps){ used++; c-=864e5; continue; }
      break;
    }
    return n;
  }

  function checkBadges(){
    var g=db(), L=log();
    if(L.length>=1) unlock('first');
    if((g.best||0)>=5) unlock('combo5');
    if((g.best||0)>=10) unlock('combo10');
    if(todayCount()>=GOAL) unlock('daily');
    if(streakDays()>=3) unlock('streak3');
    if(streakDays()>=7) unlock('streak7');
    try{
      var rv=JSON.parse(localStorage.getItem('dsh-review-v1')||'{}');
      if(L.length>10 && Object.keys(rv).length===0) unlock('review');
    }catch(e){}
    try{
      var cards=document.querySelectorAll('[data-slug][data-total]');
      for(var i=0;i<cards.length;i++){
        var c=cards[i], sl=c.dataset.slug, tot=+c.dataset.total;
        var st=JSON.parse(localStorage.getItem('dsh-quiz-'+sl)||'null');
        if(st && st.answers && tot && Object.keys(st.answers).length>=tot){ unlock('subject'); break; }
      }
    }catch(e){}
  }

  function awardXP(base, ok){
    var g=db();
    if(ok){ g.combo=(g.combo||0)+1; } else { g.combo=0; }
    var mult = ok ? Math.min(2, 1 + 0.1*Math.max(0, (g.combo||1)-1)) : 1;
    var buffs=readBuffs(), dbl = buffs.xp2Until && Date.now()<buffs.xp2Until ? 2 : 1;
    var gain = ok ? Math.round(base*mult*dbl) : Math.max(1, Math.round(base*0.2));
    var before=levelOf(g.xp||0);
    g.xp=(g.xp||0)+gain;
    g.best=Math.max(g.best||0, g.combo||0);
    save(g);
    var coin = Math.max(1, Math.round(gain*0.5));
    var crit = ok && Math.random()<0.12;
    if(crit) coin*=2;
    addCoins(coin);
    if(ok) beep(crit?1180:660, 0.1, "sine", crit?0.08:0.05); else beep(180,0.14,"sawtooth",0.05);
    toast('+'+gain+' XP · +'+coin+' 币'+(crit?' · 暴击':"")+(ok&&g.combo>1?' · 连对 '+g.combo:'')+(dbl>1?' · ×2':''), ok);
    var after=levelOf(g.xp);
    if(after>before){ setTimeout(function(){ toast('🎉 升到 Lv.'+after, true); levelUpSound(); }, 450); }
    checkBadges();
    if(window.__refreshProfile) window.__refreshProfile();
  }

  function applyI18n(){
    if(window.LANG()==="zh") return;
    var walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n, changed=[];
    while((n=walker.nextNode())){
      var s=(n.nodeValue||"").trim(); if(!s) continue;
      if(I18N[s]){ n.nodeValue=n.nodeValue.replace(s, I18N[s]); continue; }
      var nv=n.nodeValue, did=false;
      for(var si=0; si<I18N_SUB.length; si++){
        if(nv.indexOf(I18N_SUB[si][0])>=0){ nv=nv.split(I18N_SUB[si][0]).join(I18N_SUB[si][1]); did=true; }
      }
      if(did){ n.nodeValue=nv; continue; }
      for(var i=0;i<I18N_PAT.length;i++){
        if(I18N_PAT[i][0].test(s)){ n.nodeValue=n.nodeValue.replace(s, s.replace(I18N_PAT[i][0], I18N_PAT[i][1])); break; }
      }
    }
    document.querySelectorAll("[placeholder]").forEach(function(el){
      var p=el.getAttribute("placeholder");
      if(I18N[p]) el.setAttribute("placeholder", I18N[p]);
    });
    document.querySelectorAll("[title]").forEach(function(el){
      var t2=el.getAttribute("title");
      if(I18N[t2]) el.setAttribute("title", I18N[t2]);
    });
  }

  function awardForQ(id, diff, type, ok){
    var base = type==='short' ? ({easy:12,medium:16,hard:22}[diff]||16)
                              : ({easy:8, medium:10,hard:14}[diff]||10);
    var S=seen(), e=S[id]||{n:0,right:false,sealed:false}, mul=1, note="";
    if(e.right && ok){
      if(e.sealed || e.n>=3){ mul=0; note="已掌握，不再加分"; }
      else { mul=0.3; note="重做已会的题，经验 ×0.3"; }
    } else if(e.right && !ok){
      mul=1; note="";
    } else if(!e.right && ok && e.n>0){
      mul=1; note="纠错 + 全额";
    }
    e.n=(e.n||0)+1;
    if(ok){ e.right=true; if(e.n>=3 && mul===0) e.sealed=true; }
    S[id]=e; saveSeen(S);
    if(mul===0){ toast(note+" · 去刷没掌握的题", false); return; }
    var gain = Math.round(base*mul);
    if(note) toast(note, true);
    awardXP(gain, ok);

  function qseed(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }

      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      Q={date:todayKey(), list:pool.slice(0,3).map(function(x){return x.id;}), claimed:[]};

  function questProgress(){

    var maxCombo=0, cur=0;
    L.slice().sort(function(a,b){return a.t-b.t;}).forEach(function(x){ if(x.ok){ cur++; maxCombo=Math.max(maxCombo,cur);} else cur=0; });
    var hard=L.filter(function(x){ return x.ok && x.d==="hard"; }).length;
    var short=L.filter(function(x){ return x.ty==="short"; }).length;

  /* ---- 好友榜：不用服务器，靠“战绩码”互传 ---- */
  var FKEY="dsh-friends-v1", NKEY="dsh-nick", AKEY="dsh-api";

  function apibase(){ try{ return (localStorage.getItem(AKEY)||DEFAULT_API||"").replace(/\/$/,""); }catch(e){ return ""; } }

  function loadBoard(){

      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok || !d.list || !d.list.length) return;
        var me=nick()||"我";
        box.innerHTML=d.list.map(function(x,i){
          return '<div class="rrow'+(x.name===me?' me':'')+'"><span class="rn">'+(i+1)+'</span>'+
                 '<span class="rname">'+x.name+(x.name===me?'（我）':'')+'</span>'+
                 '<span class="rp">'+x.pct+'%</span></div>';
        }).join("");
      })
      .catch(function(){});
  }
  function pushScore(){
    if(!apibase()) return {ok:false,msg:"还没设置服务器地址"};
    var rec={}; try{ rec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    if(rec.date!==todayKey()) return {ok:false,msg:"先做完今日挑战"};

    return {ok:true,msg:"已提交"};
  }
  window.loadBoard=loadBoard; window.pushScore=pushScore; window.apibase=apibase; window.setApi=setApi;
  function b64e(str){ try{ return btoa(unescape(encodeURIComponent(str))).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_"); }catch(e){ return ""; } }
  function b64d(str){ try{ return decodeURIComponent(escape(atob(str.replace(/-/g,"+").replace(/_/g,"/")))); }catch(e){ return ""; } }
  function nick(){ try{ return localStorage.getItem(NKEY)||""; }catch(e){ return ""; } }
  function setNick(v){ try{ localStorage.setItem(NKEY, v); }catch(e){} }
  function friends(){ try{ return JSON.parse(localStorage.getItem(FKEY)||"[]"); }catch(e){ return []; } }
  function saveFriends(a){ try{ localStorage.setItem(FKEY, JSON.stringify(a.slice(0,60))); }catch(e){} }

  function myCode(){
    var rec={}; try{ rec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    if(rec.date!==todayKey()) return {ok:false,msg:"先做完今日挑战"};
    var g=db();
    return {ok:true, code:b64e(JSON.stringify({v:1,d:rec.date,p:rec.best,n:rec.answer||21,
      name:(nick()||"我"), xp:g.xp||0}))};
  }
  function addCode(str){
    var raw=b64d((str||"").trim());
    if(!raw) return {ok:false,msg:"码不对"};
    var o; try{ o=JSON.parse(raw); }catch(e){ return {ok:false,msg:"码不对"}; }
    if(!o || o.v!==1 || !o.d || o.p===undefined) return {ok:false,msg:"码不对"};
    var list=friends();
    list=list.filter(function(x){ return !(x.d===o.d && x.name===o.name); });
    list.push({d:o.d, p:o.p, n:o.n||0, name:String(o.name||"同学").slice(0,12), xp:o.xp||0, t:Date.now()});
    saveFriends(list);
    return {ok:true,msg:"已加入 "+String(o.name||"同学").slice(0,12)+" 的 "+o.p+"%"};
  }
  window.myCode=myCode; window.addCode=addCode; window.nick=nick; window.setNick=setNick;

  function renderBoard(host){
    if(!host) return;
    var g=db(), L=log();
    var day=document.getElementById("boardday");
    if(day) day.textContent = todayKey();

    var myRec={}; try{ myRec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    var rows=[];
    if(myRec.date===todayKey()) rows.push({name:nick()||"我", p:myRec.best||0, me:true});
    friends().filter(function(x){ return x.d===todayKey(); }).forEach(function(x){
      rows.push({name:x.name, p:x.p, me:false});
    });

    var list = rows.length ? rows.map(function(r,i){
      return '<div class="rankrow'+(r.me?' me':'')+'"><span class="rk">'+(i+1)+'</span>'+
        '<span class="rname">'+r.name+(r.me?'（我）':'')+'</span>'+
        '<span class="rpct">'+r.p+'%</span></div>';

    var days={}, dayOk={};
    L.forEach(function(x){ var d=new Date(x.t); d.setHours(0,0,0,0);
      var k=d.getTime(); days[k]=(days[k]||0)+1; dayOk[k]=(dayOk[k]||0)+(x.ok?1:0); });
    var last7=Object.keys(days).map(function(k){
      return {ts:+k, pct:Math.round(dayOk[k]/days[k]*100)}; })
      .sort(function(a,b){ return b.ts-a.ts; }).slice(0,7).reverse();
    var spark = last7.length>1 ? ('<div class="spark">'+last7.map(function(x){
        return '<i style="height:'+Math.max(3,Math.round(x.pct*0.3))+'px" title="'+x.pct+'%"></i>';
      }).join("")+'<span class="sparklab">近 7 天正确率</span></div>') : "";

    host.innerHTML =
      '<div class="ranklist" id="rankbox">'+list+'</div>'+
      spark +
      '<div class="codebar"><button class="btn2" id="mecode">复制我的战绩码</button>'+
      '<input id="friendcode" placeholder="粘贴同学的战绩码">'+
      '<button class="btn2" id="addcode">加入</button>'+
      (apibase() ? '<button class="btn2" id="pushscore">提交到服务器</button>' : '')+'</div>';
  }
  window.__renderBoard=renderBoard;

  function renderProfile(){
    var host=document.getElementById("profile");
    if(!host) return;
    var g=db(), xp=g.xp||0, lv=levelOf(xp), nx=nextAt(xp), prev=LEVELS[lv-1]||0;
    var pct = nx ? Math.round((xp-prev)/(nx-prev)*100) : 100;
    var tc=todayCount(), st=streakDays(), b=bdb(), inv=readInv(), c=readCoins();

             (BADGE_SVG[x.id]||"")+'</span>';
    }).join("");

      '<div class="ovc">'+
        '<span class="ovl">等级'+title+'</span>'+
        '<span class="ovn">'+lv+'<small>Lv</small></span>'+
        '<div class="xpbar"><i style="width:'+pct+'%"></i></div>'+
        '<span class="ovh">'+(nx?'还差 '+(nx-xp)+' XP 升级':'已满级')+' · 共 '+xp+' XP</span>'+
      '</div>'+
      '<div class="ovc">'+
        '<span class="ovl">今日</span>'+
        '<span class="ovn">'+tc+'<small>/'+GOAL+'</small></span>'+

        '<span class="ovl">已开始</span>'+
        '<span class="ovn" id="ovStarted">—</span>'+

      '<div class="ovc">'+
        '<span class="ovl">已做题</span>'+

/* ── 主题（浅色 / 深色 / 跟随系统）──────────────────────── */
(function(){
  var KEY="dsh-theme";
  function mode(){
    try{var v=localStorage.getItem(KEY); return (v==="light"||v==="dark")?v:"system";}
    catch(e){return "system";}
  }
  var LABEL={light:"浅色",dark:"深色",system:"自动"};
  function paint(box){
    var m=mode();
    if(box.getAttribute("data-theme-ctl")==="cycle"){
      box.innerHTML='<button class="themebtn" data-cycle="1" title="外观：'+LABEL[m]+
        '（点击切换 浅色 / 深色 / 自动）">外观 <b>'+LABEL[m]+'</b></button>';
    }else{
      box.innerHTML=['light','dark','system'].map(function(k){
        return '<button data-mode="'+k+'" class="'+(k===m?"on":"")+'">'+LABEL[k]+'</button>';
      }).join("");
    }
  }
  function apply(m){
    var r=document.documentElement;
    if(m==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",m);
    r.setAttribute("data-theme-mode",m);
    document.querySelectorAll("[data-theme-ctl]").forEach(paint);
  }
  function set(m){
    try{localStorage.setItem(KEY,m);}catch(e){}
    apply(m);
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest("[data-mode],[data-cycle]") : null;
    if(!b) return;
    if(b.hasAttribute("data-cycle")){
      var order=["system","light","dark"], cur=mode();
      set(order[(order.indexOf(cur)+1)%3]);
    }else{ set(b.getAttribute("data-mode")); }
    ev.preventDefault();
  });
  try{
    var mq=window.matchMedia("(prefers-color-scheme: dark)");
    var onSys=function(){ if(mode()==="system") apply("system"); };
    if(mq.addEventListener) mq.addEventListener("change",onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }catch(e){}
  window.DSH_THEME={set:set,mode:mode};
  document.querySelectorAll("[data-theme-ctl]").forEach(paint);
})();
</script>

−15，合并得 2x²+7x−15。别漏了 −3×5 的负号。", "source": "Chapter 5 Products and factors · 5.06 Expanding binomial products (Ex 5.06)", "weak": false}, {"id": "maths53-006", "topic": "代数式 · 非首一二次三项式因式分解", "difficulty": "hard", "type": "mcq", "stem": "Factorise 6x² + 11x − 35.", "options": ["(2x + 7)(3x − 5)", "(2x − 7)(3x + 5)", "(3x − 7)(2x + 5)", "(6x − 5)(x + 7)"], "answer": 0, "explanation": "要凑出 6x² 与 −35，且交叉项为 +11x：6×(−35)=−210，需两数积 −210、和 +11，即 21 与 −10。于是 6x²+21x−10x−35 = 3x(2x+7)−5(2x+7) = (2x+7)(3x−5)。", "source": "Chapter 5 Products and factors · 5.09 Factorising non-monic quadratic trinomials (Ex 5.09)", "weak": false}, {"id": "maths53-007", "topic": "代数式 · 代数分式化简", "difficulty": "medium", "type": "short", "stem": "Simplify (x² − 9)/(x² + x − 12), stating any restrictions on x.", "options": [], "answer": "(x + 3)/(x + 4), where x ≠ 3 and x ≠ −4.", "explanation": "分子是平方差 (x−3)(x+3)，分母分解为 (x+4)(x−3)，约去 (x−3) 得 (x+3)/(x+4)。约掉的因式对应的 x 值必须排除：x≠3、x≠−4。", "source": "Chapter 5 Products and factors · 5.11 Factorising algebraic fractions (Ex 5.11)", "points": [{"t": "(x + 3)/(x + 4), where x ≠ 3 and x ≠ −4.", "m": 1}], "weak": false}, {"id": "maths53-008", "topic": "指数 · 幂的乘方", "difficulty": "easy", "type": "mcq", "stem": "Simplify (2x³)⁴.", "options": ["2x¹²", "16x¹²", "16x⁷", "8x¹²"], "answer": 1, "explanation": "系数与字母都要取四次方：2⁴=16，(x³)⁴=x¹²，所以是 16x¹²。常见错误是只把指数相乘却漏掉 2 的幂。", "source": "Chapter 5 Indices · 5.01 Index laws (Ex 5.01)", "weak": false}, {"id": "maths53-009", "topic": "指数 · 分数与负指数", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 27^(−2/3).", "options": ["−1/9", "1/6", "1/9", "−9"], "answer": 2, "explanation": "27^(1/3)=3，再平方得 9；负指数取倒数得 1/9。注意负指数只表示倒数，不会让结果变负数。", "source": "Chapter 5 Indices · 5.02 Fractional indices (Ex 5.02)", "weak": false}, {"id": "maths53-010", "topic": "指数 · 分数指数综合", "difficulty": "hard", "type": "short", "stem": "Simplify (8x⁶y⁻³)^(2/3), giving your answer with positive indices.", "options": [], "answer": "4x⁴/y²  (8^(2/3) = 4, (x⁶)^(2/3) = x⁴, (y⁻³)^(2/3) = y⁻² = 1/y²)", "explanation": "把 2/3 分别乘到每个指数上：8^(2/3)=4，x^(6×2/3)=x⁴，y^(−3×2/3)=y⁻²，再用负指数法则写成 4x⁴/y²。", "source": "Chapter 5 Indices · 5.02 Fractional indices / 5.04 Multiplying and dividing algebraic fractions", "points": [{"t": "4x⁴/y²  (8^(2/3) = 4, (x⁶)^(2/3) = x⁴, (y⁻³)^(2/3) = y⁻² = 1/y²)", "m": 1}], "weak": false}, {"id": "maths53-011", "topic": "对数 · 对数定义", "difficulty": "easy", "type": "mcq", "stem": "Evaluate log₃ 81.", "options": ["1/4", "3", "27", "4"], "answer": 3, "explanation": "log₃81 问的是“3 的几次方等于 81”，3⁴=81，所以答案是 4。不要把对数当成除法 81÷3。", "source": "Chapter 7 Equations and logarithms · 7.09 Logarithms (p.270)", "weak": false}, {"id": "maths53-012", "topic": "对数 · 对数法则", "difficulty": "medium", "type": "mcq", "stem": "Evaluate 2 log₃ 6 − log₃ 4.", "options": ["2", "3", "log₃ 8", "log₃ 2"], "answer": 0, "explanation": "先由幂法则得 log₃36，再由商法则得 log₃(36/4)=log₃9=2。系数 2 要先变成指数，不能直接与后面的 4 相减。", "source": "Chapter 7 Equations and logarithms · 7.10 Logarithm laws, Example 20 (p.273)", "weak": false}, {"id": "maths53-013", "topic": "对数 · 指数方程", "difficulty": "medium", "type": "mcq", "stem": "Solve 3ˣ = 243.", "options": ["x = 81", "x = 5", "x = log 3 ÷ log 243", "x = 4"], "answer": 1, "explanation": "两边取对数：x·log3 = log243，x = log243/log3 = 5。也可直接看出 3⁵=243；注意商的方向不能颠倒。", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations, Example 23 (p.274)", "weak": false}, {"id": "maths53-014", "topic": "对数 · 对数方程", "difficulty": "hard", "type": "short", "stem": "Solve log₂ x + log₂ (x − 2) = 3.", "options": [], "answer": "x = 4 (the solution x = −2 is rejected, because the logarithm of a negative number is undefined).", "explanation": "合并左边：log₂[x(x−2)] = 3，即 x²−2x = 8，解得 x = 4 或 x = −2。必须检验定义域：x>0 且 x−2>0，所以只剩 x = 4。", "source": "Chapter 7 Equations and logarithms · 7.11 Exponential and logarithmic equations (Ex 7.11)", "points": [{"t": "x = 4 (the solution x = −2 is rejected, because the logarithm of a negative number is undefined).", "m": 1}], "weak": false}, {"id": "maths53-015", "topic": "二次方程 · 因式分解法", "difficulty": "easy", "type": "mcq", "stem": "Solve x² − 5x − 24 = 0.", "options": ["x = 6 or x = −4", "x = 12 or x = −2", "x = 8 or x = −3", "x = −8 or x = 3"], "answer": 2, "explanation": "找两数积 −24、和 −5：−8 与 3，所以 (x−8)(x+3)=0，x=8 或 x=−3。注意这里是减 24，两数异号，别都写成正。", "source": "Chapter 11 Quadratic equations and the parabola · 11.01 Quadratic equations (Ex 11.01)", "weak": false}, {"id": "maths53-016", "topic": "抛物线 · 对称轴与顶点", "difficulty": "medium", "type": "mcq", "stem": "Find the coordinates of the vertex of the parabola y = 3x² − 12x + 7.", "options": ["(−2, −5)", "(2, 7)", "(2, 5)", "(2, −5)"], "answer": 3, "explanation": "对称轴 x = −b/(2a) = 12/6 = 2；代回 y = 3(4) − 24 + 7 = −5，顶点为 (2, −5)。别把 x=2 直接当成顶点坐标。", "source": "Chapter 11 Quadratic equations and the parabola · 11.08 Axis of symmetry and vertex (Ex 11.08)", "weak": false}, {"id": "maths53-017", "topic": "二次方程 · 求根公式", "difficulty": "hard", "type": "short", "stem": "Solve 2x² + 3x − 7 = 0 using the quadratic formula. Give the answers correct to 2 decimal places.", "options": [], "answer": "x ≈ 1.27 or x ≈ −2.77  (x = (−3 ± √65)/4)", "explanation": "a=2、b=3、c=−7，判别式 b²−4ac = 9+56 = 65，所以 x = (−3 ± √65)/4 ≈ (−3 ± 8.0623)/4，得 1.2656 与 −2.7656，取两位小数为 1.27 与 −2.77。", "source": "Chapter 11 Quadratic equations and the parabola · 11.03 The quadratic formula (Ex 11.03)", "points": [{"t": "x ≈ 1.27 or x ≈ −2.77  (x = (−3 ± √65)/4)", "m": 1}], "weak": false}, {"id": "maths53-018", "topic": "二次方程 · 高次方程", "difficulty": "hard", "type": "short", "stem": "Solve x⁴ − 5x² + 4 = 0.", "options": [], "answer": "x = 1, x = −1, x = 2 or x = −2", "explanation": "令 u = x²，方程化为 u²−5u+4=0，即 (u−1)(u−4)=0，u=1 或 4。再解 x²=1 与 x²=4，得四个解 x=±1、±2；不要只写 x=1 和 2。", "source": "Chapter 11 Quadratic equations and the parabola · 11.05 Higher-order quadratic equations (Ex 11.05)", "points": [{"t": "x = 1, x = −1, x = 2 or x = −2", "m": 1}], "weak": false}, {"id": "maths53-019", "topic": "坐标几何 · 中点公式", "difficulty": "easy", "type": "mcq", "stem": "Find the midpoint of the interval joining A(−3, 5) and B(7, −1).", "options": ["(2, 2)", "(4, 4)", "(5, −3)", "(2, 3)"], "answer": 0, "explanation": "中点坐标是两端坐标的平均值：x = (−3+7)/2 = 2，y = (5−1)/2 = 2。别把中点公式当成两点相减。", "source": "Coordinate Geometry · 3.01 Length, midpoint and gradient of an interval (Ex 3.01, p.62)", "weak": false}, {"id": "maths53-020", "topic": "坐标几何 · 两点间斜率", "difficulty": "easy", "type": "mcq", "stem": "Find the gradient of the line passing through (2, −1) and (6, 7).", "options": ["1/2", "2", "−2", "4"], "answer": 1, "explanation": "m = (y₂−y₁)/(x₂−x₁) = (7−(−1))/(6−2) = 8/4 = 2。分子是 7 减 −1 得 8，符号最容易出错。", "source": "Coordinate Geometry · 3.01 Length, midpoint and gradient of an interval (Ex 3.01, p.62)", "weak": false}, {"id": "maths53-021", "topic": "坐标几何 · 垂直直线的斜率", "difficulty": "easy", "type": "mcq", "stem": "The line L has equation 3x + 4y − 8 = 0. What is the gradient of a line perpendicular to L?", "options": ["−4/3", "−3/4", "4/3", "3/4"], "answer": 2, "explanation": "化成斜截式得 y = −(3/4)x + 2，L 的斜率是 −3/4；垂直直线斜率取负倒数，即 4/3。别忘记变号。", "source": "Coordinate Geometry · 3.02 Parallel and perpendicular lines (Ex 3.02, p.69)", "weak": false}, {"id": "maths53-022", "topic": "坐标几何 · 由两点求直线方程", "difficulty": "hard", "type": "short", "stem": "Find the equation of the line passing through (−2, 3) and (4, 1), giving your answer in the general form ax + by + c = 0.", "options": [], "answer": "x + 3y − 7 = 0", "explanation": "先求斜率 m = (1−3)/(4−(−2)) = −2/6 = −1/3；用点斜式 y−3 = −(1/3)(x+2)，两边乘 3 得 3y−9 = −x−2，整理为 x+3y−7 = 0。代回两点可检验。", "source": "Coordinate Geometry · 3.05 The general form ax + by + c = 0 / 3.07 Finding the equation of a line (p.81–86)", "points": [{"t": "x + 3y − 7 = 0", "m": 1}], "weak": false}, {"id": "maths53-023", "topic": "联立方程 · 消元法", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations x + 3y = 7 and 4x − 3y = 13.", "options": ["x = 2, y = 5", "x = 4, y = −1", "x = 1, y = 4", "x = 4, y = 1"], "answer": 3, "explanation": "两式相加消去 y：5x = 20，x = 4；代回 x+3y=7 得 y = 1。因为 +3y 与 −3y 异号，所以要相加而不是相减。", "source": "Chapter 10 Simultaneous equations · 10.02 The elimination method, Example 2 (p.401)", "weak": false}, {"id": "maths53-024", "topic": "联立方程 · 直线与抛物线交点", "difficulty": "medium", "type": "mcq", "stem": "Find the points of intersection of the parabola y = x² and the line y = x + 2.", "options": ["(2, 4) and (−1, 1)", "(2, 4) only", "(2, 4) and (1, 3)", "(−1, 1) and (2, −4)"], "answer": 0, "explanation": "令 x² = x + 2，得 x²−x−2=0，即 (x−2)(x+1)=0，x=2 或 −1；分别代回求 y 得 (2,4) 与 (−1,1)。两个交点都要写，别只取正根。", "source": "Chapter 11 · 11.09 Non-linear simultaneous equations (Ex 11.09)", "weak": false}, {"id": "maths53-025", "topic": "联立方程 · 应用题", "difficulty": "medium", "type": "short", "stem": "At the school canteen, 3 pies and 2 drinks cost $14.50, while 2 pies and 5 drinks cost $17.00. Find the cost of one pie and one drink.", "options": [], "answer": "A pie costs $3.50 and a drink costs $2.00.", "explanation": "设派为 p、饮料为 d：3p+2d=14.50，2p+5d=17.00。第一式乘 5、第二式乘 2 得 15p+10d=72.50 与 4p+10d=34.00，相减得 11p=38.50，p=3.50，代回得 d=2.00。", "source": "Chapter 10 Simultaneous equations · 10.04 Problems involving simultaneous equations (Ex 10.04)", "points": [{"t": "A pie costs $3.50 and a drink costs $2.00.", "m": 1}], "weak": false}, {"id": "maths53-026", "topic": "函数图像 · 圆", "difficulty": "easy", "type": "mcq", "stem": "State the centre and radius of the circle (x − 3)² + (y + 2)² = 25.", "options": ["Centre (−3, 2), radius 12.5", "Centre (3, −2), radius 5", "Centre (3, −2), radius 25", "Centre (−3, 2), radius 5"], "answer": 1, "explanation": "标准式是 (x−a)² + (y−b)² = r²，故圆心 (a, b) = (3, −2)；半径是 25 的平方根即 5，不是 25。注意 y+2 对应 b=−2。", "source": "Chapter 8 Graphing curves · 8.13 The circle (x − a)² + (y − b)² = r² (Ex 8.13)", "weak": false}, {"id": "maths53-027", "topic": "函数图像 · 指数曲线", "difficulty": "easy", "type": "mcq", "stem": "Which statement describes the graph of y = 3ˣ?", "options": ["It passes through (1, 0) and has the y-axis as an asymptote.", "It passes through (0, 0) and has no asymptote.", "It passes through (0, 1) and has the x-axis as an asymptote.", "It passes through (0, 3) and has the line y = 3 as an asymptote."], "answer": 2, "explanation": "任何 y = aˣ 都过 (0,1)，因为 a⁰=1；当 x 趋于负无穷时 y 趋于 0，所以 x 轴是渐近线。它永远不等于 0，因此没有 x 截距。", "source": "Chapter 8 Graphing curves · 8.12 The exponential curve y = aˣ (Ex 8.12)", "weak": false}, {"id": "maths53-028", "topic": "函数图像 · 三次曲线", "difficulty": "medium", "type": "mcq", "stem": "At which values of x does the curve y = (x − 1)(x + 2)(x − 4) cut the x-axis?", "options": ["x = 1, x = 2 and x = 4", "x = −1, x = 2 and x = −4", "x = 1 only", "x = 1, x = −2 and x = 4"], "answer": 3, "explanation": "令 y = 0，每个因式分别为零：x−1=0、x+2=0、x−4=0，得 x=1、−2、4。注意 (x+2) 给出的是 −2，符号容易看错。", "source": "Chapter 8 Graphing curves · 8.08 The cubic curve y = a(x − r)(x − s)(x − t) (Ex 8.08)", "weak": false}, {"id": "maths53-029", "topic": "函数图像 · 双曲线", "difficulty": "medium", "type": "short", "stem": "The graph of y = k/x passes through the point (4, −3). Find k and state the equations of the two asymptotes.", "options": [], "answer": "k = −12; the asymptotes are x = 0 (the y-axis) and y = 0 (the x-axis).", "explanation": "代入得 −3 = k/4，所以 k = −12，即 y = −12/x。x 不能为 0、y 也永远不为 0，因此两条渐近线分别是 x = 0 与 y = 0。", "source": "Chapter 8 Graphing curves · 8.11 The hyperbola y = k/x (Ex 8.11)", "points": [{"t": "k = −12; the asymptotes are x = 0 (the y-axis) and y = 0 (the x-axis).", "m": 1}], "weak": false}, {"id": "maths53-030", "topic": "函数 · 函数值", "difficulty": "easy", "type": "mcq", "stem": "If f(x) = 2x² − 3x, find f(−2).", "options": ["14", "−2", "−14", "2"], "answer": 0, "explanation": "f(−2) = 2(−2)² − 3(−2) = 2×4 + 6 = 14。平方先算得 4，第二项是 −3×(−2)=+6，两个符号都要处理对。", "source": "Chapter 14 Functions · 14.02 Function notation (Ex 14.02)", "weak": false}, {"id": "maths53-031", "topic": "函数 · 定义域与值域", "difficulty": "medium", "type": "short", "stem": "State the domain and range of the function f(x) = √(x − 4).", "options": [], "answer": "Domain: x ≥ 4; range: y ≥ 0.", "explanation": "根号内必须非负，所以 x−4 ≥ 0，定义域 x ≥ 4；算术平方根的结果不会是负数，因此值域 y ≥ 0。注意值域是 y 的范围，不是 x 的范围。", "source": "Chapter 14 Functions · 14.02 The domain and range of a function (p.540)", "points": [{"t": "Domain: x ≥ 4", "m": 1}, {"t": "range: y ≥ 0", "m": 1}], "weak": false}, {"id": "maths53-032", "topic": "三角 · 三角形面积", "difficulty": "easy", "type": "mcq", "stem": "Find the area of a triangle with two sides of 8 cm and 11 cm and an included angle of 30°.", "options": ["88 cm²", "22 cm²", "44 cm²", "11 cm²"], "answer": 1, "explanation": "面积 = ½ab·sinC = ½×8×11×sin30° = 44×0.5 = 22 cm²。忘记乘 ½ 就会得到 44，这是最常见的错误。", "source": "Non-right Angled Trigonometry · 9.11 Area of a triangle (Ex 9.11)", "weak": false}, {"id": "maths53-033", "topic": "三角 · 正弦定理求边", "difficulty": "medium", "type": "mcq", "stem": "In triangle ABC, ∠A = 35°, ∠B = 62° and a = 9.4 cm. Find b, correct to 1 decimal place.", "options": ["5.9 cm", "6.1 cm", "14.5 cm", "10.7 cm"], "answer": 2, "explanation": "由正弦定理 b/sinB = a/sinA 得 b = 9.4×sin62°/sin35° ≈ 9.4×0.8830/0.5736 ≈ 14.5 cm。若把正弦比倒过来（乘以 sin35/sin62）就会得到 6.1，这是典型错误。", "source": "Non-right Angled Trigonometry · 9.07 Sine rule for sides (Ex 9.07)", "weak": false}, {"id": "maths53-034", "topic": "三角 · 余弦定理求边", "difficulty": "medium", "type": "mcq", "stem": "In a triangle, two sides of 7 cm and 9 cm include an angle of 120°. Find the third side, correct to 1 decimal place.", "options": ["8.2 cm", "15.7 cm", "11.4 cm", "13.9 cm"], "answer": 3, "explanation": "c² = 7² + 9² − 2(7)(9)cos120° = 49 + 81 + 63 = 193，c ≈ 13.9 cm。cos120° 是负值，所以 −2ab·cosC 这一项变加号，别把符号弄丢。", "source": "Non-right Angled Trigonometry · 9.09 Cosine rule for sides (Ex 9.09)", "weak": false}, {"id": "maths53-035", "topic": "三角 · 正弦定理的模糊情况", "difficulty": "hard", "type": "short", "stem": "In a triangle, a = 12 cm, b = 15 cm and ∠A = 40°. Find all possible values of ∠B, correct to 1 decimal place, and explain why more than one answer exists.", "options": [], "answer": "∠B ≈ 53.5° or ∠B ≈ 126.5°, because sin B = b sin A / a = 15 sin40°/12 ≈ 0.8035 and the sine rule can produce an acute and an obtuse solution (the ambiguous case).", "explanation": "由正弦定理 sinB = 15×sin40°/12 ≈ 0.8035，得 B ≈ 53.5°；因为 sin(180°−θ)=sinθ，B 也可能是 180°−53.5° = 126.5°。需检验两解是否都能与 40° 组成三角形；题目只给两边一角（SSA），所以出现模糊情况。", "source": "Non-right Angled Trigonometry · 9.08 Sine rule for angles (Ex 9.08)", "points": [{"t": "∠B ≈ 53.5° or ∠B ≈ 126.5°, because sin B = b sin A / a = 15 sin40°/12 ≈ 0.8035 and the sine rule can produce an acute and an obtuse solution (the ambiguous case).", "m": 1}], "weak": false}, {"id": "maths53-036", "topic": "概率 · 相对频率", "difficulty": "easy", "type": "mcq", "stem": "A die is rolled 50 times and a 6 appears 7 times. What is the relative frequency of rolling a 6?", "options": ["0.14", "0.86", "0.12", "0.07"], "answer": 0, "explanation": "相对频率 = 出现次数 ÷ 试验总次数 = 7/50 = 0.14。常见错误：把试验次数当 100（7/100 = 0.07）、用点数 6 代替频数（6/50 = 0.12）、或算成补事件 43/50 = 0.86。", "source": "Chapter 12 Probability · 12.01 Relative frequency", "weak": false}, {"id": "maths53-037", "topic": "概率 · 韦恩图（重叠事件）", "difficulty": "easy", "type": "mcq", "stem": "In a class of 30 students, 18 play soccer, 12 play tennis and 7 play both. How many students play neither sport?", "options": ["5 students", "7 students", "0 students", "23 students"], "answer": 1, "explanation": "先求并集：18 + 12 − 7 = 23 人至少会一项，再用 30 − 23 = 7 得两项都不参加。23 是\"至少会一项\"（忘了从总数里减掉），5 是只会网球（12 − 7），0 是把 18 + 12 = 30 直接当成并集（7 人被重复计算）后再 30 − 30 得到的。", "source": "Chapter 12 Probability · 12.02 Venn diagrams", "weak": false}, {"id": "maths53-038", "topic": "概率 · 双向表读数", "difficulty": "easy", "type": "mcq", "stem": "A survey of 100 students recorded how they travel to school:\n\n            Walk   Bus\nYear 10      28     22\nYear 11      35     15\n\nWhat is the probability that a randoml /* ===== 简答自动预判：关键词覆盖率（离线，无需后端） ===== */
const AUTO_STOP = ("the a an of and or to in on for with that this these those is are was were be been being " +
  "as at by from it its their they them we you your our not no but if then than so such can could may might " +
  "will would should must have has had do does did which who whom what when where why how all any more most " +
  "other some only own same very just also into over under about after before between through during").split(" ");
const AUTO_STOP_SET = {};
AUTO_STOP.forEach(function(w){ AUTO_STOP_SET[w] = 1; });
function autoStem(w){
  return String(w||"").toLowerCase()
    .replace(/'s$/,"").replace(/ies$/,"y").replace(/ing$/,"").replace(/ed$/,"")
    .replace(/es$/,"").replace(/s$/,"");
}
function autoKeywords(text){
  var raw = String(text||"").toLowerCase().split(/[^a-z'-]+/);
  var out = [];
  raw.forEach(function(w){
    if(w.length < 4) return;
    if(AUTO_STOP_SET[w]) return;
    var st = autoStem(w);
    if(st.length < 3) return;
    if(out.indexOf(st) < 0) out.push(st);
  });
  return out;
}
function autoScore(pointText, answerText){
  var kw = autoKeywords(pointText);
  if(!kw.length) return {hit:false, ratio:0, matched:0, total:0, missing:[]};
  var mine = {};
  String(answerText||"").toLowerCase().split(/[^a-z'-]+/).forEach(function(w){ mine[autoStem(w)] = 1; });
  var matched = 0, missing = [];
  kw.forEach(function(k){ if(mine[k]) matched++; else missing.push(k); });
  var ratio = matched / kw.length;
  return {hit: ratio >= 0.5, ratio: ratio, matched: matched, total: kw.length, missing: missing.slice(0,4)};
}
function buildOrder(){
  var f = TFILTER();
  return DATA.questions.map(function(q,i){ return {q:q,i:i}; })
    .filter(function(x){ return f==="all" || x.q.type===f; })
    .map(function(x){ return x.i; });
}
const app = document.getElementById("app");
let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = buildOrder();
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

  function seedRnd(str){

    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);

    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    let slots = (rec && Array.isArray(rec.slots)) ? rec.slots.slice() : [];
    if (!slots.length && rec && rec.text) slots = [rec.text];
    while (slots.length < pts.length) slots.push("");
    const many = pts.length >= 2;
    const hinted = HINTED[q.id];
    const hintFor = (i) => hinted ? pts[i].t.split(/\s+/).slice(0,4).join(" ") + " …" : "写这一点的内容（英文）";
    const taHtml = many
      ? `<div class="slots" id="slots">${pts.map((p,i)=>`
          <div class="slot"><span class="sn">${i+1}</span>
            <textarea data-slot="${i}" rows="2" placeholder="${esc(hintFor(i))}">${esc(slots[i]||"")}</textarea>
          </div>`).join("")}</div>`
      : `<textarea id="ta" data-slot="0" rows="4" placeholder="${esc(hintFor(0))}">${esc(slots[0]||"")}</textarea>`;
    bodyHtml = taHtml + `
      <div class="actions">
        <button class="btn" id="reveal">${rec ? "重新对照得分点" : "对照得分点"}</button>
        <button class="btn ghost" id="hint">${hinted ? "藏起提示" : "给点提示"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        <span class="muted" id="slotsum" style="align-self:center">${slots.filter(function(x){return (x||"").trim();}).length} / ${pts.length} 点已写</span>
        ${rec ? `<span class="pill" style="align-self:center">已得 <b>${earned}</b> / ${totalMarks} 分</span>` : `<span class="muted" style="align-self:center">共 ${totalMarks} 分 · ${pts.length} 个得分点</span>`}
      </div>`;
    if (rec) {
      const autoRes = pts.map((p,i)=>{
        const mine = (rec.slots && rec.slots[i]) ? rec.slots[i] : (rec.text || "");
        return autoScore(p.t, mine);
      });
      const autoHit = autoRes.filter(function(r){ return r.hit; }).length;
      bodyHtml += `<div class="panel">
        <div class="panel-h">自评 · 勾选你写到的得分点
          <span class="autotag">系统预判 ${autoHit} / ${pts.length} 点</span>
          <button class="btn2" id="applyauto" style="margin-left:8px">按系统判断勾选</button>
          ${apibase() ? '<button class="btn2" id="aigrade" style="margin-left:6px">AI 判分</button>' : ''}
          ${AI_RES[q.id] ? '<button class="btn2" id="applyai" style="margin-left:6px">采用 AI 评分</button>' : ''}
          ${apibase() ? '<button class="btn2" id="aiconf" style="margin-left:6px" title="本地模型地址">引擎</button>' : ''}
        </div>
        <div class="pts">${pts.map((p,i)=>`
          <label class="pt ${checked.indexOf(i)>=0?'on':''}"><input type="checkbox" data-i="${i}" ${checked.indexOf(i)>=0?'checked':''}><span>${esc(p.t)}${(()=>{const ai=AI_RES[q.id]&&AI_RES[q.id][i]; if(ai) return '<span class="auto '+(ai.covered?'ok':'no')+'">AI'+(AI_ENGINE[q.id]==="local"?" (local)":"")+': '+(ai.covered?'covered':'missed')+(ai.reason?' — '+esc(ai.reason):'')+'</span>';
            return '<span class="auto '+(autoRes[i].hit?'ok':'no')+'">'+(autoRes[i].hit?'系统：大概率写到':'系统：可能没写到')+'（'+autoRes[i].matched+'/'+autoRes[i].total+' 关键词'+(autoRes[i].missing.length?'，缺 '+esc(autoRes[i].missing.join(', ')):'')+'）</span>';})()}</span><em>${p.m||1} 分</em></label>`).join("")}</div>
        <div class="actions">
          <button class="btn ghost" id="allpt">全部勾上</button>
          <button class="btn ghost" id="nonept">全部取消</button>
        </div>
        <div class="mine"><b>你写的：</b><div>${esc(((rec.text||"").trim()) || "（空）").split(String.fromCharCode(10)).join("<br>")}</div></div>
      </div>`;
    }
  }

  const expHtml = rec ? `<div class="exp show"><b>解析：</b>${esc(q.explanation)}
      ${q.type === "short" ? `<details class="fullans"><summary>看完整参考答案</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">出处：${esc(q.source || "")}</div></div>` : "";

  const last = state.idx >= total - 1;
  let stemHtml;
  if (L === "zh" && ZH && ZH.stem) {
    stemHtml = `<div class="stem zh"><span class="orig">${esc(q.stem)}</span>${esc(ZH.stem)}</div>`;
  } else if (L === "both" && ZH && ZH.stem) {
    stemHtml = `<div class="stem">${esc(q.stem)}<div class="tr">${esc(ZH.stem)}</div></div>`;
  } else {
    stemHtml = `<div class="stem">${esc(q.stem)}</div>`;
  }
  setTimeout(function(){ if(window.applyI18n) applyI18n(); }, 0);
  app.innerHTML = `<div class="card">${chips}${stemHtml}
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>${T("prev")}</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">${T("finish")}</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>${T("next")}</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq", i === q.answer);
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq");
      save(); render();
    }));
  } else {
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    const slotEls = () => Array.from(app.querySelectorAll("[data-slot]"));
    const readSlots = () => slotEls().map(el => el.value || "");
    const joinSlots = (arr) => arr.map(s => (s||"").trim()).filter(Boolean).join(String.fromCharCode(10,10));
    const updateSum = () => {
      const el = document.getElementById("slotsum");
      if (!el) return;
      const filled = readSlots().filter(s => s.trim()).length;
      el.textContent = filled + " / " + pts.length + " 点已写";
      el.style.color = filled >= pts.length ? "var(--ok)" : "var(--dim)";
    };
    let _saveT = null;
    if (many) {
      slotEls().forEach(el => el.addEventListener("input", () => {
        const c = cur();
        const arr = readSlots();
        state.answers[q.id] = Object.assign({}, c, {chosen:-1, slots:arr, text:joinSlots(arr)});
        updateSum();
        clearTimeout(_saveT); _saveT = setTimeout(save, 400);
      }));
      updateSum();
    }
    document.getElementById("reveal").onclick = () => {
      const c = cur();
      const arr = readSlots();
      state.answers[q.id] = {chosen:-1, slots:arr, text:joinSlots(arr), checked: c.checked || [], ok:"ok"};
      save(); render();
    };
    const hb = document.getElementById("hint");
    if (hb) hb.onclick = () => { HINTED[q.id] = !HINTED[q.id]; render(); };
    if (many) app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur(); const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      const arr = c.slots || [c.text || ""];
      state.answers[q.id] = {chosen:-1, slots:arr, text:joinSlots(arr), checked: [...set].sort((a,b)=>a-b), ok:"ok"};
      const full = pts.every((_,j)=>set.has(j));
      if (window.awardForQ && full && !(c.checked && c.checked.length >= pts.length)) awardForQ(q.id, q.difficulty, "short", true);
      reviewMark(q.subj || DATA.slug, q.id, full);
      logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short");
      save(); render();
    }));
    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const typed = joinSlots(readSlots());
      const u = numsOf(typed), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!u.length) { res.textContent = "你还没写数字"; res.style.color = "var(--dim)"; return; }
      if (!a.length) { res.textContent = "参考答案无数字"; res.style.color = "var(--dim)"; return; }
      const last = u[u.length-1];
      const hit = a.some(v => Math.abs(v-last) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "数值与参考答案一致" : "数值与参考答案不一致";
      res.style.color = hit ? "var(--ok)" : "var(--bad)";
    };
    const ac = document.getElementById("aiconf");
    if (ac) ac.onclick = () => {
      const cur = localAI();
      const v = prompt("本地判分地址（如 http://127.0.0.1:8787；留空则关闭）", cur);
      if (v === null) return;
      setLocalAI(v); toast(v.trim() ? "已保存本地引擎" : "已关闭本地引擎", true);
    };
    const ai = document.getElementById("aigrade");
    if (ai) ai.onclick = () => {
      const arr = readSlots(), answer = joinSlots(arr);
      if (!answer.trim()) { ai.textContent = "先写点东西"; return; }
      ai.disabled = true; ai.textContent = "AI 判分中…";
      const payload = JSON.stringify({stem: q.stem, points: pts.map(p=>({t:p.t, m:p.m||1})), answer: answer});
      const engines = [];
      if (apibase()) engines.push({n:"cloud", u: apibase() + "/grade"});
      const loc = localAI();
      if (loc) engines.push({n:"local", u: loc + "/grade"});
      (async function(){
        let lastErr = "no engine";
        for (const en of engines) {
          try {
            const r = await fetch(en.u, {method:"POST", headers:{"Content-Type":"application/json"}, body: payload});
            const d = await r.json();
            if (!d || !d.ok) throw new Error((d && d.error) || ("http " + r.status));
            AI_RES[q.id] = d.results; AI_ENGINE[q.id] = en.n; save(); render();
            return;
          } catch (e) { lastErr = en.n + ": " + (e && e.message || e); }
        }
        ai.disabled = false; ai.textContent = "AI 判分";
        toast("AI 判分不可用（" + lastErr + "），已保留关键词预判", false);
      })();
    };
    const ap2 = document.getElementById("applyai");
    if (ap2) ap2.onclick = () => {
      const c = cur(); const arr = c.slots || [c.text || ""];
      const res = AI_RES[q.id] || [];
      const hits = res.map(r => r.covered ? r.i : -1).filter(i => i >= 0);
      state.answers[q.id] = {chosen:-1, slots:arr, text:joinSlots(arr), checked:hits, ok:"ok"};
      save(); render();
    };
    const aa = document.getElementById("applyauto");
    if (aa) aa.onclick = () => {
      const c = cur();
      const arr = c.slots || [c.text || ""];
      const hits = pts.map((p,i)=>autoScore(p.t, arr[i] || "").hit ? i : -1).filter(i=>i>=0);
      state.answers[q.id] = {chosen:-1, slots:arr, text:joinSlots(arr), checked:hits, ok:"ok"};
      save(); render();
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { const c=cur(); const arr=c.slots||[c.text||""]; state.answers[q.id]={chosen:-1,slots:arr,text:joinSlots(arr),checked:pts.map((_,i)=>i),ok:"ok"}; save(); render(); };
    if (none) none.onclick = () => { const c=cur(); const arr=c.slots||[c.text||""]; state.answers[q.id]={chosen:-1,slots:arr,text:joinSlots(arr),checked:[],ok:"ok"}; save(); render(); };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        if (window.lbSubmit) lbSubmit(state.t0 ? (Date.now() - state.t0) : 0);
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
        if (window.lbOpen) setTimeout(function(){ lbOpen(); }, 600);
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.awardXP && answered > 0) awardXP(20 + Math.min(80, answered), true);
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.points && x.points.length) ? x.points : [{m:1}];
    const tot = pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const got = (r && r.checked) ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  app.innerHTML = `<div class="card done">
      <h2>选择题 ${right.length} / ${mcq.length} 正确（${pct}%）</h2>
      <div class="stats">
        <div class="stat"><b>${right.length}</b><span>选择题答对</span></div>
        <div class="stat"><b>${wrong.length}</b><span>选择题答错</span></div>
        <div class="stat"><b>${earnedM}</b><span>简答得分 / ${totalM}</span></div>
        <div class="stat"><b>${todo.length}</b><span>未做</span></div>
      </div>
      ${weak.length ? `<div><b>简答没拿满的题（${weak.length}）：</b><ol class="wronglist">${weak.map(x => `<li>${esc(x.topic)}</li>`).join("")}</ol></div>` : ""}
      ${wrong.length ? `<div><b>选择题错题：</b><ol class="wronglist">${wrong.map(x => `<li>${esc(x.topic)} — ${esc((x.stem||"").slice(0,60))}…</li>`).join("")}</ol></div>` : ""}
      <div class="actions">
        ${needRedo.length ? `<button class="btn" id="redo">只练错题（${needRedo.length} 题）</button>` : ""}
        <button class="btn ghost" id="showlb">${T("lb")}</button>
        <button class="btn ghost" id="again">${T("again")}</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← 回到科目列表</a>
      </div></div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    state.order = wrongIds.map(id => DATA.questions.findIndex(x => x.id === id)).filter(i => i >= 0);
    wrongIds.forEach(id => delete state.answers[id]);
    state.idx = 0; save(); render();
  };
  const showlb = document.getElementById("showlb");
  if (showlb) showlb.onclick = () => { if (window.lbOpen) lbOpen(); };
  document.getElementById("again").onclick = () => {
    state = {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
    save(); render();
  };
}

document.addEventListener("keydown", e => {
  if (MULTI && state.setup && !state.started) {
    if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("startmix"); if (b && b.onclick) b.onclick(); }
    return;
  }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") document.getElementById("nav").classList.remove("on"); return; }
  const q = state.order.length ? DATA.questions[state.order[state.idx]] : null;
  if (e.key === "ArrowRight" || e.key === "j") { if (state.idx < state.order.length-1){ state.idx++; save(); render(); } return; }
  if (e.key === "ArrowLeft" || e.key === "k") { if (state.idx > 0){ state.idx--; save(); render(); } return; }
  if (e.key === "g" || e.key === "G") { document.getElementById("nav").classList.contains("on") ? document.getElementById("nav").classList.remove("on") : openNav(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state.order && state.idx < state.order.length - 1) { state.idx++; save(); render(); }
    else showResult();
    return;
  }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); showResult(); return; }
  if (!q || q.type !== "mcq") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= (q.options || []).length) {
    if (!state.answers[q.id]) {
      state.answers[q.id] = {chosen:n-1, ok: n-1 === q.answer ? "ok" : "bad"};
      save(); render();
    }
  }
});

const REVIEW_KEY = "dsh-review-v1";
const GAPS = [1, 3, 7];
function reviewDb(){ try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); } catch(e){ return {}; } }
function reviewSave(db){ try { localStorage.setItem(REVIEW_KEY, JSON.stringify(db)); } catch(e){} }
function reviewMark(slug, qid, correct){
  const db = reviewDb(), id = slug + "::" + qid, now = Date.now();
  if (correct) {
    const it = db[id];
    if (!it) return;
    const st = (it.stage || 0) + 1;
    if (st >= GAPS.length) delete db[id];
    else { it.stage = st; it.due = now + GAPS[st]*864e5; it.last = now; }
  } else {
    const old = db[id] || {};
    db[id] = {stage:0, due: now + GAPS[0]*864e5, added: old.added || now, last: now};
  }
  reviewSave(db);
}
function numsOf(t){ return (String(t).match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

const LOG_KEY = "dsh-log-v1";
function logAnswer(slug, qid, ok, diff, ty){
  try {
    let arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    arr.push({t: Date.now(), s: slug, q: qid, ok: ok ? 1 : 0, d: diff || "", ty: ty || ""});
    if (arr.length > 3000) arr = arr.slice(-3000);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function navState(qi){
  const q = DATA.questions[qi], a = state.answers[q.id];
  if (!a) return "";
  if (q.type === "mcq") return a.ok === "ok" ? "ok" : "bad";
  const pts = q.points || [{m:1}], c = (a.checked || []).length;
  if (c >= pts.length) return "ok";
  if (c > 0) return "part";
  return "";
}
function openNav(){
  const grid = document.getElementById("navgrid");
  grid.innerHTML = state.order.map((qi, pos) =>
    `<button class="${navState(qi)}" data-pos="${pos}">${pos+1}</button>`).join("");
  grid.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.idx = +b.dataset.pos; save();
    document.getElementById("nav").classList.remove("on"); render();
  });
  document.getElementById("nav").classList.add("on");
}

let timerId = null;
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tickClock(){
  const el = document.getElementById("clock");
  if (!state.deadline) { if (el) el.style.display = "none"; return; }
  const left = state.deadline - Date.now();
  if (el) { el.style.display = ""; el.textContent = "⏱ " + fmtLeft(left);
            el.style.color = left < 5*60000 ? "var(--bad)" : "var(--dim)"; }
  if (left <= 0) { clearInterval(timerId); timerId = null; state.deadline = 0; save(); showResult(); }
}
function startExam(){
  const def = DATA.examMin || 60;
  const v = prompt("考试模式：倒计时多少分钟？（到点自动收卷）", def);
  if (v === null) return;
  const mins = parseInt(v, 10);
  if (!mins || mins <= 0) return;
  state.deadline = Date.now() + mins*60000; save();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
  tickClock();
}


load(); render();
</script>
