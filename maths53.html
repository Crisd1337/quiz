      <div class="seg">${[5,10,20,0].map(n => `<button data-n="${n}" class="${per===n?'on':''}">${n? n+' 题':'全部'}</button>`).join("")}</div>
    </section>

    <div class="setup-foot">
      <div class="sum">共 <b id="cnt">0</b> 题</div>
      <button class="btn ghost" id="daily">今日挑战</button>
      <button class="btn" id="startmix">开始答题 →</button>
    </div>
  </div>`;
  const chosenCount = () => {
    let c = 0;
    app.querySelectorAll(".pick input").forEach(cb => { if (cb.checked) c++; });
    return c || Object.keys(subs).filter(k => (state.pick || {})[k] !== false).length;
  };
  const calc = () => {
    let n = 0;
    app.querySelectorAll(".pick input").forEach(cb => {
      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = "已选 " + chosenCount() + " 科";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    state.ttype = b.dataset.t; save(); render();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
    state.answers={}; state.daily=key; state.rewarded=false; state.t0=Date.now(); save(); render();
  }
  document.getElementById("daily").onclick = startDaily;
  document.getElementById("startmix").onclick = () => {
    const chosen = keys.filter(k => (state.pick || {})[k] !== false);
    if (!chosen.length) { alert("至少选一科"); return; }
    let idxs = [];
    chosen.forEach(k => {
      const tt = state.ttype || "all";
      let pool = DATA.questions.map((q, i) => (q.subj === k && (tt === "all" || q.type === tt)) ? i : -1).filter(i => i >= 0);
      pool.sort(() => Math.random() - 0.5);
      idxs = idxs.concat(per ? pool.slice(0, per) : pool);
    });
    idxs.sort(() => Math.random() - 0.5);
    state.order = idxs; state.idx = 0; state.started = true; state.setup = false;
    state.answers = {}; state.t0 = Date.now(); save(); render();
  };
  calc();
}


/* ===== 语言切换 ===== */
var UI_TEXT = {
  en: { grid:"Index", exam:"Exam mode", restart:"Restart", prev:"< Previous", next:"Next >",
        finish:"See results", back:"< Subjects", again:"Redo all", lb:"Today's leaderboard" },
  zh: { grid:"题号", exam:"考试模式", restart:"重来", prev:"← 上一题", next:"下一题 →",
        finish:"看成绩", back:"← 科目列表", again:"整套重做", lb:"查看今日榜单" }
};
function T(k){
  var lang = LANG(); var d = UI_TEXT[lang === "zh" ? "zh" : "en"];
  return d[k] || UI_TEXT.en[k] || k;
}
function applyChrome(){
  var map = { grid:"#grid", exam:"#exam", restart:"#restart" };
  Object.keys(map).forEach(function(k){ var el=document.querySelector(map[k]); if(el) el.textContent=T(k); });
  var btn=document.getElementById("langBtn"), now=document.getElementById("langNow");
  var l=LANG();
  if(now) now.textContent = l==="en" ? "EN" : (l==="zh" ? "中文" : "EN+中");
}
function cycleLang(){
  var order=["en","zh","both"], i=order.indexOf(LANG());
  setLANG(order[(i+1)%3] || "en");
  applyChrome(); render();
}

function render() {
  if (MULTI && location.hash === "#daily" && !state.started && !state.dailyAuto) {
    state.dailyAuto = true; if (typeof startDaily === "function") startDaily();
  }
  if (MULTI && state.setup && !state.started) return renderSetup();
  const qs = state.order.map(i => DATA.questions[i]);
  const q = qs[state.idx];
  const L = LANG(), ZH = (q && q.zh) || null;
  const total = qs.length;
  const answered = qs.filter(x => state.answers[x.id]).length;
  const right = qs.filter(x => state.answers[x.id] === "ok").length;
  const wrong = qs.filter(x => state.answers[x.id] === "bad").length;
  document.getElementById("counter").textContent = (state.idx+1) + " / " + total;
  document.getElementById("scorepill").textContent = "✓ " + right + "  ✗ " + wrong;
  document.getElementById("pbar").style.width = (answered/total*100).toFixed(1) + "%";
  if (!q) { app.innerHTML = "<p>这套题是空的。</p>"; return; }

  const rec = state.answers[q.id];
  const chips = `<div class="chips">
      ${MULTI && q.subjZh ? `<span class="chip">${esc(q.subjZh)}</span>` : ""}
      <span class="chip">${esc(q.topic)}</span>
      <span class="chip ${esc(q.difficulty)}">${ {easy:"简单",medium:"中等",hard:"较难"}[q.difficulty] || esc(q.difficulty) }</span>
      <span class="chip">${q.type === "mcq" ? "选择题" : "简答"}</span>
      <span class="chip">第 ${state.idx+1} 题 / 共 ${total}</span>
    </div>`;

  let bodyHtml = "";
  if (q.type === "mcq") {
    const opts = (q.options || []).map((o, i) => {
      let cls = "opt", mark = "";
      if (rec) {
        if (i === q.answer) { cls += " correct"; mark = '<span class="mk">✓</span>'; }
        else if (rec.chosen === i) { cls += " wrong"; mark = '<span class="mk">✗</span>'; }
      }
      const zo = (ZH && Array.isArray(ZH.options) && ZH.options[i]) ? ZH.options[i] : "";
      const zhSpan = (L !== "en" && zo) ? `<span class="otr">${esc(zo)}</span>` : "";
      return `<button class="${cls}" data-i="${i}" ${rec ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[i]}</span><span class="txt">${esc(o)}${zhSpan}</span>${mark}</button>`;
    }).join("");
    bodyHtml = `<div class="opts">${opts}</div>`;
  } else {
    /* ── 简答题：评分标准（criteria）驱动，提交后自动 AI 判分 ── */
    const pts = (q.criteria && q.criteria.length) ? q.criteria
              : (q.points && q.points.length ? q.points : [{t:q.answer, m:1}]);
    const totalMarks = (typeof q.marks === "number" && q.marks > 0)
      ? q.marks : pts.reduce((a,p)=>a+(p.m||1),0);
    const critId = (p,i) => (p && p.id) ? p.id : ("c" + (i+1));
    const checked = (rec && rec.checked) ? rec.checked : [];
    const aiRec = (rec && rec.ai && Array.isArray(rec.ai.results)) ? rec.ai : null;
    const manualEarned = pts.reduce((a,p,i)=>a + (checked.indexOf(i)>=0 ? (p.m||1) : 0), 0);
    const earned = (rec && rec.override) ? manualEarned : (aiRec ? aiRec.score : manualEarned);
    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    let slots = (rec && Array.isArray(rec.slots)) ? rec.slots.slice() : [];
    if (!slots.length && rec && rec.text) slots = [rec.text];
    while (slots.length < pts.length) slots.push("");
    const many = pts.length >= 2;
    const hinted = HINTED[q.id];
    const hintFor = (i) => hinted
      ? String(pts[i].t || "").split(/\s+/).slice(0,4).join(" ") + " …"
      : "写这一点的内容（英文）";
    const enginesAvail = () => !!(apibase() || localAI());
    const canAuto = q.auto_grade !== false && pts.length > 0 && enginesAvail();
    const taHtml = many
      ? `<div class="slots" id="slots">${pts.map((p,i)=>`
          <div class="slot"><span class="sn">${i+1}</span>
            <textarea data-slot="${i}" rows="2" placeholder="${esc(hintFor(i))}">${esc(slots[i]||"")}</textarea>
          </div>`).join("")}</div>`
      : `<textarea id="ta" data-slot="0" rows="4" placeholder="${esc(hintFor(0))}">${esc(slots[0]||"")}</textarea>`;

    const submitLabel = aiRec ? "重新判分" : (canAuto ? "提交并自动判分" : "对照得分点");
    bodyHtml = taHtml + `
      <div class="actions">
        <button class="btn" id="submitq">${submitLabel}</button>
        <button class="btn ghost" id="manualtoggle">手动校正</button>
        <button class="btn ghost" id="hint">${hinted ? "藏起提示" : "给点提示"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        <span class="muted" id="slotsum">${slots.filter(function(x){return (x||"").trim();}).length} / ${pts.length} 点已写</span>
        ${aiRec
          ? `<span class="pill scorepill${aiRec.needsReview ? " low" : ""}">已得 <b>${aiRec.score}</b> / ${totalMarks} 分</span>`
          : `<span class="muted">满分 ${totalMarks} 分 · ${pts.length} 条评分标准</span>`}
      </div>
      ${!enginesAvail() ? `<div class="ai-note">未配置判分服务器，先用自评；到「引擎」里填地址即可自动判分。</div>` : ""}`;

    /* ── AI 判分结果面板 ── */
    if (aiRec) {
      const byId = {};
      aiRec.results.forEach(function(r){ byId[r.id] = r; });
      const rows = pts.map(function(p,i){
        const r = byId[critId(p,i)] || {awarded:0, max:(p.m||1), reason:"未评估"};
        const mx = Math.max(1, r.max || p.m || 1);
        const got = Math.max(0, Math.min(mx, r.awarded || 0));
        const cls = got >= mx ? "full" : (got > 0 ? "part" : "none");
        const mk = got >= mx ? "✓" : (got > 0 ? "◐" : "✗");
        return `<li class="cres ${cls}"><span class="cmk">${mk}</span>` +
          `<span class="cbody"><span class="ct">${esc(p.t)}</span>` +
          (r.reason ? `<span class="cr">${esc(r.reason)}</span>` : "") + `</span>` +
          `<span class="csc">${got}/${mx}</span></li>`;
      }).join("");
      const conf = typeof aiRec.confidence === "number" ? aiRec.confidence : 0.5;
      const confPct = Math.round(conf * 100);
      const when = aiRec.at ? new Date(aiRec.at) : null;
      const whenTxt = when ? (("0"+when.getHours()).slice(-2)+":"+("0"+when.getMinutes()).slice(-2)) : "";
      bodyHtml += `<div class="panel aires">
        <div class="ai-head">
          <span class="ai-score"><b>${aiRec.score}</b><em>/${totalMarks}</em></span>
          <span class="ai-conf ${conf < 0.6 ? "low" : (conf < 0.85 ? "mid" : "high")}">置信度 ${confPct}%</span>
          ${aiRec.needsReview ? '<span class="ai-flag">需要复核</span>' : ""}
          <span class="grow"></span>
          <span class="ai-meta">${esc(aiRec.engine === "local" ? "本地引擎" : "AI 判分")}${whenTxt ? " · " + whenTxt : ""}</span>
        </div>
        ${aiRec.feedback ? `<div class="ai-fb">${esc(aiRec.feedback)}</div>` : ""}
        <ul class="critlist">${rows}</ul>
        <div class="ai-foot">分数按评分标准逐条给出，由服务器校验求和${aiRec.model ? " · " + esc(String(aiRec.model).replace(/^@cf\//,"")) : ""}</div>
      </div>`;
    }

    /* ── 手动校正（可选覆盖，默认收起）── */
    const autoRes = pts.map(function(p,i){
      const mine = (rec && rec.slots && rec.slots[i]) ? rec.slots[i] : ((rec && rec.text) || "");
      return autoScore(p.t, mine);
    });
    const autoHit = autoRes.filter(function(r){ return r.hit; }).length;
    bodyHtml += `<details class="panel manual"${aiRec ? "" : " open"} id="manualbox">
      <summary class="panel-h">手动校正 · 自己勾选写到的得分点（不产生经验）
        <span class="autotag">关键词预判 ${autoHit} / ${pts.length}（仅供参考，不作分数）</span>
      </summary>
      <div class="pts">${pts.map(function(p,i){
        const ai = aiRec ? aiRec.results.filter(function(r){ return r.id === critId(p,i); })[0] : null;
        const hint = ai
          ? '<span class="auto ' + (ai.awarded > 0 ? "ok" : "no") + '">AI: ' + ai.awarded + "/" + (ai.max||p.m||1)
            + (ai.reason ? " — " + esc(ai.reason) : "") + "</span>"
          : '<span class="auto ' + (autoRes[i].hit ? "ok" : "no") + '">'
            + (autoRes[i].hit ? "关键词：大概率写到" : "关键词：可能没写到")
            + "（" + autoRes[i].matched + "/" + autoRes[i].total + " 个关键词"
            + (autoRes[i].missing.length ? "，缺 " + esc(autoRes[i].missing.join(", ")) : "") + "）</span>";
        return '<label class="pt ' + (checked.indexOf(i)>=0 ? "on" : "") + '">'
          + '<input type="checkbox" data-i="' + i + '"' + (checked.indexOf(i)>=0 ? " checked" : "") + '>'
          + "<span>" + esc(p.t) + hint + "</span><em>" + (p.m||1) + " 分</em></label>";
      }).join("")}</div>
      <div class="actions">
        <button class="btn ghost" id="allpt">全部勾上</button>
        <button class="btn ghost" id="nonept">全部取消</button>
        <button class="btn ghost" id="applyauto">按关键词判断勾选</button>
        <button class="btn ghost" id="aiconf" title="判分服务器地址">引擎</button>
      </div>
    </details>`;
    bodyHtml += `<div class="mine"><b>你写的：</b><div>${esc(((rec && rec.text) || "").trim() || "（空）").split(String.fromCharCode(10)).join("<br>")}</div></div>`;

  }

  const expHtml = rec ? `<div class="exp show"><b>解析：</b>${esc(q.explanation)}
      ${q.type === "short" ? `<details class="fullans"><summary>看完整参考答案</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">出处：${esc(q.source || "")}</div></div>` : "";

  const last = state.idx >= total - 1;
  let stemHtml;
  if (L === "zh" && ZH && ZH.stem) {
    stemHtml = `<div class="stem zh"><span class="orig">${esc(q.stem)}</span>${esc(ZH.stem)}</div>`;
  } else if (L === "both" && ZH && ZH.stem) {
    stemHtml = `<div class="stem">${esc(q.stem)}<div class="tr">${esc(ZH.stem)}</div></div>`;
  } else {
    stemHtml = `<div class="stem">${esc(q.stem)}</div>`;
  }
  setTimeout(function(){ if(window.applyI18n) applyI18n(); }, 0);
  app.innerHTML = `<div class="card">${chips}${stemHtml}
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>${T("prev")}</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">${T("finish")}</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>${T("next")}</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq",
        {ratio: i === q.answer ? 1 : 0, answer: String(i)});
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq");
      save(); render();
    }));
  } else {
    /* 第二段 else 与上面的渲染块作用域不同，这里重新绑定共享变量 */
    const pts = (q.criteria && q.criteria.length) ? q.criteria
              : ((q.points && q.points.length) ? q.points : [{t:q.answer, m:1}]);
    const totalMarks = (typeof q.marks === "number" && q.marks > 0)
      ? q.marks : pts.reduce((a,p)=>a+(p.m||1),0);
    const critId = (p,i) => (p && p.id) ? p.id : ("c" + (i+1));
    const many = pts.length >= 2;
    const enginesAvail = () => !!(apibase() || localAI());
    const canAuto = q.auto_grade !== false && pts.length > 0 && enginesAvail();
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    const slotEls = () => Array.from(app.querySelectorAll("[data-slot]"));
    const readSlots = () => slotEls().map(el => el.value || "");
    const joinSlots = (arr) => arr.map(s => (s||"").trim()).filter(Boolean).join(String.fromCharCode(10,10));
    const put = (patch) => {
      const c = cur();
      const arr = readSlots();
      state.answers[q.id] = Object.assign({chosen:-1}, c, {slots:arr, text:joinSlots(arr)}, patch);
      save();
    };
    const updateSum = () => {
      const el = document.getElementById("slotsum");
      if (!el) return;
      const filled = readSlots().filter(s => s.trim()).length;
      el.textContent = filled + " / " + pts.length + " 点已写";
      el.style.color = filled >= pts.length ? "var(--success)" : "var(--muted)";
    };
    let _saveT = null;
    if (many) {
      slotEls().forEach(el => el.addEventListener("input", () => {
        updateSum();
        clearTimeout(_saveT);
        _saveT = setTimeout(() => put({}), 400);
      }));
      updateSum();
    } else {
      const only = slotEls()[0];
      if (only) only.addEventListener("input", () => {
        clearTimeout(_saveT);
        _saveT = setTimeout(() => put({}), 400);
      });
    }

    /* 手动校正（可选覆盖） */
    app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur();
      const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      const arr = c.slots || [c.text || ""];
      const arr2 = set.size ? Array.from(set).sort((a,b)=>a-b) : [];
      const manScore = pts.reduce((a,p,j)=>a + (arr2.indexOf(j)>=0 ? (p.m||1) : 0), 0);
      const full = manScore >= totalMarks;
      state.answers[q.id] = Object.assign({}, c, {
        chosen:-1, slots:arr, text:joinSlots(arr), checked:arr2,
        override:true, manScore:manScore,
        ok: full ? "ok" : (manScore > 0 ? "part" : "bad")
      });
      if (!c.gradedAt) {
        reviewMark(q.subj || DATA.slug, q.id, full);
        logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short");
      }
      /* 手动勾选只是自评，不产生经验：经验只认 AI 判分的真实得分 */
      save(); render();
    }));

    const hb = document.getElementById("hint");
    if (hb) hb.onclick = () => { HINTED[q.id] = !HINTED[q.id]; render(); };

    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const typed = joinSlots(readSlots());
      const u = numsOf(typed), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!res) return;
      if (!u.length) { res.textContent = "你还没写数字"; res.style.color = "var(--muted)"; return; }
      if (!a.length) { res.textContent = "参考答案无数字"; res.style.color = "var(--muted)"; return; }
      const lastN = u[u.length-1];
      const hit = a.some(v => Math.abs(v-lastN) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "数值与参考答案一致" : "数值与参考答案不一致";
      res.style.color = hit ? "var(--success)" : "var(--error)";
    };

    const mt = document.getElementById("manualtoggle");
    if (mt) mt.onclick = () => {
      const mb = document.getElementById("manualbox");
      if (!mb) return;
      mb.open = !mb.open;
      if (mb.open) mb.scrollIntoView({behavior:"smooth", block:"center"});
    };
    const ac = document.getElementById("aiconf");
    if (ac) ac.onclick = () => {
      const curLoc = localAI();
      const v = prompt("判分服务器地址（云端留空就用默认；本机/局域网可填 http://127.0.0.1:8787）", apibase());
      if (v === null) return;
      try { localStorage.setItem("dsh-api", v.trim().replace(/\/$/, "")); } catch(e) {}
      toast(v.trim() ? "判分服务器已保存" : "已清空，将使用默认服务器", true);
      render();
    };
    const aa = document.getElementById("applyauto");
    if (aa) aa.onclick = () => {
      const arr = readSlots();
      const hits = pts.map((p,i)=>autoScore(p.t, arr[i] || joinSlots(arr)).hit ? i : -1).filter(i=>i>=0);
      put({checked:hits, override:true,
           manScore: pts.reduce((a,p,j)=>a + (hits.indexOf(j)>=0 ? (p.m||1) : 0), 0), ok:"ok"});
      render();
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { put({checked:pts.map((_,i)=>i), override:true, manScore:totalMarks, ok:"ok"}); render(); };
    if (none) none.onclick = () => { put({checked:[], override:true, manScore:0, ok:"bad"}); render(); };

    /* ── 提交 / 重新判分 ── */
    const GRADING = window.__GRADING || (window.__GRADING = {});
    const submitBtn = document.getElementById("submitq");
    if (submitBtn) submitBtn.onclick = async function(){
      const answer = joinSlots(readSlots());
      const c0 = cur();
      if (!answer.trim()) { toast("先写点答案再提交", false); return; }
      if (!canAuto) {
        put({override:true, ok:"ok"});
        const mb = document.getElementById("manualbox");
        if (mb) { mb.open = true; mb.scrollIntoView({behavior:"smooth", block:"center"}); }
        return;
      }
      if (GRADING[q.id]) return;
      if (c0.ai && !c0.override && c0.text === answer) {
        toast("这一版已经判过了，改动后才会重新判分", false);
        return;
      }
      GRADING[q.id] = true;
      submitBtn.disabled = true;
      const oldTxt = submitBtn.textContent;
      submitBtn.textContent = "判分中…";
      const payload = JSON.stringify({
        stem: q.stem,
        max_marks: totalMarks,
        reference: q.answer || "",
        criteria: pts.map(function(p,i){ return {id:critId(p,i), t:p.t, m:(p.m||1)}; }),
        answer: answer,
        subject: DATA.slug || "",
        topic: q.topic || ""
      });
      const engines = [];
      if (apibase()) engines.push({n:"cloud", u: apibase() + "/grade"});
      const loc = localAI();
      if (loc) engines.push({n:"local", u: loc + "/grade"});
      let lastErr = "no engine";
      for (const en of engines) {
        try {
          const r = await fetch(en.u, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: payload
          });
          const d = await r.json();
          if (!d || !d.ok) throw new Error((d && d.error) || ("http " + r.status));
          const res = Array.isArray(d.results) ? d.results : [];
          if (!res.length) throw new Error("no criterion results");
          const sum = res.reduce(function(a,x){ return a + (Number(x.awarded_marks) || 0); }, 0);
          const rawScore = (typeof d.score === "number") ? d.score : sum;
          const score = Math.max(0, Math.min(totalMarks, Math.round(rawScore)));
          const conf = (typeof d.confidence === "number")
            ? Math.max(0, Math.min(1, d.confidence)) : 0.5;
          const isLegacy = res.some(function(x){ return x && x.awarded_marks === undefined && x.i !== undefined; });
          if (isLegacy) {
            const normL = pts.map(function(p,i){
              const r = res.filter(function(x){ return Number(x.i) === i; })[0] || {};
              const mx = p.m || 1;
              return {id:critId(p,i), awarded: r.covered ? mx : 0, max:mx,
                      covered:!!r.covered, reason:String(r.reason || "")};
            });
            const scL = normL.reduce(function(a,x){ return a + x.awarded; }, 0);
            const aiL = {score:scL, max:totalMarks, results:normL,
              feedback:"（旧版判分接口，只能整点给分，建议更新服务器）",
              confidence:0.7, needsReview:false, model:String(d.model||"v1"),
              engine:en.n, at:Date.now()};
            const wasL = !!c0.gradedAt;
            state.answers[q.id] = Object.assign({}, c0, {
              chosen:-1, slots:readSlots(), text:answer, ai:aiL,
              gradedAt:aiL.at, gradeModel:aiL.model, gradeEngine:en.n,
              checked:normL.map(function(x,i){ return x.awarded>0?i:-1; }).filter(function(i){ return i>=0; }),
              override:false,
              ok: scL >= totalMarks ? "ok" : (scL > 0 ? "part" : "bad")
            });
            save();
            if (!wasL) {
              reviewMark(q.subj || DATA.slug, q.id, scL >= totalMarks);
              logAnswer(q.subj || DATA.slug, q.id, scL >= totalMarks, q.difficulty, "short");
            }
            GRADING[q.id] = false;
            render();
            return;
          }
          const norm = res.map(function(x,i){
            const mx = Math.max(1, Math.round(Number(x.maximum_marks) || 1));
            return {
              id: String(x.criterion_id || ("c" + (i+1))),
              awarded: Math.max(0, Math.min(mx, Math.round(Number(x.awarded_marks) || 0))),
              max: mx,
              covered: !!x.covered,
              reason: String(x.reason || "").slice(0, 240)
            };
          });
          const ai = {
            score: score, max: totalMarks, results: norm,
            feedback: String(d.feedback || "").slice(0, 500),
            confidence: conf,
            needsReview: conf < 0.6,
            model: String(d.model || ""),
            engine: en.n,
            at: Date.now()
          };
          const wasGraded = !!c0.gradedAt;
          const gotIdx = pts.map(function(p,i){ return i; }).filter(function(i){
            const id = critId(pts[i], i);
            const hit = norm.filter(function(x){ return x.id === id; })[0];
            return hit && hit.awarded > 0;
          });
          state.answers[q.id] = Object.assign({}, c0, {
            chosen:-1, slots:readSlots(), text:answer,
            ai:ai, gradedAt:ai.at, gradeModel:ai.model, gradeEngine:en.n,
            checked:gotIdx, override:false,
            ok: score >= totalMarks ? "ok" : (score > 0 ? "part" : "bad")
          });
          save();
          if (!wasGraded) {
            reviewMark(q.subj || DATA.slug, q.id, score >= totalMarks);
            logAnswer(q.subj || DATA.slug, q.id, score >= totalMarks, q.difficulty, "short");
            if (window.awardForQ) awardForQ(q.id, q.difficulty, "short",
              {ratio: totalMarks ? score / totalMarks : 0, answer: answer});
          }
          GRADING[q.id] = false;
          render();
          return;
        } catch (e) {
          lastErr = en.n + ": " + ((e && e.message) || e);
        }
      }
      GRADING[q.id] = false;
      submitBtn.disabled = false;
      submitBtn.textContent = oldTxt;
      toast("判分服务不可用（" + lastErr + "），已切到手动校正", false);
      const mb2 = document.getElementById("manualbox");
      if (mb2) mb2.open = true;
    };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        if (window.lbSubmit) lbSubmit(state.t0 ? (Date.now() - state.t0) : 0);
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
        if (window.lbOpen) setTimeout(function(){ lbOpen(); }, 600);
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.RX && answered > 0) {
      RX.once("exam|" + (DATA.slug || "all") + "|" + RX.day(),
              {xp: 20 + Math.min(80, answered), kind:"exam", src:(DATA.slug||"all")});
    }
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.criteria && x.criteria.length) ? x.criteria
              : ((x.points && x.points.length) ? x.points : [{m:1}]);
    const tot = (typeof x.marks === "number" && x.marks > 0)
      ? x.marks : pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const manGot = (r && r.checked)
      ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    const got = (r && r.override)
      ? (typeof r.manScore === "number" ? r.manScore : manGot)
      : ((r && r.ai && typeof r.ai.score === "number") ? r.ai.score : manGot);
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  const answeredN = qs.filter(x => rec(x.id)).length;
  const shortPct = totalM ? Math.round(earnedM / totalM * 100) : 0;
  const elapsed = state.t0 ? Math.max(0, Date.now() - state.t0) : 0;
  const emin = Math.floor(elapsed / 60000), esec = Math.floor((elapsed % 60000) / 1000);
  const timeTxt = elapsed ? (emin + "'" + ("0" + esec).slice(-2) + '"') : "—";
  const redoRows = needRedo.map(x => {
    const r = rec(x.id) || {};
    if (x.type === "mcq") {
      return `<div class="res-row bad"><span class="rt">${esc(x.topic)}</span>` +
             `<span class="tagx">选择</span><span class="val">✗</span></div>`;
    }
    const pts = (x.criteria || x.points || [{m:1}]);
    const tot = (typeof x.marks === "number" ? x.marks : pts.reduce((a,p)=>a+(p.m||1),0));
    const got = (r.ai && typeof r.ai.score === "number") ? r.ai.score
              : (r.override ? (r.manScore||0) : (r.checked||[]).reduce((a,_,i)=>a+(pts[i]?(pts[i].m||1):0),0));
    return `<div class="res-row part"><span class="rt">${esc(x.topic)}</span>` +
           `<span class="tagx">简答</span><span class="val">${got}/${tot}</span></div>`;
  }).join("");

  app.innerHTML = `<div class="card done">
      <div class="res-head">
        <span class="res-num"><b>${mcq.length ? pct : "—"}${mcq.length ? "%" : ""}</b><span>选择题 ${right.length} 对 · ${wrong.length} 错</span></span>
        <span class="res-num"><b>${earnedM}<em>/${totalM}</em></b><span>简答得分 ${shortPct}%</span></span>
        <span class="res-num"><b>${answeredN}<em>/${qs.length}</em></b><span>已作答</span></span>
        <span class="res-note">用时 ${timeTxt}${todo.length ? " · 还有 " + todo.length + " 题没做" : ""}</span>
      </div>
      ${redoRows ? `<div class="res-sec">需要再练（${needRedo.length}）</div><div class="res-list">${redoRows}</div>` : ""}
      <div class="actions">
        ${needRedo.length ? `<button class="btn" id="redo">只练错题（${needRedo.length} 题）</button>` : ""}
        <button class="btn ghost" id="showlb">${T("lb")}</button>
        <button class="btn ghost" id="again">${T("again")}</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← 回到科目列表</a>
      </div></div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    state.order = wrongIds.map(id => DATA.questions.findIndex(x => x.id === id)).filter(i => i >= 0);
    wrongIds.forEach(id => delete state.answers[id]);
    state.idx = 0; save(); render();
  };
  const showlb = document.getElementById("showlb");
  if (showlb) showlb.onclick = () => { if (window.lbOpen) lbOpen(); };
  document.getElementById("again").onclick = () => {
    state = {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
    save(); render();
  };
}

document.getElementById("grid").onclick = openNav;
document.getElementById("navclose").onclick = () => document.getElementById("nav").classList.remove("on");
document.getElementById("nav").addEventListener("click", e => {
  if (e.target && e.target.id === "nav") e.target.classList.remove("on");
});
try { localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); }
catch(e) { document.body.insertAdjacentHTML("afterbegin",
  '<div style="background:#ff5f56;color:#fff;padding:8px 16px;text-align:center;font-size:13px">这个浏览器禁用了本地存储：进度和错题本不会保存（Safari 用 file:// 打开时常见）。建议用 Chrome 打开，或把文件夹放到本地 HTTP 服务下。</div>'); }

document.getElementById("exam").onclick = startExam;
if (state.deadline) { timerId = setInterval(tickClock, 1000); tickClock(); }

var _tf = document.getElementById("tfilter");
function paintFilter(){
  if(!_tf) return;
  var f = TFILTER();
  _tf.textContent = f==="all" ? T("全部") : (f==="mcq" ? T("选择题") : T("简答"));
}
if (_tf) _tf.onclick = function(){
  var order = ["all","mcq","short"], cur = TFILTER();
  var nx = order[(order.indexOf(cur)+1) % 3];
  setTFILTER(nx);
  state.order = buildOrder(); state.idx = 0; save();
  paintFilter(); render();
};
var _langBtn = document.getElementById("langBtn");
if (_langBtn) _langBtn.onclick = cycleLang;
applyChrome();
paintFilter();
document.getElementById("restart").onclick = () => {
  if (!confirm(MULTI ? "回到选科目？" : "清空进度，从头开始？")) return;
  state = MULTI ? {setup:true, pick:state.pick, per:state.per} : {idx:0, answers:{}, order:buildOrder()};
  save(); render();
};

document.addEventListener("keydown", e => {
  if (MULTI && state.setup && !state.started) {
    if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("startmix"); if (b && b.onclick) b.onclick(); }
    return;
  }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") document.getElementById("nav").classList.remove("on"); return; }
  const q = state.order.length ? DATA.questions[state.order[state.idx]] : null;
  if (e.key === "ArrowRight" || e.key === "j") { if (state.idx < state.order.length-1){ state.idx++; save(); render(); } return; }
  if (e.key === "ArrowLeft" || e.key === "k") { if (state.idx > 0){ state.idx--; save(); render(); } return; }
  if (e.key === "g" || e.key === "G") { document.getElementById("nav").classList.contains("on") ? document.getElementById("nav").classList.remove("on") : openNav(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state.order && state.idx < state.order.length - 1) { state.idx++; save(); render(); }
    else showResult();
    return;
  }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); showResult(); return; }
  if (!q || q.type !== "mcq") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= (q.options || []).length) {
    if (!state.answers[q.id]) {
      state.answers[q.id] = {chosen:n-1, ok: n-1 === q.answer ? "ok" : "bad"};
      save(); render();
    }
  }
});

const REVIEW_KEY = "dsh-review-v1";
const GAPS = [1, 3, 7];
function reviewDb(){ try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); } catch(e){ return {}; } }
function reviewSave(db){ try { localStorage.setItem(REVIEW_KEY, JSON.stringify(db)); } catch(e){} }
function reviewMark(slug, qid, correct){
  const db = reviewDb(), id = slug + "::" + qid, now = Date.now();
  if (correct) {
    const it = db[id];
    if (!it) return;
    const st = (it.stage || 0) + 1;
    if (st >= GAPS.length) delete db[id];
    else { it.stage = st; it.due = now + GAPS[st]*864e5; it.last = now; }
  } else {
    const old = db[id] || {};
    db[id] = {stage:0, due: now + GAPS[0]*864e5, added: old.added || now, last: now};
  }
  reviewSave(db);
}
function numsOf(t){ return (String(t).match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

const LOG_KEY = "dsh-log-v1";
function logAnswer(slug, qid, ok, diff, ty){
  try {
    let arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    arr.push({t: Date.now(), s: slug, q: qid, ok: ok ? 1 : 0, d: diff || "", ty: ty || ""});
    if (arr.length > 3000) arr = arr.slice(-3000);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function navState(qi){
  const q = DATA.questions[qi], a = state.answers[q.id];
  if (!a) return "";
  if (q.type === "mcq") return a.ok === "ok" ? "ok" : "bad";
  const pts = q.points || [{m:1}], c = (a.checked || []).length;
  if (c >= pts.length) return "ok";
  if (c > 0) return "part";
  return "";
}
function openNav(){
  const grid = document.getElementById("navgrid");
  grid.innerHTML = state.order.map((qi, pos) =>
    `<button class="${navState(qi)}" data-pos="${pos}">${pos+1}</button>`).join("");
  grid.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.idx = +b.dataset.pos; save();
    document.getElementById("nav").classList.remove("on"); render();
  });
  document.getElementById("nav").classList.add("on");
}

let timerId = null;
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tickClock(){
  const el = document.getElementById("clock");
  if (!state.deadline) { if (el) el.style.display = "none"; return; }
  const left = state.deadline - Date.now();
  if (el) { el.style.display = ""; el.textContent = "⏱ " + fmtLeft(left);
            el.style.color = left < 5*60000 ? "var(--bad)" : "var(--dim)"; }
  if (left <= 0) { clearInterval(timerId); timerId = null; state.deadline = 0; save(); showResult(); }
}
function startExam(){
  const def = DATA.examMin || 60;
  const v = prompt("考试模式：倒计时多少分钟？（到点自动收卷）", def);
  if (v === null) return;
  const mins = parseInt(v, 10);
  if (!mins || mins <= 0) return;
  state.deadline = Date.now() + mins*60000; save();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
  tickClock();
}


load(); render();
</script>
