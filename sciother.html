<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科学 · 非年考 · 复习测验</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --fg:#e8ecf1; --dim:#9aa4b2;
  --line:#2a2f3a; --accent:#5b8cff; --ok:#2fbf71; --bad:#ff5f56; --warn:#f5a623;
}
@media (prefers-color-scheme: light) {
  :root{--bg:#f6f7f9;--card:#fff;--card2:#f0f2f5;--fg:#1b1f26;--dim:#5f6b7a;--line:#e2e6ec;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.bar .meta{color:var(--dim);font-size:13px}
.spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;
 font-size:12px;color:var(--dim)}
.progress{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{max-width:820px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.chip{padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.chip.easy{color:#2fbf71;border-color:#2fbf7144}
.chip.medium{color:#f5a623;border-color:#f5a62344}
.chip.hard{color:#ff5f56;border-color:#ff5f5644}
.stem{font-size:17px;line-height:1.6;margin:6px 0 16px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
 background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:11px;
 padding:12px 14px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:var(--bg);border:1px solid var(--line);
 display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card2))}
.opt.correct .k{background:var(--ok);color:#04170c;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card2))}
.opt.wrong .k{background:var(--bad);color:#1a0403;border-color:var(--bad)}
textarea{width:100%;min-height:96px;background:var(--card2);color:var(--fg);border:1px solid var(--line);
 border-radius:11px;padding:12px;font:inherit;resize:vertical}
.exp{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--card2);
 border-radius:0 10px 10px 0;font-size:14.5px;display:none}
.exp.show{display:block}
.exp b{color:var(--accent)}
.src{margin-top:8px;color:var(--dim);font-size:12px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;
 font:inherit;font-weight:600;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.btn:disabled{opacity:.45;cursor:default}
.done h2{margin:0 0 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:110px}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{color:var(--dim);font-size:12px}
.wronglist{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
.wronglist li{margin:4px 0}
footer{text-align:center;color:var(--dim);font-size:12px;padding:26px 16px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

.chip.warn{border-color:#f5a62366;color:#f5a623}
.muted{color:var(--dim);font-size:13px}
.pts{display:grid;gap:8px;margin-top:12px}
.pt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.pt.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card2))}
.pt input{margin-top:3px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--ok)}
.pt span{flex:1;min-width:0}
.pt em{color:var(--dim);font-style:normal;font-size:12px;white-space:nowrap}
.mine{margin-top:14px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
.mine div{margin-top:6px;white-space:pre-wrap;color:var(--dim)}
.fullans{margin-top:10px;font-size:14px}
.fullans summary{cursor:pointer;color:var(--accent)}
.fullans div{margin-top:8px;white-space:pre-wrap;color:var(--dim)}
.setup{max-width:760px;margin:0 auto}
.setup-head{margin:4px 0 20px}
.setup-head h2{margin:0 0 6px;font-size:22px}
.setup-head p{margin:0;font-size:13.5px;line-height:1.6}
.setup-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.setup-label{font-size:13px;color:var(--dim);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pick{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14px;min-width:0}
.pick input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--accent)}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick em{color:var(--dim);font-style:normal;font-size:12px;flex:0 0 auto}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:10px;
 padding:10px 0;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card2));font-weight:600}
.setup-foot{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:4px}
.setup-foot .sum{color:var(--dim);font-size:14px}
.setup-foot .sum b{color:var(--fg);font-size:18px}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;padding:24px}
.nav-overlay.on{display:block}
.nav-box{max-width:720px;margin:6vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.nav-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;max-height:56vh;overflow:auto}
.nav-grid button{padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);
 color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.nav-grid button.ok{border-color:var(--ok);color:var(--ok)}
.nav-grid button.bad{border-color:var(--bad);color:var(--bad)}
.nav-grid button.part{border-color:var(--warn);color:var(--warn)}
html,body{max-width:100%;overflow-x:hidden}
main{display:flex;flex-direction:column}
.card{flex:0 0 auto}
.chips{opacity:.92}
.chip{font-size:11px;padding:2px 8px}
.stem{font-size:19px;line-height:1.62;font-weight:500;margin:12px 0 20px}
.opts{gap:12px}
.opt{padding:14px 16px;font-size:15.5px;position:relative;border-left-width:3px}
.opt .txt{flex:1;min-width:0}
.opt .mk{margin-left:8px;font-weight:700}
.opt.correct{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;align-items:center;
 padding:10px max(16px,calc((100vw - 860px)/2)) calc(10px + env(safe-area-inset-bottom));
 background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.actionbar .spacer{flex:1}
main{padding-bottom:104px!important}
footer{padding-bottom:96px}
.sfxbtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
 padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.prof-tools{margin-top:10px}
.xp-toast{position:fixed;right:18px;bottom:92px;z-index:60;background:var(--card);border:1px solid var(--line);
 color:var(--dim);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
 opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.xp-toast.ok{border-color:var(--ok);color:var(--ok)}
.xp-toast.up{opacity:1;transform:translateY(0)}
.profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 22px}
.prof-main{display:flex;gap:16px;align-items:center}
.lv{width:64px;height:64px;border-radius:18px;background:color-mix(in srgb,var(--accent) 16%,var(--card2));
 display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 64px}
.lvnum{font-size:24px;font-weight:700;color:var(--accent);line-height:1}
.lvlab{font-size:10px;color:var(--dim);margin-top:2px}
.prof-body{flex:1;min-width:0}
.prof-line{display:flex;gap:10px;align-items:baseline;font-size:14px}
.prof-line b{font-size:17px}
.xpbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prof-meta{font-size:12px;color:var(--dim)}
.prof-meta b{color:var(--fg)}
.badges{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;opacity:.45}
.badge.on{opacity:1;border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.badge .bi{display:block;font-size:18px;line-height:1.3}
.badge .bn{display:block;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){ .badges{grid-template-columns:repeat(4,1fr)} }
.panel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
.panel-h{font-size:12px;color:var(--dim);margin-bottom:10px}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1 0 auto}
footer{margin-top:auto}
main,.card,.setup{max-width:100%}
.opt,.pt,.pick,.mine,.exp{min-width:0}
.stem,.opt span,.pt span{overflow-wrap:anywhere}
.actions{flex-wrap:wrap}
footer{padding:22px 14px 30px;line-height:1.8}

@media (max-width:720px){
  #scorepill{display:none}
  .bar a.pill{display:none}
  .bar{flex-wrap:wrap;row-gap:8px}
  .bar h1{flex:1 1 100%;font-size:16px;margin:0}
  .bar .spacer{display:none}
  #restart{display:none}
  #grid,#exam{padding:6px 10px!important;font-size:12px!important}
  .progress{margin-top:6px}
}
@media (max-width:560px){
  .bar{gap:8px}
  .bar h1{font-size:17px;line-height:1.3}
  .bar .meta{display:none}
  .pill{padding:3px 9px;font-size:11px}
  main{padding:12px 10px 84px}
  .card{padding:14px;border-radius:12px}
  .chips{gap:6px;margin-bottom:10px}
  .chip{font-size:11px;padding:1px 7px}
  .stem{font-size:15.5px;line-height:1.6;margin:2px 0 14px}
  .opt{padding:12px;font-size:15px;line-height:1.5;gap:10px}
  .opt .k{flex:0 0 22px;height:22px;font-size:11px}
  .actions{gap:8px;margin-top:14px}
  .actions .btn{padding:10px 12px;font-size:14px}
  .stem{font-size:17px;margin:10px 0 16px}
  .actionbar #prev,.actionbar #next{flex:1 1 0}
  .actionbar #finish{flex:0 0 auto}
  textarea{font-size:15px}
  .picks{grid-template-columns:1fr}
  .setup-head h2{font-size:20px}
  .setup-block{padding:14px}
  .seg{gap:6px}
  .seg button{padding:12px 0;font-size:13px}
  .setup-foot{flex-direction:column;align-items:stretch;gap:10px}
  .setup-foot .sum{text-align:center}
  .setup-foot .btn{width:100%;padding:12px 0;font-size:15px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{min-width:0;padding:10px 12px}
  .stat b{font-size:18px}
  footer{font-size:11px;padding:18px 10px 26px;overflow-wrap:anywhere}
}

</style>
</head>

<header>
  <div class="bar">

    <span class="meta">10SCI 26 · 33 题</span>

    <span class="pill" id="clock" style="display:none"></span>
    <button class="btn ghost" id="restart" style="padding:5px 10px;font-size:13px">重来</button>

  <div class="bar"><div class="progress" style="flex:1"><i id="pbar"></i></div></div>
</header>
<main id="app"></main>
<div id="nav" class="nav-overlay"><div class="nav-box">
  <div class="nav-head"><b>题号</b><span class="muted">绿=对 红=错 橙=半对 灰=未做</span><button class="btn ghost" id="navclose" style="margin-left:auto;padding:4px 10px">关闭</button></div>

const DATA = {"slug": "sciother", "title": "科学 · 非年考", "examMin": 60, "questions": [{"id": "sciother-001", "topic": "地球能量 · 太阳辐射", "difficulty": "easy", "type": "mcq", "stem": "Which two types of solar radiation reach the surface of the Earth and act as the main driving force for Earth's processes?", "options": ["Visible light and infrared", "Visible light and X-rays", "Microwaves and X-rays", "Microwaves and infrared"], "answer": 0, "explanation": "到达地表并驱动地球过程的主要是可见光和红外线：可见光提供光合作用的能量，红外线加热水圈驱动水循环。X 射线和微波绝大部分被大气吸收，到不了地表。", "source": "Term 1 · Earth's Energy – Earth.pdf（Topic 6 Earth · Solar radiation）", "weak": false}, {"id": "sciother-002", "topic": "地球能量 · 地球圈层", "difficulty": "easy", "type": "mcq", "stem": "Which of Earth's four spheres is described as the outer part of the Earth, consisting of the crust and upper mantle and about 100 km thick?", "options": ["Biosphere", "Lithosphere", "Atmosphere", "Hydrosphere"], "answer": 1, "explanation": "岩石圈（lithosphere）＝地壳＋上地幔，约 100 km 厚。大气圈是气体层，生物圈是生物生存的范围，水圈是地表固态/液态/气态的水。", "source": "Term 1 · Earth's Energy – Revision Booklet（Topic 6 Earth · Terminology）", "weak": false}, {"id": "sciother-003", "topic": "地球能量 · 反照率反馈", "difficulty": "medium", "type": "mcq", "stem": "Arctic sea ice melts and exposes the dark ocean underneath. Which statement best explains the effect on global temperature?", "options": ["Albedo increases, so more radiation is reflected and the temperature falls.", "Albedo stays the same because water and ice reflect the same amount of radiation.", "Albedo decreases, so more solar radiation is absorbed and the temperature rises further.", "Albedo decreases, so more radiation is reflected back to space and the temperature falls."], "answer": 2, "explanation": "反照率（albedo）介于 0 到 1，越白越反光。冰融化后露出深色海水，反照率下降，吸收更多太阳辐射，温度升高又加速融冰，形成正反馈。", "source": "Term 1 · Earth's Energy – STUDENT 5. Earth.docx（Practical 2 Albedo Effect）", "weak": false}, {"id": "sciother-004", "topic": "地球能量 · 水循环", "difficulty": "medium", "type": "short", "stem": "Explain how solar radiation drives the water cycle.", "options": [], "answer": "Infrared radiation from the Sun warms the hydrosphere, so liquid water evaporates into water vapour. The vapour rises and cools, condenses into clouds, and eventually falls back to the surface as precipitation such as rain, hail or snow.", "explanation": "水循环的能量来自太阳红外辐射加热水圈：蒸发→上升冷却凝结→降水，把水送回海洋、湖泊与河流。", "source": "Term 1 · Earth's Energy – Earth.pdf（Topic 6 · The Water Cycle）", "points": [{"t": "Infrared radiation from the Sun warms the hydrosphere, so liquid water evaporates into water vapour", "m": 1}, {"t": "The vapour rises and cools, condenses into clouds, and eventually falls back to the surface as precipitation such as rain, hail or snow", "m": 1}], "weak": false}, {"id": "sciother-005", "topic": "遗传 · 基因的定义", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines a gene?", "options": ["A compound that stores energy in all cells", "A whole chromosome containing many genes", "An inherited disease passed on to offspring", "A section of DNA that codes for a protein"], "answer": 3, "explanation": "基因是 DNA 上编码一种蛋白质的一段。染色体是 DNA 的组织形式（人体 23 对），DNA 本身由核苷酸组成，三者不是同一层级。", "source": "Term 1 · Genetics – Revision Booklet（Topic 8 Genetics · Terminology）", "weak": false}, {"id": "sciother-006", "topic": "遗传 · 碱基互补配对", "difficulty": "easy", "type": "mcq", "stem": "A section of DNA has the base sequence AGT TAC CTG. What is the sequence of the complementary DNA strand?", "options": ["TCA ATG GAC", "AGT TAC CTG", "UCA AUG GGC", "AGU UAC CUG"], "answer": 0, "explanation": "DNA 互补配对是 A–T、G–C，所以 AGT→TCA、TAC→ATG、CTG→GAC。含 U 的选项是 mRNA 序列，不是互补 DNA 链。", "source": "Term 1 · Genetics – 2020 Year 10 Yearly Examination Answers（Part D Q3）", "weak": false}, {"id": "sciother-007", "topic": "遗传 · 碱基比例计算", "difficulty": "medium", "type": "mcq", "stem": "In a sample of DNA, 30% of the bases are adenine. What percentage of the bases is guanine?", "options": ["30%", "20%", "40%", "10%"], "answer": 1, "explanation": "由 A=T 得 T 也占 30%，两者共 60%，剩下的 40% 由 G 与 C 平分，所以 G=20%。直接把 30% 选上（以为 G=A）是最常见的错误。", "source": "Term 1 · Genetics – 2020 Year 10 Yearly Examination Answers（Part D Q4）+ 碱基配对规则", "weak": false}, {"id": "sciother-008", "topic": "遗传 · 有丝分裂与减数分裂", "difficulty": "medium", "type": "short", "stem": "Distinguish between mitosis and meiosis in terms of the number of daughter cells produced and the chromosome number in each daughter cell.", "options": [], "answer": "Mitosis produces two genetically identical diploid daughter cells and is used for growth and repair of body cells. Meiosis produces four genetically different haploid gametes, each with half the chromosome number of the parent cell.", "explanation": "有丝分裂：2 个二倍体子细胞，用于生长与修复；减数分裂：4 个单倍体配子，用于有性生殖（23+23=46 恢复二倍体）。", "source": "Term 1 · Genetics – Genetics.pdf（Knowledge 2 · Compare mitosis and meiosis）", "points": [{"t": "Mitosis produces two genetically identical diploid daughter cells and is used for growth and repair of body cells", "m": 1}, {"t": "Meiosis produces four genetically different haploid gametes, each with half the chromosome number of the parent cell", "m": 1}], "weak": false}, {"id": "sciother-009", "topic": "遗传 · 基因突变（移码）", "difficulty": "medium", "type": "mcq", "stem": "One extra base is inserted into the middle of a gene. Which statement best describes the likely effect on the protein produced?", "options": ["There is no effect because the genetic code is degenerate.", "The DNA double helix can no longer be replicated.", "The reading frame shifts, so every codon after that point may code for a different amino acid.", "Only the codon containing the extra base is affected; the rest of the protein is normal."], "answer": 2, "explanation": "密码子按三个碱基一组读取，插入 1 个碱基会使其后所有密码子错位（frameshift），蛋白序列通常大幅改变。只有插入 3 的倍数个碱基才只影响一个氨基酸。", "source": "Term 1 · Genetics – Genetics.pdf（Knowledge 3 · Frameshift - Insertion）", "weak": false}, {"id": "sciother-010", "topic": "遗传 · 孟德尔遗传比例", "difficulty": "hard", "type": "mcq", "stem": "Two heterozygous tall pea plants (Tt) are crossed, and tall (T) is dominant over short (t). What fraction of the tall offspring is expected to be heterozygous?", "options": ["1/3", "1/2", "3/4", "2/3"], "answer": 3, "explanation": "Tt×Tt→1TT:2Tt:1tt，高:矮=3:1。题目问的是高茎子代内部的比例，分母只数高茎（3 份），其中杂合 Tt 占 2/3，所以不是 1/2，也不是 3/4。", "source": "Term 1 · Genetics – Half Yearly Revision.pdf（Punnett Squares：基因型与表现型比例）", "weak": false}, {"id": "sciother-011", "topic": "运动 · 平均速度", "difficulty": "easy", "type": "mcq", "stem": "A cyclist travels 300 m in 20 s. What is the cyclist's average speed?", "options": ["15 m/s", "0.067 m/s", "60 m/s", "320 m/s"], "answer": 0, "explanation": "v=d/t=300 m÷20 s=15 m/s。0.067 m/s 是把公式倒过来（20÷300）的错误，320 m/s 是把两个数字相加。", "source": "Term 1 · Motion – Speed and Velocity Problem Solving Jan 10（v = d/t）", "weak": false}, {"id": "sciother-012", "topic": "运动 · 标量与矢量", "difficulty": "easy", "type": "mcq", "stem": "Which of the following is a vector quantity?", "options": ["Time", "Displacement", "Speed", "Distance"], "answer": 1, "explanation": "位移有大小也有方向，是矢量；距离、速率、时间只有大小，是标量。速度（velocity）和力也是矢量。", "source": "Term 1 · Motion – Half Yearly Revision.pdf（Scalar vs Vector）", "weak": false}, {"id": "sciother-013", "topic": "运动 · 加速度公式", "difficulty": "medium", "type": "mcq", "stem": "A motorcycle travelling at 25 m/s accelerates at 7.0 m/s² for 6.0 s. What is its final speed?", "options": ["175 m/s", "42 m/s", "67 m/s", "56 m/s"], "answer": 2, "explanation": "v_f=v_i+at=25+7.0×6.0=25+42=67 m/s。42 m/s 只是速度的增加量，忘记加上初速度；175 m/s 是 25×7，用错了运算。", "source": "Term 1 · Motion – Acceleration Problems (Practice)（第 10 题）", "weak": false}, {"id": "sciother-014", "topic": "运动 · 运动图像", "difficulty": "medium", "type": "mcq", "stem": "On a velocity–time graph, what does the gradient (slope) of the line represent?", "options": ["The net force", "The distance travelled", "The average speed", "The acceleration"], "answer": 3, "explanation": "v–t 图的斜率＝Δv/Δt＝加速度；线下的面积才代表位移。这是本题最常见的混淆点（面积 vs 斜率）。", "source": "Term 1 · Motion – SG 1.1 Study Guide（velocity–time graph）", "weak": false}, {"id": "sciother-015", "topic": "运动 · 牛顿第二定律", "difficulty": "hard", "type": "short", "stem": "A 1200 kg car travelling at 20 m/s brakes and comes to rest in 5.0 s. Calculate (a) its acceleration and (b) the net force acting on it.", "options": [], "answer": "a = (v_f − v_i)/t = (0 − 20)/5.0 = −4.0 m/s², so the car decelerates at 4.0 m/s². F = ma = 1200 × (−4.0) = −4800 N, that is, a net force of 4800 N opposite to the car's motion.", "explanation": "先用加速度公式（末速减初速除以时间，负号表示减速），再代入 F=ma。合力 4800 N，方向与运动方向相反。", "source": "Term 1 · Motion – Half Yearly Revision.pdf（DESA：average acceleration 与 F = ma）", "points": [{"t": "a = (v_f − v_i)/t = (0 − 20)/5.0 = −4.0 m/s², so the car decelerates at 4.0 m/s²", "m": 1}, {"t": "F = ma = 1200 × (−4.0) = −4800 N, that is, a net force of 4800 N opposite to the car's motion", "m": 1}], "weak": false}, {"id": "sciother-016", "topic": "化学 · 酸与金属反应", "difficulty": "easy", "type": "mcq", "stem": "Magnesium is added to hydrochloric acid and a gas is produced that gives a 'pop' when a lit splint is held to it. Which gas is this?", "options": ["Hydrogen", "Oxygen", "Chlorine", "Carbon dioxide"], "answer": 0, "explanation": "酸＋金属→盐＋氢气，氢气用点燃的木条检验会发出爆鸣声（pop test）。若是酸＋碳酸盐，产生的气体是 CO2，要用石灰水检验。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 5 Answers（Acid-Metal Reaction）", "weak": false}, {"id": "sciother-017", "topic": "化学 · 中和反应", "difficulty": "easy", "type": "short", "stem": "Sodium hydroxide solution is added to hydrochloric acid. Name the type of reaction and write the word equation.", "options": [], "answer": "This is a neutralisation reaction. The word equation is: hydrochloric acid + sodium hydroxide → sodium chloride + water.", "explanation": "酸＋碱→盐＋水，即中和反应。盐的金属部分来自碱（Na⁺），非金属部分来自酸（Cl⁻），所以生成氯化钠。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers（Neutralisation Reaction）", "points": [{"t": "This is a neutralisation reaction", "m": 1}, {"t": "The word equation is: hydrochloric acid + sodium hydroxide → sodium chloride + water", "m": 1}], "weak": false}, {"id": "sciother-018", "topic": "化学 · 碰撞理论", "difficulty": "medium", "type": "mcq", "stem": "Using collision theory, why does raising the temperature increase the rate of a chemical reaction?", "options": ["The concentration of the reacting particles increases.", "Particles gain kinetic energy, so more collisions succeed.", "The particles get larger, so they collide more often.", "The activation energy of the reaction is lowered."], "answer": 1, "explanation": "碰撞理论要求粒子以足够的力和正确的方向相撞。升温提高平均动能，碰撞更频繁、超过活化能的有效碰撞比例更高，所以速率增大；降低活化能是催化剂的作用。", "source": "Term 2 · Reactive Chemistry – 2020 Year 10 Yearly Examination Answers（Part A Q7 碰撞理论）", "weak": false}, {"id": "sciother-019", "topic": "化学 · 酸与碳酸盐", "difficulty": "medium", "type": "short", "stem": "Copper carbonate is added to nitric acid. Write the word equation, name the salt formed, and describe how you would test for the gas produced.", "options": [], "answer": "copper carbonate + nitric acid → copper nitrate + water + carbon dioxide. The salt formed is copper nitrate. Bubble the gas through limewater; if the limewater turns milky (chalky white), the gas is carbon dioxide.", "explanation": "酸＋碳酸盐→盐＋水＋二氧化碳；盐名后半来自酸（硝酸→硝酸盐），所以是 copper nitrate。CO2 用石灰水变浑浊检验，注意不是用点燃的木条。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers（balanced equations / acid-carbonate）", "points": [{"t": "copper carbonate + nitric acid → copper nitrate + water + carbon dioxide. The salt formed is copper nitrate. Bubble the gas through limewater", "m": 1}, {"t": "if the limewater turns milky (chalky white), the gas is carbon dioxide", "m": 1}], "weak": false}, {"id": "sciother-020", "topic": "化学 · 化学方程式配平", "difficulty": "hard", "type": "mcq", "stem": "Which set of coefficients correctly balances this equation: __Al + __HCl → __AlCl₃ + __H₂ ?", "options": ["3, 6, 2, 3", "2, 3, 2, 3", "2, 6, 2, 3", "1, 3, 1, 3"], "answer": 2, "explanation": "2Al+6HCl→2AlCl₃+3H₂：左边 Al 2、H 6、Cl 6；右边 Al 2、Cl 2×3=6、H 3×2=6，两边原子数相等。配平只能改前面的系数，不能改下标。", "source": "Term 2 · Reactive Chemistry – Term 3 Reactive Chemistry Week 7 Answers（Balanced Equations part 2）", "weak": false}, {"id": "sciother-021", "topic": "核反应 · 同位素", "difficulty": "easy", "type": "mcq", "stem": "Carbon-12 and carbon-14 are both atoms of carbon. How do the two atoms differ?", "options": ["The number of protons", "The number of electrons in a neutral atom", "The number of electron shells", "The number of neutrons"], "answer": 3, "explanation": "同位素指质子数相同、中子数不同的同种元素原子。碳-12 有 6 个中子，碳-14 有 8 个中子；中性原子电子数相同，都是 6 个。", "source": "Term 2 · Nuclear Reactions – atomic_models_interactive_v2.html（Isotopes）", "weak": false}, {"id": "sciother-022", "topic": "核反应 · 恒星核聚变", "difficulty": "medium", "type": "mcq", "stem": "In the core of a main sequence star such as the Sun, hydrogen nuclei are combined to form helium, releasing large amounts of energy. What is this process called?", "options": ["Nuclear fusion", "Nuclear fission of uranium", "Chemical combustion of hydrogen in oxygen", "Radioactive decay of carbon"], "answer": 0, "explanation": "太阳核心约 1500 万 °C，氢核聚变成氦核并释放巨大能量，这正是太阳辐射的来源。它属于核反应，不是化学燃烧（化学燃烧不改变原子核）。", "source": "Term 2 · Nuclear Reactions – The Universe 2020.pptx（Main Sequence Star）+ Revision Booklet Topic 6（solar radiation 定义）", "weak": false}, {"id": "sciother-023", "topic": "核反应 · 放射性测年", "difficulty": "medium", "type": "short", "stem": "Explain how scientists use radioactive carbon (carbon-14) in the remains of a once-living organism to work out when it died.", "options": [], "answer": "While an organism is alive it continuously takes in small amounts of radioactive carbon dioxide from the air. When it dies the intake stops, so the radioactive carbon slowly decays into the non-radioactive form. Measuring how much radioactive carbon is left in the remains therefore shows how long ago the organism died.", "explanation": "活着时不断摄入放射性碳；死亡后摄入停止，放射性碳按固定速率衰变。测剩余比例即可推算死亡时间（绝对测年）。", "source": "Term 2 · Nuclear Reactions – Year 10 - Evolution.pptx（Techniques used to date fossils · Absolute dating）", "points": [{"t": "While an organism is alive it continuously takes in small amounts of radioactive carbon dioxide from the air", "m": 1}, {"t": "When it dies the intake stops, so the radioactive carbon slowly decays into the non-radioactive form", "m": 1}, {"t": "Measuring how much radioactive carbon is left in the remains therefore shows how long ago the organism died", "m": 1}], "weak": false}, {"id": "sciother-024", "topic": "气候 · 温室效应", "difficulty": "easy", "type": "mcq", "stem": "Which statement correctly distinguishes the enhanced greenhouse effect from the natural greenhouse effect?", "options": ["The natural greenhouse effect stops all infrared radiation from leaving the atmosphere.", "The enhanced greenhouse effect is the additional warming caused by human activities releasing abnormally high amounts of greenhouse gases.", "The natural greenhouse effect is caused by human activity, while the enhanced effect is caused by volcanic eruptions.", "The enhanced greenhouse effect only occurs when the ozone layer is destroyed."], "answer": 1, "explanation": "自然温室效应是大气温室气体吸收红外辐射、使地球温度相对稳定；增强温室效应是人类活动额外排放温室气体造成的附加升温。臭氧层空洞是另一个问题，不能混为一谈。", "source": "Term 3 · Climate Science – Term 3 Earth Week 1 Answers（natural vs enhanced greenhouse effect）", "weak": false}, {"id": "sciother-025", "topic": "气候 · 温室气体识别", "difficulty": "easy", "type": "mcq", "stem": "Which gas is a colourless, odourless, incombustible greenhouse gas formed during respiration, combustion and the breakdown of dead organic material?", "options": ["Methane", "Nitrogen", "Carbon dioxide", "Argon"], "answer": 2, "explanation": "题眼是 incombustible（不可燃）：甲烷可燃，氮气和氩气既不是题述来源的产物也不是主要温室气体，所以是二氧化碳。", "source": "Term 3 · Climate Science – 2020 Year 10 Yearly Examination Answers（Part B Q2）", "weak": false}, {"id": "sciother-026", "topic": "气候 · 减缓与适应策略", "difficulty": "medium", "type": "mcq", "stem": "Which of the following is an example of an adaptation strategy rather than a mitigation strategy?", "options": ["Building wind farms to generate electricity without coal", "Capturing and storing carbon dioxide from power stations", "Installing solar panels on the roofs of houses", "Painting roofs white to mimic the albedo effect"], "answer": 3, "explanation": "减缓（mitigation）针对减排、稳定大气温室气体浓度（风能、太阳能、碳封存）；适应（adaptation）针对已经发生的影响、降低社会脆弱性，例如把屋顶刷白提高反照率。", "source": "Term 3 · Climate Science – Revision Booklet（Topic 6 · Mitigation / Adaptation strategies）", "weak": false}, {"id": "sciother-027", "topic": "气候 · 海洋酸化", "difficulty": "hard", "type": "mcq", "stem": "Extra carbon dioxide dissolves in seawater and forms carbonic acid, which releases hydrogen ions. Why does this harm shellfish?", "options": ["The hydrogen ions compete with the shells for carbonate ions, so shellfish cannot build their shells.", "The hydrogen ions dissolve the calcium carbonate shells by raising the pH of the water.", "The extra carbon dioxide warms the water so the shellfish cannot respire.", "The carbonic acid removes calcium from the water so shellfish absorb more carbonate."], "answer": 0, "explanation": "碳酸根是造壳原料，多出的 H⁺ 会与碳酸根结合成碳酸氢根，等于和贝壳“抢”碳酸根，壳体难以生成。另外酸化的方向是 pH 降低，不是升高。", "source": "Term 3 · Climate Science – Term 3 Earth Week 2 Answers（Ocean Acidification）", "weak": false}, {"id": "sciother-028", "topic": "气候 · 冻土正反馈", "difficulty": "hard", "type": "short", "stem": "Large areas of Arctic permafrost are thawing. Explain why this is described as a positive feedback that makes global warming worse.", "options": [], "answer": "Frozen soils store large amounts of organic carbon and methane. When the permafrost thaws, microbes break this material down and release carbon dioxide and methane, which are both greenhouse gases. These extra gases trap more const KEY = "dsh-quiz-sciother";
const MULTI = DATA.slug === "all";
const app = document.getElementById("app");
let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = DATA.questions.map((_,i)=>i);
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderSetup() {
  const subs = DATA.subjects || {};
  const keys = Object.keys(subs);
  const saved = state.pick || {};
  const opts = keys.map(k => {
    const on = saved[k] !== false;
    return `<label class="pick"><input type="checkbox" data-s="${k}" ${on ? "checked" : ""}>
      <span class="nm" title="${esc(subs[k].zh || k)}">${esc(subs[k].zh || k)}</span><em>${subs[k].n}</em></label>`;
  }).join("");
  const per = (state.per === undefined || state.per === null) ? 10 : state.per;
  const DAILY = ["sci","eng","his","geo","pdh","matp","maths53"];
  app.innerHTML = `<div class="setup">
    <div class="setup-head">
      <h2>综合卷 · 全科</h2>
      <p class="muted">从各科抽题混着做；做错的题会按它原本的科目进错题本，并按第 1/3/7 天排期。</p>
    </div>

    <section class="setup-block">
      <div class="setup-label">1 · 选科目 <span class="muted" id="pickcount"></span></div>
      <div class="picks">${opts}</div>
    </section>

    <section class="setup-block">
      <div class="setup-label">2 · 每科抽几题</div>
      <div class="seg">${[5,10,20,0].map(n => `<button data-n="${n}" class="${per===n?'on':''}">${n? n+' 题':'全部'}</button>`).join("")}</div>
    </section>

    <div class="setup-foot">
      <div class="sum">共 <b id="cnt">0</b> 题</div>
      <button class="btn ghost" id="daily">今日挑战</button>
      <button class="btn" id="startmix">开始答题 →</button>
    </div>
  </div>`;
  const chosenCount = () => {
    let c = 0;
    app.querySelectorAll(".pick input").forEach(cb => { if (cb.checked) c++; });
    return c || Object.keys(subs).filter(k => (state.pick || {})[k] !== false).length;
  };
  const calc = () => {
    let n = 0;
    app.querySelectorAll(".pick input").forEach(cb => {
      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = "已选 " + chosenCount() + " 科";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
    state.answers={}; state.daily=key; state.rewarded=false; save(); render();
  }
  document.getElementById("daily").onclick = startDaily;
  document.getElementById("startmix").onclick = () => {
    const chosen = keys.filter(k => (state.pick || {})[k] !== false);
    if (!chosen.length) { alert("至少选一科"); return; }
    let idxs = [];
    chosen.forEach(k => {
      let pool = DATA.questions.map((q, i) => q.subj === k ? i : -1).filter(i => i >= 0);
      pool.sort(() => Math.random() - 0.5);
      idxs = idxs.concat(per ? pool.slice(0, per) : pool);
    });
    idxs.sort(() => Math.random() - 0.5);
    state.order = idxs; state.idx = 0; state.started = true; state.setup = false;
    state.answers = {}; save(); render();
  };
  calc();
}


function render() {
  if (MULTI && location.hash === "#daily" && !state.started && !state.dailyAuto) {
    state.dailyAuto = true; if (typeof startDaily === "function") startDaily();
  }
  if (MULTI && state.setup && !state.started) return renderSetup();
  const qs = state.order.map(i => DATA.questions[i]);
  const q = qs[state.idx];
  const total = qs.length;
  const answered = qs.filter(x => state.answers[x.id]).length;
  const right = qs.filter(x => state.answers[x.id] === "ok").length;
  const wrong = qs.filter(x => state.answers[x.id] === "bad").length;
  document.getElementById("counter").textContent = (state.idx+1) + " / " + total;
  document.getElementById("scorepill").textContent = "✓ " + right + "  ✗ " + wrong;
  document.getElementById("pbar").style.width = (answered/total*100).toFixed(1) + "%";
  if (!q) { app.innerHTML = "<p>这套题是空的。</p>"; return; }

  const rec = state.answers[q.id];
  const chips = `<div class="chips">
      ${MULTI && q.subjZh ? `<span class="chip">${esc(q.subjZh)}</span>` : ""}
      <span class="chip">${esc(q.topic)}</span>
      <span class="chip ${esc(q.difficulty)}">${ {easy:"简单",medium:"中等",hard:"较难"}[q.difficulty] || esc(q.difficulty) }</span>
      <span class="chip">${q.type === "mcq" ? "选择题" : "简答"}</span>
      <span class="chip">第 ${state.idx+1} 题 / 共 ${total}</span>
    </div>`;

  let bodyHtml = "";
  if (q.type === "mcq") {
    const opts = (q.options || []).map((o, i) => {
      let cls = "opt", mark = "";
      if (rec) {
        if (i === q.answer) { cls += " correct"; mark = '<span class="mk">✓</span>'; }
        else if (rec.chosen === i) { cls += " wrong"; mark = '<span class="mk">✗</span>'; }
      }
      return `<button class="${cls}" data-i="${i}" ${rec ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[i]}</span><span class="txt">${esc(o)}</span>${mark}</button>`;
    }).join("");
    bodyHtml = `<div class="opts">${opts}</div>`;
  } else {
    const pts = q.points && q.points.length ? q.points : [{t:q.answer, m:1}];
    const totalMarks = pts.reduce((a,p)=>a+(p.m||1),0);
    const checked = (rec && rec.checked) ? rec.checked : [];
    const earned = pts.reduce((a,p,i)=>a + (checked.indexOf(i)>=0 ? (p.m||1) : 0), 0);
    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    bodyHtml = `<textarea id="ta" placeholder="先自己写（英文），写完点下面的按钮对照得分点">${rec && rec.text ? esc(rec.text) : ""}</textarea>
      <div class="actions">
        <button class="btn" id="reveal">${rec ? "重新对照得分点" : "对照得分点"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        ${rec ? `<span class="pill" style="align-self:center">已得 <b>${earned}</b> / ${totalMarks} 分</span>` : `<span class="muted" style="align-self:center">共 ${totalMarks} 分 · ${pts.length} 个得分点</span>`}
      </div>`;
    if (rec) {
      bodyHtml += `<div class="panel">
        <div class="panel-h">自评 · 勾选你写到的得分点</div>
        <div class="pts">${pts.map((p,i)=>`
          <label class="pt ${checked.indexOf(i)>=0?'on':''}"><input type="checkbox" data-i="${i}" ${checked.indexOf(i)>=0?'checked':''}><span>${esc(p.t)}</span><em>${p.m||1} 分</em></label>`).join("")}</div>
        <div class="actions">
          <button class="btn ghost" id="allpt">全部勾上</button>
          <button class="btn ghost" id="nonept">全部取消</button>
        </div>
        <div class="mine"><b>你写的：</b><div>${esc(((rec.text||"").trim()) || "（空）")}</div></div>
      </div>`;
    }
  }

  const expHtml = rec ? `<div class="exp show"><b>解析：</b>${esc(q.explanation)}
      ${q.type === "short" ? `<details class="fullans"><summary>看完整参考答案</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">出处：${esc(q.source || "")}</div></div>` : "";

  const last = state.idx >= total - 1;
  app.innerHTML = `<div class="card">${chips}<div class="stem">${esc(q.stem)}</div>
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>← 上一题</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">看成绩</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>下一题 →</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq", i === q.answer);
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq");
      save(); render();
    }));
  } else {
    const ta = document.getElementById("ta");
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    document.getElementById("reveal").onclick = () => {
      const c = cur();
      state.answers[q.id] = {chosen:-1, text: ta.value, checked: c.checked || [], ok:"ok"};
      save(); render();
    };
    app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur(); const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      state.answers[q.id] = {chosen:-1, text: c.text, checked: [...set].sort((a,b)=>a-b), ok:"ok"};
      const full = pts.every((_,i)=>set.has(i));
      if (window.awardForQ && full && !(c.checked && c.checked.length >= pts.length)) awardForQ(q.id, q.difficulty, "short", true);
      reviewMark(q.subj || DATA.slug, q.id, full);
      logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short");
      save(); render();
    }));
    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const u = numsOf(ta.value), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!u.length) { res.textContent = "你还没写数字"; res.style.color = "var(--dim)"; return; }
      if (!a.length) { res.textContent = "参考答案无数字"; res.style.color = "var(--dim)"; return; }
      const last = u[u.length-1];
      const hit = a.some(v => Math.abs(v-last) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "✓ 数值与参考答案一致" : "✗ 数值与参考答案不一致";
      res.style.color = hit ? "var(--ok)" : "var(--bad)";
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:pts.map((_,i)=>i),ok:"ok"}; save(); render(); };
    if (none) none.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:[],ok:"ok"}; save(); render(); };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.awardXP && answered > 0) awardXP(20 + Math.min(80, answered), true);
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.points && x.points.length) ? x.points : [{m:1}];
    const tot = pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const got = (r && r.checked) ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  app.innerHTML = `<div class="card done">
      <h2>选择题 ${right.length} / ${mcq.length} 正确（${pct}%）</h2>
      <div class="stats">
        <div class="stat"><b>${right.length}</b><span>选择题答对</span></div>
        <div class="stat"><b>${wrong.length}</b><span>选择题答错</span></div>
        <div class="stat"><b>${earnedM}</b><span>简答得分 / ${totalM}</span></div>

document.addEventListener("keydown", e => {
  if (MULTI && state.setup && !state.started) {
    if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("startmix"); if (b && b.onclick) b.onclick(); }
    return;
  }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") document.getElementById("nav").classList.remove("on"); return; }
  const q = state.order.length ? DATA.questions[state.order[state.idx]] : null;
  if (e.key === "ArrowRight" || e.key === "j") { if (state.idx < state.order.length-1){ state.idx++; save(); render(); } return; }
  if (e.key === "ArrowLeft" || e.key === "k") { if (state.idx > 0){ state.idx--; save(); render(); } return; }
  if (e.key === "g" || e.key === "G") { document.getElementById("nav").classList.contains("on") ? document.getElementById("nav").classList.remove("on") : openNav(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state.order && state.idx < state.order.length - 1) { state.idx++; save(); render(); }
    else showResult();
    return;
  }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); showResult(); return; }
  if (!q || q.type !== "mcq") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= (q.options || []).length) {
    if (!state.answers[q.id]) {
      state.answers[q.id] = {chosen:n-1, ok: n-1 === q.answer ? "ok" : "bad"};
      save(); render();
    }
  }
});

const REVIEW_KEY = "dsh-review-v1";
const GAPS = [1, 3, 7];
function reviewDb(){ try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); } catch(e){ return {}; } }
function reviewSave(db){ try { localStorage.setItem(REVIEW_KEY, JSON.stringify(db)); } catch(e){} }
function reviewMark(slug, qid, correct){
  const db = reviewDb(), id = slug + "::" + qid, now = Date.now();
  if (correct) {
    const it = db[id];
    if (!it) return;
    const st = (it.stage || 0) + 1;
    if (st >= GAPS.length) delete db[id];
    else { it.stage = st; it.due = now + GAPS[st]*864e5; it.last = now; }
  } else {
    const old = db[id] || {};
    db[id] = {stage:0, due: now + GAPS[0]*864e5, added: old.added || now, last: now};
  }
  reviewSave(db);
}
function numsOf(t){ return (String(t).match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

const LOG_KEY = "dsh-log-v1";
function logAnswer(slug, qid, ok, diff, ty){
  try {
    let arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    arr.push({t: Date.now(), s: slug, q: qid, ok: ok ? 1 : 0, d: diff || "", ty: ty || ""});
    if (arr.length > 3000) arr = arr.slice(-3000);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function navState(qi){
  const q = DATA.questions[qi], a = state.answers[q.id];
  if (!a) return "";
  if (q.type === "mcq") return a.ok === "ok" ? "ok" : "bad";
  const pts = q.points || [{m:1}], c = (a.checked || []).length;
  if (c >= pts.length) return "ok";
  if (c > 0) return "part";
  return "";
}
function openNav(){
  const grid = document.getElementById("navgrid");
  grid.innerHTML = state.order.map((qi, pos) =>
    `<button class="${navState(qi)}" data-pos="${pos}">${pos+1}</button>`).join("");
  grid.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.idx = +b.dataset.pos; save();
    document.getElementById("nav").classList.remove("on"); render();
  });
  document.getElementById("nav").classList.add("on");
}

let timerId = null;
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tickClock(){
  const el = document.getElementById("clock");
  if (!state.deadline) { if (el) el.style.display = "none"; return; }
  const left = state.deadline - Date.now();
  if (el) { el.style.display = ""; el.textContent = "⏱ " + fmtLeft(left);
            el.style.color = left < 5*60000 ? "var(--bad)" : "var(--dim)"; }
  if (left <= 0) { clearInterval(timerId); timerId = null; state.deadline = 0; save(); showResult(); }
}
function startExam(){
  const def = DATA.examMin || 60;
  const v = prompt("考试模式：倒计时多少分钟？（到点自动收卷）", def);
  if (v === null) return;
  const mins = parseInt(v, 10);
  if (!mins || mins <= 0) return;
  state.deadline = Date.now() + mins*60000; save();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
  tickClock();
}


load(); render();

<script>
(function(){

  /* ---- 每日挑战任务（对应“挑战”要素） ---- */
  var QKEY="dsh-quest-v1";

    {id:"q_acc80", n:"正确率 80%（至少 10 题）", tip:"精准", type:"acc", target:80, r:{coin:60}},
    {id:"q_short3", n:"完成 3 道简答自评", tip:"写作", type:"short", target:3, r:{coin:45}},
    {id:"q_daily", n:"完成今日挑战", tip:"每日", type:"daily", target:1, r:{dust:2}}
  ];
  function qseed(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function todayLog(){ var d0=new Date(); d0.setHours(0,0,0,0); return log().filter(function(x){ return x.t>=d0.getTime(); }); }
  function quests(){
    var Q=null;
    try{ Q=JSON.parse(localStorage.getItem(QKEY)||"null"); }catch(e){}
    if(!Q || Q.date!==todayKey()){
      var rnd=qseed("q:"+todayKey()), pool=QTEMPL.slice();
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      Q={date:todayKey(), list:pool.slice(0,3).map(function(x){return x.id;}), claimed:[]};
      try{ localStorage.setItem(QKEY,JSON.stringify(Q)); }catch(e){}
    }
    return Q;
  }
  function questProgress(){
    var L=todayLog(), n=L.length;
    var okCnt=L.filter(function(x){return x.ok;}).length;
    var maxCombo=0, cur=0;
    L.slice().sort(function(a,b){return a.t-b.t;}).forEach(function(x){ if(x.ok){ cur++; maxCombo=Math.max(maxCombo,cur);} else cur=0; });
    var hard=L.filter(function(x){ return x.ok && x.d==="hard"; }).length;
    var short=L.filter(function(x){ return x.ty==="short"; }).length;
    var acc = n>=10 ? Math.round(okCnt/n*100) : 0;
    var dailyDone = 0;
    try{ var dr=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); if(dr.date===todayKey()) dailyDone=1; }catch(e){}
    return {count:n, combo:maxCombo, hard:hard, short:short, acc:acc, daily:dailyDone};
  }
  function questValue(q, p){ return p[q.type] || 0; }
  window.quests=quests; window.questProgress=questProgress; window.questValue=questValue; window.QTEMPL=QTEMPL;

  var CHEST_KEY="dsh-chest-v1";
  function openChest(){
    var roll=Math.random(), msg="", dust=0, coin=0;
    if(roll<0.10){ dust=3; msg="💎 稀有宝箱：星尘 ×3"; addDust(3); }
    else if(roll<0.45){ coin=Math.round(30+Math.random()*40); msg="🎁 宝箱：金币 +"+coin; addCoins(coin); }
    else { dust=1; msg="🎁 宝箱：星尘 ×1"; addDust(1); }
    try{ var c=JSON.parse(localStorage.getItem(CHEST_KEY)||'{"n":0}'); c.n=(c.n||0)+1; localStorage.setItem(CHEST_KEY,JSON.stringify(c)); }catch(e){}
    setTimeout(function(){ toast(msg, true); beep(880,0.18,"triangle",0.07); }, 700);
    if(window.__refreshProfile) window.__refreshProfile();
  }
  window.openChest=openChest;

  function claimQuest(id){
    var Q=quests(), meta=null;
    QTEMPL.forEach(function(x){ if(x.id===id) meta=x; });
    if(!meta) return {ok:false,msg:"任务不存在"};
    if(Q.claimed.indexOf(id)>=0) return {ok:false,msg:"已经领过了"};
    var p=questProgress();
    if(questValue(meta,p) < meta.target) return {ok:false,msg:"还没完成"};
    Q.claimed.push(id);
    try{ localStorage.setItem(QKEY,JSON.stringify(Q)); }catch(e){}
    if(meta.r.coin) addCoins(meta.r.coin);
    if(meta.r.dust) addDust(meta.r.dust);
    toast("✅ 任务完成："+meta.n+" · +"+(meta.r.coin?meta.r.coin+" 币":meta.r.dust+" 星尘"), true);
    beep(1046,0.16,"triangle",0.07);
    if(window.__refreshProfile) window.__refreshProfile();
    return {ok:true,msg:"已领取"};
  }
  window.claimQuest=claimQuest;
  window.awardForQ=awardForQ;
  window.awardXP=awardXP; window.checkBadges=checkBadges;
  window.GAME={db:db,levelOf:levelOf,BADGES:BADGES,bdb:bdb,todayCount:todayCount,streakDays:streakDays,
    GOAL:GOAL,coins:readCoins,inv:readInv,buffs:readBuffs,SHOP:SHOP,buy:buy,equipTheme:equipTheme,
    equipTitle:equipTitle,toast:toast,applyTheme:applyTheme,addCoins:addCoins,addDust:addDust,
    shieldCount:shieldCount,toggleSfx:toggleSfx,sfxOn:function(){return SFX_ON;},beep:beep};

  function renderQuests(host){
    if(!host) return;
    var Q=quests(), p=questProgress();
    var rows=Q.list.map(function(id){
      var m=null; QTEMPL.forEach(function(x){ if(x.id===id) m=x; });
      var v=Math.min(questValue(m,p), m.target), pct=Math.round(v/m.target*100);
      var done=v>=m.target, claimed=Q.claimed.indexOf(id)>=0;
      var btn = claimed ? '<span class="qdone">已领取</span>'
              : (done ? '<button class="qbtn" data-claim="'+id+'">领取</button>'
                      : '<span class="qnum">'+v+'/'+m.target+'</span>');
      return '<div class="qrow'+(done?' done':'')+'"><span class="qtip">'+m.tip+'</span>'+
        '<span class="qname">'+m.n+'</span>'+
        '<span class="qbar"><i style="width:'+pct+'%"></i></span>'+btn+'</div>';
    }).join("");
    host.innerHTML='<h2 class="gh">今日任务 <span class="gz">每天 0 点刷新 · 3 个随机</span></h2><div class="qlist">'+rows+'</div>';
  }
  window.__renderQuests=renderQuests;

  /* ---- 好友榜：不用服务器，靠“战绩码”互传 ---- */
  var FKEY="dsh-friends-v1", NKEY="dsh-nick", AKEY="dsh-api";
  var DEFAULT_API = "https://bbc-quiz-board.chrisguo927.workers.dev";
  function apibase(){ try{ return (localStorage.getItem(AKEY)||DEFAULT_API||"").replace(/\/$/,""); }catch(e){ return ""; } }
  function setApi(v){ try{ localStorage.setItem(AKEY,(v||"").trim().replace(/\/$/,"")); }catch(e){} }
  function loadBoard(){
    var box=document.getElementById("rankbox"); if(!box||!apibase()) return;
    fetch(apibase()+"/board?day="+encodeURIComponent(todayKey()))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok || !d.list) return;
        if(!d.list.length){ box.innerHTML='<div class="mutedsmall">云端还没有今天的成绩，做一轮然后点「☁ 提交」</div>'; return; }
        var me=nick()||"我";
        box.innerHTML=d.list.map(function(x,i){
          return '<div class="rrow'+(x.name===me?' me':'')+'"><span class="rn">'+(i+1)+'</span>'+
                 '<span class="rname">'+x.name+(x.name===me?'（我）':'')+'</span>'+
                 '<span class="rp">'+x.pct+'%</span></div>';
        }).join("");
      })
      .catch(function(){});
  }
  function pushScore(){
    if(!apibase()) return {ok:false,msg:"还没设置服务器地址"};
    var rec={}; try{ rec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    if(rec.date!==todayKey()) return {ok:false,msg:"先做完今日挑战"};
    fetch(apibase()+"/score",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:nick()||"我", pct:rec.best||0, answered:rec.answer||21, day:rec.date})})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok) loadBoard(); })
      .catch(function(){});
    return {ok:true,msg:"已提交"};
  }
  window.loadBoard=loadBoard; window.pushScore=pushScore; window.apibase=apibase; window.setApi=setApi;
  function b64e(str){ try{ return btoa(unescape(encodeURIComponent(str))).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_"); }catch(e){ return ""; } }
  function b64d(str){ try{ return decodeURIComponent(escape(atob(str.replace(/-/g,"+").replace(/_/g,"/")))); }catch(e){ return ""; } }
  function nick(){ try{ return localStorage.getItem(NKEY)||""; }catch(e){ return ""; } }
  function setNick(v){ try{ localStorage.setItem(NKEY, v); }catch(e){} }
  function friends(){ try{ return JSON.parse(localStorage.getItem(FKEY)||"[]"); }catch(e){ return []; } }
  function saveFriends(a){ try{ localStorage.setItem(FKEY, JSON.stringify(a.slice(0,60))); }catch(e){} }

  function myCode(){
    var rec={}; try{ rec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    if(rec.date!==todayKey()) return {ok:false,msg:"先做完今日挑战"};
    var g=db();
    return {ok:true, code:b64e(JSON.stringify({v:1,d:rec.date,p:rec.best,n:rec.answer||21,
      name:(nick()||"我"), xp:g.xp||0}))};
  }
  function addCode(str){
    var raw=b64d((str||"").trim());
    if(!raw) return {ok:false,msg:"码不对"};
    var o; try{ o=JSON.parse(raw); }catch(e){ return {ok:false,msg:"码不对"}; }
    if(!o || o.v!==1 || !o.d || o.p===undefined) return {ok:false,msg:"码不对"};
    var list=friends();
    list=list.filter(function(x){ return !(x.d===o.d && x.name===o.name); });
    list.push({d:o.d, p:o.p, n:o.n||0, name:String(o.name||"同学").slice(0,12), xp:o.xp||0, t:Date.now()});
    saveFriends(list);
    return {ok:true,msg:"已加入 "+String(o.name||"同学").slice(0,12)+" 的 "+o.p+"%"};
  }
  window.myCode=myCode; window.addCode=addCode; window.nick=nick; window.setNick=setNick;

  function renderBoard(host){
    if(!host) return;
    var g=db(), c=readCoins(), L=log();
    var days={}, dayOk={};
    L.forEach(function(x){ var d=new Date(x.t); d.setHours(0,0,0,0);
      var k=d.getTime();
      days[k]=(days[k]||0)+1; dayOk[k]=(dayOk[k]||0)+(x.ok?1:0); });
    var dayList=Object.keys(days).map(function(k){
      var d=new Date(+k);
      return {ts:+k, d:(d.getMonth()+1)+"-"+d.getDate(), n:days[k], ok:dayOk[k],
              pct:Math.round(dayOk[k]/days[k]*100)};
    }).sort(function(a,b){ return b.ts-a.ts; }).slice(0,7);
    var myRec={}; try{ myRec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    var rows=[];
    if(myRec.date===todayKey()) rows.push({name:nick()||"我", p:myRec.best||0, me:true});
    friends().filter(function(x){ return x.d===todayKey(); }).forEach(function(x){
      rows.push({name:x.name, p:x.p, me:false});
    });
    rows.sort(function(a,b){ return b.p-a.p; });
    var rankHtml = rows.length ? ('<div class="rank" id="rankbox">'+rows.map(function(r,i){
      return '<div class="rrow'+(r.me?' me':'')+'"><span class="rn">'+(i+1)+'</span>'+
        '<span class="rname">'+r.name+(r.me?'（我）':'')+'</span>'+
        '<span class="rp">'+r.p+'%</span></div>';
    }).join("")+'</div>') : '<div class="rank" id="rankbox"><div class="mutedsmall">还没人交榜。做完「今日挑战」，复制战绩码发给同学互换。</div></div>';

    host.innerHTML='<h2 class="gh">今日好友榜 <span class="gz">'+todayKey()+' · 靠战绩码互通，不用服务器</span></h2>'+
      rankHtml +
      '<div class="codebar"><button class="btn2" id="mecode">复制我的战绩码</button>'+
      '<input id="friendcode" placeholder="粘贴同学的战绩码">'+
      '<button class="btn2" id="addcode">加入</button>'+
      (apibase()
        ? '<button class="btn2" id="pushscore">☁ 提交到服务器</button>'
        : '<button class="btn2" id="cfgapi">⚙ 设置服务器地址</button>')+'</div>'+
      '<h2 class="gh" style="margin-top:22px">纪录榜 <span class="gz">本地 · 跟自己比</span></h2>'+
      '<div class="board">'+
        '<div class="brow"><span>总经验</span><b>'+g.xp+'</b></div>'+
        '<div class="brow"><span>最高连对</span><b>'+(g.best||0)+'</b></div>'+
        '<div class="brow"><span>累计作答</span><b>'+L.length+'</b></div>'+
        '<div class="brow"><span>金币 / 星尘</span><b>'+(c.n||0)+' / '+(c.dust||0)+'</b></div>'+
      '</div>'+
      '<div class="days">'+dayList.map(function(x){
        return '<div class="day"><em>'+x.pct+'%</em><i style="height:'+Math.max(4,Math.round(x.pct*0.5))+'px"></i>'+
               '<span>'+x.d+'</span></div>';
      }).join("")+'</div>';
  }
  window.__renderBoard=renderBoard;

  function renderProfile(){
    var host=document.getElementById('profile');
    if(!host) return;
    var g=db(), xp=g.xp||0, lv=levelOf(xp), nx=nextAt(xp), prev=LEVELS[lv-1]||0;
    var pct = nx ? Math.round((xp-prev)/(nx-prev)*100) : 100;
    var tc=todayCount(), st=streakDays(), b=bdb(), inv=readInv(), c=readCoins();
    var seenAll=seen(), fixed=0, mastered=0;
    Object.keys(seenAll).forEach(function(k){ var e=seenAll[k]; if(e.right && e.n>1) fixed++; if(e.right && e.sealed) mastered++; });
    var title = inv.equipped && inv.equipped.title ? '<span class="ptitle">'+inv.equipped.title+'</span>' : '';
    var badges=BADGES.map(function(x){
      var got=b[x.id];
      return '<div class="badge'+(got?' on':'')+'" title="'+x.d+'"><span class="bi">'+x.i+'</span>'+
             '<span class="bn">'+x.n+'</span></div>';
    }).join('');
    host.innerHTML=
      '<div class="prof-main">'+
        '<div class="lv"><span class="lvnum">'+lv+'</span><span class="lvlab">等级</span></div>'+
        '<div class="prof-body">'+
          '<div class="prof-line"><b>'+xp+' XP</b>'+title+(nx?('<span class="muted">距 Lv.'+(lv+1)+' 还差 '+(nx-xp)+'</span>'):'<span class="muted">满级</span>')+'</div>'+
          '<div class="xpbar"><i style="width:'+pct+'%"></i></div>'+
          '<div class="prof-meta">今日 <b>'+tc+'</b>/'+GOAL+' 题 · 连续 <b>'+st+'</b> 天 · 连对纪录 <b>'+(g.best||0)+'</b>'+
            ' · 金币 <b>'+(c.n||0)+'</b></div>'+
          '<div class="prof-note">纠错 <b>'+fixed+'</b> 题 · 已掌握 <b>'+mastered+'</b> 题（做满 3 次不再计分）</div>'+
        '</div>'+
      '</div>'+
      '<div class="badges">'+badges+'</div>'+
      '<div class="prof-tools"><button class="sfxbtn" id="sfxbtn">'+(SFX_ON?'🔊 音效开':'🔇 音效关')+'</button></div>'+
      '<div class="prof-note dim">这套分数只认「答对的题」。读材料、琢磨思路、改答案、想通一个概念——这些没被计分，但它们才是真正在学的东西。</div>';
  }
  function renderAll(){
    renderProfile();
    setTimeout(loadBoard, 0);
    renderQuests(document.getElementById("quests"));
    renderBoard(document.getElementById("board"));
  }
  window.__refreshProfile=renderAll;
  document.addEventListener("click", function(ev){
    var s = ev.target.closest && ev.target.closest("#sfxbtn");
    if(s){ var on = toggleSfx(); s.textContent = on ? "🔊 音效开" : "🔇 音效关"; return; }
    var q = ev.target.closest && ev.target.closest("[data-claim]");
    if(q){ claimQuest(q.getAttribute("data-claim")); renderAll(); return; }
    if(ev.target.closest && ev.target.closest("#mecode")){
      if(!nick()){ var nm=prompt("给自己起个名字（显示在好友榜）",""); if(nm) setNick(nm.slice(0,12)); }
      var r=myCode();
      if(!r.ok){ toast(r.msg,false); return; }
      var ta=document.createElement("textarea"); ta.value=r.code;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("战绩码已复制，发给同学吧", true); }
      catch(e){ toast("复制失败，手动选中："+r.code.slice(0,20)+"…", false); }
      ta.remove();
      return;
    }
    if(ev.target.closest && ev.target.closest("#cfgapi")){
      var cur=apibase();
      var v=prompt("填入 Cloudflare Worker 地址（留空则清除）", cur);
      if(v===null) return;
      setApi(v);
      toast(v.trim()?"已保存，正在拉取云端榜…":"已清除服务器地址", true);
      renderAll(); return;
    }
    if(ev.target.closest && ev.target.closest("#pushscore")){
      var r2=pushScore(); toast(r2.msg, r2.ok); return;
    }
    if(ev.target.closest && ev.target.closest("#addcode")){
      var inp=document.getElementById("friendcode");
      var res=addCode(inp?inp.value:"");
      toast(res.msg, res.ok); renderAll(); return;
    }
  });
  applyTheme();
  if(document.readyState!=='loading') renderAll(); else document.addEventListener('DOMContentLoaded', renderAll);
})();
</script>
</body>
</html>
