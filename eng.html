<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语 · 10 年级 · 复习测验</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --fg:#e8ecf1; --dim:#9aa4b2;
  --line:#2a2f3a; --accent:#5b8cff; --ok:#2fbf71; --bad:#ff5f56; --warn:#f5a623;
}
@media (prefers-color-scheme: light) {
  :root{--bg:#f6f7f9;--card:#fff;--card2:#f0f2f5;--fg:#1b1f26;--dim:#5f6b7a;--line:#e2e6ec;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.bar .meta{color:var(--dim);font-size:13px}
.spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;
 font-size:12px;color:var(--dim)}
.progress{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{max-width:820px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.chip{padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.chip.easy{color:#2fbf71;border-color:#2fbf7144}
.chip.medium{color:#f5a623;border-color:#f5a62344}
.chip.hard{color:#ff5f56;border-color:#ff5f5644}
.stem{font-size:17px;line-height:1.6;margin:6px 0 16px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
 background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:11px;
 padding:12px 14px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:var(--bg);border:1px solid var(--line);
 display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card2))}
.opt.correct .k{background:var(--ok);color:#04170c;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card2))}
.opt.wrong .k{background:var(--bad);color:#1a0403;border-color:var(--bad)}
textarea{width:100%;min-height:96px;background:var(--card2);color:var(--fg);border:1px solid var(--line);
 border-radius:11px;padding:12px;font:inherit;resize:vertical}
.exp{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--card2);
 border-radius:0 10px 10px 0;font-size:14.5px;display:none}
.exp.show{display:block}
.exp b{color:var(--accent)}
.src{margin-top:8px;color:var(--dim);font-size:12px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;
 font:inherit;font-weight:600;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.btn:disabled{opacity:.45;cursor:default}
.done h2{margin:0 0 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:110px}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{color:var(--dim);font-size:12px}
.wronglist{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
.wronglist li{margin:4px 0}
footer{text-align:center;color:var(--dim);font-size:12px;padding:26px 16px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

.chip.warn{border-color:#f5a62366;color:#f5a623}
.muted{color:var(--dim);font-size:13px}
.pts{display:grid;gap:8px;margin-top:12px}
.pt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.pt.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card2))}
.pt input{margin-top:3px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--ok)}
.pt span{flex:1;min-width:0}
.pt em{color:var(--dim);font-style:normal;font-size:12px;white-space:nowrap}
.mine{margin-top:14px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
.mine div{margin-top:6px;white-space:pre-wrap;color:var(--dim)}
.fullans{margin-top:10px;font-size:14px}
.fullans summary{cursor:pointer;color:var(--accent)}
.fullans div{margin-top:8px;white-space:pre-wrap;color:var(--dim)}
.setup{max-width:760px;margin:0 auto}
.setup-head{margin:4px 0 20px}
.setup-head h2{margin:0 0 6px;font-size:22px}
.setup-head p{margin:0;font-size:13.5px;line-height:1.6}
.setup-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.setup-label{font-size:13px;color:var(--dim);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pick{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14px;min-width:0}
.pick input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--accent)}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick em{color:var(--dim);font-style:normal;font-size:12px;flex:0 0 auto}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:10px;
 padding:10px 0;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card2));font-weight:600}
.setup-foot{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:4px}
.setup-foot .sum{color:var(--dim);font-size:14px}
.setup-foot .sum b{color:var(--fg);font-size:18px}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;padding:24px}
.nav-overlay.on{display:block}
.nav-box{max-width:720px;margin:6vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.nav-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;max-height:56vh;overflow:auto}
.nav-grid button{padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);
 color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.nav-grid button.ok{border-color:var(--ok);color:var(--ok)}
.nav-grid button.bad{border-color:var(--bad);color:var(--bad)}
.nav-grid button.part{border-color:var(--warn);color:var(--warn)}
html,body{max-width:100%;overflow-x:hidden}
main{display:flex;flex-direction:column}
.card{flex:0 0 auto}
.chips{opacity:.92}
.chip{font-size:11px;padding:2px 8px}
.stem{font-size:19px;line-height:1.62;font-weight:500;margin:12px 0 20px}
.opts{gap:12px}
.opt{padding:14px 16px;font-size:15.5px;position:relative;border-left-width:3px}
.opt .txt{flex:1;min-width:0}
.opt .mk{margin-left:8px;font-weight:700}
.opt.correct{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;align-items:center;
 padding:10px max(16px,calc((100vw - 860px)/2)) calc(10px + env(safe-area-inset-bottom));
 background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.actionbar .spacer{flex:1}
main{padding-bottom:104px!important}
footer{padding-bottom:96px}
.sfxbtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
 padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.prof-tools{margin-top:10px}
/* 提交防呆遮罩 */
.submit-mask{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
 background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px);
 opacity:0;pointer-events:none;transition:.2s;cursor:wait}
.submit-mask.on{opacity:1;pointer-events:auto}
.submit-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 34px;
 text-align:center;min-width:260px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.spinner{width:26px;height:26px;margin:0 auto 14px;border:2px solid var(--line2);
 border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.submit-txt{font-size:13.5px;color:var(--dim);letter-spacing:.02em;min-height:20px}
.submit-txt b{color:var(--fg);font-weight:600}
/* 题目排版：更长行高，缓解密集阅读 */
.stem{font-size:16.5px;line-height:1.78}
.opt .txt{line-height:1.7}
.lb-fab{position:fixed;right:16px;bottom:84px;z-index:30;display:none;align-items:center;gap:6px;
 background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12.5px;
 color:var(--fg);cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.lb-fab b{color:var(--warn)}
.lb-overlay{position:fixed;inset:0;z-index:70;background:rgba(5,7,11,.7);backdrop-filter:blur(8px);
 display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.22s}
.lb-overlay.on{opacity:1;pointer-events:auto}
.lb-sheet{width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--line);
 border-radius:20px 20px 0 0;padding:18px 18px 20px;transform:translateY(28px);transition:.28s cubic-bezier(.2,.8,.2,1)}
.lb-overlay.on .lb-sheet{transform:translateY(0)}
.lb-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.lb-head b{font-size:16px}
.lb-tabs{display:flex;gap:6px;margin-bottom:16px}
.lb-tabs button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:9px;
 padding:7px 0;font:inherit;font-size:12.5px;cursor:pointer}
.lb-tabs button.on{color:var(--fg);border-color:var(--accent);
 background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:8px;align-items:end;margin-bottom:18px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.pod.p1{padding-top:22px;padding-bottom:18px}
.pod .av{width:42px;height:42px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;
 justify-content:center;font-weight:700;font-size:15px}
.pod .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pod.p1{border-color:#F59E0B;animation:breathe 2.8s ease-in-out infinite}
.pod.p1 .av{background:#F59E0B;color:#1a1206}
.pod.p2{border-color:#94A3B8}.pod.p2 .av{background:#94A3B8;color:#10161b}
.pod.p3{border-color:#B45309}.pod.p3 .av{background:#B45309;color:#fce7d0}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px #F59E0B inset,0 0 16px rgba(245,158,11,.22)}
 50%{box-shadow:0 0 0 1px #F59E0B inset,0 0 34px rgba(245,158,11,.5)}}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.lb-row .rk{width:22px;color:var(--dim);font-variant-numeric:tabular-nums}
.lb-row.me{color:var(--accent);font-weight:600}
.lb-count{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.lb-refresh{display:none;margin:0 0 12px;padding:9px 14px;border-radius:10px;text-align:center;
 font-size:12.5px;color:var(--fg);background:color-mix(in srgb,var(--accent) 16%,var(--card));
 border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));cursor:pointer}
.lb-refresh.on{display:block}
.lb-near{margin:4px 0 10px;padding:4px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.near-h{font-size:11px;color:var(--dim);letter-spacing:.06em;padding:6px 4px 2px}
.lb-time{font-size:11px;color:var(--dim);margin-left:8px;font-variant-numeric:tabular-nums}
.lb-row.fresh{animation:freshGlow 1.6s ease-out}
@keyframes freshGlow{0%{box-shadow:inset 0 0 14px color-mix(in srgb,var(--accent) 55%,transparent)}
 100%{box-shadow:inset 0 0 0 transparent}}
.pod .pl{font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.lb-self{border-top:2px solid var(--accent)!important;margin-top:10px;padding:11px 8px;display:flex;gap:12px;align-items:center;
 font-size:13.5px;font-weight:600;background:color-mix(in srgb,var(--accent) 13%,var(--bg));
 border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.lang-btn{position:fixed;left:16px;bottom:84px;z-index:35;display:flex;align-items:center;gap:6px;
 background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
 font-size:12px;color:var(--dim);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.lang-btn:hover{color:var(--fg)}
.lang-btn b{color:var(--accent);font-weight:600}
.tr{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
 font-size:15px;line-height:1.75;color:var(--dim);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stem.zh .tr{border-top:0;padding-top:0;margin-top:0;color:var(--fg);font-size:16px}
.stem.zh .orig{display:block;font-size:13px;color:var(--dim);margin-bottom:8px;line-height:1.6}
.otr{display:block;margin-top:4px;font-size:13.5px;color:var(--dim);
 font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.xp-toast{position:fixed;right:18px;bottom:92px;z-index:60;background:var(--card);border:1px solid var(--line);
 color:var(--dim);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
 opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.xp-toast.ok{border-color:var(--ok);color:var(--ok)}
.xp-toast.up{opacity:1;transform:translateY(0)}
.profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 22px}
.prof-main{display:flex;gap:16px;align-items:center}
.lv{width:64px;height:64px;border-radius:18px;background:color-mix(in srgb,var(--accent) 16%,var(--card2));
 display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 64px}
.lvnum{font-size:24px;font-weight:700;color:var(--accent);line-height:1}
.lvlab{font-size:10px;color:var(--dim);margin-top:2px}
.prof-body{flex:1;min-width:0}
.prof-line{display:flex;gap:10px;align-items:baseline;font-size:14px}
.prof-line b{font-size:17px}
.xpbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prof-meta{font-size:12px;color:var(--dim)}
.prof-meta b{color:var(--fg)}
.badges{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;opacity:.45}
.badge.on{opacity:1;border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.badge .bi{display:block;font-size:18px;line-height:1.3}
.badge .bn{display:block;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){ .badges{grid-template-columns:repeat(4,1fr)} }
.panel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
.panel-h{font-size:12px;color:var(--dim);margin-bottom:10px}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1 0 auto}
footer{margin-top:auto}
main,.card,.setup{max-width:100%}
.opt,.pt,.pick,.mine,.exp{min-width:0}
.stem,.opt span,.pt span{overflow-wrap:anywhere}
.actions{flex-wrap:wrap}
footer{padding:22px 14px 30px;line-height:1.8}

@media (max-width:720px){
  #scorepill{display:none}
  .bar a.pill{display:none}
  .bar{flex-wrap:wrap;row-gap:8px}
  .bar h1{flex:1 1 100%;font-size:16px;margin:0}
  .bar .spacer{display:none}
  #restart{display:none}
  #grid,#exam{padding:6px 10px!important;font-size:12px!important}
  .progress{margin-top:6px}
}
@media (max-width:560px){
  .bar{gap:8px}
  .bar h1{font-size:17px;line-height:1.3}
  .bar .meta{display:none}
  .pill{padding:3px 9px;font-size:11px}
  main{padding:12px 10px 84px}
  .card{padding:14px;border-radius:12px}
  .chips{gap:6px;margin-bottom:10px}
  .chip{font-size:11px;padding:1px 7px}
  .stem{font-size:15.5px;line-height:1.6;margin:2px 0 14px}
  .opt{padding:12px;font-size:15px;line-height:1.5;gap:10px}
  .opt .k{flex:0 0 22px;height:22px;font-size:11px}
  .actions{gap:8px;margin-top:14px}
  .actions .btn{padding:10px 12px;font-size:14px}
  .stem{font-size:17px;margin:10px 0 16px}
  .actionbar #prev,.actionbar #next{flex:1 1 0}
  .actionbar #finish{flex:0 0 auto}
  textarea{font-size:15px}
  .picks{grid-template-columns:1fr}
  .setup-head h2{font-size:20px}
  .setup-block{padding:14px}
  .seg{gap:6px}
  .seg button{padding:12px 0;font-size:13px}
  .setup-foot{flex-direction:column;align-items:stretch;gap:10px}
  .setup-foot .sum{text-align:center}
  .setup-foot .btn{width:100%;padding:12px 0;font-size:15px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{min-width:0;padding:10px 12px}
  .stat b{font-size:18px}
  footer{font-size:11px;padding:18px 10px 26px;overflow-wrap:anywhere}
}

</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>英语 · 10 年级</h1>
    <span class="meta">10ENG 26 · 36 题 · English 11/23 P1–P2</span>
    <span class="spacer"></span>
    <span class="pill" id="counter">0 / 36</span>
    <a class="pill" style="text-decoration:none" href="index.html">← 科目列表</a>
    <span class="pill" id="scorepill">✓ 0 ✗ 0</span>
    <button class="btn ghost" id="grid" style="padding:5px 10px;font-size:13px">题号</button>
    <button class="btn ghost" id="exam" style="padding:5px 10px;font-size:13px">考试模式</button>
    <span class="pill" id="clock" style="display:none"></span>
    <button class="btn ghost" id="restart" style="padding:5px 10px;font-size:13px">重来</button>
  </div>
  <div class="bar"><div class="progress" style="flex:1"><i id="pbar"></i></div></div>
</header>
<main id="app"></main>
<div id="submitMask" class="submit-mask"><div class="submit-card">
  <div class="spinner"></div><div class="submit-txt" id="submitTxt">正在上传试卷…</div></div></div>
<button class="lang-btn" id="langBtn">语言 <b id="langNow">EN</b></button>
<div id="lbFab" class="lb-fab"></div>

0），并拒绝收留他。剥夺随从是关键羞辱点。", "source": "Yearly Study Guide 2026 · English", "id": "eng-004", "weak": false}, {"topic": "李尔王 · 剧情", "difficulty": "medium", "type": "mcq", "stem": "Edmund plots against Edgar and Gloucester. Which action most directly sets his plan in motion?", "options": ["He tells Edgar that Gloucester wants him dead, then claims Edgar plotted to kill Gloucester", "He forges a letter and calls a tournament", "He reports Edgar to the King", "He openly challenges Edgar to a duel"], "answer": 0, "explanation": "Edmund 伪造信件、诱骗 Edgar 逃跑，再向 Gloucester 报告『Edgar 谋害父亲』，使 Edgar 被通缉，自己成为合法继承人。", "source": "Yearly Study Guide 2026 · English", "id": "eng-005", "weak": false}, {"topic": "李尔王 · 剧情", "difficulty": "hard", "type": "mcq", "stem": "How does the play end for Lear and Cordelia?", "options": ["They rule the kingdom together", "Cordelia is hanged on Edmund's orders and Lear dies of grief with her body", "Lear is killed in battle by Albany", "They flee to France and survive"], "answer": 1, "explanation": "Edmund 下令吊死 Cordelia，李尔赶到时已晚，抱着她的尸体死去。没有恢复秩序的幸福结局，只有 Albany 与 Edgar 收拾残局。", "source": "Yearly Study Guide 2026 · English", "id": "eng-006", "weak": false}, {"id": "eng-007", "topic": "李尔王 · 分国与 Cordelia 的「Nothing」", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nCORDELIA: Nothing, my lord.\nKING LEAR: Nothing!\nCORDELIA: Nothing.\nKING LEAR: Nothing will come of nothing: speak again.\n\n(a) What does Cordelia's reply reveal about her values? (2 marks)\n(b) Explain how Lear's response sets the tragedy in motion. (3 marks)", "options": [], "answer": "(a) 1 mark — Cordelia refuses to flatter or perform love for a reward; she will not compete with her sisters' speeches.\n1 mark — her plain 'Nothing' signals honesty and a measured, private love (she loves 'according to my bond'), not an absence of feeling.\n(b) 1 mark — Lear equates love with public declaration, so silence is read as rejection.\n1 mark — his pun, 'Nothing will come of nothing', shows him thinking in terms of a bargain or debt rather than affection.\n1 mark — he banishes Cordelia (and Kent) and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him.", "explanation": "两问是一组因果链：(a) 考 Cordelia 为什么说 Nothing（拒绝把爱当表演，爱是“本分”不是报价）；(b) 要串起三点——把言语当爱、用双关当交易、放逐造成权力真空。只写“他很生气”拿不到第 3 分。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "Cordelia refuses to flatter or perform love for a reward; she will not compete with her sisters' speeches.", "m": 1}, {"t": "her plain 'Nothing' signals honesty and a measured, private love (she loves 'according to my bond'), not an absence of feeling.", "m": 1}, {"t": "Lear equates love with public declaration, so silence is read as rejection.", "m": 1}, {"t": "his pun, 'Nothing will come of nothing', shows him thinking in terms of a bargain or debt rather than affection.", "m": 1}, {"t": "he banishes Cordelia (and Kent) and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him.", "m": 1}], "weak": false}, {"id": "eng-008", "topic": "李尔王 · 谄媚的语言（Act 1 Sc 1）", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nGONERIL: Sir, I love you more than words can wield the matter;\nDearer than eye-sight, space, and liberty;\nBeyond what can be valued, rich or rare;\n\n(a) Identify two features of Goneril's language. (2 marks)\n(b) Explain why Shakespeare gives this speech to Goneril rather than to Cordelia. (3 marks)", "options": [], "answer": "(a) 1 mark — hyperbole and unverifiable comparison ('more than words can wield', 'dearer than eyesight, space and liberty').\n1 mark — a catalogue of absolutes: love is measured against everything (sight, space, liberty, wealth) and therefore means nothing specific.\n(b) 1 mark — the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and truth as plain speech.\n1 mark — it positions the audience above Lear: we can hear the inflation before he can (dramatic irony).\n1 mark — it establishes the play's central error: love treated as language to be counted rather than felt.", "explanation": "这题考“语言如何被量化”：Goneril 用夸张和绝对化清单，把爱变成可比较、可报价的东西。(b) 的重点是“对比 + 观众知道得比 Lear 多”，不要只写“她不是真心的”。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "hyperbole and unverifiable comparison ('more than words can wield', 'dearer than eyesight, space and liberty').", "m": 1}, {"t": "a catalogue of absolutes: love is measured against everything (sight, space, liberty, wealth) and therefore means nothing specific.", "m": 1}, {"t": "the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and truth as plain speech.", "m": 1}, {"t": "it positions the audience above Lear: we can hear the inflation before he can (dramatic irony).", "m": 1}, {"t": "it establishes the play's central error: love treated as language to be counted rather than felt.", "m": 1}], "weak": false}, {"id": "eng-009", "topic": "李尔王 · 视觉隐喻与 blindness motif", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nKENT: See better, Lear; and let me still remain\nThe true blank of thine eye.\n\nExplain what Kent's image of sight suggests about Lear's error and about the play's wider concerns. (3 marks)", "options": [], "answer": "1 mark — sight here means judgement or insight, not physical vision: Kent is telling Lear that he is misreading his daughters.\n1 mark — Kent offers to be the 'blank' (the true target/centre) of Lear's eye, that is, the honest perspective Lear refuses.\n1 mark — the image plants the blindness motif that structures the whole play: Gloucester is literally blinded, and Lear only learns to 'see' once he has lost everything.", "explanation": "3 分分别给：sight = 判断力（不是视力）、Kent 自愿当“眼中靶心”的忠心、以及这一隐喻为全剧 blindness motif 埋线（后接 Gloucester 被挖眼、Lear 清醒时已一无所有）。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "sight here means judgement or insight, not physical vision: Kent is telling Lear that he is misreading his daughters.", "m": 1}, {"t": "Kent offers to be the 'blank' (the true target/centre) of Lear's eye, that is, the honest perspective Lear refuses.", "m": 1}, {"t": "the image plants the blindness motif that structures the whole play: Gloucester is literally blinded, and Lear only learns to 'see' once he has lost everything.", "m": 1}], "weak": false}, {"id": "eng-010", "topic": "李尔王 · hamartia（龙的比喻）", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nLEAR: Come not between the dragon and his wrath.\n\nHow does this line help to explain Lear's hamartia? (3 marks)", "options": [], "answer": "1 mark — the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge.\n1 mark — wrath has replaced judgement: he acts from injured pride rather than reason, and cannot tolerate being contradicted.\n1 mark — because this flaw (not fate) drives the banishments and the division of the kingdom, his downfall follows from character, which is what makes the play a tragedy.", "explanation": "hamartia 不是“倒霉”，而是性格缺陷：他把自己当成不可冒犯的“龙”，愤怒盖过判断，因此放逐与分国都是性格推动的结果——这正是悲剧结构要求的因果。", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge.", "m": 1}, {"t": "wrath has replaced judgement: he acts from injured pride rather than reason, and cannot tolerate being contradicted.", "m": 1}, {"t": "because this flaw (not fate) drives the banishments and the division of the kingdom, his downfall follows from character, which is what makes the play a tragedy.", "m": 1}], "weak": false}, {"id": "eng-011", "topic": "李尔王 · 权力、失去与身份", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: I gave you all—\nREGAN: And in good time you gave it.\n\nAnalyse what this exchange reveals about power, loss and identity. (4 marks)", "options": [], "answer": "1 mark — Lear still speaks as the giver: his identity is bound up in what he handed over, so he assumes authority continues after the gift.\n1 mark — Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude.\n1 mark — the daughters now own the power he thought he kept; the title of king remains but the substance has gone.\n1 mark — the play shows identity collapsing when power is transferred: Lear is reduced to 'a poor old man' and has to rebuild a self from bare humanity.", "explanation": "4 分要覆盖三个概念：权力已转移、身份仍停留在“给予者”、以及作品借此说明“头衔≠实质”。Regan 那句冷冰冰的 'in good time' 是权力关系的转折点。", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "Lear still speaks as the giver: his identity is bound up in what he handed over, so he assumes authority continues after the gift.", "m": 1}, {"t": "Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude.", "m": 1}, {"t": "the daughters now own the power he thought he kept; the title of king remains but the substance has gone.", "m": 1}, {"t": "the play shows identity collapsing when power is transferred: Lear is reduced to 'a poor old man' and has to rebuild a self from bare humanity.", "m": 1}], "weak": false}, {"id": "eng-012", "topic": "李尔王 · 「reason not the need」", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: O, reason not the need: our basest beggars\nAre in the poorest thing superfluous:\n\nWhat does this speech reveal about Lear's understanding of need? (3 marks)", "options": [], "answer": "1 mark — he argues that bare necessity is not enough for human dignity: even beggars have something 'superfluous' beyond survival.\n1 mark — he is defending his hundred knights as a symbol of status and respect, not as a practical requirement.\n1 mark — the speech shows him reasoning about humanity and hardship, but still from a king's position, so the insight is genuine yet incomplete.", "explanation": "这题的关键是“need 有两层”：生存所需 vs 人的尊严所需。Lear 已经能替乞丐说话（这是进步），但他争夺的仍是排场与体面，说明此处认识尚未完成。", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "he argues that bare necessity is not enough for human dignity: even beggars have something 'superfluous' beyond survival.", "m": 1}, {"t": "he is defending his hundred knights as a symbol of status and respect, not as a practical requirement.", "m": 1}, {"t": "the speech shows him reasoning about humanity and hardship, but still from a king's position, so the insight is genuine yet incomplete.", "m": 1}], "weak": false}, {"id": "eng-013", "topic": "李尔王 · 暴风雨的象征（Act 3 Sc 2）", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 2:\n\nLEAR: Blow, winds, and crack your cheeks! rage! blow! ...\nI am a man\nMore sinn'd against than sinning.\n\n(a) How does Shakespeare use the storm symbolically in this scene? (3 marks)\n(b) What does 'More sinn'd against than sinning' reveal about Lear's self-knowledge at this point? (3 marks)", "options": [], "answer": "(a) 1 mark — the storm externalises Lear's inner rage and gives his fury a cosmic scale.\n1 mark — it is also indifferent nature: wind and rain do not answer him, which cuts human authority down to size.\n1 mark — by stripping him of shelter and followers it forces him to confront exposed humanity, preparing the 'poor naked wretches' speech.\n(b) 1 mark — he sees himself chiefly as a victim: 'sinn'd against' comes first and carries the weight.\n1 mark — he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial, not full confession.\n1 mark — fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey.", "explanation": "(a) 暴风雨有三重功能：外化愤怒、显示自然的冷漠、剥掉权力外壳。(b) 注意 'more ... than' 的让步结构——他承认有错，但把自己主要写成受害者，所以要判“部分自觉”，不能说“他已经完全悔悟”。", "source": "King Lear Act 3 Scene 2 (quote: Shakespeare, King Lear 3.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the storm externalises Lear's inner rage and gives his fury a cosmic scale.", "m": 1}, {"t": "it is also indifferent nature: wind and rain do not answer him, which cuts human authority down to size.", "m": 1}, {"t": "by stripping him of shelter and followers it forces him to confront exposed humanity, preparing the 'poor naked wretches' speech.", "m": 1}, {"t": "he sees himself chiefly as a victim: 'sinn'd against' comes first and carries the weight.", "m": 1}, {"t": "he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial, not full confession.", "m": 1}, {"t": "fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey.", "m": 1}], "weak": false}, {"id": "eng-014", "topic": "李尔王 · poor naked wretches（转折点）", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Poor naked wretches, wheresoe'er you are,\nThat bide the pelting of this pitiless storm ...\nO, I have ta'en\nToo little care of this!\n\nExplain why this speech is a turning point in Lear's moral understanding. (4 marks)", "options": [], "answer": "1 mark — for the first time he thinks about other people's suffering instead of listing his own injuries.\n1 mark — he admits neglect as a ruler: 'too little care of this' is a confession of political and moral failure.\n1 mark — the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too.\n1 mark — the insight only arrives after he loses power and shelter, so suffering becomes his teacher; the lesson costs him everything.", "explanation": "4 分：①第一次想到别人的苦 ②承认统治者失责 ③具体意象让贫穷变成可感之物 ④这份觉悟是“失去权力”换来的。答题不要停在第①点，否则只拿 1 分。", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "for the first time he thinks about other people's suffering instead of listing his own injuries.", "m": 1}, {"t": "he admits neglect as a ruler: 'too little care of this' is a confession of political and moral failure.", "m": 1}, {"t": "the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too.", "m": 1}, {"t": "the insight only arrives after he loses power and shelter, so suffering becomes his teacher; the lesson costs him everything.", "m": 1}], "weak": false}, {"id": "eng-015", "topic": "李尔王 · 「lendings」与身份剥除", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Is man no more than this? Consider him well. ...\nOff, off, you lendings! come unbutton here.\n\nWhat does Lear's stripping off his clothes represent? (3 marks)", "options": [], "answer": "1 mark — 'lendings' treats clothes as borrowed status rather than as part of the self.\n1 mark — stripping tests what a human being is when rank, retinue and clothing are removed.\n1 mark — it dramatises the play's theme of identity: a king discovers he is only 'a poor, bare, forked animal', which is both a loss and a form of truth.", "explanation": "3 分：衣服＝借来的身份、剥衣＝把人还原为“赤裸的人类”、以及这动作同时是失去也是觉悟。能点到 'poor, bare, forked animal' 的悖论更好（不必逐字引）。", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "'lendings' treats clothes as borrowed status rather than as part of the self.", "m": 1}, {"t": "stripping tests what a human being is when rank, retinue and clothing are removed.", "m": 1}, {"t": "it dramatises the play's theme of identity: a king discovers he is only 'a poor, bare, forked animal', which is both a loss and a form of truth.", "m": 1}], "weak": false}, {"id": "eng-016", "topic": "李尔王 · Gloucester 失明（Act 3 Sc 7）", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 7:\n\nCORNWALL: Out, vile jelly!\nWhere is thy lustre now?\n\n(Gloucester has just been bound to a chair and blinded.)\n\nHow does Shakespeare make Gloucester's blinding more than physical violence? (4 marks)", "options": [], "answer": "1 mark — the language ('vile jelly', 'lustre') turns eyes into objects, so the horror is deliberately grotesque rather than heroic.\n1 mark — it literalises the blindness motif: Gloucester is punished in his eyes for the moral blindness that let Edmund deceive him.\n1 mark — the staging is an abuse of power (a bound guest, a host's authority turned to torture), echoing Lear's abuse of Cordelia and Kent.\n1 mark — the audience is forced to watch what the characters refused to see, so the scene makes sight a moral act for the viewer as well.", "explanation": "这题要说明“字面失明 = 隐喻失明的兑现”：Gloucester 因看不清 Edmund 而失去眼睛；同时暴行是权力滥用，与 Lear 放逐亲人形成平行。最后一点答“观众被迫看见”可拿第 4 分。", "source": "King Lear Act 3 Scene 7 (quote: Shakespeare, King Lear 3.7); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the language ('vile jelly', 'lustre') turns eyes into objects, so the horror is deliberately grotesque rather than heroic.", "m": 1}, {"t": "it literalises the blindness motif: Gloucester is punished in his eyes for the moral blindness that let Edmund deceive him.", "m": 1}, {"t": "the staging is an abuse of power (a bound guest, a host's authority turned to torture), echoing Lear's abuse of Cordelia and Kent.", "m": 1}, {"t": "the audience is forced to watch what the characters refused to see, so the scene makes sight a moral act for the viewer as well.", "m": 1}], "weak": false}, {"id": "eng-017", "topic": "李尔王 · 「I stumbled when I saw」的反讽", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: I have no way, and therefore want no eyes;\nI stumbled when I saw ...\n\nExplain the irony in Gloucester's lines. (3 marks)", "options": [], "answer": "1 mark — when he had eyes he was morally blind, refusing to see Edmund's treachery and turning against Edgar.\n1 mark — now that he is physically blind he sees his own errors and Edgar's love, so insight arrives after sight is gone.\n1 mark — the paradox 'I stumbled when I saw' states the play's inversion: physical sight and moral vision are opposites, which also describes Lear's journey.", "explanation": "3 分：①有眼时看不见真相 ②失明后才看清 ③点明全剧“视力/洞察”倒置的悖论。答题时最好把 Gloucester 与 Lear 的平行关系带一句，显示整体理解。", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "when he had eyes he was morally blind, refusing to see Edmund's treachery and turning against Edgar.", "m": 1}, {"t": "now that he is physically blind he sees his own errors and Edgar's love, so insight arrives after sight is gone.", "m": 1}, {"t": "the paradox 'I stumbled when I saw' states the play's inversion: physical sight and moral vision are opposites, which also describes Lear's journey.", "m": 1}], "weak": false}, {"id": "eng-018", "topic": "李尔王 · Edmund 的价值观与戏剧功能", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 2:\n\nEDMUND: Thou, Nature, art my goddess; to thy law\nMy services are bound.\n\n(a) What does Edmund's address to Nature reveal about his values? (2 marks)\n(b) Explain Edmund's dramatic function in the play. (3 marks)", "options": [], "answer": "(a) 1 mark — he rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead.\n1 mark — his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority.\n(b) 1 mark — he is the engine of the plot: the forged letter sets Edgar running and destroys Gloucester's trust.\n1 mark — his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error.\n1 mark — his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern, not an accident.", "explanation": "(a) Edmund 把“自然”当女神，其实是把私欲合法化。(b) 三条功能：推动情节（伪造信件）、揭出他人的“看不见”、以及用平行情节强化主题。答到“恶的引擎”与“镜像结构”即可满分。", "source": "King Lear Act 1 Scene 2 (quote: Shakespeare, King Lear 1.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "he rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead.", "m": 1}, {"t": "his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority.", "m": 1}, {"t": "he is the engine of the plot: the forged letter sets Edgar running and destroys Gloucester's trust.", "m": 1}, {"t": "his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error.", "m": 1}, {"t": "his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern, not an accident.", "m": 1}], "weak": false}, {"id": "eng-019", "topic": "李尔王 · 伪造信与戏剧反讽", "difficulty": "medium", "type": "short", "stem": "Section 1 — scene description (no quotation):\n\nIn Act 1 Scene 2 Edmund shows his father Gloucester a letter that he has forged in Edgar's handwriting. He then warns Edgar that their father is furious with him and advises him to arm himself and flee.\n\nExplain how Shakespeare creates dramatic irony here and why it matters. (3 marks)", "options": [], "answer": "1 mark — the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter.\n1 mark — each character then acts on information the audience knows to be false, so their choices look like self-destruction.\n1 mark — the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence, trust) can be manufactured.", "explanation": "戏剧反讽的判分点：观众看到 Edmund 同时演两场戏 → 人物依据假信息行动 → 由此证明“看见/信任”是可以被伪造的。第 3 分要提升到主题层，不能只复述情节。", "source": "Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage (Act 1 Scenes 1–3 questions and practice extracts)", "points": [{"t": "the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter.", "m": 1}, {"t": "each character then acts on information the audience knows to be false, so their choices look like self-destruction.", "m": 1}, {"t": "the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence, trust) can be manufactured.", "m": 1}], "weak": false}, {"id": "eng-020", "topic": "李尔王 · 诸神与人的处境", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: As flies to wanton boys, are we to the gods;\nThey kill us for their sport.\n\nWhat view of the gods and of human agency does this image express, and how does it fit the play's tragic vision? (4 marks)", "options": [], "answer": "1 mark — the gods are 'wanton boys': careless, playful and not just, so divine authority is emptied of moral purpose.\n1 mark — humans are flies: small, disposable and without control over their fate.\n1 mark — the image reverses Gloucester's earlier confidence that the gods are just, and it answers Lear's repeated appeals to the heavens.\n1 mark — the play leaves the question open: the innocent die (Cordelia) while the guilty partly escape, so the ending refuses to console the audience with divine justice.", "explanation": "4 分：①神被写成顽童（不义） ②人是苍蝇（无掌控） ③这与 Gloucester 早先“神是公正的”信念相反，并回应 Lear 对诸神的呼喊 ④结局（Cordelia 之死）让“天理”问题悬空，突出悲剧性。", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "the gods are 'wanton boys': careless, playful and not just, so divine authority is emptied of moral purpose.", "m": 1}, {"t": "humans are flies: small, disposable and without control over their fate.", "m": 1}, {"t": "the image reverses Gloucester's earlier confidence that the gods are just, and it answers Lear's repeated appeals to the heavens.", "m": 1}, {"t": "the play leaves the question open: the innocent die (Cordelia) while the guilty partly escape, so the ending refuses to console the audience with divine justice.", "m": 1}], "weak": false}, {"id": "eng-021", "topic": "李尔王 · Cordelia 之死与诗性公正", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 5 Scene 3:\n\nLEAR: She's gone for ever!\nI know when one is dead, and when one lives;\nShe's dead as earth. ...\nDo you see this? Look on her, look, her lips,\nLook there, look there!\n\nWhy does Cordelia's death make the ending hard to read as poetic justice? (5 marks)", "options": [], "answer": "1 mark — poetic justice would reward Cordelia's loyalty and punish the guilty in proportion, restoring a moral order.\n1 mark — instead the innocent daughter is hanged on Edmund's order, and the reprieve arrives too late to save her.\n1 mark — Lear's hard-won sight is rewarded only with her corpse: insight and loss arrive at the same moment.\n1 mark — his final 'Look there, look there!' is ambiguous — he may die believing she lives — so the audience is denied a clear consolation.\n1 mark — the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just.", "explanation": "5 分依次是：诗性公正的定义 → 无辜者被处死且救援太迟 → 觉悟与失去同时发生 → 最后台词含糊、不给安慰 → 秩序未恢复，因此“不公”感是刻意的。答题时务必先给“什么是 poetic justice”，否则后面没有对照标准。", "source": "King Lear Act 5 Scene 3 (quote: Shakespeare, King Lear 5.3); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "poetic justice would reward Cordelia's loyalty and punish the guilty in proportion, restoring a moral order.", "m": 1}, {"t": "instead the innocent daughter is hanged on Edmund's order, and the reprieve arrives too late to save her.", "m": 1}, {"t": "Lear's hard-won sight is rewarded only with her corpse: insight and loss arrive at the same moment.", "m": 1}, {"t": "his final 'Look there, look there!' is ambiguous — he may die believing she lives — so the audience is denied a clear consolation.", "m": 1}, {"t": "the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just.", "m": 1}], "weak": false}, {"id": "eng-022", "topic": "李尔王 · 「I am not ague-proof」与身份转变", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 6:\n\nLEAR: They told me I was every thing; 'tis a lie, I am not ague-proof.\n\nWhat does this line show about Lear's changed identity? (4 marks)", "options": [], "answer": "1 mark — he recalls being told he was 'everything': flattery had built a false, unlimited self.\n1 mark — 'tis a lie' is an explicit act of self-correction, spoken by the king about his own former image.\n1 mark — 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man.\n1 mark — the line therefore shows loss producing a truer identity, not simply destroying one, which is central to the play's ending.", "explanation": "4 分：①曾被谄媚塑造成“无所不能” ②亲口否证 ③以身体脆弱（ague = 疟疾）确认普通人的处境 ④因此“失去”也带来更真实的自我。最后一分是主题层，别漏。", "source": "King Lear Act 4 Scene 6 (quote: Shakespeare, King Lear 4.6); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "points": [{"t": "he recalls being told he was 'everything': flattery had built a false, unlimited self.", "m": 1}, {"t": "'tis a lie' is an explicit act of self-correction, spoken by the king about his own former image.", "m": 1}, {"t": "'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man.", "m": 1}, {"t": "the line therefore shows loss producing a truer identity, not simply destroying one, which is central to the play's ending.", "m": 1}], "weak": false}, {"id": "eng-023", "topic": "比较论文 · thesis 判别", "difficulty": "easy", "type": "mcq", "stem": "Section 2 asks: 'How do Lee and Parker expose systemic racism?' Which thesis best answers the question?", "options": ["Lee's novel is more effective than Parker's film because a novel can explain what characters are thinking, while a film can only show what they do.", "Parker relies on music and camera angles to create meaning, while Lee relies on first-person narration and on dialogue between the characters.", "Both Lee and Parker show racism as a system that shields the guilty, but Lee builds a child's slow awareness while Parker forces the viewer to watch.", "Both texts show that racism is a serious problem in America and that it damages the lives of ordinary people in small towns across the country."], "answer": 2, "explanation": "好 thesis 要同时做到：点两个文本、给一个有争议的论点（racism 是“保护有罪者的制度”）、并预告比较角度（儿童视角 vs 强制观看）。其余选项分别只是泛泛而谈、评优劣、以及罗列手法而没有论点。", "source": "Section 2 · Comparative essay — thesis and introduction (10ENGA unit overview; LEEDER 10ENGB exam outline)", "weak": false}, {"id": "eng-024", "topic": "比较论文 · 主题句功能", "difficulty": "easy", "type": "mcq", "stem": "What is the main job of a topic sentence in a comparative body paragraph?", "options": ["To provide a quotation from each text and explain what happens in that scene", "To summarise the plot of both texts so the reader can follow the argument", "To introduce the paragraph by naming the text and the technique it will discuss", "To state a comparative claim about both texts that answers part of the essay question"], "answer": 3, "explanation": "主题句＝这一段要证明的「比较性论点」，必须同时覆盖两个文本并回应题目。「To introduce the paragraph by naming the text and the technique it will discuss」只是路标，不是论点；「To provide a quotation from each text and explain what happens in that scene」是证据；「To summarise the plot of both texts so the reader can follow the argument」是复述。", "source": "Section 2 · Comparative essay — body paragraph structure (TKAMB BP1/BP2/BP3 scaffolds)", "weak": false}, {"id": "eng-025", "topic": "比较论文 · 写 thesis statement", "difficulty": "medium", "type": "short", "stem": "Write a thesis statement for the question: 'How do Lee and Parker represent the failure of justice?' (4 marks)", "options": [], "answer": "Model answer: 'Lee and Parker both show justice failing because the community closes ranks around its own, yet Lee traces that failure through a child's gradual recognition while Parker makes the viewer complicit in seeing it.'\n1 mark — names both composers/texts.\n1 mark — makes one arguable claim about the failure of justice.\n1 mark — signals the comparative angle (how the two composers differ in method).\n1 mark — uses the question's key term ('failure of justice') rather than drifting into a general statement about racism.", "explanation": "评分看四点：两部作品都点到、有一个可争论的论点、有比较角度、扣住题目的关键词。只写“两个文本都表现了司法不公”没有比较，最多 2 分。", "source": "Section 2 · Comparative essay — thesis writing (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "points": [{"t": "names both composers/texts.", "m": 1}, {"t": "makes one arguable claim about the failure of justice.", "m": 1}, {"t": "signals the comparative angle (how the two composers differ in method).", "m": 1}, {"t": "uses the question's key term ('failure of justice') rather than drifting into a general statement about racism.", "m": 1}], "weak": false}, {"id": "eng-026", "topic": "比较论文 · 引文整合策略", "difficulty": "medium", "type": "mcq", "stem": "You want to use one line from the supplied extract in a body paragraph. Which approach integrates it most effectively?", "options": ["Quote only the few words that carry the technique, then analyse how they shape meaning in the whole text.", "Paraphrase the extract without quoting, because quotations take up too much of your word count.", "Quote the line, then say that it shows the theme of justice without explaining how the words create that effect.", "Quote the whole extract so the marker can see you have read it, then explain what it means."], "answer": 0, "explanation": "整合＝短引文嵌入自己的句子，并分析措辞如何产生意义，再连回全文与题目。整段抄（0）是复述，只转述（1）失去语言证据，引而不析（3）拿不到分析分。", "source": "Section 2 · Comparative essay — integrating the supplied extract (LEEDER 10ENGB exam outline, 20 marks)", "weak": false}, {"id": "eng-027", "topic": "比较论文 · 节选整合的要求", "difficulty": "medium", "type": "short", "stem": "Section 2 requires you to integrate the extract you are given. Explain what this means in practice, and what you should avoid. (4 marks)", "options": [], "answer": "1 mark — quote selectively: a few words that carry the technique or idea you need.\n1 mark — analyse the wording itself (connotation, syntax, imagery) and link it explicitly to the question.\n1 mark — connect the extract to the rest of the text, so the extract is a starting point rather than the whole evidence.\n1 mark — avoid long quotation, mentioning the extract only in the introduction, or turning the extract into plot summary.", "explanation": "四个得分点：短引 → 析词 → 连全文 → 避免“整段抄/只在开头提一句/当情节复述”。这是 Section 2 最容易丢分的地方，评分标准明确写 integrate the extract。", "source": "Section 2 · Comparative essay — extract integration (LEEDER 10ENGB exam outline)", "points": [{"t": "quote selectively: a few words that carry the technique or idea you need.", "m": 1}, {"t": "analyse the wording itself (connotation, syntax, imagery) and link it explicitly to the question.", "m": 1}, {"t": "connect the extract to the rest of the text, so the extract is a starting point rather than the whole evidence.", "m": 1}, {"t": "avoid long quotation, mentioning the extract only in the introduction, or turning the extract into plot summary.", "m": 1}], "weak": false}, {"id": "eng-028", "topic": "比较论文 · 手法对比（叙述 vs 镜头）", "difficulty": "medium", "type": "mcq", "stem": "Which option states a genuine point of comparison between Lee's novel and Parker's film?", "options": ["Lee uses words to describe things and Parker uses pictures, which means the film is easier to understand.", "Lee controls what Scout notices and when she understands it, while Parker controls what the camera shows and when the viewer sees it.", "Lee's novel is set in the 1930s and Parker's film is set in the 1960s, so the film is more historically accurate than the novel.", "Lee's novel has chapters and a narrator, while Parker's film has scenes and actors who speak dialogue."], "answer": 1, "explanation": "有效的比较要落到「作者如何控制信息与读者的反应」：Lee 用 Scout 的有限视角延迟理解，Parker 用取景与剪辑控制观众何时看见。「Lee's novel has chapters and a narrator, while Parker's film has scenes and actors who speak dialogue.」只是媒介形式差异，不构成比较点；「Lee's novel is set in the 1930s and Parker's film is set in the 1960s, so the film is more historically accurate than the novel.」把时代差异当成“更纪实”，没有依据；「Lee uses words to describe things and Parker uses pictures, which means the film is easier to understand.」是媒介常识加无根据判断。", "source": "Section 2 · Comparative essay — comparing literary and film techniques (10ENGA film study: visual storytelling, cinematography, director's purpose)", "weak": false}, {"id": "eng-029", "topic": "比较论文 · 主题轴「法律失效」", "difficulty": "easy", "type": "mcq", "stem": "Which pair of moments best supports the claim that both texts show the law failing?", "options": ["The novel criticises the town's gossip about Boo Radley, and the film criticises the way the agents speak to local people.", "The novel shows a young child learning about her neighbours, and the film shows two agents slowly learning about a small town.", "Tom Robinson is convicted despite Atticus's defence, and the film's inquiry begins only because local police are implicated.", "Scout narrates the trial from the gallery, and the film's opening shows two water fountains side by side in the street."], "answer": 2, "explanation": "“法律失效”的证据必须直接指向司法/执法：Tom 被判有罪、以及影片中地方执法本身涉案所以只能由联邦介入。其余选项讲的是视角、流言或“学习了解小镇”，都不证明法律失效。", "source": "Section 2 · Comparative essay — theme axis: the law fails (10ENGA unit overview; film study context)", "weak": false}, {"id": "eng-030", "topic": "比较论文 · 主题轴「个体责任」", "difficulty": "easy", "type": "mcq", "stem": "Which claim best fits the theme of individual responsibility in both texts?", "options": ["Both texts place responsibility on the main characters, since the wider community is never shown to be at fault.", "Both texts place responsibility on families, since children learn prejudice at home and not in public.", "Both texts place responsibility on the law alone, since individuals cannot be held accountable for prejudice.", "Both texts place responsibility on individuals who let prejudice pass unchallenged, not only on the law."], "answer": 3, "explanation": "个体责任＝普通人默许偏见也有责任，责任不止在制度。「Both texts place responsibility on the law alone, since individuals cannot be held accountable for prejudice.」把责任全推给法律，与主题相反；「Both texts place responsibility on families, since children learn prejudice at home and not in public.」把范围缩到家庭；「Both texts place responsibility on the main characters, since the wider community is never shown to be at fault.」说社群无责——三者都与两部作品的立场相反。", "source": "Section 2 · Comparative essay — theme axis: individual responsibility (10ENGA unit overview)", "weak": false}, {"id": "eng-031", "topic": "比较论文 · 段落规划", "difficulty": "hard", "type": "short", "stem": "Plan one comparative body paragraph for the question: 'How do Lee and Parker expose systemic racism?' Give a topic sentence, one textual point from each text, and the comparison you would draw. (5 marks)", "options": [], "answer": "1 mark — a topic sentence naming both texts and making a comparative claim (e.g. both expose a town that protects its own).\n1 mark — a specific point from Lee's novel: the trial and the town's hierarchy, with the technique that carries it (Scout's limited narration; the courtroom as a stage).\n1 mark — a specific point from Parker's film: for example the opening water-fountain sequence, with the technique that carries it (mid shot, framing, juxtaposition).\n1 mark — a comparison sentence explaining how the two methods differ in effect (delayed recognition vs immediate visual exposure).\n1 mark — a link back to the question's key term 'systemic', showing what the comparison proves.", "explanation": "5 分：主题句（含两文本与比较论点）→ Lee 的证据+手法 → Parker 的证据+手法 → 比较句（效果差异）→ 扣回“制度性”。注意两边的证据都要带手法，只说情节扣不到分析分。", "source": "Section 2 · Comparative essay — paragraph planning (TKAMB BP scaffolds + film deconstruction lessons)", "points": [{"t": "a topic sentence naming both texts and making a comparative claim (e.g. both expose a town that protects its own).", "m": 1}, {"t": "a specific point from Lee's novel: the trial and the town's hierarchy, with the technique that carries it (Scout's limited narration; the courtroom as a stage).", "m": 1}, {"t": "a specific point from Parker's film: for example the opening water-fountain sequence, with the technique that carries it (mid shot, framing, juxtaposition).", "m": 1}, {"t": "a comparison sentence explaining how the two methods differ in effect (delayed recognition vs immediate visual exposure).", "m": 1}, {"t": "a link back to the question's key term 'systemic', showing what the comparison proves.", "m": 1}], "weak": false}, {"id": "eng-032", "topic": "比较论文 · 结尾回收", "difficulty": "hard", "type": "mcq", "stem": "Which conclusion best completes a comparative essay without simply repeating the introduction?", "options": ["The comparison matters because Lee's slow recognition and Parker's forced witness demand different responses, so empathy must become action.", "In conclusion, both Harper Lee and Alan Parker show that racism is bad, and this is why the two texts are still studied in schools today.", "In conclusion, Lee's novel and Parker's film are both important texts that teach readers and viewers about the dangers of prejudice.", "In conclusion, this essay has discussed characterisation, setting and narrative in To Kill a Mockingbird and Mississippi Burning as I set out."], "answer": 0, "explanation": "结尾要“回收论点并推进”：把比较结果说成对读者/观众的不同道德要求（共情须化为行动），而不是重复论点。其余三项分别是空泛评价、复述结构、以及只重复“反对偏见”的老话。", "source": "Section 2 · Comparative essay — conclusion (LEEDER 10ENGB exam outline: integrate the extract, sustain the argument)", "weak": false}, {"id": "eng-033", "topic": "写作技巧 · 描述 vs 分析", "difficulty": "easy", "type": "mcq", "stem": "Which sentence analyses rather than describes?", "options": ["Parker uses a mid shot in the opening scene, and a mid shot is a camera shot taken from a medium distance.", "The camera holds both fountains side by side, so segregation becomes an ordinary arrangement the viewer absorbs before judging it.", "In the opening scene Parker shows two water fountains, one for white people and one for black people, standing in the street.", "The scene is effective because it shows the audience that segregation really existed in towns in America at that time."], "answer": 1, "explanation": "分析句要有「手法 → 效果 → 对观者的作用」三步：取景把隔离变成“日常安排”，观众先接受再判断。「In the opening scene Parker shows two water fountains, one for white people and one for black people, standing in the street.」只复述内容；「Parker uses a mid shot in the opening scene, and a mid shot is a camera shot taken from a medium distance.」是术语定义；「The scene is effective because it shows the audience that segregation really existed in towns in America at that time.」是空泛断言，没说清怎么产生效果。", "source": "Writing skills · Analytical vs descriptive sentences (Term 3 weeks 8–10: refining analytical writing)", "weak": false}, {"id": " const KEY = "dsh-quiz-eng";
const MULTI = DATA.slug === "all";
const app = document.getElementById("app");
let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = DATA.questions.map((_,i)=>i);
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderSetup() {
  const subs = DATA.subjects || {};
  const keys = Object.keys(subs);
  const saved = state.pick || {};
  const opts = keys.map(k => {
    const on = saved[k] !== false;
    return `<label class="pick"><input type="checkbox" data-s="${k}" ${on ? "checked" : ""}>
      <span class="nm" title="${esc(subs[k].zh || k)}">${esc(subs[k].zh || k)}</span><em>${subs[k].n}</em></label>`;
  }).join("");
  const per = (state.per === undefined || state.per === null) ? 10 : state.per;
  const DAILY = ["sci","eng","his","geo","pdh","matp","maths53"];
  app.innerHTML = `<div class="setup">
    <div class="setup-head">
      <h2>综合卷 · 全科</h2>
      <p class="muted">从各科抽题混着做；做错的题会按它原本的科目进错题本，并按第 1/3/7 天排期。</p>
    </div>

    <section class="setup-block">
      <div class="setup-label">1 · 选科目 <span class="muted" id="pickcount"></span></div>
      <div class="picks">${opts}</div>
    </section>

    <section class="setup-block">
      <div class="setup-label">2 · 每科抽几题</div>
      <div class="seg">${[5,10,20,0].map(n => `<button data-n="${n}" class="${per===n?'on':''}">${n? n+' 题':'全部'}</button>`).join("")}</div>
    </section>

    <div class="setup-foot">
      <div class="sum">共 <b id="cnt">0</b> 题</div>
      <button class="btn ghost" id="daily">今日挑战</button>
      <button class="btn" id="startmix">开始答题 →</button>
    </div>
  </div>`;
  const chosenCount = () => {
    let c = 0;
    app.querySelectorAll(".pick input").forEach(cb => { if (cb.checked) c++; });
    return c || Object.keys(subs).filter(k => (state.pick || {})[k] !== false).length;
  };
  const calc = () => {
    let n = 0;
    app.querySelectorAll(".pick input").forEach(cb => {
      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = "已选 " + chosenCount() + " 科";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
    state.answers={}; state.daily=key; state.rewarded=false; state.t0=Date.now(); save(); render();
  }
  document.getElementById("daily").onclick = startDaily;
  document.getElementById("startmix").onclick = () => {
    const chosen = keys.filter(k => (state.pick || {})[k] !== false);
    if (!chosen.length) { alert("至少选一科"); return; }
    let idxs = [];
    chosen.forEach(k => {
      let pool = DATA.questions.map((q, i) => q.subj === k ? i : -1).filter(i => i >= 0);
      pool.sort(() => Math.random() - 0.5);
      idxs = idxs.concat(per ? pool.slice(0, per) : pool);
    });
    idxs.sort(() => Math.random() - 0.5);
    state.order = idxs; state.idx = 0; state.started = true; state.setup = false;
    state.answers = {}; state.t0 = Date.now(); save(); render();
  };
  calc();
}


/* ===== 语言切换 ===== */
function LANG(){ try{ return localStorage.getItem("dsh-lang") || "en"; }catch(e){ return "en"; } }
function setLANG(v){ try{ localStorage.setItem("dsh-lang", v); }catch(e){} }
var UI_TEXT = {
  en: { grid:"Index", exam:"Exam mode", restart:"Restart", prev:"< Previous", next:"Next >",
        finish:"See results", back:"< Subjects", again:"Redo all", lb:"Today's leaderboard" },
  zh: { grid:"题号", exam:"考试模式", restart:"重来", prev:"← 上一题", next:"下一题 →",
        finish:"看成绩", back:"← 科目列表", again:"整套重做", lb:"查看今日榜单" }
};
function T(k){
  var lang = LANG(); var d = UI_TEXT[lang === "zh" ? "zh" : "en"];
  return d[k] || UI_TEXT.en[k] || k;
}
function applyChrome(){
  var map = { grid:"#grid", exam:"#exam", restart:"#restart" };
  Object.keys(map).forEach(function(k){ var el=document.querySelector(map[k]); if(el) el.textContent=T(k); });
  var btn=document.getElementById("langBtn"), now=document.getElementById("langNow");
  var l=LANG();
  if(now) now.textContent = l==="en" ? "EN" : (l==="zh" ? "中文" : "EN+中");
}
function cycleLang(){
  var order=["en","zh","both"], i=order.indexOf(LANG());
  setLANG(order[(i+1)%3] || "en");
  applyChrome(); render();
}

function render() {
  if (MULTI && location.hash === "#daily" && !state.started && !state.dailyAuto) {
    state.dailyAuto = true; if (typeof startDaily === "function") startDaily();
  }
  if (MULTI && state.setup && !state.started) return renderSetup();
  const qs = state.order.map(i => DATA.questions[i]);
  const q = qs[state.idx];
  const L = LANG(), ZH = (q && q.zh) || null;
  const total = qs.length;
  const answered = qs.filter(x => state.answers[x.id]).length;
  const right = qs.filter(x => state.answers[x.id] === "ok").length;
  const wrong = qs.filter(x => state.answers[x.id] === "bad").length;
  document.getElementById("counter").textContent = (state.idx+1) + " / " + total;
  document.getElementById("scorepill").textContent = "✓ " + right + "  ✗ " + wrong;
  document.getElementById("pbar").style.width = (answered/total*100).toFixed(1) + "%";
  if (!q) { app.innerHTML = "<p>这套题是空的。</p>"; return; }

  const rec = state.answers[q.id];
  const chips = `<div class="chips">
      ${MULTI && q.subjZh ? `<span class="chip">${esc(q.subjZh)}</span>` : ""}
      <span class="chip">${esc(q.topic)}</span>
      <span class="chip ${esc(q.difficulty)}">${ {easy:"简单",medium:"中等",hard:"较难"}[q.difficulty] || esc(q.difficulty) }</span>
      <span class="chip">${q.type === "mcq" ? "选择题" : "简答"}</span>
      <span class="chip">第 ${state.idx+1} 题 / 共 ${total}</span>
    </div>`;

  let bodyHtml = "";
  if (q.type === "mcq") {
    const opts = (q.options || []).map((o, i) => {
      let cls = "opt", mark = "";
      if (rec) {
        if (i === q.answer) { cls += " correct"; mark = '<span class="mk">✓</span>'; }
        else if (rec.chosen === i) { cls += " wrong"; mark = '<span class="mk">✗</span>'; }
      }
      const zo = (ZH && Array.isArray(ZH.options) && ZH.options[i]) ? ZH.options[i] : "";
      const zhSpan = (L !== "en" && zo) ? `<span class="otr">${esc(zo)}</span>` : "";
      return `<button class="${cls}" data-i="${i}" ${rec ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[i]}</span><span class="txt">${esc(o)}${zhSpan}</span>${mark}</button>`;
    }).join("");
    bodyHtml = `<div class="opts">${opts}</div>`;
  } else {
    const pts = q.points && q.points.length ? q.points : [{t:q.answer, m:1}];
    const totalMarks = pts.reduce((a,p)=>a+(p.m||1),0);
    const checked = (rec && rec.checked) ? rec.checked : [];
    const earned = pts.reduce((a,p,i)=>a + (checked.indexOf(i)>=0 ? (p.m||1) : 0), 0);
    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    bodyHtml = `<textarea id="ta" placeholder="先自己写（英文），写完点下面的按钮对照得分点">${rec && rec.text ? esc(rec.text) : ""}</textarea>
      <div class="actions">
        <button class="btn" id="reveal">${rec ? "重新对照得分点" : "对照得分点"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        ${rec ? `<span class="pill" style="align-self:center">已得 <b>${earned}</b> / ${totalMarks} 分</span>` : `<span class="muted" style="align-self:center">共 ${totalMarks} 分 · ${pts.length} 个得分点</span>`}
      </div>`;
    if (rec) {
      bodyHtml += `<div class="panel">
        <div class="panel-h">自评 · 勾选你写到的得分点</div>
        <div class="pts">${pts.map((p,i)=>`
          <label class="pt ${checked.indexOf(i)>=0?'on':''}"><input type="checkbox" data-i="${i}" ${checked.indexOf(i)>=0?'checked':''}><span>${esc(p.t)}</span><em>${p.m||1} 分</em></label>`).join("")}</div>
        <div class="actions">
          <button class="btn ghost" id="allpt">全部勾上</button>
          <button class="btn ghost" id="nonept">全部取消</button>
        </div>
        <div class="mine"><b>你写的：</b><div>${esc(((rec.text||"").trim()) || "（空）")}</div></div>
      </div>`;
    }
  }

  const expHtml = rec ? `<div class="exp show"><b>解析：</b>${esc(q.explanation)}
      ${q.type === "short" ? `<details class="fullans"><summary>看完整参考答案</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">出处：${esc(q.source || "")}</div></div>` : "";

  const last = state.idx >= total - 1;
  let stemHtml;
  if (L === "zh" && ZH && ZH.stem) {
    stemHtml = `<div class="stem zh"><span class="orig">${esc(q.stem)}</span>${esc(ZH.stem)}</div>`;
  } else if (L === "both" && ZH && ZH.stem) {
    stemHtml = `<div class="stem">${esc(q.stem)}<div class="tr">${esc(ZH.stem)}</div></div>`;
  } else {
    stemHtml = `<div class="stem">${esc(q.stem)}</div>`;
  }
  app.innerHTML = `<div class="card">${chips}${stemHtml}
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>${T("prev")}</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">${T("finish")}</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>${T("next")}</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq", i === q.answer);
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq");
      save(); render();
    }));
  } else {
    const ta = document.getElementById("ta");
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    document.getElementById("reveal").onclick = () => {
      const c = cur();
      state.answers[q.id] = {chosen:-1, text: ta.value, checked: c.checked || [], ok:"ok"};
      save(); render();
    };
    app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur(); const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      state.answers[q.id] = {chosen:-1, text: c.text, checked: [...set].sort((a,b)=>a-b), ok:"ok"};
      const full = pts.every((_,i)=>set.has(i));
      if (window.awardForQ && full && !(c.checked && c.checked.length >= pts.length)) awardForQ(q.id, q.difficulty, "short", true);
      reviewMark(q.subj || DATA.slug, q.id, full);
      logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short");
      save(); render();
    }));
    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const u = numsOf(ta.value), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!u.length) { res.textContent = "你还没写数字"; res.style.color = "var(--dim)"; return; }
      if (!a.length) { res.textContent = "参考答案无数字"; res.style.color = "var(--dim)"; return; }
      const last = u[u.length-1];
      const hit = a.some(v => Math.abs(v-last) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "✓ 数值与参考答案一致" : "✗ 数值与参考答案不一致";
      res.style.color = hit ? "var(--ok)" : "var(--bad)";
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:pts.map((_,i)=>i),ok:"ok"}; save(); render(); };
    if (none) none.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:[],ok:"ok"}; save(); render(); };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        if (window.lbSubmit) lbSubmit(state.t0 ? (Date.now() - state.t0) : 0);
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
        if (window.lbOpen) setTimeout(function(){ lbOpen(); }, 600);
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.awardXP && answered > 0) awardXP(20 + Math.min(80, answered), true);
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.points && x.points.length) ? x.points : [{m:1}];
    const tot = pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const got = (r && r.checked) ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  app.innerHTML = `<div class="card done">
      <h2>选择题 ${right.length} / ${mcq.length} 正确（${pct}%）</h2>
      <div class="stats">
        <div class="stat"><b>${right.length}</b><span>选择题答对</span></div>
        <div class="stat"><b>${wrong.length}</b><span>选择题答错</span></div>
        <div class="stat"><b>${earnedM}</b><span>简答得分 / ${totalM}</span></div>
        <div class="stat"><b>${todo.length}</b><span>未做</span></div>
      </div>
      ${weak.length ? `<div><b>简答没拿满的题（${weak.length}）：</b><ol class="wronglist">${weak.map(x => `<li>${esc(x.topic)}</li>`).join("")}</ol></div>` : ""}
      ${wrong.length ? `<div><b>选择题错题：</b><ol class="wronglist">${wrong.map(x => `<li>${esc(x.topic)} — ${esc((x.stem||"").slice(0,60))}…</li>`).join("")}</ol></div>` : ""}
      <div class="actions">
        ${needRedo.length ? `<button class="btn" id="redo">只练错题（${needRedo.length} 题）</button>` : ""}
        <button class="btn ghost" id="showlb">${T("lb")}</button>
        <button class="btn ghost" id="again">${T("again")}</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← 回到科目列表</a>
      </div></div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    state.order = wrongIds.map(id => DATA.questions.findIndex(x => x.id === id)).filter(i => i >= 0);
    wrongIds.forEach(id => delete state.answers[id]);
    state.idx = 0; save(); render();
  };
  const showlb = document.getElementById("showlb");
  if (showlb) showlb.onclick = () => { if (window.lbOpen) lbOpen(); };
  document.getElementById("again").onclick = () => {
    state = {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
    save(); render();
  };
}
