<script>
const DATA = {"slug": "eng", "title": "英语 · 10 年级", "examMin": 70, "questions": [{"topic": "King Lear · Plot", "difficulty": "easy", "type": "mcq", "stem": "How does King Lear decide how to divide his kingdom at the start of the play?", "options": ["By asking each daughter to say how much she loves him", "By drawing lots with his daughters", "By holding a tournament between the dukes", "By giving the largest share to the eldest daughter"], "answer": 0, "explanation_en": "King Lear asks his three daughters to express their love for him, which will determine their share of the kingdom, making love a measurable performance.", "source": "Yearly Study Guide 2026 · English（5 multiple choice questions based on the events of your play）", "id": "eng-001", "weak": false}, {"topic": "King Lear · Plot", "difficulty": "easy", "type": "mcq", "stem": "What word does Cordelia use when asked to declare her love, which triggers Lear's rage?", "options": ["Everything", "Nothing", "Half", "Love"], "answer": 1, "explanation_en": "Cordelia replies 'Nothing', refusing to use flattery to gain land, and Lear mistakes her honesty for denial, stripping her of her inheritance.", "source": "Yearly Study Guide 2026 · English", "id": "eng-002", "weak": false}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "Who is the faithful nobleman banished for speaking in defence of Cordelia, and how does he return?", "options": ["Edmund, disguised as a messenger", "Albany, disguised as a knight", "Kent, disguised as the servant Caius", "Gloucester, disguised as Poor Tom"], "answer": 2, "explanation_en": "Kent is banished for defending Cordelia and continues to serve Lear in disguise as Caius, while Poor Tom is Edgar's disguise and Albany is not in disguise.", "source": "Yearly Study Guide 2026 · English", "id": "eng-003", "weak": false}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "How does Goneril and Regan's treatment of Lear change after they gain power?", "options": ["They crown him king of a smaller region", "They exile him to France", "They give him more knights than he had before", "They reduce the number of knights he may keep, eventually refusing them entirely"], "answer": 3, "explanation_en": "Lear's request to keep 100 knights is reduced to 50 by Goneril and then to 25 by Regan, who eventually refuses to accommodate him, and the removal of his attendants is a key point of humiliation.", "source": "Yearly Study Guide 2026 · English", "id": "eng-004", "weak": false}, {"topic": "King Lear · Plot", "difficulty": "medium", "type": "mcq", "stem": "Edmund plots against Edgar and Gloucester. Which action most directly sets his plan in motion?", "options": ["He tells Edgar that Gloucester wants him dead, then claims Edgar plotted to kill Gloucester", "He forges a letter and calls a tournament", "He reports Edgar to the King", "He openly challenges Edgar to a duel"], "answer": 0, "explanation_en": "Edmund forges letters, tricks Edgar into fleeing, and reports to Gloucester that 'Edgar is plotting against his father', making Edgar a wanted man and himself the legitimate heir.", "source": "Yearly Study Guide 2026 · English", "id": "eng-005", "weak": false}, {"topic": "King Lear · Plot", "difficulty": "hard", "type": "mcq", "stem": "How does the play end for Lear and Cordelia?", "options": ["They rule the kingdom together", "Cordelia is hanged on Edmund's orders and Lear dies of grief with her body", "Lear is killed in battle by Albany", "They flee to France and survive"], "answer": 1, "explanation_en": "Edmund orders Cordelia's execution, and when Lear arrives, it's too late, and he dies holding her body, with no happy ending to restore order, only Albany and Edgar picking up the pieces.", "source": "Yearly Study Guide 2026 · English", "id": "eng-006", "weak": false}, {"id": "eng-007", "topic": "King Lear · Division and Cordelia's 'Nothing'", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nCORDELIA: Nothing, my lord.\nKING LEAR: Nothing!\nCORDELIA: Nothing.\nKING LEAR: Nothing will come of nothing: speak again.\n\n(a) What does Cordelia's reply reveal about her values? (2 marks)\n(b) Explain how Lear's response sets the tragedy in motion. (3 marks)", "options": [], "answer": "(a) 1 mark — Cordelia refuses to flatter or perform love for a reward; she will not compete with her sisters' speeches.\n1 mark — her plain 'Nothing' signals honesty and a measured, private love (she loves 'according to my bond'), not an absence of feeling.\n(b) 1 mark — Lear equates love with public declaration, so silence is read as rejection.\n1 mark — his pun, 'Nothing will come of nothing', shows him thinking in terms of a bargain or debt rather than affection.\n1 mark — he banishes Cordelia (and Kent) and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him.", "explanation_en": "The two questions form a causal chain: (a) why Cordelia says 'Nothing' (refusing to perform love, which is a 'duty' not a quote), and (b) linking three points - taking words as love, using puns as transactions, and exile creating a power vacuum.", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "States that Cordelia refuses to flatter or perform love for a reward, and will not compete with her sisters' speeches", "m": 1}, {"id": "c2", "t": "States that her plain 'Nothing' signals honesty and a measured, private love ('according to my bond' in the answer) rather than an absence of feeling", "m": 1}, {"id": "c3", "t": "Explains that Lear equates love with public declaration, so silence is read as rejection", "m": 1}, {"id": "c4", "t": "Explains how his pun 'Nothing will come of nothing' shows him thinking in terms of a bargain or debt rather than affection", "m": 1}, {"id": "c5", "t": "Explains that he banishes Cordelia and Kent and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that Cordelia refuses to flatter or perform love for a reward, and will not compete with her sisters' speeches", "m": 1}, {"id": "c2", "t": "States that her plain 'Nothing' signals honesty and a measured, private love ('according to my bond' in the answer) rather than an absence of feeling", "m": 1}, {"id": "c3", "t": "Explains that Lear equates love with public declaration, so silence is read as rejection", "m": 1}, {"id": "c4", "t": "Explains how his pun 'Nothing will come of nothing' shows him thinking in terms of a bargain or debt rather than affection", "m": 1}, {"id": "c5", "t": "Explains that he banishes Cordelia and Kent and divides the kingdom between Goneril and Regan, handing power to the daughters who will destroy him", "m": 1}], "weak": false}, {"id": "eng-008", "topic": "King Lear · Flattering language (1.1)", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nGONERIL: Sir, I love you more than words can wield the matter;\nDearer than eye-sight, space, and liberty;\nBeyond what can be valued, rich or rare;\n\n(a) Identify two features of Goneril's language. (2 marks)\n(b) Explain why Shakespeare gives this speech to Goneril rather than to Cordelia. (3 marks)", "options": [], "answer": "(a) 1 mark — hyperbole and unverifiable comparison ('more than words can wield', 'dearer than eyesight, space and liberty').\n1 mark — a catalogue of absolutes: love is measured against everything (sight, space, liberty, wealth) and therefore means nothing specific.\n(b) 1 mark — the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and truth as plain speech.\n1 mark — it positions the audience above Lear: we can hear the inflation before he can (dramatic irony).\n1 mark — it establishes the play's central error: love treated as language to be counted rather than felt.", "explanation_en": "This question examines how language is quantified: Goneril uses exaggeration and absolute lists to make love comparable and quotable.", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "Identifies hyperbole and unverifiable comparison in Goneril's language (e.g. 'more than words can wield', 'dearer than eye-sight, space, and liberty')", "m": 1}, {"id": "c2", "t": "Identifies her catalogue of absolutes, in which love is measured against everything and therefore means nothing specific", "m": 1}, {"id": "c3", "t": "Explains that the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and plain speech as truth", "m": 1}, {"id": "c4", "t": "Explains that the speech positions the audience above Lear, who cannot yet hear the inflation (dramatic irony)", "m": 1}, {"id": "c5", "t": "Explains that it establishes the play's central error: love treated as language to be counted rather than felt", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Identifies hyperbole and unverifiable comparison in Goneril's language (e.g. 'more than words can wield', 'dearer than eye-sight, space, and liberty')", "m": 1}, {"id": "c2", "t": "Identifies her catalogue of absolutes, in which love is measured against everything and therefore means nothing specific", "m": 1}, {"id": "c3", "t": "Explains that the contrast with Cordelia's plain 'Nothing' exposes flattery as performance and plain speech as truth", "m": 1}, {"id": "c4", "t": "Explains that the speech positions the audience above Lear, who cannot yet hear the inflation (dramatic irony)", "m": 1}, {"id": "c5", "t": "Explains that it establishes the play's central error: love treated as language to be counted rather than felt", "m": 1}], "weak": false}, {"id": "eng-009", "topic": "King Lear · Sight and blindness imagery", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nKENT: See better, Lear; and let me still remain\nThe true blank of thine eye.\n\nExplain what Kent's image of sight suggests about Lear's error and about the play's wider concerns. (3 marks)", "options": [], "answer": "1 mark — sight here means judgement or insight, not physical vision: Kent is telling Lear that he is misreading his daughters.\n1 mark — Kent offers to be the 'blank' (the true target/centre) of Lear's eye, that is, the honest perspective Lear refuses.\n1 mark — the image plants the blindness motif that structures the whole play: Gloucester is literally blinded, and Lear only learns to 'see' once he has lost everything.", "explanation_en": "3 marks are given for: sight = judgment (not vision), Kent's voluntary loyalty as a 'target', and this metaphor setting up the blindness theme throughout the play (leading to Gloucester's eye gouging and Lear's eventual loss).", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that sight here means judgement or insight rather than physical vision, so Kent is telling Lear that he is misreading his daughters", "m": 1}, {"id": "c2", "t": "Explains that Kent offers to be the 'blank' (the true target or centre of Lear's eye), that is, the honest perspective Lear refuses", "m": 1}, {"id": "c3", "t": "Explains that the image plants the blindness motif that structures the play, with Gloucester literally blinded and Lear learning to 'see' only after losing everything", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that sight here means judgement or insight rather than physical vision, so Kent is telling Lear that he is misreading his daughters", "m": 1}, {"id": "c2", "t": "Explains that Kent offers to be the 'blank' (the true target or centre of Lear's eye), that is, the honest perspective Lear refuses", "m": 1}, {"id": "c3", "t": "Explains that the image plants the blindness motif that structures the play, with Gloucester literally blinded and Lear learning to 'see' only after losing everything", "m": 1}], "weak": false}, {"id": "eng-010", "topic": "King Lear · Hamartia (the dragon image)", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 1:\n\nLEAR: Come not between the dragon and his wrath.\n\nHow does this line help to explain Lear's hamartia? (3 marks)", "options": [], "answer": "1 mark — the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge.\n1 mark — wrath has replaced judgement: he acts from injured pride rather than reason, and cannot tolerate being contradicted.\n1 mark — because this flaw (not fate) drives the banishments and the division of the kingdom, his downfall follows from character, which is what makes the play a tragedy.", "explanation_en": "Hamartia is not 'bad luck', but a character flaw: Lear's anger overrides his judgment, making him expel and divide the kingdom, driven by his character, as required by tragic structure.", "source": "King Lear Act 1 Scene 1 (quote: Shakespeare, King Lear 1.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge", "m": 1}, {"id": "c2", "t": "Explains that wrath has replaced judgement, so he acts from injured pride and cannot tolerate being contradicted", "m": 1}, {"id": "c3", "t": "Explains that this flaw, not fate, drives the banishments and the division of the kingdom, which is what makes the play a tragedy", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the dragon is Lear's self-image: power, terror and untouchability, a king who sees himself as beyond challenge", "m": 1}, {"id": "c2", "t": "Explains that wrath has replaced judgement, so he acts from injured pride and cannot tolerate being contradicted", "m": 1}, {"id": "c3", "t": "Explains that this flaw, not fate, drives the banishments and the division of the kingdom, which is what makes the play a tragedy", "m": 1}], "weak": false}, {"id": "eng-011", "topic": "King Lear · Power, loss and identity", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: I gave you all—\nREGAN: And in good time you gave it.\n\nAnalyse what this exchange reveals about power, loss and identity. (4 marks)", "options": [], "answer": "1 mark — Lear still speaks as the giver: his identity is bound up in what he handed over, so he assumes authority continues after the gift.\n1 mark — Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude.\n1 mark — the daughters now own the power he thought he kept; the title of king remains but the substance has gone.\n1 mark — the play shows identity collapsing when power is transferred: Lear is reduced to 'a poor old man' and has to rebuild a self from bare humanity.", "explanation_en": "4 marks cover three concepts: power has shifted, identity remains with the 'giver', and the work illustrates 'title ≠ substance', with Regan's cold 'in good time' marking a turning point in power relations.", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that Lear still speaks as the giver, since his identity is bound up in what he handed over and he assumes his authority continues after the gift", "m": 1}, {"id": "c2", "t": "Explains that Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude", "m": 1}, {"id": "c3", "t": "Explains that the daughters now hold the power he thought he kept, so the title of king remains but its substance has gone", "m": 1}, {"id": "c4", "t": "Explains that identity collapses when power is transferred, leaving Lear a 'poor old man' who must rebuild a self from bare humanity", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Lear still speaks as the giver, since his identity is bound up in what he handed over and he assumes his authority continues after the gift", "m": 1}, {"id": "c2", "t": "Explains that Regan's 'in good time' turns the gift into a completed transaction and cancels his claim on gratitude", "m": 1}, {"id": "c3", "t": "Explains that the daughters now hold the power he thought he kept, so the title of king remains but its substance has gone", "m": 1}, {"id": "c4", "t": "Explains that identity collapses when power is transferred, leaving Lear a 'poor old man' who must rebuild a self from bare humanity", "m": 1}], "weak": false}, {"id": "eng-012", "topic": "King Lear · 'Reason not the need'", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 2 Scene 4:\n\nLEAR: O, reason not the need: our basest beggars\nAre in the poorest thing superfluous:\n\nWhat does this speech reveal about Lear's understanding of need? (3 marks)", "options": [], "answer": "1 mark — he argues that bare necessity is not enough for human dignity: even beggars have something 'superfluous' beyond survival.\n1 mark — he is defending his hundred knights as a symbol of status and respect, not as a practical requirement.\n1 mark — the speech shows him reasoning about humanity and hardship, but still from a king's position, so the insight is genuine yet incomplete.", "explanation_en": "The key to this question is 'need has two layers': survival needs vs human dignity needs, and while Lear can now speak for the poor, he still fights for pomp and dignity, showing his recognition is incomplete.", "source": "King Lear Act 2 Scene 4 (quote: Shakespeare, King Lear 2.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that Lear argues bare necessity is not enough for human dignity, since even beggars have something 'superfluous' beyond survival", "m": 1}, {"id": "c2", "t": "Explains that he defends his hundred knights as a symbol of status and respect rather than a practical requirement", "m": 1}, {"id": "c3", "t": "Explains that the speech shows genuine insight into humanity and hardship but is still spoken from a king's position, so the understanding is incomplete", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Lear argues bare necessity is not enough for human dignity, since even beggars have something 'superfluous' beyond survival", "m": 1}, {"id": "c2", "t": "Explains that he defends his hundred knights as a symbol of status and respect rather than a practical requirement", "m": 1}, {"id": "c3", "t": "Explains that the speech shows genuine insight into humanity and hardship but is still spoken from a king's position, so the understanding is incomplete", "m": 1}], "weak": false}, {"id": "eng-013", "topic": "King Lear · The storm as symbol (3.2)", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 2:\n\nLEAR: Blow, winds, and crack your cheeks! rage! blow! ...\nI am a man\nMore sinn'd against than sinning.\n\n(a) How does Shakespeare use the storm symbolically in this scene? (3 marks)\n(b) What does 'More sinn'd against than sinning' reveal about Lear's self-knowledge at this point? (3 marks)", "options": [], "answer": "(a) 1 mark — the storm externalises Lear's inner rage and gives his fury a cosmic scale.\n1 mark — it is also indifferent nature: wind and rain do not answer him, which cuts human authority down to size.\n1 mark — by stripping him of shelter and followers it forces him to confront exposed humanity, preparing the 'poor naked wretches' speech.\n(b) 1 mark — he sees himself chiefly as a victim: 'sinn'd against' comes first and carries the weight.\n1 mark — he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial, not full confession.\n1 mark — fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey.", "explanation_en": "(a) The storm has three functions: externalising anger, showing nature's indifference, and stripping away the facade of power. (b) Note the concessional structure 'more ... than' - he admits fault but portrays himself as a victim, so it's 'partly self-aware', not 'completely repentant'.", "source": "King Lear Act 3 Scene 2 (quote: Shakespeare, King Lear 3.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 6, "criteria": [{"id": "c1", "t": "Explains that the storm externalises Lear's inner rage and gives his fury a cosmic scale", "m": 1}, {"id": "c2", "t": "Explains that the storm is also indifferent nature (wind and rain do not answer him), which cuts human authority down to size", "m": 1}, {"id": "c3", "t": "Explains that stripping him of shelter and followers forces him to confront exposed humanity and prepares the 'poor naked wretches' speech", "m": 1}, {"id": "c4", "t": "Explains that Lear sees himself chiefly as a victim, with 'sinn'd against' placed first and carrying the weight", "m": 1}, {"id": "c5", "t": "Explains that he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial rather than a full confession", "m": 1}, {"id": "c6", "t": "Explains that fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the storm externalises Lear's inner rage and gives his fury a cosmic scale", "m": 1}, {"id": "c2", "t": "Explains that the storm is also indifferent nature (wind and rain do not answer him), which cuts human authority down to size", "m": 1}, {"id": "c3", "t": "Explains that stripping him of shelter and followers forces him to confront exposed humanity and prepares the 'poor naked wretches' speech", "m": 1}, {"id": "c4", "t": "Explains that Lear sees himself chiefly as a victim, with 'sinn'd against' placed first and carrying the weight", "m": 1}, {"id": "c5", "t": "Explains that he concedes only a lesser share of blame ('more ... than'), so the self-knowledge is partial rather than a full confession", "m": 1}, {"id": "c6", "t": "Explains that fuller recognition comes later (Act 4, 'they told me I was every thing; 'tis a lie'), so this scene is a middle stage of his moral journey", "m": 1}], "weak": false}, {"id": "eng-014", "topic": "King Lear · 'Poor naked wretches' (turning point)", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Poor naked wretches, wheresoe'er you are,\nThat bide the pelting of this pitiless storm ...\nO, I have ta'en\nToo little care of this!\n\nExplain why this speech is a turning point in Lear's moral understanding. (4 marks)", "options": [], "answer": "1 mark — for the first time he thinks about other people's suffering instead of listing his own injuries.\n1 mark — he admits neglect as a ruler: 'too little care of this' is a confession of political and moral failure.\n1 mark — the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too.\n1 mark — the insight only arrives after he loses power and shelter, so suffering becomes his teacher; the lesson costs him everything.", "explanation_en": "4 marks: ① thinking of others' suffering ② acknowledging the ruler's responsibility ③ specific imagery making poverty tangible ④ this awareness is gained through 'losing power'. Don't stop at ① or you'll only get 1 mark.", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that for the first time he thinks about other people's suffering instead of listing his own injuries", "m": 1}, {"id": "c2", "t": "Explains that he admits neglect as a ruler, so 'too little care of this' is a confession of political and moral failure", "m": 1}, {"id": "c3", "t": "Explains that the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too", "m": 1}, {"id": "c4", "t": "Explains that the insight only arrives after he loses power and shelter, so suffering becomes his teacher at the cost of everything", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that for the first time he thinks about other people's suffering instead of listing his own injuries", "m": 1}, {"id": "c2", "t": "Explains that he admits neglect as a ruler, so 'too little care of this' is a confession of political and moral failure", "m": 1}, {"id": "c3", "t": "Explains that the concrete imagery (houseless heads, unfed sides) makes poverty physical rather than abstract, so the audience feels it too", "m": 1}, {"id": "c4", "t": "Explains that the insight only arrives after he loses power and shelter, so suffering becomes his teacher at the cost of everything", "m": 1}], "weak": false}, {"id": "eng-015", "topic": "King Lear · 'Lendings' and stripping of identity", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 4:\n\nLEAR: Is man no more than this? Consider him well. ...\nOff, off, you lendings! come unbutton here.\n\nWhat does Lear's stripping off his clothes represent? (3 marks)", "options": [], "answer": "1 mark — 'lendings' treats clothes as borrowed status rather than as part of the self.\n1 mark — stripping tests what a human being is when rank, retinue and clothing are removed.\n1 mark — it dramatises the play's theme of identity: a king discovers he is only 'a poor, bare, forked animal', which is both a loss and a form of truth.", "explanation_en": "3 marks: clothes = borrowed identity, undressing = reducing someone to a 'bare, forked animal', and this action is both loss and awareness. It's better if you can point out the paradox of 'poor, bare, forked animal' (no need to quote verbatim).", "source": "King Lear Act 3 Scene 4 (quote: Shakespeare, King Lear 3.4); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that 'lendings' treats clothes as borrowed status rather than as part of the self", "m": 1}, {"id": "c2", "t": "Explains that stripping tests what a human being is once rank, retinue and clothing are removed", "m": 1}, {"id": "c3", "t": "Explains that the action dramatises the play's theme of identity, since the king discovers he is only 'a poor, bare, forked animal' — both a loss and a form of truth", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that 'lendings' treats clothes as borrowed status rather than as part of the self", "m": 1}, {"id": "c2", "t": "Explains that stripping tests what a human being is once rank, retinue and clothing are removed", "m": 1}, {"id": "c3", "t": "Explains that the action dramatises the play's theme of identity, since the king discovers he is only 'a poor, bare, forked animal' — both a loss and a form of truth", "m": 1}], "weak": false}, {"id": "eng-016", "topic": "King Lear · Gloucester's blinding (3.7)", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 3 Scene 7:\n\nCORNWALL: Out, vile jelly!\nWhere is thy lustre now?\n\n(Gloucester has just been bound to a chair and blinded.)\n\nHow does Shakespeare make Gloucester's blinding more than physical violence? (4 marks)", "options": [], "answer": "1 mark — the language ('vile jelly', 'lustre') turns eyes into objects, so the horror is deliberately grotesque rather than heroic.\n1 mark — it literalises the blindness motif: Gloucester is punished in his eyes for the moral blindness that let Edmund deceive him.\n1 mark — the staging is an abuse of power (a bound guest, a host's authority turned to torture), echoing Lear's abuse of Cordelia and Kent.\n1 mark — the audience is forced to watch what the characters refused to see, so the scene makes sight a moral act for the viewer as well.", "explanation_en": "This question requires explaining 'literal blindness = metaphorical blindness fulfilled': Gloucester loses his eyes due to not seeing Edmund clearly, and the atrocity is a misuse of power, parallel to Lear's banishment of his daughter. If you say 'the audience is forced to see', you can get the 4th mark.", "source": "King Lear Act 3 Scene 7 (quote: Shakespeare, King Lear 3.7); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that the language ('vile jelly', 'lustre') turns eyes into objects, making the horror grotesque rather than heroic", "m": 1}, {"id": "c2", "t": "Explains that the blinding literalises the blindness motif, punishing in his eyes the moral blindness that let Edmund deceive him", "m": 1}, {"id": "c3", "t": "Explains that the staging is an abuse of power (a bound guest tortured by a host's authority), echoing Lear's treatment of Cordelia and Kent", "m": 1}, {"id": "c4", "t": "Explains that the audience is forced to watch what the characters refused to see, making sight a moral act for the viewer as well", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the language ('vile jelly', 'lustre') turns eyes into objects, making the horror grotesque rather than heroic", "m": 1}, {"id": "c2", "t": "Explains that the blinding literalises the blindness motif, punishing in his eyes the moral blindness that let Edmund deceive him", "m": 1}, {"id": "c3", "t": "Explains that the staging is an abuse of power (a bound guest tortured by a host's authority), echoing Lear's treatment of Cordelia and Kent", "m": 1}, {"id": "c4", "t": "Explains that the audience is forced to watch what the characters refused to see, making sight a moral act for the viewer as well", "m": 1}], "weak": false}, {"id": "eng-017", "topic": "King Lear · Irony of 'I stumbled when I saw'", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: I have no way, and therefore want no eyes;\nI stumbled when I saw ...\n\nExplain the irony in Gloucester's lines. (3 marks)", "options": [], "answer": "1 mark — when he had eyes he was morally blind, refusing to see Edmund's treachery and turning against Edgar.\n1 mark — now that he is physically blind he sees his own errors and Edgar's love, so insight arrives after sight is gone.\n1 mark — the paradox 'I stumbled when I saw' states the play's inversion: physical sight and moral vision are opposites, which also describes Lear's journey.", "explanation_en": "3 marks: ① having eyes but not seeing the truth ② seeing clearly after becoming blind ③ highlighting the play's 'sight/insight' paradox. It's best to mention the parallel between Gloucester and Lear to show overall understanding.", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that when he had eyes Gloucester was morally blind, refusing to see Edmund's treachery and turning against Edgar", "m": 1}, {"id": "c2", "t": "Explains that now, physically blind, he sees his own errors and Edgar's love, so insight arrives after sight is gone", "m": 1}, {"id": "c3", "t": "Explains that the paradox 'I stumbled when I saw' states the play's inversion of physical sight and moral vision, which also describes Lear's journey", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that when he had eyes Gloucester was morally blind, refusing to see Edmund's treachery and turning against Edgar", "m": 1}, {"id": "c2", "t": "Explains that now, physically blind, he sees his own errors and Edgar's love, so insight arrives after sight is gone", "m": 1}, {"id": "c3", "t": "Explains that the paradox 'I stumbled when I saw' states the play's inversion of physical sight and moral vision, which also describes Lear's journey", "m": 1}], "weak": false}, {"id": "eng-018", "topic": "King Lear · Edmund's values and dramatic function", "difficulty": "medium", "type": "short", "stem": "Section 1 — King Lear, Act 1 Scene 2:\n\nEDMUND: Thou, Nature, art my goddess; to thy law\nMy services are bound.\n\n(a) What does Edmund's address to Nature reveal about his values? (2 marks)\n(b) Explain Edmund's dramatic function in the play. (3 marks)", "options": [], "answer": "(a) 1 mark — he rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead.\n1 mark — his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority.\n(b) 1 mark — he is the engine of the plot: the forged letter sets Edgar running and destroys Gloucester's trust.\n1 mark — his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error.\n1 mark — his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern, not an accident.", "explanation_en": "(a) Edmund uses 'nature' as a goddess to legitimise his desires. (b) Three functions: driving the plot (forging letters), revealing others' 'blindness', and reinforcing the theme through parallel plot. If you mention 'engine of evil' and 'mirror structure', you can get full marks.", "source": "King Lear Act 1 Scene 2 (quote: Shakespeare, King Lear 1.2); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "Explains that Edmund rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead", "m": 1}, {"id": "c2", "t": "Explains that his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority", "m": 1}, {"id": "c3", "t": "Explains that he is the engine of the plot, since the forged letter sets Edgar running and destroys Gloucester's trust", "m": 1}, {"id": "c4", "t": "Explains that his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error", "m": 1}, {"id": "c5", "t": "Explains that his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern rather than an accident", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that Edmund rejects the social and legal order (bastardy, custom, inheritance) and claims a 'natural' right instead", "m": 1}, {"id": "c2", "t": "Explains that his goddess is appetite and self-interest, so 'Nature' becomes an excuse for predation rather than a moral authority", "m": 1}, {"id": "c3", "t": "Explains that he is the engine of the plot, since the forged letter sets Edgar running and destroys Gloucester's trust", "m": 1}, {"id": "c4", "t": "Explains that his manipulation exposes other characters' blindness (Gloucester's credulity, Edgar's trust), which doubles Lear's error", "m": 1}, {"id": "c5", "t": "Explains that his parallel family plot mirrors Lear's, so the two falls together argue that betrayal is a pattern rather than an accident", "m": 1}], "weak": false}, {"id": "eng-019", "topic": "King Lear · The forged letter and dramatic irony", "difficulty": "medium", "type": "short", "stem": "Section 1 — scene description (no quotation):\n\nIn Act 1 Scene 2 Edmund shows his father Gloucester a letter that he has forged in Edgar's handwriting. He then warns Edgar that their father is furious with him and advises him to arm himself and flee.\n\nExplain how Shakespeare creates dramatic irony here and why it matters. (3 marks)", "options": [], "answer": "1 mark — the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter.\n1 mark — each character then acts on information the audience knows to be false, so their choices look like self-destruction.\n1 mark — the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence, trust) can be manufactured.", "explanation_en": "The marking points for dramatic irony are: the audience sees Edmund playing two scenes → characters act on false information → this proves 'seeing/trusting' can be fabricated. For the 3rd mark, you need to elevate to the theme level, not just retell the plot.", "source": "Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage (Act 1 Scenes 1–3 questions and practice extracts)", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter", "m": 1}, {"id": "c2", "t": "Explains that each character then acts on information the audience knows to be false, so their choices look like self-destruction", "m": 1}, {"id": "c3", "t": "Explains that the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence and trust) can be manufactured", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the audience watches Edmund stage both sides of the deception, so we know Edgar is innocent while Gloucester believes the letter", "m": 1}, {"id": "c2", "t": "Explains that each character then acts on information the audience knows to be false, so their choices look like self-destruction", "m": 1}, {"id": "c3", "t": "Explains that the gap between audience and characters turns the plot into a demonstration of how easily 'sight' (evidence and trust) can be manufactured", "m": 1}], "weak": false}, {"id": "eng-020", "topic": "King Lear · The gods and the human condition", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 1:\n\nGLOUCESTER: As flies to wanton boys, are we to the gods;\nThey kill us for their sport.\n\nWhat view of the gods and of human agency does this image express, and how does it fit the play's tragic vision? (4 marks)", "options": [], "answer": "1 mark — the gods are 'wanton boys': careless, playful and not just, so divine authority is emptied of moral purpose.\n1 mark — humans are flies: small, disposable and without control over their fate.\n1 mark — the image reverses Gloucester's earlier confidence that the gods are just, and it answers Lear's repeated appeals to the heavens.\n1 mark — the play leaves the question open: the innocent die (Cordelia) while the guilty partly escape, so the ending refuses to console the audience with divine justice.", "explanation_en": "4 marks: ① gods are portrayed as unjust ② humans are like flies (powerless) ③ this contrasts with Gloucester's earlier belief that 'the gods are just' and responds to Lear's appeal to the gods ④ the ending (Cordelia's death) leaves the 'moral order' in question, highlighting the tragic nature.", "source": "King Lear Act 4 Scene 1 (quote: Shakespeare, King Lear 4.1); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that the gods are 'wanton boys' — careless, playful and not just — so divine authority is emptied of moral purpose", "m": 1}, {"id": "c2", "t": "Explains that humans are flies: small, disposable and without control over their fate", "m": 1}, {"id": "c3", "t": "Explains that the image reverses Gloucester's earlier confidence that the gods are just, and answers Lear's repeated appeals to the heavens", "m": 1}, {"id": "c4", "t": "Explains that the play leaves the question open, since the innocent Cordelia dies while the guilty partly escape, so the ending refuses the consolation of divine justice", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the gods are 'wanton boys' — careless, playful and not just — so divine authority is emptied of moral purpose", "m": 1}, {"id": "c2", "t": "Explains that humans are flies: small, disposable and without control over their fate", "m": 1}, {"id": "c3", "t": "Explains that the image reverses Gloucester's earlier confidence that the gods are just, and answers Lear's repeated appeals to the heavens", "m": 1}, {"id": "c4", "t": "Explains that the play leaves the question open, since the innocent Cordelia dies while the guilty partly escape, so the ending refuses the consolation of divine justice", "m": 1}], "weak": false}, {"id": "eng-021", "topic": "King Lear · Cordelia's death and poetic justice", "difficulty": "hard", "type": "short", "stem": "Section 1 — King Lear, Act 5 Scene 3:\n\nLEAR: She's gone for ever!\nI know when one is dead, and when one lives;\nShe's dead as earth. ...\nDo you see this? Look on her, look, her lips,\nLook there, look there!\n\nWhy does Cordelia's death make the ending hard to read as poetic justice? (5 marks)", "options": [], "answer": "1 mark — poetic justice would reward Cordelia's loyalty and punish the guilty in proportion, restoring a moral order.\n1 mark — instead the innocent daughter is hanged on Edmund's order, and the reprieve arrives too late to save her.\n1 mark — Lear's hard-won sight is rewarded only with her corpse: insight and loss arrive at the same moment.\n1 mark — his final 'Look there, look there!' is ambiguous — he may die believing she lives — so the audience is denied a clear consolation.\n1 mark — the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just.", "explanation_en": "5 marks are: defining poetic justice → innocent people are killed and rescue comes too late → awareness and loss happen simultaneously → the final lines are ambiguous and offer no comfort → order is not restored, so the sense of 'injustice' is intentional. When answering, you must first define 'what is poetic justice', or you won't have a standard for comparison.", "source": "King Lear Act 5 Scene 3 (quote: Shakespeare, King Lear 5.3); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 5, "criteria": [{"id": "c1", "t": "Defines poetic justice as the reward of loyalty and the punishment of the guilty in proportion, restoring a moral order", "m": 1}, {"id": "c2", "t": "Explains that the innocent daughter is hanged on Edmund's order and the reprieve arrives too late to save her", "m": 1}, {"id": "c3", "t": "Explains that Lear's hard-won sight is rewarded only with her corpse, so insight and loss arrive at the same moment", "m": 1}, {"id": "c4", "t": "Explains that his final 'Look there, look there!' is ambiguous (he may die believing she lives), so the audience is denied clear consolation", "m": 1}, {"id": "c5", "t": "Explains that the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Defines poetic justice as the reward of loyalty and the punishment of the guilty in proportion, restoring a moral order", "m": 1}, {"id": "c2", "t": "Explains that the innocent daughter is hanged on Edmund's order and the reprieve arrives too late to save her", "m": 1}, {"id": "c3", "t": "Explains that Lear's hard-won sight is rewarded only with her corpse, so insight and loss arrive at the same moment", "m": 1}, {"id": "c4", "t": "Explains that his final 'Look there, look there!' is ambiguous (he may die believing she lives), so the audience is denied clear consolation", "m": 1}, {"id": "c5", "t": "Explains that the deaths of Lear and Cordelia withhold the comfort of a restored order, which is why the ending feels unbearable rather than just", "m": 1}], "weak": false}, {"id": "eng-022", "topic": "King Lear · 'I am not ague-proof' and change", "difficulty": "easy", "type": "short", "stem": "Section 1 — King Lear, Act 4 Scene 6:\n\nLEAR: They told me I was every thing; 'tis a lie, I am not ague-proof.\n\nWhat does this line show about Lear's changed identity? (4 marks)", "options": [], "answer": "1 mark — he recalls being told he was 'everything': flattery had built a false, unlimited self.\n1 mark — 'tis a lie' is an explicit act of self-correction, spoken by the king about his own former image.\n1 mark — 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man.\n1 mark — the line therefore shows loss producing a truer identity, not simply destroying one, which is central to the play's ending.", "explanation_en": "4 marks: ① being flattered into 'omnipotence' ② self-denial ③ confirming human vulnerability through physical weakness (ague = malaria) ④ thus 'loss' also brings a more realistic self. The last mark is at the theme level, don't miss it.", "source": "King Lear Act 4 Scene 6 (quote: Shakespeare, King Lear 4.6); Section 1 · King Lear short answer — exam format per LEEDER 10ENGB Homepage", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that he recalls being told he was 'every thing', so flattery had built a false, unlimited self", "m": 1}, {"id": "c2", "t": "Explains that describing that image as a lie ('tis a lie) is an explicit act of self-correction, spoken by the king about his own former image", "m": 1}, {"id": "c3", "t": "Explains that 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man", "m": 1}, {"id": "c4", "t": "Explains that the line shows loss producing a truer identity rather than simply destroying one, which is central to the play's ending", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that he recalls being told he was 'every thing', so flattery had built a false, unlimited self", "m": 1}, {"id": "c2", "t": "Explains that describing that image as a lie ('tis a lie) is an explicit act of self-correction, spoken by the king about his own former image", "m": 1}, {"id": "c3", "t": "Explains that 'not ague-proof' means his body is as vulnerable as anyone's, so he now defines himself as a mortal man", "m": 1}, {"id": "c4", "t": "Explains that the line shows loss producing a truer identity rather than simply destroying one, which is central to the play's ending", "m": 1}], "weak": false}, {"id": "eng-023", "topic": "Comparative essay · Judging a thesis", "difficulty": "easy", "type": "mcq", "stem": "Section 2 asks: 'How do Lee and Parker expose systemic racism?' Which thesis best answers the question?", "options": ["Lee's novel is more effective than Parker's film because a novel can explain what characters are thinking, while a film can only show what they do.", "Parker relies on music and camera angles to create meaning, while Lee relies on first-person narration and on dialogue between the characters.", "Both Lee and Parker show racism as a system that shields the guilty, but Lee builds a child's slow awareness while Parker forces the viewer to watch.", "Both texts show that racism is a serious problem in America and that it damages the lives of ordinary people in small towns across the country."], "answer": 2, "explanation_en": "A good thesis should: cover two texts, provide a controversial argument (racism is 'an institution that protects the guilty'), and forecast the comparison angle (child's perspective vs forced watching). The other options are just general discussions, evaluating merits, and listing techniques without an argument.", "source": "Section 2 · Comparative essay — thesis and introduction (10ENGA unit overview; LEEDER 10ENGB exam outline)", "weak": false}, {"id": "eng-024", "topic": "Comparative essay · Function of topic sentences", "difficulty": "easy", "type": "mcq", "stem": "What is the main job of a topic sentence in a comparative body paragraph?", "options": ["To provide a quotation from each text and explain what happens in that scene", "To summarise the plot of both texts so the reader can follow the argument", "To introduce the paragraph by naming the text and the technique it will discuss", "To state a comparative claim about both texts that answers part of the essay question"], "answer": 3, "explanation_en": "A topic sentence = the comparative argument this paragraph aims to prove, which must cover both texts and respond to the question. 'To introduce the paragraph by naming the text and the technique it will discuss' is just a signpost, not an argument. 'To provide a quotation from each text and explain what happens in that scene' is evidence. 'To summarise the plot of both texts so the reader can follow the argument' is just retelling.", "source": "Section 2 · Comparative essay — body paragraph structure (TKAMB BP1/BP2/BP3 scaffolds)", "weak": false}, {"id": "eng-025", "topic": "Comparative essay · Writing a thesis", "difficulty": "medium", "type": "short", "stem": "Write a thesis statement for the question: 'How do Lee and Parker represent the failure of justice?' (4 marks)", "options": [], "answer": "Model answer: 'Lee and Parker both show justice failing because the community closes ranks around its own, yet Lee traces that failure through a child's gradual recognition while Parker makes the viewer complicit in seeing it.'\n1 mark — names both composers/texts.\n1 mark — makes one arguable claim about the failure of justice.\n1 mark — signals the comparative angle (how the two composers differ in method).\n1 mark — uses the question's key term ('failure of justice') rather than drifting into a general statement about racism.", "explanation_en": "To score well, you need to cover four key points: both texts are discussed, a debatable argument is presented, comparative angles are explored, and the question's keywords are addressed. Simply stating that 'both texts show injustice' without comparison will only get you 2 points.", "source": "Section 2 · Comparative essay — thesis writing (LEEDER 10ENGB exam outline: comparative essay, 20 marks)", "marks": 4, "criteria": [{"id": "c1", "t": "Names both composers/texts (Lee and Parker)", "m": 1}, {"id": "c2", "t": "Makes one arguable claim about the failure of justice", "m": 1}, {"id": "c3", "t": "Signals the comparative angle, showing how the two composers differ in method", "m": 1}, {"id": "c4", "t": "Uses the question's key term 'failure of justice' rather than drifting into a general statement about racism", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names both composers/texts (Lee and Parker)", "m": 1}, {"id": "c2", "t": "Makes one arguable claim about the failure of justice", "m": 1}, {"id": "c3", "t": "Signals the comparative angle, showing how the two composers differ in method", "m": 1}, {"id": "c4", "t": "Uses the question's key term 'failure of justice' rather than drifting into a general statement about racism", "m": 1}], "weak": false}, {"id": "eng-026", "topic": "Comparative essay · Integrating quotations", "difficulty": "medium", "type": "mcq", "stem": "You want to use one line from the supplied extract in a body paragraph. Which approach integrates it most effectively?", "options": ["Quote only the few words that carry the technique, then analyse how they shape meaning in the whole text.", "Paraphrase the extract without quoting, because quotations take up too much of your word count.", "Quote the line, then say that it shows the theme of justice without explaining how the words create that effect.", "Quote the whole extract so the marker can see you have read it, then explain what it means."], "answer": 0, "explanation_en": "Integration means embedding short quotes into your own sentences, analysing how the language creates meaning, and linking it back to the whole text and question. Copying a whole paragraph (0 points) is just repetition, only paraphrasing (1 point) loses language evidence, and quoting without analysis (3 points) won't get you analysis marks.", "source": "Section 2 · Comparative essay — integrating the supplied extract (LEEDER 10ENGB exam outline, 20 marks)", "weak": false}, {"id": "eng-027", "topic": "Comparative essay · Using the supplied extract", "difficulty": "medium", "type": "short", "stem": "Section 2 requires you to integrate the extract you are given. Explain what this means in practice, and what you should avoid. (4 marks)", "options": [], "answer": "1 mark — quote selectively: a few words that carry the technique or idea you need.\n1 mark — analyse the wording itself (connotation, syntax, imagery) and link it explicitly to the question.\n1 mark — connect the extract to the rest of the text, so the extract is a starting point rather than the whole evidence.\n1 mark — avoid long quotation, mentioning the extract only in the introduction, or turning the extract into plot summary.", "explanation_en": "The four scoring points are: quote → analyse language → link to whole text → avoid 'copying a whole paragraph/only mentioning at the start/just retelling the plot'. This is where Section 2 students often lose marks, as the marking criteria clearly state 'integrate the extract'.", "source": "Section 2 · Comparative essay — extract integration (LEEDER 10ENGB exam outline)", "marks": 4, "criteria": [{"id": "c1", "t": "Explains that integration means quoting selectively, using a few words that carry the technique or idea needed", "m": 1}, {"id": "c2", "t": "Explains that it means analysing the extract's wording (connotation, syntax, imagery) and linking it explicitly to the question", "m": 1}, {"id": "c3", "t": "Explains that the extract must be connected to the rest of the text, so it is a starting point rather than the whole evidence", "m": 1}, {"id": "c4", "t": "Identifies what to avoid: long quotation, mentioning the extract only in the introduction, or turning it into plot summary", "m": 1} const AUTO_STOP = ("the a an of and or to in on for with that this these those is are was were be been being " +
  "as at by from it its their they them we you your our not no but if then than so such can could may might " +
  "will would should must have has had do does did which who whom what when where why how all any more most " +
  "other some only own same very just also into over under about after before between through during").split(" ");
const AUTO_STOP_SET = {};
AUTO_STOP.forEach(function(w){ AUTO_STOP_SET[w] = 1; });
function autoStem(w){
  return String(w||"").toLowerCase()
    .replace(/'s$/,"").replace(/ies$/,"y").replace(/ing$/,"").replace(/ed$/,"")
    .replace(/es$/,"").replace(/s$/,"");
}
function autoKeywords(text){
  var raw = String(text||"").toLowerCase().split(/[^a-z'-]+/);
  var out = [];
  raw.forEach(function(w){
    if(w.length < 4) return;
    if(AUTO_STOP_SET[w]) return;
    var st = autoStem(w);
    if(st.length < 3) return;
    if(out.indexOf(st) < 0) out.push(st);
  });
  return out;
}
function autoScore(pointText, answerText){
  var kw = autoKeywords(pointText);
  if(!kw.length) return {hit:false, ratio:0, matched:0, total:0, missing:[]};
  var mine = {};
  String(answerText||"").toLowerCase().split(/[^a-z'-]+/).forEach(function(w){ mine[autoStem(w)] = 1; });
  var matched = 0, missing = [];
  kw.forEach(function(k){ if(mine[k]) matched++; else missing.push(k); });
  var ratio = matched / kw.length;
  return {hit: ratio >= 0.5, ratio: ratio, matched: matched, total: kw.length, missing: missing.slice(0,4)};
}

}

  function seedRnd(str){
