<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学 P · 10 年级 · 复习测验</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --fg:#e8ecf1; --dim:#9aa4b2;
  --line:#2a2f3a; --accent:#5b8cff; --ok:#2fbf71; --bad:#ff5f56; --warn:#f5a623;
}
@media (prefers-color-scheme: light) {
  :root{--bg:#f6f7f9;--card:#fff;--card2:#f0f2f5;--fg:#1b1f26;--dim:#5f6b7a;--line:#e2e6ec;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.bar .meta{color:var(--dim);font-size:13px}
.spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;
 font-size:12px;color:var(--dim)}
.progress{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{max-width:820px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.chip{padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.chip.easy{color:#2fbf71;border-color:#2fbf7144}
.chip.medium{color:#f5a623;border-color:#f5a62344}
.chip.hard{color:#ff5f56;border-color:#ff5f5644}
.stem{font-size:17px;line-height:1.6;margin:6px 0 16px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
 background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:11px;
 padding:12px 14px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:var(--bg);border:1px solid var(--line);
 display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card2))}
.opt.correct .k{background:var(--ok);color:#04170c;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card2))}
.opt.wrong .k{background:var(--bad);color:#1a0403;border-color:var(--bad)}
textarea{width:100%;min-height:96px;background:var(--card2);color:var(--fg);border:1px solid var(--line);
 border-radius:11px;padding:12px;font:inherit;resize:vertical}
.exp{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--card2);
 border-radius:0 10px 10px 0;font-size:14.5px;display:none}
.exp.show{display:block}
.exp b{color:var(--accent)}
.src{margin-top:8px;color:var(--dim);font-size:12px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;
 font:inherit;font-weight:600;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.btn:disabled{opacity:.45;cursor:default}
.done h2{margin:0 0 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:110px}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{color:var(--dim);font-size:12px}
.wronglist{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
.wronglist li{margin:4px 0}
footer{text-align:center;color:var(--dim);font-size:12px;padding:26px 16px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

.chip.warn{border-color:#f5a62366;color:#f5a623}
.muted{color:var(--dim);font-size:13px}
.pts{display:grid;gap:8px;margin-top:12px}
.pt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.pt.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card2))}
.pt input{margin-top:3px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--ok)}
.pt span{flex:1;min-width:0}
.pt em{color:var(--dim);font-style:normal;font-size:12px;white-space:nowrap}
.mine{margin-top:14px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
.mine div{margin-top:6px;white-space:pre-wrap;color:var(--dim)}
.fullans{margin-top:10px;font-size:14px}
.fullans summary{cursor:pointer;color:var(--accent)}
.fullans div{margin-top:8px;white-space:pre-wrap;color:var(--dim)}
.setup{max-width:760px;margin:0 auto}
.setup-head{margin:4px 0 20px}
.setup-head h2{margin:0 0 6px;font-size:22px}
.setup-head p{margin:0;font-size:13.5px;line-height:1.6}
.setup-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.setup-label{font-size:13px;color:var(--dim);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pick{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14px;min-width:0}
.pick input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--accent)}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick em{color:var(--dim);font-style:normal;font-size:12px;flex:0 0 auto}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:10px;
 padding:10px 0;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card2));font-weight:600}
.setup-foot{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:4px}
.setup-foot .sum{color:var(--dim);font-size:14px}
.setup-foot .sum b{color:var(--fg);font-size:18px}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;padding:24px}
.nav-overlay.on{display:block}
.nav-box{max-width:720px;margin:6vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.nav-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;max-height:56vh;overflow:auto}
.nav-grid button{padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);
 color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.nav-grid button.ok{border-color:var(--ok);color:var(--ok)}
.nav-grid button.bad{border-color:var(--bad);color:var(--bad)}
.nav-grid button.part{border-color:var(--warn);color:var(--warn)}
html,body{max-width:100%;overflow-x:hidden}
main{display:flex;flex-direction:column}
.card{flex:0 0 auto}
.chips{opacity:.92}
.chip{font-size:11px;padding:2px 8px}
.stem{font-size:19px;line-height:1.62;font-weight:500;margin:12px 0 20px}
.opts{gap:12px}
.opt{padding:14px 16px;font-size:15.5px;position:relative;border-left-width:3px}
.opt .txt{flex:1;min-width:0}
.opt .mk{margin-left:8px;font-weight:700}
.opt.correct{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;align-items:center;
 padding:10px max(16px,calc((100vw - 860px)/2)) calc(10px + env(safe-area-inset-bottom));
 background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.actionbar .spacer{flex:1}
main{padding-bottom:104px!important}
footer{padding-bottom:96px}
.sfxbtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
 padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.prof-tools{margin-top:10px}
/* 提交防呆遮罩 */
.submit-mask{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
 background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px);
 opacity:0;pointer-events:none;transition:.2s;cursor:wait}
.submit-mask.on{opacity:1;pointer-events:auto}
.submit-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 34px;
 text-align:center;min-width:260px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.spinner{width:26px;height:26px;margin:0 auto 14px;border:2px solid var(--line2);
 border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.submit-txt{font-size:13.5px;color:var(--dim);letter-spacing:.02em;min-height:20px}
.submit-txt b{color:var(--fg);font-weight:600}
/* 题目排版：更长行高，缓解密集阅读 */
.stem{font-size:16.5px;line-height:1.78}
.opt .txt{line-height:1.7}
.lb-fab{position:fixed;right:16px;bottom:84px;z-index:30;display:none;align-items:center;gap:6px;
 background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12.5px;
 color:var(--fg);cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.lb-fab b{color:var(--warn)}
.lb-overlay{position:fixed;inset:0;z-index:70;background:rgba(5,7,11,.7);backdrop-filter:blur(8px);
 display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.22s}
.lb-overlay.on{opacity:1;pointer-events:auto}
.lb-sheet{width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--line);
 border-radius:20px 20px 0 0;padding:18px 18px 20px;transform:translateY(28px);transition:.28s cubic-bezier(.2,.8,.2,1)}
.lb-overlay.on .lb-sheet{transform:translateY(0)}
.lb-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.lb-head b{font-size:16px}
.lb-tabs{display:flex;gap:6px;margin-bottom:16px}
.lb-tabs button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:9px;
 padding:7px 0;font:inherit;font-size:12.5px;cursor:pointer}
.lb-tabs button.on{color:var(--fg);border-color:var(--accent);
 background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:8px;align-items:end;margin-bottom:18px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.pod.p1{padding-top:22px;padding-bottom:18px}
.pod .av{width:42px;height:42px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;
 justify-content:center;font-weight:700;font-size:15px}
.pod .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pod.p1{border-color:#F59E0B;animation:breathe 2.8s ease-in-out infinite}
.pod.p1 .av{background:#F59E0B;color:#1a1206}
.pod.p2{border-color:#94A3B8}.pod.p2 .av{background:#94A3B8;color:#10161b}
.pod.p3{border-color:#B45309}.pod.p3 .av{background:#B45309;color:#fce7d0}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px #F59E0B inset,0 0 16px rgba(245,158,11,.22)}
 50%{box-shadow:0 0 0 1px #F59E0B inset,0 0 34px rgba(245,158,11,.5)}}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.lb-row .rk{width:22px;color:var(--dim);font-variant-numeric:tabular-nums}
.lb-row.me{color:var(--accent);font-weight:600}
.lb-count{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.lb-refresh{display:none;margin:0 0 12px;padding:9px 14px;border-radius:10px;text-align:center;
 font-size:12.5px;color:var(--fg);background:color-mix(in srgb,var(--accent) 16%,var(--card));
 border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));cursor:pointer}
.lb-refresh.on{display:block}
.lb-near{margin:4px 0 10px;padding:4px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.near-h{font-size:11px;color:var(--dim);letter-spacing:.06em;padding:6px 4px 2px}
.lb-time{font-size:11px;color:var(--dim);margin-left:8px;font-variant-numeric:tabular-nums}
.lb-row.fresh{animation:freshGlow 1.6s ease-out}
@keyframes freshGlow{0%{box-shadow:inset 0 0 14px color-mix(in srgb,var(--accent) 55%,transparent)}
 100%{box-shadow:inset 0 0 0 transparent}}
.pod .pl{font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.lb-self{border-top:2px solid var(--accent)!important;margin-top:10px;padding:11px 8px;display:flex;gap:12px;align-items:center;
 font-size:13.5px;font-weight:600;background:color-mix(in srgb,var(--accent) 13%,var(--bg));
 border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.xp-toast{position:fixed;right:18px;bottom:92px;z-index:60;background:var(--card);border:1px solid var(--line);
 color:var(--dim);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
 opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.xp-toast.ok{border-color:var(--ok);color:var(--ok)}
.xp-toast.up{opacity:1;transform:translateY(0)}
.profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 22px}
.prof-main{display:flex;gap:16px;align-items:center}
.lv{width:64px;height:64px;border-radius:18px;background:color-mix(in srgb,var(--accent) 16%,var(--card2));
 display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 64px}
.lvnum{font-size:24px;font-weight:700;color:var(--accent);line-height:1}
.lvlab{font-size:10px;color:var(--dim);margin-top:2px}
.prof-body{flex:1;min-width:0}
.prof-line{display:flex;gap:10px;align-items:baseline;font-size:14px}
.prof-line b{font-size:17px}
.xpbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prof-meta{font-size:12px;color:var(--dim)}
.prof-meta b{color:var(--fg)}
.badges{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;opacity:.45}
.badge.on{opacity:1;border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.badge .bi{display:block;font-size:18px;line-height:1.3}
.badge .bn{display:block;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){ .badges{grid-template-columns:repeat(4,1fr)} }
.panel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
.panel-h{font-size:12px;color:var(--dim);margin-bottom:10px}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1 0 auto}
footer{margin-top:auto}
main,.card,.setup{max-width:100%}
.opt,.pt,.pick,.mine,.exp{min-width:0}
.stem,.opt span,.pt span{overflow-wrap:anywhere}
.actions{flex-wrap:wrap}
footer{padding:22px 14px 30px;line-height:1.8}

@media (max-width:720px){
  #scorepill{display:none}
  .bar a.pill{display:none}
  .bar{flex-wrap:wrap;row-gap:8px}
  .bar h1{flex:1 1 100%;font-size:16px;margin:0}
  .bar .spacer{display:none}
  #restart{display:none}
  #grid,#exam{padding:6px 10px!important;font-size:12px!important}
  .progress{margin-top:6px}
}
@media (max-width:560px){
  .bar{gap:8px}
  .bar h1{font-size:17px;line-height:1.3}
  .bar .meta{display:none}
  .pill{padding:3px 9px;font-size:11px}
  main{padding:12px 10px 84px}
  .card{padding:14px;border-radius:12px}
  .chips{gap:6px;margin-bottom:10px}
  .chip{font-size:11px;padding:1px 7px}
  .stem{font-size:15.5px;line-height:1.6;margin:2px 0 14px}
  .opt{padding:12px;font-size:15px;line-height:1.5;gap:10px}
  .opt .k{flex:0 0 22px;height:22px;font-size:11px}
  .actions{gap:8px;margin-top:14px}
  .actions .btn{padding:10px 12px;font-size:14px}
  .stem{font-size:17px;margin:10px 0 16px}
  .actionbar #prev,.actionbar #next{flex:1 1 0}
  .actionbar #finish{flex:0 0 auto}
  textarea{font-size:15px}
  .picks{grid-template-columns:1fr}
  .setup-head h2{font-size:20px}
  .setup-block{padding:14px}
  .seg{gap:6px}
  .seg button{padding:12px 0;font-size:13px}
  .setup-foot{flex-direction:column;align-items:stretch;gap:10px}
  .setup-foot .sum{text-align:center}
  .setup-foot .btn{width:100%;padding:12px 0;font-size:15px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{min-width:0;padding:10px 12px}
  .stat b{font-size:18px}
  footer{font-size:11px;padding:18px 10px 26px;overflow-wrap:anywhere}
}

</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>数学 P · 10 年级</h1>
    <span class="meta">10MATP 26 · 43 题 · Maths 11/25 P3–P4</span>
    <span class="spacer"></span>
    <span class="pill" id="counter">0 / 43</span>
    <a class="pill" style="text-decoration:none" href="index.html">← 科目列表</a>
    <span class="pill" id="scorepill">✓ 0 ✗ 0</span>
    <button class="btn ghost" id="grid" style="padding:5px 10px;font-size:13px">题号</button>
    <button class="btn ghost" id="exam" style="padding:5px 10px;font-size:13px">考试模式</button>
    <span class="pill" id="clock" style="display:none"></span>
    <button class="btn ghost" id="restart" style="padding:5px 10px;font-size:13px">重来</button>
  </div>
  <div class="bar"><div class="progress" style="flex:1"><i id="pbar"></i></div></div>
</header>
<main id="app"></main>
<div id="submitMask" class="submit-mask"><div class="submit-card">
  <div class="spinner"></div><div class="submit-txt" id="submitTxt">正在上传试卷…</div></div></div>
<div id="lbFab" class="lb-fab"></div>
<div id="lbOverlay" class="lb-overlay"><div class="lb-sheet">
  <div class="lb-head"><b>今日榜单</b><span class="muted" id="lbDay"></span><span class="lb-count" id="lbCount"></span>
    <span style="flex:1"></span><button class="btn ghost" id="lbClose" style="padding:4px 10px;font-size:12px">关闭</button></div>
  <div class="lb-tabs">
    <button data-sort="pct" class="on">正确率</button>
    <button data-sort="score">答对题数</button>
    <button data-sort="speed">用时</button>
  </div>
  <div class="lb-refresh" id="lbRefresh"></div>
  <div id="lbBody"></div>
</div></div>
<div id="nav" class="nav-overlay"><div class="nav-box">
  <div class="nav-head"><b>题号</b><span class="muted">绿=对 红=错 橙=半对 灰=未做</span><button class="btn ghost" id="navclose" style="margin-left:auto;padding:4px 10px">关闭</button></div>

<script>
const DATA = {"slug": "matp", "title": "数学 P · 10 年级", "examMin": 80, "questions": [{"id": "matp-001", "topic": "金融数学 · 加班工资", "difficulty": "easy", "type": "mcq", "stem": "Tomas earns $28 per hour for the first 38 hours he works each week. Any hours beyond 38 are paid at time-and-a-half. Last week he worked 45 hours. What was his total pay for the week?", "options": ["$1,358", "$1,890", "$1,260", "$1,456"], "answer": 0, "explanation": "前 38 小时 38×28=$1,064，超时 45−38=7 小时按 1.5 倍时薪 $42 计，7×42=$294，合计 $1,358。常见错误是 45 小时全按基本时薪得 $1,260，或把加班时薪算成双倍得 $1,456。", "source": "Topic1 Interest and Depreciation.pdf · 1-01 Earning an income", "weak": false}, {"id": "matp-002", "topic": "金融数学 · 复利（按月）", "difficulty": "medium", "type": "mcq", "stem": "Sophie deposits $1,200 into a savings account that earns 5% per annum, compounded monthly. How much will she have in the account after 3 years?", "options": ["$1,389.15", "$1,393.77", "$1,380.00", "$1,458.61"], "answer": 1, "explanation": "按月复利要把利率和期数同时换成月：R=0.05/12，n=3×12=36，A=1200(1+0.05/12)^36≈$1,393.77。用单利得 $1,380，把 5% 当成年利率只复 3 次得 $1,389.15，都是常见错误。", "source": "1-04_ Compound Interest.pdf · A = P(1 + R)^n（R 为每期利率）", "weak": false}, {"id": "matp-003", "topic": "金融数学 · 折余折旧", "difficulty": "medium", "type": "short", "stem": "A delivery van is bought for $42,000. It depreciates at 15% per annum using the reducing-balance formula A = P(1 − R)^n. Find (a) its value after 4 years, correct to the nearest dollar, and (b) the total amount it has depreciated over those 4 years.", "options": [], "answer": "(a) A = 42,000 × (1 − 0.15)^4 = 42,000 × 0.85^4 = $21,924. (b) Depreciation = 42,000 − 21,924 = $20,076.", "explanation": "减少率折旧是每年乘 0.85，共 4 次，不是 42,000×(1−0.15×4)。用直线法（每年固定减 $6,300）会得 $16,800，那是另一种模型。", "source": "1-07_ Depreciation.pdf · A = P(1 − R)^n（reducing balance）", "points": [{"t": "(a) A = 42,000 × (1 − 0.15)^4 = 42,000 × 0.85^4 = $21,924", "m": 1}, {"t": "(b) Depreciation = 42,000 − 21,924 = $20,076", "m": 1}], "weak": false}, {"id": "matp-004", "topic": "代数 · 指数律（幂的乘方）", "difficulty": "easy", "type": "mcq", "stem": "Simplify (3a⁴)².", "options": ["6a⁶", "9a⁶", "9a⁸", "6a⁸"], "answer": 2, "explanation": "括号内每一项都要乘方：3²=9，指数相乘 4×2=8，所以是 9a⁸。只把系数 3 错写成 6，或把 4×2 误算成 6，是两个最常见的错。", "source": "Algebra Topic test + Solutions.pdf · Part A Q12 · 4-01_ Index Laws", "weak": false}, {"id": "matp-005", "topic": "代数 · 单项式乘法", "difficulty": "easy", "type": "mcq", "stem": "Simplify 2m × 5m p × 3n.", "options": ["30m np", "30m³np", "10m²np", "30m²np"], "answer": 3, "explanation": "系数 2×5×3=30；m×m=m²（指数相加），p 和 n 各出现一次，结果是 30m²np。把 m×m 当成 2m 会得 10m²np，当成 m³ 则指数加错。", "source": "Topic2 Algebra.pdf · 4-01 The index laws", "weak": false}, {"id": "matp-006", "topic": "代数 · 代数分式约分", "difficulty": "medium", "type": "mcq", "stem": "Simplify (6x²y) ÷ (9xy³).", "options": ["2x / (3y²)", "2x / (3y³)", "2y² / (3x)", "3x / (2y²)"], "answer": 0, "explanation": "系数约分 6/9=2/3；同底数相除指数相减：x²÷x=x，y÷y³=1/y²。所以是 2x/(3y²)。把 y 的指数写成 3，或忘记约分系数，都是常见错误。", "source": "4-03_ Multiplying and dividing algebraic fractions.pdf", "weak": false}, {"id": "matp-007", "topic": "代数 · 二项式展开", "difficulty": "medium", "type": "mcq", "stem": "Expand and simplify (2x − 5)(3x + 7).", "options": ["6x² + 21x − 35", "6x² − x − 35", "6x² + x − 35", "6x² − 29x − 35"], "answer": 1, "explanation": "逐项相乘得 6x² + 14x − 15x − 35 = 6x² − x − 35。中间项 14x − 15x = −x，若把 −15x 误写成 +15x 就会得到 6x² + 29x 一类的错误。", "source": "4-05_ Expanding Binomial Products.pdf · Algebra Topic test + Solutions.pdf Q24c", "weak": false}, {"id": "matp-008", "topic": "代数 · 完全平方中项", "difficulty": "medium", "type": "mcq", "stem": "If (7g + 3)² = 49g² + hg + 9, what is the value of h?", "options": ["84", "14", "42", "21"], "answer": 2, "explanation": "完全平方的中项是 2×7g×3 = 42g，所以 h = 42。只算 7×3 = 21（漏掉公式里的 2）是最常见的错误。", "source": "Algebra Topic test + Solutions.pdf · Part A Q14（perfect squares）", "weak": false}, {"id": "matp-009", "topic": "代数 · 因式分解", "difficulty": "medium", "type": "short", "stem": "Factorise each expression fully. (a) 12a²b − 21ab²  (b) x² + 7x + 10", "options": [], "answer": "(a) 3ab(4a − 7b)   (b) (x + 5)(x + 2)", "explanation": "(a) 取最大公因式：12 与 21 的 HCF 是 3，字母取公有因子 a、b，得 3ab；括号内 3ab×4a=12a²b、3ab×(−7b)=−21ab²。(b) 找和为 7、积为 10 的两个数，即 5 和 2。", "source": "4-06 Factorising monic quadratics.pdf · 2025 BBHS 10 (5.2) T2 Q14", "points": [{"t": "(a) 3ab(4a − 7b)   (b) (x + 5)(x + 2)", "m": 1}], "weak": false}, {"id": "matp-010", "topic": "方程 · 一元一次（两边有未知数）", "difficulty": "easy", "type": "mcq", "stem": "Solve 9x + 10 = 7x − 6.", "options": ["x = 8", "x = 2", "x = −2", "x = −8"], "answer": 3, "explanation": "两边同减 7x、同减 10，得 2x = −16，故 x = −8。常见错误是把 10 移项时忘记变号（得 −2），或把 −16 ÷ 2 算成 +8。", "source": "Topic 2 Equations and Inequality.pdf · 6-01 Equations（Example 1c）", "weak": false}, {"id": "matp-011", "topic": "不等式 · 除以负数变号", "difficulty": "hard", "type": "mcq", "stem": "Solve the inequality −3(x − 2) ≥ 15.", "options": ["x ≤ −3", "x ≤ 3", "x ≥ 3", "x ≥ −3"], "answer": 0, "explanation": "展开得 −3x + 6 ≥ 15，即 −3x ≥ 9；两边同除以 −3 时不等号必须反向，得 x ≤ −3。可以用 x = −4 代回检验：−3(−6)=18 ≥ 15 成立。", "source": "Topic 2 Equations and Inequality.pdf · 6-07 Solving inequalities（除负数要 reverse the sign）", "weak": false}, {"id": "matp-012", "topic": "方程 · 含分式的方程", "difficulty": "medium", "type": "short", "stem": "Solve x/3 − (x − 2)/4 = 2.", "options": [], "answer": "Multiply every term by 12: 4x − 3(x − 2) = 24, so 4x − 3x + 6 = 24 and x = 18.", "explanation": "分母 3 和 4 的最小公倍数是 12。第二项前的负号要乘进括号，变成 +6；若写成 −6 会得到 x = 6，这是最常见的失分点。", "source": "Topic 2 Equations and Inequality.pdf · 6-02 Equations with algebraic fractions", "points": [{"t": "Multiply every term by 12: 4x − 3(x − 2) = 24, so 4x − 3x + 6 = 24 and x = 18.", "m": 1}], "weak": false}, {"id": "matp-013", "topic": "联立方程 · 消元法", "difficulty": "easy", "type": "mcq", "stem": "Solve the simultaneous equations 5x + 2y = 19 and 3x − 2y = 5.", "options": ["x = 3, y = −2", "x = 3, y = 2", "x = 2, y = 3", "x = 4, y = −0.5"], "answer": 1, "explanation": "两式相加消去 y：8x = 24，x = 3；代回第一式得 2y = 19 − 15 = 4，y = 2。干扰项 (4, −0.5) 只满足第一个方程，代回第二个即可排除。", "source": "Topic 2 Simultaneous Equations.pdf · 9-02 The elimination method", "weak": false}, {"id": "matp-014", "topic": "联立方程 · 应用建模", "difficulty": "hard", "type": "short", "stem": "At the school canteen, 3 sandwiches and 2 drinks cost $19.50, while 2 sandwiches and 3 drinks cost $18.00. Find the cost of one sandwich and one drink.", "options": [], "answer": "Solve 3s + 2d = 19.50 and 2s + 3d = 18.00 simultaneously: 5s = 22.50, so s = $4.50 and d = $3.00.", "explanation": "先列两个方程，再消元（第一式×3 减第二式×2 得 5s = 22.50）。只用一个条件无法定出两个价格；代回检验 3×4.50+2×3 = $19.50 正确。", "source": "Topic 2 Simultaneous Equations.pdf · 9-04 Simultaneous equations problems", "points": [{"t": "Solve 3s + 2d = 19.50 and 2s + 3d = 18.00 simultaneously: 5s = 22.50, so s = $4.50 and d = $3.00.", "m": 1}], "weak": false}, {"id": "matp-015", "topic": "坐标几何 · 两点距离", "difficulty": "easy", "type": "mcq", "stem": "Find the distance between the points (2, −1) and (5, 3).", "options": ["7", "√7", "5", "25"], "answer": 2, "explanation": "d = √[(5−2)² + (3−(−1))²] = √(9+16) = √25 = 5。忘记开方会得 25，把两段差直接相加会得 7。", "source": "Topic 1 Coordinate Geometry.pdf · 2-01 Length, midpoint and gradient of an interval", "weak": false}, {"id": "matp-016", "topic": "坐标几何 · 斜率", "difficulty": "easy", "type": "mcq", "stem": "Find the gradient of the line passing through (2, 5) and (6, −3).", "options": ["2", "−1/2", "1/2", "−2"], "answer": 3, "explanation": "m = (y₂−y₁)/(x₂−x₁) = (−3−5)/(6−2) = −8/4 = −2。上面减下面的顺序颠倒会得 −1/2；漏写负号则得 2。", "source": "Topic 1 Coordinate Geometry.pdf · 2-01 Length, midpoint and gradient of an interval", "weak": false}, {"id": "matp-017", "topic": "坐标几何 · 求直线方程", "difficulty": "medium", "type": "mcq", "stem": "Which equation describes the line with gradient 3 that passes through the point (2, −1)?", "options": ["y = 3x − 7", "y = 3x − 1", "y = 3x + 7", "y = −3x + 5"], "answer": 0, "explanation": "代入 y = mx + b：−1 = 3(2) + b，得 b = −7，所以 y = 3x − 7。把已知点的坐标当成 y 轴截距（得 y = 3x − 1）是典型错误。", "source": "Topic 1 Coordinate Geometry.pdf · 2-06 Finding the equation of a line", "weak": false}, {"id": "matp-018", "topic": "坐标几何 · 垂直直线", "difficulty": "hard", "type": "short", "stem": "Find the equation of the line that is perpendicular to y = 2x + 5 and passes through the point (4, 1). Give your answer in the form y = mx + b.", "options": [], "answer": "The perpendicular gradient is −1/2, so y − 1 = −1/2 (x − 4), which gives y = −1/2 x + 3.", "explanation": "垂直直线斜率之积为 −1，所以用 −1/2（不是 −2，也不是 2）；再代入 (4, 1) 求截距得 3。验证：x = 4 时 y = −2 + 3 = 1。", "source": "Topic 1 Coordinate Geometry.pdf · 2-07 Equations of parallel and perpendicular lines", "points": [{"t": "The perpendicular gradient is −1/2, so y − 1 = −1/2 (x − 4), which gives y = −1/2 x + 3.", "m": 1}], "weak": false}, {"id": "matp-019", "topic": "函数 · 正比例", "difficulty": "easy", "type": "mcq", "stem": "y varies directly as x. If y = 12 when x = 5, find x when y = 30.", "options": ["2.5", "12.5", "10", "72"], "answer": 1, "explanation": "正比例写成 y = kx，先求常数 k = 12/5 = 2.4；y = 30 时 x = 30 ÷ 2.4 = 12.5。把比例关系倒过来乘会得到 72。", "source": "Topic 1 Graphs.pdf · 7-01 Direct proportion", "weak": false}, {"id": "matp-020", "topic": "函数 · 反比例", "difficulty": "medium", "type": "mcq", "stem": "y is inversely proportional to x. When x = 5, y = 8. Find y when x = 20.", "options": ["0.5", "160", "2", "32"], "answer": 2, "explanation": "反比例写成 y = k/x，由 5×8 得 k = 40；x = 20 时 y = 40/20 = 2。若误当正比例会用 k = 8/5 得 32，是典型错误。", "source": "Topic 1 Graphs.pdf · 7-02 Inverse proportion", "weak": false}, {"id": "matp-021", "topic": "函数 · 圆的方程", "difficulty": "easy", "type": "short", "stem": "A circle has equation x² + y² = 49. State its centre and radius, and determine whether the point (5, 5) lies on the circle.", "options": [], "answer": "Centre (0, 0) and radius 7. The point (5, 5) does not lie on the circle, because 5² + 5² = 50, not 49.", "explanation": "x² + y² = r² 的圆心在原点，半径 r = √49 = 7。判断点在不在圆上，只要把坐标代入看左边是否恰好等于 49。", "source": "Topic 1 Graphs.pdf · 7-06 The circle", "points": [{"t": "Centre (0, 0) and radius 7", "m": 1}, {"t": "The point (5, 5) does not lie on the circle, because 5² + 5² = 50, not 49", "m": 1}], "weak": false}, {"id": "matp-022", "topic": "三角 · 毕氏定理", "difficulty": "easy", "type": "mcq", "stem": "A right-angled triangle has two shorter sides of 9 cm and 12 cm. Find the length of the hypotenuse.", "options": ["225 cm", "21 cm", "108 cm", "15 cm"], "answer": 3, "explanation": "斜边 = √(9² + 12²) = √225 = 15 cm。把两条直角边直接相加得 21，或忘记开方得 225，是最常见的两种错。", "source": "Topic 3 Trigonometry.pdf · 8-01 Pythagoras' theorem", "weak": false}, {"id": "matp-023", "topic": "三角 · 用正切求边", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle an angle is 35° and the side adjacent to it is 12 m. Find the length of the opposite side, correct to two decimal places.", "options": ["8.40 m", "6.88 m", "17.14 m", "14.65 m"], "answer": 0, "explanation": "tan 35° = 对边/邻边，所以 opposite = 12 × tan 35° ≈ 8.40 m。选错比值会得 12 sin 35° = 6.88 m 或 12/tan 35° = 17.14 m。", "source": "Topic 3 Trigonometry.pdf · 8-03 Finding an unknown side", "weak": false}, {"id": "matp-024", "topic": "三角 · 求未知角", "difficulty": "medium", "type": "mcq", "stem": "In a right-angled triangle, sin θ = 7/12. Find θ, correct to one decimal place.", "options": ["54.3°", "35.7°", "30.3°", "60.0°"], "answer": 1, "explanation": "θ = sin⁻¹(7/12) ≈ 35.7°。用 tan⁻¹(7/12) 得 30.3°，或误取余角 90° − 35.7° = 54.3°，都是常见的按键/概念错误。", "source": "Topic 3 Trigonometry.pdf · 8-04 Finding an unknown angle", "weak": false}, {"id": "matp-025", "topic": "三角 · 仰角", "difficulty": "medium", "type": "short", "stem": "From a point on level ground 45 m from the base of a vertical tower, the angle of elevation of the top of the tower is 62°. Find the height of the tower, correct to one decimal place.", "options": [], "answer": "tan 62° = h / 45, so h = 45 × tan 62° ≈ 84.6 m.", "explanation": "仰角是从水平线向上量到视线的角，45 m 是与 62° 相邻的边，所以用 tan。误用 sin 会得 39.7 m，是因为把 45 m 当成了斜边。", "source": "Topic 3 Trigonometry.pdf · 8-05 Angles of elevation and depression", "points": [{"t": "tan 62° = h / 45, so h = 45 × tan 62° ≈ 84.6 m.", "m": 1}], "weak": false}, {"id": "matp-026", "topic": "三角 · 方位角", "difficulty": "hard", "type": "short", "stem": "A plane flies 15 km due north and then 20 km due east. Find (a) its distance from the starting point and (b) its bearing from the starting point, correct to the nearest degree.", "options": [], "answer": "Distance = √(15² + 20²) = 25 km. Bearing = tan⁻¹(20/15) ≈ 53°, measured clockwise from north, so the bearing is 053°.", "explanation": "方位角一律从正北顺时针量：位移是「北 15、东 20」，所以角度在正北以东 53°。写成 037° 是把 15 和 20 用反了（tan⁻¹(15/20)）。", "source": "Topic 3 Trigonometry.pdf · 8-06 Bearings / 8-07 Problems involving bearings", "points": [{"t": "Distance = √(15² + 20²) = 25 km", "m": 1}, {"t": "Bearing = tan⁻¹(20/15) ≈ 53°, measured clockwise from north, so the bearing is 053°", "m": 1}], "weak": false}, {"id": "matp-027", "topic": "体积 · 圆柱（直径陷阱）", "difficulty": "easy", "type": "mcq", "stem": "A cylinder has a diameter of 14 cm and a height of 20 cm. Find its volume, correct to one decimal place.", "options": ["1026.3 cm³", "439.8 cm³", "3078.8 cm³", "12315.0 cm³"], "answer": 2, "explanation": "先求半径 r = 14 ÷ 2 = 7 cm，V = πr²h = π × 49 × 20 = 980π ≈ 3078.8 cm³。直接把直径当半径会得 12315.0 cm³，这是本题最主要的陷阱。", "source": "Topic3 Surface area and Volume.pdf · 3-05 Volumes of prisms and cylinders（V = πr²h）", "weak": false}, {"id": "matp-028", "topic": "面积 · 组合图形", "difficulty": "medium", "type": "mcq", "stem": "A shape is made by attaching a semicircle of radius 4 cm to one side of a rectangle measuring 12 cm by 8 cm. Find the total area, correct to one decimal place.", "options": ["146.3 cm²", "96.0 cm²", "108.6 cm²", "121.1 cm²"], "answer": 3, "explanation": "矩形 12 × 8 = 96 cm²，半圆 ½ × π × 4² = 8π ≈ 25.13 cm²，合计 ≈ 121.1 cm²。忘记取一半会得 146.3，只算四分之一圆会得 108.6。", "source": "Topic3 Surface area and Volume.pdf · 3-01 Areas of composite shapes", "weak": false}, {"id": "matp-029", "topic": "表面积 · 圆柱与涂漆成本", "difficulty": "hard", "type": "short", "stem": "A cylindrical water tank has a radius of 5 m and a height of 10 m. Its entire surface, including the top and the bottom, is to be painted. (a) Find the total surface area, correct to the nearest square metre. (b) If paint costs $12 per square metre, find the total cost.", "options": [], "answer": "(a) SA = 2πr² + 2πrh = 50π + 100π = 150π ≈ 471.24 m², so 471 m². (b) Cost = 471 × 12 = $5,652.", "explanation": "两个圆面加一个侧面共 150π。只算侧面（100π ≈ 314 m²）会漏掉顶和底；若中间不四舍五入、用 471.24 × 12 得 $5,654.88，也算正确。", "source": "2025 BBHS 10 (5.2) T2 - soln.pdf · Q19 · Topic3 Surface area and Volume.pdf", "points": [{"t": "(a) SA = 2πr² + 2πrh = 50π + 100π = 150π ≈ 471.24 m², so 471 m²", "m": 1}, {"t": "(b) Cost = 471 × 12 = $5,652", "m": 1}], "weak": false}, {"id": "matp-030", "topic": "统计 · 分布形状", "difficulty": "easy", "type": "mcq", "stem": "A data distribution has a long tail extending towards the higher scores. How is this distribution described?", "options": ["Positively skewed", "Negatively skewed", "Symmetrical", "Bimodal"], "answer": 0, "explanation": "尾部指向高分一侧叫 positively skewed（正偏）；负偏的尾指向低分一侧。两者最容易记反，记法是「尾巴往哪边甩，就叫哪边偏」。", "source": "Topic 1 Investigating Data.pdf · 5-01 The shape of a frequency distribution", "weak": false}, {"id": "matp-031", "topic": "统计 · 四分位距 IQR", "difficulty": "easy", "type": "mcq", "stem": "Find the interquartile range of the data set 4, 7, 7, 9, 12, 15, 15, 18, 20, 22.", "options": ["8", "11", "13.5", "18"], "answer": 1, "explanation": "n = 10，中位数 = (12+15)/2 = 13.5；下半组中位数 Q1 = 7，上半组中位数 Q3 = 18，IQR = 18 − 7 = 11。选 13.5 是把它当成 IQR 了，其实那是中位数。", "source": "Topic 1 Investigating Data.pdf · 5-02 Quartiles and interquartile range", "weak": false}, {"id": "matp-032", "topic": "统计 · 五数概括与偏度", "difficulty": "hard", "type": "short", "stem": "The ages of 13 participants in a sports event are: 12, 14, 15, 同时，标准差越大说明每场得分波动越大，所以 A 队更稳定。标准差与总分无关，也不等于极差，所以前两个选项都推不出来。", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation · 2025 BBHS 10 (5.2) T2 Ana (IntDep+Alg+Data+Pav).pdf Q7(e)", "weak": false}, {"id": "matp-042", "topic": "统计 · 计算标准差", "difficulty": "medium", "type": "mcq", "stem": "Find the standard deviation of the data set 2, 4, 4, 4, 5, 5, 7, 9, correct to one decimal place. Use σ = √(Σ(x − x̄)² ÷ n).", "options": ["2.0", "2.1", "1.5", "4.0"], "answer": 0, "explanation": "均值 x̄ = 40 ÷ 8 = 5，偏差平方和 = 9+1+1+1+0+0+4+16 = 32，σ = √(32 ÷ 8) = √4 = 2.0。选 4.0 是忘了开方（那是方差）；2.1 是除以 n−1 的样本标准差。", "source": "New Century 10 Standard-Core Textbook.pdf · 5.03 Standard deviation（σ = √(Σ(x − x̄)² ÷ n)）", "weak": false}, {"id": "matp-043", "topic": "统计 · 均值与标准差", "difficulty": "hard", "type": "short", "stem": "A team scored the following number of goals in its 10 matches: 0, 1, 1, 2, 2, 2, 3, 3, 5, 6. (a) Find the mean. (b) Find the standard deviation, correct to two decimal places, using σ = √(Σ(x − x̄)² ÷ n).", "options": [], "answer": "(a) Mean = 25 ÷ 10 = 2.5 goals. (b) Σ(x − 2.5)² = 30.5, so σ = √(30.5 ÷ 10) = √3.05 ≈ 1.75 goals.", "explanation": "先求均值 2.5，再逐个算偏差平方：6.25+2.25+2.25+0.25+0.25+0.25+0.25+0.25+6.25+12.25 = 30.5，除以 n=10 后开方得 1.75。本题按总体标准差（除以 n）计算；若除以 n−1=9 会得 1.84，那是样本标准差的口径。", "source": "2025 BBHS 10 (5.2) T2 Ana (IntDep+Alg+Data+Pav).pdf · Q7(e) · New Century 10 Standard-Core Textbook.pdf · 5.03", "points": [{"t": "(a) Mean = 25 ÷ 10 = 2.5 goals", "m": 1}, {"t": "(b) Σ(x − 2.5)² = 30.5, so σ = √(30.5 ÷ 10) = √3.05 ≈ 1.75 goals", "m": 1}], "weak": false}]};
const KEY = "dsh-quiz-matp";
const MULTI = DATA.slug === "all";
const app = document.getElementById("app");
let state = {idx:0, answers:{}, order:null};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.answers) state = s;
  } catch(e) {}
  if (MULTI && (!state.order || !state.order.length) && !state.started) { state.setup = true; return; }
  if (!state.order || !state.order.length) state.order = DATA.questions.map((_,i)=>i);
  if (state.idx >= state.order.length) state.idx = state.order.length - 1;
  try {
    const m = location.search.match(/[?&]q=([^&]+)/);
    if (m) {
      const qid = decodeURIComponent(m[1]);
      const qi = DATA.questions.findIndex(x => x.id === qid);
      const pos = state.order.indexOf(qi);
      if (pos >= 0) state.idx = pos;
    }
  } catch(e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderSetup() {
  const subs = DATA.subjects || {};
  const keys = Object.keys(subs);
  const saved = state.pick || {};
  const opts = keys.map(k => {
    const on = saved[k] !== false;
    return `<label class="pick"><input type="checkbox" data-s="${k}" ${on ? "checked" : ""}>
      <span class="nm" title="${esc(subs[k].zh || k)}">${esc(subs[k].zh || k)}</span><em>${subs[k].n}</em></label>`;
  }).join("");
  const per = (state.per === undefined || state.per === null) ? 10 : state.per;
  const DAILY = ["sci","eng","his","geo","pdh","matp","maths53"];
  app.innerHTML = `<div class="setup">
    <div class="setup-head">
      <h2>综合卷 · 全科</h2>
      <p class="muted">从各科抽题混着做；做错的题会按它原本的科目进错题本，并按第 1/3/7 天排期。</p>
    </div>

    <section class="setup-block">
      <div class="setup-label">1 · 选科目 <span class="muted" id="pickcount"></span></div>
      <div class="picks">${opts}</div>
    </section>

    <section class="setup-block">
      <div class="setup-label">2 · 每科抽几题</div>
      <div class="seg">${[5,10,20,0].map(n => `<button data-n="${n}" class="${per===n?'on':''}">${n? n+' 题':'全部'}</button>`).join("")}</div>
    </section>

    <div class="setup-foot">
      <div class="sum">共 <b id="cnt">0</b> 题</div>
      <button class="btn ghost" id="daily">今日挑战</button>
      <button class="btn" id="startmix">开始答题 →</button>
    </div>
  </div>`;
  const chosenCount = () => {
    let c = 0;
    app.querySelectorAll(".pick input").forEach(cb => { if (cb.checked) c++; });
    return c || Object.keys(subs).filter(k => (state.pick || {})[k] !== false).length;
  };
  const calc = () => {
    let n = 0;
    app.querySelectorAll(".pick input").forEach(cb => {
      if (!cb.checked) return;
      const k = cb.dataset.s, c = subs[k].n;
      n += per ? Math.min(per, c) : c;
    });
    document.getElementById("cnt").textContent = n;
    const pc = document.getElementById("pickcount");
    if (pc) pc.textContent = "已选 " + chosenCount() + " 科";
  };
  app.querySelectorAll(".pick input").forEach(cb => cb.onchange = () => {
    state.pick = state.pick || {}; state.pick[cb.dataset.s] = cb.checked; save(); calc();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    state.per = +b.dataset.n; save(); render();
  });
  function seedRnd(str){
    var h=2166136261;
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15, t|1);
      t^=t+Math.imul(t^t>>>7, t|61); return ((t^t>>>14)>>>0)/4294967296; };
  }
  function startDaily(){
    var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    var rnd=seedRnd("daily:"+key);
    var idxs=[];
    DAILY.forEach(function(sl){
      var pool=DATA.questions.map(function(q,i){ return q.subj===sl?i:-1; }).filter(function(i){ return i>=0; });
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      idxs=idxs.concat(pool.slice(0,3));
    });
    state.order=idxs; state.idx=0; state.started=true; state.setup=false;
    state.answers={}; state.daily=key; state.rewarded=false; state.t0=Date.now(); save(); render();
  }
  document.getElementById("daily").onclick = startDaily;
  document.getElementById("startmix").onclick = () => {
    const chosen = keys.filter(k => (state.pick || {})[k] !== false);
    if (!chosen.length) { alert("至少选一科"); return; }
    let idxs = [];
    chosen.forEach(k => {
      let pool = DATA.questions.map((q, i) => q.subj === k ? i : -1).filter(i => i >= 0);
      pool.sort(() => Math.random() - 0.5);
      idxs = idxs.concat(per ? pool.slice(0, per) : pool);
    });
    idxs.sort(() => Math.random() - 0.5);
    state.order = idxs; state.idx = 0; state.started = true; state.setup = false;
    state.answers = {}; state.t0 = Date.now(); save(); render();
  };
  calc();
}


function render() {
  if (MULTI && location.hash === "#daily" && !state.started && !state.dailyAuto) {
    state.dailyAuto = true; if (typeof startDaily === "function") startDaily();
  }
  if (MULTI && state.setup && !state.started) return renderSetup();
  const qs = state.order.map(i => DATA.questions[i]);
  const q = qs[state.idx];
  const total = qs.length;
  const answered = qs.filter(x => state.answers[x.id]).length;
  const right = qs.filter(x => state.answers[x.id] === "ok").length;
  const wrong = qs.filter(x => state.answers[x.id] === "bad").length;
  document.getElementById("counter").textContent = (state.idx+1) + " / " + total;
  document.getElementById("scorepill").textContent = "✓ " + right + "  ✗ " + wrong;
  document.getElementById("pbar").style.width = (answered/total*100).toFixed(1) + "%";
  if (!q) { app.innerHTML = "<p>这套题是空的。</p>"; return; }

  const rec = state.answers[q.id];
  const chips = `<div class="chips">
      ${MULTI && q.subjZh ? `<span class="chip">${esc(q.subjZh)}</span>` : ""}
      <span class="chip">${esc(q.topic)}</span>
      <span class="chip ${esc(q.difficulty)}">${ {easy:"简单",medium:"中等",hard:"较难"}[q.difficulty] || esc(q.difficulty) }</span>
      <span class="chip">${q.type === "mcq" ? "选择题" : "简答"}</span>
      <span class="chip">第 ${state.idx+1} 题 / 共 ${total}</span>
    </div>`;

  let bodyHtml = "";
  if (q.type === "mcq") {
    const opts = (q.options || []).map((o, i) => {
      let cls = "opt", mark = "";
      if (rec) {
        if (i === q.answer) { cls += " correct"; mark = '<span class="mk">✓</span>'; }
        else if (rec.chosen === i) { cls += " wrong"; mark = '<span class="mk">✗</span>'; }
      }
      return `<button class="${cls}" data-i="${i}" ${rec ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[i]}</span><span class="txt">${esc(o)}</span>${mark}</button>`;
    }).join("");
    bodyHtml = `<div class="opts">${opts}</div>`;
  } else {
    const pts = q.points && q.points.length ? q.points : [{t:q.answer, m:1}];
    const totalMarks = pts.reduce((a,p)=>a+(p.m||1),0);
    const checked = (rec && rec.checked) ? rec.checked : [];
    const earned = pts.reduce((a,p,i)=>a + (checked.indexOf(i)>=0 ? (p.m||1) : 0), 0);
    const bareAns = (q.answer || "").replace(/\d+\s*marks?/gi, "").replace(/(19|20)\d{2}/g, "");
    const hasNum = /-?\d/.test(bareAns);
    bodyHtml = `<textarea id="ta" placeholder="先自己写（英文），写完点下面的按钮对照得分点">${rec && rec.text ? esc(rec.text) : ""}</textarea>
      <div class="actions">
        <button class="btn" id="reveal">${rec ? "重新对照得分点" : "对照得分点"}</button>
        ${hasNum ? `<button class="btn ghost" id="numcheck">数值自检</button><span class="muted" id="numres"></span>` : ""}
        ${rec ? `<span class="pill" style="align-self:center">已得 <b>${earned}</b> / ${totalMarks} 分</span>` : `<span class="muted" style="align-self:center">共 ${totalMarks} 分 · ${pts.length} 个得分点</span>`}
      </div>`;
    if (rec) {
      bodyHtml += `<div class="panel">
        <div class="panel-h">自评 · 勾选你写到的得分点</div>
        <div class="pts">${pts.map((p,i)=>`
          <label class="pt ${checked.indexOf(i)>=0?'on':''}"><input type="checkbox" data-i="${i}" ${checked.indexOf(i)>=0?'checked':''}><span>${esc(p.t)}</span><em>${p.m||1} 分</em></label>`).join("")}</div>
        <div class="actions">
          <button class="btn ghost" id="allpt">全部勾上</button>
          <button class="btn ghost" id="nonept">全部取消</button>
        </div>
        <div class="mine"><b>你写的：</b><div>${esc(((rec.text||"").trim()) || "（空）")}</div></div>
      </div>`;
    }
  }

  const expHtml = rec ? `<div class="exp show"><b>解析：</b>${esc(q.explanation)}
      ${q.type === "short" ? `<details class="fullans"><summary>看完整参考答案</summary><div>${esc(q.answer)}</div></details>` : ""}
      <div class="src">出处：${esc(q.source || "")}</div></div>` : "";

  const last = state.idx >= total - 1;
  app.innerHTML = `<div class="card">${chips}<div class="stem">${esc(q.stem)}</div>
      ${bodyHtml}${expHtml}</div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${state.idx === 0 ? "disabled" : ""}>← 上一题</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="finish">看成绩</button>
        <button class="btn" id="next" ${last ? "disabled" : ""}>下一题 →</button>
      </div>`;

  if (q.type === "mcq") {
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      state.answers[q.id] = {chosen:i, ok: i === q.answer ? "ok" : "bad"};
      if (window.awardForQ) awardForQ(q.id, q.difficulty, "mcq", i === q.answer);
      reviewMark(q.subj || DATA.slug, q.id, i === q.answer);
      logAnswer(q.subj || DATA.slug, q.id, i === q.answer, q.difficulty, "mcq");
      save(); render();
    }));
  } else {
    const ta = document.getElementById("ta");
    const cur = () => state.answers[q.id] || {chosen:-1, text:"", checked:[]};
    document.getElementById("reveal").onclick = () => {
      const c = cur();
      state.answers[q.id] = {chosen:-1, text: ta.value, checked: c.checked || [], ok:"ok"};
      save(); render();
    };
    app.querySelectorAll(".pt input").forEach(cb => cb.addEventListener("change", () => {
      const c = cur(); const i = +cb.dataset.i;
      const set = new Set(c.checked || []);
      if (cb.checked) set.add(i); else set.delete(i);
      state.answers[q.id] = {chosen:-1, text: c.text, checked: [...set].sort((a,b)=>a-b), ok:"ok"};
      const full = pts.every((_,i)=>set.has(i));
      if (window.awardForQ && full && !(c.checked && c.checked.length >= pts.length)) awardForQ(q.id, q.difficulty, "short", true);
      reviewMark(q.subj || DATA.slug, q.id, full);
      logAnswer(q.subj || DATA.slug, q.id, full, q.difficulty, "short");
      save(); render();
    }));
    const nc = document.getElementById("numcheck");
    if (nc) nc.onclick = () => {
      const u = numsOf(ta.value), a = numsOf(q.answer), res = document.getElementById("numres");
      if (!u.length) { res.textContent = "你还没写数字"; res.style.color = "var(--dim)"; return; }
      if (!a.length) { res.textContent = "参考答案无数字"; res.style.color = "var(--dim)"; return; }
      const last = u[u.length-1];
      const hit = a.some(v => Math.abs(v-last) <= Math.max(Math.abs(v)*0.01, 0.005));
      res.textContent = hit ? "✓ 数值与参考答案一致" : "✗ 数值与参考答案不一致";
      res.style.color = hit ? "var(--ok)" : "var(--bad)";
    };
    const all = document.getElementById("allpt"), none = document.getElementById("nonept");
    if (all) all.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:pts.map((_,i)=>i),ok:"ok"}; save(); render(); };
    if (none) none.onclick = () => { const c=cur(); state.answers[q.id]={chosen:-1,text:c.text,checked:[],ok:"ok"}; save(); render(); };
  }
  document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; save(); render(); } };
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => { if (state.idx < total-1) { state.idx++; save(); render(); } };
  document.getElementById("finish").onclick = showResult;
  window.scrollTo({top:0, behavior:"smooth"});
}

function showResult() {
  const qs = state.order.map(i => DATA.questions[i]);
  if (!state.rewarded && qs.length) {
    state.rewarded = true; save();
    if (state.daily) {
      try {
        var dAns = qs.filter(function(x){ var a = state.answers[x.id]; return a && (a.ok === "ok" || a.ok === "bad"); }).length;
        var dOk = qs.filter(function(x){ var a = state.answers[x.id]; return a && a.ok === "ok"; }).length;
        var dPct = dAns ? Math.round(dOk / dAns * 100) : 0;
        var DKEY = "dsh-daily-v1";
        if (window.lbSubmit) lbSubmit(state.t0 ? (Date.now() - state.t0) : 0);
        var drec = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (drec.date !== state.daily || dPct > (drec.best || 0)) {
          drec.date = state.daily; drec.best = dPct; drec.answer = dAns;
          localStorage.setItem(DKEY, JSON.stringify(drec));
        }
        if (window.lbOpen) setTimeout(function(){ lbOpen(); }, 600);
      } catch(e) {}
    }
    const answered = qs.filter(x => state.answers[x.id]).length;
    if (window.awardXP && answered > 0) awardXP(20 + Math.min(80, answered), true);
    if (window.openChest && answered >= 3) openChest();
  }
  const rec = id => state.answers[id] || null;
  const mcq = qs.filter(x => x.type === "mcq");
  const shorts = qs.filter(x => x.type === "short");
  const right = mcq.filter(x => (rec(x.id)||{}).ok === "ok");
  const wrong = mcq.filter(x => (rec(x.id)||{}).ok === "bad");
  const todo = qs.filter(x => !rec(x.id));
  let earnedM = 0, totalM = 0, partM = 0;
  const weak = [];
  shorts.forEach(x => {
    const pts = (x.points && x.points.length) ? x.points : [{m:1}];
    const tot = pts.reduce((a,p)=>a+(p.m||1),0);
    const r = rec(x.id);
    const got = (r && r.checked) ? pts.reduce((a,p,i)=>a+(r.checked.indexOf(i)>=0?(p.m||1):0),0) : 0;
    totalM += tot;
    if (r) { earnedM += got; if (got < tot) { partM += 1; weak.push(x); } }
  });
  const pct = mcq.length ? Math.round(right.length / mcq.length * 100) : 0;
  const needRedo = [...wrong, ...weak];
  const wrongIds = needRedo.map(x => x.id);
  app.innerHTML = `<div class="card done">
      <h2>选择题 ${right.length} / ${mcq.length} 正确（${pct}%）</h2>
      <div class="stats">
        <div class="stat"><b>${right.length}</b><span>选择题答对</span></div>
        <div class="stat"><b>${wrong.length}</b><span>选择题答错</span></div>
        <div class="stat"><b>${earnedM}</b><span>简答得分 / ${totalM}</span></div>
        <div class="stat"><b>${todo.length}</b><span>未做</span></div>
      </div>
      ${weak.length ? `<div><b>简答没拿满的题（${weak.length}）：</b><ol class="wronglist">${weak.map(x => `<li>${esc(x.topic)}</li>`).join("")}</ol></div>` : ""}
      ${wrong.length ? `<div><b>选择题错题：</b><ol class="wronglist">${wrong.map(x => `<li>${esc(x.topic)} — ${esc((x.stem||"").slice(0,60))}…</li>`).join("")}</ol></div>` : ""}
      <div class="actions">
        ${needRedo.length ? `<button class="btn" id="redo">只练错题（${needRedo.length} 题）</button>` : ""}
        <button class="btn ghost" id="showlb">查看今日榜单</button>
        <button class="btn ghost" id="again">整套重做</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">← 回到科目列表</a>
      </div></div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    state.order = wrongIds.map(id => DATA.questions.findIndex(x => x.id === id)).filter(i => i >= 0);
    wrongIds.forEach(id => delete state.answers[id]);
    state.idx = 0; save(); render();
  };
  const showlb = document.getElementById("showlb");
  if (showlb) showlb.onclick = () => { if (window.lbOpen) lbOpen(); };
  document.getElementById("again").onclick = () => {
    state = {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
    save(); render();
  };
}

document.getElementById("grid").onclick = openNav;
document.getElementById("navclose").onclick = () => document.getElementById("nav").classList.remove("on");
document.getElementById("nav").addEventListener("click", e => {
  if (e.target && e.target.id === "nav") e.target.classList.remove("on");
});
try { localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); }
catch(e) { document.body.insertAdjacentHTML("afterbegin",
  '<div style="background:#ff5f56;color:#fff;padding:8px 16px;text-align:center;font-size:13px">这个浏览器禁用了本地存储：进度和错题本不会保存（Safari 用 file:// 打开时常见）。建议用 Chrome 打开，或把文件夹放到本地 HTTP 服务下。</div>'); }

document.getElementById("exam").onclick = startExam;
if (state.deadline) { timerId = setInterval(tickClock, 1000); tickClock(); }

document.getElementById("restart").onclick = () => {
  if (!confirm(MULTI ? "回到选科目？" : "清空进度，从头开始？")) return;
  state = MULTI ? {setup:true, pick:state.pick, per:state.per} : {idx:0, answers:{}, order:DATA.questions.map((_,i)=>i)};
  save(); render();
};

document.addEventListener("keydown", e => {
  if (MULTI && state.setup && !state.started) {
    if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("startmix"); if (b && b.onclick) b.onclick(); }
    return;
  }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") document.getElementById("nav").classList.remove("on"); return; }
  const q = state.order.length ? DATA.questions[state.order[state.idx]] : null;
  if (e.key === "ArrowRight" || e.key === "j") { if (state.idx < state.order.length-1){ state.idx++; save(); render(); } return; }
  if (e.key === "ArrowLeft" || e.key === "k") { if (state.idx > 0){ state.idx--; save(); render(); } return; }
  if (e.key === "g" || e.key === "G") { document.getElementById("nav").classList.contains("on") ? document.getElementById("nav").classList.remove("on") : openNav(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state.order && state.idx < state.order.length - 1) { state.idx++; save(); render(); }
    else showResult();
    return;
  }
  if (e.key === "s" || e.key === "S") { e.preventDefault(); showResult(); return; }
  if (!q || q.type !== "mcq") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= (q.options || []).length) {
    if (!state.answers[q.id]) {
      state.answers[q.id] = {chosen:n-1, ok: n-1 === q.answer ? "ok" : "bad"};
      save(); render();
    }
  }
});

const REVIEW_KEY = "dsh-review-v1";
const GAPS = [1, 3, 7];
function reviewDb(){ try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); } catch(e){ return {}; } }
function reviewSave(db){ try { localStorage.setItem(REVIEW_KEY, JSON.stringify(db)); } catch(e){} }
function reviewMark(slug, qid, correct){
  const db = reviewDb(), id = slug + "::" + qid, now = Date.now();
  if (correct) {
    const it = db[id];
    if (!it) return;
    const st = (it.stage || 0) + 1;
    if (st >= GAPS.length) delete db[id];
    else { it.stage = st; it.due = now + GAPS[st]*864e5; it.last = now; }
  } else {
    const old = db[id] || {};
    db[id] = {stage:0, due: now + GAPS[0]*864e5, added: old.added || now, last: now};
  }
  reviewSave(db);
}
function numsOf(t){ return (String(t).match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

const LOG_KEY = "dsh-log-v1";
function logAnswer(slug, qid, ok, diff, ty){
  try {
    let arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    arr.push({t: Date.now(), s: slug, q: qid, ok: ok ? 1 : 0, d: diff || "", ty: ty || ""});
    if (arr.length > 3000) arr = arr.slice(-3000);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function navState(qi){
  const q = DATA.questions[qi], a = state.answers[q.id];
  if (!a) return "";
  if (q.type === "mcq") return a.ok === "ok" ? "ok" : "bad";
  const pts = q.points || [{m:1}], c = (a.checked || []).length;
  if (c >= pts.length) return "ok";
  if (c > 0) return "part";
  return "";
}
function openNav(){
  const grid = document.getElementById("navgrid");
  grid.innerHTML = state.order.map((qi, pos) =>
    `<button class="${navState(qi)}" data-pos="${pos}">${pos+1}</button>`).join("");
  grid.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.idx = +b.dataset.pos; save();
    document.getElementById("nav").classList.remove("on"); render();
  });
  document.getElementById("nav").classList.add("on");
}

let timerId = null;
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tickClock(){
  const el = document.getElementById("clock");
  if (!state.deadline) { if (el) el.style.display = "none"; return; }
  const left = state.deadline - Date.now();
  if (el) { el.style.display = ""; el.textContent = "⏱ " + fmtLeft(left);
            el.style.color = left < 5*60000 ? "var(--bad)" : "var(--dim)"; }
  if (left <= 0) { clearInterval(timerId); timerId = null; state.deadline = 0; save(); showResult(); }
}
function startExam(){
  const def = DATA.examMin || 60;
  const v = prompt("考试模式：倒计时多少分钟？（到点自动收卷）", def);
  if (v === null) return;
  const mins = parseInt(v, 10);
  if (!mins || mins <= 0) return;
  state.deadline = Date.now() + mins*60000; save();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
  tickClock();
}


load(); render();
</script>
<script>

(function(){
  var KEY="dsh-xp-v1", BKEY="dsh-badges-v1", GOAL=30;
  var COIN_KEY="dsh-coins-v1", INV_KEY="dsh-inv-v1", BUFF_KEY="dsh-buffs-v1";
  var LEVELS=[0,60,150,280,450,680,980,1360,1820,2360,3000,3750,4600,5560,6650,7880,9250,10800,12500,14400];
  function db(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{"xp":0,"combo":0,"best":0}'); }catch(e){ return {xp:0,combo:0,best:0}; } }
  function save(g){ try{ localStorage.setItem(KEY,JSON.stringify(g)); }catch(e){} }
  function bdb(){ try{ return JSON.parse(localStorage.getItem(BKEY)||'{}'); }catch(e){ return {}; } }
  function bsave(b){ try{ localStorage.setItem(BKEY,JSON.stringify(b)); }catch(e){} }
  function log(){ try{ return JSON.parse(localStorage.getItem('dsh-log-v1')||'[]'); }catch(e){ return []; } }
  function levelOf(xp){ var l=1; for(var i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) l=i+1; } return l; }
  function nextAt(xp){ var l=levelOf(xp); return LEVELS[l]!==undefined?LEVELS[l]:null; }

  /* ---------- 金币 / 库存 / 增益 ---------- */
  function readCoins(){ var o={n:0,earned:0,dust:0}; try{ o=JSON.parse(localStorage.getItem(COIN_KEY)||'null')||o; }catch(e){} if(o.dust===undefined)o.dust=0; return o; }
  function saveCoins(o){ try{ localStorage.setItem(COIN_KEY,JSON.stringify(o)); }catch(e){} }
  function addCoins(n){ var c=readCoins(); c.n=(c.n||0)+n; c.earned=(c.earned||0)+Math.max(0,n); saveCoins(c); }
  function addDust(n){ var c=readCoins(); c.dust=(c.dust||0)+n; saveCoins(c); }

  /* 音效：WebAudio 现场合成，不依赖音频文件 */
  var SFX_ON = (function(){ try{ return localStorage.getItem("dsh-sfx")!=="0"; }catch(e){ return true; } })();
  var AC=null;
  function beep(freq, dur, type, vol){
    if(!SFX_ON) return;
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(vol||0.06, AC.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(dur||0.12));
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime+(dur||0.12)+0.02);
    }catch(e){}
  }
  function levelUpSound(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,0.16,"triangle",0.07); }, i*90); }); }
  function toggleSfx(){ SFX_ON=!SFX_ON; try{ localStorage.setItem("dsh-sfx", SFX_ON?"1":"0"); }catch(e){} return SFX_ON; }
  function readInv(){
    var d={owned:[],equipped:{theme:"",title:""},uses:{}};
    try{ var o=JSON.parse(localStorage.getItem(INV_KEY)||'null'); if(o){ d.owned=o.owned||[]; d.equipped=o.equipped||{theme:"",title:""}; d.uses=o.uses||{}; } }catch(e){}
    return d;
  }
  function saveInv(d){ try{ localStorage.setItem(INV_KEY,JSON.stringify(d)); }catch(e){} }
  function readBuffs(){ var d={xp2Until:0}; try{ d=JSON.parse(localStorage.getItem(BUFF_KEY)||'null')||d; }catch(e){} return d; }
  function saveBuffs(d){ try{ localStorage.setItem(BUFF_KEY,JSON.stringify(d)); }catch(e){} }

  var THEMES={
    gold:  {bg:"#16130a",card:"#211c10",card2:"#2b2414",fg:"#f7efd8",dim:"#b8a878",line:"#3d3420",accent:"#f2c94c"},
    warm:  {bg:"#1a1310",card:"#241a15",card2:"#2e221b",fg:"#f3e9e1",dim:"#b39a86",line:"#3b2c22",accent:"#ff9f45"},
    forest:{bg:"#0b1410",card:"#111d17",card2:"#172720",fg:"#e2f0e7",dim:"#8cae9b",line:"#213528",accent:"#3ddc97"},
    sakura:{bg:"#160f15",card:"#1e151d",card2:"#281b25",fg:"#f6e9f2",dim:"#b59bb0",line:"#34222f",accent:"#ff7ab6"}
  };

  function buy(id){
    var item=null; SHOP.forEach(function(x){ if(x.id===id) item=x; });
    if(!item) return {ok:false,msg:"没有这件商品"};
    var c=readCoins(), inv=readInv();
    if(item.t!=="use" && inv.owned.indexOf(id)>=0) return {ok:false,msg:"已经拥有了"};
    var isDust = item.cur==="dust";
    var bal = isDust ? (c.dust||0) : (c.n||0);
    if(bal < item.p) return {ok:false,msg:(isDust?"星尘":"金币")+"不够，还差 "+(item.p-bal)};
    if(isDust){ c.dust=(c.dust||0)-item.p; } else { c.n=(c.n||0)-item.p; }
    saveCoins(c);
    if(item.t==="use"){ inv.uses[id]=(inv.uses[id]||0)+1; }
    else { inv.owned.push(id); }
    saveInv(inv);
    if(item.t==="theme"){ inv.equipped.theme=item.v; saveInv(inv); applyTheme(); }
    if(item.t==="title"){ inv.equipped.title=item.v; saveInv(inv); }
    if(item.t==="buff"){ var b=readBuffs(); b.xp2Until=Date.now()+30*60000; saveBuffs(b); }
    return {ok:true,msg:"已购买："+item.n};
  }

  function streakDays(){
    var days={}, d0=new Date(); d0.setHours(0,0,0,0), t0=d0.getTime();
    log().forEach(function(x){ var d=new Date(x.t); d.setHours(0,0,0,0); days[d.getTime()]=1; });
    var gaps=shieldCount(), n=0, c=t0, used=0;
    while(true){
      if(days[c]){ n++; c-=864e5; continue; }
      if(c===t0){ c-=864e5; continue; }
      if(used<gaps){ used++; c-=864e5; continue; }
      break;
    }
    return n;
  }

  function awardXP(base, ok){
    var g=db();
    if(ok){ g.combo=(g.combo||0)+1; } else { g.combo=0; }
    var mult = ok ? Math.min(2, 1 + 0.1*Math.max(0, (g.combo||1)-1)) : 1;
    var buffs=readBuffs(), dbl = buffs.xp2Until && Date.now()<buffs.xp2Until ? 2 : 1;
    var gain = ok ? Math.round(base*mult*dbl) : Math.max(1, Math.round(base*0.2));
    var before=levelOf(g.xp||0);
    g.xp=(g.xp||0)+gain;
    g.best=Math.max(g.best||0, g.combo||0);
    save(g);
    var coin = Math.max(1, Math.round(gain*0.5));
    var crit = ok && Math.random()<0.12;
    if(crit) coin*=2;
    addCoins(coin);
    if(ok) beep(crit?1180:660, 0.1, "sine", crit?0.08:0.05); else beep(180,0.14,"sawtooth",0.05);
    toast('+'+gain+' XP · +'+coin+' 币'+(crit?' · 暴击':"")+(ok&&g.combo>1?' · 连对 '+g.combo:'')+(dbl>1?' · ×2':''), ok);
    var after=levelOf(g.xp);
    if(after>before){ setTimeout(function(){ toast('🎉 升到 Lv.'+after, true); levelUpSound(); }, 450); }
    checkBadges();
    if(window.__refreshProfile) window.__refreshProfile();
  }

  function lbMetric(x, sort){

  function lbFetch(cb){

    LB.at=now;

      .then(function(r){ return r.json(); })

  function lbNearRange(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<3) return null;
    return [Math.max(0,idx-2), Math.min(LB.list.length-1, idx+2)];
  }

  function lbRowsHtml(){
    var me=nick()||"我";
    var start = LB.list.length>3 ? 3 : 0;
    var near = lbNearRange();
    return LB.list.slice(start).map(function(x,i){
      if(near && (i+start)>=near[0] && (i+start)<=near[1]) return "";
      var mine = x.name===me;
      return '<div class="lb-row'+(mine?' me':'')+'" data-k="'+x.name+'">'+
        '<span class="rk">'+(i+start+1)+'</span>'+
        '<span class="rname">'+x.name+(mine?'（我）':'')+
          (x.ms>0?'<span class="lb-time">'+fmtMs(x.ms)+'</span>':'')+'</span>'+
        '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>';

  function awardForQ(id, diff, type, ok){
    var base = type==='short' ? ({easy:12,medium:16,hard:22}[diff]||16)
                              : ({easy:8, medium:10,hard:14}[diff]||10);
    var S=seen(), e=S[id]||{n:0,right:false,sealed:false}, mul=1, note="";
    if(e.right && ok){
      if(e.sealed || e.n>=3){ mul=0; note="已掌握，不再加分"; }
      else { mul=0.3; note="重做已会的题，经验 ×0.3"; }
    } else if(e.right && !ok){
      mul=1; note="";
    } else if(!e.right && ok && e.n>0){
      mul=1; note="纠错 + 全额";
    }
    e.n=(e.n||0)+1;
    if(ok){ e.right=true; if(e.n>=3 && mul===0) e.sealed=true; }
    S[id]=e; saveSeen(S);
    if(mul===0){ toast(note+" · 去刷没掌握的题", false); return; }
    var gain = Math.round(base*mul);
    if(note) toast(note, true);
    awardXP(gain, ok);
  }

  function qseed(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function todayLog(){ var d0=new Date(); d0.setHours(0,0,0,0); return log().filter(function(x){ return x.t>=d0.getTime(); }); }
  function quests(){
    var Q=null;
    try{ Q=JSON.parse(localStorage.getItem(QKEY)||"null"); }catch(e){}
    if(!Q || Q.date!==todayKey()){
      var rnd=qseed("q:"+todayKey()), pool=QTEMPL.slice();
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var t=pool[k]; pool[k]=pool[j]; pool[j]=t; }
      Q={date:todayKey(), list:pool.slice(0,3).map(function(x){return x.id;}), claimed:[]};
      try{ localStorage.setItem(QKEY,JSON.stringify(Q)); }catch(e){}
    }
    return Q;
  }
  function questProgress(){
    var L=todayLog(), n=L.length;
    var okCnt=L.filter(function(x){return x.ok;}).length;
    var maxCombo=0, cur=0;
    L.slice().sort(function(a,b){return a.t-b.t;}).forEach(function(x){ if(x.ok){ cur++; maxCombo=Math.max(maxCombo,cur);} else cur=0; });
    var hard=L.filter(function(x){ return x.ok && x.d==="hard"; }).length;
    var short=L.filter(function(x){ return x.ty==="short"; }).length;
    var acc = n>=10 ? Math.round(okCnt/n*100) : 0;
    var dailyDone = 0;
    try{ var dr=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); if(dr.date===todayKey()) dailyDone=1; }catch(e){}
    return {count:n, combo:maxCombo, hard:hard, short:short, acc:acc, daily:dailyDone};
  }
  function questValue(q, p){ return p[q.type] || 0; }
  window.quests=quests; window.questProgress=questProgress; window.questValue=questValue; window.QTEMPL=QTEMPL;

  var CHEST_KEY="dsh-chest-v1";
  function openChest(){
    var roll=Math.random(), msg="", dust=0, coin=0;
    if(roll<0.10){ dust=3; msg="💎 稀有宝箱：星尘 ×3"; addDust(3); }
    else if(roll<0.45){ coin=Math.round(30+Math.random()*40); msg="🎁 宝箱：金币 +"+coin; addCoins(coin); }
    else { dust=1; msg="🎁 宝箱：星尘 ×1"; addDust(1); }
    try{ var c=JSON.parse(localStorage.getItem(CHEST_KEY)||'{"n":0}'); c.n=(c.n||0)+1; localStorage.setItem(CHEST_KEY,JSON.stringify(c)); }catch(e){}
    setTimeout(function(){ toast(msg, true); beep(880,0.18,"triangle",0.07); }, 700);
    if(window.__refreshProfile) window.__refreshProfile();
  }
  window.openChest=openChest;

  function claimQuest(id){
    var Q=quests(), meta=null;
    QTEMPL.forEach(function(x){ if(x.id===id) meta=x; });
    if(!meta) return {ok:false,msg:"任务不存在"};
    if(Q.claimed.indexOf(id)>=0) return {ok:false,msg:"已经领过了"};
    var p=questProgress();
    if(questValue(meta,p) < meta.target) return {ok:false,msg:"还没完成"};
    Q.claimed.push(id);
    try{ localStorage.setItem(QKEY,JSON.stringify(Q)); }catch(e){}
    if(meta.r.coin) addCoins(meta.r.coin);
    if(meta.r.dust) addDust(meta.r.dust);
    toast("任务完成 · "+meta.n+" · +"+(meta.r.coin?meta.r.coin+" 币":meta.r.dust+" 星尘"), true);
    beep(1046,0.16,"triangle",0.07);
    if(window.__refreshProfile) window.__refreshProfile();
    return {ok:true,msg:"已领取"};
  }
  window.claimQuest=claimQuest;
  window.awardForQ=awardForQ; window.lbOpen=lbOpen; window.lbClose=lbClose; window.lbInit=lbInit;
  window.awardXP=awardXP; window.checkBadges=checkBadges;
  window.GAME={db:db,levelOf:levelOf,BADGES:BADGES,bdb:bdb,todayCount:todayCount,streakDays:streakDays,
    GOAL:GOAL,coins:readCoins,inv:readInv,buffs:readBuffs,SHOP:SHOP,buy:buy,equipTheme:equipTheme,
    equipTitle:equipTitle,toast:toast,applyTheme:applyTheme,addCoins:addCoins,addDust:addDust,
    shieldCount:shieldCount,toggleSfx:toggleSfx,sfxOn:function(){return SFX_ON;},beep:beep};

  var EXAM_LIST=[
    ["English",  "2026-11-23", "P1–P2"],
    ["Science",  "2026-11-24", "P3–P4"],
    ["Maths",    "2026-11-25", "P3–P4"],
    ["History",  "2026-11-26", "P1"],
    ["Geography","2026-11-26", "P2"],
    ["PDHPE",    "2026-11-26", "P5"],
    ["Electives","2026-11-27", "P1–P2"]
  ];
  function daysTo(iso){
    var d=new Date(iso+"T00:00:00"), now=new Date(); now.setHours(0,0,0,0);
    return Math.round((d-now)/864e5);
  }
  function nextExam(){
    for(var i=0;i<EXAM_LIST.length;i++){
      var n=daysTo(EXAM_LIST[i][1]);
      if(n>=0) return {name:EXAM_LIST[i][0], date:EXAM_LIST[i][1], per:EXAM_LIST[i][2], days:n};
    }
    return null;
  }

  function renderQuests(host){
    if(!host) return;
    var Q=quests(), p=questProgress();
    host.innerHTML = Q.list.map(function(id){
      var m=null; QTEMPL.forEach(function(x){ if(x.id===id) m=x; });
      var v=Math.min(questValue(m,p), m.target), pct=Math.round(v/m.target*100);
      var done=v>=m.target, claimed=Q.claimed.indexOf(id)>=0;
      var right = claimed ? '<span class="qdone">已领取</span>'
                : (done ? '<button class="qbtn" data-claim="'+id+'">领取</button>'
                        : '<span class="qnum">'+v+'/'+m.target+'</span>');
      return '<div class="qrow'+(done?' done':'')+'">'+
        '<span class="qtip">'+m.tip+'</span>'+
        '<span class="qname">'+m.n+'</span>'+
        '<span class="qbar"><i style="width:'+pct+'%"></i></span>'+right+'</div>';
    }).join("");
  }
  window.__renderQuests=renderQuests;

  /* ---- 好友榜：不用服务器，靠“战绩码”互传 ---- */
  var FKEY="dsh-friends-v1", NKEY="dsh-nick", AKEY="dsh-api";
  var DEFAULT_API = "https://bbc-quiz-board.chrisguo927.workers.dev";
  function apibase(){ try{ return (localStorage.getItem(AKEY)||DEFAULT_API||"").replace(/\/$/,""); }catch(e){ return ""; } }
  function setApi(v){ try{ localStorage.setItem(AKEY,(v||"").trim().replace(/\/$/,"")); }catch(e){} }
  function loadBoard(){
    var box=document.getElementById("rankbox"); if(!box||!apibase()) return;
    fetch(apibase()+"/board?day="+encodeURIComponent(todayKey()))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok || !d.list || !d.list.length) return;
        var me=nick()||"我";
        box.innerHTML=d.list.map(function(x,i){
          return '<div class="rrow'+(x.name===me?' me':'')+'"><span class="rn">'+(i+1)+'</span>'+
                 '<span class="rname">'+x.name+(x.name===me?'（我）':'')+'</span>'+
                 '<span class="rp">'+x.pct+'%</span></div>';
        }).join("");
      })
      .catch(function(){});
  }
  function pushScore(){
    if(!apibase()) return {ok:false,msg:"还没设置服务器地址"};
    var rec={}; try{ rec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    if(rec.date!==todayKey()) return {ok:false,msg:"先做完今日挑战"};
    fetch(apibase()+"/score",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:nick()||"我", pct:rec.best||0, answered:rec.answer||21, day:rec.date})})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok) loadBoard(); })
      .catch(function(){});
    return {ok:true,msg:"已提交"};
  }
  window.loadBoard=loadBoard; window.pushScore=pushScore; window.apibase=apibase; window.setApi=setApi;
  function b64e(str){ try{ return btoa(unescape(encodeURIComponent(str))).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_"); }catch(e){ return ""; } }
  function b64d(str){ try{ return decodeURIComponent(escape(atob(str.replace(/-/g,"+").replace(/_/g,"/")))); }catch(e){ return ""; } }
  function nick(){ try{ return localStorage.getItem(NKEY)||""; }catch(e){ return ""; } }
  function setNick(v){ try{ localStorage.setItem(NKEY, v); }catch(e){} }
  function friends(){ try{ return JSON.parse(localStorage.getItem(FKEY)||"[]"); }catch(e){ return []; } }
  function saveFriends(a){ try{ localStorage.setItem(FKEY, JSON.stringify(a.slice(0,60))); }catch(e){} }

  function myCode(){
    var rec={}; try{ rec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    if(rec.date!==todayKey()) return {ok:false,msg:"先做完今日挑战"};
    var g=db();
    return {ok:true, code:b64e(JSON.stringify({v:1,d:rec.date,p:rec.best,n:rec.answer||21,
      name:(nick()||"我"), xp:g.xp||0}))};
  }
  function addCode(str){
    var raw=b64d((str||"").trim());
    if(!raw) return {ok:false,msg:"码不对"};
    var o; try{ o=JSON.parse(raw); }catch(e){ return {ok:false,msg:"码不对"}; }
    if(!o || o.v!==1 || !o.d || o.p===undefined) return {ok:false,msg:"码不对"};
    var list=friends();
    list=list.filter(function(x){ return !(x.d===o.d && x.name===o.name); });
    list.push({d:o.d, p:o.p, n:o.n||0, name:String(o.name||"同学").slice(0,12), xp:o.xp||0, t:Date.now()});
    saveFriends(list);
    return {ok:true,msg:"已加入 "+String(o.name||"同学").slice(0,12)+" 的 "+o.p+"%"};
  }
  window.myCode=myCode; window.addCode=addCode; window.nick=nick; window.setNick=setNick;

  function renderBoard(host){
    if(!host) return;
    var g=db(), L=log();
    var day=document.getElementById("boardday");
    if(day) day.textContent = todayKey();

    var myRec={}; try{ myRec=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); }catch(e){}
    var rows=[];
    if(myRec.date===todayKey()) rows.push({name:nick()||"我", p:myRec.best||0, me:true});
    friends().filter(function(x){ return x.d===todayKey(); }).forEach(function(x){
      rows.push({name:x.name, p:x.p, me:false});
    });
    rows.sort(function(a,b){ return b.p-a.p; });

    var list = rows.length ? rows.map(function(r,i){
      return '<div class="rankrow'+(r.me?' me':'')+'"><span class="rk">'+(i+1)+'</span>'+
        '<span class="rname">'+r.name+(r.me?'（我）':'')+'</span>'+
        '<span class="rpct">'+r.p+'%</span></div>';
    }).join("") : '<div class="mutedsmall">今天还没人交榜。做完今日挑战后点「提交」，或复制战绩码发给同学互换。</div>';

    var days={}, dayOk={};
    L.forEach(function(x){ var d=new Date(x.t); d.setHours(0,0,0,0);
      var k=d.getTime(); days[k]=(days[k]||0)+1; dayOk[k]=(dayOk[k]||0)+(x.ok?1:0); });
    var last7=Object.keys(days).map(function(k){
      return {ts:+k, pct:Math.round(dayOk[k]/days[k]*100)}; })
      .sort(function(a,b){ return b.ts-a.ts; }).slice(0,7).reverse();
    var spark = last7.length>1 ? ('<div class="spark">'+last7.map(function(x){
        return '<i style="height:'+Math.max(3,Math.round(x.pct*0.3))+'px" title="'+x.pct+'%"></i>';
      }).join("")+'<span class="sparklab">近 7 天正确率</span></div>') : "";

    host.innerHTML =
      '<div class="ranklist" id="rankbox">'+list+'</div>'+
      spark +
      '<div class="codebar"><button class="btn2" id="mecode">复制我的战绩码</button>'+
      '<input id="friendcode" placeholder="粘贴同学的战绩码">'+
      '<button class="btn2" id="addcode">加入</button>'+
      (apibase() ? '<button class="btn2" id="pushscore">提交到服务器</button>' : '')+'</div>';
  }
  window.__renderBoard=renderBoard;

  function renderProfile(){
    var host=document.getElementById("profile");
    if(!host) return;
    var g=db(), xp=g.xp||0, lv=levelOf(xp), nx=nextAt(xp), prev=LEVELS[lv-1]||0;
    var pct = nx ? Math.round((xp-prev)/(nx-prev)*100) : 100;
    var tc=todayCount(), st=streakDays(), b=bdb(), inv=readInv(), c=readCoins();
    var title = inv.equipped && inv.equipped.title ? '<span class="ptitle">'+inv.equipped.title+'</span>' : '';
    var ne = nextExam();
    var dd = ne ? ne.days : null;
    var badgeHtml = BADGES.map(function(x){
      return '<span class="badge'+(b[x.id]?' on':'')+'" title="'+x.n+' · '+x.d+'">'+
             (BADGE_SVG[x.id]||"")+'</span>';
    }).join("");
    host.innerHTML =
      '<div class="hero-top">'+
        '<span class="lvp">Lv.'+lv+'</span>'+
        '<span class="xpv">'+xp+'</span>'+
        '<span style="font-size:12px;color:var(--dim)">XP'+(nx?' · 还差 '+(nx-xp)+' 升级':'')+'</span>'+
        title+'<span class="grow"></span>'+
        (ne?'<span class="cd">下一场 '+ne.name+' · '+(+ne.date.slice(5,7))+'/'+(+ne.date.slice(8,10))+' · <b>'+ne.days+'</b> 天后</span>':'')+
      '</div>'+
      '<div class="xpbar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="metaline">'+
        '<span>今日 <b>'+tc+'</b>/'+GOAL+'</span>'+
        '<span>连续 <b>'+st+'</b> 天</span>'+
        '<span>连对纪录 <b>'+(g.best||0)+'</b></span>'+
        '<span>金币 <b>'+(c.n||0)+'</b></span>'+
        '<span>星尘 <b>'+(c.dust||0)+'</b></span>'+
        '<button class="sfxbtn" id="sfxbtn">'+(SFX_ON?'音效 开':'音效 关')+'</button>'+
      '</div>'+
      '<div class="badges">'+badgeHtml+'</div>';
  }
  function renderAll(){
    renderProfile();
    setTimeout(loadBoard, 0);
    renderQuests(document.getElementById("quests"));
    renderBoard(document.getElementById("board"));
  }
  window.__refreshProfile=renderAll;
  document.addEventListener("click", function(ev){
    var s = ev.target.closest && ev.target.closest("#sfxbtn");
    if(s){ var on = toggleSfx(); s.textContent = on ? "音效 开" : "音效 关"; return; }
    var q = ev.target.closest && ev.target.closest("[data-claim]");
    if(q){ claimQuest(q.getAttribute("data-claim")); renderAll(); return; }
    if(ev.target.closest && ev.target.closest("#mecode")){
      if(!nick()){ var nm=prompt("给自己起个名字（显示在好友榜）",""); if(nm) setNick(nm.slice(0,12)); }
      var r=myCode();
      if(!r.ok){ toast(r.msg,false); return; }
      var ta=document.createElement("textarea"); ta.value=r.code;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("战绩码已复制，发给同学吧", true); }
      catch(e){ toast("复制失败，手动选中："+r.code.slice(0,20)+"…", false); }
      ta.remove();
      return;
    }
    if(ev.target.closest && ev.target.closest("#cfgapi")){
      var cur=apibase();
      var v=prompt("填入 Cloudflare Worker 地址（留空则清除）", cur);
      if(v===null) return;
      setApi(v);
      toast(v.trim()?"已保存，正在拉取云端榜…":"已清除服务器地址", true);
      renderAll(); return;
    }
    if(ev.target.closest && ev.target.closest("#pushscore")){
      var r2=pushScore(); toast(r2.msg, r2.ok); return;
    }
    if(ev.target.closest && ev.target.closest("#addcode")){
      var inp=document.getElementById("friendcode");
      var res=addCode(inp?inp.value:"");
      toast(res.msg, res.ok); renderAll(); return;
    }
  });
  applyTheme();
  if(document.readyState!=='loading'){ renderAll(); if(window.lbInit) lbInit(); }
  else document.addEventListener('DOMContentLoaded', function(){ renderAll(); if(window.lbInit) lbInit(); });
})();

</script>
</body>
</html>
