  var r=document.documentElement;

}catch(e){}})();</script><meta charset="utf-8">

/* ══ foundations ═════════════════════════════════════════ */
:root{
  /* type */
  --font-sans:"Geist Variable","Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

  --text-2xl:28px; --text-xl:20px; --text-lg:17px; --text-md:15px;

  --lh-tight:1.25; --lh-snug:1.45; --lh-base:1.6; --lh-prose:1.75;
  /* space (4px scale) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  /* radius */
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-full:999px;
  /* layout */
  --page-max:1120px;
  --read-max:760px;
  --page-x:32px;
  /* motion */

  --fast:.12s; --norm:.2s;
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font-sans);
  font-size:var(--text-base);
  line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv11";
  font-synthesis-weight:none;
  transition:background-color var(--norm) var(--ease),color var(--norm) var(--ease);
}
body,body *{-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{letter-spacing:-.015em;line-height:var(--lh-tight);font-weight:600}
h1{font-size:var(--text-2xl)}
h2{font-size:var(--text-xl)}
h3{font-size:var(--text-md)}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
::selection{background:var(--accent-soft);color:var(--foreground)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
hr{border:0;border-top:1px solid var(--border);margin:var(--s6) 0}
code,kbd,samp{font-family:var(--font-mono);font-size:.92em}
kbd{background:var(--surface-secondary);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:var(--r-sm);padding:1px 6px;color:var(--muted);font-size:11px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* 数字统一等宽，避免跳动 */
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ══ 共享顶栏（首页 / 商城 / 错题本）═════════════════════ */
.topbar{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--background) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border)}
.topbar-in{max-width:var(--page-max);margin:0 auto;padding:0 var(--page-x);
  height:56px;display:flex;align-items:center;gap:var(--s4)}
.brand{display:inline-flex;align-items:center;gap:9px;color:var(--foreground);
  text-decoration:none;font-weight:600;font-size:13.5px;letter-spacing:-.01em;flex:0 0 auto}
.brand:hover{text-decoration:none}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);
  color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;
  font-weight:600;font-family:var(--font-mono);line-height:1}
.nav{display:flex;align-items:center;gap:1px;min-width:0;overflow:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:12.5px;color:var(--muted);padding:5px 9px;border-radius:var(--r-sm);
  text-decoration:none;white-space:nowrap;
  transition:color var(--fast) var(--ease),background-color var(--fast) var(--ease)}
.nav a:hover{color:var(--foreground);background:var(--surface-secondary);text-decoration:none}
.nav a.on{color:var(--foreground);font-weight:500}
.grow{flex:1}
@media (max-width:720px){
  .topbar-in{height:auto;flex-wrap:wrap;gap:8px;padding:9px var(--page-x) 0}
  .brand .bname{display:none}
  .topbar .nav{order:10;width:100%;margin:2px calc(-1 * var(--page-x)) 0;
    padding:0 var(--page-x) 8px;border-top:1px solid var(--border)}
  .topbar .themectl{margin-left:auto}
}

/* 分段控件选中态 */
.seg button.on{border-color:var(--foreground)!important}

/* ══ components ══════════════════════════════════════════ */
.btn,.btn-ghost,.btn2{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:13px;font-weight:500;line-height:1;
  height:34px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color var(--fast) var(--ease),border-color var(--fast) var(--ease),
    color var(--fast) var(--ease),opacity var(--fast) var(--ease);
  text-decoration:none;
}
.btn{
  background:var(--primary);color:var(--primary-foreground);
  border-color:var(--primary);
}
.btn:hover{opacity:.88;text-decoration:none}
.btn:active{transform:translateY(.5px)}
.btn:disabled,.btn[disabled]{background:var(--surface-secondary);color:var(--muted);
  border-color:var(--border);opacity:1;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost,.btn.ghost,.btn2{
  background:var(--surface);color:var(--foreground);border-color:var(--border);
}
.btn-ghost:hover,.btn.ghost:hover,.btn2:hover{
  background:var(--surface-secondary);border-color:var(--border-strong);text-decoration:none;
}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed;background:var(--surface)}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--r-sm)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{opacity:.9;color:#fff}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s5);box-shadow:none;
}
.input,input[type="text"],input[type="search"],input[type="number"],textarea,select{
  font-family:inherit;font-size:var(--text-base);color:var(--foreground);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 11px;outline:none;transition:border-color var(--fast) var(--ease),
    box-shadow var(--fast) var(--ease);
}
.input:hover,input:hover,textarea:hover,select:hover{border-color:var(--border-strong)}
.input:focus,input:focus,textarea:focus,select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
::placeholder{color:var(--muted);opacity:.85}

.chip,.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--text-xs);line-height:1.6;font-weight:500;
  padding:2px 8px;border-radius:var(--r-sm);
  background:var(--surface-secondary);border:1px solid var(--border);color:var(--muted);
  white-space:nowrap;
}

/* 主题切换控件 */
.themectl{display:inline-flex;align-items:center;gap:2px;padding:2px;
  background:var(--surface-secondary);border:1px solid var(--border);border-radius:var(--r-sm)}
.themectl button{
  font:inherit;font-size:11.5px;font-weight:500;line-height:1;height:24px;padding:0 9px;
  border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;
  transition:background-color var(--fast) var(--ease),color var(--fast) var(--ease);
}
.themectl button:hover{color:var(--foreground)}
.themectl button.on{background:var(--surface);color:var(--foreground);
  box-shadow:var(--shadow-sm)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);height:28px;padding:0 10px;cursor:pointer;
  transition:color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.themebtn:hover{color:var(--foreground);border-color:var(--border-strong)}
.themebtn b{color:var(--foreground);font-weight:500}

/* 浅色下别让深色主题的重阴影漏过来 */
@media (prefers-color-scheme: light){

}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:900px){ :root{--page-x:20px} }
@media (max-width:560px){ :root{--page-x:16px} }

</div>
<script>

(function(){
  var KEY="dsh-xp-v1", BKEY="dsh-badges-v1", GOAL=30;
  var COIN_KEY="dsh-coins-v1", INV_KEY="dsh-inv-v1", BUFF_KEY="dsh-buffs-v1";
  var LEVELS=[0,60,150,280,450,680,980,1360,1820,2360,3000,3750,4600,5560,6650,7880,9250,10800,12500,14400];
  function db(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{"xp":0,"combo":0,"best":0}'); }catch(e){ return {xp:0,combo:0,best:0}; } }
  function save(g){ try{ localStorage.setItem(KEY,JSON.stringify(g)); }catch(e){} }
  function bdb(){ try{ return JSON.parse(localStorage.getItem(BKEY)||'{}'); }catch(e){ return {}; } }
  function bsave(b){ try{ localStorage.setItem(BKEY,JSON.stringify(b)); }catch(e){} }
  function log(){ try{ return JSON.parse(localStorage.getItem('dsh-log-v1')||'[]'); }catch(e){ return []; } }
  function levelOf(xp){ var l=1; for(var i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) l=i+1; } return l; }
  function nextAt(xp){ var l=levelOf(xp); return LEVELS[l]!==undefined?LEVELS[l]:null; }

  /* ---------- 金币 / 库存 / 增益 ---------- */
  function readCoins(){ var o={n:0,earned:0,dust:0}; try{ o=JSON.parse(localStorage.getItem(COIN_KEY)||'null')||o; }catch(e){} if(o.dust===undefined)o.dust=0; return o; }
  function saveCoins(o){ try{ localStorage.setItem(COIN_KEY,JSON.stringify(o)); }catch(e){} }
  function addCoins(n){ var c=readCoins(); c.n=(c.n||0)+n; c.earned=(c.earned||0)+Math.max(0,n); saveCoins(c); }
  function addDust(n){ var c=readCoins(); c.dust=(c.dust||0)+n; saveCoins(c); }

/* ═══════════════════════════════════════════════════════════════
   RX · 统一奖励引擎（Gamification 2.0）
   - 所有 XP / 金币 / 星尘 只能通过 RX.award() / RX.spend() 变动
   - 每次变动写一条流水（dsh-tx-v1），带幂等键，同一事件不可能发两次
   - 每日上限：XP 600 / 金币 300 / 星尘 6
   - 简答题按 AI 实际得分比例发奖；判分失败不发奖（ratio=null）
   - 掌握度（dsh-mastery-v1）：带时间衰减的 EMA + 间隔要求，重复刷同一题不会虚高
   ═══════════════════════════════════════════════════════════════ */
var TX_KEY = "dsh-tx-v1", CAP_KEY = "dsh-caps-v1", MAS_KEY = "dsh-mastery-v1";
var RX_CAPS = { xp: 600, coin: 300, dust: 6 };
var RX_TX_MAX = 500;

function rxDay(ts) {
  var d = ts ? new Date(ts) : new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function rxHash(s) {
  var h = 2166136261, str = String(s == null ? "" : s);
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function rxRead(key, dflt) {
  try { var v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? dflt : v; }
  catch (e) { return dflt; }
}
function rxWrite(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

/* ── 流水 ─────────────────────────────────────────── */
function rxTx() { var a = rxRead(TX_KEY, []); return Array.isArray(a) ? a : []; }
function rxHasTx(key) {
  var a = rxTx();
  for (var i = 0; i < a.length; i++) if (a[i] && a[i].k === key) return true;
  return false;
}
function rxPushTx(rec) {
  var a = rxTx();
  a.push(rec);
  if (a.length > RX_TX_MAX) a = a.slice(a.length - RX_TX_MAX);
  rxWrite(TX_KEY, a);
  return rec;
}

/* ── 每日额度 ─────────────────────────────────────── */
function rxCaps() {
  var day = rxDay(), c = rxRead(CAP_KEY, null);
  if (!c || c.date !== day) c = { date: day, xp: 0, coin: 0, dust: 0 };
  return c;
}
function rxSaveCaps(c) { rxWrite(CAP_KEY, c); }
function rxCapLeft(cur) {
  var c = rxCaps();
  return { xp: Math.max(0, RX_CAPS.xp - (c.xp || 0)),
           coin: Math.max(0, RX_CAPS.coin - (c.coin || 0)),
           dust: Math.max(0, RX_CAPS.dust - (c.dust || 0)) };
}

/* ── 掌握度 ───────────────────────────────────────── */
var RX_STAGE = ["未开始", "初学", "发展中", "基本掌握", "已掌握"];
function rxMas() { var m = rxRead(MAS_KEY, {}); return (m && typeof m === "object") ? m : {}; }
function rxMasSave(m) { rxWrite(MAS_KEY, m); }

/** 老数据迁移：dsh-seen-v1 {n,right,sealed} → 掌握度骨架（只读旧值，不删旧 key） */
function rxMigrateSeen() {
  if (rxRead("dsh-rx-migrated", 0)) return;
  var seen = rxRead("dsh-seen-v1", {}), mas = rxMas(), n = 0;
  try {
    Object.keys(seen || {}).forEach(function (qid) {
      if (mas[qid]) return;
      var e = seen[qid] || {};
      var ok = e.right ? 1 : 0;
      mas[qid] = {
        n: Math.max(1, e.n || 1), ok: ok, streak: ok,
        ema: ok ? 0.55 : 0.15, last: 0, iv: 1,
        stage: e.sealed ? 4 : (ok ? 3 : 1)
      };
      n++;
    });
    rxMasSave(mas);
    rxWrite("dsh-rx-migrated", 1);
    if (n) console.log("[RX] migrated " + n + " questions from dsh-seen-v1");
  } catch (e) {}
}

/** 记录一次作答，返回 {stage, ema, gainStage, review} */
function rxMastery(qid, ratio, opts) {
  opts = opts || {};
  var mas = rxMas(), now = Date.now(), e = mas[qid] || null;
  var day = 864e5;
  var prevStage = e ? (e.stage || 0) : 0;
  if (!e) e = { n: 0, ok: 0, streak: 0, ema: 0, last: 0, iv: 0, stage: 0 };

  // 间隔（天）：用于衰减与"间隔复习"判定
  var gapDays = e.last ? (now - e.last) / day : 0;
  if (gapDays > 0) {
    // 时间衰减：每过 7 天，旧印象打 0.85 折（上限 60% 衰减）
    var decay = Math.pow(0.85, Math.min(8, Math.floor(gapDays / 7)));
    e.ema = (e.ema || 0) * decay;
  }
  var r = Math.max(0, Math.min(1, ratio == null ? 0 : ratio));
  // 带权重 EMA：第一次直接取分，之后 0.65 旧 + 0.35 新
  e.ema = e.n === 0 ? r : (0.65 * (e.ema || 0) + 0.35 * r);
  e.n = (e.n || 0) + 1;
  if (r >= 0.9) { e.ok = (e.ok || 0) + 1; e.streak = (e.streak || 0) + 1; }
  else { e.streak = 0; if (r > 0 && !e.ok) e.ok = 0; }
  if (gapDays >= 1) e.iv = (e.iv || 0) + (r >= 0.9 ? 1 : 0);
  e.last = now;

  // 分档：既要分数，也要次数和间隔，避免"同一道题连点三次就 Mastered"
  var ema = e.ema, st = 0;
  if (e.n >= 1) st = 1;
  if (ema >= 0.55 && e.n >= 2 && e.streak >= 2) st = 2;
  if (ema >= 0.72 && e.n >= 3 && e.streak >= 2 && e.iv >= 1) st = 3;
  if (ema >= 0.88 && e.n >= 4 && e.streak >= 3 && e.iv >= 2) st = 4;
  if (e.sealed) st = Math.max(st, 4);
  e.stage = Math.max(prevStage >= 4 ? 4 : 0, st);
  mas[qid] = e;
  rxMasSave(mas);
  return { stage: e.stage, prev: prevStage, ema: e.ema, n: e.n, review: (e.n > 1 && gapDays >= 1) };
}

function rxMasteryOf(qid) {
  var e = rxMas()[qid];
  if (!e) return { stage: 0, ema: 0, n: 0 };
  return e;
}

/* ── 奖励计算 ─────────────────────────────────────── */
var RX_DIFF = { easy: 0.8, medium: 1.0, hard: 1.4 };

/**
 * 发放一次奖励。
 * o = {
 *   kind: "answer"|"exam"|"quest"|"achievement"|"chest"|"mastery"|"review",
 *   src:  "sci" 之类的来源,
 *   qid, diff, type,
 *   ratio: 0..1（简答用 AI 得分比例；选择题 1/0；null = 判分失败 → 不发奖）
 *   answer: 学生答案原文（用于幂等键）
 *   base: 可选，覆盖基础 XP
 *   key: 可选，自定义幂等键
 * }
 * 返回 {xp, coin, dust, capped, dup, stage, stageUp}
 */
function rxAward(o) {
  o = o || {};
  var day = rxDay(), now = Date.now();
  var ratio = (o.ratio == null) ? null : Math.max(0, Math.min(1, o.ratio));
  var out = { xp: 0, coin: 0, dust: 0, capped: 0, dup: false, stage: 0, stageUp: 0, reason: "" };

  // 判分失败：不发奖，只记录（便于排查），也不写流水污染账本
  if (ratio == null && o.kind === "answer") { out.reason = "no-score"; return out; }

  // 先取"作答前"的掌握度：重复递减必须基于历史，不能用刚刚更新的状态
  var prevMas = o.qid ? rxMasteryOf(o.qid) : { stage: 0, ema: 0, n: 0, ok: 0 };
  // 掌握度（选择题也走：correct → 1，错误 → 0）
  var mres = null;
  if (o.qid && o.ratio != null) {
    mres = rxMastery(o.qid, ratio, o);
    out.stage = mres.stage;
    out.stageUp = mres.stage > mres.prev ? mres.stage : 0;
  }

  // 幂等键：同一天、同一题、同一答案、同一分数 → 只发一次
  var key = o.key || [
    o.kind || "answer", o.qid || "-", o.diff || "-",
    (o.answer ? rxHash(String(o.answer).slice(0, 120)) : "-"),
    ratio == null ? "na" : ratio.toFixed(2), day
  ].join("|");
  if (rxHasTx(key)) { out.dup = true; out.reason = "dup"; return out; }

  var base = (typeof o.base === "number") ? o.base : 10;
  if (o.type === "short") base *= 1.2;
  var diffMul = RX_DIFF[o.diff] || 1;

  // 连击（只对答对/满分有加成）
  var g = db();
  if (ratio != null && ratio >= 0.9) g.combo = (g.combo || 0) + 1; else g.combo = 0;
  save(g);
  var comboMul = Math.min(1.5, 1 + 0.08 * Math.max(0, (g.combo || 1) - 1));

  // 重复递减：已掌握/已答对过的题降权
  var mul = 1, note = "";
  var prev = prevMas;
  if (o.kind === "answer" && o.qid) {
    if (prev.stage >= 4 && ratio >= 0.9) { mul = 0; note = "已掌握 · 重复练习不计经验"; }
    else if ((prev.ok || 0) >= 1 && ratio >= 0.9) { mul = 0.3; note = "重做已会的题 · ×0.3"; }
    else if ((prev.ok || 0) >= 1 && ratio > 0 && ratio < 0.9) { mul = 0.6; note = "部分得分 · ×0.6"; }
  }

  var buffs = readBuffs ? readBuffs() : {};
  var buffMul = (buffs && buffs.xp2Until && now < buffs.xp2Until) ? 2 : 1;

  var rawXp = base * diffMul * (ratio || 0) * comboMul * mul * buffMul;
  var xp = Math.max(0, Math.round(rawXp));
  var coin = (o.kind === "answer") ? Math.round(xp * 0.5) : 0;

  // 每日上限（含道具加成后的真实发放值，避免双倍卡绕过）
  var left = rxCapLeft();
  if (xp > left.xp) { out.capped = 1; xp = left.xp; coin = Math.min(coin, Math.round(xp * 0.5)); }
  if (coin > left.coin) { out.capped = 1; coin = left.coin; }
  if (mul === 0) { xp = 0; coin = 0; }

  if (xp > 0 || coin > 0) {
    var c = rxCaps();
    c.xp = (c.xp || 0) + xp; c.coin = (c.coin || 0) + coin;
    rxSaveCaps(c);

    var gg = db();
    var before = levelOf(gg.xp || 0);
    gg.xp = (gg.xp || 0) + xp;
    gg.best = Math.max(gg.best || 0, gg.combo || 0);
    save(gg);
    if (coin > 0) addCoins(coin);
    out.xp = xp; out.coin = coin;
    out.levelUp = levelOf(gg.xp) > before;

    rxPushTx({
      id: o.kind + "-" + now.toString(36) + "-" + rxHash(key).slice(0, 5),
      k: key, type: o.kind, cur: "xp+coin", xp: xp, coin: coin, dust: 0,
      src: o.src || "", qid: o.qid || "", ts: now,
      meta: { ratio: ratio, diff: o.diff, type: o.type, mul: mul, combo: g.combo, capped: out.capped }
    });
  }

  // 掌握度里程碑（每档只发一次）
  if (mres && out.stageUp >= 2) {
    var mk = "ms|" + o.qid + "|" + out.stageUp;
    if (!rxHasTx(mk)) {
      var rew = out.stageUp >= 4 ? { xp: 40, dust: 2 } :
                out.stageUp >= 3 ? { xp: 25, dust: 1 } : { xp: 12, dust: 0 };
      var cl = rxCapLeft();
      var mxp = Math.min(rew.xp, cl.xp), mdust = Math.min(rew.dust || 0, cl.dust);
      var cc = rxCaps();
      cc.xp += mxp; cc.dust += mdust; rxSaveCaps(cc);
      var g2 = db(); g2.xp = (g2.xp || 0) + mxp; save(g2);
      if (mdust) addDust(mdust);
      if (mxp) out.xp += mxp;
      if (mdust) out.dust += mdust;
      rxPushTx({ id: "ms-" + now.toString(36), k: mk, type: "mastery",
                 cur: "xp+dust", xp: mxp, coin: 0, dust: mdust,
                 src: o.src || "", qid: o.qid, ts: now,
                 meta: { stage: out.stageUp, stageName: RX_STAGE[out.stageUp] } });
      out.reason = "mastery:" + RX_STAGE[out.stageUp];
      try { toast("掌握度提升 · " + RX_STAGE[out.stageUp] + " · +" + mxp + " XP" +
                  (mdust ? " +" + mdust + " 星尘" : ""), true); } catch (e) {}
    }
  }

  if (note && xp === 0 && !out.dup) out.reason = note;
  return out;
}

/** 直接花钱（商城），带流水与余额校验 */
function rxSpend(kind, amount, cur, itemId) {
  var c = readCoins(), bal = cur === "dust" ? (c.dust || 0) : (c.n || 0);
  if (bal < amount) return { ok: false, msg: "余额不足" };
  if (cur === "dust") c.dust = bal - amount; else c.n = bal - amount;
  saveCoins(c);
  var now = Date.now();
  rxPushTx({ id: "sp-" + now.toString(36), k: "sp|" + itemId + "|" + now,
             type: "spend", cur: cur, xp: 0, coin: cur === "dust" ? 0 : amount,
             dust: cur === "dust" ? amount : 0, src: kind || "shop",
             qid: "", ts: now, meta: { item: itemId } });
  return { ok: true };
}

/** 星尘兑换金币：给星尘一个无限消耗口，避免稀有资源通胀 */
function rxExchange(dust, coin){
  var sp = rxSpend("exchange", dust, "dust", "dust2coin");
  if(!sp.ok) return sp;
  var c = readCoins(); c.n = (c.n||0) + coin; saveCoins(c);
  var now = Date.now();
  rxPushTx({ id:"ex-" + now.toString(36), k:"ex|" + now, type:"exchange",
             cur:"mixed", xp:0, coin:coin, dust:0, src:"shop", qid:"", ts:now,
             meta:{ spentDust: dust } });
  return { ok:true, msg:"已用 " + dust + " 星尘兑换 " + coin + " 金币" };
}

/** 一次性奖励（成就 / 任务 / 宝箱 / 交卷），自带幂等键 */
function rxOnce(key, reward) {
  if (rxHasTx(key)) return { dup: true, xp: 0, coin: 0, dust: 0 };
  var cl = rxCapLeft();
  var xp = Math.min(reward.xp || 0, cl.xp);
  var coin = Math.min(reward.coin || 0, cl.coin);
  var dust = Math.min(reward.dust || 0, cl.dust);
  if (xp || coin || dust) {
    var c = rxCaps(); c.xp += xp; c.coin += coin; c.dust += dust; rxSaveCaps(c);
    var g = db(); g.xp = (g.xp || 0) + xp; save(g);
    if (coin) addCoins(coin);
    if (dust) addDust(dust);
    var now = Date.now();
    rxPushTx({ id: "on-" + now.toString(36), k: key, type: reward.kind || "once",
               cur: "mixed", xp: xp, coin: coin, dust: dust, src: reward.src || "",
               qid: reward.qid || "", ts: now, meta: reward.meta || {} });
  }
  return { dup: false, xp: xp, coin: coin, dust: dust };
}

/* 今日累计（给 UI 用） */
function rxToday() {
  var day = rxDay(), t = rxTx(), o = { xp: 0, coin: 0, dust: 0, n: 0 };
  for (var i = 0; i < t.length; i++) {
    var x = t[i];
    if (!x || x.type === "spend" || rxDay(x.ts) !== day) continue;
    o.xp += x.xp || 0; o.coin += x.coin || 0; o.dust += x.dust || 0; o.n++;
  }
  return o;
}

window.RX = {
  award: rxAward, once: rxOnce, spend: rxSpend, exchange: rxExchange,
  tx: rxTx, today: rxToday, caps: rxCaps, capLeft: rxCapLeft,
  mastery: rxMasteryOf, mas: rxMas, stageName: function (s) { return RX_STAGE[s] || RX_STAGE[0]; },
  STAGE: RX_STAGE, CAPS: RX_CAPS, day: rxDay, hash: rxHash

  var SFX_ON = (function(){ try{ return localStorage.getItem("dsh-sfx")!=="0"; }catch(e){ return true; } })();
  var AC=null;
  function beep(freq, dur, type, vol){
    if(!SFX_ON) return;
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(vol||0.06, AC.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(dur||0.12));
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime+(dur||0.12)+0.02);
    }catch(e){}
  }

  function buy(id){
    var item=null; SHOP.forEach(function(x){ if(x.id===id) item=x; });
    if(!item) return {ok:false,msg:"没有这件商品"};
    if(item.t==="exchange") return RX.exchange(item.p, item.v);
    var c=readCoins(), inv=readInv();
    if(item.t!=="use" && inv.owned.indexOf(id)>=0) return {ok:false,msg:"已经拥有了"};
    var isDust = item.cur==="dust";
    var bal = isDust ? (c.dust||0) : (c.n||0);
    if(bal < item.p) return {ok:false,msg:(isDust?"星尘":"金币")+"不够，还差 "+(item.p-bal)};
    var sp = RX.spend("shop", item.p, isDust ? "dust" : "coin", id);
    if(!sp.ok) return {ok:false,msg:sp.msg||"支付失败"};
    if(item.t==="use"){ inv.uses[id]=(inv.uses[id]||0)+1; }
    else { inv.owned.push(id); }
    saveInv(inv);
    if(item.t==="theme"){ inv.equipped.theme=item.v; saveInv(inv); applyTheme(); }
    if(item.t==="title"){ inv.equipped.title=item.v; saveInv(inv); }
    if(item.t==="buff"){ var b=readBuffs(); b.xp2Until=Date.now()+30*60000; saveBuffs(b); }
    return {ok:true,msg:"已购买："+item.n};
  }

  function todayCount(){
    var d0=new Date(); d0.setHours(0,0,0,0), seen={}, n=0;
    log().forEach(function(x){
      if(x.t<d0.getTime() || !x.q) return;
      if(!seen[x.q]){ seen[x.q]=1; n++; }
    });
    return n;
  }
  function streakDays(){
    var days={}, d0=new Date(); d0.setHours(0,0,0,0), t0=d0.getTime();
    var perDay={};
    log().forEach(function(x){
      var d=new Date(x.t); d.setHours(0,0,0,0);
      var k=d.getTime(); perDay[k]=perDay[k]||{};
      perDay[k][x.q||"?"]=1;
    });
    Object.keys(perDay).forEach(function(k){
      if(Object.keys(perDay[k]).length>=1) days[+k]=1;
    });
    var gaps=shieldCount(), n=0, c=t0, used=0;
    while(true){
      if(days[c]){ n++; c-=864e5; continue; }
      if(c===t0){ c-=864e5; continue; }
      if(used<gaps){ used++; c-=864e5; continue; }
      break;
    }
    return n;
  }

  /* 成就条件用的累计统计（全部从日志/掌握度算，不做假数据） */
  function badgeStats(){
    var L=log(), byQ={};
    L.forEach(function(x){
      if(!x.q) return;
      var e=byQ[x.q] || (byQ[x.q]={ok:false,bad:false,ty:x.ty,d:x.d,s:x.s});
      if(x.ok) e.ok=true; else e.bad=true;
      if(x.ty) e.ty=x.ty; if(x.d) e.d=x.d; if(x.s) e.s=x.s;
    });
    var shortN=0, hardN=0, fixedN=0, subj={};
    Object.keys(byQ).forEach(function(k){
      var e=byQ[k];
      if(e.ty==="short") shortN++;
      if(e.ok && e.d==="hard") hardN++;
      if(e.ok && e.bad) fixedN++;
      if(e.s) subj[e.s]=1;
    });
    var mas=RX.mas(), mN=0, mOk=0, mTop=0;
    Object.keys(mas||{}).forEach(function(k){
      var st=(mas[k]||{}).stage||0;
      mN++; if(st>=2) mOk++; if(st>=4) mTop++;
    });
    var dailyN=0;
    try{ dailyN=(JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}").n)||0; }catch(e){}
    return {shortN:shortN, hardN:hardN, fixedN:fixedN,
            subjN:Object.keys(subj).length,
            masN:mN, masOk:mOk, masTop:mTop, dailyN:dailyN};
  }

  function checkBadges(){
    var g=db(), L=log();
    if(L.length>=1) unlock('first');
    if((g.best||0)>=5) unlock('combo5');
    if((g.best||0)>=10) unlock('combo10');
    if(todayCount()>=GOAL) unlock('daily');
    var st=streakDays();
    if(st>=3) unlock('streak3');
    if(st>=7) unlock('streak7');
    if(st>=30) unlock('streak30');
    try{
      var rv=JSON.parse(localStorage.getItem('dsh-review-v1')||'{}');
      if(L.length>10 && Object.keys(rv).length===0) unlock('review');
    }catch(e){}
    try{
      var cards=document.querySelectorAll('[data-slug][data-total]');
      for(var i=0;i<cards.length;i++){
        var c=cards[i], sl=c.dataset.slug, tot=+c.dataset.total;
        var s2=JSON.parse(localStorage.getItem('dsh-quiz-'+sl)||'null');
        if(s2 && s2.answers && tot && Object.keys(s2.answers).length>=tot){ unlock('subject'); break; }
      }
    }catch(e){}
    try{
      var bs=badgeStats();
      if(bs.shortN>=10) unlock('short10');
      if(bs.hardN>=20) unlock('hard20');
      if(bs.fixedN>=5) unlock('fix5');
      if(bs.subjN>=10) unlock('wide10');
      if(bs.masTop>=1) unlock('mastery1');
      if(bs.masN>=20 && bs.masOk/bs.masN>=0.6) unlock('master60');
      if(bs.dailyN>=7) unlock('daily7');
    }catch(e){}
  }

    ["关键词","keywords"],["，缺 "," , missing "],["自动","auto"]];
  function applyI18n(){
    if(window.LANG()==="zh") return;
    try{
      if(document.title.indexOf("Canvas 复习")>=0)
        document.title = document.title.replace("Canvas 复习", "Canvas Revision");
    }catch(e){}
    var walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n, changed=[];
    while((n=walker.nextNode())){
      var s=(n.nodeValue||"").trim(); if(!s) continue;
      if(I18N[s]){ n.nodeValue=n.nodeValue.replace(s, I18N[s]); continue; }
      var nv=n.nodeValue, did=false;
      for(var si=0; si<I18N_SUB.length; si++){
        if(nv.indexOf(I18N_SUB[si][0])>=0){ nv=nv.split(I18N_SUB[si][0]).join(I18N_SUB[si][1]); did=true; }
      }
      if(did){ n.nodeValue=nv; continue; }
      for(var i=0;i<I18N_PAT.length;i++){
        if(I18N_PAT[i][0].test(s)){ n.nodeValue=n.nodeValue.replace(s, s.replace(I18N_PAT[i][0], I18N_PAT[i][1])); break; }
      }
    }
    document.querySelectorAll("[placeholder]").forEach(function(el){
      var p=el.getAttribute("placeholder");
      if(I18N[p]) el.setAttribute("placeholder", I18N[p]);
    });
    document.querySelectorAll("[title]").forEach(function(el){
      var t2=el.getAttribute("title");
      if(I18N[t2]) el.setAttribute("title", I18N[t2]);
    });
  }
  window.applyI18n=applyI18n;
  function kickI18n(){ try{ applyI18n(); }catch(e){} }
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(kickI18n, 20); });
  else setTimeout(kickI18n, 20);
  window.addEventListener("load", function(){ setTimeout(kickI18n, 60); });
  setTimeout(kickI18n, 300);

  /* ===== 排行榜：分阶段披露（战中抽屉 / 战后全屏） ===== */
  var LB={sort:"pct", list:[], open:false, at:0, timer:null};
  var LB_TABS=[["pct","正确率"],["score","答对题数"],["speed","用时"]];

  function lbMetric(x, sort){
    if(sort==="score") return (x.correct!==undefined?x.correct:Math.round(x.pct*x.answered/100))+" 题";
    if(sort==="speed") return x.ms>0 ? fmtMs(x.ms) : "—";
    if(sort==="weekxp") return (x.week_xp||0)+" XP";
    if(sort==="streak") return (x.streak||0)+" 天";
    if(sort==="mastery") return (x.mastery||0)+" 个";
    if(sort==="challenges") return (x.challenges||0)+" 次";
    return x.pct+"%";
  }
  /* 本周统计（周一 00:00 起）：供周维度榜单上报 */
  function weekStart(){
    var d=new Date(); d.setHours(0,0,0,0);
    var dow=(d.getDay()+6)%7;           // 周一=0
    d.setDate(d.getDate()-dow);
    return d.getTime();
  }
  function weekStats(){
    var ws=weekStart(), xp=0, mast=0;
    try{
      RX.tx().forEach(function(x){
        if(!x || !x.ts || x.ts<ws || x.type==="spend") return;
        xp += (x.xp||0);
        if(x.type==="mastery" && x.meta && x.meta.stage>=2) mast++;
      });
    }catch(e){}
    var ch=0;
    try{
      var d=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}");
      (d.days||[]).forEach(function(t){ if(t>=ws) ch++; });
    }catch(e){}
    return {weekXp:xp, mastery:mast, challenges:ch, streak:streakDays()};
  }
  function fmtMs(ms){ var s=Math.round(ms/1000); return Math.floor(s/60)+"'"+String(s%60).padStart(2,"0")+'"'; }

  function lbFetch(cb){
    if(!apibase()){ if(cb) cb(); return; }
    var now=Date.now();
    if(now-LB.at < 3500 && LB.list.length){ if(cb) cb(); return; }
    LB.at=now;
    fetch(apibase()+"/board?day="+encodeURIComponent(todayKey())+"&sort="+LB.sort)
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok && d.list){ LB.list=d.list; if(cb) cb(); } })
      .catch(function(){});
  }

  function lbNearRange(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<3) return null;
    return [Math.max(0,idx-2), Math.min(LB.list.length-1, idx+2)];
  }

  function lbRowsHtml(){
    var me=nick()||"我";
    var start = LB.list.length>3 ? 3 : 0;
    var near = lbNearRange();
    return LB.list.slice(start).map(function(x,i){
      if(near && (i+start)>=near[0] && (i+start)<=near[1]) return "";
      var mine = x.name===me;
      return '<div class="lb-row'+(mine?' me':'')+'" data-k="'+hesc(x.name)+'">'+
        '<span class="rk">'+(i+start+1)+'</span>'+
        '<span class="rname">'+hesc(x.name)+(mine?'（我）':'')+
          (x.ms>0?'<span class="lb-time">'+fmtMs(x.ms)+'</span>':'')+'</span>'+
        '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>';
    }).join("") || '<div class="mutedsmall">今天还没有人上榜</div>';

  function lbPodiumHtml(){
    var top=LB.list.slice(0,3), me=nick()||"我";

      var x=top[idx]; if(!x) return '<div></div>';

  function lbSelfHtml(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<0) return '<div class="lb-self"><span class="rk">—</span><span class="rname">你还没上榜，交卷即可参与</span></div>';

  var LB_FREEZE=false, LB_PENDING=0, LB_SCROLL_T=null, LB_PREV=null;

  function lbNeighborsHtml(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    var r=lbNearRange();
    if(!r) return "";
    var a=r[0], b=r[1], out=[];
    for(var k=a;k<=b;k++){

      if(p){ p.textContent="有 "+LB_PENDING+" 条新动态 · 点击刷新榜单"; p.classList.add("on"); }
      return; }
    var before={};
    box.querySelectorAll(".lb-row").forEach(function(el){ before[el.dataset.k]=el.getBoundingClientRect().top; });
    box.innerHTML = lbPodiumHtml() + lbNeighborsHtml() +
      '<div class="lb-list" id="lbList">'+lbRowsHtml()+'</div>' + lbSelfHtml();
    // 新进榜高亮
    var names={}; LB.list.forEach(function(x){ names[x.name]=1; });

        if(!LB_PREV[el.dataset.k]) el.classList.add("fresh");

    box.querySelectorAll(".lb-row").forEach(function(el){
      var old=before[el.dataset.k]; if(old===undefined) return;

      el.style.transform="translateY("+dy+"px)";

  /* ---- 每日挑战任务（对应“挑战”要素） ---- */
  var QKEY="dsh-quest-v1";
  /* 任务池：答题 / 复习 / 理解 / 持续四类；need 表示需要的前置数据（缺了就今天不抽） */
  var QTEMPL=[
    // 答题类
    {id:"q_ans12",   n:"今天做 12 道不同的题",     tip:"数量", type:"count", target:12, r:{coin:40}},
    {id:"q_ans20",   n:"今天做 20 道不同的题",     tip:"数量", type:"count", target:20, r:{coin:60}},
    {id:"q_combo5",  n:"一次连对 5 题",           tip:"连击", type:"combo", target:5,  r:{coin:50}},
    {id:"q_combo8",  n:"一次连对 8 题",           tip:"连击", type:"combo", target:8,  r:{coin:70}},
    {id:"q_hard3",   n:"做对 3 道「较难」题",       tip:"攻坚", type:"hard",  target:3,  r:{dust:1}},

    {id:"q_fix3",    n:"把 3 道错题做对",           tip:"纠错", type:"fixed", target:3, r:{dust:1},  need:"review"},
    {id:"q_spaced1", n:"完成 1 次间隔复习（隔天重做同一题）", tip:"间隔", type:"spaced", target:1, r:{coin:40}, need:"history"},
    // 理解类
    {id:"q_short3",  n:"完成 3 道简答题",           tip:"写作", type:"short", target:3, r:{coin:45}},
    {id:"q_marks70", n:"简答得分率 70%（至少 3 道）", tip:"理解", type:"marksPct", target:70, r:{coin:55}},
    {id:"q_mastery1",n:"把 1 个知识点练到「发展中」以上", tip:"掌握", type:"mastery", target:1, r:{dust:2}},
    // 持续学习类
    {id:"q_daily",   n:"完成今日挑战",             tip:"每日", type:"daily", target:1, r:{dust:2}},
    {id:"q_subj2",   n:"在两个不同科目各做 1 题",    tip:"广度", type:"subjects", target:2, r:{coin:35}}
  ];
  function qseed(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  /* 榜单名字来自别人的设备：渲染前必须转义（属性与文本都要） */
  function hesc(v){
    return String(v==null?"":v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function todayLog(){ var d0=new Date(); d0.setHours(0,0,0,0); return log().filter(function(x){ return x.t>=d0.getTime(); }); }
  function questAvailable(t){
    if(!t.need) return true;
    try{
      if(t.need==="review"){
        var rv=JSON.parse(localStorage.getItem("dsh-review-v1")||"{}");
        return Object.keys(rv||{}).length>0;
      }
      if(t.need==="history"){
        var d0=new Date(); d0.setHours(0,0,0,0);
        return log().some(function(x){ return x.t < d0.getTime(); });
      }
    }catch(e){}
    return true;
  }
  function quests(){
    var Q=null;
    try{ Q=JSON.parse(localStorage.getItem(QKEY)||"null"); }catch(e){}
    if(!Q || Q.date!==todayKey()){
      var prevList=(Q && Q.list) ? Q.list.slice() : [];
      var recentAll=(Q && Q.recent) ? Q.recent.slice(-6) : [];
      var banned={};
      recentAll.forEach(function(id){ banned[id]=1; });
      prevList.forEach(function(id){ banned[id]=1; });   // 昨天的三条今天不重复抽
      var pool=QTEMPL.filter(function(t){ return questAvailable(t) && !banned[t.id]; });
      if(pool.length<3) pool=QTEMPL.filter(function(t){ return questAvailable(t); });
      var rnd=qseed("q:"+todayKey());
      for(var k=pool.length-1;k>0;k--){ var j=Math.floor(rnd()*(k+1)); var tmp=pool[k]; pool[k]=pool[j]; pool[j]=tmp; }
      var picked=[], usedTip={};
      pool.forEach(function(t){ if(picked.length<3 && !usedTip[t.tip]){ usedTip[t.tip]=1; picked.push(t.id); } });
      pool.forEach(function(t){ if(picked.length<3 && picked.indexOf(t.id)<0) picked.push(t.id); });
      Q={date:todayKey(), list:picked.slice(0,3), claimed:[],
         recent: recentAll.concat(prevList).slice(-6)};
      try{ localStorage.setItem(QKEY,JSON.stringify(Q)); }catch(e){}
    }
    return Q;
  }
  function questProgress(){
    /* 只看"不同题目"：同一道题反复点不会推进任务进度 */
    var raw=todayLog().slice().sort(function(a,b){return a.t-b.t;});
    var seen={}, L=[];
    raw.forEach(function(x){ if(x.q && !seen[x.q]){ seen[x.q]=1; L.push(x); } });
    var n=L.length;
    var okCnt=L.filter(function(x){return x.ok;}).length;

    // 错题本 / 历史记录 / 掌握度
    var rev={}; try{ rev=JSON.parse(localStorage.getItem("dsh-review-v1")||"{}"); }catch(e){}
    var allLog=log(), d0=new Date(); d0.setHours(0,0,0,0);
    var firstSeen={};
    allLog.forEach(function(x){
      if(!x.q) return;
      if(!firstSeen[x.q] || x.t<firstSeen[x.q]) firstSeen[x.q]=x.t;
    });
    var inReview={};
    Object.keys(rev||{}).forEach(function(k){ inReview[String(k).split("::")[1]||k]=1; });
    var redo=0, fixed=0, spaced=0;
    L.forEach(function(x){
      if(inReview[x.q]) { redo++; if(x.ok) fixed++; }
      if(firstSeen[x.q] && firstSeen[x.q] < d0.getTime()) spaced++;
    });
    // 简答得分率（今天）
    var sh=L.filter(function(x){ return x.ty==="short"; });
    var mSum=0, mxSum=0;
    sh.forEach(function(x){ mSum += (x.m||0); mxSum += (x.mx||1); });
    var marksPct = sh.length>=3 && mxSum>0 ? Math.round(mSum/mxSum*100) : 0;
    // 今天提升到「发展中」以上的知识点数
    var masteryUp=0;
    try{
      RX.tx().forEach(function(x){
        if(x && x.type==="mastery" && x.meta && x.meta.stage>=2 &&
           new Date(x.ts).toDateString()===new Date().toDateString()) masteryUp++;
      });
    }catch(e){}
    // 今天碰过的科目数
    var subj={}; L.forEach(function(x){ if(x.s) subj[x.s]=1; });
    var subjects=Object.keys(subj).length;
    var maxCombo=0, cur=0;
    L.forEach(function(x){ if(x.ok){ cur++; maxCombo=Math.max(maxCombo,cur);} else cur=0; });
    var hard=L.filter(function(x){ return x.ok && x.d==="hard"; }).length;
    var short=L.filter(function(x){ return x.ty==="short"; }).length;
    var acc = n>=10 ? Math.round(okCnt/n*100) : 0;
    var dailyDone = 0;
    try{ var dr=JSON.parse(localStorage.getItem("dsh-daily-v1")||"{}"); if(dr.date===todayKey()) dailyDone=1; }catch(e){}
    return {count:n, combo:maxCombo, hard:hard, short:short, acc:acc, daily:dailyDone,
            redo:redo, fixed:fixed, spaced:spaced, subjects:subjects,
            marksPct:marksPct, mastery:masteryUp};
  }

  var KEY="dsh-theme";
  function mode(){
    try{var v=localStorage.getItem(KEY); return (v==="light"||v==="dark")?v:"system";}
    catch(e){return "system";}
  }
  function labels(){
    try{ if(window.LANG && LANG()!=="zh") return {light:"Light",dark:"Dark",system:"Auto"}; }catch(e){}
    return {light:"浅色",dark:"深色",system:"自动"};
  }
  var LABEL=labels();
  function paint(box){
    var m=mode();
    if(box.getAttribute("data-theme-ctl")==="cycle"){
      box.innerHTML='<button class="themebtn" data-cycle="1" title="'+(LABEL===labels()&&LABEL.light==="Light"?"Theme":"外观")+'：'+LABEL[m]+
        '（点击切换 浅色 / 深色 / 自动）">外观 <b>'+LABEL[m]+'</b></button>';
    }else{
      box.innerHTML=['light','dark','system'].map(function(k){
        return '<button data-mode="'+k+'" class="'+(k===m?"on":"")+'">'+LABEL[k]+'</button>';
      }).join("");
    }
  }
  function apply(m){
    var r=document.documentElement;
    if(m==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",m);
    r.setAttribute("data-theme-mode",m);
    document.querySelectorAll("[data-theme-ctl]").forEach(paint);
  }
  function set(m){
    try{localStorage.setItem(KEY,m);}catch(e){}
    apply(m);
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest("[data-mode],[data-cycle]") : null;
    if(!b) return;
    if(b.hasAttribute("data-cycle")){
      var order=["system","light","dark"], cur=mode();
      set(order[(order.indexOf(cur)+1)%3]);
    }else{ set(b.getAttribute("data-mode")); }
    ev.preventDefault();
  });
  try{
    var mq=window.matchMedia("(prefers-color-scheme: dark)");
    var onSys=function(){ if(mode()==="system") apply("system"); };
    if(mq.addEventListener) mq.addEventListener("change",onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }catch(e){}
  window.DSH_THEME={set:set,mode:mode};

  /* ── 语言开关（顶栏用；答题页还有自己的悬浮按钮）────── */
  (function(){
    var box=document.querySelector("[data-lang-ctl]");
    if(!box) return;
    function cur(){
      try{ var v=localStorage.getItem("dsh-lang"); if(v) return v; }catch(e){}
      return "en";
    }
    function paint(){
      var m=cur();
      box.innerHTML=['en','zh'].map(function(k){
        return '<button data-lang="'+k+'" class="'+(k===m?"on":"")+'">'+
               (k==="en"?"EN":"中")+'</button>';
      }).join("");
    }
    box.className="themectl";
    box.addEventListener("click", function(ev){
      var b=ev.target.closest&&ev.target.closest("[data-lang]"); if(!b) return;
      try{ localStorage.setItem("dsh-lang", b.getAttribute("data-lang")); }catch(e){}
      var u=location.href.replace(/([?&])lang=(en|zh|both)&?/,"$1").replace(/[?&]$/,"");
      location.replace(u);
    });
    paint();
  })();
  document.querySelectorAll("[data-theme-ctl]").forEach(paint);
})();
</script>
<script>
(function(){
  var G = window.GAME;
  function render(){
    var c=G.coins(), inv=G.inv(), items=G.SHOP;
    document.getElementById("coin").textContent = c.n||0;
    document.getElementById("dust").textContent = c.dust||0;
    var eq = inv.equipped||{};
    var themeName="默认", titleName="无";
    items.forEach(function(x){
      if(x.t==="theme" && x.v===eq.theme) themeName=x.n;
      if(x.t==="title" && x.v===eq.title) titleName=x.v;
    });
    document.getElementById("equipped").innerHTML =
      '<div class="item" style="flex-direction:row;align-items:center;gap:16px">'+
        '<div style="flex:1"><div style="font-size:13px;color:var(--dim)">当前装扮</div>'+
        '<div style="margin-top:2px">主题：<b>'+themeName+'</b> · 称号：<b>'+titleName+'</b></div></div>'+
        '<button class="btn" id="resetTheme">还原默认主题</button>'+
        '<button class="btn" id="resetTitle">卸下称号</button>'+
      '</div>';
    document.getElementById("resetTheme").onclick=function(){ G.equipTheme(""); render(); };
    document.getElementById("resetTitle").onclick=function(){ G.equipTitle(""); render(); };

    var groups=[["主题","theme"],["称号","title"],["实用道具","buff"],["永久升级","perm"],["消耗品","use"],["兑换","exchange"]];
    var html="";
    groups.forEach(function(g){
      var list=items.filter(function(x){ return x.t===g[1]; });
      if(!list.length) return;
      html += '<div class="sec">'+g[0]+'</div><div class="grid">';
      list.forEach(function(x){
        var owned = inv.owned.indexOf(x.id)>=0;
        var equipped = (x.t==="theme" && eq.theme===x.v) || (x.t==="title" && eq.title===x.v);
        var uses = (inv.uses&&inv.uses[x.id])||0;
        var btn = "";
        if(x.t==="exchange"){
          btn = '<button class="btn primary" data-buy="'+x.id+'" '+((c.dust||0)<x.p?'disabled':'')+'>兑换</button>';
        } else if(x.t==="use"){
          btn = '<button class="btn" data-buy="'+x.id+'">购买</button>';
          if(uses) btn += '<span class="own">持有 '+uses+' 张</span>';
        } else if(owned){
          if(x.t==="theme"){
            btn = equipped ? '<button class="btn on" disabled>使用中</button>'
                           : '<button class="btn" data-theme="'+x.v+'">使用</button>';
          } else if(x.t==="title"){
            btn = equipped ? '<button class="btn on" disabled>佩戴中</button>'
                           : '<button class="btn" data-title="'+x.v+'">佩戴</button>';
          } else {
            btn = '<span class="own">已拥有</span>';
          }
        } else {
          var bal = x.cur==="dust" ? (c.dust||0) : (c.n||0);
          btn = '<button class="btn primary" data-buy="'+x.id+'" '+(bal<x.p?'disabled title="'+
            (x.cur==="dust"?"星尘不足，还差 "+(x.p-bal):"金币不足，还差 "+(x.p-bal))+
            '"':'')+'>购买</button>';
        }
        html += '<div class="item"><div class="top"><h3>'+x.n+'</h3></div>'+
                '<div class="d">'+x.d+'</div><div class="foot"><span class="price">'+
                (owned&&x.t!=="use"?"":x.p+(x.cur==="dust"?" 星尘":" 币"))+'</span><span class="spacer" style="flex:1"></span>'+btn+'</div></div>';
      });
      html += '</div>';
    });
    document.getElementById("list").innerHTML = html;
    if(window.applyI18n) setTimeout(applyI18n, 0);

    document.querySelectorAll("[data-buy]").forEach(function(b){
      b.onclick=function(){
        var r=G.buy(b.dataset.buy);
        G.toast((r.ok?"✅ ":"⚠️ ")+r.msg, r.ok); render();
      };
    });
    document.querySelectorAll("[data-theme]").forEach(function(b){
      b.onclick=function(){ G.equipTheme(b.dataset.theme); render(); G.toast("已套用主题", true); };
    });
    document.querySelectorAll("[data-title]").forEach(function(b){
      b.onclick=function(){ G.equipTitle(b.dataset.title); render(); G.toast("已佩戴称号", true); };
    });
  }
  render();
})();
</script>
</body></html>
