<script>/* theme boot: 在首次绘制前定好主题，避免闪烁 */
(function(){try{
  var m=(location.search.match(/[?&]theme=(light|dark|system)/)||[])[1]||null;
  var s=m||localStorage.getItem("dsh-theme")||"system";
  var r=document.documentElement;
  if(s==="light"||s==="dark") r.setAttribute("data-theme",s);
  r.setAttribute("data-theme-mode",s);
}catch(e){}})();</script>

<style>
/* ══ design tokens ═══════════════════════════════════════ */
:root{
  color-scheme: light;
  --background: #FAFAFA;
  --surface: #FFFFFF;
  --surface-secondary: #F5F5F5;
  --surface-inset: #EFEFF1;
  --foreground: #171717;
  --muted: #737373;
  --border: #EAEAEA;
  --border-strong: #D4D4D4;
  --primary: #171717;
  --primary-foreground: #FFFFFF;
  --accent: #0070F3;
  --success: #16803C;
  --success-soft: rgba(22,128,60,.10);
  --error: #DC2626;
  --error-soft: rgba(220,38,38,.09);
  --warning: #B45309;
  --warning-soft: rgba(180,83,9,.10);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 14px rgba(0,0,0,.07);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.10);
  --bg: var(--background);
  --card: var(--surface);
  --card2: var(--surface-secondary);
  --panel: var(--surface);
  --panel2: var(--surface-secondary);
  --fg: var(--foreground);
  --dim: var(--muted);
  --line: var(--border);
  --line2: var(--border-strong);
  --ok: var(--success);
  --bad: var(--error);
  --warn: var(--warning);
  /* 派生色：只覆盖 --accent，其余自动跟着变（商店主题用它）*/
  --accent-text: color-mix(in srgb, var(--accent) 74%, var(--foreground));
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --background: #09090B;
    --surface: #111113;
    --surface-secondary: #18181B;
    --surface-inset: #1F1F23;
    --foreground: #FAFAFA;
    --muted: #A1A1AA;
    --border: #27272A;
    --border-strong: #3F3F46;
    --primary: #FAFAFA;
    --primary-foreground: #171717;
    --accent: #3291FF;
    --success: #4ADE80;
    --success-soft: rgba(74,222,128,.12);
    --error: #F87171;
    --error-soft: rgba(248,113,113,.12);
    --warning: #F59E0B;
    --warning-soft: rgba(245,158,11,.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.55);
    --shadow-md: 0 6px 18px rgba(0,0,0,.5);
    --shadow-lg: 0 18px 44px rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --background: #09090B;
  --surface: #111113;
  --surface-secondary: #18181B;
  --surface-inset: #1F1F23;
  --foreground: #FAFAFA;
  --muted: #A1A1AA;
  --border: #27272A;
  --border-strong: #3F3F46;
  --primary: #FAFAFA;
  --primary-foreground: #171717;
  --accent: #3291FF;
  --success: #4ADE80;
  --success-soft: rgba(74,222,128,.12);
  --error: #F87171;
  --error-soft: rgba(248,113,113,.12);
  --warning: #F59E0B;
  --warning-soft: rgba(245,158,11,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.55);
  --shadow-md: 0 6px 18px rgba(0,0,0,.5);
  --shadow-lg: 0 18px 44px rgba(0,0,0,.62);
}
:root[data-theme="light"]{
  color-scheme: light;
  --background: #FAFAFA;
  --surface: #FFFFFF;
  --surface-secondary: #F5F5F5;
  --surface-inset: #EFEFF1;
  --foreground: #171717;
  --muted: #737373;
  --border: #EAEAEA;
  --border-strong: #D4D4D4;
  --primary: #171717;
  --primary-foreground: #FFFFFF;
  --accent: #0070F3;
  --success: #16803C;
  --success-soft: rgba(22,128,60,.10);
  --error: #DC2626;
  --error-soft: rgba(220,38,38,.09);
  --warning: #B45309;
  --warning-soft: rgba(180,83,9,.10);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 14px rgba(0,0,0,.07);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.10);
}

/* ══ foundations ═════════════════════════════════════════ */
:root{
  /* type */
  --font-sans:"Geist Variable","Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"Geist Mono Variable","Geist Mono",ui-monospace,SFMono-Regular,"SF Mono",
    Menlo,Consolas,monospace;
  --text-2xl:28px; --text-xl:20px; --text-lg:17px; --text-md:15px;
  --text-base:14px; --text-sm:12px; --text-xs:11px;
  --lh-tight:1.25; --lh-snug:1.45; --lh-base:1.6; --lh-prose:1.75;
  /* space (4px scale) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  /* radius */
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-full:999px;
  /* layout */
  --page-max:1120px;
  --read-max:760px;
  --page-x:32px;
  /* motion */
  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:.12s; --norm:.2s;
}

@font-face{
  font-family:"Geist Variable";
  src:url("fonts/geist-latin.woff2") format("woff2-variations"),
      url("fonts/geist-latin.woff2") format("woff2");
  font-weight:400 700; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,
    U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Geist Mono Variable";
  src:url("fonts/geist-mono-latin.woff2") format("woff2-variations"),
      url("fonts/geist-mono-latin.woff2") format("woff2");
  font-weight:400 600; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,
    U+2212,U+2215,U+FEFF,U+FFFD;
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font-sans);
  font-size:var(--text-base);
  line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv11";
  font-synthesis-weight:none;
  transition:background-color var(--norm) var(--ease),color var(--norm) var(--ease);
}
body,body *{-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{letter-spacing:-.015em;line-height:var(--lh-tight);font-weight:600}
h1{font-size:var(--text-2xl)}
h2{font-size:var(--text-xl)}
h3{font-size:var(--text-md)}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
::selection{background:var(--accent-soft);color:var(--foreground)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
hr{border:0;border-top:1px solid var(--border);margin:var(--s6) 0}
code,kbd,samp{font-family:var(--font-mono);font-size:.92em}
kbd{background:var(--surface-secondary);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:var(--r-sm);padding:1px 6px;color:var(--muted);font-size:11px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* 数字统一等宽，避免跳动 */
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ══ 共享顶栏（首页 / 商城 / 错题本）═════════════════════ */
.topbar{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--background) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border)}
.topbar-in{max-width:var(--page-max);margin:0 auto;padding:0 var(--page-x);
  height:56px;display:flex;align-items:center;gap:var(--s4)}
.brand{display:inline-flex;align-items:center;gap:9px;color:var(--foreground);
  text-decoration:none;font-weight:600;font-size:13.5px;letter-spacing:-.01em;flex:0 0 auto}
.brand:hover{text-decoration:none}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);
  color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;
  font-weight:600;font-family:var(--font-mono);line-height:1}
.nav{display:flex;align-items:center;gap:1px;min-width:0;overflow:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:12.5px;color:var(--muted);padding:5px 9px;border-radius:var(--r-sm);
  text-decoration:none;white-space:nowrap;
  transition:color var(--fast) var(--ease),background-color var(--fast) var(--ease)}
.nav a:hover{color:var(--foreground);background:var(--surface-secondary);text-decoration:none}
.nav a.on{color:var(--foreground);font-weight:500}
.grow{flex:1}
@media (max-width:720px){
  .topbar-in{height:auto;flex-wrap:wrap;gap:8px;padding:9px var(--page-x) 0}
  .brand .bname{display:none}
  .topbar .nav{order:10;width:100%;margin:2px calc(-1 * var(--page-x)) 0;
    padding:0 var(--page-x) 8px;border-top:1px solid var(--border)}
  .topbar .themectl{margin-left:auto}
}

/* 分段控件选中态 */
.seg button.on{border-color:var(--foreground)!important}

/* ══ components ══════════════════════════════════════════ */
.btn,.btn-ghost,.btn2{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:13px;font-weight:500;line-height:1;
  height:34px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color var(--fast) var(--ease),border-color var(--fast) var(--ease),
    color var(--fast) var(--ease),opacity var(--fast) var(--ease);
  text-decoration:none;
}
.btn{
  background:var(--primary);color:var(--primary-foreground);
  border-color:var(--primary);
}
.btn:hover{opacity:.88;text-decoration:none}
.btn:active{transform:translateY(.5px)}
.btn:disabled,.btn[disabled]{background:var(--surface-secondary);color:var(--muted);
  border-color:var(--border);opacity:1;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost,.btn.ghost,.btn2{
  background:var(--surface);color:var(--foreground);border-color:var(--border);
}
.btn-ghost:hover,.btn.ghost:hover,.btn2:hover{
  background:var(--surface-secondary);border-color:var(--border-strong);text-decoration:none;
}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed;background:var(--surface)}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--r-sm)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{opacity:.9;color:#fff}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s5);box-shadow:none;
}
.input,input[type="text"],input[type="search"],input[type="number"],textarea,select{
  font-family:inherit;font-size:var(--text-base);color:var(--foreground);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 11px;outline:none;transition:border-color var(--fast) var(--ease),
    box-shadow var(--fast) var(--ease);
}
.input:hover,input:hover,textarea:hover,select:hover{border-color:var(--border-strong)}
.input:focus,input:focus,textarea:focus,select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
::placeholder{color:var(--muted);opacity:.85}

.chip,.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--text-xs);line-height:1.6;font-weight:500;
  padding:2px 8px;border-radius:var(--r-sm);
  background:var(--surface-secondary);border:1px solid var(--border);color:var(--muted);
  white-space:nowrap;
}

/* 主题切换控件 */
.themectl{display:inline-flex;align-items:center;gap:2px;padding:2px;
  background:var(--surface-secondary);border:1px solid var(--border);border-radius:var(--r-sm)}
.themectl button{
  font:inherit;font-size:11.5px;font-weight:500;line-height:1;height:24px;padding:0 9px;
  border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;
  transition:background-color var(--fast) var(--ease),color var(--fast) var(--ease);
}
.themectl button:hover{color:var(--foreground)}
.themectl button.on{background:var(--surface);color:var(--foreground);
  box-shadow:var(--shadow-sm)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);height:28px;padding:0 10px;cursor:pointer;
  transition:color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.themebtn:hover{color:var(--foreground);border-color:var(--border-strong)}
.themebtn b{color:var(--foreground);font-weight:500}

/* 浅色下别让深色主题的重阴影漏过来 */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .submit-card{box-shadow:var(--shadow-lg)}
  :root:not([data-theme="dark"]) .lb-fab{box-shadow:var(--shadow-md)}
  :root:not([data-theme="dark"]) .lang-btn{box-shadow:var(--shadow-sm)}
}
:root[data-theme="light"] .submit-card{box-shadow:var(--shadow-lg)}
:root[data-theme="light"] .lb-fab{box-shadow:var(--shadow-md)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:900px){ :root{--page-x:20px} }
@media (max-width:560px){ :root{--page-x:16px} }

*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;min-height:100vh}
header{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--background) 88%,transparent);
  -webkit-backdrop-filter:saturate(150%) blur(12px);backdrop-filter:saturate(150%) blur(12px);
  border-bottom:1px solid var(--border);padding:9px 0 0}
.bar{max-width:var(--page-max);margin:0 auto;padding:0 var(--page-x);display:flex;
  align-items:center;gap:7px;flex-wrap:wrap;min-height:34px}
.bar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.bar .meta{color:var(--muted);font-size:12px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  background:var(--surface);border-radius:var(--r-sm);padding:3px 8px;font-size:11.5px;
  color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  white-space:nowrap;text-decoration:none}
a.pill:hover{border-color:var(--border-strong);color:var(--foreground);text-decoration:none}
.progress{height:3px;background:var(--surface-secondary);border-radius:99px;overflow:hidden;
  margin:9px 0 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
  transition:width .3s var(--ease)}
main{width:100%;max-width:860px;margin:0 auto;padding:var(--s6) var(--page-x) 96px;flex:1 0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s5)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip.easy{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,var(--border));
  background:var(--success-soft)}
.chip.medium{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,var(--border));
  background:var(--warning-soft)}
.chip.hard{color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,var(--border));
  background:var(--error-soft)}
.stem{font-size:17px;line-height:1.7;margin:4px 0 16px;white-space:pre-wrap;
  color:var(--foreground);letter-spacing:-.005em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--border);color:var(--foreground);
  border-radius:var(--r-sm);padding:12px 14px;font:inherit;font-size:14.5px;line-height:1.6;
  cursor:pointer;transition:border-color var(--fast) var(--ease),
  background-color var(--fast) var(--ease)}
.opt:hover:not(:disabled){border-color:var(--border-strong);background:var(--surface-secondary)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 22px;height:22px;border-radius:4px;background:var(--surface-secondary);
  border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:600;
  color:var(--muted);font-family:var(--font-mono)}
.opt.correct{border-color:var(--success);background:var(--success-soft)}
.opt.correct .k{background:var(--success);color:var(--surface);border-color:var(--success)}
.opt.wrong{border-color:var(--error);background:var(--error-soft)}
.opt.wrong .k{background:var(--error);color:var(--surface);border-color:var(--error)}
textarea{width:100%;min-height:96px;background:var(--surface);color:var(--foreground);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font:inherit;
  font-size:14px;line-height:1.65;resize:vertical}
.exp{margin-top:14px;padding:12px 14px;border-left:2px solid var(--accent);
  background:var(--surface-secondary);border-radius:0 var(--r-sm) var(--r-sm) 0;
  font-size:13.5px;line-height:1.7;display:none}
.exp.show{display:block}
.exp b{color:var(--accent-text)}
.src{margin-top:8px;color:var(--muted);font-size:11.5px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button.btn{height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--primary);
  background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:13px;
  font-weight:500;cursor:pointer;transition:opacity var(--fast) var(--ease)}
button.btn:hover:not(:disabled){opacity:.88}
button.btn.ghost{background:var(--surface);color:var(--foreground);border-color:var(--border)}
button.btn.ghost:hover:not(:disabled){background:var(--surface-secondary);
  border-color:var(--border-strong)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.done h2{margin:0 0 6px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.stat{background:var(--surface-secondary);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.2;font-family:var(--font-mono);
  font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:11.5px}
.wronglist{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.wronglist li{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 16px 30px;line-height:1.7}

.chip.warn{border-color:#f5a62366;color:#f5a623}
.muted{color:var(--dim);font-size:13px}
.pts{display:grid;gap:8px;margin-top:12px}
.pt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px}
.pt.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card2))}
.pt input{margin-top:3px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--ok)}
.pt span{flex:1;min-width:0}
.pt em{color:var(--dim);font-style:normal;font-size:12px;white-space:nowrap}
.mine{margin-top:14px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
.mine div{margin-top:6px;white-space:pre-wrap;color:var(--dim)}
.fullans{margin-top:10px;font-size:14px}
.fullans summary{cursor:pointer;color:var(--accent)}
.fullans div{margin-top:8px;white-space:pre-wrap;color:var(--dim)}
.setup{max-width:760px;margin:0 auto}
.setup-head{margin:4px 0 20px}
.setup-head h2{margin:0 0 6px;font-size:22px}

  var SFX_ON = (function(){ try{ return localStorage.getItem("dsh-sfx")!=="0"; }catch(e){ return true; } })();
  var AC=null;
  function beep(freq, dur, type, vol){
    if(!SFX_ON) return;
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(vol||0.06, AC.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(dur||0.12));
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime+(dur||0.12)+0.02);
    }catch(e){}
  }

  function buy(id){
    var item=null; SHOP.forEach(function(x){ if(x.id===id) item=x; });
    if(!item) return {ok:false,msg:"没有这件商品"};
    var c=readCoins(), inv=readInv();
    if(item.t!=="use" && inv.owned.indexOf(id)>=0) return {ok:false,msg:"已经拥有了"};
    var isDust = item.cur==="dust";
    var bal = isDust ? (c.dust||0) : (c.n||0);
    if(bal < item.p) return {ok:false,msg:(isDust?"星尘":"金币")+"不够，还差 "+(item.p-bal)};
    if(isDust){ c.dust=(c.dust||0)-item.p; } else { c.n=(c.n||0)-item.p; }
    saveCoins(c);
    if(item.t==="use"){ inv.uses[id]=(inv.uses[id]||0)+1; }
    else { inv.owned.push(id); }
    saveInv(inv);
    if(item.t==="theme"){ inv.equipped.theme=item.v; saveInv(inv); applyTheme(); }
    if(item.t==="title"){ inv.equipped.title=item.v; saveInv(inv); }
    if(item.t==="buff"){ var b=readBuffs(); b.xp2Until=Date.now()+30*60000; saveBuffs(b); }
    return {ok:true,msg:"已购买："+item.n};
  }

  function todayCount(){
    var d0=new Date(); d0.setHours(0,0,0,0);
    return log().filter(function(x){ return x.t>=d0.getTime(); }).length;
  }
  function streakDays(){
    var days={}, d0=new Date(); d0.setHours(0,0,0,0), t0=d0.getTime();
    log().forEach(function(x){ var d=new Date(x.t); d.setHours(0,0,0,0); days[d.getTime()]=1; });
    var gaps=shieldCount(), n=0, c=t0, used=0;
    while(true){
      if(days[c]){ n++; c-=864e5; continue; }
      if(c===t0){ c-=864e5; continue; }
      if(used<gaps){ used++; c-=864e5; continue; }
      break;
    }
    return n;
  }

  function checkBadges(){
    var g=db(), L=log();
    if(L.length>=1) unlock('first');
    if((g.best||0)>=5) unlock('combo5');
    if((g.best||0)>=10) unlock('combo10');
    if(todayCount()>=GOAL) unlock('daily');
    if(streakDays()>=3) unlock('streak3');
    if(streakDays()>=7) unlock('streak7');
    try{
      var rv=JSON.parse(localStorage.getItem('dsh-review-v1')||'{}');
      if(L.length>10 && Object.keys(rv).length===0) unlock('review');
    }catch(e){}
    try{
      var cards=document.querySelectorAll('[data-slug][data-total]');
      for(var i=0;i<cards.length;i++){
        var c=cards[i], sl=c.dataset.slug, tot=+c.dataset.total;
        var st=JSON.parse(localStorage.getItem('dsh-quiz-'+sl)||'null');
        if(st && st.answers && tot && Object.keys(st.answers).length>=tot){ unlock('subject'); break; }
      }
    }catch(e){}
  }

  function awardXP(base, ok){
    var g=db();
    if(ok){ g.combo=(g.combo||0)+1; } else { g.combo=0; }
    var mult = ok ? Math.min(2, 1 + 0.1*Math.max(0, (g.combo||1)-1)) : 1;
    var buffs=readBuffs(), dbl = buffs.xp2Until && Date.now()<buffs.xp2Until ? 2 : 1;
    var gain = ok ? Math.round(base*mult*dbl) : Math.max(1, Math.round(base*0.2));
    var before=levelOf(g.xp||0);
    g.xp=(g.xp||0)+gain;
    g.best=Math.max(g.best||0, g.combo||0);
    save(g);
    var coin = Math.max(1, Math.round(gain*0.5));
    var crit = ok && Math.random()<0.12;
    if(crit) coin*=2;
    addCoins(coin);
    if(ok) beep(crit?1180:660, 0.1, "sine", crit?0.08:0.05); else beep(180,0.14,"sawtooth",0.05);
    toast('+'+gain+' XP · +'+coin+' 币'+(crit?' · 暴击':"")+(ok&&g.combo>1?' · 连对 '+g.combo:'')+(dbl>1?' · ×2':''), ok);
    var after=levelOf(g.xp);
    if(after>before){ setTimeout(function(){ toast('🎉 升到 Lv.'+after, true); levelUpSound(); }, 450); }
    checkBadges();
    if(window.__refreshProfile) window.__refreshProfile();
  }

  function applyI18n(){
    if(window.LANG()==="zh") return;
    var walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n, changed=[];
    while((n=walker.nextNode())){
      var s=(n.nodeValue||"").trim(); if(!s) continue;
      if(I18N[s]){ n.nodeValue=n.nodeValue.replace(s, I18N[s]); continue; }
      var nv=n.nodeValue, did=false;
      for(var si=0; si<I18N_SUB.length; si++){
        if(nv.indexOf(I18N_SUB[si][0])>=0){ nv=nv.split(I18N_SUB[si][0]).join(I18N_SUB[si][1]); did=true; }
      }
      if(did){ n.nodeValue=nv; continue; }
      for(var i=0;i<I18N_PAT.length;i++){
        if(I18N_PAT[i][0].test(s)){ n.nodeValue=n.nodeValue.replace(s, s.replace(I18N_PAT[i][0], I18N_PAT[i][1])); break; }
      }
    }
    document.querySelectorAll("[placeholder]").forEach(function(el){
      var p=el.getAttribute("placeholder");
      if(I18N[p]) el.setAttribute("placeholder", I18N[p]);
    });
    document.querySelectorAll("[title]").forEach(function(el){
      var t2=el.getAttribute("title");
      if(I18N[t2]) el.setAttribute("title", I18N[t2]);
    });
  }
  window.applyI18n=applyI18n;

  /* ===== 排行榜：分阶段披露（战中抽屉 / 战后全屏） ===== */
  var LB={sort:"pct", list:[], open:false, at:0, timer:null};
  var LB_TABS=[["pct","正确率"],["score","答对题数"],["speed","用时"]];

  function lbMetric(x, sort){
    if(sort==="score") return (x.correct!==undefined?x.correct:Math.round(x.pct*x.answered/100))+" 题";
    if(sort==="speed") return x.ms>0 ? fmtMs(x.ms) : "—";
    return x.pct+"%";
  }
  function fmtMs(ms){ var s=Math.round(ms/1000); return Math.floor(s/60)+"'"+String(s%60).padStart(2,"0")+'"'; }

  function lbFetch(cb){
    if(!apibase()){ if(cb) cb(); return; }
    var now=Date.now();
    if(now-LB.at < 3500 && LB.list.length){ if(cb) cb(); return; }
    LB.at=now;
    fetch(apibase()+"/board?day="+encodeURIComponent(todayKey())+"&sort="+LB.sort)
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok && d.list){ LB.list=d.list; if(cb) cb(); } })
      .catch(function(){});
  }

  function lbNearRange(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<3) return null;
    return [Math.max(0,idx-2), Math.min(LB.list.length-1, idx+2)];
  }

  function lbRowsHtml(){
    var me=nick()||"我";
    var start = LB.list.length>3 ? 3 : 0;
    var near = lbNearRange();
    return LB.list.slice(start).map(function(x,i){
      if(near && (i+start)>=near[0] && (i+start)<=near[1]) return "";
      var mine = x.name===me;
      return '<div class="lb-row'+(mine?' me':'')+'" data-k="'+x.name+'">'+
        '<span class="rk">'+(i+start+1)+'</span>'+
        '<span class="rname">'+x.name+(mine?'（我）':'')+
          (x.ms>0?'<span class="lb-time">'+fmtMs(x.ms)+'</span>':'')+'</span>'+
        '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>';
    }).join("") || '<div class="mutedsmall">今天还没有人上榜</div>';
  }

  function lbPodiumHtml(){
    var top=LB.list.slice(0,3), me=nick()||"我";
    if(!top.length) return "";
    var order=[1,0,2]; // 2nd, 1st, 3rd
    return '<div class="podium">'+order.map(function(idx){
      var x=top[idx]; if(!x) return '<div></div>';
      var place=idx+1, cls="p"+place;
      return '<div class="pod '+cls+'"><div class="pl">第'+["一","二","三"][idx]+'名</div><div class="av">'+place+'</div>'+
        '<div class="nm">'+x.name+(x.name===me?' ·我':'')+'</div>'+
        '<div class="sc">'+lbMetric(x,LB.sort)+'</div></div>';
    }).join("")+'</div>';
  }

  function lbSelfHtml(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx<0) return '<div class="lb-self"><span class="rk">—</span><span class="rname">你还没上榜，交卷即可参与</span></div>';
    var x=LB.list[idx];
    return '<div class="lb-self"><span class="rk">'+(idx+1)+'</span><span class="rname">'+me+'（我）</span>'+
      '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>';
  }

  var LB_FREEZE=false, LB_PENDING=0, LB_SCROLL_T=null, LB_PREV=null;

  function lbNeighborsHtml(){
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    var r=lbNearRange();
    if(!r) return "";
    var a=r[0], b=r[1], out=[];
    for(var k=a;k<=b;k++){
      var x=LB.list[k], mine=(k===idx);
      out.push('<div class="lb-row'+(mine?' me':'')+'" data-k="'+x.name+'">'+
        '<span class="rk">'+(k+1)+'</span>'+
        '<span class="rname">'+x.name+(mine?'（我）':'')+
          (x.ms>0?'<span class="lb-time">'+fmtMs(x.ms)+'</span>':'')+'</span>'+
        '<span class="rpct">'+lbMetric(x,LB.sort)+'</span></div>');
    }
    return '<div class="lb-near"><div class="near-h">你附近 · 再对一道题就能超过</div>'+out.join("")+'</div>';
  }

  function lbCountAnim(real){
    var el=document.getElementById("lbCount");
    if(el) el.textContent = "已交卷 " + real + " 人";
  }

  function lbRender(){
    var box=document.getElementById("lbBody"); if(!box) return;
    lbCountAnim(LB.list.length);
    if(LB_FREEZE){ LB_PENDING++; var p=document.getElementById("lbRefresh");
      if(p){ p.textContent="有 "+LB_PENDING+" 条新动态 · 点击刷新榜单"; p.classList.add("on"); }
      return; }
    var before={};
    box.querySelectorAll(".lb-row").forEach(function(el){ before[el.dataset.k]=el.getBoundingClientRect().top; });
    box.innerHTML = lbPodiumHtml() + lbNeighborsHtml() +
      '<div class="lb-list" id="lbList">'+lbRowsHtml()+'</div>' + lbSelfHtml();
    // 新进榜高亮
    var names={}; LB.list.forEach(function(x){ names[x.name]=1; });
    if(LB_PREV){
      box.querySelectorAll(".lb-row").forEach(function(el){
        if(!LB_PREV[el.dataset.k]) el.classList.add("fresh");
      });
    }
    LB_PREV=names;
    box.querySelectorAll(".lb-row").forEach(function(el){
      var old=before[el.dataset.k]; if(old===undefined) return;
      var now=el.getBoundingClientRect().top, dy=old-now;
      if(Math.abs(dy)<1) return;
      el.style.transform="translateY("+dy+"px)";
      requestAnimationFrame(function(){ el.style.transition="transform .32s ease"; el.style.transform=""; });
    });
  }

  function lbOpen(){
    var ov=document.getElementById("lbOverlay");
    if(!ov || !apibase()) return;
    ov.classList.add("on"); LB.open=true;
    lbFetch(lbRender);
    if(LB.timer) clearInterval(LB.timer);
    LB.timer=setInterval(function(){ if(LB.open) lbFetch(lbRender); }, 5000);
  }
  function lbClose(){
    var ov=document.getElementById("lbOverlay");
    if(ov) ov.classList.remove("on");
    LB.open=false;
    if(LB.timer){ clearInterval(LB.timer); LB.timer=null; }
  }
  window.__openLB=lbOpen;

  function lbFab(){
    var el=document.getElementById("lbFab");
    if(!el || !apibase()) return;
    var me=nick()||"我", idx=-1;
    LB.list.forEach(function(x,i){ if(x.name===me) idx=i; });
    if(idx>=0) el.innerHTML='第 <b>'+(idx+1)+'</b> 名';
    else if(LB.list.length) el.innerHTML='最高 <b>'+LB.list[0].pct+'%</b>';
    else el.innerHTML='今日榜';
  }

(function(){
  var KEY="dsh-theme";
  function mode(){
    try{var v=localStorage.getItem(KEY); return (v==="light"||v==="dark")?v:"system";}
    catch(e){return "system";}
  }
  var LABEL={light:"浅色",dark:"深色",system:"自动"};
  function paint(box){
    var m=mode();
    if(box.getAttribute("data-theme-ctl")==="cycle"){
      box.innerHTML='<button class="themebtn" data-cycle="1" title="外观：'+LABEL[m]+
        '（点击切换 浅色 / 深色 / 自动）">外观 <b>'+LABEL[m]+'</b></button>';
    }else{
      box.innerHTML=['light','dark','system'].map(function(k){
        return '<button data-mode="'+k+'" class="'+(k===m?"on":"")+'">'+LABEL[k]+'</button>';
      }).join("");
    }
  }
  function apply(m){
    var r=document.documentElement;
    if(m==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",m);
    r.setAttribute("data-theme-mode",m);
    document.querySelectorAll("[data-theme-ctl]").forEach(paint);
  }
  function set(m){
    try{localStorage.setItem(KEY,m);}catch(e){}
    apply(m);
  }
  document.addEventListener("click",function(ev){
    var b=ev.target.closest ? ev.target.closest("[data-mode],[data-cycle]") : null;
    if(!b) return;
    if(b.hasAttribute("data-cycle")){
      var order=["system","light","dark"], cur=mode();
      set(order[(order.indexOf(cur)+1)%3]);
    }else{ set(b.getAttribute("data-mode")); }
    ev.preventDefault();
  });
  try{
    var mq=window.matchMedia("(prefers-color-scheme: dark)");
    var onSys=function(){ if(mode()==="system") apply("system"); };
    if(mq.addEventListener) mq.addEventListener("change",onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }catch(e){}
  window.DSH_THEME={set:set,mode:mode};
  document.querySelectorAll("[data-theme-ctl]").forEach(paint);
})();
</script>

ting alone by choice", "Collective security — allies respond together"], "answer": 2, "explanation": "unilateralism 是一种「偏好／习惯」：明知盟友反对仍倾向自行行动。collective security 强调集体回应侵略，multilateralism 强调多国协调，都与题干相反。", "source": "Term 4 · Yearly Assessment Notification — Section One（Unilateralism）", "weak": false}, {"id": "his-004", "topic": "年考术语 · 集体安全", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines collective security?", "options": ["A single state decides when and where military force will be used", "Each state builds enough weapons to deter rivals without any allies", "A powerful state intervenes inside another to stop human rights abuses", "States agree that an attack on one member is an attack on all"], "answer": 3, "explanation": "集体安全的核心是「一国受攻＝全体受攻」，成员共同回应（通常经联合国）。「Each state builds enough weapons to deter rivals without any allies」 是自行威慑，「A powerful state intervenes inside another to stop human rights abuses」 是人道干预，「A single state decides when and where military force will be used」 是单边决策。", "source": "Term 4 · Yearly Assessment Notification — Section One（Collective Security）", "weak": false}, {"id": "his-005", "topic": "年考术语 · 集体安全 vs 人道干预", "difficulty": "medium", "type": "mcq", "stem": "Which action is the clearest example of collective security rather than humanitarian intervention?", "options": ["A UN-authorised coalition repelling Iraq's 1990 invasion of Kuwait", "US troops landing in Somalia in 1992 to protect food convoys", "US-led forces invading Iraq in 2003 without any explicit UN approval", "NATO aircraft bombing Serbia in 1999 to stop ethnic cleansing"], "answer": 0, "explanation": "海湾战争回应的是「跨国侵略」这一对成员国的攻击，属集体安全的典型。其余三个的动因都是保护平民或推翻政权，属人道干预或先发制人，不是集体安全。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Gulf War 1991）", "weak": false}, {"id": "his-006", "topic": "年考术语 · 先发制人", "difficulty": "easy", "type": "mcq", "stem": "In the Bush Doctrine, pre-emption means:", "options": ["Intervening to stop a government killing its own citizens", "Striking first at a state or group judged to pose a future threat", "Waiting for an attack, then responding with UN approval", "Working through alliances so no single state decides on war"], "answer": 1, "explanation": "先发制人把动武时点前移到「威胁可能成真」之前，不等待实际攻击发生。这正是 Bush Doctrine 与集体安全、人道干预的关键区别。", "source": "Term 4 · Yearly Assessment Notification — Section One（Pre-emption）", "weak": false}, {"id": "his-007", "topic": "年考术语 · 先发制人 vs 人道干预", "difficulty": "medium", "type": "mcq", "stem": "Which feature most clearly separates pre-emption from humanitarian intervention?", "options": ["Pre-emption targets only non-state groups; intervention only states", "Pre-emption is always multilateral; intervention is always unilateral in form", "Pre-emption answers a future threat; intervention answers harm under way", "Pre-emption always needs UN authorisation; intervention never does"], "answer": 2, "explanation": "区分点在「威胁的时间性」：先发制人针对尚未发生的威胁，人道干预针对正在发生的大规模伤害。授权方式、参与国数量、目标类型都不是二者的分界。", "source": "Term 4 · Yearly Assessment Notification — Section One（Pre-emption / Humanitarian Intervention）", "weak": false}, {"id": "his-008", "topic": "年考术语 · 人道干预", "difficulty": "easy", "type": "mcq", "stem": "Which statement best defines humanitarian intervention?", "options": ["Defensive action taken after a direct attack on one's own soil", "Military action to seize disputed territory and its natural resources", "Economic sanctions agreed by a regional trade or security organisation", "Military action inside a state, without consent, to stop mass suffering"], "answer": 3, "explanation": "人道干预的三个要件：进入他国、未经该国同意、目的是制止大规模人道灾难。「Economic sanctions agreed by a regional trade or security organisation」 是制裁而非军事干预，「Defensive action taken after a direct attack on one's own soil」 是自卫。", "source": "Term 4 · Yearly Assessment Notification — Section One（Humanitarian Intervention）", "weak": false}, {"id": "his-009", "topic": "年考术语 · 单边与多边辨析", "difficulty": "medium", "type": "mcq", "stem": "In 2003 State A went to war with a small group of allies after failing to win UN Security Council support, while State B sent troops to a UN-authorised mission. Which pairing is correct?", "options": ["A — unilateral action; B — multilateral action", "A — multilateral action; B — unilateral action", "A — collective security; B — humanitarian intervention", "A — humanitarian intervention; B — collective security"], "answer": 0, "explanation": "判准是「是否有广泛授权」：A 只带少数盟友、绕过安理会，属单边；B 参与联合国授权任务，属多边。注意 A 虽有盟友，但「小圈子＋无授权」仍被归为单边行动。", "source": "Term 4 · Yearly Assessment Notification — Body 2（invasion of Iraq）", "weak": false}, {"id": "his-010", "topic": "年考术语 · unilateral 与 unilateralism", "difficulty": "medium", "type": "mcq", "stem": "Why does the course list both 'unilateral' and 'unilateralism' as separate terms?", "options": ["'Unilateralism' describes one action; 'unilateral' a whole doctrine", "'Unilateral' is one action taken alone; 'unilateralism' is the doctrine", "They are synonyms, listed twice for emphasis in the notes", "'Unilateral' describes economic policy; 'unilateralism' military policy"], "answer": 1, "explanation": "unilateral 是形容词，描述「单方采取的一次行动」；unilateralism 是名词，指「倾向单方行动的主义／政策取向」。Section One 考 metalanguage，正是要辨清词性与层级。", "source": "Term 4 · Yearly Assessment Notification — Section One（Unilateral / Unilateralism）", "weak": false}, {"id": "his-011", "topic": "年考论证 · Body 1 选材", "difficulty": "easy", "type": "short", "stem": "Body 1 of the essay covers the 1990s. Name the two events from the notification's list that you would use, and justify your choice in one sentence. (2 marks)", "options": [], "answer": "The Gulf War (1991) and Somalia (1992–94). Together they show the two ends of the decade: a UN-authorised, broadly multilateral success, and a humanitarian mission whose failure produced a rapid US withdrawal and shaped later reluctance to intervene.", "explanation": "Body 1 只需两个事件，但要形成「对照」而非并列：一个成功多边、一个暴露局限。选 Gulf War＋Somalia、或 Gulf War＋Kosovo 都可，关键是说明为何这两个能支撑主题句。", "source": "Term 4 · Yearly Assessment Notification — Body 1（possible events）", "marks": 2, "criteria": [{"id": "c1", "t": "Names two relevant 1990s events from the notification's list (e.g. the Gulf War 1991 with Somalia 1992-94, or the Gulf War with Kosovo 1999)", "m": 1}, {"id": "c2", "t": "Justifies the choice in one sentence by saying what the pair shows (a broadly multilateral UN-authorised success against a mission that exposed the limits of intervention)", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Names two relevant 1990s events from the notification's list (e.g. the Gulf War 1991 with Somalia 1992-94, or the Gulf War with Kosovo 1999)", "m": 1}, {"id": "c2", "t": "Justifies the choice in one sentence by saying what the pair shows (a broadly multilateral UN-authorised success against a mission that exposed the limits of intervention)", "m": 1}], "weak": false}, {"id": "his-012", "topic": "年考论证 · 海湾战争与多边主义", "difficulty": "easy", "type": "short", "stem": "Explain how the Gulf War of 1991 demonstrates multilateralism. (2 marks)", "options": [], "answer": "The United States led a broad coalition of states acting with United Nations Security Council authorisation to reverse Iraq's invasion of Kuwait, so the response was collectively authorised and its costs and risks were shared rather than carried by one state.", "explanation": "多边主义的两个标志：联合国授权＋多国共同承担。答题要写出「谁授权、多少方参与、为何这算多边」，只写「很多国家参加」不够。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Gulf War 1991）", "marks": 2, "criteria": [{"id": "c1", "t": "States that the United States led a broad coalition of states acting with United Nations Security Council authorisation against Iraq's invasion of Kuwait", "m": 1}, {"id": "c2", "t": "Explains that the response was therefore collectively authorised, with costs and risks shared rather than carried by one state", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "States that the United States led a broad coalition of states acting with United Nations Security Council authorisation against Iraq's invasion of Kuwait", "m": 1}, {"id": "c2", "t": "Explains that the response was therefore collectively authorised, with costs and risks shared rather than carried by one state", "m": 1}], "weak": false}, {"id": "his-013", "topic": "年考论证 · 海湾战争为何属集体安全", "difficulty": "medium", "type": "short", "stem": "Explain why the Gulf War of 1991 is better described as collective security than as humanitarian intervention. (3 marks)", "options": [], "answer": "The war responded to a cross-border act of aggression — Iraq's invasion and annexation of Kuwait — and was authorised collectively against that aggression. Its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government, which is the trigger that defines humanitarian intervention.", "explanation": "关键分界是「触发原因」：集体安全回应国家对国家的侵略，人道干预回应政府对自己人民的伤害。海湾战争是前者，1990 年代后期科索沃才是后者的争议案例。", "source": "Term 4 · Yearly Assessment Notification — Section One + Body 1", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that the war responded to a cross-border act of aggression (Iraq's invasion and annexation of Kuwait) and was authorised collectively against that aggression", "m": 1}, {"id": "c2", "t": "Explains that its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government", "m": 1}, {"id": "c3", "t": "Contrasts this with the trigger that defines humanitarian intervention (a government harming its own people), which is why the war belongs to collective security", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that the war responded to a cross-border act of aggression (Iraq's invasion and annexation of Kuwait) and was authorised collectively against that aggression", "m": 1}, {"id": "c2", "t": "Explains that its purpose was to restore Kuwait's sovereignty and the regional order, not to protect civilians from their own government", "m": 1}, {"id": "c3", "t": "Contrasts this with the trigger that defines humanitarian intervention (a government harming its own people), which is why the war belongs to collective security", "m": 1}], "weak": false}, {"id": "his-014", "topic": "年考论证 · 索马里与人道干预的局限", "difficulty": "medium", "type": "short", "stem": "What did the US experience in Somalia (1992–94) reveal about the limits of humanitarian intervention? (3 marks)", "options": [], "answer": "A humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias, and the deaths of US soldiers in 1993 led to a rapid withdrawal. It showed that without clear objectives and local consent, casualties can end an intervention before it stabilises the country.", "explanation": "索马里常被用作「干预容易、收尾困难」的反面教材：任务目标从送粮扩到战斗、伤亡引发国内压力、最后撤军。写清这条因果链才能拿满分。", "source": "Term 4 · Yearly Assessment Notification — Body 1（Somalia 1992-94）＋ 课程标准补充", "marks": 3, "criteria": [{"id": "c1", "t": "Explains that a humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias", "m": 1}, {"id": "c2", "t": "Explains that the deaths of US soldiers in 1993 led to a rapid withdrawal", "m": 1}, {"id": "c3", "t": "Explains the lesson drawn: without clear objectives and local consent, casualties can end an intervention before it stabilises the country", "m": 1}], "auto_grade": true, "points": [{"id": "c1", "t": "Explains that a humanitarian mission to protect food relief expanded into peace enforcement and fighting with local militias", "m": 1}, {"id": "c2", "t": "Explains that the deaths of US soldiers in 1993 led to a rapid withdrawal", "m": 1}, {"id": "c3", "t": "Explains the lesson drawn: without clear objectives and local consent, casualties can end an intervention before it stabilises the country", "m": 1}], "weak": true}, {"id": "his-015", "topic": "年考论证 · 卢旺达 1994 的干预失败", "difficulty": "medium", "type": "short", "stem": "Why is Rwanda (1994) usually described a /* ===== 简答自动预判：关键词覆盖率（离线，无需后端） ===== */
const AUTO_STOP = ("the a an of and or to in on for with that this these those is are was were be been being " +
  "as at by from it its their they them we you your our not no but if then than so such can could may might " +
  "will would should must have has had do does did which who whom what when where why how all any more most " +
  "other some only own same very just also into over under about after before between through during").split(" ");
const AUTO_STOP_SET = {};
AUTO_STOP.forEach(function(w){ AUTO_STOP_SET[w] = 1; });
function autoStem(w){
  return String(w||"").toLowerCase()
    .replace(/'s$/,"").replace(/ies$/,"y").replace(/ing$/,"").replace(/ed$/,"")
    .replace(/es$/,"").replace(/s$/,"");
}
function autoKeywords(text){
  var raw = String(text||"").toLowerCase().split(/[^a-z'-]+/);
  var out = [];
  raw.forEach(function(w){
    if(w.length < 4) return;
    if(AUTO_STOP_SET[w]) return;
    var st = autoStem(w);
    if(st.length < 3) return;
    if(out.indexOf(st) < 0) out.push(st);
  });
  return out;
}
function autoScore(pointText, answerText){
  var kw = autoKeywords(pointText);
  if(!kw.length) return {hit:false, ratio:0, matched:0, total:0, missing:[]};
  var mine = {};
  String(answerText||"").toLowerCase().split(/[^a-z'-]+/).forEach(function(w){ mine[autoStem(w)] = 1; });
  var matched = 0, missing = [];
  kw.forEach(function(k){ if(mine[k]) matched++; else missing.push(k); });
  var ratio = matched / kw.length;
  return {hit: ratio >= 0.5, ratio: ratio, matched: matched, total: kw.length, missing: missing.slice(0,4)};
}
function buildOrder(){
  var f = TFILTER();
  return DATA.questions.map(function(q,i){ return {q:q,i:i}; })
    .filter(function(x){ return f==="all" || x.q.type===f; })
    .map(function(x){ return x.i; });
}
